@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return id+" sides="+sides+" n_flds="+n_flds+
" lp="+lp+" fld="+fld;;
stop
end
start
note right
ST_field_tcastTo(Classdest)
end note
if (dest==ST_field_t.class ) then (yes) 
:return this;;
stop
endif 
:return (ST_field_t)super .castTo(dest);;
stop
end
start
note right
void ___(__struct__other)
end note
end
@enduml

