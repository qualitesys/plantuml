@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:try {return NAME+" rank="+ND_rank(this)+
" order="+ND_order(this);}catch (Exceptione){return NAME;};
end
start
note right
void ___(__struct__arg)
end note
:throw new UnsupportedOperationException();;
stop
end
start
note right
booleanisSameThan(__ptr__other)
end note
:return this==other2;;
stop
end
@enduml

