@startuml
!pragma layout smetana
start
note right
ST_pointfpointfof(doublex,doubley)
end note
:return result;;
stop
end
start
note right
ST_pointfadd_pointf(final ST_pointfp,final ST_pointfq)
end note
:return result;;
stop
end
start
note right
booleanisSameThan(__ptr__other)
end note
:return this==(ST_pointf)other;;
stop
end
start
note right
StringtoString()
end note
:return "["+x+","+y+"]";;
stop
end
start
note right
ST_pointfcopy()
end note
:return result;;
stop
end
start
note right
void ___(__struct__other)
end note
end
@enduml

