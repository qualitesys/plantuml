ff1b6a3c72bcf85f]
@startuml
!pragma layout smetana
start
note right
ST_pointfpointfof(doublex,doubley)
end note
:result.x=x;;
:result.y=y;;
:return result;;
stop
end
start
note right
ST_pointfadd_pointf(final ST_pointfp,final ST_pointfq)
end note
:result.x=p.x+q.x;;
:result.y=p.y+q.y;;
:return result;;
stop
end
start
note right
booleanisSameThan(__ptr__other)
end note
:return this==(ST_pointf)other;;
stop
end
start
note right
StringtoString()
end note
:return "["+x+","+y+"]";;
stop
end
start
note right
ST_pointfcopy()
end note
:result.x=this.x;;
:result.y=this.y;;
:return result;;
stop
end
start
note right
void ___(__struct__other)
end note
:this.x=other2.x;;
:this.y=other2.y;;
end
@enduml

