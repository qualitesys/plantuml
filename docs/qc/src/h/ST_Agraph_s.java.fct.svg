@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return super .toString()+" "+NAME;;
stop
end
start
note right
constructor ST_Agraph_s()
end note
end
start
note right
ObjectgetTheField(OFFSEToffset)
end note
if (offset==null ||offset.getSign()==0) then (yes) 
:return this;;
stop
endif 
if (offset.getField().equals("link")) then (yes) 
:return link;;
stop
endif 
:throw new UnsupportedOperationException();;
end
start
note right
void ___(__struct__arg)
end note
:throw new UnsupportedOperationException();;
end
start
note right
booleanisSameThan(__ptr__other)
end note
:return this==other2;;
stop
end
@enduml

