@startuml
!pragma layout smetana
start
note right
EN_pack_modeparsePackModeInfo(CStringp,EN_pack_modedflt,
ST_pack_infopinfo)
end note
if (p!=null &&p.charAt(0)!='\0') then (yes) 
endif 
:return pinfo.mode;;
stop
end
start
note right
EN_pack_modegetPackModeInfo(ST_Agraph_sg,
EN_pack_modedflt,ST_pack_infopinfo)
end note
:return parsePackModeInfo(agget(g,new CString("packmode")),
dflt,pinfo);;
stop
end
start
note right
intgetPack(ST_Agraph_sg,intnot_def,intdflt)
end note
if ((p=agget(g,new CString("pack")))!=null ) then (yes) 
endif 
:return v;;
stop
end
start
note right
EN_pack_modegetPackInfo(ST_Agraph_sg,EN_pack_modedflt,
intdfltMargin,ST_pack_infopinfo)
end note
:return pinfo.mode;;
stop
end
@enduml

