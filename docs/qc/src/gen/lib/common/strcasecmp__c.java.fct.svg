@startuml
!pragma layout smetana
start
note right
intstrcasecmp(CStrings1,CStrings2)
end note
while ((s1.charAt(0)!='\0')&&(tolower(s1.charAt(0))==tolower(s2.charAt(0))))
endwhile
:return tolower(s1.charAt(0))-tolower(s2.charAt(0));;
stop
end
@enduml

