@startuml
!pragma layout smetana
start
note right
ST_Agobj_ssubgraph_search(ST_Agraph_ssub,
ST_Agobj_sg)
end note
:ENTERING("95y4aknoddh42lieikrb72vxw","subgraph_search");;
:try ;
:return (ST_Agobj_s)sub.base;;
stop
end
start
note right
void rec_apply(ST_Agraph_sg,ST_Agobj_sobj,
CFunctionfn,__ptr__arg,CFunctionobjsearch,
booleanpreorder)
end note
:ENTERING("8s9l15wqucf1glmbeb6fmya8e","rec_apply");;
:try ;
:ST_Agraph_ssub;;
:ST_Agobj_ssubobj;;
if (preorder) then (yes) 
:fn.exe(g,obj,arg);;
endif 
if ((subobj=(ST_Agobj_s)objsearch.exe(sub,
obj))!=null ) then (yes) 
:rec_apply(sub,subobj,fn,arg,objsearch,preorder);;
endif 
if (N(preorder)) then (yes) 
:fn.exe(g,obj,arg);;
endif 
end
start
note right
intagapply(ST_Agraph_sg,ST_Agobj_sobj,CFunctionfn,
__ptr__arg,booleanpreorder)
end note
:ENTERING("9hqql178zpl8iudlf6sgnv7aj","agapply");;
:try ;
:ST_Agobj_ssubobj;;
:CFunctionobjsearch=null ;;
switch (switch (AGTYPE(obj)))
endswith
if ((subobj=(ST_Agobj_s)objsearch.exe(g,obj))!=null ) then (yes) 
:rec_apply(g,subobj,fn,arg,objsearch,preorder);;
:return 0;;
stop
else (no)
:UNSUPPORTED("8d9xfgejx5vgd6shva5wk5k06");;
endif 
