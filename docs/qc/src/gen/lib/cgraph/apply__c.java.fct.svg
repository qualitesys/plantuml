obj))!=null ) then (yes) 
endif 
if (N(preorder)) then (yes) 
endif 
end
start
note right
intagapply(ST_Agraph_sg,ST_Agobj_sobj,CFunctionfn,
__ptr__arg,booleanpreorder)
end note
