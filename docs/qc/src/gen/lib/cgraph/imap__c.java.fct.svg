@startuml
!pragma layout smetana
start
note right
intaginternalmaplookup(ST_Agraph_sg,intobjtype,
CStringstr,int[]result)
end note
:throw new UnsupportedOperationException();;
end
start
note right
Objectaginternalmapinsert(Object... arg_)
end note
:throw new UnsupportedOperationException();;
end
start
note right
ST_IMapEntry_tfind_isym(ST_Agraph_sg,intobjtype,
intid)
end note
if (objtype==AGINEDGE) then (yes) 
endif 
if ((d=g.clos.lookup_by_id[objtype])!=null ) then (yes) 
else (no)
endif 
:return isym;;
stop
end
start
note right
CStringaginternalmapprint(ST_Agraph_sg,intobjtype,
intid)
end note
if ((isym=find_isym(g,objtype,id))!=null ) then (yes) 
:return isym.str;;
stop
endif 
:return null ;;
stop
end
@enduml

