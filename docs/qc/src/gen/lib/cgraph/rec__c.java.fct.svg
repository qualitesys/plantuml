@startuml
!pragma layout smetana
start
note right
void set_data(ST_Agobj_sobj,ST_Agrec_sdata,
intmtflock)
end note
:ENTERING("62z9z5vraa2as0c9t108j9xaf","set_data");;
:try ;
:ST_Agedge_se;;
:obj.data=data;;
:(obj.tag).mtflock=mtflock;;
if ((AGTYPE(obj)==AGINEDGE)||(AGTYPE(obj)==AGOUTEDGE)) then (yes) 
:e=(ST_Agedge_s)agopp(obj);;
:AGDATA(e,data);;
:(e.base.tag).mtflock=mtflock;;
endif 
end
start
note right
ST_Agrec_saggetrec(__ptr__obj,CStringname,
booleanmtf)
end note
:ENTERING("7p2ne3oknmyclvsw4lh3axtd8","aggetrec");;
:try ;
:ST_Agobj_shdr;;
:ST_Agrec_sd,first;;
:hdr=(ST_Agobj_s)obj;;
:first=d=(ST_Agrec_s)hdr.data;;
while (d!=null )
if (N(strcmp(name,d.name))) then (yes) 
:break ;;
endif 
:d=(ST_Agrec_s)d.next;;
if (EQ(d,first)) then (yes) 
:d=null ;;
:break ;;
endif 
endwhile
if (d!=null ) then (yes) 
if (((ST_Agtag_s)hdr.tag).mtflock!=0) then (yes) 
if (mtf&&NEQ(hdr.data,d)) then (yes) 
:System.err.println("move to front lock inconsistency");;
endif 
else (no)
if (NEQ(d,first)||(mtf!=((((ST_Agtag_s)hdr.tag).mtflock)!=0))) then (yes) 
:set_data(hdr,d,ASINT(mtf));;
endif 
endif 
endif 
:return d;;
stop
end
start
note right
void objputrec(ST_Agraph_sg,ST_Agobj_sobj,
ST_Agrec_sarg)
end note
:ENTERING("7sk4k5ipm2jnd244556g1kr6","objputrec");;
:try ;
:ST_Agrec_sfirstrec,newrec;;
:newrec=arg;;
:firstrec=obj.data;;
if (firstrec==null ) then (yes) 
:newrec.next=newrec;;
else (no)
if (EQ(firstrec.next,firstrec)) then (yes) 
:firstrec.next=newrec;;
:newrec.next=firstrec;;
else (no)
:newrec.next=firstrec.next;;
:firstrec.next=newrec;;
endif 
endif 
if (NOT(((ST_Agtag_s)obj.tag).mtflock)) then (yes) 
:set_data(obj,newrec,(0));;
endif 
end
start
note right
__ptr__agbindrec(__ptr__arg_obj,CStringrecname,
size_trecsize,booleanmtf)
end note
:ENTERING("dmh5i83l15mnn1pnu6f5dfv8l","agbindrec");;
:try ;
:ST_Agraph_sg;;
:ST_Agobj_sobj;;
:ST_Agrec_srec;;
:obj=(ST_Agobj_s)arg_obj;;
:g=agraphof(obj);;
:rec=aggetrec(obj,recname,false);;
if ((rec==null &&recsize.isStrictPositive())) then (yes) 
:rec=(ST_Agrec_s)((__ptr__)recsize.malloc());;
:rec.name=agstrdup(g,recname);;
switch (switch (((ST_Agtag_s)obj.tag).objtype))
endswith
endif 
if (mtf) then (yes) 
:aggetrec(arg_obj,recname,(N(0)));;
endif 
:return rec;;
stop
end
