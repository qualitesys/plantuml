@startuml
!pragma layout smetana
start
note right
intdtrestore(ST_dt_sdt,ST_dtlink_slist)
end note
if (N(list)) then (yes) 
if (N(type)) then (yes) 
:return -1;;
stop
endif 
else (no)
if (dt.data.size!=0) then (yes) 
:return -1;;
stop
endif 
endif 
if ((dt.data.type&(DT_SET|DT_BAG))!=0) then (yes) 
else (no)
if ((dt.data.type&(DT_OSET|DT_OBAG))!=0) then (yes) 
else (no)
endif 
if (N(type)) then (yes) 
endif 
endif 
:return 0;;
stop
end
@enduml

