@startuml
!pragma layout smetana
start
note right
ST_dtlink_sdtextract(ST_dt_sdt)
end note
if ((dt.data.type&(DT_OSET|DT_OBAG))!=0) then (yes) 
else (no)
endif 
:return list;;
stop
end
@enduml

