@startuml
!pragma layout smetana
start
note right
void SplitNode(ST_RTreertp,ST_Node_t___n,
ST_Branch_tb,ST_Node_t___[]nn)
end note
:ENTERING("6vl3snxd6k95gamfkwfsfdguc","SplitNode");
if (rtp.StatFlag!=0) then (yes) 
:UNSUPPORTED("akhni40ndam0u9c6i7raxw4mp");
:UNSUPPORTED("4g80zdlbvunm838x8g3ic9tex");
:UNSUPPORTED("9352ql3e58qs4fzapgjfrms2s");
:UNSUPPORTED("2cjo6wz1rmxfm5k7u7rw5dqpj");
endif 
:level=n.level;
:GetBranches(rtp,n,b);
:p=rtp.split.Partitions[0];
:MethodZero(rtp);
:area=RectArea((ST_Rect_t)p.cover[0])+RectArea((ST_Rect_t)p.cover[1]);
if (rtp.StatFlag!=0&&N(rtp.Deleting)&&area!=0) then (yes) 
:UNSUPPORTED("z7xk6s3hzi3qcoiq2exj9hpv");
endif 
:nn[0]=RTreeNewNode(rtp);
:n.level=level;
:nn[0].level=level;
:LoadNodes(rtp,n,nn[0],p);
:LEAVING("6vl3snxd6k95gamfkwfsfdguc","SplitNode");
end
start
note right
void GetBranches(ST_RTreertp,ST_Node_t___n,
ST_Branch_tb)
end note
:ENTERING("al7lyin008m7kvrvuxhcuvn61","GetBranches");
:i=0;
:i++;
:rtp.split.BranchBuf[i].___(n.branch[i]);
:rtp.split.BranchBuf[64].___(b);
:rtp.split.CoverSplit.___(rtp.split.BranchBuf[0].rect);
:i=1;
:i++;
:rtp.split.CoverSplit.___(CombineRect((ST_Rect_t)rtp.split.CoverSplit,
(ST_Rect_t)rtp.split.BranchBuf[i].rect));
:rtp.split.CoverSplitArea=RectArea((ST_Rect_t)rtp.split.CoverSplit);
:InitNode(n);
:LEAVING("al7lyin008m7kvrvuxhcuvn61","GetBranches");
end
