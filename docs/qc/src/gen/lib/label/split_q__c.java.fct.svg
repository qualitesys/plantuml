@startuml
!pragma layout smetana
start
note right
void SplitNode(ST_RTree rtp,ST_Node_t___ n,
ST_Branch_t b,ST_Node_t___[] nn)
end note
:ENTERING("6vl3snxd6k95gamfkwfsfdguc","SplitNode");;
switch (try/catch block)
case (try)
:ST_PartitionVars p;;
:int level;;
:int area;;
if (rtp.StatFlag!=0) then (yes) 
:UNSUPPORTED("akhni40ndam0u9c6i7raxw4mp");;
:UNSUPPORTED("4g80zdlbvunm838x8g3ic9tex");;
:UNSUPPORTED("9352ql3e58qs4fzapgjfrms2s");;
:UNSUPPORTED("2cjo6wz1rmxfm5k7u7rw5dqpj");;
endif 
:level=n.level;;
:GetBranches(rtp,n,b);;
:p=rtp.split.Partitions[0];;
:MethodZero(rtp);;
:area=RectArea((ST_Rect_t )p.cover[0])+RectArea((ST_Rect_t )p.cover[1]);;
if (rtp.StatFlag!=0&&N(rtp.Deleting)&&area!=0) then (yes) 
:UNSUPPORTED("z7xk6s3hzi3qcoiq2exj9hpv");;
endif 
:nn[0]=RTreeNewNode(rtp);;
:n.level=level;;
:nn[0].level=level;;
:LoadNodes(rtp,n,nn[0],p);;
endswitch
end
start
note right
void GetBranches(ST_RTree rtp,ST_Node_t___ n,
ST_Branch_t b)
end note
:ENTERING("al7lyin008m7kvrvuxhcuvn61","GetBranches");;
switch (try/catch block)
case (try)
:int i;;
:rtp.split.BranchBuf[i].___(n.branch[i]);;
:rtp.split.BranchBuf[64].___(b);;
:rtp.split.CoverSplit.___(rtp.split.BranchBuf[0].rect);;
:rtp.split.CoverSplit.___(CombineRect((ST_Rect_t )rtp.split.CoverSplit,
(ST_Rect_t )rtp.split.BranchBuf[i].rect));;
:rtp.split.CoverSplitArea=RectArea((ST_Rect_t )rtp.split.CoverSplit);;
:InitNode(n);;
endswitch
end
start
note right
void MethodZero(ST_RTree rtp)
end note
:ENTERING("4woz5xy4gjlahoj7no3ljxmex","MethodZero");;
switch (try/catch block)
case (try)
:ST_Rect_t r;;
:int i,growth0,growth1,diff,biggestDiff;;
:int group,chosen=0,betterGroup=0;;
:InitPVars(rtp);;
:PickSeeds(rtp);;
while (rtp.split.Partitions[0].count[0]+rtp.split.Partitions[0].count[1]<64+
1&&rtp.split.Partitions[0].count[0]<64+1-rtp.MinFill&&rtp.split.Partitions[0].count[1]<64+
1-rtp.MinFill)
:biggestDiff=-1;;
if (N(rtp.split.Partitions[0].taken[i])) then (yes) 
:final ST_Rect_t rect=new ST_Rect_t();;
:r=(ST_Rect_t )rtp.split.BranchBuf[i].rect;;
:rect.___(CombineRect(r,(ST_Rect_t )rtp.split.Partitions[0].cover[0]));;
:growth0=RectArea((ST_Rect_t )rect)-rtp.split.Partitions[0].area[0];;
:rect.___(CombineRect(r,(ST_Rect_t )rtp.split.Partitions[0].cover[1]));;
:growth1=RectArea((ST_Rect_t )rect)-rtp.split.Partitions[0].area[1];;
:diff=growth1-growth0;;
if (diff>=0) then (yes) 
:group=0;;
else (no)
:group=1;;
:diff=-diff;;
endif 
if (diff>biggestDiff) then (yes) 
:biggestDiff=diff;;
:chosen=i;;
:betterGroup=group;;
else if (diff==biggestDiff&&rtp.split.Partitions[0].count[group]<rtp.split.Partitions[0].count[betterGroup]) then (yes) 
:chosen=i;;
:betterGroup=group;;
endif 
endif 
:Classify(rtp,chosen,betterGroup);;
endwhile
if (rtp.split.Partitions[0].count[0]+rtp.split.Partitions[0].count[1]<64+
1) then (yes) 
:group=0;;
:UNSUPPORTED("4edp65b21liyii0fj1ikco7o0");;
:UNSUPPORTED("20lpsuiyepr2ujozaf6gp4cc");;
:UNSUPPORTED("9qtt6i40h8vtjp2cvqyb8ycaz");;
:UNSUPPORTED("2x1nx9nsne4x3ygmcywl1m3og");;
:UNSUPPORTED("jdepsnmrs3ghh78ql301sfvu");;
:UNSUPPORTED("gqfhorilvtlogp6f2ozx5akf");;
:UNSUPPORTED("flupwh3kosf3fkhkxllllt1");;
