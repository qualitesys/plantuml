start
note right
void PickSeeds(ST_RTree rtp)
end note
:ENTERING("8rui4cun4tvq5xy6ke6r3p55e","PickSeeds");;
switch (try/catch block)
case (try)
:int i,j;;
:int waste,worst;;
:int seed0=0,seed1=0;;
:int area[]=new int[64+1];;
:area[i]=RectArea((ST_Rect_t )rtp.split.BranchBuf[i].rect);;
:worst=0;;
:final ST_Rect_t rect=new ST_Rect_t();;
:rect.___(CombineRect((ST_Rect_t )rtp.split.BranchBuf[i].rect,
(ST_Rect_t )rtp.split.BranchBuf[j].rect));;
:waste=RectArea((ST_Rect_t )rect)-area[i]-area[j];;
if (waste>worst) then (yes) 
:worst=waste;;
:seed0=i;;
:seed1=j;;
endif 
:Classify(rtp,seed0,0);;
:Classify(rtp,seed1,1);;
endswitch
end
start
note right
void Classify(ST_RTree rtp,int i,int group)
end note
:ENTERING("4qyy2dpbkziuubssvfwb8u1sh","Classify");;
switch (try/catch block)
case (try)
:rtp.split.Partitions[0].partition[i]=group;;
:rtp.split.Partitions[0].taken[i]=1;;
if (rtp.split.Partitions[0].count[group]==0) then (yes) 
:rtp.split.Partitions[0].cover[group].___(rtp.split.BranchBuf[i].rect);;
else (no)
:rtp.split.Partitions[0].cover[group].___(CombineRect((ST_Rect_t )rtp.split.BranchBuf[i].rect,
(ST_Rect_t )rtp.split.Partitions[0].cover[group]));;
endif 
:rtp.split.Partitions[0].area[group]=RectArea((ST_Rect_t )rtp.split.Partitions[0].cover[group]);;
:rtp.split.Partitions[0].count[group]=rtp.split.Partitions[0].count[group]+1;;
endswitch
end
start
note right
void LoadNodes(ST_RTree rtp,ST_Node_t___ n,
ST_Node_t___ q,ST_PartitionVars p)
end note
:ENTERING("ay7l4setwyl3hbx4o2jpa7vyz","LoadNodes");;
switch (try/catch block)
case (try)
:int i;;
:assert (n!=null );;
:assert (q!=null );;
:assert (p!=null );;
:assert (rtp.split.Partitions[0].partition[i]==0||rtp.split.Partitions[0].partition[i]==1);;
if (rtp.split.Partitions[0].partition[i]==0) then (yes) 
:AddBranch(rtp,rtp.split.BranchBuf[i],n,null );;
else if (rtp.split.Partitions[0].partition[i]==1) then (yes) 
:AddBranch(rtp,rtp.split.BranchBuf[i],q,null );;
endif 
endswitch
end
start
note right
void InitPVars(ST_RTree rtp)
end note
:ENTERING("dvgjc83sogjhzf5kxpir405rh","InitPVars");;
:int i;;
:rtp.split.Partitions[0].count[0]=0;;
:rtp.split.Partitions[0].count[1]=0;;
:rtp.split.Partitions[0].cover[0].___(NullRect());;
:rtp.split.Partitions[0].cover[1].___(NullRect());;
:rtp.split.Partitions[0].area[0]=0;;
:rtp.split.Partitions[0].area[1]=0;;
:rtp.split.Partitions[0].taken[i]=0;;
:rtp.split.Partitions[0].partition[i]=-1;;
switch (try/catch block)
case (try)
endswitch
end
