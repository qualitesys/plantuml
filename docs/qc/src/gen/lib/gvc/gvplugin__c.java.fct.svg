@startuml
!pragma layout smetana
start
note right
Objectgvplugin_install(Object... arg_)
end note
:throw new UnsupportedOperationException();;
end
start
note right
ST_gvplugin_available_sgvplugin_load(ST_GVC_sgvc,
EN_api_tapi,CStringstr)
end note
if (api==EN_api_t.API_device||api==EN_api_t.API_loadimage) then (yes) 
else (no)
endif 
if (reqdep!=null ) then (yes) 
else (no)
endif 
if (gvc!=null ) then (yes) 
:return null ;;
stop
endif 
:throw new UnsupportedOperationException();;
end
@enduml

