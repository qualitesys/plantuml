start
note right
constructor ClippingRectangle(doublex1,doubley1,
doublex2,doubley2)
end note
:_minX=Math.min(x1,x2);
:_minY=Math.min(y1,y2);
:_maxX=Math.max(x1,x2);
:_maxY=Math.max(y1,y2);
end
start
note right
booleanisInside(GraphPointpoint)
end note
:return _minX<=x&&x<=_maxX&&_minY<=y&&y<=_maxY;;
stop
end
start
note right
doublegetMinX()
end note
:return _minX;;
stop
end
start
note right
doublegetMaxX()
end note
:return _maxX;;
stop
end
start
note right
doublegetMinY()
end note
:return _minY;;
stop
end
start
note right
doublegetMaxY()
end note
:return _maxY;;
stop
end
start
note right
ClippingRectanglegetBoundingBox()
end note
:return this;;
stop
end
start
note right
BasicGraphicalElementgetGraphicalElement()
end note
:return new Rectangle(new GraphPoint(0.5*(_minX+
_maxX),0.5*(_minY+_maxY)),_maxX-_minX,_maxY-_minY,
null );;
stop
end
@enduml

