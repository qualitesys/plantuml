@startuml
!pragma layout smetana
start
note right
AnchorgetHorizontalAnchor(ConfigParametersconfig,
Stringkey,AnchordefaultValue)
end note
if (anchor!=null ) then (yes) 
if (anchor.equals(LEFT_VALUE)) then (yes) 
else (no)
:throw new FactoryException(config,key,"Invalid horizontal anchor.");;
endif 
endif 
:return result;;
stop
end
start
note right
AnchorgetVerticalAnchor(ConfigParametersconfig,
Stringkey,AnchordefaultValue)
end note
if (anchor!=null ) then (yes) 
if (anchor.equals(BOTTOM_VALUE)) then (yes) 
else (no)
:throw new FactoryException(config,key,"Invalid vertcal anchor.");;
endif 
endif 
:return result;;
stop
end
start
note right
constructor Anchor(intfactor)
end note
end
start
note right
intgetFactor()
end note
:return _factor;;
stop
end
@enduml

