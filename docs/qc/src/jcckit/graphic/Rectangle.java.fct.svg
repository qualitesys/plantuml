@startuml
!pragma layout smetana
start
note right
constructor Rectangle(GraphPointcenter,doublewidth,
doubleheight,GraphicAttributesattributes)
end note
end
start
note right
GraphPointgetCenter()
end note
:return _center;;
stop
end
start
note right
doublegetWidth()
end note
:return _width;;
stop
end
start
note right
doublegetHeight()
end note
:return _height;;
stop
end
start
note right
void renderWith(Rendererrenderer)
end note
if (renderer instanceof RectangleRenderer) then (yes) 
else (no)
:throw new IllegalArgumentException(renderer+
" does not implements RectangleRenderer.");;
endif 
end
@enduml

