@startuml
!pragma layout smetana
start
note right
constructor GraphicalComposite(ClippingShapeclippingShape)
end note
end
start
note right
ClippingShapegetClippingShape()
end note
:return _clippingShape;;
stop
end
start
note right
void addElement(GraphicalElementelement)
end note
if (element==null ) then (yes) 
else (no)
endif 
end
start
note right
void removeAllElements()
end note
end
start
note right
void replaceElementAt(intindex,GraphicalElementelement)
end note
if (element==null ) then (yes) 
else (no)
endif 
end
start
note right
void throwNullPointerException()
end note
:throw new NullPointerException("A null as an GraphicalElement is not allowed");;
end
start
note right
void renderWith(Rendererrenderer)
end note
if (renderer instanceof GraphicalCompositeRenderer) then (yes) 
else (no)
:throw new IllegalArgumentException(renderer+
" does not implements GraphicalCompositeRenderer.");;
endif 
end
@enduml

