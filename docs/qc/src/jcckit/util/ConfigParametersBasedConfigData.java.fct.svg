@startuml
!pragma layout smetana
start
note right
constructor ConfigParametersBasedConfigData(ConfigParametersconfig,ConfigParametersdefaultConfig)
end note
:_config=config;
:_defaultConfig=defaultConfig;
end
start
note right
StringgetFullKey(Stringkey)
end note
:return _config.getFullKey(key);;
stop
end
start
note right
Stringget(Stringkey)
end note
:return value==null ? _defaultConfig.get(key,
null ):value;;
stop
end
start
note right
ConfigDatagetNode(Stringkey)
end note
:return new ConfigParametersBasedConfigData(_config.getNode(key),
_defaultConfig.getNode(key));;
stop
end
@enduml

