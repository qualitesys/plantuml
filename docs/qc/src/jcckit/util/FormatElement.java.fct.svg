oration="wavy underline" textLength="73" x="5" y="348.625">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="364.9219">Syntax Error?</text><!--MD5=[e1e45fdb504fc157f8ab90c720837480]
@startuml
!pragma layout smetana
start
note right
doublepower(doublex,intn)
end note
:return n<0? 1.0/power2(x,-n):power2(x,n);;
stop
end
start
note right
doublepower2(doublex,intn)
end note
switch (switch (n))
endswith
end
start
note right
constructor FormatElement(StringformatString)
end note
:intlen=formatString.length()-1;;
:_descriptor=formatString.charAt(len);;
if (DESCRIPTORS.indexOf(_descriptor)<0) then (yes) 
:throw new IllegalArgumentException("Format element '"+
formatString+"' does not ends with one of the following characters: "+
DESCRIPTORS);;
stop
endif 
:_descriptorType=INT_DESCRIPTORS.indexOf(_descriptor)>=0? INT_DESCRIPTOR:FLOAT_DESCRIPTOR;;
if (formatString.length()>1) then (yes) 
switch (switch (formatString.charAt(0)))
endswith
:len=formatString.length()-1;;
:intindex=formatString.indexOf('.');;
:_decimalPoint=index>=0;;
:intlast=_decimalPoint? index:len;;
if (last>0) then (yes) 
:_width=Integer.parseInt(formatString.substring(0,
last));;
endif 
if (_decimalPoint) then (yes) 
:index++;;
if (index<len) then (yes) 
:_precision=Integer.parseInt(formatString.substring(index,
len));;
endif 
endif 
endif 
:_tenToPrecision=power(10,_precision);;
end
start
note right
void form(StringBufferbuffer,longnumber)
end note
if (_descriptorType==FLOAT_DESCRIPTOR) then (yes) 
:form(buffer,(double)number);;
else (no)
:buffer.append(form(number<0,Long.toString(Math.abs(number),
_descriptor=='o'? 8:(_descriptor=='x'? 16:10)),
""));;
endif 
end
start
note right
void form(StringBufferbuffer,doublenumber)
end note
if (_descriptorType==INT_DESCRIPTOR) then (yes) 
:form(buffer,(long)Math.floor(number+0.5));;
else if (_descriptor=='f') then (yes) 
:buffer.append(formF(number));;
else if (_descriptor=='e'||_descriptor=='E') then (yes) 
:buffer.append(formE(number));;
else if (_descriptor=='g'||_descriptor=='G') then (yes) 
:StringformF=formF(number);;
:StringformE=formE(number);;
:buffer.append(formF.length()>formE.length()? formE:formF);;
endif 
end
start
note right
Stringform(booleannegativeValue,StringintPart,
StringfracPart)
end note
:intlen=intPart.length()+fracPart.length();;
:StringBufferresult=new StringBuffer();;
:intcount=0;;
if (_alwaysSign||negativeValue) then (yes) 
:result.append(negativeValue? '-':'+');;
:count++;;
endif 
if (_leadingZeros) then (yes) 
:result.append('0');;
:count++;;
endif 
:result.append(intPart).append(fracPart);;
:count+=len;;
if (_flushLeft) then (yes) 
:result.append(' ');;
else (no)
:result.insert(0,' ');;
endif 
:return new String(result);;
stop
end
start
note right
StringformE(doublenumber)
end note
:intexponent=0;;
:Stringzeros=String.valueOf("00000000000000000000000").substring(0,
_precision+1);;
if (number!=0) then (yes) 
:exponent=(int)Math.floor(Math.log(Math.abs(number))/Math.log(10));;
:doublemantisse=Math.floor(Math.abs(number*power(10.0,_precision-exponent))+
0.5);;
if (mantisse>=10*_tenToPrecision) then (yes) 
:exponent++;;
:mantisse=Math.floor(Math.abs(number*power(10.0,_precision-exponent))+
0.5);;
endif 
:zeros=Long.toString((long)mantisse);;
endif 
:StringBufferfracPart=new StringBuffer();;
if (_decimalPoint) then (yes) 
:fracPart.append('.').append(zeros.substring(1));;
endif 
:fracPart.append(Character.isLowerCase(_descriptor)? 'e':'E')
.append(exponent<0? '-':'+');;
:exponent=Math.abs(exponent);;
:fracPart.insert(n,Character.forDigit(exponent%10,
10));;
:exponent/=10;;
:return form(number<0,zeros.substring(0,1),
new String(fracPart));;
stop
end
start
note right
StringformF(doublenumber)
end note
:doublemultiplier=number<0? -_tenToPrecision:_tenToPrecision;;
:Stringdigits=Long.toString((long)Math.floor(number*multiplier+
0.5));;
:StringintPart=digits;;
:StringBufferfracPart=new StringBuffer();;
if (_decimalPoint) then (yes) 
:intlen=digits.length()-_precision;;
:fracPart.append('.').append(digits.substring(Math.max(0,
len)));;
if (len>0) then (yes) 
:intPart=digits.substring(0,len);;
else (no)
:intPart="0";;
:fracPart.insert(1,'0');;
endif 
endif 
:return form(number<0,intPart,new String(fracPart));;
stop
end
@enduml

