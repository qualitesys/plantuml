@startuml
!pragma layout smetana
start
note right
constructor Factory()
end note
end
start
note right
Objectcreate(StringclassName)
end note
:try {return Class.forName(className).newInstance();}catch (Throwablet){throw new IllegalArgumentException("Could not create an instance of "+
className+" because of "+t);};
end
start
note right
Objectcreate(ConfigParametersconfigParameters)
end note
:return createObject(configParameters,className);;
stop
end
start
note right
Objectcreate(ConfigParametersconfigParameters,
StringdefaultClassName)
end note
:return createObject(configParameters,className);;
stop
end
start
note right
ObjectcreateOrGet(ConfigParametersconfigParameters,
ObjectdefaultObject)
end note
:return className==null ? defaultObject:createObject(configParameters,
className);;
stop
end
start
note right
ObjectcreateObject(ConfigParametersconfigParameters,
StringclassName)
end note
:try {Classc=Class.forName(className);Objectresult=null ;
:Constructorconstructor=null ;try {constructor=c.getConstructor(new Class[]{ConfigParameters.class });
:result=constructor.newInstance(new Object[]{configParameters});}catch (NoSuchMethodExceptione){result=c.newInstance();}return result;}catch (Throwablet){throw new FactoryException(configParameters,
CLASS_NAME_KEY,t);};
end
@enduml

