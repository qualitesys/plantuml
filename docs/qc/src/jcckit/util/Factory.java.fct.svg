@startuml
!pragma layout smetana
start
note right
constructor Factory()
end note
end
start
note right
Objectcreate(StringclassName)
end note
:return Class.forName(className).newInstance();;
stop
:throw new IllegalArgumentException("Could not create an instance of "+
className+" because of "+t);;
end
start
note right
Objectcreate(ConfigParametersconfigParameters)
end note
:return createObject(configParameters,className);;
stop
end
start
note right
Objectcreate(ConfigParametersconfigParameters,
StringdefaultClassName)
end note
:return createObject(configParameters,className);;
stop
end
start
note right
ObjectcreateOrGet(ConfigParametersconfigParameters,
ObjectdefaultObject)
end note
:return className==null ? defaultObject:createObject(configParameters,
className);;
stop
end
start
note right
ObjectcreateObject(ConfigParametersconfigParameters,
StringclassName)
end note
:constructor=c.getConstructor(new Class[]{ConfigParameters.class });
:result=constructor.newInstance(new Object[]{configParameters});
:result=c.newInstance();
:return result;;
stop
:throw new FactoryException(configParameters,
CLASS_NAME_KEY,t);;
end
@enduml

