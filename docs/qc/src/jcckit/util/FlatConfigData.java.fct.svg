@startuml
!pragma layout smetana
start
note right
constructor FlatConfigData(Stringpath)
end note
end
start
note right
StringgetFullKey(Stringkey)
end note
:return _path==null ? key:_path+key;;
stop
end
start
note right
Stringget(Stringkey)
end note
:return get(_path,key,0);;
stop
end
start
note right
Stringget(Stringpath,Stringkey,intnumberOfLevels)
end note
if (numberOfLevels<20) then (yes) 
if (result==null ) then (yes) 
while (posAfterDelim>0)
if (replacement!=null ) then (yes) 
endif 
endwhile
endif 
endif 
:return result;;
stop
end
start
note right
ConfigDatagetNode(Stringkey)
end note
:return createConfigData(path);;
stop
end
@enduml

