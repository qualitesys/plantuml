@startuml
!pragma layout smetana
start
note right
constructor FlatConfigData(Stringpath)
end note
:_path=path;;
end
start
note right
StringgetFullKey(Stringkey)
end note
:return _path==null ? key:_path+key;;
stop
end
start
note right
Stringget(Stringkey)
end note
:return get(_path,key,0);;
stop
end
start
note right
Stringget(Stringpath,Stringkey,intnumberOfLevels)
end note
if (numberOfLevels<20) then (yes) 
:result=getValue(fullKey);;
if (result==null ) then (yes) 
:while (posAfterDelim>0){replacement=getValue(path.substring(0,posAfterDelim));if (replacement!=null ){result=get(replacement+
path.substring(posAfterDelim),key,numberOfLevels+
1);break ;}posAfterDelim=path.lastIndexOf('/',
posAfterDelim-2)+1;};
endif 
endif 
:return result;;
stop
end
start
note right
ConfigDatagetNode(Stringkey)
end note
:return createConfigData(path);;
stop
end
