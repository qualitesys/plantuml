@startuml
!pragma layout smetana
start
note right
constructor Point(double[]vector)
end note
if (vector!=null &&vector.length>0) then (yes) 
:x=vector[0];;
if (vector.length>1) then (yes) 
:y=vector[1];;
endif 
endif 
:_x=x;;
:_y=y;;
end
start
note right
constructor Point(doublex,doubley)
end note
:_x=x;;
:_y=y;;
end
start
note right
doublegetX()
end note
:return _x;;
stop
end
start
note right
doublegetY()
end note
:return _y;;
stop
end
@enduml

