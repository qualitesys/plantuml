@startuml
!pragma layout smetana
start
note right
constructor AppletBasedConfigData(Appletapplet)
end note
:this(applet,null );
end
start
note right
constructor AppletBasedConfigData(Appletapplet,Stringpath)
end note
:super (path);
:_applet=applet;
end
start
note right
StringgetValue(StringfullKey)
end note
:return _applet.getParameter(fullKey);;
stop
end
start
note right
ConfigDatacreateConfigData(Stringpath)
end note
:return new AppletBasedConfigData(_applet,
path);;
stop
end
@enduml

