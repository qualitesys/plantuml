@startuml
!pragma layout smetana
start
note right
constructor AppletBasedConfigData(Appletapplet)
end note
end
start
note right
constructor AppletBasedConfigData(Appletapplet,
Stringpath)
end note
end
start
note right
StringgetValue(StringfullKey)
end note
:return _applet.getParameter(fullKey);;
stop
end
start
note right
ConfigDatacreateConfigData(Stringpath)
end note
:return new AppletBasedConfigData(_applet,
path);;
stop
end
@enduml

