@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "_scale="+_scale+" _x0="+_x0+" _y0="+
_y0;;
stop
end
start
note right
constructor Transformation(intwidth,intheight,
ClippingRectanglepaper,AnchorhorizontalAnchor,
AnchorverticalAnchor)
end note
end
start
note right
inttransformX(doublex)
end note
:return trim(_scale*x+_x0);;
stop
end
start
note right
inttransformY(doubley)
end note
:return trim(_y0-_scale*y);;
stop
end
start
note right
inttransformWidth(doublewidth)
end note
:return trim(_scale*width+0.5);;
stop
end
start
note right
inttransformHeight(doubleheight)
end note
:return trim(_scale*height+0.5);;
stop
end
start
note right
inttrim(doublenumber)
end note
:return number>Short.MAX_VALUE? Short.MAX_VALUE:(number<Short.MIN_VALUE? Short.MIN_VALUE:(int)number);;
stop
end
start
note right
