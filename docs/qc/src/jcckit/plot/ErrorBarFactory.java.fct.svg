@startuml
!pragma layout smetana
start
note right
constructor ErrorBarFactory(ConfigParametersconfig)
end note
end
start
note right
GraphicalElementcreateLegendSymbol(GraphPointcenterPosition,
doublesize)
end note
:return _symbolFactory==null ? new GraphicalComposite(null ):_symbolFactory.createLegendSymbol(centerPosition,
size);;
stop
end
start
note right
SymbolcreateSymbol(GraphPointpoint,HinthintFromPreviousPoint,
HinthintFromPreviousCurve)
end note
if (hintFromPreviousCurve instanceof PositionHint) then (yes) 
endif 
if (position==null ) then (yes) 
if (_symbolFactory==null ) then (yes) 
:return new Symbol(new GraphicalComposite(null ),
hintFromPreviousPoint,new PositionHint(origin,
point));;
stop
else (no)
:return _symbolFactory.createSymbol(point,
hintFromPreviousPoint,new PositionHint(origin,
point));;
stop
endif 
else (no)
if (xError>0) then (yes) 
endif 
if (yError>0) then (yes) 
endif 
:return new Symbol(errorBars,hintFromPreviousPoint,
new PositionHint(origin,null ));;
stop
endif 
end
@enduml

