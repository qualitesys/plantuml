@startuml
!pragma layout smetana
start
note right
constructor MapItem(Stringitem)
end note
if (index<0) then (yes) 
else (no)
if (index<0) then (yes) 
if (_min>_max) then (yes) 
endif 
else (no)
endif 
endif 
end
start
note right
booleanisInside(doublevalue)
end note
:return value>=_min&&value<_max;;
stop
end
start
note right
constructor TicLabelMap(ConfigParametersconfig)
end note
:throw new NumberFormatException("Item '"+
item+"' of "+config.getFullKey(MAP_KEY)+" has an invalid number.");;
end
start
note right
Stringform(doubleticValue)
end note
if (_map[i].isInside(ticValue)) then (yes) 
endif 
:return result;;
stop
end
@enduml

