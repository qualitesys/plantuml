@startuml
!pragma layout smetana
start
note right
constructor BarFactory(ConfigParametersconfig)
end note
end
start
note right
SymbolcreateSymbol(GraphPointpoint,GraphicAttributesattributes,
HinthintForNextPoint,HinthintFromPreviousCurve)
end note
if (hintFromPreviousCurve instanceof PositionHint) then (yes) 
endif 
if (_horizontalBars) then (yes) 
else (no)
endif 
:return new Symbol(new Rectangle(position,
Math.abs(x),Math.abs(y),attributes),hintForNextPoint,
hintForNextCurve);;
stop
end
start
note right
GraphicalElementcreateLegendSymbol(GraphPointcenterPosition,
doublesize)
end note
:return new Rectangle(centerPosition,size,
size,_attributes);;
stop
end
start
note right
GraphicalElementcreatePlainSymbol(GraphPointcenterPosition,
doublesize,GraphicAttributesattributes)
end note
:return null ;;
stop
end
@enduml

