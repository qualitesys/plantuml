!pragma layout smetana
start
note right
constructor Legend(ConfigParametersconfig)
end note
end
start
note right
ConfigParametersmergeWithDefaultConfig(ConfigParametersconfig)
end note
:return new ConfigParameters(cd);;
stop
end
start
note right
GraphicalElementgetBox()
end note
:return _box;;
stop
end
start
note right
GraphicalElementcreateSymbol(intcurveIndex,
intnumberOfCurves,SymbolFactoryfactory,booleanwithLine,
GraphicAttributeslineAttributes)
end note
if (withLine) then (yes) 
endif 
if (factory!=null ) then (yes) 
endif 
:return result;;
stop
end
start
note right
doublecalculateBaseLine(intcurveIndex,intnumberOfCurves)
end note
if (numberOfCurves>1) then (yes) 
:return _yBase+((_yLastRow-_yBase)/(numberOfCurves-1))*curveIndex;;
stop
else (no)
:return 0.5*(_yBase+_yLastRow);;
stop
endif 
end
start
note right
GraphicalElementcreateCurveTitle(intcurveIndex,
intnumberOfCurves,Stringtitle)
end note
:return new Text(new GraphPoint(_xText,calculateBaseLine(curveIndex,
numberOfCurves)),title,_curveTitleAttributes);;
stop
end
