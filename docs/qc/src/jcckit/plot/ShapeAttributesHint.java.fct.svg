@startuml
!pragma layout smetana
start
note right
float[]extractHSB(Colorcolor)
end note
:return color==null ? null :Color.RGBtoHSB(color.getRed(),
color.getGreen(),color.getBlue(),null );;
stop
end
start
note right
ColorcreateColor(float[]colorHSB)
end note
:return colorHSB==null ? null :Color.getHSBColor(colorHSB[0],
colorHSB[1],colorHSB[2]);;
stop
end
start
note right
float[]incrementColor(float[]colorHSB,double[]increments)
end note
if (colorHSB!=null ) then (yes) 
endif 
:return result;;
stop
end
start
note right
constructor ShapeAttributesHint(ConfigParametersconfig)
end note
end
start
note right
AttributesHintgetNextHint()
end note
:return nextHint;;
stop
end
start
note right
GraphicAttributesgetAttributes()
end note
:return new ShapeAttributes(createColor(_fillColorHSB),
createColor(_lineColorHSB),_lineThickness,
_linePattern);;
stop
end
@enduml

