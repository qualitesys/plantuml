@startuml
!pragma layout smetana
start
note right
constructor PositionHint(ConfigParametersconfig)
end note
:_position=point==null ? null :new GraphPoint(point);
:_origin=new GraphPoint(config.getDoubleArray(ORIGIN_KEY,
point));
end
start
note right
constructor PositionHint(GraphPointorigin,GraphPointposition)
end note
:_origin=origin;
:_position=position;
end
start
note right
GraphPointgetPosition()
end note
:return _position;;
stop
end
start
note right
GraphPointgetOrigin()
end note
:return _origin;;
stop
end
@enduml

