@startuml
!pragma layout smetana
start
note right
constructor Symbol(GraphicalElementsymbol,HinthintForNextPoint,HinthintForNextCurve)
end note
:_symbol=symbol;
:_hintForNextPoint=hintForNextPoint;
:_hintForNextCurve=hintForNextCurve;
end
start
note right
GraphicalElementgetSymbol()
end note
:return _symbol;;
stop
end
start
note right
HintgetHintForNextPoint()
end note
:return _hintForNextPoint;;
stop
end
start
note right
HintgetHintForNextCurve()
end note
:return _hintForNextCurve;;
stop
end
@enduml

