@startuml
!pragma layout smetana
start
note right
constructor DataPlot()
end note
end
start
note right
constructor DataPlot(ConfigParametersconfig)
end note
:StringTokenizertokenizer=new StringTokenizer(config.get(CURVES_KEY));;
:while (tokenizer.hasMoreTokens()){addElement(new DataCurve(config.getNode(tokenizer.nextToken())));};
end
start
note right
DataPlotcreate(ConfigParametersconfig)
end note
:return new DataPlot(config.getNode(DATA_KEY));;
stop
end
start
note right
booleanisValid(DataElementelement)
end note
:return element instanceof DataCurve;;
stop
end
@enduml

