@startuml
!pragma layout smetana
start
note right
constructor DataCurve(Stringtitle)
end note
:_title=title;
end
start
note right
constructor DataCurve(ConfigParametersconfig)
end note
:this(config.get(TITLE_KEY,""));
:i++;
:addElement(new DataPoint(xPoints[i],yPoints[i]));
end
start
note right
DataContainergetContainer()
end note
:return _container;;
stop
end
start
note right
void setContainer(DataContainercontainer)
end note
:_container=container;
end
start
note right
StringgetTitle()
end note
:return _title;;
stop
end
start
note right
booleanisValid(DataElementelement)
end note
:return element instanceof DataPoint;;
stop
end
@enduml

