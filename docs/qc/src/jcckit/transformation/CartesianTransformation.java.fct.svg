73" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[904c42bd5eec2f099f56f8bda34318a7]
@startuml
!pragma layout smetana
start
note right
constructor CartesianTransformation(booleanxLogScale,booleanyLogScale,DataPointdataPoint1,GraphPointgraphPoint1,DataPointdataPoint2,GraphPointgraphPoint2)
end note
:_xLogScale=xLogScale;
:check(dd,"data","x",d1);
:_xScale=(graphPoint2.getX()-graphPoint1.getX())/dd;
:check(_xScale,"graphical","x",graphPoint1.getX());
:_xOffset=graphPoint1.getX()-d1*_xScale;
:_yLogScale=yLogScale;
:d1=Util.log(dataPoint1.getY(),yLogScale);
:dd=Util.log(dataPoint2.getY(),yLogScale)-d1;
:check(dd,"data","y",d1);
:_yScale=(graphPoint2.getY()-graphPoint1.getY())/dd;
:check(_yScale,"graphical","y",graphPoint1.getY());
:_yOffset=graphPoint1.getY()-d1*_yScale;
end
start
note right
void check(doublevalueToCheck,Stringtype,Stringaxis,doublevalue)
end note
if (valueToCheck==0) then (yes) 
:throw new IllegalArgumentException("The "+
type+" reference points in "+axis+" must be different; both are "+
value);;
endif 
end
start
note right
GraphPointtransformToGraph(DataPointpoint)
end note
:return new GraphPoint(_xOffset+Util.log(point.getX(),
_xLogScale)*_xScale,_yOffset+Util.log(point.getY(),
_yLogScale)*_yScale);;
stop
end
start
note right
DataPointtransformToData(GraphPointpoint)
end note
:return new DataPoint(Util.exp((point.getX()-_xOffset)/_xScale,
_xLogScale),Util.exp((point.getY()-_yOffset)/_yScale,
_yLogScale));;
stop
end
@enduml

