@startuml
!pragma layout smetana
start
note right
BitMatrixencode(Stringcontents,BarcodeFormatformat,
intmultiple)
end note
:return encode(contents,format,multiple,null );;
stop
end
start
note right
BitMatrixencode(Stringcontents,BarcodeFormatformat,
intmultiple,Hashtablehints)
end note
if (contents==null ||contents.length()==0) then (yes) 
:throw new IllegalArgumentException("Found empty contents");;
stop
endif 
if (format!=BarcodeFormat.QR_CODE) then (yes) 
:throw new IllegalArgumentException("Can only encode QR_CODE, but got "+
format);;
stop
endif 
if (hints!=null ) then (yes) 
if (requestedECLevel!=null ) then (yes) 
:errorCorrectionLevel=requestedECLevel;;
endif 
endif 
:Encoder.encode(contents,errorCorrectionLevel,
hints,code);;
:return renderResult(code,multiple);;
stop
end
start
note right
BitMatrixrenderResult(QRCodecode,intmultiple)
end note
if (input.get(inputX,inputY)==1) then (yes) 
:output.setRegion(outputX,outputY,multiple,
multiple);;
endif 
:return output;;
stop
end
@enduml

