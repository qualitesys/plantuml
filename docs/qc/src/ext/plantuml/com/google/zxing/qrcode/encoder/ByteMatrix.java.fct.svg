font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="560.4844">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[718d474fc42ad0afc046533e8dabe523]
@startuml
!pragma layout smetana
start
note right
constructor ByteMatrix(intwidth,intheight)
end note
:bytes=new byte[height][width];;
:this.width=width;;
:this.height=height;;
end
start
note right
intgetHeight()
end note
:return height;;
stop
end
start
note right
intgetWidth()
end note
:return width;;
stop
end
start
note right
byteget(intx,inty)
end note
:return bytes[y][x];;
stop
end
start
note right
byte[][]getArray()
end note
:return bytes;;
stop
end
start
note right
void set(intx,inty,bytevalue)
end note
:bytes[y][x]=value;;
end
start
note right
void set(intx,inty,intvalue)
end note
:bytes[y][x]=(byte)value;;
end
start
note right
void set(intx,inty,booleanvalue)
end note
:bytes[y][x]=(byte)(value? 1:0);;
end
start
note right
void clear(bytevalue)
end note
:bytes[y][x]=value;;
end
start
note right
StringtoString()
end note
:StringBuilderresult=new StringBuilder(2*width*height+2);;
switch (switch (bytes[y][x]))
endswith
:result.append('\n');;
:return result.toString();;
stop
end
@enduml

