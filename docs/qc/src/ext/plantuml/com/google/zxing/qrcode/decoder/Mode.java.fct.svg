 font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="348.625">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="167" x="5" y="364.9219">switch (switch (bits))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="381.2188">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="397.5156">Syntax Error?</text><!--MD5=[a0120b426aa9d4b1572260110951c19b]
@startuml
!pragma layout smetana
start
note right
constructor Mode(int[]characterCountBitsForVersions,
intbits,Stringname)
end note
:this.characterCountBitsForVersions=characterCountBitsForVersions;;
:this.bits=bits;;
:this.name=name;;
end
start
note right
ModeforBits(intbits)
end note
switch (switch (bits))
endswith
end
start
note right
intgetCharacterCountBits(Versionversion)
end note
if (characterCountBitsForVersions==null ) then (yes) 
:throw new IllegalArgumentException("Character count doesn't apply to this mode");;
stop
endif 
:intnumber=version.getVersionNumber();;
:intoffset;;
if (number<=9) then (yes) 
:offset=0;;
else if (number<=26) then (yes) 
:offset=1;;
else (no)
:offset=2;;
endif 
:return characterCountBitsForVersions[offset];;
stop
end
start
note right
intgetBits()
end note
:return bits;;
stop
end
start
note right
StringgetName()
end note
:return name;;
stop
end
start
note right
StringtoString()
end note
:return name;;
stop
end
@enduml

