@startuml
!pragma layout smetana
start
note right
constructor MaskUtil()
end note
end
start
note right
intapplyMaskPenaltyRule1(ByteMatrixmatrix)
end note
:return applyMaskPenaltyRule1Internal(matrix,true)+
applyMaskPenaltyRule1Internal(matrix,false);;
stop
end
start
note right
intapplyMaskPenaltyRule2(ByteMatrixmatrix)
end note
:intpenalty=0;;
:byte[][]array=matrix.getArray();;
:intwidth=matrix.getWidth();;
:intheight=matrix.getHeight();;
:intvalue=array[y][x];;
if (value==array[y][x+1]&&value==array[y+
1][x]&&value==array[y+1][x+1]) then (yes) 
:penalty+=3;;
endif 
:return penalty;;
stop
end
start
note right
intapplyMaskPenaltyRule3(ByteMatrixmatrix)
end note
:intpenalty=0;;
:byte[][]array=matrix.getArray();;
:intwidth=matrix.getWidth();;
:intheight=matrix.getHeight();;
if (x+6<width&&array[y][x]==1&&array[y][x+
1]==0&&array[y][x+2]==1&&array[y][x+3]==1&&array[y][x+
4]==1&&array[y][x+5]==0&&array[y][x+6]==1&&((x+
10<width&&array[y][x+7]==0&&array[y][x+8]==0&&array[y][x+
9]==0&&array[y][x+10]==0)||(x-4>=0&&array[y][x-1]==0&&array[y][x-2]==0&&array[y][x-3]==0&&array[y][x-4]==0))) then (yes) 
:penalty+=40;;
endif 
if (y+6<height&&array[y][x]==1&&array[y+1][x]==0&&array[y+
2][x]==1&&array[y+3][x]==1&&array[y+4][x]==1&&array[y+
5][x]==0&&array[y+6][x]==1&&((y+10<height&&array[y+
7][x]==0&&array[y+8][x]==0&&array[y+9][x]==0&&array[y+
10][x]==0)||(y-4>=0&&array[y-1][x]==0&&array[y-2][x]==0&&array[y-3][x]==0&&array[y-4][x]==0))) then (yes) 
:penalty+=40;;
endif 
:return penalty;;
stop
end
start
note right
intapplyMaskPenaltyRule4(ByteMatrixmatrix)
end note
:intnumDarkCells=0;;
:byte[][]array=matrix.getArray();;
:intwidth=matrix.getWidth();;
:intheight=matrix.getHeight();;
if (array[y][x]==1) then (yes) 
:numDarkCells+=1;;
endif 
:intnumTotalCells=matrix.getHeight()*matrix.getWidth();;
:doubledarkRatio=(double)numDarkCells/numTotalCells;;
:return Math.abs((int)(darkRatio*100-50))/5*10;;
stop
end
start
note right
booleangetDataMaskBit(intmaskPattern,intx,
inty)
end note
if (!QRCode.isValidMaskPattern(maskPattern)) then (yes) 
:throw new IllegalArgumentException("Invalid mask pattern");;
stop
endif 
:intintermediate,temp;;
switch (switch (maskPattern))
endswith
:return intermediate==0;;
stop
end
start
note right
intapplyMaskPenaltyRule1Internal(ByteMatrixmatrix,
booleanisHorizontal)
end note
:intpenalty=0;;
:intnumSameBitCells=0;;
:intprevBit=-1;;
:intiLimit=isHorizontal? matrix.getHeight():matrix.getWidth();;
:intjLimit=isHorizontal? matrix.getWidth():matrix.getHeight();;
:byte[][]array=matrix.getArray();;
:intbit=isHorizontal? array[i][j]:array[j][i];;
if (bit==prevBit) then (yes) 
:numSameBitCells+=1;;
if (numSameBitCells==5) then (yes) 
:penalty+=3;;
else if (numSameBitCells>5) then (yes) 
:penalty+=1;;
endif 
else (no)
:numSameBitCells=1;;
:prevBit=bit;;
endif 
:numSameBitCells=0;;
:return penalty;;
stop
end
@enduml

