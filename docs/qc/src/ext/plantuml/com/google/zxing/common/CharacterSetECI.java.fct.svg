start
note right
CharacterSetECIgetCharacterSetECIByValue(intvalue)
end note
if (VALUE_TO_ECI==null ) then (yes) 
endif 
if (value<0||value>=900) then (yes) 
:throw new IllegalArgumentException("Bad ECI value: "+
value);;
endif 
:return (CharacterSetECI)VALUE_TO_ECI.get(value);;
stop
end
start
note right
CharacterSetECIgetCharacterSetECIByName(Stringname)
end note
if (NAME_TO_ECI==null ) then (yes) 
endif 
:return (CharacterSetECI)NAME_TO_ECI.get(name);;
stop
end
@enduml

