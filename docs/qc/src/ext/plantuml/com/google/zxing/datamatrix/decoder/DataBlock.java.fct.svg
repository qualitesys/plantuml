@startuml
!pragma layout smetana
start
note right
constructor DataBlock(intnumDataCodewords,
byte[]codewords)
end note
end
start
note right
DataBlock[]getDataBlocks(byte[]rawCodewords,
Versionversion)
end note
if (rawCodewordsOffset!=rawCodewords.length) then (yes) 
:throw new IllegalArgumentException();;
endif 
:return result;;
stop
end
start
note right
intgetNumDataCodewords()
end note
:return numDataCodewords;;
stop
end
start
note right
byte[]getCodewords()
end note
:return codewords;;
stop
end
@enduml

