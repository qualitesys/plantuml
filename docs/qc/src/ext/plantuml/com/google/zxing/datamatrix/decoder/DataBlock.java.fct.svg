@startuml
!pragma layout smetana
start
note right
constructor DataBlock(intnumDataCodewords,
byte[]codewords)
end note
:this.numDataCodewords=numDataCodewords;;
:this.codewords=codewords;;
end
start
note right
DataBlock[]getDataBlocks(byte[]rawCodewords,
Versionversion)
end note
:totalBlocks+=ecBlockArray[i].getCount();;
:result[numResultBlocks++]=new DataBlock(numDataCodewords,
new byte[numBlockCodewords]);;
:result[j].codewords[i]=rawCodewords[rawCodewordsOffset++];;
:result[j].codewords[longerBlocksNumDataCodewords-1]=rawCodewords[rawCodewordsOffset++];;
:result[j].codewords[iOffset]=rawCodewords[rawCodewordsOffset++];;
if (rawCodewordsOffset!=rawCodewords.length) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
:return result;;
stop
end
start
note right
intgetNumDataCodewords()
end note
:return numDataCodewords;;
stop
end
start
note right
byte[]getCodewords()
end note
:return codewords;;
stop
end
@enduml

