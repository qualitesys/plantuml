@startuml
!pragma layout smetana
start
note right
constructor DataBlock(intnumDataCodewords,
byte[]codewords)
end note
end
start
note right
DataBlock[]getDataBlocks(byte[]rawCodewords,
Versionversion,ErrorCorrectionLevelecLevel)
end note
if (rawCodewords.length!=version.getTotalCodewords()) then (yes) 
:throw new IllegalArgumentException();;
endif 
while (longerBlocksStartAt>=0)
if (numCodewords==shorterBlocksTotalCodewords) then (yes) 
endif 
endwhile
:return result;;
stop
end
start
note right
intgetNumDataCodewords()
end note
:return numDataCodewords;;
stop
end
start
note right
byte[]getCodewords()
end note
:return codewords;;
stop
end
@enduml

