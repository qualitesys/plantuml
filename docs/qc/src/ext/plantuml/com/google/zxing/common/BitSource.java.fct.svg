@startuml
!pragma layout smetana
start
note right
constructor BitSource(byte[]bytes)
end note
end
start
note right
intreadBits(intnumBits)
end note
if (numBits<1||numBits>32) then (yes) 
:throw new IllegalArgumentException();;
endif 
if (bitOffset>0) then (yes) 
if (bitOffset==8) then (yes) 
endif 
endif 
if (numBits>0) then (yes) 
while (numBits>=8)
endwhile
if (numBits>0) then (yes) 
endif 
endif 
:return result;;
stop
end
start
note right
intavailable()
end note
:return 8*(bytes.length-byteOffset)-bitOffset;;
stop
end
