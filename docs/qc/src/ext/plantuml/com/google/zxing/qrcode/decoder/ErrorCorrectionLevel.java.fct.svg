:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="141" x2="141" y1="1062.9492" y2="1082.9492"/><polygon fill="#181818" points="137,1072.9492,141,1082.9492,145,1072.9492,141,1076.9492" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="141" x2="141" y1="1116.918" y2="1136.918"/><polygon fill="#181818" points="137,1126.918,141,1136.918,145,1126.918,141,1130.918" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a599c4fa3216fb3c612990baf458e8cc]
@startuml
!pragma layout smetana
start
note right
constructor ErrorCorrectionLevel(intordinal,intbits,Stringname)
end note
:this.ordinal=ordinal;
:this.bits=bits;
:this.name=name;
end
start
note right
intordinal()
end note
:return ordinal;;
stop
end
start
note right
intgetBits()
end note
:return bits;;
stop
end
start
note right
StringgetName()
end note
:return name;;
stop
end
start
note right
StringtoString()
end note
:return name;;
stop
end
start
note right
ErrorCorrectionLevelforBits(intbits)
end note
if (bits<0||bits>=FOR_BITS.length) then (yes) 
:throw new IllegalArgumentException();;
endif 
:return FOR_BITS[bits];;
stop
end
@enduml

