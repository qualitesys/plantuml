@startuml
!pragma layout smetana
start
note right
constructor ReedSolomonEncoder(GF256field)
end note
if (!GF256.QR_CODE_FIELD.equals(field)) then (yes) 
:throw new IllegalArgumentException("Only QR Code is supported at this time");;
endif 
end
start
note right
GF256PolybuildGenerator(intdegree)
end note
if (degree>=cachedGenerators.size()) then (yes) 
endif 
:return (GF256Poly)cachedGenerators.elementAt(degree);;
stop
end
start
note right
void encode(int[]toEncode,intecBytes)
end note
if (ecBytes==0) then (yes) 
:throw new IllegalArgumentException("No error correction bytes");;
endif 
if (dataBytes<=0) then (yes) 
:throw new IllegalArgumentException("No data bytes provided");;
endif 
end
@enduml

