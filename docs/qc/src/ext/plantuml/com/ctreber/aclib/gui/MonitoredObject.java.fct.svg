@startuml
!pragma layout smetana
start
note right
void addChangeListener(MOChangeListenerpListener)
end note
:fListeners.add(pListener);
end
start
note right
void removeChangeListener(MOChangeListenerpListener)
end note
:fListeners.remove(pListener);
end
start
note right
void fireValueChanged()
end note
while (lIt.hasNext())
:lListener.valueChanged(this);
endwhile
end
@enduml

