ht="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="388" x="5" y="560.4844">while ((j&gt;lo0)&amp;&amp;(comparator.compare(items[j-1],</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[39f3c0a4bf211590f965584f914d7d43]
@startuml
!pragma layout smetana
start
note right
void sort(Object[]items,Comparatorcomparator)
end note
if (items.length<=1) then (yes) 
:return ;;
stop
endif 
:qsort(items,comparator,0,items.length-1);
:insertionSort(items,comparator,0,items.length-1);
end
start
note right
void qsort(Object[]items,Comparatorcomparator,
intl,intr)
end note
if ((r-l)>M) then (yes) 
:i=(r+l)/2;
if (comparator.compare(items[l],items[i])>0) then (yes) 
:swap(items,l,i);
endif 
if (comparator.compare(items[l],items[r])>0) then (yes) 
:swap(items,l,r);
endif 
if (comparator.compare(items[i],items[r])>0) then (yes) 
:swap(items,i,r);
endif 
:j=r-1;
:swap(items,i,j);
:i=l;
:v=items[j];
while (true)
while (comparator.compare(items[++i],v)<0)
endwhile
while (comparator.compare(items[- -j],v)>0)
endwhile
if (j<i) then (yes) 
endif 
:swap(items,i,j);
endwhile
:swap(items,i,r-1);
:qsort(items,comparator,l,j);
:qsort(items,comparator,i+1,r);
endif 
end
start
note right
void swap(Object[]items,inti,intj)
end note
:tmp=items[i];
:items[i]=items[j];
:items[j]=tmp;
end
start
note right
void insertionSort(Object[]items,Comparatorcomparator,
intlo0,inthi0)
end note
:i=lo0+1;
:i++;
:v=items[i];
:j=i;
while ((j>lo0)&&(comparator.compare(items[j-1],
v)>0))
:items[j]=items[j-1];
:j- -;
endwhile
:items[j]=v;
end
@enduml

