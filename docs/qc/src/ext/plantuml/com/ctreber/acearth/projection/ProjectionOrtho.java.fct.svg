@startuml
!pragma layout smetana
start
note right
booleanisVisible(Point3DpPoint)
end note
:return pPoint.getZ()>=0;;
stop
end
start
note right
CoordinategetLocation(intpX,intpY)
end note
:return rotateReverse(lP).getCoordinate();;
stop
end
start
note right
doubleprojectX(doublepX,doublepZ)
end note
:return pX;;
stop
end
start
note right
doubleinverseProjectX(doublepX)
end note
:return pX;;
stop
end
start
note right
doubleprojectY(doublepY)
end note
:return pY;;
stop
end
start
note right
doubleinverseProjectY(doublepY)
end note
:return pY;;
stop
end
start
note right
void setScale()
end note
end
@enduml

