@startuml
!pragma layout smetana
start
note right
constructor Marker(CoordinatepCoordinate,
StringpLabel,intpAlign)
end note
:fCoordinate=pCoordinate;;
:fLabel=pLabel;;
:fAlign=pAlign;;
end
start
note right
MarkercreateFromLine(StringpLine)
end note
:final ListlWords=StringParser.parse(pLine);;
:final doublelLat=Double.parseDouble((String)lWords.get(0));;
:final doublelLong=Double.parseDouble((String)lWords.get(1));;
:final StringlLabel=(String)lWords.get(2);;
:intlAlign=MarkerAlignDefault;;
if (lWords.size()>=4) then (yes) 
:StringlAlignString=(String)lWords.get(3);;
if (lAlignString.equalsIgnoreCase("left")) then (yes) 
:lAlign=MarkerAlignLeft;;
endif 
if (lAlignString.equalsIgnoreCase("right")) then (yes) 
:lAlign=MarkerAlignRight;;
endif 
if (lAlignString.equalsIgnoreCase("above")) then (yes) 
:lAlign=MarkerAlignAbove;;
endif 
if (lAlignString.equalsIgnoreCase("below")) then (yes) 
:lAlign=MarkerAlignBelow;;
endif 
endif 
:final CoordinatelPos=new Coordinate(lLat,
lLong);;
if (!lPos.check()) then (yes) 
:return null ;;
stop
endif 
:return new Marker(lPos,lLabel,lAlign);;
stop
end
start
note right
StringtoString()
end note
:return fLabel+" ("+fCoordinate+"), align: "+
fAlign;;
stop
end
start
note right
void render(PixelCanvaspCanvas,ProjectionpProjection)
end note
:final Point3DlPos=pProjection.rotate(fCoordinate.getPoint3D());;
if ((pProjection instanceof ProjectionOrtho)&&(lPos.getZ()<=0)) then (yes) 
:return ;;
stop
endif 
:Point2DlPoint=pProjection.finalize(pProjection.project2D(lPos));;
:final intlX=(int)lPoint.getX();;
:final intlY=(int)lPoint.getY();;
:Graphics2Dg2d=pCanvas.getGraphics2D();;
:g2d.setColor(Color.red);;
:g2d.drawOval(lX,lY,MARKER_SIZE,MARKER_SIZE);;
if (fLabel!=null ) then (yes) 
switch (switch (fAlign))
endswith
endif 
end
start
note right
MarkerloadMarkerFile(Stringline)
end note
:return createFromLine(line);;
stop
end
@enduml

