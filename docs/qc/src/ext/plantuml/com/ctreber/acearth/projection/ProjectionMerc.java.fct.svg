@startuml
!pragma layout smetana
start
note right
booleanisVisible(Point3DpPoint)
end note
:return true;;
stop
end
start
note right
CoordinategetLocation(intpX,intpY)
end note
:return rotateReverse(lRaw.getPoint3DRads())
.getCoordinate();;
stop
end
start
note right
void setScale()
end note
end
start
note right
doubleprojectX(doublepX,doublepZ)
end note
:return Math.atan2(pX,pZ);;
stop
end
start
note right
doubleinverseProjectX(doublepX)
end note
:return Math.sin(pX);;
stop
end
start
note right
doubleprojectY(doublepY)
end note
:return (pY>=0.9999999999)? 1e6:(pY<=-0.9999999999)? -1e6:Math.log(Math.tan(Math.asin(pY)/2+
Math.PI/4));;
stop
end
start
note right
doubleinverseProjectY(doubley)
end note
:return Math.sin(2*(Math.atan(Math.exp(y))-Math.PI/4));;
stop
end
@enduml

