@startuml
!pragma layout smetana
start
note right
void init()
end note
:final doubletmp=fTerminatorDiscontinuity/100;;
:fDaySideValueBase=(int)(tmp*fDaySideBrightness+
(1-tmp)*fNightSideBrightness);;
:fDaySideValueRange=fDaySideBrightness-fDaySideValueBase;;
:fLightVector=fProjection.rotate(fSunPos.getPoint3D());;
end
start
note right
ColorgetShadedColorForType(intpType,doublepSunValue)
end note
:doublelBrightness;;
if (pSunValue<0) then (yes) 
:lBrightness=fNightSideBrightness/100;;
else (no)
:lBrightness=(fDaySideValueBase+pSunValue*fDaySideValueRange)/100;;
endif 
if (lBrightness>1.0) then (yes) 
:lBrightness=1.0;;
endif 
switch (switch (pType))
endswith
:return null ;;
stop
end
start
note right
Colorshade(ColorpColor,doublepBrightness)
end note
:return new Color((int)(pColor.getRed()*pBrightness),
(int)(pColor.getGreen()*pBrightness),(int)(pColor.getBlue()*pBrightness));;
stop
end
start
note right
void setProjection(ProjectionpProjection)
end note
:fProjection=pProjection;;
end
start
note right
void setSunPos(CoordinatepSunPos)
end note
:fSunPos=pSunPos;;
end
start
note right
void setDaySideBrightness(doublepDaySideBrightness)
end note
:fDaySideBrightness=pDaySideBrightness;;
end
start
note right
void setNightSideBrightness(doublepNightSideBrightness)
end note
:fNightSideBrightness=pNightSideBrightness;;
end
start
note right
void setTerminatorDiscontinuity(doublepTerminatorDiscontinuity)
end note
:fTerminatorDiscontinuity=pTerminatorDiscontinuity;;
end
@enduml

