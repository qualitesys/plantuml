" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="181.5" x2="181.5" y1="916.5781" y2="936.5781"/><polygon fill="#181818" points="177.5,926.5781,181.5,936.5781,185.5,926.5781,181.5,930.5781" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7a44c8c9d851b5fee43a2156e92cc1bb]
@startuml
!pragma layout smetana
start
note right
constructor Polygon(intpType,Point3D[]pPoints)
end note
:fType=pType;
:fPoints=pPoints;
end
start
note right
intgetType()
end note
:return fType;;
stop
end
start
note right
Point3D[]getPoints()
end note
:return fPoints;;
stop
end
start
note right
Point3DgetPoint(intpIndex)
end note
:return fPoints[pIndex];;
stop
end
start
note right
intgetSize()
end note
:return fPoints.length;;
stop
end
start
note right
StringtoString()
end note
:return "Type "+fType+", "+fPoints.length+" points";;
stop
end
@enduml

