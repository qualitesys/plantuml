@startuml
!pragma layout smetana
start
note right
constructor Polygon(intpType,Point3D[]pPoints)
end note
end
start
note right
intgetType()
end note
:return fType;;
stop
end
start
note right
Point3D[]getPoints()
end note
:return fPoints;;
stop
end
