@startuml
!pragma layout smetana
start
note right
constructor Point2D(doublepX,doublepY)
end note
end
start
note right
doublegetX()
end note
:return fX;;
stop
end
start
note right
doublegetY()
end note
:return fY;;
stop
end
start
note right
StringtoString()
end note
:return "x: "+fX+", y: "+fY;;
stop
end
@enduml

