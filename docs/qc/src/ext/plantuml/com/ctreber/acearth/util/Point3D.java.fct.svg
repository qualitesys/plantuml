@startuml
!pragma layout smetana
start
note right
constructor Point3D(doublepX,doublepY,doublepZ)
end note
end
start
note right
doublegetX()
end note
:return fX;;
stop
end
start
note right
doublegetY()
end note
:return fY;;
stop
end
start
note right
doublegetZ()
end note
:return fZ;;
stop
end
start
note right
StringtoString()
end note
:return "x: "+fX+", y: "+fY+", z: "+fZ;;
stop
end
start
note right
CoordinategetCoordinate()
end note
:return new Coordinate(Toolkit.radsToDegs(Math.asin(fY)),
Toolkit.radsToDegs(Math.atan2(fX,fZ)));;
stop
end
@enduml

