@startuml
!pragma layout smetana
start
note right
constructor PluginMarkers(List<Marker>markers)
end note
:fMarkers=markers;
end
start
note right
booleanhasGUIP()
end note
:return false;;
stop
end
start
note right
void render()
end note
if (!fActiveP) then (yes) 
:return ;;
stop
endif 
while (lIt.hasNext())
:lMarker.render(fRenderTarget,fProjection);
endwhile
end
start
note right
StringtoString()
end note
:return "AC.earth Markers plug-in";;
stop
end
@enduml

