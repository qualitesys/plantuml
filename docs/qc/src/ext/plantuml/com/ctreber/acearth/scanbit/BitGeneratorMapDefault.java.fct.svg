@startuml
!pragma layout smetana
start
note right
constructor BitGeneratorMapDefault(ProjectionpProjection)
end note
:super (pProjection);;
end
start
note right
ComparatorgetEdgeXingComparator()
end note
:return new EdgeXingComparator();;
stop
end
start
note right
ScanBufscanOutline()
end note
:final ScanBuflScanBuf=new ScanBuf(fImageHeight,
fImageWidth);;
:final doublelLeft=fProjection.finalizeX(-Math.PI);;
:final doublelRight=fProjection.finalizeX(Math.PI);;
:final doublelTop=fProjection.finalizeY(1e6);;
:final doublelBottom=fProjection.finalizeY(-1e6);;
:lScanBuf.addLine(lRight,lTop,lLeft,lTop);;
:lScanBuf.addLine(lLeft,lTop,lLeft,lBottom);;
:lScanBuf.addLine(lLeft,lBottom,lRight,lBottom);;
:lScanBuf.addLine(lRight,lBottom,lRight,lTop);;
:return lScanBuf;;
stop
end
start
note right
void scanPolygon(ScanBufpScanBuf,Point3D[]pPoints3D,
Point2D[]pPoints2D,intpIndex)
end note
:final Point2DlCurr=pPoints2D[pIndex];;
:final intlIndexPrev=pIndex-1>=0? pIndex-1:pPoints2D.length-1;;
:final Point2DlPrev=pPoints2D[lIndexPrev];;
:doubledx=lCurr.getX()-lPrev.getX();;
if (Math.abs(dx)<=Math.PI) then (yes) 
:pScanBuf.addLine(fProjection.finalizeX(lPrev.getX()),
fProjection.finalizeY(lPrev.getY()),fProjection.finalizeX(lCurr.getX()),
fProjection.finalizeY(lCurr.getY()));;
:return ;;
stop
endif 
:intlAngle;;
:doublemx;;
:doublemy=getYMidPoint(pPoints3D[lIndexPrev],
pPoints3D[pIndex]);;
if (dx>0) then (yes) 
:mx=-Math.PI;;
:lAngle=2;;
else (no)
:mx=Math.PI;;
:lAngle=0;;
endif 
:pScanBuf.addLine(fProjection.finalizeX(lPrev.getX()),
fProjection.finalizeY(lPrev.getY()),fProjection.finalizeX(mx),
fProjection.finalizeY(my));;
:addEdgeXing(new EdgeCrossing(EdgeCrossing.XingTypeExit,
pIndex,mx,my,lAngle));;
if (dx>0) then (yes) 
:mx=Math.PI;;
:lAngle=0;;
else (no)
:mx=-Math.PI;;
:lAngle=2;;
endif 
:pScanBuf.addLine(fProjection.finalizeX(mx),
fProjection.finalizeY(my),fProjection.finalizeX(lCurr.getX()),
fProjection.finalizeY(lCurr.getY()));;
:addEdgeXing(new EdgeCrossing(EdgeCrossing.XingTypeEntry,
pIndex,mx,my,lAngle));;
end
start
note right
doublegetYMidPoint(Point3DpPrev,Point3DpCurr)
end note
:doublelY;;
:final doublelZ;;
if (pCurr.getX()!=0) then (yes) 
:doubleratio=(pPrev.getX()/pCurr.getX());;
:lY=pPrev.getY()-ratio*pCurr.getY();;
:lZ=pPrev.getZ()-ratio*pCurr.getZ();;
else (no)
:lY=pCurr.getY();;
:lZ=pCurr.getZ();;
endif 
:final doublelDistance=Math.sqrt((lY*lY)+
(lZ*lZ));;
:lY*=((lZ>0)? -1:1)/lDistance;;
:return fProjection.projectY(lY);;
stop
end
start
note right
void handleCrossings(ScanBufpScanBuf,EdgeCrossing[]xings)
end note
:EdgeCrossingfrom;;
:EdgeCrossingto;;
:intlStart;;
if (xings[0].getType()==EdgeCrossing.XingTypeExit) then (yes) 
:lStart=0;;
else (no)
:from=xings[xings.length-1];;
:to=xings[0];;
:addEdgeToScanbuf(pScanBuf,from,to);;
:lStart=1;;
endif 
:from=xings[i];;
:to=xings[i+1];;
:addEdgeToScanbuf(pScanBuf,from,to);;
end
start
note right
void addEdgeToScanbuf(ScanBufpScanBuf,EdgeCrossingfrom,
EdgeCrossingto)
end note
:intlAngleFrom=(int)from.getAngle();;
:doublelXFrom=fProjection.finalizeX(from.getX());;
:doublelYFrom=fProjection.finalizeY(from.getY());;
while (lAngleFrom!=(int)to.getAngle())
:intlAngleNew=0;;
:doublelXNew=0;;
:doublelYNew=0;;
switch (switch (lAngleFrom))
endswith
:pScanBuf.addLine(lXFrom,lYFrom,lXNew,lYNew);;
:lAngleFrom=lAngleNew;;
:lXFrom=lXNew;;
:lYFrom=lYNew;;
endwhile
:pScanBuf.addLine(lXFrom,lYFrom,fProjection.finalizeX(to.getX()),
fProjection.finalizeY(to.getY()));;
end
start
note right
intcompare(Objecto1,Objecto2)
end note
:final EdgeCrossinga=(EdgeCrossing)o1;;
:final EdgeCrossingb=(EdgeCrossing)o2;;
if (a.getAngle()<b.getAngle()) then (yes) 
:return -1;;
stop
endif 
if (a.getAngle()>b.getAngle()) then (yes) 
:return 1;;
stop
endif 
if (a.getAngle()==0) then (yes) 
:return (a.getY()<b.getY())? -1:(a.getY()>b.getY())? 1:0;;
stop
endif 
if (a.getAngle()==2) then (yes) 
:return (a.getY()>b.getY())? -1:(a.getY()<b.getY())? 1:0;;
stop
endif 
:throw new RuntimeException("No result");;
stop
end
@enduml

