818;stroke-width:1.0;"/><!--MD5=[5d069bd54db4561037cfb3e85a8b3f41]
@startuml
!pragma layout smetana
start
note right
void startNewRun()
end note
:fScanBitIndex=0;;
:generateScanToPixelTypeTable();;
end
start
note right
void getPixelTypes(intpRowNo,int[]pPixelTypes)
end note
:while ((fScanBitIndex<fScanBits.length)&&(fScanBits[fScanBitIndex].getY()==pRowNo)){for (inti=fScanBits[fScanBitIndex].getlXFrom();i<=fScanBits[fScanBitIndex].getXTo();i+
+){/** 
* This is weird ... why summing up the types ? Note the row stays the 
* same , but it possibly gets paved over a couple of times ( There 
* might be ScanBits painting on the same pixels ). 
* 
* The polygons specify - 1 as water and 1 as land . 
* The type table says space is 0 , Water is 1 to 64 ,
 Land is 65 + . 
* 
* The outline paints the whole world as water ( 64 ). Adding a 
* land pixel ( 1 )creates a value of 65 ( land ). Adding a water 
* pixel ( - 1 )changes this back to 64 ( water ). 
*/pPixelTypes[i]+=fScanBits[fScanBitIndex].getType();}fScanBitIndex++;};
:pPixelTypes[lCol]=fScanToPixelType[pPixelTypes[lCol]&0xff];;
end
start
note right
void generateScanToPixelTypeTable()
end note
if (i==0) then (yes) 
:fScanToPixelType[i]=BitGeneratorMap.PixTypeSpace;;
else (no)
:fScanToPixelType[i]=BitGeneratorMap.PixTypeWater;;
endif 
end
start
note right
void setScanBits(ScanBit[]pScanBits)
end note
:fScanBits=pScanBits;;
end
@enduml

