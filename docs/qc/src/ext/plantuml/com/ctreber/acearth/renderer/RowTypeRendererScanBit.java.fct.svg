 x1="591.5" x2="930" y1="596.9297" y2="596.9297"/><line style="stroke:#181818;stroke-width:1.0;" x1="930" x2="930" y1="596.9297" y2="638.332"/><polygon fill="#181818" points="926,628.332,930,638.332,934,628.332,930,632.332" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="930" x2="930" y1="672.3008" y2="695.7031"/><polygon fill="#181818" points="926,685.7031,930,695.7031,934,685.7031,930,689.7031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="202" x2="930" y1="695.7031" y2="695.7031"/><line style="stroke:#181818;stroke-width:1.0;" x1="565.5" x2="565.5" y1="695.7031" y2="715.7031"/><polygon fill="#181818" points="561.5,705.7031,565.5,715.7031,569.5,705.7031,565.5,709.7031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="565.5" x2="565.5" y1="768.2695" y2="790.8359"/><polygon fill="#181818" points="561.5,780.8359,565.5,790.8359,569.5,780.8359,565.5,784.8359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="565.5" x2="565.5" y1="824.8047" y2="844.8047"/><polygon fill="#181818" points="561.5,834.8047,565.5,844.8047,569.5,834.8047,565.5,838.8047" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b12e6029a53a73070102e8e9e159fe80]
@startuml
!pragma layout smetana
start
note right
void startNewRun()
end note
:fScanBitIndex=0;;
:generateScanToPixelTypeTable();;
end
start
note right
void getPixelTypes(intpRowNo,int[]pPixelTypes)
end note
:while ((fScanBitIndex<fScanBits.length)&&(fScanBits[fScanBitIndex].getY()==pRowNo)){for (inti=fScanBits[fScanBitIndex].getlXFrom();i<=fScanBits[fScanBitIndex].getXTo();i+
+){/** 
* This is weird ... why summing up the types ? Note the row stays the 
* same , but it possibly gets paved over a couple of times ( There 
* might be ScanBits painting on the same pixels ). 
* 
* The polygons specify - 1 as water and 1 as land . 
* The type table says space is 0 , Water is 1 to 64 ,
 Land is 65 + . 
* 
* The outline paints the whole world as water ( 64 ). Adding a 
* land pixel ( 1 )creates a value of 65 ( land ). Adding a water 
* pixel ( - 1 )changes this back to 64 ( water ). 
*/pPixelTypes[i]+=fScanBits[fScanBitIndex].getType();}fScanBitIndex++;};
:pPixelTypes[lCol]=fScanToPixelType[pPixelTypes[lCol]&0xff];;
end
start
note right
void generateScanToPixelTypeTable()
end note
if (i==0) then (yes) 
:fScanToPixelType[i]=BitGeneratorMap.PixTypeSpace;;
else if (i>64) then (yes) 
:fScanToPixelType[i]=BitGeneratorMap.PixTypeLand;;
else (no)
:fScanToPixelType[i]=BitGeneratorMap.PixTypeWater;;
endif 
end
start
note right
void setScanBits(ScanBit[]pScanBits)
end note
:fScanBits=pScanBits;;
end
@enduml

