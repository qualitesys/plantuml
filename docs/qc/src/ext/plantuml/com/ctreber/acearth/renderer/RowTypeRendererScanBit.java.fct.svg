ixels ).</text><ellipse cx="26.5" cy="320.5469" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><ellipse cx="26.5" cy="329.5156" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="306" x="32" y="334.1855">The polygons specify - 1 as water and 1 as land .</text><ellipse cx="26.5" cy="343.4844" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="310" x="32" y="348.1543">The type table says space is 0 , Water is 1 to 64 ,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86" x="25" y="362.123">Land is 65 + .</text><ellipse cx="26.5" cy="367.4531" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><ellipse cx="26.5" cy="376.4219" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="374" x="32" y="381.0918">The outline paints the whole world as water ( 64 ). Adding a</text><ellipse cx="26.5" cy="390.3906" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="373" x="32" y="395.0605">land pixel ( 1 )creates a value of 65 ( land ). Adding a water</text><ellipse cx="26.5" cy="404.3594" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279" x="32" y="409.0293">pixel ( - 1 )changes this back to 64 ( water ).</text><ellipse cx="26.5" cy="418.3281" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjus