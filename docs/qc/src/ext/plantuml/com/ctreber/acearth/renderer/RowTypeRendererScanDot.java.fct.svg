@startuml
!pragma layout smetana
start
note right
void startNewRun()
end note
:fScanDotIndex=0;;
end
start
note right
void getPixelTypes(intpRowNo,int[]pPixelTypes)
end note
:while ((fScanDotIndex<fScanDots.length)&&(fScanDots[fScanDotIndex].getY()==pRowNo)){ScanDotlDot=fScanDots[fScanDotIndex];
:if (lDot.getType()==ScanDot.DotTypeStar){if (pPixelTypes[lDot.getX()]==BitGeneratorMap.PixTypeSpace){pPixelTypes[lDot.getX()]=BitGeneratorMap.PixTypeStar;
:}}else {switch (pPixelTypes[lDot.getX()]){case BitGeneratorMap.PixTypeLand:pPixelTypes[lDot.getX()]=BitGeneratorMap.PixTypeGridLand;
:break ;case BitGeneratorMap.PixTypeWater:pPixelTypes[lDot.getX()]=BitGeneratorMap.PixTypeGridWater;
:break ;}}fScanDotIndex++;};
end
start
note right
void setScanDots(ScanDot[]pScanDots)
end note
:fScanDots=pScanDots;;
end
@enduml

