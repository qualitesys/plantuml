@startuml
!pragma layout smetana
start
note right
void startNewRun()
end note
:fScanDotIndex=0;;
end
start
note right
void getPixelTypes(intpRowNo,int[]pPixelTypes)
end note
while ((fScanDotIndex<fScanDots.length)&&(fScanDots[fScanDotIndex].getY()==pRowNo))
:ScanDotlDot=fScanDots[fScanDotIndex];;
if (lDot.getType()==ScanDot.DotTypeStar) then (yes) 
if (pPixelTypes[lDot.getX()]==BitGeneratorMap.PixTypeSpace) then (yes) 
:pPixelTypes[lDot.getX()]=BitGeneratorMap.PixTypeStar;;
endif 
else (no)
switch (switch pPixelTypes[lDot.getX()])
case (case BitGeneratorMap.PixTypeLand:) 
:pPixelTypes[lDot.getX()]=BitGeneratorMap.PixTypeGridLand;;
:break ;;
case (case BitGeneratorMap.PixTypeWater:) 
:pPixelTypes[lDot.getX()]=BitGeneratorMap.PixTypeGridWater;;
:break ;;
endswitch
endif 
:fScanDotIndex++;;
endwhile
end
start
note right
void setScanDots(ScanDot[]pScanDots)
end note
:fScanDots=pScanDots;;
end
@enduml

