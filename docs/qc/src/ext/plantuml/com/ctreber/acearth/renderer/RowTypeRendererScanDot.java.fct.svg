ont-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="153.0625">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="169.3594">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="152" x="5" y="185.6563">void startNewRun()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="201.9531">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="154" x="5" y="218.25">:fScanDotIndex=0;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="234.5469">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="250.8438">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="267.1406">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="378" x="5" y="283.4375">void getPixelTypes(intpRowNo,int[]pPixelTypes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="299.7344">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="718" x="5" y="316.0313">while ((fScanDotIndex&lt;fScanDots.length)&amp;&amp;(fScanDots[fScanDotIndex].getY()==pRowNo))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="332" x="5" y="332.3281">:ScanDotlDot=fScanDots[fScanDotIndex];;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="418" x="5" y="348.625">if (lDot.getType()==ScanDot.DotTypeStar) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="576" x="5" y="364.9219">if (pPixelTypes[lDot.getX()]==BitGeneratorMap.PixTypeSpace) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="453" x="5" y="381.2188">:pPixelTypes[lDot.getX()]=BitGeneratorMap.PixTypeStar;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="397.5156">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="70" x="5" y="413.8125">else (no)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="329" x="5" y="430.1094">switch (switch (pPixelTypes[lDot.getX()]))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="446.4063">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="462.7031">Syntax Error?</text><!--MD5=[c29a7e2cb3165fba95415c26bc96d479]
@startuml
!pragma layout smetana
start
note right
void startNewRun()
end note
:fScanDotIndex=0;;
end
start
note right
void getPixelTypes(intpRowNo,int[]pPixelTypes)
end note
while ((fScanDotIndex<fScanDots.length)&&(fScanDots[fScanDotIndex].getY()==pRowNo))
:ScanDotlDot=fScanDots[fScanDotIndex];;
if (lDot.getType()==ScanDot.DotTypeStar) then (yes) 
if (pPixelTypes[lDot.getX()]==BitGeneratorMap.PixTypeSpace) then (yes) 
:pPixelTypes[lDot.getX()]=BitGeneratorMap.PixTypeStar;;
endif 
else (no)
switch (switch (pPixelTypes[lDot.getX()]))
endswith
endif 
:fScanDotIndex++;;
endwhile
end
start
note right
void setScanDots(ScanDot[]pScanDots)
end note
:fScanDots=pScanDots;;
end
@enduml

