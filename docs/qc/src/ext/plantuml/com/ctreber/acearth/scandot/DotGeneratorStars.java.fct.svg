.3555" y2="650.3555"/><polygon fill="#181818" points="196.5,646.3555,186.5,650.3555,196.5,654.3555,192.5,650.3555" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="174.5" x2="174.5" y1="618.3555" y2="638.3555"/><polygon fill="#181818" points="170.5,628.3555,174.5,638.3555,178.5,628.3555,174.5,632.3555" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="174.5" x2="174.5" y1="502.0156" y2="522.0156"/><polygon fill="#181818" points="170.5,512.0156,174.5,522.0156,178.5,512.0156,174.5,516.0156" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="174.5" x2="174.5" y1="662.3555" y2="682.3555"/><polygon fill="#181818" points="170.5,672.3555,174.5,682.3555,178.5,672.3555,174.5,676.3555" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e2ac23d91caaf6df0bdfbdb64d332ad4]
@startuml
!pragma layout smetana
start
note right
constructor DotGeneratorStars(intpWidth,intpHeight,doublepStarFrequency,intpBigStars,Randomrnd)
end note
:lRandom=rnd;
:fImageWidth=pWidth;
:fImageHeight=pHeight;
:fStarFrequency=pStarFrequency;
:fBigStars=pBigStars;
end
start
note right
void generateScanDots()
end note
:i++;
:fDots.add(new ScanDot(ScanDot.DotTypeStar,
x,y));
if ((fBigStars!=0)&&(Math.random()*100<fBigStars)) then (yes) 
:fDots.add(new ScanDot(ScanDot.DotTypeStar,x+
1,y));
endif 
end
@enduml

