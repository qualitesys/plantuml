le="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="174.5" x2="174.5" y1="463.1797" y2="483.1797"/><polygon fill="#181818" points="170.5,473.1797,174.5,483.1797,178.5,473.1797,174.5,477.1797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="174.5" x2="174.5" y1="623.5195" y2="643.5195"/><polygon fill="#181818" points="170.5,633.5195,174.5,643.5195,178.5,633.5195,174.5,637.5195" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[776b169c0d60c35d738ee4ed26f2cbb1]
@startuml
!pragma layout smetana
start
note right
constructor DotGeneratorStars(intpWidth,intpHeight,
doublepStarFrequency,intpBigStars,Randomrnd)
end note
:lRandom=rnd;;
:fImageWidth=pWidth;;
:fImageHeight=pHeight;;
:fStarFrequency=pStarFrequency;;
:fBigStars=pBigStars;;
end
start
note right
void generateScanDots()
end note
:fDots.add(new ScanDot(ScanDot.DotTypeStar,
x,y));;
if ((fBigStars!=0)&&(Math.random()*100<fBigStars)) then (yes) 
:fDots.add(new ScanDot(ScanDot.DotTypeStar,x+
1,y));;
endif 
end
@enduml

