@startuml
!pragma layout smetana
start
note right
constructor Renderer(RenderTargetpRenderTarget)
end note
:fRenderTarget=pRenderTarget;;
end
start
note right
void render()
end note
:while (lIt.hasNext()){RowTypeRendererlRowRenderer=(RowTypeRenderer)lIt.next();
:lRowRenderer.startNewRun();};
:renderRows();;
end
start
note right
void renderRows()
end note
:renderRow(lRowNo,lPixelTypes);;
end
start
note right
int[]getPixelTypes(intpRowNo)
end note
:while (lIt.hasNext()){RowTypeRendererlRowRenderer=(RowTypeRenderer)lIt.next();lRowRenderer.getPixelTypes(pRowNo,
lPixelTypes);};
:return lPixelTypes;;
stop
end
start
note right
void renderRow(intpRowNo,int[]pPixelTypes)
end note
:fRenderTarget.setPixel(lColNo,pRowNo,lPixelColors[lColNo]);;
end
start
note right
void setShader(ShaderpShader)
end note
:fShader=pShader;;
end
start
note right
void setRenderTarget(RenderTargetpRenderTarget)
end note
:fRenderTarget=pRenderTarget;;
end
start
note right
void addRowTypeRenderer(RowTypeRendererpRowRenderer)
end note
:fRowTypeRenderers.add(pRowRenderer);;
end
@enduml

