@startuml
!pragma layout smetana
start
note right
constructor ScanDot(intpType,intpX,intpY)
end note
:fType=pType;
:fX=pX;
:fY=pY;
end
start
note right
constructor ScanDot(intpType,Point2DpPoint)
end note
:fType=pType;
:fX=(int)pPoint.getX();
:fY=(int)pPoint.getY();
end
start
note right
intcompareTo(Objecto)
end note
if (o instanceof ScanDot) then (yes) 
:return fY>lOther.fY? 1:(fY<lOther.fY? -1:0);;
stop
endif 
:throw new IllegalArgumentException("Can't compare to "+o.getClass());;
end
start
note right
intgetType()
end note
:return fType;;
stop
end
start
note right
intgetX()
end note
:return fX;;
stop
end
start
note right
intgetY()
end note
:return fY;;
stop
end
start
note right
StringtoString()
end note
:return fX+", "+fY+": "+fType;;
stop
end
@enduml

