@startuml
!pragma layout smetana
start
note right
Polygon[]readMapData()
end note
if (lLine.contains("/*")) then (yes) 
endif 
while (lST.hasMoreTokens())
endwhile
while (getValue(fIndex)!=0)
endwhile
:return (Polygon[])fPolygons.toArray(new Polygon[0]);;
stop
end
start
note right
void processCurve()
end note
end
start
note right
intgetValue(intpIndex)
end note
:return ((Integer)fData.get(pIndex)).intValue();;
stop
end
@enduml

