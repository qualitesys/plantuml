@startuml
!pragma layout smetana
start
note right
Polygon[]readMapData()
end note
:fData=new ArrayList();
if (lLine.contains("/*")) then (yes) 
endif 
while (lST.hasMoreTokens())
:fData.add(lValue);
endwhile
:fPolygons=new ArrayList();
:fIndex=0;
while (getValue(fIndex)!=0)
:processCurve();
endwhile
:return (Polygon[])fPolygons.toArray(new Polygon[0]);;
stop
end
start
note right
void processCurve()
end note
:lPoints[0]=lPoint3D;
:i++;
:lPoints[i]=new Point3D(lPoints[i-1].getX()+getValue(fIndex++)/MAP_DATA_SCALE,
lPoints[i-1].getY()+getValue(fIndex++)/MAP_DATA_SCALE,
lPoints[i-1].getZ()+getValue(fIndex++)/MAP_DATA_SCALE);
:fPolygons.add(lPolygon);
end
start
note right
intgetValue(intpIndex)
end note
:return ((Integer)fData.get(pIndex)).intValue();;
stop
end
@enduml

