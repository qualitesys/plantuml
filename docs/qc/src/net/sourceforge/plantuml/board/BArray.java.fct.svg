@startuml
!pragma layout smetana
start
note right
void put(BNodenode)
end note
if (data.containsKey(key)) then (yes) 
:throw new IllegalArgumentException();;
endif 
:data.put(key,node);
:this.maxX=Math.max(this.maxX,node.getX());
:this.maxY=Math.max(this.maxY,node.getStage());
end
start
note right
BNodegetCell(intx,inty)
end note
:return data.get(key);;
stop
end
start
note right
StringgetKey(intx,inty)
end note
:return ""+x+";"+y;;
stop
end
start
note right
Iterator<BNode>iterator()
end note
:return Collections.unmodifiableCollection(data.values())
.iterator();;
stop
end
start
note right
intgetMaxX()
end note
:return maxX;;
stop
end
start
note right
intgetMaxY()
end note
:return maxY;;
stop
end
@enduml

