@startuml
!pragma layout smetana
start
note right
constructor PngFlashcoder(List<BufferedImage>flashcodes)
end note
:this.flashcodes=flashcodes;
end
start
note right
BufferedImageprocessImage(BufferedImageim,Colorbackground)
end note
if (flashcodes!=null ) then (yes) 
:im=addImage(im,background);
endif 
:return im;;
stop
end
start
note right
BufferedImageaddImage(BufferedImageim,Colorbackground)
end note
:UAntiAliasing.ANTI_ALIASING_OFF.apply(g2d);
:g2d.setColor(background);
:g2d.fillRect(0,0,newIm.getWidth(),newIm.getHeight());
:g2d.drawImage(im,null ,0,0);
:g2d.drawImage(f,null ,x,(int)im.getHeight());
:x+=f.getWidth();
:g2d.dispose();
:return newIm;;
stop
end
start
note right
intgetHeight(List<BufferedImage>flashcodes)
end note
:result=Math.max(result,im.getWidth());
:return result;;
stop
end
start
note right
intgetWidth(List<BufferedImage>flashcodes)
end note
:result+=im.getWidth();
:return result;;
stop
end
@enduml

