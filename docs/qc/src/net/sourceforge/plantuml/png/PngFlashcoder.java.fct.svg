,1099.6914,192.5,1089.6914,188.5,1093.6914" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188.5" x2="188.5" y1="1133.6602" y2="1153.6602"/><polygon fill="#181818" points="184.5,1143.6602,188.5,1153.6602,192.5,1143.6602,188.5,1147.6602" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188.5" x2="188.5" y1="1238.2266" y2="1260.793"/><polygon fill="#181818" points="184.5,1250.793,188.5,1260.793,192.5,1250.793,188.5,1254.793" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188.5" x2="188.5" y1="1294.7617" y2="1314.7617"/><polygon fill="#181818" points="184.5,1304.7617,188.5,1314.7617,192.5,1304.7617,188.5,1308.7617" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188.5" x2="188.5" y1="1348.7305" y2="1368.7305"/><polygon fill="#181818" points="184.5,1358.7305,188.5,1368.7305,192.5,1358.7305,188.5,1362.7305" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[55223a25a8d33b03ddd5e9bff69dbb7a]
@startuml
!pragma layout smetana
start
note right
constructor PngFlashcoder(List<BufferedImage>flashcodes)
end note
:this.flashcodes=flashcodes;;
end
start
note right
BufferedImageprocessImage(BufferedImageim,
Colorbackground)
end note
if (flashcodes!=null ) then (yes) 
:im=addImage(im,background);;
endif 
:return im;;
stop
end
start
note right
BufferedImageaddImage(BufferedImageim,Colorbackground)
end note
:UAntiAliasing.ANTI_ALIASING_OFF.apply(g2d);;
:g2d.setColor(background);;
:g2d.fillRect(0,0,newIm.getWidth(),newIm.getHeight());;
:g2d.drawImage(im,null ,0,0);;
:g2d.drawImage(f,null ,x,(int)im.getHeight());;
:x+=f.getWidth();;
:g2d.dispose();;
:return newIm;;
stop
end
start
note right
intgetHeight(List<BufferedImage>flashcodes)
end note
:result=Math.max(result,im.getWidth());;
:return result;;
stop
end
start
note right
intgetWidth(List<BufferedImage>flashcodes)
end note
:result+=im.getWidth();;
:return result;;
stop
end
@enduml

