.1211" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="113.5" x2="113.5" y1="599.9766" y2="619.9766"/><polygon fill="#181818" points="109.5,609.9766,113.5,619.9766,117.5,609.9766,113.5,613.9766" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c4fd1a351d1273b9d5d48014a550e75d]
@startuml
!pragma layout smetana
start
note right
BufferedImageprocess(BufferedImageim,intminsize)
end note
if (minsize!=Integer.MAX_VALUE) then (yes) 
:return resize(im,minsize);;
stop
endif 
:return im;;
stop
end
start
note right
BufferedImageresize(BufferedImageim,intminsize)
end note
if (im.getWidth()>=minsize) then (yes) 
:return im;;
stop
endif 
:return newIm;;
stop
end
@enduml

