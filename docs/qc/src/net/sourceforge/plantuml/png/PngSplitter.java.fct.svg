@startuml
!pragma layout smetana
start
note right
constructor PngSplitter(SuggestedFilepngFile,
inthorizontalPages,intverticalPages,Stringmetadata,
intdpi,SplitParamsplitParam)
end note
if (horizontalPages==1&&verticalPages==1) then (yes) 
:return ;;
stop
endif 
if (ok==false) then (yes) 
:throw new IOException("Cannot rename");;
endif 
if (splitParam.isSet()) then (yes) 
if (splitParam.getExternalColor()!=null ) then (yes) 
endif 
if (splitParam.getBorderColor()!=null ) then (yes) 
endif 
endif 
end
start
note right
List<SFile>getFiles()
end note
:return Collections.unmodifiableList(files);;
stop
end
@enduml

