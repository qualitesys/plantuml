@startuml
!pragma layout smetana
start
note right
constructor BodyEnhanced1(HorizontalAlignmentalign,
List<CharSequence>rawBody,ISkinParamskinParam,
ILeafentity,Stylestyle)
end note
:super (align,style.getFontConfiguration(skinParam.getIHtmlColorSet(),
entity.getColors()),style);
:this.style=style;
:this.rawBody2=Display.create(rawBody);
:this.skinParam=skinParam;
:this.lineFirst=true;
:this.entity=entity;
:this.inEllipse=false;
end
start
note right
constructor BodyEnhanced1(HorizontalAlignmentalign,
Displaydisplay,ISkinParamskinParam,ILeafentity,
Stylestyle)
end note
:super (align,style.getFontConfiguration(skinParam.getIHtmlColorSet(),
entity.getColors()),style);
:this.style=style;
:this.entity=entity;
:this.skinParam=skinParam;
:this.lineFirst=false;
:this.inEllipse=leafType==LeafType.USECASE||leafType==LeafType.USECASE_BUSINESS;
if (inEllipse&&display.size()>0&&isBlockSeparator(display.get(0)
.toString())) then (yes) 
:display=display.add("");
endif 
:this.rawBody2=display;
end
start
note right
doublegetMarginX()
end note
:return 6;;
stop
end
start
note right
booleanisTreeOrTable(Strings)
end note
:s=StringUtils.trinNoTrace(s);
:return Parser.isTreeStart(s)||CreoleParser.isTableLine(s);;
stop
end
start
note right
TextBlockgetArea(StringBounderstringBounder)
end note
if (area!=null ) then (yes) 
:return area;;
stop
endif 
:urls.clear();
:ListIterator<CharSequence>it=rawBody2.iterator();
if (cs instanceof EmbeddedDiagram) then (yes) 
if (display==null ) then (yes) 
:display=Display.empty();
endif 
if (display.size()>0||separator!=0) then (yes) 
:blocks.add(buildTextBlock(display,separator,
title,stringBounder));
:separator=0;
:title=null ;
:display=null ;
endif 
:blocks.add(TextBlockUtils.withMargin(((EmbeddedDiagram)cs).asDraw(skinParam),
2,2));
else (no)
if (isBlockSeparator(s)) then (yes) 
if (display==null ) then (yes) 
:display=Display.empty();
endif 
:blocks.add(buildTextBlock(display,separator,
title,stringBounder));
:separator=s.charAt(0);
:title=getTitle(s,skinParam);
:display=null ;
else (no)
if (display==null ) then (yes) 
:display=Display.empty();
endif 
:display=display.add(cs);
if (cs instanceof Member&&((Member)cs).getUrl()!=null ) then (yes) 
:urls.add(((Member)cs).getUrl());
endif 
endif 
endif 
if (display==null ) then (yes) 
:display=Display.empty();
endif 
if (inEllipse&&display.size()==0) then (yes) 
:display=display.add("");
endif 
:blocks.add(buildTextBlock(display,separator,
title,stringBounder));
if (blocks.size()==1) then (yes) 
:this.area=blocks.get(0);
else (no)
:this.area=new TextBlockVertical2(blocks,
align);
endif 
if (minClassWidth>0) then (yes) 
:this.area=TextBlockUtils.withMinWidth(this.area,
minClassWidth,align);
endif 
:return area;;
stop
end
start
note right
TextBlockbuildTextBlock(Displaydisplay,charseparator,
TextBlocktitle,StringBounderstringBounder)
end note
:result=decorate(result,separator,title,stringBounder);
:return result;;
stop
end
start
note right
List<CharSequence>buildTreeOrTable(Stringinit,
ListIterator<CharSequence>it)
end note
if (m.find()) then (yes) 
:start=m.group(1);
endif 
:result.add(purge(init,start));
while (it.hasNext())
if (isTreeOrTable(s)) then (yes) 
:result.add(purge(s,start));
else (no)
:it.previous();
:return result;;
stop
endif 
endwhile
:return result;;
stop
end
start
note right
Stringpurge(Strings,Stringstart)
end note
if (s.startsWith(start)) then (yes) 
:return s.substring(start.length());;
stop
endif 
:return s;;
stop
end
start
note right
PortsgetPorts(StringBounderstringBounder)
end note
if (area instanceof WithPorts) then (yes) 
:return ((WithPorts)area).getPorts(stringBounder);;
stop
endif 
:return new Ports();;
stop
end
start
note right
List<Url>getUrls()
end note
:return Collections.unmodifiableList(urls);;
stop
end
start
note right
XRectangle2DgetInnerPosition(Stringmember,
StringBounderstringBounder,InnerStrategystrategy)
