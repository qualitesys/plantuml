@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "label='"+label+"' spriteName='"+
spriteName+"'";;
stop
end
start
note right
List<String>getStyleNames()
end note
if (spriteName==null ) then (yes) 
:return Collections.unmodifiableList(result);;
stop
endif 
if (idx!=-1) then (yes) 
:result.add(spriteName.substring(idx+1));
endif 
:return Collections.unmodifiableList(result);;
stop
end
start
note right
constructor StereotypeDecoration(Stringlabel,
HColorhtmlColor,charcharacter,StringspriteName,
doublespriteScale)
end note
:this.label=label;
:this.htmlColor=htmlColor;
:this.character=character;
:this.spriteName=spriteName;
:this.spriteScale=spriteScale;
end
start
note right
StereotypeDecorationbuildSimple(Stringname)
end note
if (name.startsWith("<<$")&&name.endsWith(">>")) then (yes) 
:spriteName=mCircleSprite.get("NAME",0);
:spriteScale=Parser.getScale(mCircleSprite.get("SCALE",
0),1);
else (no)
:spriteName=null ;
:spriteScale=0;
endif 
:return new StereotypeDecoration(name,null ,
'\0',spriteName,spriteScale);;
stop
end
start
note right
StereotypeDecorationbuildComplex(Stringfull,
HColorSethtmlColorSet)
end note
if (mCircleSprite!=null ) then (yes) 
if (StringUtils.isNotEmpty(mCircleSprite.get("LABEL",
0))) then (yes) 
:name="<<"+mCircleSprite.get("LABEL",0)+">>";
else (no)
:name="";
endif 
:htmlColor=col==null ? HColors.BLACK:col;
:character='\0';
:spriteName=mCircleSprite.get("NAME",0);
:spriteScale=Parser.getScale(mCircleSprite.get("SCALE",
0),1);
endif 
:label=label+name;
:return new StereotypeDecoration(label,htmlColor,
character,spriteName,spriteScale);;
stop
end
start
note right
List<String>cutLabels(final Stringlabel,Guillemetguillemet)
end note
while (m.find())
if (group.startsWith("<<<")==false) then (yes) 
:result.add(guillemet.manageGuillemetStrict(group));
endif 
endwhile
:return Collections.unmodifiableList(result);;
stop
end
@enduml

