@startuml
!pragma layout smetana
start
note right
constructor DisplayPositioned(Displaydisplay,
HorizontalAlignmenthorizontalAlignment,VerticalAlignmentverticalAlignment)
end note
end
start
note right
DisplayPositionedsingle(Displaydisplay,HorizontalAlignmenthorizontalAlignment,
VerticalAlignmentverticalAlignment)
end note
:return new DisplayPositioned(display,horizontalAlignment,
verticalAlignment);;
stop
end
start
note right
DisplayPositionednone(HorizontalAlignmenthorizontalAlignment,
VerticalAlignmentverticalAlignment)
end note
:return new DisplayPositioned(Display.NULL,
horizontalAlignment,verticalAlignment);;
stop
end
start
note right
DisplaygetDisplay()
end note
:return display;;
stop
end
start
note right
HorizontalAlignmentgetHorizontalAlignment()
end note
:return horizontalAlignment;;
stop
end
start
note right
VerticalAlignmentgetVerticalAlignment()
end note
:return verticalAlignment;;
stop
end
start
note right
booleanisNull()
end note
:return Display.isNull(display);;
stop
end
start
note right
booleanhasUrl()
end note
:return display.hasUrl();;
stop
end
@enduml

