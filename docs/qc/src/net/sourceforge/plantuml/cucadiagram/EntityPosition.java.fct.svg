 fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="185" x="5" y="176.3438">... ( skipping 105 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="192.6406">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="208.9375">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="225.2344">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="564" x="5" y="241.5313">if (String.valueOf("&lt;&lt;exitpoint&gt;&gt;").equalsIgnoreCase(label)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="160" x="5" y="257.8281">:return EXIT_POINT;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="274.125">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="290.4219">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="559" x="5" y="306.7188">if (String.valueOf("&lt;&lt;inputpin&gt;&gt;").equalsIgnoreCase(label)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="151" x="5" y="323.0156">:return INPUT_PIN;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="339.3125">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="355.6094">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="571" x="5" y="371.9063">if (String.valueOf("&lt;&lt;outputpin&gt;&gt;").equalsIgnoreCase(label)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="169" x="5" y="388.2031">:return OUTPUT_PIN;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="404.5">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="420.7969">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="616" x="5" y="437.0938">if (String.valueOf("&lt;&lt;expansioninput&gt;&gt;").equalsIgnoreCase(label)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="214" x="5" y="453.3906">:return EXPANSION_INPUT;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="469.6875">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="485.9844">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="340" x="5" y="502.2813">if (String.valueOf("&lt;&lt;expansionoutput&gt;&gt;")</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="288" x="5" y="518.5781">.equalsIgnoreCase(label)) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[688561c66d191e3ececf198cb802a9f4]
@startuml
!pragma layout smetana
start
note right
EnumSet<EntityPosition>getInputs()
end note
:return EnumSet.of(ENTRY_POINT,INPUT_PIN,
EXPANSION_INPUT,PORTIN);;
stop
end
start
note right
EnumSet<EntityPosition>getOutputs()
end note
:return EnumSet.of(EXIT_POINT,OUTPUT_PIN,
EXPANSION_OUTPUT,PORTOUT);;
stop
end
start
note right
EnumSet<EntityPosition>getNormals()
end note
:return EnumSet.of(NORMAL);;
stop
end
start
note right
booleanisNormal()
end note
:return this==NORMAL;;
stop
end
start
note right
booleanisInput()
end note
:return getInputs().contains(this);;
stop
end
start
note right
booleanisOutput()
end note
:return getOutputs().contains(this);;
stop
end
start
note right
void drawSymbol(UGraphicug,Rankdirrankdir)
end note
if (this==NORMAL) then (yes) 
:throw new IllegalStateException();;
endif 
end
start
note right
XDimension2DgetDimension(Rankdirrankdir)
end note
if (this==EXPANSION_INPUT||this==EXPANSION_OUTPUT) then (yes) 
if (rankdir==Rankdir.TOP_TO_BOTTOM) then (yes) 
:return new XDimension2D(EntityPosition.RADIUS*2*4,
EntityPosition.RADIUS*2);;
stop
endif 
:return new XDimension2D(EntityPosition.RADIUS*2,
EntityPosition.RADIUS*2*4);;
stop
endif 
:return new XDimension2D(EntityPosition.RADIUS*2,
EntityPosition.RADIUS*2);;
stop
end
start
note right
XPoint2DgetPointOnCircle(doublexc,doubleyc,
doubleangle,doubleradius)
end note
:return new XPoint2D(x,y);;
stop
end
start
note right
void drawLine(UGraphicug,XPoint2Dp1,XPoint2Dp2)
end note
:ug.apply(new UTranslate(p1.getX(),p1.getY())).draw(new ULine(dx,
dy));
end
start
note right
ShapeTypegetShapeType()
end note
if (this==NORMAL) then (yes) 
:throw new IllegalStateException();;
endif 
if (this==ENTRY_POINT||this==EXIT_POINT) then (yes) 
:return ShapeType.RECTANGLE_PORT;;
stop
endif 
:return ShapeType.RECTANGLE;;
stop
end
start
note right
EntityPositionfromStereotype(Stringlabel)
end note
if (String.valueOf("<<port>>").equalsIgnoreCase(label)) then (yes) 
:throw new UnsupportedOperationException();;
endif 
if (String.valueOf("<<entrypoint>>").equalsIgnoreCase(label)) then (yes) 
:return ENTRY_POINT;;
stop
endif 
if (String.valueOf("<<exitpoint>>").equalsIgnoreCase(label)) then (yes) 
:return EXIT_POINT;;
stop
endif 
if (String.valueOf("<<inputpin>>").equalsIgnoreCase(label)) then (yes) 
:return INPUT_PIN;;
stop
endif 
if (String.valueOf("<<outputpin>>").equalsIgnoreCase(label)) then (yes) 
:return OUTPUT_PIN;;
stop
endif 
if (String.valueOf("<<expansioninput>>").equalsIgnoreCase(label)) then (yes) 
:return EXPANSION_INPUT;;
stop
endif 
if (String.valueOf("<<expansionoutput>>")
.equalsIgnoreCase(label)) then (yes) 
:return EXPANSION_OUTPUT;;
stop
endif 
:return EntityPosition.NORMAL;;
stop
end
start
note right
booleanisPort()
end note
:return this==PORTIN||this==PORTOUT;;
stop
end
start
note right
booleanusePortP()
end note
:return isPort()||this==EXIT_POINT||this==ENTRY_POINT;;
stop
end
@enduml

