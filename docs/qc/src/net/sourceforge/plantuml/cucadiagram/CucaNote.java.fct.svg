@startuml
!pragma layout smetana
start
note right
constructor CucaNote(Displaydisplay,Positionposition,
Colorscolors,NoteLinkStrategystrategy)
end note
end
start
note right
CucaNotebuild(Displaydisplay,Positionposition,
Colorscolors)
end note
:return new CucaNote(display,position,colors,
NoteLinkStrategy.NORMAL);;
stop
end
start
note right
CucaNotewithStrategy(NoteLinkStrategystrategy)
end note
:return new CucaNote(display,position,colors,
strategy);;
stop
end
start
note right
DisplaygetDisplay()
end note
:return display;;
stop
end
start
note right
NoteLinkStrategygetStrategy()
end note
:return strategy;;
stop
end
start
note right
ColorsgetColors()
end note
:return colors;;
stop
end
start
note right
PositiongetPosition()
end note
:return position;;
stop
end
@enduml

