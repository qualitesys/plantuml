@startuml
!pragma layout smetana
start
note right
void muteClassToObject()
end note
:methodsToDisplay=null ;
:fieldsToDisplay=null ;
:type=LeafType.OBJECT;
end
start
note right
constructor BodierLikeClassOrObject(LeafTypetype,
Set<VisibilityModifier>hides)
end note
if (type==LeafType.MAP) then (yes) 
:throw new IllegalArgumentException();;
endif 
:this.type=Objects.requireNonNull(type);
:this.hides=hides;
end
start
note right
void setLeaf(ILeafleaf)
end note
:this.leaf=Objects.requireNonNull(leaf);
end
start
note right
booleanaddFieldOrMethod(Strings)
end note
:methodsToDisplay=null ;
:fieldsToDisplay=null ;
:rawBody.add(s);
:return true;;
stop
end
start
note right
booleanisBodyEnhanced()
end note
if (BodyEnhanced1.isBlockSeparator(s)||CreoleParser.isTableLine(s.toString())||Parser.isTreeStart(s.toString())) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleanisMethod(CharSequences)
end note
if (purged.contains("{method}")) then (yes) 
:return true;;
stop
endif 
if (purged.contains("{field}")) then (yes) 
:return false;;
stop
endif 
:return purged.contains("(")||purged.contains(")");;
stop
end
start
note right
DisplaygetMethodsToDisplay()
end note
if (methodsToDisplay==null ) then (yes) 
:methodsToDisplay=new ArrayList<>();
:i++;
if (isMethod(i,rawBody)==false) then (yes) 
endif 
if (s.length()==0&&methodsToDisplay.size()==0) then (yes) 
endif 
if (hides==null ||hides.contains(m.getVisibilityModifier())==false) then (yes) 
:methodsToDisplay.add(m);
endif 
:removeFinalEmptyMembers(methodsToDisplay);
endif 
:return Display.create(methodsToDisplay);;
stop
end
start
note right
booleanisMethod(inti,List<CharSequence>rawBody)
end note
if (i>0&&i<rawBody.size()-1&&rawBody.get(i).length()==0&&isMethod(rawBody.get(i-1))&&isMethod(rawBody.get(i+
1))) then (yes) 
:return true;;
stop
endif 
:return isMethod(rawBody.get(i));;
stop
end
start
note right
DisplaygetFieldsToDisplay()
end note
if (fieldsToDisplay==null ) then (yes) 
:fieldsToDisplay=new ArrayList<>();
if (type!=LeafType.OBJECT&&isMethod(s)==true) then (yes) 
endif 
if (s.length()==0&&fieldsToDisplay.size()==0) then (yes) 
endif 
if (hides==null ||hides.contains(m.getVisibilityModifier())==false) then (yes) 
:fieldsToDisplay.add(m);
endif 
:removeFinalEmptyMembers(fieldsToDisplay);
endif 
:return Display.create(fieldsToDisplay);;
stop
end
start
note right
void removeFinalEmptyMembers(List<Member>result)
end note
while (result.size()>0&&StringUtils.trin(result.get(result.size()-1)
.getDisplay(false)).length()==0)
:result.remove(result.size()-1);
endwhile
end
start
note right
booleanhasUrl()
end note
if (cs instanceof Member) then (yes) 
if (m.hasUrl()) then (yes) 
:return true;;
stop
endif 
endif 
if (cs instanceof Member) then (yes) 
if (m.hasUrl()) then (yes) 
:return true;;
stop
endif 
endif 
:return false;;
stop
end
start
note right
List<CharSequence>rawBodyWithoutHidden()
end note
if (isMethod(s)) then (yes) 
:m=Member.method(s);
else (no)
:m=Member.field(s);
endif 
if (hides.contains(m.getVisibilityModifier())==false) then (yes) 
:result.add(m);
endif 
:return result;;
stop
end
start
note right
TextBlockgetBody(ISkinParamskinParam,booleanshowMethods,
booleanshowFields,Stereotypestereotype,Stylestyle,
FontConfigurationfontConfiguration)
end note
if (BodyFactory.BODY3) then (yes) 
:return new Body3(rawBody,skinParam,stereotype,
style);;
stop
endif 
if (type.isLikeClass()&&isBodyEnhanced()) then (yes) 
if (showMethods||showFields) then (yes) 
:return BodyFactory.create1(skinParam.getDefaultTextAlignment(HorizontalAlignment.LEFT),
rawBodyWithoutHidden(),skinParam,stereotype,
leaf,style);;
stop
endif 
:return null ;;
stop
endif 
if (leaf==null ) then (yes) 
:throw new IllegalStateException();;
endif 
if (type==LeafType.OBJECT) then (yes) 
if (showFields==false) then (yes) 
:return new TextBlockLineBefore(style.value(PName.LineThickness).asDouble(),
TextBlockUtils.empty(0,0));;
stop
endif 
:return BodyFactory.create1(skinParam.getDefaultTextAlignment(HorizontalAlignment.LEFT),
rawBodyWithoutHidden(),skinParam,stereotype,
leaf,style);;
stop
endif 
if (showFields&&showMethods==false) then (yes) 
:return fields.asBlockMemberImpl();;
stop
endif 
:return TextBlockUtils.mergeTB(bb1,bb2,HorizontalAlignment.LEFT);;
stop
end
start
note right
List<CharSequence>getRawBody()
end note
:return Collections.unmodifiableList(rawBody);;
stop
end
