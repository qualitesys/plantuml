@startuml
!pragma layout smetana
start
note right
constructor CodeImpl(Stringname)
end note
end
start
note right
Codeof(Stringcode)
end note
if (code==null ) then (yes) 
endif 
:return new CodeImpl(code);;
stop
end
start
note right
StringgetName()
end note
:return name;;
stop
end
start
note right
StringtoString()
end note
:return name;;
stop
end
start
note right
inthashCode()
end note
:return name.hashCode();;
stop
end
start
note right
booleanequals(Objectobj)
end note
:return this.name.equals(other.name);;
stop
end
start
note right
CodeeventuallyRemoveStartingAndEndingDoubleQuote(Stringformat)
end note
:return CodeImpl.of(StringUtils.eventuallyRemoveStartingAndEndingDoubleQuote(getName(),
format));;
stop
end
