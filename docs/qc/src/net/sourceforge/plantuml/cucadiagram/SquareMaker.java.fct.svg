@startuml
!pragma layout smetana
start
note right
void putInSquare(List<O>data,SquareLinker<O>linker)
end note
if (dist==branch) then (yes) 
else (no)
endif 
end
start
note right
intcomputeBranch(final intsize)
end note
if (r*r==size) then (yes) 
:return r;;
stop
endif 
:return r+1;;
stop
end
start
note right
intgetBottomLeft(final intsize)
end note
:return line*s;;
stop
end
@enduml

