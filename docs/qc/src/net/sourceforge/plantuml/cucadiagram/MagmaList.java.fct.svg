@startuml
!pragma layout smetana
start
note right
void add(Magmamagma)
end note
:all.add(magma);;
end
start
note right
MagmaListgetMagmas(IGroupgroup)
end note
if (m.getContainer()==group) then (yes) 
:result.add(m);;
endif 
:return result;;
stop
end
start
note right
intsize()
end note
:return all.size();;
stop
end
start
note right
void putInSquare()
end note
start
note right
void topDown(Magmatop,Magmadown)
end note
:top.linkToDown(down);;
end
start
note right
void leftRight(Magmaleft,Magmaright)
end note
:left.linkToRight(right);;
end
:new SquareMaker<Magma>().putInSquare(all,
linker);;
end
@enduml

