@startuml
!pragma layout smetana
start
note right
constructor LinkConstraint(Linklink1,Linklink2,Displaydisplay)
end note
:this.link1=link1;
:this.link2=link2;
:this.display=display;
end
start
note right
void setPosition(Linklink,XPoint2Dpt)
end note
if (link==link1) then (yes) 
:x1=pt.getX();
:y1=pt.getY();
else (no)
:throw new IllegalArgumentException();;
endif 
end
start
note right
void drawMe(UGraphicug,ISkinParamskinParam)
end note
if (x1==0&&y1==0) then (yes) 
:return ;;
stop
endif 
if (x2==0&&y2==0) then (yes) 
:return ;;
stop
endif 
:ug=ug.apply(HColors.BLACK);
:ug=ug.apply(new UStroke(3,3,1));
:ug.apply(new UTranslate(x1,y1)).draw(line);
:label.drawU(ug.apply(new UTranslate(x,y)));
end
@enduml

