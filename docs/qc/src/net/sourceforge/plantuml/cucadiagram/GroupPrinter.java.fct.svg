@startuml
!pragma layout smetana
start
note right
constructor GroupPrinter(PrintWriterpw)
end note
end
start
note right
void printGroup(IGroupgroup)
end note
if (group.getLeafsDirect().size()==0) then (yes) 
else (no)
endif 
if (group.getChildren().size()>0) then (yes) 
endif 
end
start
note right
void printLeaf(ILeafleaf)
end note
end
start
note right
void print(SFilef,IGrouprootGroup)
end note
end
@enduml

