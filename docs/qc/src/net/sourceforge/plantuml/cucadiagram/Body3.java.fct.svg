@startuml
!pragma layout smetana
start
note right
constructor Body3(List<CharSequence>rawBody_,
ISkinParamskinParam,Stereotypestereotype,
Stylestyle)
end note
:this.rawBody.add(VisibilityModifier.replaceVisibilityModifierByUnicodeChar(s.toString(),true));
:this.skinParam=skinParam;
:this.stereotype=stereotype;
:this.style=style;
end
start
note right
void drawU(UGraphicug)
end note
:getTextBlock().drawU(ug);
end
start
note right
TextBlockgetTextBlock()
end note
:return display.create(config,HorizontalAlignment.LEFT,
skinParam);;
stop
end
start
note right
PortsgetPorts(StringBounderstringBounder)
end note
:return new Ports();;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return getTextBlock().calculateDimension(stringBounder);;
stop
end
@enduml

