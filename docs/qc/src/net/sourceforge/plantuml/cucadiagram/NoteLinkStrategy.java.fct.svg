.9063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="153" x2="153" y1="438.875" y2="458.875"/><polygon fill="#181818" points="149,448.875,153,458.875,157,448.875,153,452.875" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[16694052269038aeae2c890bb2b2b1d5]
@startuml
!pragma layout smetana
start
note right
XDimension2DcomputeDimension(doublewidth,doubleheight)
end note
if (this==HALF_PRINTED_FULL) then (yes) 
:return new XDimension2D(width/2,height);;
stop
endif 
if (this==HALF_NOT_PRINTED) then (yes) 
:return new XDimension2D(0,0);;
stop
endif 
:return new XDimension2D(width,height);;
stop
end
@enduml

