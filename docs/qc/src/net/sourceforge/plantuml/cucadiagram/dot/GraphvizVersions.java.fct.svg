@startuml
!pragma layout smetana
start
note right
constructor GraphvizVersions()
end note
end
start
note right
GraphvizVersionsgetInstance()
end note
:return singleton;;
stop
end
start
note right
GraphvizVersiongetVersion(Filef)
end note
if (f==null ) then (yes) 
:return null ;;
stop
endif 
if (result!=null ) then (yes) 
:return result;;
stop
endif 
:result=checkVersionSlow(f.getAbsolutePath());;
:map.put(f,result);;
:return result;;
stop
end
start
note right
GraphvizVersioncheckVersionSlow(StringpathExecutable)
end note
:return finder.getVersion();;
stop
end
