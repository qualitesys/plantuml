@startuml
!pragma layout smetana
start
note right
constructor CucaDiagramSimplifierActivity(CucaDiagramdiagram,List<String>dotStrings,StringBounderstringBounder)
end note
:this.diagram=diagram;
:this.stringBounder=stringBounder;
repeat
:changed=false;
if (diagram.isAutarkic(g)) then (yes) 
:g.overrideImage(img,LeafType.ACTIVITY);
:changed=true;
endif 
repeat while (changed)
end
start
note right
IEntityImagecomputeImage(IGroupg)
end note
:return maker.getImage();;
stop
end
@enduml

