@startuml
!pragma layout smetana
start
note right
booleanfindExecutableOnPath()
end note
:return false;;
stop
end
start
note right
FilespecificDotExe()
end note
if (specificDotExe==null ) then (yes) 
:specificDotExe=WindowsDotArchive.getInstance()
.getWindowsExeLite();
endif 
:return specificDotExe;;
stop
end
start
note right
booleangraphviz244onWindows()
end note
:return false;;
stop
end
start
note right
constructor GraphvizWindowsLite(ISkinParamskinParam,StringdotString,String... type)
end note
:super (skinParam,dotString,type);
end
start
note right
StringgetExeName()
end note
:return "dot.exe";;
stop
end
@enduml

