end note
if (specificDotExe==null ) then (yes) 
endif 
:return specificDotExe;;
stop
end
start
note right
booleangraphviz244onWindows()
end note
:return false;;
stop
end
start
note right
constructor GraphvizWindowsLite(ISkinParamskinParam,
StringdotString,String... type)
end note
end
