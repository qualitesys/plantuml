@startuml
!pragma layout smetana
start
note right
ExeStatecheckFile(FiledotExe)
end note
if (dotExe==null ) then (yes) 
:return NULL_UNDEFINED;;
stop
endif 
:return OK;;
stop
end
start
note right
StringgetTextMessage()
end note
:switch (this){case OK:return "File OK";case NULL_UNDEFINED:return "No dot executable found";case DOES_NOT_EXIST:return "File does not exist";case IS_A_DIRECTORY:return "It should be an executable,
 not a directory";case NOT_A_FILE:return "Not a valid file";case CANNOT_BE_READ:return "File cannot be read";};
:throw new IllegalStateException();;
stop
end
start
note right
StringgetTextMessage(Fileexe)
end note
:switch (this){case OK:return "File "+exe.getAbsolutePath()+
" OK";case NULL_UNDEFINED:return NULL_UNDEFINED.getTextMessage();case DOES_NOT_EXIST:return "File "+
exe.getAbsolutePath()+" does not exist";case IS_A_DIRECTORY:return "File "+
exe.getAbsolutePath()+" should be an executable, not a directory";case NOT_A_FILE:return "File "+
exe.getAbsolutePath()+" is not a valid file";case CANNOT_BE_READ:return "File "+
exe.getAbsolutePath()+" cannot be read";};
:throw new IllegalStateException();;
stop
end
@enduml

