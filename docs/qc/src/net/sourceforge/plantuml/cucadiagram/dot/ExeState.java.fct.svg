@startuml
!pragma layout smetana
start
note right
ExeStatecheckFile(FiledotExe)
end note
if (dotExe==null ) then (yes) 
:return NULL_UNDEFINED;;
stop
endif 
:return OK;;
stop
end
start
note right
StringgetTextMessage()
end note
:return "File OK";;
stop
:return "No dot executable found";;
stop
:return "File does not exist";;
stop
:return "It should be an executable, not a directory";;
stop
:return "Not a valid file";;
stop
:return "File cannot be read";;
stop
:throw new IllegalStateException();;
end
start
note right
StringgetTextMessage(Fileexe)
end note
:return "File "+exe.getAbsolutePath()+" OK";;
stop
:return NULL_UNDEFINED.getTextMessage();;
stop
:return "File "+exe.getAbsolutePath()+" does not exist";;
stop
:return "File "+exe.getAbsolutePath()+" should be an executable,
 not a directory";;
stop
:return "File "+exe.getAbsolutePath()+" is not a valid file";;
stop
:return "File "+exe.getAbsolutePath()+" cannot be read";;
stop
:throw new IllegalStateException();;
end
@enduml

