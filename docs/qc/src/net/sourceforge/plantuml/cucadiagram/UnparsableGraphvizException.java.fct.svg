@startuml
!pragma layout smetana
start
note right
constructor UnparsableGraphvizException(Exceptioncause,
StringgraphvizVersion,Stringsvg,StringdiagramSource)
end note
:super (cause);
:this.graphvizVersion=graphvizVersion;
:this.svg=svg;
:this.diagramSource=diagramSource;
end
start
note right
StringgetGraphvizVersion()
end note
:return graphvizVersion;;
stop
end
start
note right
StringgetDebugData()
end note
:return "SVG="+svg+"\r\nDIAGRAM="+diagramSource;;
stop
end
@enduml

