@startuml
!pragma layout smetana
start
note right
LinkArrow reverse()
end note
if (this==DIRECT_NORMAL) then (yes) 
:return BACKWARD;;
stop
endif 
if (this==BACKWARD) then (yes) 
:return DIRECT_NORMAL;;
stop
endif 
:return NONE_OR_SEVERAL;;
stop
end
start
note right
GuideLine mute(final GuideLine guide)
end note
switch (switch this)
case (case DIRECT_NORMAL:) 
:return guide;;
stop
case (case BACKWARD:) 
:return new GuideLine(){public Direction getArrowDirection(){return guide.getArrowDirection().getInv();}public double getArrowDirection2(){return Math.PI+
guide.getArrowDirection2();}};;
stop
endswitch
:throw new UnsupportedOperationException();;
stop
end
@enduml

