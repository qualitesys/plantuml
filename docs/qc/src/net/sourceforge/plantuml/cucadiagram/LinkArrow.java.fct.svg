@startuml
!pragma layout smetana
start
note right
LinkArrowreverse()
end note
if (this==DIRECT_NORMAL) then (yes) 
:return BACKWARD;;
stop
endif 
if (this==BACKWARD) then (yes) 
:return DIRECT_NORMAL;;
stop
endif 
:return NONE_OR_SEVERAL;;
stop
end
start
note right
GuideLinemute(final GuideLineguide)
end note
:return guide;;
stop
:return new GuideLine(){public DirectiongetArrowDirection(){return guide.getArrowDirection().getInv();}public doublegetArrowDirection2(){return Math.PI+guide.getArrowDirection2();}};;
stop
:throw new UnsupportedOperationException();;
end
@enduml

