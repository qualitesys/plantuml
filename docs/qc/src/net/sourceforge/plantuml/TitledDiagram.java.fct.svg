end note
:return super .createImageBuilder(fileFormatOption)
.styled(this);;
stop
end
start
note right
HColorcalculateBackColor()
end note
if (backgroundColor==null ) then (yes) 
:backgroundColor=HColors.transparent();
endif 
:return backgroundColor;;
stop
end
start
note right
ColorMappermuteColorMapper(ColorMapperinit)
end note
if (String.valueOf("dark").equalsIgnoreCase(getSkinParam()
.getValue("mode"))) then (yes) 
:return ColorMapper.DARK_MODE;;
stop
endif 
if (String.valueOf("true").equals(monochrome)) then (yes) 
:return ColorMapper.MONOCHROME;;
stop
endif 
if (String.valueOf("reverse").equals(monochrome)) then (yes) 
:return ColorMapper.MONOCHROME_REVERSE;;
stop
endif 
if (reversecolor==null ) then (yes) 
:return init;;
stop
endif 
if (String.valueOf("dark").equalsIgnoreCase(reversecolor)) then (yes) 
:return ColorMapper.LIGTHNESS_INVERSE;;
stop
endif 
if (order==null ) then (yes) 
:return init;;
stop
endif 
:return ColorMapper.reverse(order);;
stop
