@startuml
!pragma layout smetana
start
note right
PragmagetPragma()
end note
:return pragma;;
stop
end
start
note right
constructor TitledDiagram(UmlSourcesource,
UmlDiagramTypetype,Map<String,String>orig)
end note
:super (source);
:this.type=type;
:this.skinParam=SkinParam.create(type);
if (orig!=null ) then (yes) 
:this.skinParam.copyAllFrom(orig);
endif 
end
start
note right
StyleBuildergetCurrentStyleBuilder()
end note
:return skinParam.getCurrentStyleBuilder();;
stop
end
start
note right
UmlDiagramTypegetUmlDiagramType()
end note
:return type;;
stop
end
start
note right
ISkinParamgetSkinParam()
end note
:return skinParam;;
stop
end
start
note right
void setParam(Stringkey,Stringvalue)
end note
:skinParam.setParam(StringUtils.goLowerCase(key),
value);
end
start
note right
void addSprite(Stringname,Spritesprite)
end note
:skinParam.addSprite(name,sprite);
end
start
note right
CommandExecutionResultloadSkin(StringnewSkin)
end note
if (is==null ) then (yes) 
:return CommandExecutionResult.error("Cannot find style "+
newSkin);;
stop
endif 
:is.close();
:getSkinParam().setDefaultSkin(filename);
:return CommandExecutionResult.ok();;
stop
end
start
note right
void setTitle(DisplayPositionedtitle)
end note
if (title.isNull()||title.getDisplay().isWhite()) then (yes) 
:return ;;
stop
endif 
:this.title=title;
end
start
note right
DisplayPositionnedgetTitle()
end note
:return title;;
stop
end
start
note right
DisplaygetTitleDisplay()
end note
if (title==null ) then (yes) 
:return null ;;
stop
endif 
:return title.getDisplay();;
stop
end
start
note right
void setMainFrame(DisplaymainFrame)
end note
:this.mainFrame=mainFrame;
end
start
note right
void setCaption(DisplayPositionedcaption)
end note
:this.caption=caption;
end
start
note right
DisplayPositionedgetCaption()
end note
:return caption;;
stop
end
