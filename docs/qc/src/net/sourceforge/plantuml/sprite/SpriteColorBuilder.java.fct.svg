;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="241.5" x2="241.5" y1="622.4805" y2="642.4805"/><polygon fill="#181818" points="237.5,632.4805,241.5,642.4805,245.5,632.4805,241.5,636.4805" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d11f8d4314876888877a8dc08c4daad7]
@startuml
!pragma layout smetana
start
note right
SpritebuildSprite(List<CharSequence>strings)
end note
if (col>=strings.get(line).length()) then (yes) 
:continue ;;
endif 
if (idx!=-1) then (yes) 
:result.setGray(col,line,idx);;
else (no)
:result.setColor(col,line,rgb.getRGB()&0xFFFFFF);;
endif 
:return result;;
stop
end
start
note right
List<String>encodeColor(BufferedImageimg)
end note
:sb.append(code);;
:result.add(sb.toString());;
:return Collections.unmodifiableList(result);;
stop
end
@enduml

