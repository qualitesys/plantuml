@startuml
!pragma layout smetana
start
note right
chargetCharFor(Colordest)
end note
:return getCharFor(HColors.simple(dest));;
stop
end
start
note right
chargetCharFor(HColordest)
end note
if (dist<resultDist) then (yes) 
:result=c;;
:resultDist=dist;;
endif 
:assert result!=0;;
:return result;;
stop
end
start
note right
HColorgetHtmlColorSimpleFor(charc)
end note
:return HColors.simple(color);;
stop
end
start
note right
ColorgetColorFor(charc)
end note
if (col==-1) then (yes) 
:return null ;;
stop
endif 
:return new Color(red,green,blue);;
stop
end
@enduml

