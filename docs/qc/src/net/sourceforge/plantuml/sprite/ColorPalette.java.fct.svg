@startuml
!pragma layout smetana
start
note right
chargetCharFor(Colordest)
end note
:return getCharFor(HColors.simple(dest));;
stop
end
start
note right
chargetCharFor(HColordest)
end note
:i++;
if (dist<resultDist) then (yes) 
:result=c;
:resultDist=dist;
endif 
:return result;;
stop
end
start
note right
HColorgetHtmlColorSimpleFor(charc)
end note
:return HColors.simple(color);;
stop
end
start
