@startuml
!pragma layout smetana
start
note right
constructor CommandStdlib()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandStdlib.class .getName(),
RegexLeaf.start(),new RegexLeaf("stdlib"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("NAME",
"([-\\w]+)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(StdlibDiagramsystem,
LineLocationlocation,RegexResultarg)
end note
:system.setStdlibName(name);
:return CommandExecutionResult.ok();;
stop
end
@enduml

