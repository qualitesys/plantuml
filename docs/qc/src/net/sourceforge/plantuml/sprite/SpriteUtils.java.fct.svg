:sb.append("sprite $"+name+" ["+img.getWidth()+
"x"+img.getHeight()+"/"+level.getNbColor()+
"z] ");
if (list.size()==1) then (yes) 
:sb.append(list.get(0));
:sb.append(BackSlash.NEWLINE);
else (no)
:sb.append("{\n");
:sb.append(s);
:sb.append(BackSlash.NEWLINE);
:sb.append("}\n");
endif 
:return sb.toString();;
stop
end
@enduml

