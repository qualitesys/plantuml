@startuml
!pragma layout smetana
start
note right
constructor SpriteUtils()
end note
end
start
note right
StringencodeColor(BufferedImageimg,Stringname)
end note
:return sb.toString();;
stop
end
start
note right
Stringencode(BufferedImageimg,Stringname,
SpriteGrayLevellevel)
end note
:return sb.toString();;
stop
end
start
note right
StringencodeCompressed(BufferedImageimg,Stringname,
SpriteGrayLevellevel)
end note
if (list.size()==1) then (yes) 
else (no)
endif 
:return sb.toString();;
stop
end
@enduml

