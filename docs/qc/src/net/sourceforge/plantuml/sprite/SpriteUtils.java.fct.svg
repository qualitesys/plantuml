@startuml
!pragma layout smetana
start
note right
constructor SpriteUtils()
end note
end
start
note right
StringencodeColor(BufferedImageimg,Stringname)
end note
:sb.append("sprite $"+name+" ["+img.getWidth()+
"x"+img.getHeight()+"/color] {\n");;
:sb.append(s);;
:sb.append(BackSlash.NEWLINE);;
:sb.append("}\n");;
:return sb.toString();;
stop
end
start
note right
Stringencode(BufferedImageimg,Stringname,
SpriteGrayLevellevel)
end note
:sb.append("sprite $"+name+" ["+img.getWidth()+
"x"+img.getHeight()+"/"+level.getNbColor()+
"] {\n");;
:sb.append(s);;
:sb.append(BackSlash.NEWLINE);;
:sb.append("}\n");;
:return sb.toString();;
stop
end
start
note right
StringencodeCompressed(BufferedImageimg,Stringname,
SpriteGrayLevellevel)
end note
:sb.append("sprite $"+name+" ["+img.getWidth()+
"x"+img.getHeight()+"/"+level.getNbColor()+
"z] ");;
if (list.size()==1) then (yes) 
:sb.append(list.get(0));;
:sb.append(BackSlash.NEWLINE);;
else (no)
:sb.append("{\n");;
:sb.append(s);;
:sb.append(BackSlash.NEWLINE);;
:sb.append("}\n");;
endif 
:return sb.toString();;
stop
end
@enduml

