@startuml
!pragma layout smetana
start
note right
constructor LineBreakStrategy(Stringvalue)
end note
end
start
note right
StringtoString()
end note
:return value;;
stop
end
start
note right
booleanisAuto()
end note
:return String.valueOf("auto").equalsIgnoreCase(value);;
stop
end
start
note right
doublegetMaxWidth()
end note
if (value!=null &&value.matches("-?\\d+")) then (yes) 
:return Double.parseDouble(value);;
stop
endif 
:return 0;;
stop
end
@enduml

