@startuml
!pragma layout smetana
start
note right
intgetPriority()
end note
:switch (this){case REPETITION_SYMBOL:return 3;
:case CONCATENATION:return 2;case ALTERNATION:return 1;};
:throw new UnsupportedOperationException();;
stop
end
start
note right
booleanisOperator()
end note
:return this==CONCATENATION||this==ALTERNATION||this==REPETITION_SYMBOL;;
stop
end
start
note right
booleanisFunction()
end note
:return this==OPTIONAL||this==REPETITION_ZERO_OR_MORE;;
stop
end
@enduml

