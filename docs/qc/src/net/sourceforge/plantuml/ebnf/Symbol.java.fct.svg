roke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="284.75" x2="284.75" y1="556.8828" y2="576.8828"/><polygon fill="#181818" points="280.75,566.8828,284.75,576.8828,288.75,566.8828,284.75,570.8828" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[033dcaca843d4f80bcd58bc3d9a73dd1]
@startuml
!pragma layout smetana
start
note right
int getPriority()
end note
switch (switch this)
case (case REPETITION_SYMBOL:) 
:return 3;;
stop
case (case CONCATENATION:) 
:return 2;;
stop
case (case ALTERNATION:) 
:return 1;;
stop
endswitch
:throw new UnsupportedOperationException();;
stop
end
start
note right
boolean isOperator()
end note
:return this==CONCATENATION||this==ALTERNATION||this==REPETITION_SYMBOL;;
stop
end
start
note right
boolean isFunction()
end note
:return this==OPTIONAL||this==REPETITION_ZERO_OR_MORE;;
stop
end
@enduml

