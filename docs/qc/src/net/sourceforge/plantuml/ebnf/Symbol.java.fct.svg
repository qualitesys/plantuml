@startuml
!pragma layout smetana
start
note right
intgetPriority()
end note
:return 3;;
stop
:return 2;;
stop
:return 1;;
stop
:throw new UnsupportedOperationException();;
end
start
note right
booleanisOperator()
end note
:return this==CONCATENATION||this==ALTERNATION||this==REPETITION_SYMBOL;;
stop
end
start
note right
booleanisFunction()
end note
:return this==OPTIONAL||this==REPETITION_ZERO_OR_MORE;;
stop
end
@enduml

