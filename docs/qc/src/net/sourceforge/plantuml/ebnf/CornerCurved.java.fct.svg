><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="560.4844">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[223a3c86e19749568f8b31f92f983558]
@startuml
!pragma layout smetana
start
note right
constructor CornerCurved(CornerTypetype,doubledelta,
booleanwithArrow)
end note
:this.delta=delta;;
:this.type=type;;
:this.withArrow=withArrow;;
if (delta<=0) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
end
start
note right
UDrawablecreateSW(doubledelta)
end note
:return new CornerCurved(CornerType.SW,delta,
false);;
stop
end
start
note right
UDrawablecreateSE(doubledelta)
end note
:return new CornerCurved(CornerType.SE,delta,
false);;
stop
end
start
note right
UDrawablecreateNE(doubledelta)
end note
:return new CornerCurved(CornerType.NE,delta,
false);;
stop
end
start
note right
UDrawablecreateNE_arrow(doubledelta)
end note
:return new CornerCurved(CornerType.NE,delta,
true);;
stop
end
start
note right
UDrawablecreateNW(doubledelta)
end note
:return new CornerCurved(CornerType.NW,delta,
false);;
stop
end
start
note right
UDrawablecreateNW_arrow(doubledelta)
end note
:return new CornerCurved(CornerType.NW,delta,
true);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:final UPathpath=new UPath();;
:final doublea=delta/4;;
switch (switch (type))
endswith
:ug.draw(path);;
end
@enduml

