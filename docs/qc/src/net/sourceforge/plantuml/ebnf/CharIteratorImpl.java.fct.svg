@startuml
!pragma layout smetana
start
note right
constructor CharIteratorImpl(BlocLinesinput)
end note
:data=input;
end
start
note right
charpeek(intahead)
end note
if (line==-1) then (yes) 
:return 0;;
stop
endif 
if (pos+ahead>=currentLine.length()) then (yes) 
:return '\0';;
stop
endif 
:return currentLine.charAt(pos+ahead);;
stop
end
start
note right
StringgetCurrentLine()
end note
:return data.getAt(line).getTrimmed().getString();;
stop
end
start
note right
void next()
end note
if (line==-1) then (yes) 
:throw new IllegalStateException();;
endif 
:pos++;
if (pos>=getCurrentLine().length()) then (yes) 
:line++;
:pos=0;
endif 
while (line<data.size()&&getCurrentLine()
.length()==0)
:line++;
endwhile
if (line>=data.size()) then (yes) 
:line=-1;
endif 
end
@enduml

