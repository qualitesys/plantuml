 font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="371.9063">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="403" x="5" y="388.2031">:return top!=null &amp;&amp;top.getSymbol().isOperator();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="404.5">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="420.7969">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="437.0938">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="453.3906">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="747" x="5" y="469.6875">booleanthereIsAnOperatorAtTheTopOfTheOperatorStackWithGreaterPrecedence(Tokentoken)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="485.9844">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="503" x="5" y="502.2813">if (top!=null &amp;&amp;top.getSymbol().isOperator()&amp;&amp;top.getSymbol()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="449" x="5" y="518.5781">.getPriority()&gt;token.getSymbol().getPriority()) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[f94d7c499d940c2a1ffbbb35588ffbff]
@startuml
!pragma layout smetana
start
note right
constructor ShuntingYard(Iterator<Token>it)
end note
while (it.hasNext())
if (token.getSymbol()==Symbol.LITTERAL||token.getSymbol()==Symbol.TERMINAL_STRING1||token.getSymbol()==Symbol.TERMINAL_STRING2) then (yes) 
:ouputQueue.add(token);
while (thereIsAnCommentOnTopOfTheOperatorStack())
:ouputQueue.add(operatorStack_removeFirstAbove());
endwhile
else (no)
:throw new UnsupportedOperationException(token.toString());;
endif 
endwhile
while (operatorStack.isEmpty()==false)
if (token.getSymbol()==Symbol.OPTIONAL||token.getSymbol()==Symbol.REPETITION_ONE_OR_MORE||token.getSymbol()==Symbol.REPETITION_ZERO_OR_MORE) then (yes) 
:ouputQueue.clear();
:return ;;
stop
endif 
if (token.getSymbol()==Symbol.COMMENT_TOKEN) then (yes) 
:ouputQueue.add(new Token(Symbol.COMMENT_BELOW,
token.getData()));
else (no)
:ouputQueue.add(token);
endif 
endwhile
end
start
note right
TokenoperatorStack_removeFirstAbove()
end note
if (result.getSymbol()==Symbol.COMMENT_TOKEN) then (yes) 
:return new Token(Symbol.COMMENT_ABOVE,result.getData());;
stop
endif 
:return result;;
stop
end
start
note right
TokenoperatorStack_removeFirstBelow()
end note
if (result.getSymbol()==Symbol.COMMENT_TOKEN) then (yes) 
:return new Token(Symbol.COMMENT_BELOW,result.getData());;
stop
endif 
:return result;;
stop
end
start
note right
booleanthereIsAnCommentOnTopOfTheOperatorStack()
end note
:return top!=null &&top.getSymbol()==Symbol.COMMENT_TOKEN;;
stop
end
start
note right
booleanthereIsAFunctionAtTheTopOfTheOperatorStack()
end note
:return top!=null &&top.getSymbol().isFunction();;
stop
end
start
note right
booleanthereIsAnOperatorAtTheTopOfTheOperatorStack()
end note
:return top!=null &&top.getSymbol().isOperator();;
stop
end
start
note right
booleanthereIsAnOperatorAtTheTopOfTheOperatorStackWithGreaterPrecedence(Tokentoken)
end note
if (top!=null &&top.getSymbol().isOperator()&&top.getSymbol()
.getPriority()>token.getSymbol().getPriority()) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
List<Token>getOuputQueue()
end note
:return Collections.unmodifiableList(ouputQueue);;
stop
end
@enduml

