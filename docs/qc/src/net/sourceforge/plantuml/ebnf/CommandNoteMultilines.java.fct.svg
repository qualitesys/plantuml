@startuml
!pragma layout smetana
start
note right
constructor CommandNoteMultilines()
end note
end
start
note right
ColorParsercolor()
end note
:return ColorParser.simpleColor(ColorType.BACK);;
stop
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandNoteMultilines.class .getName(),
RegexLeaf.start(),new RegexLeaf("note"),RegexLeaf.spaceZeroOrMore(),
color().getRegex(),RegexLeaf.end());;
stop
end
start
note right
StringgetPatternEnd()
end note
:return "^end[%s]?note$";;
stop
end
start
note right
CommandExecutionResultexecuteNow(PSystemEbnfdiagram,
BlocLineslines)
end note
:return diagram.addNote(note,colors);;
stop
end
@enduml

