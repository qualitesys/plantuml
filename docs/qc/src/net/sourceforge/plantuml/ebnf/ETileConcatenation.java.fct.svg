@startuml
!pragma layout smetana
start
note right
void push(ETiletile)
end note
:tiles.add(0,tile);
end
start
note right
void drawU(UGraphicug)
end note
:drawHline(ug,fullLinePos,0,x);
:i++;
:tile.drawU(ug.apply(new UTranslate(x,fullLinePos-linePos)));
:x+=tile.calculateDimension(stringBounder).getWidth();
if (i!=tiles.size()-1) then (yes) 
:drawHlineDirected(ug,fullLinePos,x,x+marginx,
0.5);
:x+=marginx;
endif 
end
start
note right
doublegetH1(StringBounderstringBounder)
end note
:result=Math.max(result,tile.getH1(stringBounder));
:return result;;
stop
end
start
note right
doublegetH2(StringBounderstringBounder)
end note
:result=Math.max(result,tile.getH2(stringBounder));
:return result;;
stop
end
start
note right
doublegetWidth(StringBounderstringBounder)
end note
:i++;
:width+=tile.getWidth(stringBounder);
if (i!=tiles.size()-1) then (yes) 
:width+=marginx;
endif 
:return width;;
stop
end
@enduml

