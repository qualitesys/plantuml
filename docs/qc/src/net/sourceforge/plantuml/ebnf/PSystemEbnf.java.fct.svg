@startuml
!pragma layout smetana
start
note right
constructor PSystemEbnf(UmlSourcesource)
end note
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(EBNF)");;
stop
end
start
note right
CommandExecutionResultaddBlocLines(BlocLinesblines,
StringcommentAbove,StringcommentBelow)
end note
if (tmp1.isEmpty()) then (yes) 
:return CommandExecutionResult.error("Unparsable expression");;
stop
endif 
:return CommandExecutionResult.ok();;
stop
end
start
note right
CommandExecutionResultaddNote(final Displaynote,
Colorscolors)
end note
:return CommandExecutionResult.ok();;
stop
end
start
note right
ImageDataexportDiagramNow(OutputStreamos,
intindex,FileFormatOptionfileFormatOption)
end note
:return createImageBuilder(fileFormatOption)
.drawable(getTextBlock()).write(os);;
stop
end
start
note right
TextBlockBackcoloredgetTextBlock()
end note
if (expressions.size()==0) then (yes) 
:return TextBlockUtils.addBackcolor(tmp,null );;
stop
endif 
:return TextBlockUtils.addBackcolor(result,
null );;
stop
end
