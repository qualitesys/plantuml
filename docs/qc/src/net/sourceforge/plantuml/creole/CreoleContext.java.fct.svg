@startuml
!pragma layout smetana
start
note right
intgetLocalNumber(intorder)
end note
:ensureStackOk(order);
:stack.set(order,n+1);
:return n;;
stop
end
start
note right
void ensureStackOk(intorder)
end note
while (stack.size()<=order)
:stack.add(0);
endwhile
while (stack.size()>order+1)
:stack.remove(order+1);
endwhile
end
@enduml

