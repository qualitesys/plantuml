@startuml
!pragma layout smetana
start
note right
StringstartingChars()
end note
:return "<";;
stop
end
start
note right
constructor CommandCreoleImg()
end note
end
start
note right
Commandcreate()
end note
:return new CommandCreoleImg();;
stop
end
start
note right
intmatchingSize(Stringline)
end note
if (m.find()==false) then (yes) 
:return 0;;
stop
endif 
:return m.group(1).length();;
stop
end
start
note right
StringexecuteAndGetRemaining(Stringline,StripeSimplestripe)
end note
if (m.find()==false) then (yes) 
:throw new IllegalStateException();;
stop
endif 
if (src.toLowerCase().startsWith("src=")) then (yes) 
:src=src.substring(4);;
endif 
:src=StringUtils.eventuallyRemoveStartingAndEndingDoubleQuote(src,
"\"");;
:stripe.addImage(src,scale);;
:return line.substring(m.group(1).length());;
stop
end
@enduml

