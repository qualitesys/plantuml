@startuml
!pragma layout smetana
start
note right
StringstartingChars()
end note
:return "\"";;
stop
end
start
note right
Commandcreate()
end note
:return new CommandCreoleMonospaced("^(\"\"(.*?)\"\")");;
stop
end
start
note right
constructor CommandCreoleMonospaced(Stringp)
end note
end
start
note right
intmatchingSize(Stringline)
end note
if (m.find()==false) then (yes) 
:return 0;;
stop
endif 
:return m.group(1).length();;
stop
end
start
note right
StringexecuteAndGetRemaining(Stringline,StripeSimplestripe)
end note
if (m.find()==false) then (yes) 
:throw new IllegalStateException();;
endif 
:return line.substring(m.group(1).length());;
stop
end
@enduml

