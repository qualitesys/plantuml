@startuml
!pragma layout smetana
start
note right
StringstartingChars()
end note
:return "<";;
stop
end
start
note right
Commandcreate()
end note
:return new CommandCreoleSizeChange(pattern);;
stop
end
start
note right
CommandcreateEol()
end note
:return new CommandCreoleSizeChange(patternEol);;
stop
end
start
note right
constructor CommandCreoleSizeChange(Pattern2p)
end note
:this.mypattern=p;
end
start
note right
intmatchingSize(Stringline)
end note
if (m.find()==false) then (yes) 
:return 0;;
stop
endif 
:return m.group(2).length();;
stop
end
start
note right
StringexecuteAndGetRemaining(Stringline,StripeSimplestripe)
end note
if (m.find()==false) then (yes) 
:throw new IllegalStateException();;
endif 
:stripe.setActualFontConfiguration(fc2);
:stripe.analyzeAndAdd(m.group(3));
:stripe.setActualFontConfiguration(fc1);
:return line.substring(m.group(1).length());;
stop
end
@enduml

