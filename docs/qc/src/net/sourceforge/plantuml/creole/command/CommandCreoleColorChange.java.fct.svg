@startuml
!pragma layout smetana
start
note right
StringstartingChars()
end note
:return "<";;
stop
end
start
note right
Commandcreate()
end note
:return new CommandCreoleColorChange(pattern);;
stop
end
start
note right
CommandcreateEol()
end note
:return new CommandCreoleColorChange(patternEol);;
stop
end
start
note right
constructor CommandCreoleColorChange(Pattern2pattern)
end note
:this.mypattern=pattern;
end
start
note right
intmatchingSize(Stringline)
end note
if (m.find()==false) then (yes) 
:return 0;;
stop
endif 
:return m.group(2).length();;
stop
end
start
note right
StringexecuteAndGetRemaining(Stringline,StripeSimplestripe)
end note
if (m.find()==false) then (yes) 
:throw new IllegalStateException();;
endif 
