end note
end
start
note right
Commandcreate()
end note
:return new CommandCreoleOpenIcon();;
stop
end
start
note right
intmatchingSize(Stringline)
end note
if (m.find()==false) then (yes) 
:return 0;;
stop
endif 
:return m.group(1).length();;
