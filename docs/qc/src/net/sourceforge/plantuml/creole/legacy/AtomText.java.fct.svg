@startuml
!pragma layout smetana
start
note right
constructor AtomText(Stringtext,FontConfigurationstyle,
Urlurl,DelayedDoublemarginLeft,DelayedDoublemarginRight,
booleanmanageSpecialChars)
end note
if (text.contains(""+BackSlash.hiddenNewLine())) then (yes) 
:throw new IllegalArgumentException(text);;
stop
endif 
:this.marginLeft=marginLeft;;
:this.marginRight=marginRight;;
:Strings=CharHidder.unhide(text);;
if (manageSpecialChars) then (yes) 
:s=StringUtils.showComparatorCharacters(s);;
:s=StringUtils.manageAmpDiese(s);;
:s=StringUtils.manageUnicodeNotationUplus(s);;
:s=StringUtils.manageTildeArobaseStart(s);;
:s=StringUtils.manageEscapedTabs(s);;
endif 
:this.manageSpecialChars=manageSpecialChars;;
:this.text=s;;
:this.fontConfiguration=style;;
:this.url=url;;
end
start
note right
AtomTextwithText(Stringtext)
end note
:return new AtomText(text,fontConfiguration,
url,marginLeft,marginRight,manageSpecialChars);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:final XDimension2Drect=stringBounder.calculateDimension(fontConfiguration.getFont(),
text);;
:Log.debug("g2d="+rect);;
:Log.debug("Size for "+text+" is "+rect);;
:doubleh=rect.getHeight();;
if (h<10) then (yes) 
:h=10;;
endif 
:doublewidth=text.indexOf("\t")==-1? rect.getWidth():getWidth(stringBounder,
text);;
:final doubleleft=marginLeft.getDouble(stringBounder);;
:final doubleright=marginRight.getDouble(stringBounder);;
if (visibility!=null ) then (yes) 
:width+=visibility.calculateDimension(stringBounder)
.getWidth();;
endif 
:return new XDimension2D(width+left+right,h);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (url!=null ) then (yes) 
:ug.startUrl(url);;
endif 
if (ug.matchesProperty("SPECIALTXT")) then (yes) 
:ug.draw(this);;
else (no)
if (visibility!=null ) then (yes) 
:visibility.drawU(ug.apply(UTranslate.dy(2)));;
:final doublewidth=visibility.calculateDimension(ug.getStringBounder())
.getWidth();;
:ug=ug.apply(UTranslate.dx(width));;
endif 
:HColortextColor=fontConfiguration.getColor();;
:FontConfigurationuseFontConfiguration=fontConfiguration;;
:HColorbackcolor=ug.getParam().getBackcolor();;
if (backcolor.isTransparent()) then (yes) 
:backcolor=ug.getDefaultBackground();;
endif 
:textColor=textColor.getAppropriateColor(backcolor);;
:useFontConfiguration=fontConfiguration.changeColor(textColor);;
if (marginLeft!=AtomTextUtils.ZERO) then (yes) 
:ug=ug.apply(UTranslate.dx(marginLeft.getDouble(ug.getStringBounder())));;
endif 
:final StringTokenizertokenizer=new StringTokenizer(text,
"\t",true);;
:final XDimension2Drect=ug.getStringBounder().calculateDimension(fontConfiguration.getFont(),
text);;
:final doubledescent=getDescent(ug.getStringBounder());;
:final doubleypos=rect.getHeight()-descent;;
:doublex=0;;
if (tokenizer.hasMoreTokens()) then (yes) 
:final doubletabSize=getTabSize(ug.getStringBounder());;
while (tokenizer.hasMoreTokens())
:final Strings=tokenizer.nextToken();;
if (s.equals("\t")) then (yes) 
:final doubleremainder=x%tabSize;;
:x+=tabSize-remainder;;
else (no)
:final XDimension2Ddim=ug.getStringBounder()
.calculateDimension(fontConfiguration.getFont(),s);;
:final UTextutext=new UText(s,useFontConfiguration);;
:ug.apply(new UTranslate(x,ypos)).draw(utext);;
:x+=dim.getWidth();;
endif 
endwhile
endif 
endif 
if (url!=null ) then (yes) 
:ug.closeUrl();;
endif 
end
start
note right
doublegetWidth(StringBounderstringBounder,
Stringtext)
end note
:final StringTokenizertokenizer=new StringTokenizer(text,
"\t",true);;
:final doubletabSize=getTabSize(stringBounder);;
:doublex=0;;
while (tokenizer.hasMoreTokens())
:final Strings=tokenizer.nextToken();;
if (s.equals("\t")) then (yes) 
:final doubleremainder=x%tabSize;;
:x+=tabSize-remainder;;
else (no)
:final XDimension2Ddim=stringBounder.calculateDimension(fontConfiguration.getFont(),s);;
:x+=dim.getWidth();;
endif 
endwhile
:return x;;
stop
end
start
note right
StringtabString()
end note
:final intnb=fontConfiguration.getTabSize();;
if (nb>=1&&nb<7) then (yes) 
:return String.valueOf("        ").substring(0,
nb);;
stop
endif 
:return "        ";;
stop
end
start
note right
doublegetDescent(StringBounderstringBounder)
end note
:return stringBounder.getDescent(fontConfiguration.getFont(),
text);;
stop
end
start
note right
doublegetTabSize(StringBounderstringBounder)
end note
:return stringBounder.calculateDimension(fontConfiguration.getFont(),
tabString()).getWidth();;
stop
end
start
note right
Collection<String>splitted()
end note
:final List<String>result=new ArrayList<>();;
:final StringBuilderpending=new StringBuilder();;
:final charch=text.charAt(i);;
if (isSeparator(ch)) then (yes) 
if (pending.length()>0) then (yes) 
:result.add(pending.toString());;
endif 
:result.add(""+ch);;
:pending.setLength(0);;
else if (isChineseSentenceBoundary(ch)) then (yes) 
:pending.append(ch);;
:result.add(pending.toString());;
:pending.setLength(0);;
else (no)
:pending.append(ch);;
endif 
if (pending.length()>0) then (yes) 
:result.add(pending.toString());;
endif 
:return result;;
stop
end
start
note right
Collection<String>splittedOld()
end note
:final List<String>result=new ArrayList<>();;
:final charch=text.charAt(i);;
if (isSeparator(ch)) then (yes) 
:result.add(""+text.charAt(i));;
else (no)
:final StringBuildertmp=new StringBuilder();;
:tmp.append(ch);;
while (i+1<text.length()&&isSeparator(text.charAt(i+
1))==false)
:i++;;
:tmp.append(text.charAt(i));;
endwhile
:result.add(tmp.toString());;
endif 
:return result;;
stop
end
start
note right
List<Atom>getSplitted(StringBounderstringBounder,
LineBreakStrategymaxWidthAsString)
end note
:final doublemaxWidth=maxWidthAsString.getMaxWidth();;
if (maxWidth==0) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:final List<Atom>result=new ArrayList<>();;
:final StringTokenizerst=new StringTokenizer(text,
" ",true);;
:final StringBuildercurrentLine=new StringBuilder();;
while (st.hasMoreTokens())
:final Stringtoken1=st.nextToken();;
:final doublew=getWidth(stringBounder,currentLine+
tmp);;
if (w>maxWidth) then (yes) 
:result.add(withText(currentLine.toString()));;
:currentLine.setLength(0);;
if (tmp.startsWith(" ")==false) then (yes) 
:currentLine.append(tmp);;
endif 
else (no)
:currentLine.append(tmp);;
endif 
endwhile
:result.add(withText(currentLine.toString()));;
:return Collections.unmodifiableList(result);;
stop
end
start
note right
List<Atom>splitInTwo(StringBounderstringBounder,
doublewidth)
end note
:final StringBuildertmp=new StringBuilder();;
if (tmp.length()>0&&getWidth(stringBounder,tmp.toString()+
token)>width) then (yes) 
:final Atompart1=withText(tmp.toString());;
:Stringremain=text.substring(tmp.length());;
while (remain.startsWith(" "))
:remain=remain.substring(1);;
endwhile
:final Atompart2=withText(remain);;
:return Arrays.asList(part1,part2);;
stop
endif 
:tmp.append(token);;
:return Collections.singletonList((Atom)this);;
stop
end
start
note right
booleanisSeparator(charch)
end note
:return Character.isWhitespace(ch);;
stop
end
start
note right
booleanisChineseSentenceBoundary(charch)
end note
:return ch=='\uFF01'||ch=='\uFF0C'||ch=='\uFF1A'||ch=='\uFF1B'||ch=='\uFF1F'||ch=='\u3002';;
stop
end
start
note right
StringgetText()
end note
:return text;;
stop
end
start
note right
doublegetStartingAltitude(StringBounderstringBounder)
end note
:return fontConfiguration.getSpace();;
stop
end
