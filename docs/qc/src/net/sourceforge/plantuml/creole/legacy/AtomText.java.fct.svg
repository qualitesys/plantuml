@startuml
!pragma layout smetana
start
note right
constructor AtomText(String text,FontConfiguration style,
Url url,DelayedDouble marginLeft,DelayedDouble marginRight,
boolean manageSpecialChars)
end note
if (text.contains(""+BackSlash.hiddenNewLine())) then (yes) 
:throw new IllegalArgumentException(text);;
stop
endif 
:this.marginLeft=marginLeft;;
:this.marginRight=marginRight;;
:String s=CharHidder.unhide(text);;
if (manageSpecialChars) then (yes) 
:s=StringUtils.showComparatorCharacters(s);;
:s=StringUtils.manageAmpDiese(s);;
:s=StringUtils.manageUnicodeNotationUplus(s);;
:s=StringUtils.manageTildeArobaseStart(s);;
:s=StringUtils.manageEscapedTabs(s);;
endif 
:this.manageSpecialChars=manageSpecialChars;;
:this.text=s;;
:this.fontConfiguration=style;;
:this.url=url;;
end
start
note right
AtomText withText(String text)
end note
:return new AtomText(text,fontConfiguration,
url,marginLeft,marginRight,manageSpecialChars);;
stop
end
start
note right
XDimension2D calculateDimension(StringBounder stringBounder)
end note
:final XDimension2D rect=stringBounder.calculateDimension(fontConfiguration.getFont(),
text);;
:Log.debug("g2d="+rect);;
:Log.debug("Size for "+text+" is "+rect);;
:double h=rect.getHeight();;
if (h<10) then (yes) 
:h=10;;
endif 
:double width=text.indexOf("\t")==-1? rect.getWidth():getWidth(stringBounder,
text);;
:final double left=marginLeft.getDouble(stringBounder);;
:final double right=marginRight.getDouble(stringBounder);;
if (visibility!=null ) then (yes) 
:width+=visibility.calculateDimension(stringBounder)
.getWidth();;
endif 
:return new XDimension2D(width+left+right,h);;
stop
end
start
note right
void drawU(UGraphic ug)
end note
if (url!=null ) then (yes) 
:ug.startUrl(url);;
endif 
if (ug.matchesProperty("SPECIALTXT")) then (yes) 
:ug.draw(this);;
else (no)
if (visibility!=null ) then (yes) 
:visibility.drawU(ug.apply(UTranslate.dy(2)));;
:final double width=visibility.calculateDimension(ug.getStringBounder())
.getWidth();;
:ug=ug.apply(UTranslate.dx(width));;
endif 
:HColor textColor=fontConfiguration.getColor();;
:FontConfiguration useFontConfiguration=fontConfiguration;;
:HColor backcolor=ug.getParam().getBackcolor();;
if (backcolor.isTransparent()) then (yes) 
:backcolor=ug.getDefaultBackground();;
endif 
:textColor=textColor.getAppropriateColor(backcolor);;
:useFontConfiguration=fontConfiguration.changeColor(textColor);;
if (marginLeft!=AtomTextUtils.ZERO) then (yes) 
:ug=ug.apply(UTranslate.dx(marginLeft.getDouble(ug.getStringBounder())));;
endif 
:final StringTokenizer tokenizer=new StringTokenizer(text,
"\t",true);;
:final XDimension2D rect=ug.getStringBounder().calculateDimension(fontConfiguration.getFont(),
text);;
:final double descent=getDescent(ug.getStringBounder());;
:final double ypos=rect.getHeight()-descent;;
:double x=0;;
if (tokenizer.hasMoreTokens()) then (yes) 
:final double tabSize=getTabSize(ug.getStringBounder());;
while (tokenizer.hasMoreTokens())
:final String s=tokenizer.nextToken();;
if (s.equals("\t")) then (yes) 
:final double remainder=x%tabSize;;
:x+=tabSize-remainder;;
else (no)
:final XDimension2D dim=ug.getStringBounder()
.calculateDimension(fontConfiguration.getFont(),s);;
:final UText utext=new UText(s,useFontConfiguration);;
:ug.apply(new UTranslate(x,ypos)).draw(utext);;
:x+=dim.getWidth();;
endif 
endwhile
endif 
endif 
if (url!=null ) then (yes) 
:ug.closeUrl();;
endif 
end
start
note right
double getWidth(StringBounder stringBounder,
String text)
end note
:final StringTokenizer tokenizer=new StringTokenizer(text,
"\t",true);;
:final double tabSize=getTabSize(stringBounder);;
:double x=0;;
while (tokenizer.hasMoreTokens())
:final String s=tokenizer.nextToken();;
if (s.equals("\t")) then (yes) 
:final double remainder=x%tabSize;;
:x+=tabSize-remainder;;
else (no)
:final XDimension2D dim=stringBounder.calculateDimension(fontConfiguration.getFont(),s);;
:x+=dim.getWidth();;
endif 
endwhile
:return x;;
stop
end
start
note right
String tabString()
end note
:final int nb=fontConfiguration.getTabSize();;
if (nb>=1&&nb<7) then (yes) 
:return String.valueOf("        ").substring(0,
nb);;
stop
endif 
:return "        ";;
stop
end
start
note right
double getDescent(StringBounder stringBounder)
end note
:return stringBounder.getDescent(fontConfiguration.getFont(),
text);;
stop
end
start
note right
double getTabSize(StringBounder stringBounder)
end note
:return stringBounder.calculateDimension(fontConfiguration.getFont(),
tabString()).getWidth();;
stop
end
start
note right
Collection<String> splitted()
end note
:final List<String> result=new ArrayList<>();;
:final StringBuilder pending=new StringBuilder();;
:final char ch=text.charAt(i);;
if (isSeparator(ch)) then (yes) 
if (pending.length()>0) then (yes) 
:result.add(pending.toString());;
endif 
:result.add(""+ch);;
:pending.setLength(0);;
else if (isChineseSentenceBoundary(ch)) then (yes) 
:pending.append(ch);;
:result.add(pending.toString());;
:pending.setLength(0);;
else (no)
:pending.append(ch);;
endif 
if (pending.length()>0) then (yes) 
:result.add(pending.toString());;
endif 
:return result;;
stop
end
start
note right
Collection<String> splittedOld()
end note
:final List<String> result=new ArrayList<>();;
:final char ch=text.charAt(i);;
if (isSeparator(ch)) then (yes) 
:result.add(""+text.charAt(i));;
else (no)
:final StringBuilder tmp=new StringBuilder();;
:tmp.append(ch);;
while (i+1<text.length()&&isSeparator(text.charAt(i+
1))==false)
:i++;;
:tmp.append(text.charAt(i));;
endwhile
:result.add(tmp.toString());;
endif 
:return result;;
stop
end
start
note right
List<Atom> getSplitted(StringBounder stringBounder,
LineBreakStrategy maxWidthAsString)
end note
:final double maxWidth=maxWidthAsString.getMaxWidth();;
if (maxWidth==0) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:final List<Atom> result=new ArrayList<>();;
:final StringTokenizer st=new StringTokenizer(text,
" ",true);;
:final StringBuilder currentLine=new StringBuilder();;
while (st.hasMoreTokens())
:final String token1=st.nextToken();;
:final double w=getWidth(stringBounder,currentLine+
tmp);;
if (w>maxWidth) then (yes) 
:result.add(withText(currentLine.toString()));;
:currentLine.setLength(0);;
if (tmp.startsWith(" ")==false) then (yes) 
:currentLine.append(tmp);;
endif 
else (no)
:currentLine.append(tmp);;
endif 
endwhile
:result.add(withText(currentLine.toString()));;
:return Collections.unmodifiableList(result);;
stop
end
start
note right
List<Atom> splitInTwo(StringBounder stringBounder,
double width)
end note
:final StringBuilder tmp=new StringBuilder();;
if (tmp.length()>0&&getWidth(stringBounder,tmp.toString()+
token)>width) then (yes) 
:final Atom part1=withText(tmp.toString());;
:String remain=text.substring(tmp.length());;
while (remain.startsWith(" "))
:remain=remain.substring(1);;
endwhile
:final Atom part2=withText(remain);;
:return Arrays.asList(part1,part2);;
stop
endif 
:tmp.append(token);;
:return Collections.singletonList((Atom )this);;
stop
end
start
note right
boolean isSeparator(char ch)
end note
:return Character.isWhitespace(ch);;
stop
end
start
note right
boolean isChineseSentenceBoundary(char ch)
end note
:return ch=='\uFF01'||ch=='\uFF0C'||ch=='\uFF1A'||ch=='\uFF1B'||ch=='\uFF1F'||ch=='\u3002';;
stop
end
start
note right
String getText()
end note
:return text;;
stop
end
start
note right
double getStartingAltitude(StringBounder stringBounder)
end note
:return fontConfiguration.getSpace();;
stop
end
start
note right
String toString()
end note
:return text+" "+fontConfiguration;;
stop
end
start
note right
FontConfiguration getFontConfiguration()
end note
:return fontConfiguration;;
stop
end
