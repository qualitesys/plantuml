note right
List<Atom>splitInTwo(StringBounderstringBounder,
doublewidth)
end note
if (tmp.length()>0&&getWidth(stringBounder,tmp.toString()+
token)>width) then (yes) 
while (remain.startsWith(" "))
:remain=remain.substring(1);
endwhile
:return Arrays.asList(part1,part2);;
stop
endif 
:tmp.append(token);
