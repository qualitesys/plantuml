@startuml
!pragma layout smetana
start
note right
constructor PSystemCreoleFactory()
end note
end
start
note right
PSystemCreoleinitDiagram(UmlSourcesource,
StringstartLine)
end note
if (getDiagramType()==DiagramType.CREOLE) then (yes) 
:return new PSystemCreole(source);;
stop
endif 
:return null ;;
stop
end
start
note right
PSystemCreoleexecuteLine(UmlSourcesource,
PSystemCreolesystem,Stringline)
end note
:return system;;
stop
end
@enduml

