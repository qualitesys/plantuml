@startuml
!pragma layout smetana
start
note right
constructor PSystemCreoleFactory()
end note
:super (DiagramType.CREOLE);
end
start
note right
PSystemCreoleinitDiagram(UmlSourcesource,StringstartLine)
end note
if (getDiagramType()==DiagramType.CREOLE) then (yes) 
:return new PSystemCreole(source);;
stop
endif 
:return null ;;
stop
end
start
note right
PSystemCreoleexecuteLine(UmlSourcesource,PSystemCreolesystem,Stringline)
end note
:system.doCommandLine(line);
:return system;;
stop
end
