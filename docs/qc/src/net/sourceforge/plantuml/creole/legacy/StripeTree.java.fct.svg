@startuml
!pragma layout smetana
start
note right
constructor StripeTree(FontConfigurationfontConfiguration,ISkinSimpleskinParam,Stringline)
end note
:this.fontConfiguration=fontConfiguration;
:this.skinParam=skinParam;
:this.tree=new AtomTree(fontConfiguration.getColor());
:this.marged=new AtomWithMargin(tree,2,2);
:analyzeAndAdd(line);
end
start
note right
List<Atom>getAtoms()
end note
:return Collections.<Atom>singletonList(marged);;
stop
end
start
note right
AtomgetLHeader()
end note
:return null ;;
stop
end
start
note right
void analyzeAndAdd(Stringline)
end note
:cell.analyzeAndAdd(text);
:this.tree.addCell(StripeTable.asAtom(Collections.singletonList(cell),
0),level);
end
start
note right
intcomputeLevel(Strings)
end note
while (s.length()>0)
if (s.startsWith("  ")) then (yes) 
:result++;
:s=s.substring(2);
endif 
:return result;;
stop
endwhile
:return result;;
stop
end
@enduml

