@startuml
!pragma layout smetana
start
note right
constructor Fission(Stripestripe,LineBreakStrategymaxWidth)
end note
:this.stripe=stripe;
:this.maxWidth=Objects.requireNonNull(maxWidth);
end
start
note right
List<Stripe>getSplitted(StringBounderstringBounder)
end note
if (valueMaxWidth==0) then (yes) 
:return Arrays.asList(stripe);;
stop
endif 
while (true)
:current.addAtom(part1,widthPart1);
:remainingSpace-=widthPart1;
if (remainingSpace<=0) then (yes) 
:result.add(current);
:current=new StripeSimpleInternal(blank(stripe.getLHeader()));
:remainingSpace=valueMaxWidth;
endif 
if (splitInTwo.size()==1) then (yes) 
endif 
:atom=splitInTwo.get(1);
if (remainingSpace<valueMaxWidth&&atom.calculateDimension(stringBounder)
.getWidth()>remainingSpace) then (yes) 
:result.add(current);
:current=new StripeSimpleInternal(blank(stripe.getLHeader()));
:remainingSpace=valueMaxWidth;
endif 
endwhile
if (remainingSpace<valueMaxWidth) then (yes) 
:result.add(current);
endif 
:return Collections.unmodifiableList(result);;
stop
end
start
note right
List<Atom>noHeader()
end note
if (stripe.getLHeader()==null ) then (yes) 
:return atoms;;
stop
endif 
:return atoms.subList(1,atoms.size());;
stop
end
start
note right
Atomblank(final Atomheader)
end note
if (header==null ) then (yes) 
:return null ;;
stop
endif 
:return new AbstractAtom(){public XDimension2DcalculateDimension(StringBounderstringBounder){return header.calculateDimension(stringBounder);}public doublegetStartingAltitude(StringBounderstringBounder){return header.getStartingAltitude(stringBounder);}public void drawU(UGraphicug){}};;
stop
end
start
note right
Collection<?  extends Atom>getSplitted(StringBounderstringBounder,
Atomatom)
end note
if (atom instanceof AtomText) then (yes) 
:return ((AtomText)atom).getSplitted(stringBounder,
maxWidth);;
stop
endif 
:return Collections.singleton(atom);;
stop
end
start
note right
constructor StripeSimpleInternal(Atomheader)
end note
if (header!=null ) then (yes) 
:this.atoms.add(header);
endif 
end
start
note right
List<Atom>getAtoms()
end note
:return Collections.unmodifiableList(atoms);;
stop
end
start
note right
void addAtom(Atomatom,doublewidth)
end note
:this.atoms.add(atom);
:this.totalWidth+=width;
end
start
note right
AtomgetLHeader()
end note
:return null ;;
stop
end
@enduml

