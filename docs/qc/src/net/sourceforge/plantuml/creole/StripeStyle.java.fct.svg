@startuml
!pragma layout smetana
start
note right
constructor StripeStyle(StripeStyleTypetype,intorder,charstyle)
end note
:this.type=type;
:this.order=order;
:this.style=style;
end
start
note right
StripeStyleTypegetType()
end note
:return type;;
stop
end
start
note right
AtomgetHeader(FontConfigurationfontConfiguration,CreoleContextcontext)
end note
if (type==StripeStyleType.LIST_WITHOUT_NUMBER) then (yes) 
:return new Bullet(fontConfiguration,order);;
stop
endif 
if (type==StripeStyleType.LIST_WITH_NUMBER) then (yes) 
:return AtomTextUtils.createListNumber(fontConfiguration,
order,localNumber);;
stop
endif 
:return null ;;
stop
end
start
note right
intgetOrder()
end note
:return order;;
stop
end
start
note right
chargetStyle()
end note
:return style;;
stop
end
@enduml

