@startuml
!pragma layout smetana
start
note right
constructor AtomTree(HColorlineColor)
end note
:this.lineColor=lineColor;
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:height+=dim.getHeight();
:width=Math.max(width,skeleton.getXEndForLevel(level)+margin+dim.getWidth());
:return new XDimension2D(width,height);;
stop
end
start
note right
doublegetStartingAltitude(StringBounderstringBounder)
end note
:return 0;;
stop
end
start
note right
void drawU(final UGraphicugInit)
end note
:cell.drawU(ug.apply(UTranslate.dx(margin+skeleton.getXEndForLevel(level))));
:skeleton.add(level,y+dim.getHeight()/2);
:ug=ug.apply(UTranslate.dy(dim.getHeight()));
:y+=dim.getHeight();
:skeleton.draw(ugInit.apply(this.lineColor));
end
start
note right
intgetLevel(Atomatom)
end note
:return levels.get(atom);;
stop
end
start
note right
void addCell(Atomcell,intlevel)
end note
:this.cells.add(cell);
:this.levels.put(cell,level);
end
@enduml

