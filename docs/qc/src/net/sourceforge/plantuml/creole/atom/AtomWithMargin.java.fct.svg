@startuml
!pragma layout smetana
start
note right
constructor AtomWithMargin(Atomatom,doublemarginY1,doublemarginY2)
end note
:this.atom=atom;
:this.marginY1=marginY1;
:this.marginY2=marginY2;
end
start
note right
List<Atom>splitInTwo(StringBounderstringBounder,doublewidth)
end note
if (list.size()==2&&result.size()==0) then (yes) 
:y2=0;
endif 
if (list.size()==2&&result.size()==1) then (yes) 
:y1=0;
endif 
:result.add(new AtomWithMargin(a,y1,y2));
:return Collections.unmodifiableList(result);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.delta(atom.calculateDimension(stringBounder),0,marginY1+
marginY2);;
stop
end
start
note right
doublegetStartingAltitude(StringBounderstringBounder)
end note
:return atom.getStartingAltitude(stringBounder);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:atom.drawU(ug.apply(UTranslate.dy(marginY1)));
end
@enduml

