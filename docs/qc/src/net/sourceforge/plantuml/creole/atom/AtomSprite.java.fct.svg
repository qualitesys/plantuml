@startuml
!pragma layout smetana
start
note right
constructor AtomSprite(HColornewColor,doublescale,FontConfigurationfontConfiguration,Spritesprite,Urlurl)
end note
:this.scale=scale;
:this.sprite=sprite;
:this.url=url;
:this.color=newColor==null ? fontConfiguration.getColor():newColor;
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return sprite.asTextBlock(color,scale).calculateDimension(stringBounder);;
stop
end
start
note right
doublegetStartingAltitude(StringBounderstringBounder)
end note
:return 0;;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (url!=null ) then (yes) 
:ug.startUrl(url);
endif 
:sprite.asTextBlock(color,scale).drawU(ug);
if (url!=null ) then (yes) 
:ug.closeUrl();
endif 
end
@enduml

