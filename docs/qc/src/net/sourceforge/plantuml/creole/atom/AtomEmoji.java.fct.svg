@startuml
!pragma layout smetana
start
note right
constructor AtomEmoji(Emojiemoji,doublescale,doublesize2D,HColorcolor)
end note
:this.emoji=emoji;
:this.factor=scale*size2D/MAGIC;
:this.color=color;
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(size,size);;
stop
end
start
note right
doublegetStartingAltitude(StringBounderstringBounder)
end note
:return -3*factor;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:emoji.drawU(ug,this.factor,this.color);
end
@enduml

