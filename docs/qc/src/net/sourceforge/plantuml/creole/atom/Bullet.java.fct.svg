@startuml
!pragma layout smetana
start
note right
constructor Bullet(FontConfigurationfontConfiguration,
intorder)
end note
end
start
note right
void drawU(UGraphicug)
end note
if (order==0) then (yes) 
else (no)
endif 
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
if (order==0) then (yes) 
:return new XDimension2D(12,5);;
stop
endif 
:return new XDimension2D(8+8*order,3);;
stop
end
start
note right
doublegetStartingAltitude(StringBounderstringBounder)
end note
if (order==0) then (yes) 
:return -5;;
stop
endif 
:return -7;;
stop
end
