@startuml
!pragma layout smetana
start
note right
constructor Bullet(FontConfigurationfontConfiguration,
intorder)
end note
:this.fontConfiguration=fontConfiguration;;
:this.order=order;;
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(color).apply(color.bg()).apply(new UStroke(0));;
if (order==0) then (yes) 
:ug=ug.apply(UTranslate.dx(3));;
:ug.draw(new UEllipse(5,5));;
else (no)
:ug=ug.apply(UTranslate.dx(1+8*order));;
:ug.draw(new URectangle(3.5,3.5));;
endif 
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
if (order==0) then (yes) 
:return new XDimension2D(12,5);;
stop
endif 
:return new XDimension2D(8+8*order,3);;
stop
end
start
note right
doublegetStartingAltitude(StringBounderstringBounder)
end note
if (order==0) then (yes) 
:return -5;;
stop
endif 
:return -7;;
stop
end
@enduml

