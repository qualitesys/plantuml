@startuml
!pragma layout smetana
start
note right
constructor AtomOpenIcon(HColornewColor,doublescale,
OpenIconopenIcon,FontConfigurationfontConfiguration,
Urlurl)
end note
:this.url=url;
:this.openIcon=openIcon;
:this.factor=scale*fontConfiguration.getSize2D()/12.0;
:this.color=newColor==null ? fontConfiguration.getColor():newColor;
end
start
note right
TextBlockasTextBlock()
end note
:return TextBlockUtils.withMargin(openIcon.asTextBlock(color,
factor),1,0);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return asTextBlock().calculateDimension(stringBounder);;
stop
end
start
note right
doublegetStartingAltitude(StringBounderstringBounder)
end note
:return -3*factor;;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (url!=null ) then (yes) 
:ug.startUrl(url);
endif 
:asTextBlock().drawU(ug);
if (url!=null ) then (yes) 
:ug.closeUrl();
endif 
end
@enduml

