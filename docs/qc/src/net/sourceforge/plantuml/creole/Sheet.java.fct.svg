@startuml
!pragma layout smetana
start
note right
constructor Sheet(HorizontalAlignmenthorizontalAlignment)
end note
:this.horizontalAlignment=horizontalAlignment;
end
start
note right
StringtoString()
end note
:return stripes.toString();;
stop
end
start
note right
void add(Stripestripe)
end note
:stripes.add(stripe);
end
start
note right
Iterator<Stripe>iterator()
end note
:return stripes.iterator();;
stop
end
start
note right
StripegetLastStripe()
end note
if (size==0) then (yes) 
:return null ;;
stop
endif 
:return stripes.get(size-1);;
stop
end
start
note right
HorizontalAlignmentgetHorizontalAlignment()
end note
:return horizontalAlignment;;
stop
end
@enduml

