@startuml
!pragma layout smetana
start
note right
StringasString(StringnameId)
end note
:return "<map id=\""+nameId+"_map\" name=\""+
nameId+"_map\">\n"+stringBuilder.toString()+
"</map>\n";;
stop
end
start
note right
booleancontainsData()
end note
:return stringBuilder.length()>0;;
stop
end
start
note right
void appendString(Strings)
end note
end
start
note right
void appendLong(longs)
end note
end
start
note right
void appendUrl(intseq,Urlurl,doublescale)
end note
end
start
note right
CMapDatacmapString(Set<Url>allUrlEncountered,
doublescale)
end note
if (u.hasData()==false) then (yes) 
endif 
:return cmapdata;;
stop
end
@enduml

