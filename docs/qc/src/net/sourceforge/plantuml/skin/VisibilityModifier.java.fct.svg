@startuml
!pragma layout smetana
start
note right
StringregexForVisibilityCharacterInClassName()
end note
:return "[-#+~]";;
stop
end
start
note right
constructor VisibilityModifier(charunicode,
ColorParamforeground,ColorParambackground)
end note
:this.foregroundParam=foreground;;
:this.backgroundParam=background;;
:this.unicode=unicode;;
end
start
note right
UDrawablegetUDrawable(final intsize,final HColorforegroundColor,
final HColorbackgoundColor)
end note
:return new UDrawable(){public void drawU(UGraphicug){drawInternal(ug,
size,foregroundColor,backgoundColor,0,0);}};;
stop
end
start
note right
TextBlockgetUBlock(final intsize,final HColorforegroundColor,
final HColorbackgoundColor,final booleanwithInvisibleRectanble)
end note
:return new AbstractTextBlock(){public XDimension2DcalculateDimension(StringBounderstringBounder){return new XDimension2D(size+
1,size+1);}@Override public XRectangle2DgetInnerPosition(Stringmember,
StringBounderstringBounder,InnerStrategystrategy){return null ;}public void drawU(UGraphicug){if (withInvisibleRectanble)ug.apply(HColors.none()).draw(new URectangle(size*2,
size));drawInternal(ug,size,foregroundColor,
backgoundColor,0,0);}};;
stop
end
start
note right
void drawInternal(UGraphicug,intsize,final HColorforegroundColor,
final HColorbackgoundColor,doublex,doubley)
end note
if (backgoundColor==null ) then (yes) 
:ug=ug.apply(HColors.none().bg());;
else (no)
:ug=ug.apply(backgoundColor.bg());;
endif 
:ug=ug.apply(foregroundColor);;
:size=ensureEven(size);;
switch (switch (this))
endswith
end
start
note right
void drawSquare(UGraphicug,booleanfilled,
intsize,doublex,doubley)
end note
:ug.apply(new UTranslate(x+2,y+2)).draw(new URectangle(size-4,
size-4));;
end
start
note right
void drawCircle(UGraphicug,booleanfilled,
intsize,doublex,doubley)
end note
:ug.apply(new UTranslate(x+2,y+2)).draw(new UEllipse(size-4,
size-4));;
end
start
note right
intensureEven(intn)
end note
if (n%2==1) then (yes) 
:n- -;;
endif 
:return n;;
stop
end
start
note right
void drawDiamond(UGraphicug,booleanfilled,
intsize,doublex,doubley)
end note
:final UPolygonpoly=new UPolygon();;
:size-=2;;
:poly.addPoint(size/2.0,0);;
:poly.addPoint(size,size/2.0);;
:poly.addPoint(size/2.0,size);;
:poly.addPoint(0,size/2.0);;
:ug.apply(new UTranslate(x+1,y)).draw(poly);;
end
start
note right
void drawTriangle(UGraphicug,booleanfilled,
intsize,doublex,doubley)
end note
:final UPolygonpoly=new UPolygon();;
:size-=2;;
:poly.addPoint(size/2.0,1);;
:poly.addPoint(0,size-1);;
:poly.addPoint(size,size-1);;
:ug.apply(new UTranslate(x+1,y)).draw(poly);;
end
start
note right
booleanisVisibilityCharacter(CharSequences)
end note
if (s.length()<=2) then (yes) 
:return false;;
stop
endif 
:final charc=s.charAt(0);;
if (s.charAt(1)==c) then (yes) 
:return false;;
stop
endif 
if (c=='-') then (yes) 
:return true;;
stop
endif 
if (c=='#') then (yes) 
:return true;;
stop
endif 
if (c=='+') then (yes) 
:return true;;
stop
endif 
if (c=='~') then (yes) 
:return true;;
stop
endif 
if (c=='*') then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
VisibilityModifiergetByUnicode(charc)
end note
if (modifier.unicode==c) then (yes) 
:return modifier;;
stop
endif 
:return null ;;
stop
end
start
note right
StringreplaceVisibilityModifierByUnicodeChar(Strings,
booleanisField)
end note
:final VisibilityModifiermodifier=getVisibilityModifier(s,
isField);;
if (modifier==null ) then (yes) 
:return s;;
stop
endif 
:return ""+modifier.unicode+s.substring(1);;
stop
end
start
note right
VisibilityModifiergetVisibilityModifier(CharSequences,
booleanisField)
end note
if (s.length()<=2) then (yes) 
:return null ;;
stop
endif 
:final charc=s.charAt(0);;
if (s.charAt(1)==c) then (yes) 
:return null ;;
stop
endif 
if (isField) then (yes) 
:return getVisibilityModifierForField(c);;
stop
endif 
:return getVisibilityModifierForMethod(c);;
stop
end
start
note right
VisibilityModifiergetVisibilityModifierForField(charc)
end note
if (c=='-') then (yes) 
:return VisibilityModifier.PRIVATE_FIELD;;
stop
endif 
if (c=='#') then (yes) 
:return VisibilityModifier.PROTECTED_FIELD;;
stop
endif 
if (c=='+') then (yes) 
:return VisibilityModifier.PUBLIC_FIELD;;
stop
endif 
if (c=='~') then (yes) 
:return VisibilityModifier.PACKAGE_PRIVATE_FIELD;;
stop
endif 
if (c=='*') then (yes) 
:return VisibilityModifier.IE_MANDATORY;;
stop
endif 
:return null ;;
stop
end
start
note right
VisibilityModifiergetVisibilityModifierForMethod(charc)
end note
if (c=='-') then (yes) 
:return VisibilityModifier.PRIVATE_METHOD;;
stop
endif 
if (c=='#') then (yes) 
:return VisibilityModifier.PROTECTED_METHOD;;
stop
endif 
if (c=='+') then (yes) 
:return VisibilityModifier.PUBLIC_METHOD;;
stop
endif 
if (c=='~') then (yes) 
:return VisibilityModifier.PACKAGE_PRIVATE_METHOD;;
stop
endif 
if (c=='*') then (yes) 
:return VisibilityModifier.IE_MANDATORY;;
stop
endif 
:return null ;;
stop
end
start
note right
ColorParamgetForeground()
end note
:return foregroundParam;;
stop
end
start
note right
ColorParamgetBackground()
end note
:return backgroundParam;;
stop
end
start
note right
StringgetXmiVisibility()
end note
if (this==PUBLIC_FIELD||this==PUBLIC_METHOD) then (yes) 
:return "public";;
stop
endif 
if (this==PRIVATE_FIELD||this==PRIVATE_METHOD) then (yes) 
:return "private";;
stop
endif 
if (this==PROTECTED_FIELD||this==PROTECTED_METHOD) then (yes) 
:return "protected";;
stop
endif 
if (this==PACKAGE_PRIVATE_FIELD||this==VisibilityModifier.PACKAGE_PRIVATE_METHOD) then (yes) 
:return "package";;
stop
endif 
:throw new IllegalStateException();;
stop
end
start
note right
booleanisField()
end note
if (this==PUBLIC_FIELD||this==PRIVATE_FIELD||this==PROTECTED_FIELD||this==PACKAGE_PRIVATE_FIELD) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
StyleSignatureBasicgetStyleSignature()
end note
if (this==IE_MANDATORY) then (yes) 
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.visibilityIcon,SName.IEMandatory);;
stop
endif 
if (this==PUBLIC_FIELD||this==PUBLIC_METHOD) then (yes) 
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.visibilityIcon,SName.public_);;
stop
endif 
if (this==PRIVATE_FIELD||this==PRIVATE_METHOD) then (yes) 
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.visibilityIcon,SName.private_);;
stop
endif 
if (this==PROTECTED_FIELD||this==PROTECTED_METHOD) then (yes) 
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.visibilityIcon,SName.protected_);;
stop
endif 
if (this==PACKAGE_PRIVATE_FIELD||this==VisibilityModifier.PACKAGE_PRIVATE_METHOD) then (yes) 
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.visibilityIcon,SName.package_);;
stop
endif 
:throw new IllegalStateException();;
stop
end
@enduml

