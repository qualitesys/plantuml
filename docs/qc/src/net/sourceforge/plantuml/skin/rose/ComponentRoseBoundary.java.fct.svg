,548,655.3828,544,659.3828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="544" x2="544" y1="699.3516" y2="719.3516"/><polygon fill="#181818" points="540,709.3516,544,719.3516,548,709.3516,544,713.3516" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="544" x2="544" y1="803.918" y2="826.4844"/><polygon fill="#181818" points="540,816.4844,544,826.4844,548,816.4844,544,820.4844" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="544" x2="544" y1="860.4531" y2="880.4531"/><polygon fill="#181818" points="540,870.4531,544,880.4531,548,870.4531,544,874.4531" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="544" x2="544" y1="965.0195" y2="987.5859"/><polygon fill="#181818" points="540,977.5859,544,987.5859,548,977.5859,544,981.5859" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="544" x2="544" y1="1021.5547" y2="1041.5547"/><polygon fill="#181818" points="540,1031.5547,544,1041.5547,548,1031.5547,544,1035.5547" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b03d1286926287c415758deaa99a3ec6]
@startuml
!pragma layout smetana
start
note right
constructor ComponentRoseBoundary(Stylestyle,
Stylestereo,DisplaystringsToDisplay,booleanhead,
ISkinSimplespriteContainer)
end note
:super (style,stereo,LineBreakStrategy.NONE,
3,3,0,spriteContainer,stringsToDisplay,false);;
:this.head=head;;
:this.stickman=new Boundary(biColor);;
end
start
note right
void drawInternalU(UGraphicug,Areaarea)
end note
if (head) then (yes) 
:textBlock.drawU(ug.apply(new UTranslate(getTextMiddlePostion(stringBounder),
dimStickman.getHeight())));;
:ug=ug.apply(UTranslate.dx(delta));;
else (no)
:textBlock.drawU(ug.apply(UTranslate.dx(getTextMiddlePostion(stringBounder))));;
:ug=ug.apply(new UTranslate(delta,getTextHeight(stringBounder)));;
endif 
:stickman.drawU(ug);;
end
start
note right
doublegetTextMiddlePostion(StringBounderstringBounder)
end note
:return (getPreferredWidth(stringBounder)-getTextWidth(stringBounder))/2.0;;
stop
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return dimStickman.getHeight()+getTextHeight(stringBounder);;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return Math.max(dimStickman.getWidth(),getTextWidth(stringBounder));;
stop
end
@enduml

