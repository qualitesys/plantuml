,728.2813,345.25,718.2813,341.25,722.2813" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="341.25" x2="341.25" y1="762.25" y2="782.25"/><polygon fill="#181818" points="337.25,772.25,341.25,782.25,345.25,772.25,341.25,776.25" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[85478245903041e03a642157a46b3a6a]
@startuml
!pragma layout smetana
start
note right
constructor ComponentRoseDestroy(Stylestyle,HColorforegroundColor,ISkinSimplespriteContainer)
end note
:super (style);
if (style!=null ) then (yes) 
:this.foregroundColor=style.value(PName.LineColor)
.asColor(spriteContainer.getIHtmlColorSet());
else (no)
:this.foregroundColor=foregroundColor;
endif 
end
start
note right
void drawInternalU(UGraphicug,Areaarea)
end note
:ug=ug.apply(new UStroke(2)).apply(foregroundColor);
:ug.draw(new ULine(2*crossSize,2*crossSize));
:ug.apply(UTranslate.dy(2*crossSize)).draw(new ULine(2*crossSize,
-2*crossSize));
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return crossSize*2;;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return crossSize*2;;
stop
end
@enduml

