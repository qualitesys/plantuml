@startuml
!pragma layout smetana
start
note right
constructor ComponentRoseDelayLine(Stylestyle,HColorcolor)
end note
:super (style);
:this.color=color;
end
start
note right
void drawInternalU(UGraphicug,Areaarea)
end note
:ug=ArrowConfiguration.stroke(ug,1,4,1).apply(color);
:ug.apply(UAntiAliasing.ANTI_ALIASING_OFF).apply(UTranslate.dx(x)).draw(ULine.vline(dimensionToUse.getHeight()));
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return 20;;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return 1;;
stop
end
@enduml

