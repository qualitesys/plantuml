@startuml
!pragma layout smetana
start
note right
constructor ComponentRoseDatabase(Stylestyle,
Stylestereo,DisplaystringsToDisplay,booleanhead,
ISkinSimplespriteContainer)
end note
:super (style,stereo,LineBreakStrategy.NONE,
3,3,0,spriteContainer,stringsToDisplay,false);
:this.head=head;
:this.stickman=USymbols.DATABASE.asSmall(null ,
TextBlockUtils.empty(16,17),TextBlockUtils.empty(0,
0),symbolContext,HorizontalAlignment.CENTER);
end
start
note right
void drawInternalU(UGraphicug,Areaarea)
end note
if (head) then (yes) 
:textBlock.drawU(ug.apply(new UTranslate(getTextMiddlePostion(stringBounder),
dimStickman.getHeight())));
:ug=ug.apply(UTranslate.dx(delta));
else (no)
:textBlock.drawU(ug.apply(UTranslate.dx(getTextMiddlePostion(stringBounder))));
:ug=ug.apply(new UTranslate(delta,getTextHeight(stringBounder)));
endif 
:stickman.drawU(ug);
end
start
note right
doublegetTextMiddlePostion(StringBounderstringBounder)
end note
:return (getPreferredWidth(stringBounder)-getTextWidth(stringBounder))/2.0;;
stop
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return dimStickman.getHeight()+getTextHeight(stringBounder);;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return Math.max(dimStickman.getWidth(),getTextWidth(stringBounder));;
stop
end
@enduml

