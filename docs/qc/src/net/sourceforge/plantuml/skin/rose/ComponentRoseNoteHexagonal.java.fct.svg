@startuml
!pragma layout smetana
start
note right
constructor ComponentRoseNoteHexagonal(Stylestyle,
Displaystrings,ISkinSimplespriteContainer,
Colorscolors)
end note
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return result;;
stop
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return getTextHeight(stringBounder)+2*getPaddingY();;
stop
end
start
note right
doublegetPaddingX()
end note
:return 5;;
stop
end
start
note right
doublegetPaddingY()
end note
:return 5;;
stop
end
start
note right
void drawInternalU(UGraphicug,Areaarea)
end note
if (diffX<0) then (yes) 
:throw new IllegalArgumentException();;
endif 
if (area.getDimensionToUse().getWidth()>getPreferredWidth(stringBounder)) then (yes) 
endif 
end
@enduml

