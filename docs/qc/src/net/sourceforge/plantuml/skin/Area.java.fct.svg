@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return dimensionToUse.toString()+" ("+deltaX1+")";;
stop
end
start
note right
constructor Area(XDimension2DdimensionToUse)
end note
:this.dimensionToUse=dimensionToUse;
end
start
note right
Areacreate(doublewith,doubleheight)
end note
:return new Area(new XDimension2D(with,height));;
stop
end
start
note right
XDimension2DgetDimensionToUse()
end note
:return dimensionToUse;;
stop
end
start
note right
void setDeltaX1(doubledeltaX1)
end note
:this.deltaX1=deltaX1;
end
start
note right
doublegetDeltaX1()
end note
:return deltaX1;;
stop
end
@enduml

