@startuml
!pragma layout smetana
start
note right
constructor ActorStickMan(SymbolContextsymbolContext,
booleanactorBusiness)
end note
end
start
note right
void drawU(UGraphicug)
end note
if (symbolContext.getDeltaShadow()!=0) then (yes) 
endif 
if (actorBusiness) then (yes) 
endif 
end
start
note right
void specialBusiness(UGraphicug)
end note
end
start
note right
XPoint2DgetOnCircle(doublealpha)
end note
:return new XPoint2D(x,y);;
stop
end
start
note right
doublethickness()
end note
:return symbolContext.getStroke().getThickness();;
stop
end
start
note right
doublegetPreferredWidth()
end note
:return Math.max(armsLenght,legsX)*2+2*thickness();;
stop
end
start
note right
doublegetPreferredHeight()
end note
:return headDiam+bodyLenght+legsY+2*thickness()+
symbolContext.getDeltaShadow()+1;;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(getPreferredWidth(),
getPreferredHeight());;
stop
