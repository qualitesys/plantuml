@startuml
!pragma layout smetana
start
note right
ArrowDirection reverse()
end note
switch (switch this)
case (case LEFT_TO_RIGHT_NORMAL:) 
:return RIGHT_TO_LEFT_REVERSE;;
stop
case (case RIGHT_TO_LEFT_REVERSE:) 
:return LEFT_TO_RIGHT_NORMAL;;
stop
case (default :) 
:throw new UnsupportedOperationException();;
stop
endswitch
end
@enduml

