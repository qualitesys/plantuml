@startuml
!pragma layout smetana
start
note right
constructor ActorHollow(SymbolContextsymbolContext)
end note
end
start
note right
void drawU(UGraphicug)
end note
if (symbolContext.getDeltaShadow()!=0) then (yes) 
endif 
end
start
note right
doublethickness()
end note
:return symbolContext.getStroke().getThickness();;
stop
end
start
note right
doublegetPreferredWidth()
end note
:return bodyWidth+thickness()*2;;
stop
end
start
note right
doublegetPreferredHeight()
end note
:return headDiam+neckHeight+bodyHeight+thickness()*2+
symbolContext.getDeltaShadow();;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(getPreferredWidth(),
getPreferredHeight());;
stop
end
@enduml

