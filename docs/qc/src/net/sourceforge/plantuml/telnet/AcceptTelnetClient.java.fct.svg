@startuml
!pragma layout smetana
start
note right
constructor AcceptTelnetClient(Socketsocket)
end note
:clientSocket=socket;
:System.out.println("Client Connected ...");
:br=new BufferedReader(new InputStreamReader(clientSocket.getInputStream()));
:os=clientSocket.getOutputStream();
:start();
end
start
note right
StringrunInternal()
end note
while (true)
if (s==null ) then (yes) 
:return sb.toString();;
stop
endif 
:Log.println("S="+s);
:sb.append(s);
:sb.append('\n');
if (s.equalsIgnoreCase("@enduml")) then (yes) 
:return sb.toString();;
stop
endif 
endwhile
end
start
note right
void run()
end note
:Log.println("UML="+uml);
:s.outputImage(os,new FileFormatOption(FileFormat.ATXT));
:os.close();
:br.close();
:Logme.error(e);
end
@enduml

