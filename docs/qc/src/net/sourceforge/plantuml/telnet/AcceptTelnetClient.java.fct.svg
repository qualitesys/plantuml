@startuml
!pragma layout smetana
start
note right
constructor AcceptTelnetClient(Socketsocket)
end note
:clientSocket=socket;;
:System.out.println("Client Connected ...");;
:br=new BufferedReader(new InputStreamReader(clientSocket.getInputStream()));;
:os=clientSocket.getOutputStream();;
:start();;
end
start
note right
StringrunInternal()
end note
:while (true){final Strings=br.readLine();if (s==null ){return sb.toString();}Log.println("S="+
s);sb.append(s);sb.append('\n');if (s.equalsIgnoreCase("@enduml")){return sb.toString();}};
end
start
note right
void run()
end note
:try {final Stringuml=runInternal();Log.println("UML="+
uml);final SourceStringReaders=new SourceStringReader(uml);s.outputImage(os,
