constructor AcceptTelnetClient(Socketsocket)
end note
:clientSocket=socket;;
:System.out.println("Client Connected ...");;
:br=new BufferedReader(new InputStreamReader(clientSocket.getInputStream()));;
:os=clientSocket.getOutputStream();;
:start();;
end
start
note right
StringrunInternal()
end note
:final StringBuildersb=new StringBuilder();;
while (true)
:final Strings=br.readLine();;
if (s==null ) then (yes) 
:return sb.toString();;
stop
endif 
:Log.println("S="+s);;
:sb.append(s);;
:sb.append('\n');;
if (s.equalsIgnoreCase("@enduml")) then (yes) 
:return sb.toString();;
stop
endif 
endwhile
end
