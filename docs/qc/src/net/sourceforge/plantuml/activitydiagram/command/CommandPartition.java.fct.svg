[%g]|\\S+)"),RegexLeaf.spaceZeroOrMore(),
new RegexOr(color().getRegex(),new RegexLeaf("LEGACYCOLORIGNORED","(#[0-9a-fA-F]{6}|#?\\w+
)?")),RegexLeaf.spaceZeroOrMore(),new RegexLeaf("STEREOTYPE",
"(\\<\\<.*\\>\\>)?"),RegexLeaf.spaceZeroOrMore(),
