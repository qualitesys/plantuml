@startuml
!pragma layout smetana
start
note right
constructor CommandPartition()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandPartition.class .getName(),
RegexLeaf.start(),new RegexLeaf("partition"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("NAME","([%g][^%g]+
[%g]|\\S+)"),RegexLeaf.spaceZeroOrMore(),
new RegexOr(color().getRegex(),new RegexLeaf("LEGACYCOLORIGNORED",
"(#[0-9a-fA-F]{6}|#?\\w+)?")),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("STEREOTYPE","(\\<\\<.*\\>\\>)?"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("\\{?"),
RegexLeaf.end());;
stop
end
start
note right
ColorParsercolor()
end note
:return ColorParser.simpleColor(ColorType.BACK);;
stop
end
start
note right
CommandExecutionResultexecuteArg(ActivityDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:diagram.gotoGroup(ident,code,Display.getWithNewlines(code),
GroupType.PACKAGE,currentPackage,NamespaceStrategy.SINGLE);
if (colors.isEmpty()==false) then (yes) 
:p.setColors(colors);
endif 
if (arg.get("STEREOTYPE",0)!=null ) then (yes) 
:p.setStereotype(Stereotype.build(arg.get("STEREOTYPE",
0)));
endif 
:return CommandExecutionResult.ok();;
stop
end
@enduml

