@startuml
!pragma layout smetana
start
note right
constructor CommandInnerConcurrent()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandInnerConcurrent.class .getName(),
RegexLeaf.start(),new RegexLeaf("- -"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("NAME","(.*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ActivityDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
if (EntityUtils.groupRoot(diagram.getCurrentGroup())) then (yes) 
:return CommandExecutionResult.error("No inner activity");;
stop
endif 
:diagram.concurrentActivity(arg.get("NAME",0));
:return CommandExecutionResult.ok();;
stop
end
@enduml

