@startuml
!pragma layout smetana
start
note right
constructor ConditionalContext(ConditionalContextparent,
IEntitybranch,Directiondirection)
end note
if (branch.getLeafType()!=LeafType.BRANCH) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
DirectiongetDirection()
end note
:return direction;;
stop
end
start
note right
ConditionalContextgetParent()
end note
:return parent;;
stop
end
start
note right
IEntitygetBranch()
end note
:return branch;;
stop
end
@enduml

