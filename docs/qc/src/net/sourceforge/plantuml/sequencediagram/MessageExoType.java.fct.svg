@startuml
!pragma layout smetana
start
note right
intgetDirection()
end note
:return 1;;
stop
:return -1;;
stop
:return 1;;
stop
:return -1;;
stop
:throw new IllegalStateException();;
end
start
note right
booleanisLeftBorder()
end note
:return this==MessageExoType.FROM_LEFT||this==MessageExoType.TO_LEFT;;
stop
end
start
note right
booleanisRightBorder()
end note
:return this==MessageExoType.FROM_RIGHT||this==MessageExoType.TO_RIGHT;;
stop
end
start
note right
MessageExoTypereverse()
end note
:return TO_LEFT;;
stop
:return FROM_RIGHT;;
stop
:return TO_RIGHT;;
stop
:return FROM_LEFT;;
stop
:throw new IllegalStateException();;
end
@enduml

