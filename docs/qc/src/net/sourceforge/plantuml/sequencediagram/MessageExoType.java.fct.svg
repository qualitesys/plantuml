@startuml
!pragma layout smetana
start
note right
intgetDirection()
end note
:switch (this){case FROM_LEFT:return 1;case TO_LEFT:return -1;
:case TO_RIGHT:return 1;case FROM_RIGHT:return -1;};
:throw new IllegalStateException();;
stop
end
start
note right
booleanisLeftBorder()
end note
:return this==MessageExoType.FROM_LEFT||this==MessageExoType.TO_LEFT;;
stop
end
start
note right
booleanisRightBorder()
end note
:return this==MessageExoType.FROM_RIGHT||this==MessageExoType.TO_RIGHT;;
stop
end
start
note right
MessageExoTypereverse()
end note
:switch (this){case FROM_LEFT:return TO_LEFT;
:case TO_RIGHT:return FROM_RIGHT;case FROM_RIGHT:return TO_RIGHT;
:case TO_LEFT:return FROM_LEFT;};
:throw new IllegalStateException();;
stop
end
@enduml

