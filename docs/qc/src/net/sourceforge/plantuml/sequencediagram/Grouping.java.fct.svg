@startuml
!pragma layout smetana
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.sequenceDiagram,SName.group);;
stop
end
start
note right
StyleSignatureBasicgetHeaderStyleDefinition()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.sequenceDiagram,SName.groupHeader);;
stop
end
start
note right
Style[]getUsedStyles()
end note
:return new Style[]{style==null ? null :style.eventuallyOverride(PName.BackGroundColor,
getBackColorGeneral()),styleHeader==null ? null :styleHeader.eventuallyOverride(PName.BackGroundColor,
backColorElement)};;
stop
end
start
note right
constructor Grouping(Stringtitle,Stringcomment,
GroupingTypetype,HColorbackColorElement,StyleBuilderstyleBuilder)
end note
end
start
note right
StringtoString()
end note
:return super .toString()+" "+type+" "+title;;
stop
end
start
note right
StringgetTitle()
end note
:return title;;
stop
end
start
note right
GroupingTypegetType()
end note
:return type;;
stop
end
start
note right
StringgetComment()
end note
:return comment;;
stop
end
start
note right
HColorgetBackColorElement()
end note
:return backColorElement;;
stop
end
@enduml

