@startuml
!pragma layout smetana
start
note right
constructor GraphicalDelayText(doublestartingY,ComponentcompText,ParticipantBoxfirst,ParticipantBoxlast)
end note
:super (startingY);
:this.compText=compText;
:this.p1=first;
:this.p2=last;
end
start
note right
void drawInternalU(UGraphicug,doublemaxX,Context2Dcontext)
end note
:ug=ug.apply(new UTranslate(middle-textWidth/2,
getStartingY()));
:compText.drawU(ug,new Area(dim),context);
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return compText.getPreferredHeight(stringBounder);;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return compText.getPreferredWidth(stringBounder);;
stop
end
start
note right
doublegetStartingX(StringBounderstringBounder)
end note
:return 0;;
stop
end
start
note right
doublegetEndingY(StringBounderstringBounder)
end note
:return getStartingY()+compText.getPreferredHeight(stringBounder);;
stop
end
@enduml

