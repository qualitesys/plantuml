d377270b410bd25677d07c1745c4]
@startuml
!pragma layout smetana
start
note right
constructor DrawableSetInitializer(Roseskin,
ISkinParamskinParam,booleanshowTail,doubleautonewpage)
end note
:this.drawableSet=new DrawableSet(skin,skinParam);
:this.showTail=showTail;
:this.autonewpage=autonewpage;
end
start
note right
booleanuseContinueLineBecauseOfDelay()
end note
if (String.valueOf("nosolid").equalsIgnoreCase(strategy)) then (yes) 
:return false;;
stop
endif 
if (String.valueOf("solid").equalsIgnoreCase(strategy)) then (yes) 
:return true;;
stop
endif 
if (ev instanceof Delay) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
ParticipantRangegetFullParticipantRange()
end note
:return new ParticipantRange(0,drawableSet.getAllParticipants()
.size());;
stop
end
start
note right
ParticipantRangegetParticipantRange(Eventev)
end note
:return getFullParticipantRange();;
stop
end
start
note right
DrawableSetcreateDrawableSet(StringBounderstringBounder)
end note
if (freeY2!=null ) then (yes) 
:throw new IllegalStateException();;
endif 
:this.defaultLineType=useContinueLineBecauseOfDelay()? ComponentType.CONTINUE_LINE:ComponentType.PARTICIPANT_LINE;
:prepareParticipant(stringBounder,p);
:this.freeY2=new FrontierStackImpl(drawableSet.getHeadHeight(stringBounder),
drawableSet.getAllParticipants().size());
:this.lastFreeY2=this.freeY2;
:drawableSet.setTopStartingY(this.freeY2.getFreeY(getFullParticipantRange()));
:i++;
:living.getLifeLine().addSegmentVariation(LifeSegmentVariation.LARGER,
freeY2.getFreeY(getFullParticipantRange()),
p.getLiveSpecificBackColors());
:col.add(livingParticipantBox.getParticipantBox());
:constraintSet=new ConstraintSet(col,freeX);
if (autonewpage>0&&diffY>0&&diffY+getTotalHeight(0,
stringBounder)>autonewpage) then (yes) 
:prepareNewpageSpecial(stringBounder,new Newpage(null ),
ev,range);
endif 
if (ev instanceof MessageExo) then (yes) 
:prepareMessageExo(stringBounder,(MessageExo)ev,
range);
else (no)
:throw new IllegalStateException();;
endif 
:takeParticipantEngloberPadding(stringBounder);
:constraintSet.takeConstraintIntoAccount(stringBounder);
:takeParticipantEngloberTitleWidth(stringBounder);
:prepareMissingSpace(stringBounder);
:drawableSet.setDimension(new XDimension2D(freeX,
getTotalHeight(freeY2.getFreeY(getFullParticipantRange()),
stringBounder)));
:return drawableSet;;
stop
end
start
note right
void takeParticipantEngloberPadding(StringBounderstringBounder)
end note
if (padding==0) then (yes) 
:return ;;
stop
endif 
:constraintSet.pushToLeftParticipantBox(padding,
first,true);
:constraintSet.pushToLeftParticipantBox(padding,
last,false);
end
start
note right
void takeParticipantEngloberTitleWidth(StringBounderstringBounder)
end note
if (missing>0) then (yes) 
:constraintSet.pushToLeftParticipantBox(missing/2,
first,true);
:constraintSet.pushToLeftParticipantBox(missing/2,
last,false);
endif 
end
start
note right
doublegetTotalHeight(doubley,StringBounderstringBounder)
end note
:return y+drawableSet.getTailHeight(stringBounder,showTail)+
signature;;
stop
end
start
note right
doublegetYposition(StringBounderstringBounder,
Newpagenewpage)
end note
:return graphicalNewpage.getStartingY();;
stop
end
start
note right
void prepareMissingSpace(StringBounderstringBounder)
end note
:freeX=constraintSet.getMaxX();
if (ev instanceof GraphicalDelayText) then (yes) 
if (missing>0) then (yes) 
:missingSpace1=Math.max(missingSpace1,missing/2);
:missingSpace2=Math.max(missingSpace2,missing/2);
endif 
endif 
if (delta1>missingSpace1) then (yes) 
:missingSpace1=delta1;
endif 
if (ev instanceof Arrow) then (yes) 
:a.setMaxX(freeX);
endif 
if (ev instanceof Arrow) then (yes) 
if (width<a.getActualWidth(stringBounder)) then (yes) 
:width=a.getActualWidth(stringBounder);
endif 
endif 
if (ev instanceof GroupingGraphicalElementHeader) then (yes) 
if (width<gh.getActualWidth(stringBounder)) then (yes) 
:width=gh.getActualWidth(stringBounder);
endif 
endif 
if (delta2>missingSpace2) then (yes) 
:missingSpace2=delta2;
endif 
if (missingSpace1>0) then (yes) 
:constraintSet.pushToLeft(missingSpace1);
endif 
:freeX=constraintSet.getMaxX()+missingSpace2;
end
start
note right
void prepareNewpage(StringBounderstringBounder,
Newpagenewpage,ParticipantRangerange)
end note
:this.lastFreeY2=freeY2;
:freeY2=freeY2.add(graphicalNewpage.getPreferredHeight(stringBounder),
range);
:drawableSet.addEvent(newpage,graphicalNewpage);
end
start
note right
void prepareNewpageSpecial(StringBounderstringBounder,
Newpagenewpage,EventjustBefore,ParticipantRangerange)
end note
:this.lastFreeY2=freeY2;
:freeY2=freeY2.add(graphicalNewpage.getPreferredHeight(stringBounder),
range);
:drawableSet.addEvent(newpage,graphicalNewpage,
justBefore);
end
start
note right
void prepareDivider(StringBounderstringBounder,
Dividerdivider,ParticipantRangerange)
end note
:freeY2=freeY2.add(graphicalDivider.getPreferredHeight(stringBounder),
range);
:drawableSet.addEvent(divider,graphicalDivider);
end
start
note right
void prepareHSpace(StringBounderstringBounder,
HSpacehspace,ParticipantRangerange)
end note
:freeY2=freeY2.add(graphicalHSpace.getPreferredHeight(stringBounder),
range);
:drawableSet.addEvent(hspace,graphicalHSpace);
end
start
note right
void prepareDelay(StringBounderstringBounder,
Delaydelay,List<ParticipantBox>participants,
ParticipantRangerange)
end note
:p.addDelay(graphicalDivider);
:freeY2=freeY2.add(graphicalDivider.getPreferredHeight(stringBounder),
range);
:drawableSet.addEvent(delay,graphicalDivider);
end
start
note right
void prepareGroupingStart(StringBounderstringBounder,
GroupingStartstart,ParticipantRangerange)
end note
if (start.getType()!=GroupingType.START) then (yes) 
:throw new IllegalStateException();;
endif 
:freeY2=freeY2.add(preferredHeight,range);
:inGroupableStack.addList(inGroupableList);
:inGroupableList.setMinWidth(element.getPreferredWidth(stringBounder));
:freeY2=freeY2.add(element.getPreferredHeight(stringBounder),
range);
:drawableSet.addEvent(start,element);
if (start.isParallel()) then (yes) 
:freeY2=((FrontierStack)freeY2).openBar();
endif 
end
start
note right
void prepareGroupingLeaf(StringBounderstringBounder,
final GroupingLeafm,ParticipantRangerange)
end note
if (m.getType()==GroupingType.ELSE) then (yes) 
if (m.isParallel()) then (yes) 
:freeY2=((FrontierStack)freeY2).restore();
endif 
start
note right
doublegetNow()
end note
if (after==null ) then (yes) 
:return 0;;
stop
endif 
:return after.getStartingY();;
stop
end
:element=new GroupingGraphicalElementElse(freeY2.getFreeY(range),
compElse,inGroupableStack.getTopGroupingStructure(),
m.isParallel(),lazy);
:freeY2=freeY2.add(preferredHeight,range);
:inGroupableStack.addElement((GroupingGraphicalElementElse)element);
else (no)
:throw new IllegalStateException();;
endif 
:drawableSet.addEvent(m,element);
end
start
note right
void prepareNote(StringBounderstringBounder,
Noten,ParticipantRangerange)
end note
:inGroupableStack.addElement(noteBox);
:drawableSet.addEvent(n,noteBox);
:freeY2=freeY2.add(noteBox.getPreferredHeight(stringBounder),
range);
end
start
note right
NoteBoxcreateNoteBox(StringBounderstringBounder,
Noten,ParticipantRangerange)
end note
if (n.getParticipant2()==null ) then (yes) 
:p2=null ;
else (no)
:p2=drawableSet.getLivingParticipantBox(n.getParticipant2());
if (p1.getParticipantBox().getCenterX(stringBounder)>p2.getParticipantBox()
.getCenterX(stringBounder)) then (yes) 
:p1=p2;
:p2=tmp;
endif 
endif 
if (p1==null &&p2==null ) then (yes) 
if (p1==null ) then (yes) 
:p1=p;
endif 
:p2=p;
endif 
:return noteBox;;
stop
end
start
note right
void prepareNotes(StringBounderstringBounder,
Notesnotes,ParticipantRangerange)
end note
:notesBoxes.add(noteBox,p1,p2);
:notesBoxes.ensureConstraints(stringBounder,
constraintSet);
:inGroupableStack.addElement(notesBoxes);
:drawableSet.addEvent(notes,notesBoxes);
:freeY2=freeY2.add(notesBoxes.getPreferredHeight(stringBounder),
range);
end
start
note right
void prepareLiveEvent(StringBounderstringBounder,
LifeEventlifeEvent,ParticipantRangerange)
end note
if (lifeEvent.getType()==LifeEventType.ACTIVATE) then (yes) 
if (message!=null ) then (yes) 
if (message.isCreate()) then (yes) 
:delta1+=10;
endif 
:pos=message.getPosYstartLevel()+delta1;
endif 
:line1.addSegmentVariation(LifeSegmentVariation.LARGER,
pos,lifeEvent.getSpecificColors());
endif 
if (lifeEvent.getType()==LifeEventType.DESTROY) then (yes) 
if (message==null ) then (yes) 
:pos2=y;
:freeY2=freeY2.add(comp.getPreferredHeight(stringBounder),
range);
else (no)
:pos2=message.getPosYendLevel()-delta;
endif 
:drawableSet.addEvent(lifeEvent,destroy);
else (no)
:drawableSet.addEvent(lifeEvent,new GraphicalElementLiveEvent(y));
endif 
end
start
note right
void prepareMessageExo(StringBounderstringBounder,
MessageExom,ParticipantRangerange)
end note
:freeY2=step1Message.prepareMessage(constraintSet,
inGroupableStack);
end
start
note right
void prepareMessage(StringBounderstringBounder,
Messagem,ParticipantRangerange)
end note
:freeY2=step1Message.prepareMessage(constraintSet,
inGroupableStack);
end
start
note right
void prepareReference(StringBounderstringBounder,
Referencereference,ParticipantRangerange)
end note
:strings=strings.add("ref");
:strings=strings.addAll(reference.getStrings());
if (p1==p2) then (yes) 
:constraint=constraintSet.getConstraintAfter(pbox1);
else (no)
:constraint=constraintSet.getConstraint(pbox1,
pbox2);
endif 
:constraint.ensureValue(width);
:inGroupableStack.addElement(graphicalReference);
:inGroupableStack.addElement(p1);
if (p1!=p2) then (yes) 
:inGroupableStack.addElement(p2);
endif 
:freeY2=freeY2.add(graphicalReference.getPreferredHeight(stringBounder),
range);
:drawableSet.addEvent(reference,graphicalReference);
end
start
note right
void prepareParticipant(StringBounderstringBounder,
Participantp)
end note
if (p.getType()==ParticipantType.PARTICIPANT) then (yes) 
:headType=ComponentType.PARTICIPANT_HEAD;
:tailType=ComponentType.PARTICIPANT_TAIL;
else (no)
:throw new IllegalArgumentException();;
endif 
:drawableSet.setLivingParticipantBox(p,new LivingParticipantBox(box,
lifeLine));
:this.freeX=box.getMaxX(stringBounder);
end
start
note right
void addParticipant(Participantp,ParticipantEngloberparticipantEnglober)
end note
:drawableSet.addParticipant(p,participantEnglober);
end
start
note right
void addEvent(Eventevent)
end note
:drawableSet.addEvent(event,null );
end
