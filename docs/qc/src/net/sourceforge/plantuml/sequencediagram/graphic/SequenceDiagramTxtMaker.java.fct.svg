@startuml
!pragma layout smetana
start
note right
constructor SequenceDiagramTxtMaker(SequenceDiagramsequenceDiagram,
FileFormatfileFormat)
end note
if (title.isWhite()) then (yes) 
else (no)
endif 
if (title.isWhite()==false) then (yes) 
endif 
end
start
note right
ImageDatacreateOne(OutputStreamos,intindex,
booleanisWithMetadata)
end note
if (fileFormat==FileFormat.UTXT) then (yes) 
else (no)
endif 
:return new ImageDataSimple(1,1);;
stop
end
start
note right
intgetNbPages()
end note
:return 1;;
stop
end
@enduml

