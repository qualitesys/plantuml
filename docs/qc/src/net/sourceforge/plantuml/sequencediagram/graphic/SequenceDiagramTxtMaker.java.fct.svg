@startuml
!pragma layout smetana
start
note right
constructor SequenceDiagramTxtMaker(SequenceDiagramsequenceDiagram,FileFormatfileFormat)
end note
:this.fileFormat=fileFormat;
:this.diagram=sequenceDiagram;
:this.skin=new TextSkin(fileFormat);
:initializer.addParticipant(p,null );
:initializer.addEvent(ev);
:drawableSet=initializer.createDrawableSet(dummyStringBounder);
:fullDimension=drawableSet.getDimension();
if (title.isWhite()) then (yes) 
:ug2=ug;
else (no)
:ug2=(UGraphicTxt)ug.apply(UTranslate.dy(title.asList().size()+1));
endif 
:drawableSet.drawU22(ug2,0,fullDimension.getWidth(),
page,diagram.isShowFootbox());
if (title.isWhite()==false) then (yes) 
:charArea.drawStringsLRSimple(title.asList(),
(int)((fullDimension.getWidth()-widthTitle)/2),0);
endif 
end
start
note right
ImageDatacreateOne(OutputStreamos,intindex,booleanisWithMetadata)
end note
if (fileFormat==FileFormat.UTXT) then (yes) 
:ug.getCharArea().print(ps);
else (no)
:ug.getCharArea().print(ps);
endif 
:return new ImageDataSimple(1,1);;
stop
end
start
note right
intgetNbPages()
end note
:return 1;;
stop
end
@enduml

