@startuml
!pragma layout smetana
start
note right
constructor LifeDestroy(doublestartingY,ParticipantBoxparticipant,
Componentcomp)
end note
end
start
note right
void drawInternalU(UGraphicug,doublemaxX,
Context2Dcontext)
end note
end
start
note right
