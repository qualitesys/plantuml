@startuml
!pragma layout smetana
start
note right
constructor GroupingGraphicalElementHeader(doublecurrentY,
Componentcomp,InGroupableListinGroupableList,
booleanisParallel)
end note
end
start
note right
StringtoString()
end note
:return super .toString()+" "+(getInGroupableList()==null ? String.valueOf("no"):getInGroupableList()
.toString());;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return width+5;;
stop
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return comp.getPreferredHeight(stringBounder);;
stop
end
start
note right
void drawInternalU(UGraphicug,doublemaxX,
Context2Dcontext)
end note
if (isParallel) then (yes) 
:return ;;
stop
endif 
if (endY>0) then (yes) 
else (no)
:return ;;
stop
endif 
end
start
note right
void setEndY(doubley)
end note
end
start
note right
void addNotes(StringBounderstringBounder,
Collection<Component>notes)
end note
end
@enduml

