@startuml
!pragma layout smetana
start
note right
void addList(InGroupableListinGroupableList)
end note
:other.addInGroupable(inGroupableList);;
:inGroupableStack.add(inGroupableList);;
end
start
note right
void pop()
end note
:inGroupableStack.remove(idx);;
end
start
note right
void addElement(InGroupableinGroupable)
end note
:groupingStructure.addInGroupable(inGroupable);;
end
start
note right
InGroupableListgetTopGroupingStructure()
end note
if (inGroupableStack.size()==0) then (yes) 
:return null ;;
stop
endif 
:return inGroupableStack.get(inGroupableStack.size()-1);;
stop
end
@enduml

