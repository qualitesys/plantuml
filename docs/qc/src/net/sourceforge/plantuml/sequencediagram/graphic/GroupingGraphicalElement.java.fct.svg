@startuml
!pragma layout smetana
start
note right
constructor GroupingGraphicalElement(doublecurrentY,
InGroupableListinGroupableList)
end note
end
start
note right
doublegetActualWidth(StringBounderstringBounder)
end note
:return Math.max(getPreferredWidth(stringBounder),
inGroupableList.getMaxX(stringBounder)-inGroupableList.getMinX(stringBounder)+
2*InGroupableList.MARGIN10);;
stop
end
start
note right
doublegetStartingX(StringBounderstringBounder)
end note
:return inGroupableList.getMinX(stringBounder)-InGroupableList.MARGIN10;;
stop
end
start
note right
InGroupableListgetInGroupableList()
end note
:return inGroupableList;;
stop
end
@enduml

