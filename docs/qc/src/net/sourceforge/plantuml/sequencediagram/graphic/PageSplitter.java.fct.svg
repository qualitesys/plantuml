@startuml
!pragma layout smetana
start
note right
constructor PageSplitter(doublefullHeight,
doubleheaderHeight,Map<Newpage,Double>newpages,
doubletailHeight,doublesignatureHeight,doublenewpageHeight,
DisplaydiagramTitle)
end note
end
start
note right
List<Page>getPages()
end note
if (positions.size()==0) then (yes) 
:return Arrays.asList(onePage());;
stop
endif 
:return result;;
stop
end
start
note right
PagelastPage()
end note
:return new Page(headerHeight,newpage1,newpage2,
tailHeight,signatureHeight,title);;
stop
end
start
note right
PagefirstPage()
end note
:return new Page(headerHeight,newpage1,newpage2,
tailHeight,0,diagramTitle);;
stop
end
start
note right
PageonePage()
end note
:return new Page(headerHeight,newpage1,newpage2,
tailHeight,signatureHeight,diagramTitle);;
stop
end
start
note right
PagecreatePage(inti)
end note
:return new Page(headerHeight,newpage1,newpage2,
tailHeight,0,title);;
stop
end
@enduml

