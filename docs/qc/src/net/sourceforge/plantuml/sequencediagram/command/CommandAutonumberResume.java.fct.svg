@startuml
!pragma layout smetana
start
note right
constructor CommandAutonumberResume()
end note
:super (getConcat());
end
start
note right
RegexConcatgetConcat()
end note
:return RegexConcat.build(CommandAutonumberResume.class .getName(),
RegexLeaf.start(),new RegexLeaf("autonumber"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("resume"),
RegexLeaf.spaceZeroOrMore(),new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),new RegexLeaf("INC","(\\d+)"))),new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),new RegexLeaf("DF","[%g]([^%g]+)[%g]"))),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(SequenceDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (df!=null ) then (yes) 
:decimalFormat=new DecimalFormat(df);
:return CommandExecutionResult.error("Error in pattern : "+df);;
stop
endif 
if (inc==null ) then (yes) 
:diagram.getAutoNumber().resume(decimalFormat);
else (no)
:diagram.getAutoNumber().resume(Integer.parseInt(inc),
decimalFormat);
endif 
:return CommandExecutionResult.ok();;
stop
end
@enduml

