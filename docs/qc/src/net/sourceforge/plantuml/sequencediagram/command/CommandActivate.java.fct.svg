@startuml
!pragma layout smetana
start
note right
constructor CommandActivate()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandActivate.class .getName(),
RegexLeaf.start(),new RegexLeaf("TYPE","(activate|deactivate|destroy|create)"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("WHO",
"([%pLN_.@]+|[%g][^%g]+[%g])"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("BACK","(#\\w+)?"),new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),new RegexLeaf("LINE","(#\\w+)"))),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(SequenceDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (error==null ) then (yes) 
:return CommandExecutionResult.ok();;
stop
endif 
:return CommandExecutionResult.error(error);;
stop
end
