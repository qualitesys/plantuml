@startuml
!pragma layout smetana
start
note right
constructor CommandLinkAnchor()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandLinkAnchor.class .getName(),
RegexLeaf.start(),new RegexLeaf("ANCHOR1",
"\\{([%pLN_]+)\\}"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("LINK","\\<-\\>"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("ANCHOR2","\\{([%pLN_]+)\\}"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("MESSAGE",
"(?::[%s]*(.*))?"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(SequenceDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.linkAnchor(anchor1,anchor2,
message);;
stop
end
@enduml

