@startuml
!pragma layout smetana
start
note right
constructor CommandParticipantA()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandParticipantA.class .getName(),
RegexLeaf.start(),getRegexType(),RegexLeaf.spaceOneOrMore(),
new RegexOptional(new RegexConcat(new RegexLeaf("FULL",
"[%g]([^%g]+)[%g]"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("as"),RegexLeaf.spaceOneOrMore())),
new RegexLeaf("CODE","([%pLN_.@]+)"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("STEREO","(\\<\\<.*\\>\\>)?"),
RegexLeaf.spaceZeroOrMore(),getOrderRegex(),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("URL",
"("+UrlBuilder.getRegexp()+")?"),RegexLeaf.spaceZeroOrMore(),
ColorParser.exp1(),RegexLeaf.end());;
stop
end
@enduml

