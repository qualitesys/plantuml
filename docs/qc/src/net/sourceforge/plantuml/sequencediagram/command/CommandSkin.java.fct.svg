!pragma layout smetana
start
note right
constructor CommandSkin()
end note
:super (getRegexConcat());;
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandSkin.class .getName(),RegexLeaf.start(),new RegexLeaf("skin"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("SKIN","([\\w.]+
)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TitledDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:try {return diagram.loadSkin(arg.get("SKIN",
0));}catch (IOExceptione){return CommandExecutionResult.error("Skin read error");};
end
