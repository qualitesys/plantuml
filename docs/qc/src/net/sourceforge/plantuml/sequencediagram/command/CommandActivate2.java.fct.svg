@startuml
!pragma layout smetana
start
note right
constructor CommandActivate2()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandActivate2.class .getName(),
RegexLeaf.start(),new RegexLeaf("NAME","([%pLN_.@]+)"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("TYPE",
"(\\+\\+|- -)"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("COLOR","(#\\w+)?"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(SequenceDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (error==null ) then (yes) 
:return CommandExecutionResult.ok();;
stop
endif 
:return CommandExecutionResult.error(error);;
stop
end
@enduml

