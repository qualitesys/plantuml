@startuml
!pragma layout smetana
start
note right
constructor CommandFootboxOld()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandFootboxOld.class .getName(),
RegexLeaf.start(),new RegexLeaf("footbox"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("TYPE",
"(on|off)?"),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(SequenceDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:diagram.setShowFootbox(footbox);
:return CommandExecutionResult.ok();;
stop
end
@enduml

