@startuml
!pragma layout smetana
start
note right
constructor CommandBoxEnd()
end note
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandBoxEnd.class .getName(),
RegexLeaf.start(),new RegexLeaf("end"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("box"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(SequenceDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (diagram.isBoxPending()==false) then (yes) 
:return CommandExecutionResult.error("Missing starting box");;
stop
endif 
:return CommandExecutionResult.ok();;
stop
end
@enduml

