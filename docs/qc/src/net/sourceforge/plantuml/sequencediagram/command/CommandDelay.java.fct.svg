@startuml
!pragma layout smetana
start
note right
constructor CommandDelay()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandDelay.class .getName(),
RegexLeaf.start(),new RegexLeaf("(?:\\.{3}|\u2026)"),
new RegexOptional(new RegexLeaf("LABEL","(.*)(?:\\.{3}|\u2026)")),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(SequenceDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:diagram.delay(strings);
:return CommandExecutionResult.ok();;
stop
end
@enduml

