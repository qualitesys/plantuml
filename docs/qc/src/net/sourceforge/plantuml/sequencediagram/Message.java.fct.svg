@startuml
!pragma layout smetana
start
note right
constructor Message(StyleBuilderstyleBuilder,
Participantp1,Participantp2,Displaylabel,
ArrowConfigurationarrowConfiguration,StringmessageNumber)
end note
end
start
note right
StringtoString()
end note
:return super .toString()+" "+p1+"->"+p2+
" "+getLabel();;
stop
end
start
note right
ParticipantgetParticipant1()
end note
:return p1;;
stop
end
start
note right
ParticipantgetParticipant2()
end note
:return p2;;
stop
end
start
note right
booleandealWith(Participantsomeone)
end note
:return someone==p1||someone==p2;;
stop
end
start
note right
booleancompatibleForCreate(Participantp)
end note
:return p1!=p&&p2==p;;
stop
end
start
note right
booleanisSelfMessage()
end note
:return p1==p2;;
stop
end
start
note right
void setMulticast(List<Participant>multicast)
end note
end
start
note right
List<Participant>getMulticast()
end note
:return multicast;;
stop
end
@enduml

