@startuml
!pragma layout smetana
start
note right
constructor LinkAnchor(Stringanchor1,Stringanchor2,
Stringmessage)
end note
end
start
note right
StringtoString()
end note
:return anchor1+"<->"+anchor2+" "+message;;
stop
end
start
note right
StringgetAnchor1()
end note
:return anchor1;;
stop
end
start
note right
StringgetAnchor2()
end note
:return anchor2;;
stop
end
start
note right
StringgetMessage()
end note
:return message;;
stop
end
start
note right
void drawAnchor(UGraphicug,CommonTiletile1,
CommonTiletile2,ISkinParamskinParam)
end note
if (YGauge.USE_ME) then (yes) 
else (no)
endif 
end
@enduml

