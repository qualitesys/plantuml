@startuml
!pragma layout smetana
start
note right
constructor LinkAnchor(Stringanchor1,Stringanchor2,
Stringmessage)
end note
:this.anchor1=anchor1;
:this.anchor2=anchor2;
:this.message=message;
end
start
note right
StringtoString()
end note
:return anchor1+"<->"+anchor2+" "+message;;
stop
end
start
note right
StringgetAnchor1()
end note
:return anchor1;;
stop
end
start
note right
StringgetAnchor2()
end note
:return anchor2;;
stop
end
start
note right
StringgetMessage()
end note
:return message;;
stop
end
start
note right
void drawAnchor(UGraphicug,CommonTiletile1,
CommonTiletile2,ISkinParamskinParam)
end note
if (YGauge.USE_ME) then (yes) 
:y1=(tile1.getYGauge().getMin().getCurrentValue()+tile1.getYGauge().getMax().getCurrentValue())/2+tile1.getContactPointRelative();
:y2=(tile2.getYGauge().getMin().getCurrentValue()+tile2.getYGauge().getMax().getCurrentValue())/2+tile2.getContactPointRelative();
else (no)
:y1=tile1.getTimeHook().getValue()+tile1.getContactPointRelative();
:y2=tile2.getTimeHook().getValue()+tile2.getContactPointRelative();
endif 
:snake.addPoint(x,ymin+2);
:snake.addPoint(x,ymax-2);
:snake.drawInternal(ug);
end
@enduml

