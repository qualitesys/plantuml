@startuml
!pragma layout smetana
start
note right
constructor TeozLayer(PngTitlertitler,StringBounderstringBounder,FontParamparam)
end note
:this.titler=titler;
:this.param=param;
:dimension=new XDimension2D(0,0);
if (titler!=null &&titler.getRibbonBlock()!=null ) then (yes) 
:dimension=titler.getRibbonBlock().calculateDimension(stringBounder);
endif 
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return dimension;;
stop
end
start
note right
FontParamgetParam()
end note
:return param;;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (titler!=null ) then (yes) 
:titler.getRibbonBlock().drawU(ug);
endif 
end
@enduml

