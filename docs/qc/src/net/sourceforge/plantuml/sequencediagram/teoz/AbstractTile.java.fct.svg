start
note right
constructor AbstractTile(StringBounderstringBounder,
YGaugecurrentY)
end note
:super (stringBounder);
if (YGauge.USE_ME) then (yes) 
:System.err.println("CREATING "+getClass());
endif 
end
start
note right
constructor AbstractTile(StringBounderstringBounder)
end note
:super (stringBounder);
end
start
note right
YGaugegetYGauge()
end note
:throw new UnsupportedOperationException(getClass().toString());;
end
start
note right
doublegetContactPointRelative()
end note
:return -1;;
stop
end
start
note right
doublegetZZZ()
end note
:return result;;
stop
end
start
note right
booleanmatchAnchor(Stringanchor)
