@startuml
!pragma layout smetana
start
note right
constructor AbstractTile(StringBounderstringBounder,
YGaugecurrentY)
end note
if (YGauge.USE_ME) then (yes) 
endif 
end
start
note right
constructor AbstractTile(StringBounderstringBounder)
end note
end
start
note right
YGaugegetYGauge()
end note
:throw new UnsupportedOperationException(getClass()
.toString());;
end
start
note right
doublegetContactPointRelative()
end note
:return -1;;
stop
end
start
note right
doublegetZZZ()
end note
:return result;;
stop
end
start
note right
booleanmatchAnchor(Stringanchor)
end note
if (event instanceof AbstractMessage) then (yes) 
if (anchor.equals(msg.getAnchor())) then (yes) 
:return true;;
stop
endif 
endif 
:return false;;
stop
end
@enduml

