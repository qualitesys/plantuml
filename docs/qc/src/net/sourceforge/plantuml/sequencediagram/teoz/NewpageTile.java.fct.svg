@startuml
!pragma layout smetana
start
note right
doublegetContactPointRelative()
end note
:return 0;;
stop
end
start
note right
constructor NewpageTile(Newpagenewpage,TileArgumentstileArguments,YGaugecurrentY)
end note
:super (tileArguments.getStringBounder(),
currentY);
:this.newpage=newpage;
:this.tileArguments=tileArguments;
end
start
note right
void drawU(UGraphicug)
end note
end
start
note right
doublegetPreferredHeight()
end note
:return 0;;
stop
end
start
note right
void addConstraints()
end note
end
start
note right
RealgetMinX()
end note
:return tileArguments.getXOrigin();;
stop
end
start
note right
RealgetMaxX()
end note
:return tileArguments.getXOrigin();;
stop
end
start
note right
EventgetEvent()
end note
:return newpage;;
stop
end
@enduml

