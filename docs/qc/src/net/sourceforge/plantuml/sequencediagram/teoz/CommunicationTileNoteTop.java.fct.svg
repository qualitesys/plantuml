" points="222.5,514.6836,226.5,524.6836,230.5,514.6836,226.5,518.6836" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="226.5" x2="226.5" y1="586.5898" y2="606.5898"/><polygon fill="#181818" points="222.5,596.5898,226.5,606.5898,230.5,596.5898,226.5,600.5898" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[bd238b5db7135e3586f4503ddd223e22]
@startuml
!pragma layout smetana
start
note right
constructor CommunicationTileNoteTop(Tiletile,
AbstractMessagemessage,Roseskin,ISkinParamskinParam,
NotenoteOnMessage,YGaugecurrentY)
end note
:super (tile,message,skin,skinParam,noteOnMessage,
currentY);;
end
start
note right
void drawU(UGraphicug)
end note
:((UDrawable)tile).drawU(ug.apply(UTranslate.dy(dim.getHeight()+
spacey)));;
if (YGauge.USE_ME) then (yes) 
:ug=ug.apply(UTranslate.dy(getYGauge().getMin()
.getCurrentValue()));;
endif 
:comp.drawU(ug.apply(UTranslate.dx(xNote)),
area,(Context2D)ug);;
:drawLine(ug,middleMsg,tile.getContactPointRelative()+
dim.getHeight()+spacey,xNote+dim.getWidth()/2,
dim.getHeight()-2*Rose.paddingY);;
end
@enduml

