@startuml
!pragma layout smetana
start
note right
constructor CommunicationTileNoteTop(Tiletile,
AbstractMessagemessage,Roseskin,ISkinParamskinParam,
NotenoteOnMessage,YGaugecurrentY)
end note
:super (tile,message,skin,skinParam,noteOnMessage,
currentY);
end
start
note right
void drawU(UGraphicug)
end note
:((UDrawable)tile).drawU(ug.apply(UTranslate.dy(dim.getHeight()+spacey)));
if (YGauge.USE_ME) then (yes) 
:ug=ug.apply(UTranslate.dy(getYGauge().getMin().getCurrentValue()));
endif 
:comp.drawU(ug.apply(UTranslate.dx(xNote)),
area,(Context2D)ug);
:drawLine(ug,middleMsg,tile.getContactPointRelative()+dim.getHeight()+spacey,
xNote+dim.getWidth()/2,dim.getHeight()-2*Rose.paddingY);
end
@enduml

