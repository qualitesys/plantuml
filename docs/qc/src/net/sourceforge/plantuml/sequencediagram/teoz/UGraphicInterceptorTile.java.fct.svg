@startuml
!pragma layout smetana
start
note right
constructor UGraphicInterceptorTile(UGraphicug,
booleanisBackground)
end note
end
start
note right
void draw(UShapeshape)
end note
if (shape instanceof Tile) then (yes) 
else (no)
endif 
end
start
note right
UGraphicapply(UChangechange)
end note
:return new UGraphicInterceptorTile(getUg().apply(change),
isBackground);;
stop
end
start
note right
booleanisBackground()
end note
:return isBackground;;
stop
end
@enduml

