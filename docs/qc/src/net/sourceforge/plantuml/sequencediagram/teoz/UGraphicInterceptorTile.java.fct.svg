@startuml
!pragma layout smetana
start
note right
constructor UGraphicInterceptorTile(UGraphicug,booleanisBackground)
end note
:super (ug);
:this.isBackground=isBackground;
end
start
note right
void draw(UShapeshape)
end note
if (shape instanceof Tile) then (yes) 
:drawable.drawU(this);
else (no)
:getUg().draw(shape);
endif 
end
start
note right
UGraphicapply(UChangechange)
end note
:return new UGraphicInterceptorTile(getUg().apply(change),
isBackground);;
stop
end
start
note right
booleanisBackground()
end note
:return isBackground;;
stop
end
@enduml

