92" y2="930.9492"/><polygon fill="#181818" points="204,920.9492,208,930.9492,212,920.9492,208,924.9492" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="208" x2="208" y1="978.8867" y2="998.8867"/><polygon fill="#181818" points="204,988.8867,208,998.8867,212,988.8867,208,992.8867" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[31ca70096691216de1690fd3e16eb9ec]
@startuml
!pragma layout smetana
start
note right
UGraphicNewpagescreate(UGraphicug,doubleymin,
doubleymax)
end note
:return new UGraphicNewpages(ug,ymin,ymax,0);;
stop
end
start
note right
constructor UGraphicNewpages(UGraphicug,doubleymin,
doubleymax,doubledy)
end note
:super (ug);
:this.ymin=ymin;
:this.ymax=ymax;
:this.dy=dy;
end
start
note right
void draw(UShapeshape)
end note
:System.err.println("UGraphicNewpages "+shape.getClass());
if (dy>=ymin&&dy<ymax) then (yes) 
:getUg().draw(shape);
else (no)
:System.err.println("Removing "+shape);
endif 
end
start
note right
UGraphicapply(UChangechange)
end note
if (change instanceof UTranslate) then (yes) 
:newdy+=((UTranslate)change).getDy();
endif 
:return new UGraphicNewpages(getUg().apply(change),
ymin,ymax,newdy);;
stop
end
@enduml

