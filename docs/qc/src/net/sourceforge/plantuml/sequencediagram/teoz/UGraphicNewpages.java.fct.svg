" y2="968.6211"/><polygon fill="#181818" points="204,958.6211,208,968.6211,212,958.6211,208,962.6211" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ec3247cb8a0fb4052a3195a024b73f83]
@startuml
!pragma layout smetana
start
note right
UGraphicNewpagescreate(UGraphicug,doubleymin,doubleymax)
end note
:return new UGraphicNewpages(ug,ymin,ymax,0);;
stop
end
start
note right
constructor UGraphicNewpages(UGraphicug,doubleymin,doubleymax,doubledy)
end note
:super (ug);
:this.ymin=ymin;
:this.ymax=ymax;
:this.dy=dy;
end
start
note right
void draw(UShapeshape)
end note
:System.err.println("UGraphicNewpages "+shape.getClass());
if (dy>=ymin&&dy<ymax) then (yes) 
:getUg().draw(shape);
else (no)
:System.err.println("Removing "+shape);
endif 
end
start
note right
UGraphicapply(UChangechange)
end note
if (change instanceof UTranslate) then (yes) 
:newdy+=((UTranslate)change).getDy();
endif 
:return new UGraphicNewpages(getUg().apply(change),
ymin,ymax,newdy);;
stop
end
@enduml

