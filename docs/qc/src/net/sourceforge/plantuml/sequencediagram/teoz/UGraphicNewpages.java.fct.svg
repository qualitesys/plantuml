5469,208,792.5469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="208" x2="208" y1="924.918" y2="944.918"/><polygon fill="#181818" points="204,934.918,208,944.918,212,934.918,208,938.918" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="208" x2="208" y1="992.8555" y2="1012.8555"/><polygon fill="#181818" points="204,1002.8555,208,1012.8555,212,1002.8555,208,1006.8555" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9b82010f4cdc511804b22525c0ce618c]
@startuml
!pragma layout smetana
start
note right
UGraphicNewpagescreate(UGraphicug,doubleymin,
doubleymax)
end note
:return new UGraphicNewpages(ug,ymin,ymax,
0);;
stop
end
start
note right
constructor UGraphicNewpages(UGraphicug,doubleymin,
doubleymax,doubledy)
end note
:super (ug);
:this.ymin=ymin;
:this.ymax=ymax;
:this.dy=dy;
end
start
note right
void draw(UShapeshape)
end note
:System.err.println("UGraphicNewpages "+shape.getClass());
if (dy>=ymin&&dy<ymax) then (yes) 
:getUg().draw(shape);
else (no)
:System.err.println("Removing "+shape);
endif 
end
start
note right
UGraphicapply(UChangechange)
end note
if (change instanceof UTranslate) then (yes) 
:newdy+=((UTranslate)change).getDy();
endif 
:return new UGraphicNewpages(getUg().apply(change),
ymin,ymax,newdy);;
stop
end
@enduml

