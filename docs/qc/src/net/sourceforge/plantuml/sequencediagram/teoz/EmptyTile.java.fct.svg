start
note right
constructor EmptyTile(doubleheight,Tileposition,
YGaugecurrentY)
end note
:super (((AbstractTile)position).getStringBounder(),
currentY);
if (YGauge.USE_ME) then (yes) 
:throw new UnsupportedOperationException();;
endif 
:this.height=height;
:this.position=position;
:this.yGauge=YGauge.create(currentY.getMax(),
getPreferredHeight());
end
start
note right
YGaugegetYGauge()
end note
:return yGauge;;
stop
end
start
note right
void drawU(UGraphicug)
end note
end
start
note right
doublegetPreferredHeight()
end note
:return height;;
stop
end
start
note right
void addConstraints()
end note
end
start
note right
RealgetMinX()
end note
:return position.getMinX();;
stop
end
start
note right
RealgetMaxX()
end note
:return position.getMaxX();;
stop
end
