@startuml
!pragma layout smetana
start
note right
constructor EmptyTile(doubleheight,Tileposition,
YGaugecurrentY)
end note
if (YGauge.USE_ME) then (yes) 
:throw new UnsupportedOperationException();;
endif 
end
start
note right
YGaugegetYGauge()
end note
:return yGauge;;
stop
end
start
note right
void drawU(UGraphicug)
end note
end
start
note right
doublegetPreferredHeight()
end note
:return height;;
stop
end
start
note right
void addConstraints()
end note
end
start
note right
RealgetMinX()
end note
:return position.getMinX();;
stop
end
start
note right
RealgetMaxX()
end note
:return position.getMaxX();;
stop
end
start
note right
EventgetEvent()
end note
:return new AbstractEvent(){public booleandealWith(Participantsomeone){return false;}};;
stop
end
@enduml

