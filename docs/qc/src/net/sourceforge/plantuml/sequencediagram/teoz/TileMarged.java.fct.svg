end note
end
start
note right
RealgetMinX()
end note
:return tile.getMinX();;
stop
end
start
note right
RealgetMaxX()
end note
:return tile.getMaxX().addFixed(x1+x2);;
stop
end
start
note right
EventgetEvent()
end note
:return tile.getEvent();;
stop
end
@enduml

