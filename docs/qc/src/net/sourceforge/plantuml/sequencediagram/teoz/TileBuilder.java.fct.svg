@startuml
!pragma layout smetana
start
note right
List<Tile>buildSeveral(Iterator<Event>it,
TileArgumentstileArguments,Tileparent,YGaugecurrentY)
end note
:while (it.hasNext()){final Eventev=it.next();for (Tiletile:TileBuilder.buildOne(it,
tileArguments,ev,parent,currentY)){tiles.add(tile);final RealtmpMax=tile.getMaxX();if (YGauge.USE_ME){final YGaugegauge=tile.getYGauge();currentY=gauge;}}};
:return Collections.unmodifiableList(tiles);;
stop
end
start
note right
List<Tile>buildOne(Iterator<Event>it,TileArgumentstileArguments,
final Eventev,Tileparent,YGaugecurrentY)
end note
if (ev instanceof Message) then (yes) 
if (msg.isSelfMessage()) then (yes) 
:result=new CommunicationTileSelf(tileArguments.getStringBounder(),
livingSpace1,msg,skin,skinParam,livingSpaces,
currentY);;
else (no)
:result=new CommunicationTile(tileArguments.getStringBounder(),
livingSpaces,msg,skin,skinParam,currentY);;
:reverse=((CommunicationTile)result).isReverse(stringBounder);;
endif 
if (notePosition==NotePosition.LEFT) then (yes) 
:result=new CommunicationTileNoteLeft(result,
msg,skin,skinParam,reverse? livingSpace2:livingSpace1,
noteOnMessage,currentY);;
endif 
:tiles.add(result);;
else (no)
:System.err.println("TileBuilder::Ignoring "+
ev.getClass());;
endif 
:return tiles;;
stop
end
@enduml

