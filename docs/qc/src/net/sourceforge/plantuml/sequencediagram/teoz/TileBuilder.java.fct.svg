@startuml
!pragma layout smetana
start
note right
List<Tile>buildSeveral(Iterator<Event>it,
TileArgumentstileArguments,Tileparent,YGaugecurrentY)
end note
while (it.hasNext())
if (YGauge.USE_ME) then (yes) 
endif 
endwhile
:return Collections.unmodifiableList(tiles);;
stop
end
start
note right
List<Tile>buildOne(Iterator<Event>it,TileArgumentstileArguments,
final Eventev,Tileparent,YGaugecurrentY)
end note
if (ev instanceof Message) then (yes) 
if (msg.isSelfMessage()) then (yes) 
else (no)
endif 
if (notePosition==NotePosition.LEFT) then (yes) 
endif 
else (no)
endif 
:return tiles;;
stop
end
@enduml

