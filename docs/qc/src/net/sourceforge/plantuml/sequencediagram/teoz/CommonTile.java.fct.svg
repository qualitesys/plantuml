@startuml
!pragma layout smetana
start
note right
constructor CommonTile(StringBounderstringBounder)
end note
end
start
note right
void callbackY(TimeHooky)
end note
if (YGauge.USE_ME) then (yes) 
else (no)
endif 
end
start
note right
void callbackY_internal(TimeHooky)
end note
if (YGauge.USE_ME) then (yes) 
endif 
end
start
note right
StringBoundergetStringBounder()
end note
:return stringBounder;;
stop
end
start
note right
doublegetMiddleX()
end note
:return (min+max)/2;;
stop
end
start
note right
TimeHookgetTimeHook()
end note
if (YGauge.USE_ME) then (yes) 
:throw new IllegalStateException();;
endif 
:return y;;
stop
end
@enduml

