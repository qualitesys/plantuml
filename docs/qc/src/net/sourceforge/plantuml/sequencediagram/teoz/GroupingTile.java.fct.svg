@startuml
!pragma layout smetana
start
note right
EventgetEvent()
end note
:return start;;
stop
end
start
note right
doublegetContactPointRelative()
end note
:return 0;;
stop
end
start
note right
YGaugegetYGauge()
end note
:return yGauge;;
stop
end
start
note right
constructor GroupingTile(Iterator<Event>it,
GroupingStartstart,TileArgumentstileArgumentsBackColorChanged,
TileArgumentstileArgumentsOriginal,YGaugecurrentY)
end note
:super (tileArgumentsBackColorChanged.getStringBounder(),
currentY);
:this.start=start;
:this.display=start.getTitle().equals("group")? Display.create(start.getComment()):Display.create(start.getTitle(),
start.getComment());
:this.skin=tileArgumentsOriginal.getSkin();
:this.skinParam=tileArgumentsBackColorChanged.getSkinParam();
:currentY=YGauge.create(currentY.getMax()
.addAtLeast(h),0);
while (it.hasNext())
if (ev instanceof GroupingLeaf&&((Grouping)ev)
.getType()==GroupingType.END) then (yes) 
endif 
:tiles.add(tile);
if (YGauge.USE_ME) then (yes) 
:currentY=tile.getYGauge();
endif 
endwhile
:tiles=mergeParallel(getStringBounder(),tiles);
:bodyHeight+=tile.getPreferredHeight();
if (ev instanceof GroupingLeaf&&((Grouping)ev)
.getType()==GroupingType.ELSE) then (yes) 
:allElses.add(tile);
endif 
:min2.add(tile.getMinX().addFixed(-MARGINX));
:max2.add(m.addFixed(MARGINX));
if (min2.size()==0) then (yes) 
:min2.add(tileArgumentsOriginal.getXOrigin());
endif 
:this.min=RealUtils.min(min2);
:max2.add(anElse.getMaxX());
:max2.add(this.min.addFixed(width+16));
:this.max=RealUtils.max(max2);
:this.yGauge=YGauge.create(firstY,getPreferredHeight());
end
start
note right
ComponentgetComponent(StringBounderstringBounder)
end note
:return comp;;
stop
end
start
note right
XDimension2DgetPreferredDimensionIfEmpty(StringBounderstringBounder)
end note
:return getComponent(stringBounder).getPreferredDimension(stringBounder);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (YGauge.USE_ME) then (yes) 
:comp.drawU(ug.apply(new UTranslate(min.getCurrentValue(),
getYGauge().getMin().getCurrentValue())),
area,(Context2D)ug);
else (no)
:comp.drawU(ug.apply(UTranslate.dx(min.getCurrentValue())),
area,(Context2D)ug);
:drawAllElses(ug);
endif 
if (YGauge.USE_ME) then (yes) 
:((UDrawable)tile).drawU(ug);
else (no)
:((UDrawable)tile).drawU(ug.apply(UTranslate.dy(h)));
endif 
:h+=preferredHeight;
end
start
note right
doublegetTotalHeight(StringBounderstringBounder)
end note
:return bodyHeight+dimIfEmpty.getHeight()+
MARGINY_MAGIC/2;;
stop
end
start
note right
void drawAllElses(UGraphicug)
end note
if (tile instanceof ElseTile) then (yes) 
if (YGauge.USE_ME) then (yes) 
:ypos=elseTile.getYGauge().getMin().getCurrentValue()-getYGauge().getMin().getCurrentValue()+
MARGINY_MAGIC/2;
else (no)
:ypos=elseTile.getTimeHook().getValue()-getTimeHook().getValue()+
MARGINY_MAGIC/2;
endif 
:ys.add(ypos);
endif 
:ys.add(totalHeight);
if (tile instanceof ElseTile) then (yes) 
:comp.drawU(ug.apply(new UTranslate(min.getCurrentValue(),
ys.get(i))),area,(Context2D)ug);
:i++;
endif 
end
start
note right
doublegetPreferredHeight()
end note
:return dim1.getHeight()+bodyHeight+MARGINY_MAGIC;;
stop
end
start
note right
void addConstraints()
end note
:tile.addConstraints();
end
start
note right
RealgetMinX()
end note
:return min.addFixed(-EXTERNAL_MARGINX1);;
stop
end
start
note right
RealgetMaxX()
end note
:return max.addFixed(EXTERNAL_MARGINX2);;
stop
end
start
note right
TimeHookfillPositionelTiles(StringBounderstringBounder,
TimeHooky,List<Tile>tiles,final List<CommonTile>local,
List<CommonTile>full)
end note
:tile.callbackY(y);
:local.add((CommonTile)tile);
:full.add((CommonTile)tile);
if (tile instanceof GroupingTile) then (yes) 
:fillPositionelTiles(stringBounder,new TimeHook(y.getValue()+
headerHeight),groupingTile.tiles,local2,full);
endif 
:y=new TimeHook(y.getValue()+tile.getPreferredHeight());
:return y;;
stop
end
start
note right
doublegetHeaderHeight(StringBounderstringBounder)
end note
:return getPreferredDimensionIfEmpty(stringBounder)
.getHeight()+10;;
stop
end
start
note right
List<Tile>mergeParallel(StringBounderstringBounder,
List<Tile>tiles)
end note
if (YGauge.USE_ME) then (yes) 
:return tiles;;
stop
endif 
:tiles=removeEmptyCloseToParallel(tiles);
if (result.size()>0&&isParallel(tile)) then (yes) 
if (pending==null ) then (yes) 
:pending=new TileParallel(stringBounder,null );
if (tmp instanceof LifeEventTile) then (yes) 
:pending.add(result.get(result.size()-2));
:pending.add(tmp);
:result.set(result.size()-2,pending);
:result.remove(result.size()-1);
else (no)
:pending.add(tmp);
:result.set(result.size()-1,pending);
endif 
endif 
:pending.add(tile);
else (no)
:result.add(tile);
:pending=null ;
endif 
:return result;;
stop
end
start
note right
List<Tile>removeEmptyCloseToParallel(List<Tile>tiles)
end note
if (isParallel(tile)) then (yes) 
:removeHeadEmpty(result);
endif 
:result.add(tile);
:return result;;
stop
end
start
note right
void removeHeadEmpty(List<Tile>tiles)
end note
while (tiles.size()>0&&tiles.get(tiles.size()-1) instanceof EmptyTile)
:tiles.remove(tiles.size()-1);
endwhile
end
start
note right
booleanisParallel(Tiletile)
end note
:return tile instanceof TileParallel==false&&tile.getEvent()
.isParallel();;
stop
end
start
note right
void addYNewPages(Collection<Double>yNewPages)
end note
if (tile instanceof GroupingTile) then (yes) 
:((GroupingTile)tile).addYNewPages(yNewPages);
endif 
if (tile instanceof NewpageTile) then (yes) 
:yNewPages.add(y);
endif 
end
