@startuml
!pragma layout smetana
start
note right
PSegmentcreatePSegment(doubleminsize)
end note
:all.add(result);;
:return result;;
stop
end
start
note right
void addFixedLink(PSegmentsegment1,doubleposition1,
PSegmentsegment2,doubleposition2)
end note
:links.add(link);;
end
start
note right
void solve()
end note
repeat
:changed=false;;
if (link.pushIfNeed()) then (yes) 
:changed=true;;
endif 
repeat while (changed)
end
@enduml

