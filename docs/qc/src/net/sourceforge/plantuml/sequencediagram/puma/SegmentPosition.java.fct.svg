@startuml
!pragma layout smetana
start
note right
constructor SegmentPosition(PSegmentsegment,doubleposition)
end note
:this.segment=segment;
:this.position=position;
end
start
note right
doublegetPosition()
end note
:return segment.getPosition(position);;
stop
end
start
note right
PSegmentgetSegment()
end note
:return segment;;
stop
end
@enduml

