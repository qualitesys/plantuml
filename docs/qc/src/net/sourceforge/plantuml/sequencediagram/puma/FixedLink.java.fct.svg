@startuml
!pragma layout smetana
start
note right
constructor FixedLink(SegmentPositionsegmentPosition1,
SegmentPositionsegmentPosition2)
end note
:this.segmentPosition1=segmentPosition1;;
:this.segmentPosition2=segmentPosition2;;
end
start
note right
booleanpushIfNeed()
end note
if (p1==p2) then (yes) 
:return false;;
stop
endif 
:segmentPosition2.getSegment().push(diff);;
:assert segmentPosition1.getPosition()==segmentPosition2.getPosition();;
:return true;;
stop
end
@enduml

