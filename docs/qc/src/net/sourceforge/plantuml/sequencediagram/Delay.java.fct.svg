@startuml
!pragma layout smetana
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return ComponentType.DELAY_TEXT.getStyleSignature();;
stop
end
start
note right
Style[]getUsedStyles()
end note
:return new Style[]{style};;
stop
end
start
note right
constructor Delay(Displaytext,StyleBuilderstyleBuilder)
end note
:this.text=text;
:this.style=getStyleSignature().getMergedStyle(styleBuilder);
end
start
note right
DisplaygetText()
end note
:return text;;
stop
end
start
note right
booleandealWith(Participantsomeone)
end note
:return false;;
stop
end
@enduml

