@startuml
!pragma layout smetana
start
note right
constructor PSystemDotFactory(DiagramTypediagramType)
end note
:super (diagramType);;
end
start
note right
PSystemDotinitDiagram(UmlSourcesource,StringstartLine)
end note
:data=null ;;
:return null ;;
stop
end
start
note right
PSystemDotexecuteLine(UmlSourcesource,PSystemDotsystem,
Stringline)
end note
if (system==null &&line.matches("(strict\\s+
)?(di)?graph\\s+\"?[-\\w]+\"?\\s*\\{")) then (yes) 
:data=new StringBuilder(line);;
:data.append("\n");;
:return new PSystemDot(source,data.toString());;
stop
endif 
if (data==null ||system==null ) then (yes) 
:return null ;;
stop
endif 
:data.append(line);;
:data.append("\n");;
:return new PSystemDot(source,data.toString());;
stop
end
