@startuml
!pragma layout smetana
start
note right
constructor TimeoutExecutor(longms)
end note
:this.ms=ms;
end
start
note right
booleanexecuteNow(MyRunnabletask)
end note
:mainThread.start();
:mainThread.join(ms);
:System.err.println("TimeoutExecutorA "+e);
:Logme.error(e);
:return false;;
stop
:done=mainThread.done.get();
if (done==false) then (yes) 
:task.cancelJob();
:mainThread.interrupt();
endif 
:return done;;
stop
end
start
note right
constructor MyThread(MyRunnabletask)
end note
:this.task=task;
end
start
note right
void run()
end note
:task.runJob();
:done.set(true);
:System.err.println("TimeoutExecutorB "+e);
:Logme.error(e);
end
@enduml

