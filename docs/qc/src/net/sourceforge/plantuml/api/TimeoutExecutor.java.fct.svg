.2422" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="429.5" x2="429.5" y1="519.8086" y2="542.375"/><polygon fill="#181818" points="425.5,532.375,429.5,542.375,433.5,532.375,429.5,536.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="429.5" x2="429.5" y1="590.3125" y2="610.3125"/><polygon fill="#181818" points="425.5,600.3125,429.5,610.3125,433.5,600.3125,429.5,604.3125" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2b358680906e25800bcab818dfb7c59e]
@startuml
!pragma layout smetana
start
note right
constructor TimeoutExecutor(longms)
end note
:this.ms=ms;;
end
start
note right
booleanexecuteNow(MyRunnabletask)
end note
:try {mainThread.start();mainThread.join(ms);}catch (InterruptedExceptione){System.err.println("TimeoutExecutorA "+
e);Logme.error(e);return false;}finally {done=mainThread.done.get();if (done==false){task.cancelJob();mainThread.interrupt();}};
:return done;;
stop
end
start
note right
constructor MyThread(MyRunnabletask)
end note
:this.task=task;;
end
start
note right
void run()
end note
:try {task.runJob();done.set(true);}catch (InterruptedExceptione){System.err.println("TimeoutExecutorB "+
e);Logme.error(e);};
end
@enduml

