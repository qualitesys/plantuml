ne style="stroke:#181818;stroke-width:1.0;" x1="173" x2="173" y1="1048.0938" y2="1068.0938"/><polygon fill="#181818" points="169,1058.0938,173,1068.0938,177,1058.0938,173,1062.0938" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8cbe50ddb4a973bd361617ab7db5aa86]
@startuml
!pragma layout smetana
start
note right
constructor TimeoutExecutor(longms)
end note
:this.ms=ms;;
end
start
note right
booleanexecuteNow(MyRunnabletask)
end note
:final MyThreadmainThread=new MyThread(task);;
:booleandone=false;;
:try ;
:mainThread.start();;
:mainThread.join(ms);;
:return done;;
stop
end
start
note right
constructor MyThread(MyRunnabletask)
end note
:this.task=task;;
end
start
note right
void run()
end note
:try ;
:task.runJob();;
:done.set(true);;
:catch (InterruptedExceptione);
:System.err.println("TimeoutExecutorB "+e);;
:Logme.error(e);;
end
@enduml

