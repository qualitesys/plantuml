@startuml
!pragma layout smetana
start
note right
intgetNicer(final intvalue)
end note
if (value<=18) then (yes) 
:return value;;
stop
endif 
if (value<93) then (yes) 
:return ((value+2)/5)*5;;
stop
endif 
if (value<100) then (yes) 
:return ((value+5)/10)*10;;
stop
endif 
while (head>=100)
endwhile
:return getNicer((int)Math.round(head))*m;;
stop
end
start
note right
Stringformat(final longv)
end note
:return t;;
stop
end
@enduml

