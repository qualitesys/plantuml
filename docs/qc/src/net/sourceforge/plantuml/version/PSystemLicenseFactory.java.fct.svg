@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,Stringline)
end note
if (line.matches("(?i)^li[sc][ea]n[sc]e\\s*$")) then (yes) 
:return PSystemLicense.create(source);;
stop
endif 
:Log.error("Error "+e);
:return null ;;
stop
end
@enduml

