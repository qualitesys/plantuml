a31f1517dea7dc449a2553b679ae9]
@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,
Stringline)
end note
:try ;
if (line.matches("(?i)^li[sc][ea]n[sc]e\\s*$")) then (yes) 
:return PSystemLicense.create(source);;
stop
endif 
:catch (IOExceptione);
:Log.error("Error "+e);;
:return null ;;
stop
end
@enduml

