@startuml
!pragma layout smetana
start
note right
UDrawablegetRootDrawable(FileFormatOptionfileFormatOption)
end note
:return this;;
stop
end
start
note right
PSystemLicensecreate(UmlSourcesource)
end note
:return new PSystemLicense(source);;
stop
end
start
note right
constructor PSystemLicense(UmlSourcesource)
end note
:super (source);
end
start
note right
TextBlockBackcoloredgetGraphicStrings(List<String>strings)
end note
:return GraphicStrings.createBlackOnWhite(strings);;
stop
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(License)");;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (logo==null ) then (yes) 
:strings.addAll(License.getCurrent().getText1(licenseInfo));
:strings.addAll(License.getCurrent().getText2(licenseInfo));
:getGraphicStrings(strings).drawU(ug);
else (no)
:strings1.addAll(License.getCurrent().getText1(licenseInfo));
:strings2.addAll(License.getCurrent().getText2(licenseInfo));
:result1.drawU(ug);
:ug=ug.apply(UTranslate.dy(4+result1.calculateDimension(ug.getStringBounder()).getHeight()));
:ug.apply(UTranslate.dx(20)).draw(im);
:ug=ug.apply(UTranslate.dy(im.getHeight()));
:result2.drawU(ug);
endif 
end
@enduml

