@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,
Stringline)
end note
:try {if (line.matches("(?i)^(authors?|about)\\s*$")){return PSystemVersion.createShowAuthors2(source);
:}if (line.matches("(?i)^version\\s*$")){return PSystemVersion.createShowVersion2(source);
:}if (line.matches("(?i)^stdlib\\s*$")){return PSystemVersion.createStdLib(source);
:}if (line.matches("(?i)^testdot\\s*$")){return PSystemVersion.createTestDot(source);
:}if (line.matches("(?i)^keydistributor\\s*$")){return PSystemVersion.createKeyDistributor(source);}if (line.matches("(?i)^keygen\\s*$")){line=line.trim();return new PSystemKeygen(source,
"");}if (line.matches("(?i)^keyimport(\\s+
[0-9a-z]+)?\\s*$")){line=line.trim();final Stringkey=line.substring(String.valueOf("keyimport").length()).trim();return new PSystemKeygen(source,key);}if (line.matches("(?i)^keycheck\\s+
([0-9a-z]+)\\s+([0-9a-z]+)\\s*$")){final Patternp=Pattern.compile("(?i)^keycheck\\s+
([0-9a-z]+)\\s+([0-9a-z]+)\\s*$");final Matcherm=p.matcher(line);if (m.find()){return new PSystemKeycheck(source,m.group(1),m.group(2));}}}catch (IOExceptione){Log.error("Error "+
e);};
:return null ;;
stop
end
@enduml

