@startuml
!pragma layout smetana
start
note right
constructor CommandAddMethod()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandAddMethod.class .getName(),
RegexLeaf.start(),new RegexLeaf("NAME","([%pLN_.]+
|[%g][^%g]+[%g])"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf(":"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("DATA","(.*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ClassDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (diagram.V1972()) then (yes) 
:entity=diagram.getLeafVerySmart(diagram.cleanIdent(ident));
if (entity==null ) then (yes) 
:entity=diagram.getOrCreateLeaf(ident,code,
null ,null );
endif 
else (no)
:entity=diagram.getOrCreateLeaf(ident,code,
null ,null );
endif 
if (field.length()>0&&VisibilityModifier.isVisibilityCharacter(field)) then (yes) 
:diagram.setVisibilityModifierPresent(true);
endif 
:entity.getBodier().addFieldOrMethod(field);
:return CommandExecutionResult.ok();;
stop
end
