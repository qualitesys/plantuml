@startuml
!pragma layout smetana
start
note right
constructor CommandUrl()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandUrl.class .getName(),
RegexLeaf.start(),new RegexLeaf("url"),RegexLeaf.spaceZeroOrMore(),
new RegexOptional(new RegexLeaf("of|for")),RegexLeaf.spaceOneOrMore(),new RegexLeaf("CODE","([%pLN_.]+
|[%g][^%g]+[%g])"),RegexLeaf.spaceOneOrMore(),
new RegexOptional(new RegexLeaf("is")),RegexLeaf.spaceZeroOrMore(),new RegexLeaf("URL","("+
UrlBuilder.getRegexp()+")"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(AbstractEntityDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (leafExist) then (yes) 
:entity=diagram.getOrCreateLeaf(ident,code,
null ,null );
else (no)
:return CommandExecutionResult.error(code+
" does not exist");;
stop
endif 
:entity.addUrl(url);
:return CommandExecutionResult.ok();;
stop
end
@enduml

