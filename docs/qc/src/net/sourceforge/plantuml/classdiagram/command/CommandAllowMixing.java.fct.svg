@startuml
!pragma layout smetana
start
note right
constructor CommandAllowMixing()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandAllowMixing.class .getName(),
RegexLeaf.start(),new RegexLeaf("allow"),
new RegexLeaf("_?"),new RegexLeaf("mixing"),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ClassDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:diagram.setAllowMixing(true);
:return CommandExecutionResult.ok();;
stop
end
@enduml

