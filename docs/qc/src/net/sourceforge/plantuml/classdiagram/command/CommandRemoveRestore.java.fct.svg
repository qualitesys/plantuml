@startuml
!pragma layout smetana
start
note right
constructor CommandRemoveRestore()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandRemoveRestore.class .getName(),
RegexLeaf.start(),new RegexLeaf("COMMAND",
"(remove|restore)"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("WHAT","(.+
)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(CucaDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:diagram.removeOrRestore(what,show);
:return CommandExecutionResult.ok();;
stop
end
@enduml

