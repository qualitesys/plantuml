@startuml
!pragma layout smetana
start
note right
constructor CommandHideShowSpecificClass()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandHideShowSpecificClass.class .getName(),
RegexLeaf.start(),new RegexLeaf("COMMAND",
"(hide|show)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("CODE","("+CommandCreateClass.CODE+")"),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(CucaDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:throw new UnsupportedOperationException();;
end
@enduml

