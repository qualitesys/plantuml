@startuml
!pragma layout smetana
start
note right
constructor CommandDiamondAssociation()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandDiamondAssociation.class .getName(),
RegexLeaf.start(),new RegexLeaf("\\<\\>"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("CODE",
"([%pLN_.]+)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ClassDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (leafExist) then (yes) 
:return CommandExecutionResult.error("Already existing : "+code.getName());;
stop
endif 
:diagram.createLeaf(ident,code,Display.NULL,
LeafType.ASSOCIATION,null );
:return CommandExecutionResult.ok();;
stop
end
@enduml

