@startuml
!pragma layout smetana
start
note right
constructor CommandHideShow2()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandHideShow2.class .getName(),
RegexLeaf.start(),new RegexLeaf("COMMAND",
"(hide|hide-class|show|show-class)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("WHAT","([^%s]+|\\<\\<.*\\>\\>)"),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(CucaDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:diagram.hideOrShow2(what,show);
:return CommandExecutionResult.ok();;
stop
end
@enduml

