:#181818;stroke-width:1.0;" x1="207" x2="207" y1="40.1328" y2="70.2656"/><polygon fill="#181818" points="203,60.2656,207,70.2656,211,60.2656,207,64.2656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207" x2="207" y1="690.293" y2="710.293"/><polygon fill="#181818" points="203,700.293,207,710.293,211,700.293,207,704.293" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[92169e3734a1f32b8c762e69cca17687]
@startuml
!pragma layout smetana
start
note right
BufferedImageexportFlashcode(Strings,Colorfore,
Colorback)
end note
if (lock.tryLock()) then (yes) 
:try ;
:final QRCodeWriterwriter=new QRCodeWriter();;
:final Hashtablehints=new Hashtable();;
:hints.put(EncodeHintType.ERROR_CORRECTION,
ErrorCorrectionLevel.L);;
:hints.put(EncodeHintType.CHARACTER_SET,"UTF8");;
:final intmultiple=1;;
:final BitMatrixbit=writer.encode(s,BarcodeFormat.QR_CODE,
multiple,hints);;
:return MatrixToImageWriter.toBufferedImage(bit,
fore.getRGB()|0xFF000000,back.getRGB()|0xFF000000);;
stop
endif 
:return null ;;
stop
end
@enduml

