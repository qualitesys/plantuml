@startuml
!pragma layout smetana
start
note right
BufferedImageexportFlashcode(Strings,Colorfore,
Colorback)
end note
if (lock.tryLock()) then (yes) 
:try {final QRCodeWriterwriter=new QRCodeWriter();final Hashtablehints=new Hashtable();hints.put(EncodeHintType.ERROR_CORRECTION,
ErrorCorrectionLevel.L);hints.put(EncodeHintType.CHARACTER_SET,
"UTF8");final intmultiple=1;final BitMatrixbit=writer.encode(s,
BarcodeFormat.QR_CODE,multiple,hints);return MatrixToImageWriter.toBufferedImage(bit,fore.getRGB()|0xFF000000,back.getRGB()|0xFF000000);}catch (Exceptione){Log.debug("Cannot create qrcode "+
e);}finally {lock.unlock();};
endif 
:return null ;;
stop
end
@enduml

