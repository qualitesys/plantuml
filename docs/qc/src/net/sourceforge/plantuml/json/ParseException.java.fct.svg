@startuml
!pragma layout smetana
start
note right
constructor ParseException(Stringmessage,
Locationlocation)
end note
:super (message+" at "+location);
:this.location=location;
end
start
note right
LocationgetLocation()
end note
:return location;;
stop
end
start
note right
intgetOffset()
end note
:return location.offset;;
stop
end
start
note right
intgetLine()
end note
:return location.line;;
stop
end
start
note right
intgetColumn()
end note
:return location.column;;
stop
end
@enduml

