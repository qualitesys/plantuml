@startuml
!pragma layout smetana
start
note right
constructor JsonParser(JsonHandler<? ,? >handler)
end note
if (handler==null ) then (yes) 
:throw new NullPointerException("handler is null");;
stop
endif 
:this.handler=(JsonHandler<Object,Object>)handler;;
:handler.parser=this;;
end
start
note right
void parse(Stringstring)
end note
if (string==null ) then (yes) 
:throw new NullPointerException("string is null");;
stop
endif 
:intbufferSize=Math.max(MIN_BUFFER_SIZE,Math.min(DEFAULT_BUFFER_SIZE,
string.length()));;
:try ;
:parse(new StringReader(string),bufferSize);;
:catch (IOExceptionexception);
:throw new RuntimeException(exception);;
stop
end
start
note right
void parse(Readerreader)
end note
:parse(reader,DEFAULT_BUFFER_SIZE);;
end
start
note right
void parse(Readerreader,intbuffersize)
end note
if (reader==null ) then (yes) 
:throw new NullPointerException("reader is null");;
stop
endif 
if (buffersize<=0) then (yes) 
:throw new IllegalArgumentException("buffersize is zero or negative");;
stop
endif 
:this.reader=reader;;
:buffer=new char[buffersize];;
:bufferOffset=0;;
:index=0;;
:fill=0;;
:line=1;;
:lineOffset=0;;
:current=0;;
:captureStart=-1;;
:read();;
:skipWhiteSpace();;
:readValue();;
:skipWhiteSpace();;
if (!isEndOfText()) then (yes) 
:throw error("Unexpected character");;
stop
endif 
end
start
note right
void readValue()
end note
switch (switch (current))
endswith
end
start
note right
void readArray()
end note
:Objectarray=handler.startArray();;
:read();;
if (++nestingLevel>MAX_NESTING_LEVEL) then (yes) 
:throw error("Nesting too deep");;
stop
endif 
:skipWhiteSpace();;
if (readChar(']')) then (yes) 
:nestingLevel- -;;
:handler.endArray(array);;
:return ;;
stop
endif 
repeat
:skipWhiteSpace();;
:handler.startArrayValue(array);;
:readValue();;
:handler.endArrayValue(array);;
:skipWhiteSpace();;
repeat while (readChar(','))
if (!readChar(']')) then (yes) 
:throw expected("',' or ']'");;
stop
endif 
:nestingLevel- -;;
:handler.endArray(array);;
end
start
note right
void readObject()
end note
:Objectobject=handler.startObject();;
:read();;
if (++nestingLevel>MAX_NESTING_LEVEL) then (yes) 
:throw error("Nesting too deep");;
stop
endif 
:skipWhiteSpace();;
if (readChar('}')) then (yes) 
:nestingLevel- -;;
:handler.endObject(object);;
:return ;;
stop
endif 
repeat
:skipWhiteSpace();;
:handler.startObjectName(object);;
:Stringname=readName();;
:handler.endObjectName(object,name);;
:skipWhiteSpace();;
if (!readChar(':')) then (yes) 
:throw expected("':'");;
stop
endif 
:skipWhiteSpace();;
:handler.startObjectValue(object,name);;
:readValue();;
:handler.endObjectValue(object,name);;
:skipWhiteSpace();;
repeat while (readChar(','))
if (!readChar('}')) then (yes) 
:throw expected("',' or '}'");;
stop
endif 
:nestingLevel- -;;
:handler.endObject(object);;
end
start
note right
StringreadName()
end note
if (current!='"') then (yes) 
:throw expected("name");;
stop
endif 
:return readStringInternal();;
stop
end
start
note right
void readNull()
end note
:handler.startNull();;
:read();;
:readRequiredChar('u');;
:readRequiredChar('l');;
:readRequiredChar('l');;
:handler.endNull();;
end
start
note right
void readTrue()
end note
:handler.startBoolean();;
:read();;
:readRequiredChar('r');;
:readRequiredChar('u');;
:readRequiredChar('e');;
:handler.endBoolean(true);;
end
start
note right
void readFalse()
end note
:handler.startBoolean();;
:read();;
:readRequiredChar('a');;
:readRequiredChar('l');;
:readRequiredChar('s');;
:readRequiredChar('e');;
:handler.endBoolean(false);;
end
start
note right
void readRequiredChar(charch)
end note
if (!readChar(ch)) then (yes) 
:throw expected("'"+ch+"'");;
stop
endif 
end
start
note right
void readString()
end note
:handler.startString();;
:handler.endString(readStringInternal());;
end
start
note right
StringreadStringInternal()
end note
:read();;
:startCapture();;
while (current!='"')
if (current=='\\') then (yes) 
:pauseCapture();;
:readEscape();;
:startCapture();;
else if (current<0x20) then (yes) 
:throw expected("valid string character");;
stop
else (no)
:read();;
endif 
endwhile
:Stringstring=endCapture();;
:read();;
:return string;;
stop
end
start
note right
void readEscape()
end note
:read();;
switch (switch (current))
endswith
:read();;
end
start
note right
void readNumber()
end note
:handler.startNumber();;
:startCapture();;
:readChar('-');;
:intfirstDigit=current;;
if (!readDigit()) then (yes) 
:throw expected("digit");;
stop
endif 
if (firstDigit!='0') then (yes) 
while (readDigit())
endwhile
endif 
:readFraction();;
:readExponent();;
:handler.endNumber(endCapture());;
end
start
note right
booleanreadFraction()
end note
if (!readChar('.')) then (yes) 
:return false;;
stop
endif 
if (!readDigit()) then (yes) 
:throw expected("digit");;
stop
endif 
while (readDigit())
endwhile
:return true;;
stop
end
start
note right
booleanreadExponent()
end note
if (!readChar('e')&&!readChar('E')) then (yes) 
:return false;;
stop
endif 
if (!readChar('+')) then (yes) 
:readChar('-');;
endif 
if (!readDigit()) then (yes) 
:throw expected("digit");;
stop
endif 
while (readDigit())
endwhile
:return true;;
stop
end
start
note right
booleanreadChar(charch)
end note
if (current!=ch) then (yes) 
:return false;;
stop
endif 
:read();;
:return true;;
stop
end
start
note right
booleanreadDigit()
end note
if (!isDigit()) then (yes) 
:return false;;
stop
endif 
:read();;
:return true;;
stop
end
start
note right
void skipWhiteSpace()
end note
while (isWhiteSpace())
:read();;
endwhile
end
start
note right
void read()
end note
if (index==fill) then (yes) 
if (captureStart!=-1) then (yes) 
:captureBuffer.append(buffer,captureStart,
fill-captureStart);;
:captureStart=0;;
endif 
:bufferOffset+=fill;;
:fill=reader.read(buffer,0,buffer.length);;
:index=0;;
if (fill==-1) then (yes) 
:current=-1;;
:index++;;
:return ;;
stop
endif 
endif 
if (current=='\n') then (yes) 
:line++;;
:lineOffset=bufferOffset+index;;
endif 
:current=buffer[index++];;
end
start
note right
void startCapture()
end note
if (captureBuffer==null ) then (yes) 
:captureBuffer=new StringBuilder();;
endif 
:captureStart=index-1;;
end
start
note right
void pauseCapture()
end note
:intend=current==-1? index:index-1;;
:captureBuffer.append(buffer,captureStart,
end-captureStart);;
:captureStart=-1;;
end
start
note right
StringendCapture()
end note
:intstart=captureStart;;
:intend=index-1;;
:captureStart=-1;;
if (captureBuffer.length()>0) then (yes) 
:captureBuffer.append(buffer,start,end-start);;
:Stringcaptured=captureBuffer.toString();;
:captureBuffer.setLength(0);;
:return captured;;
stop
endif 
:return new String(buffer,start,end-start);;
stop
end
start
note right
LocationgetLocation()
end note
:intoffset=bufferOffset+index-1;;
:intcolumn=offset-lineOffset+1;;
:return new Location(offset,line,column);;
stop
end
start
note right
ParseExceptionexpected(Stringexpected)
end note
if (isEndOfText()) then (yes) 
:return error("Unexpected end of input");;
stop
endif 
:return error("Expected "+expected);;
stop
end
start
note right
ParseExceptionerror(Stringmessage)
end note
:return new ParseException(message,getLocation());;
stop
end
start
note right
booleanisWhiteSpace()
end note
:return current==' '||current=='\t'||current=='\n'||current=='\r';;
stop
end
start
note right
booleanisDigit()
end note
:return current>='0'&&current<='9';;
stop
end
start
note right
booleanisHexDigit()
end note
:return current>='0'&&current<='9'||current>='a'&&current<='f'||current>='A'&&current<='F';;
stop
end
start
note right
booleanisEndOfText()
end note
:return current==-1;;
stop
end
