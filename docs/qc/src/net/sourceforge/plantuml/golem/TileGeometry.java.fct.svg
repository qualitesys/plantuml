@startuml
!pragma layout smetana
start
note right
TileGeometryopposite()
end note
:switch (this){case NORTH:return SOUTH;case SOUTH:return NORTH;
:case EAST:return WEST;case WEST:return EAST;
:case CENTER:default :throw new UnsupportedOperationException();};
end
start
note right
TileGeometryfromString(Strings)
end note
:final charc=StringUtils.goUpperCase(s.charAt(0));;
:switch (c){case 'N':return NORTH;case 'S':return SOUTH;
:case 'E':return EAST;case 'W':return WEST;
:default :throw new IllegalArgumentException();};
end
@enduml

