@startuml
!pragma layout smetana
start
note right
TileGeometryopposite()
end note
:return SOUTH;;
stop
:return NORTH;;
stop
:return WEST;;
stop
:return EAST;;
stop
:throw new UnsupportedOperationException();;
end
start
note right
TileGeometryfromString(Strings)
end note
:return NORTH;;
stop
:return SOUTH;;
stop
:return EAST;;
stop
:return WEST;;
stop
:throw new IllegalArgumentException();;
end
@enduml

