@startuml
!pragma layout smetana
start
note right
TileGeometryopposite()
end note
switch (switch this)
case (case NORTH:) 
:return SOUTH;;
stop
case (case SOUTH:) 
:return NORTH;;
stop
case (case EAST:) 
:return WEST;;
stop
case (case WEST:) 
:return EAST;;
stop
case (case CENTER:) 
case (default :) 
:throw new UnsupportedOperationException();;
stop
endswitch
end
start
note right
TileGeometryfromString(Strings)
end note
:final charc=StringUtils.goUpperCase(s.charAt(0));;
switch (switch c)
case (case 'N':) 
:return NORTH;;
stop
case (case 'S':) 
:return SOUTH;;
stop
case (case 'E':) 
:return EAST;;
stop
case (case 'W':) 
:return WEST;;
stop
case (default :) 
:throw new IllegalArgumentException();;
stop
endswitch
end
@enduml

