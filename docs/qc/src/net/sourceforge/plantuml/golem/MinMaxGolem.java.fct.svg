@startuml
!pragma layout smetana
start
note right
void manage(intx,inty)
end note
if (x<minX) then (yes) 
endif 
if (y<minY) then (yes) 
endif 
if (x>maxX) then (yes) 
endif 
if (y>maxY) then (yes) 
endif 
end
start
note right
void manage(Positionposition)
end note
end
start
note right
intgetMinX()
end note
:return minX;;
stop
end
start
note right
intgetMinY()
end note
:return minY;;
stop
end
start
note right
intgetWidth()
end note
:return maxX-minX+1;;
stop
end
start
note right
intgetHeight()
end note
:return maxY-minY+1;;
stop
