@startuml
!pragma layout smetana
start
note right
Pathbuild(TileAreastart,TileAreadest)
end note
:return new Path(start,dest);;
stop
end
start
note right
constructor Path(TileAreastart,TileAreadest)
end note
end
start
note right
TileAreagetStart()
end note
:return all.get(0);;
stop
end
start
note right
TileAreagetDest()
end note
:return all.get(all.size()-1);;
stop
end
@enduml

