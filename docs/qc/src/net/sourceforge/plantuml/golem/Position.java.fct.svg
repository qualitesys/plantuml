xt><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="560.4844">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[2be44afb59522c012767903f179513b6]
@startuml
!pragma layout smetana
start
note right
constructor Position(intxmin,intymin,intxmax,
intymax)
end note
:this.xmin=xmin;;
:this.ymin=ymin;;
:this.xmax=xmax;;
:this.ymax=ymax;;
end
start
note right
booleanequals(Objecto)
end note
:final Positionother=(Position)o;;
:return this.xmin==other.xmin&&this.xmax==other.xmax&&this.ymin==other.ymin&&this.ymax==other.ymax;;
stop
end
start
note right
inthashCode()
end note
:return xmin+ymin<<8+xmax<<16+ymax<<24;;
stop
end
start
note right
StringtoString()
end note
:return "("+xmin+","+ymin+")-("+xmax+","+
ymax+")";;
stop
end
start
note right
Positionmove(TileGeometryposition,intsizeMove)
end note
if (position==null ||position==TileGeometry.CENTER) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
switch (switch (position))
endswith
end
start
note right
intgetXmin()
end note
:return xmin;;
stop
end
start
note right
intgetXmax()
end note
:return xmax;;
stop
end
start
note right
intgetYmin()
end note
:return ymin;;
stop
end
start
note right
intgetYmax()
end note
:return ymax;;
stop
end
start
note right
intgetCenterX()
end note
if ((xmin+xmax+1)%2!=0) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:return (xmin+xmax+1)/2;;
stop
end
start
note right
intgetCenterY()
end note
if ((ymin+ymax+1)%2!=0) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:return (ymin+ymax+1)/2;;
stop
end
@enduml

