6,205,778.6836,201,782.6836" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="201" x2="201" y1="873.25" y2="895.8164"/><polygon fill="#181818" points="197,885.8164,201,895.8164,205,885.8164,201,889.8164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="201" x2="201" y1="929.7852" y2="949.7852"/><polygon fill="#181818" points="197,939.7852,201,949.7852,205,939.7852,201,943.7852" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6f83dd339e764239d6a107d85e6ab67f]
@startuml
!pragma layout smetana
start
note right
constructor YMirror(doublemax)
end note
:this.max=max;
end
start
note right
doublegetMirrored(doublev)
end note
if (v<0||v>max) then (yes) 
:System.err.println("BAD VALUE IN YMirror");
endif 
:return max-v;;
stop
end
start
note right
XPoint2DgetMirrored(XPoint2Dpt)
end note
:return new XPoint2D(pt.getX(),max-pt.getY());;
stop
end
start
note right
DotPathgetMirrored(DotPathpath)
end note
:result=result.addCurve(getMirrored(bez.getP1()),
getMirrored(bez.getCtrlP1()),getMirrored(bez.getCtrlP2()),
getMirrored(bez.getP2()));
:return result;;
stop
end
start
note right
UTranslategetMirrored(UTranslatetr)
end note
:return new UTranslate(tr.getDx(),max-tr.getDy());;
stop
end
@enduml

