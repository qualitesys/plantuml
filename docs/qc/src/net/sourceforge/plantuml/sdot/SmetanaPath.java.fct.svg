@startuml
!pragma layout smetana
start
note right
constructor SmetanaPath(Linklink,ST_Agedge_sedge,
YMirrorymirror,CucaDiagramdiagram,TextBlocklabel,
TextBlocktailLabel,TextBlockheadLabel)
end note
:this.link=link;
:this.edge=edge;
:this.ymirror=ymirror;
:this.diagram=diagram;
:this.label=label;
:this.tailLabel=tailLabel;
:this.headLabel=headLabel;
end
start
note right
void drawU(UGraphicug)
end note
if (link.isHidden()) then (yes) 
:return ;;
stop
endif 
if (this.link.getColors()!=null ) then (yes) 
if (newColor!=null ) then (yes) 
:color=newColor;
endif 
endif 
if (ymirror!=null &&dotPath!=null ) then (yes) 
:dotPath=ymirror.getMirrored(dotPath);
endif 
if (dotPath!=null ) then (yes) 
if (link.getColors()!=null &&link.getColors()
.getSpecificLineStroke()!=null ) then (yes) 
:stroke=link.getColors().getSpecificLineStroke();
endif 
:ug.apply(stroke).apply(color).draw(dotPath);
:printExtremityAtStart(ug.apply(color));
:printExtremityAtEnd(ug.apply(color));
endif 
if (getLabelRectangleTranslate("label")!=null ) then (yes) 
:label.drawU(ug.apply(getLabelRectangleTranslate("label")));
endif 
if (getLabelRectangleTranslate("head_label")!=null ) then (yes) 
:headLabel.drawU(ug.apply(getLabelRectangleTranslate("head_label")));
endif 
if (getLabelRectangleTranslate("tail_label")!=null ) then (yes) 
:tailLabel.drawU(ug.apply(getLabelRectangleTranslate("tail_label")));
endif 
end
start
note right
void printExtremityAtStart(UGraphicug)
end note
if (extremityFactory2==null ) then (yes) 
:return ;;
stop
endif 
if (ymirror!=null ) then (yes) 
:p0=ymirror.getMirrored(p0);
:startAngle=-startAngle+Math.PI;
endif 
if (extremity2!=null ) then (yes) 
:extremity2.drawU(ug);
endif 
:e.printStackTrace();
:System.err.println("CANNOT DRAW printExtremityAtStart");
end
start
note right
void printExtremityAtEnd(UGraphicug)
end note
if (extremityFactory1==null ) then (yes) 
:return ;;
stop
endif 
if (ymirror!=null ) then (yes) 
:p0=ymirror.getMirrored(p0);
:endAngle=-endAngle;
endif 
if (extremity1!=null ) then (yes) 
:extremity1.drawU(ug);
endif 
:e.printStackTrace();
:System.err.println("CANNOT DRAW printExtremityAtEnd");
end
start
note right
void printDebug(UGraphicug)
end note
:ug=ug.apply(HColors.BLUE).apply(HColors.BLUE.bg());
:i++;
if (ymirror!=null ) then (yes) 
:pt=ymirror.getMirrored(pt);
endif 
:ug.apply(new UTranslate(pt).compose(new UTranslate(-1,
-1))).draw(new UEllipse(3,3));
if (getLabelRectangleTranslate("label")!=null &&getLabelURectangle()!=null ) then (yes) 
:ug=ug.apply(HColors.BLUE).apply(HColors.none()
.bg());
:ug.apply(getLabelRectangleTranslate("label"))
.draw(getLabelURectangle());
endif 
end
start
note right
URectanglegetLabelURectangle()
end note
if (label==null ) then (yes) 
:return null ;;
stop
endif 
:return new URectangle(width,height);;
stop
end
start
note right
UTranslategetLabelRectangleTranslate(StringfieldName)
end note
if (fieldName.equals("label")) then (yes) 
:label=data.label;
endif 
if (label==null ) then (yes) 
:return null ;;
stop
endif 
if (ymirror==null ) then (yes) 
:return new UTranslate(x-width/2,y-height/2);;
stop
endif 
:return ymirror.getMirrored(new UTranslate(x-width/2,y+
height/2));;
stop
end
start
note right
DotPathgetDotPath(ST_Agedge_se)
end note
:return getDotPath(splines);;
stop
end
start
note right
ST_splinesgetSplines(ST_Agedge_se)
end note
:return splines;;
stop
end
start
note right
DotPathgetDotPath(ST_splinessplines)
end note
if (splines==null ) then (yes) 
:System.err.println("ERROR, no splines for getDotPath");
:return null ;;
stop
endif 
:result=result.addCurve(pt1,pt2,pt3,pt4);
:i+=3;
:result=result.addCurve(ppt2,ppt3,ppt4);
:return result;;
stop
end
start
note right
XPoint2DgetPoint(ST_splinessplines,inti)
end note
:return new XPoint2D(pt.x,pt.y);;
stop
end
@enduml

