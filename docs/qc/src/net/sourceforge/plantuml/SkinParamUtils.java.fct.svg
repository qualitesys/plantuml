@startuml
!pragma layout smetana
start
note right
UFontgetFont(ISkinParamskinParam,FontParamfontParam,Stereotypestereo)
end note
:return skinParam.getFont(stereo,false,fontParam);;
stop
end
start
note right
HColorgetFontColor(ISkinParamskinParam,FontParamfontParam,Stereotypestereo)
end note
:return skinParam.getFontHtmlColor(stereo,
fontParam);;
stop
end
start
note right
HColorgetColor(ISkinParamskinParam,Stereotypestereo,ColorParam... colorParam)
end note
:return rose.getHtmlColor(skinParam,stereo,
colorParam);;
stop
end
@enduml

