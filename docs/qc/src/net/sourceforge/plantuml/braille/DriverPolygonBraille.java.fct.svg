@startuml
!pragma layout smetana
start
note right
constructor DriverPolygonBraille(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;
end
start
note right
void draw(UPolygonshape,doublex,doubley,ColorMappermapper,UParamparam,BrailleGridgrid)
end note
:points.add(new UTranslate(x,y).getTranslated(pt));
if (clip!=null ) then (yes) 
if (clip.isInside(pt)==false) then (yes) 
:return ;;
stop
endif 
endif 
:grid.drawPolygon(points);
end
@enduml

