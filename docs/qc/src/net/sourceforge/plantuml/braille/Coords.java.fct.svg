@startuml
!pragma layout smetana
start
note right
constructor Coords(intx,inty)
end note
end
start
note right
booleanequals(Objectobj)
end note
:return this.x==other.x&&this.y==other.y;;
stop
end
start
note right
inthashCode()
end note
:return x+y*8192;;
stop
end
start
note right
StringtoString()
end note
:return "( "+x+" ; "+y+" )";;
stop
end
start
note right
intgetX()
end note
:return x;;
stop
end
start
note right
intgetY()
end note
:return y;;
stop
end
@enduml

