@startuml
!pragma layout smetana
start
note right
constructor Coords(intx,inty)
end note
:this.x=x;;
:this.y=y;;
end
start
note right
booleanequals(Objectobj)
end note
:return this.x==other.x&&this.y==other.y;;
stop
end
start
note right
inthashCode()
end note
:return x+y*8192;;
stop
end
start
note right
