@startuml
!pragma layout smetana
start
note right
constructor DriverLineBraille(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;
end
start
note right
void draw(ULineshape,doublex,doubley,ColorMappermapper,
UParamparam,BrailleGridgrid)
end note
if (clip!=null ) then (yes) 
if (line==null ) then (yes) 
:return ;;
stop
endif 
:x=line.x1;
:y=line.y1;
:x2=line.x2;
:y2=line.y2;
endif 
:grid.line(x,y,x2,y2);
end
@enduml

