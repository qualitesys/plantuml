@startuml
!pragma layout smetana
start
note right
constructor AnnotatedWorker(Annotatedannotated,
ISkinParamskinParam,StringBounderstringBounder,
AnnotatedBuilderbuilder)
end note
end
start
note right
TextBlockBackcoloredaddAdd(TextBlockresult)
end note
:return (TextBlockBackcolored)result;;
stop
end
start
note right
TextBlockaddLegend(TextBlockoriginal)
end note
if (legend.isNull()) then (yes) 
:return original;;
stop
endif 
:return DecorateEntityImage.add(original,
builder.getLegend(),legend.getHorizontalAlignment(),
legend.getVerticalAlignment());;
stop
end
start
note right
TextBlockaddTitle(TextBlockoriginal)
end note
if (title.isNull()) then (yes) 
:return original;;
stop
endif 
:return DecorateEntityImage.addTop(original,
builder.getTitle(),HorizontalAlignment.CENTER);;
stop
end
start
note right
TextBlockaddCaption(TextBlockoriginal)
end note
if (caption.isNull()) then (yes) 
:return original;;
stop
endif 
:return DecorateEntityImage.addBottom(original,
builder.getCaption(),HorizontalAlignment.CENTER);;
stop
end
@enduml

