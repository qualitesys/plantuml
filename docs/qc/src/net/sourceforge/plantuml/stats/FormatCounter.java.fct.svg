@startuml
!pragma layout smetana
start
note right
constructor FormatCounter(Stringprefix)
end note
end
start
note right
void plusOne(FileFormatfileFormat,longduration)
end note
end
start
note right
StatsLinecreateLine(Stringname,NumberAnalyzedn)
end note
:return new StatsLineImpl(result);;
stop
end
start
note right
StatsTablegetStatsTable(Stringname)
end note
if (n.getNb()>0) then (yes) 
endif 
:return result;;
stop
end
start
note right
void reload(Stringprefix,Preferencesprefs)
end note
if (key.startsWith(prefix)) then (yes) 
if (value!=null ) then (yes) 
endif 
endif 
end
start
