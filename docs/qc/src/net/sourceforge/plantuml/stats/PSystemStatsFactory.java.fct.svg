@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,
Stringline)
end note
if (line.matches("(?i)^stats\\s*$")) then (yes) 
:return PSystemStats.create(source);;
stop
endif 
:Log.error("Error "+e);
:return null ;;
stop
end
@enduml

