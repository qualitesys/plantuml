@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,
Stringline)
end note
:try {if (line.matches("(?i)^stats\\s*$")){return PSystemStats.create(source);}}catch (IOExceptione){Log.error("Error "+
e);};
:return null ;;
stop
end
@enduml

