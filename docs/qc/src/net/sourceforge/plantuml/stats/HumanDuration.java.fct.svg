@startuml
!pragma layout smetana
start
note right
constructor HumanDuration(longduration)
end note
end
start
note right
StringtoString()
end note
if (day>0) then (yes) 
:return String.format("%dd %02dh%02dm%02ds",
day,hour,min,sec);;
stop
endif 
if (hour>0) then (yes) 
:return String.format("%dh%02dm%02ds",hour,
min,sec);;
stop
endif 
if (min>0) then (yes) 
:return String.format("%dm%02ds",min,sec);;
stop
endif 
:return String.format("%ds",sec);;
stop
end
@enduml

