@startuml
!pragma layout smetana
start
note right
constructor TextConverter(Statsstats)
end note
:this.stats=stats;;
end
start
note right
void printMe(PrintStreamps)
end note
:table.addSeparator();;
:table.addLine("ID","Start","Duration","Generated",
"Mean(ms)");;
:table.addSeparator();;
if (id==null ) then (yes) 
:id="";;
endif 
:table.addLine(id,start,duration,generated,
generated_ms);;
:table.addSeparator();;
:linesUsed=table.getLines();;
:table.printMe(ps);;
end
start
note right
intgetLinesUsed()
end note
:return linesUsed;;
stop
end
start
note right
void main(String[]args)
end note
:StatsUtils.dumpStats();;
end
@enduml

