@startuml
!pragma layout smetana
start
note right
constructor HtmlConverter(Statsstats)
end note
:this.stats=stats;
end
start
note right
StringtoHtml()
end note
:result.append("<html>");
:result.append("<style type=\"text/css\">");
:result.append("body { font-family: arial,
 helvetica, sans-serif; font-size: 12px; font-weight: normal; color: black; background: white;}");
:result.append("th,td { font-size: 12px;}");
:result.append("table { border-collapse: collapse;
: border-style: none;}");
:result.append("</style>");
:result.append("<h2>Statistics</h2>");
:printTableHtml(result,stats.getLastSessions());
if (currentSessionByDiagramType.getLines()
.size()>1) then (yes) 
:result.append("<h2>Current session statistics</h2>");
:printTableHtml(result,currentSessionByDiagramType);
:result.append("<p>");
:printTableHtml(result,stats.getCurrentSessionByFormat());
endif 
:result.append("<h2>General statistics since ever</h2>");
:printTableHtml(result,stats.getAllByDiagramType());
:result.append("<p>");
:printTableHtml(result,stats.getAllByFormat());
:result.append("</html>");
:return result.toString();;
stop
end
start
note right
void printTableHtml(StringBuilderresult,StatsTabletable)
end note
:result.append("<table border=1 cellspacing=0 cellpadding=2>");
:result.append(getHtmlHeader(headers));
:i++;
:result.append(getCreoleLine(headers,line,
bold));
:result.append("</table>");
end
start
note right
StringgetCreoleLine(Collection<StatsColumn>headers,
StatsLineline,booleanbold)
end note
if (bold) then (yes) 
:result.append("<tr bgcolor=#f0f0f0>");
else (no)
:result.append("<tr bgcolor=#fcfcfc>");
endif 
if (v instanceof Long||v instanceof HumanDuration) then (yes) 
:result.append("<td align=right>");
else (no)
:result.append("<td>");
endif 
if (bold) then (yes) 
:result.append("<b>");
endif 
if (v instanceof Long) then (yes) 
:result.append(String.format("%,d",v));
else (no)
:result.append(v.toString());
endif 
if (bold) then (yes) 
:result.append("</b>");
endif 
:result.append("</td>");
:result.append("</tr>");
:return result.toString();;
stop
end
start
note right
StringgetHtmlHeader(Collection<StatsColumn>headers)
end note
:sb.append("<tr bgcolor=#e0e0e0>");
:sb.append("<td><b>");
:sb.append(col.getTitle().replace(BackSlash.BS_BS_N,
"<br>"));
:sb.append("</b></td>");
:sb.append("</tr>");
:return sb.toString();;
stop
end
@enduml

