note right
void reconstruct()
end note
:SubBlocksb=this;;
:intr,c;;
:intp[][]=sb.getPredict(1,false);;
:intdest[][]=new int[4][4];;
:intdiff[][]=sb.getDiff();;
:inta=diff[r][c]+p[r][c];;
if (a<0) then (yes) 
:a=0;;
endif 
if (a>255) then (yes) 
:a=255;;
endif 
:dest[r][c]=a;;
:sb.setDest(dest);;
if (!this.getMacroBlock().isKeepDebugInfo()) then (yes) 
:sb.diff=null ;;
:sb.predict=null ;;
:sb.tokens=null ;;
endif 
end
