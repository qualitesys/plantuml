start
note right
intDCTextra(BoolDecoderbc2,int[]p)
end note
:intv=0;;
:intoffset=0;;
repeat
:v+=v+bc2.readBool(p[offset]);;
:offset++;;
repeat while (p[offset]>0)
:return v;;
stop
end
start
note right
void decodeSubBlock(BoolDecoderbc2,int[][][][]coef_probs,
intilc,inttype,booleanwithY2)
end note
:SubBlocksb=this;;
:intstartAt=0;;
if (withY2) then (yes) 
:startAt=1;;
endif 
:intlc=ilc;;
:intc=0;;
:intv=1;;
:booleanskip=false;;
while (!(v==Globals.dct_eob)&&c+startAt<16)
if (!skip) then (yes) 
:v=bc2.readTree(Globals.vp8CoefTree,coef_probs[type][Globals.vp8CoefBands[c+
startAt]][lc]);;
else (no)
:v=bc2.readTreeSkip(Globals.vp8CoefTree,coef_probs[type][Globals.vp8CoefBands[c+
startAt]][lc],1);;
endif 
:intdv=decodeToken(bc2,v);;
:lc=0;;
:skip=false;;
if (dv==1||dv==-1) then (yes) 
:lc=1;;
else if (dv>1||dv<-1) then (yes) 
:lc=2;;
else if (dv==Globals.DCT_0) then (yes) 
:skip=true;;
endif 
:inttokens[]=sb.getTokens();;
if (v!=Globals.dct_eob) then (yes) 
:tokens[Globals.vp8defaultZigZag1d[c+startAt]]=dv;;
endif 
:c++;;
endwhile
:hasNoZeroToken=false;;
if (tokens[x]!=0) then (yes) 
:hasNoZeroToken=true;;
endif 
end
start
note right
intdecodeToken(BoolDecoderbc2,intv)
end note
:intr=v;;
if (v==Globals.dct_cat1) then (yes) 
:r=5+DCTextra(bc2,Globals.Pcat1);;
endif 
if (v==Globals.dct_cat2) then (yes) 
:r=7+DCTextra(bc2,Globals.Pcat2);;
endif 
if (v==Globals.dct_cat3) then (yes) 
:r=11+DCTextra(bc2,Globals.Pcat3);;
endif 
if (v==Globals.dct_cat4) then (yes) 
:r=19+DCTextra(bc2,Globals.Pcat4);;
endif 
if (v==Globals.dct_cat5) then (yes) 
:r=35+DCTextra(bc2,Globals.Pcat5);;
endif 
if (v==Globals.dct_cat6) then (yes) 
:r=67+DCTextra(bc2,Globals.Pcat6);;
endif 
if (v!=Globals.DCT_0&&v!=Globals.dct_eob) then (yes) 
if (bc2.readBit()>0) then (yes) 
:r=-r;;
endif 
endif 
:return r;;
stop
end
start
note right
void dequantSubBlock(VP8Frameframe,IntegerDc)
end note
:SubBlocksb=this;;
:int[]adjustedValues=new int[16];;
:intQValue;;
if (plane==PLANE.U||plane==PLANE.V) then (yes) 
:QValue=frame.getSegmentQuants().getSegQuants()[this.getMacroBlock()
.getSegmentId()].getUvac_delta_q();;
if (i==0) then (yes) 
:QValue=frame.getSegmentQuants().getSegQuants()[this.getMacroBlock()
.getSegmentId()].getUvdc_delta_q();;
endif 
else (no)
:QValue=frame.getSegmentQuants().getSegQuants()[this.getMacroBlock()
.getSegmentId()].getY1ac();;
if (i==0) then (yes) 
:QValue=frame.getSegmentQuants().getSegQuants()[this.getMacroBlock()
.getSegmentId()].getY1dc();;
endif 
endif 
:intinputValue=sb.getTokens()[i];;
:adjustedValues[i]=inputValue*QValue;;
if (Dc!=null ) then (yes) 
:adjustedValues[0]=Dc;;
endif 
:int[][]diff=IDCT.idct4x4llm(adjustedValues);;
:sb.setDiff(diff);;
end
