start
note right
void predict(VP8Frameframe)
end note
:SubBlocksb=this;;
:SubBlockaboveSb=frame.getAboveSubBlock(sb,
sb.getPlane());;
:SubBlockleftSb=frame.getLeftSubBlock(sb,
sb.getPlane());;
:int[]above=new int[4];;
:int[]left=new int[4];;
:above[0]=aboveSb.getPredict(sb.getMode(),
false)[0][3];;
:above[1]=aboveSb.getPredict(sb.getMode(),
false)[1][3];;
:above[2]=aboveSb.getPredict(sb.getMode(),
false)[2][3];;
:above[3]=aboveSb.getPredict(sb.getMode(),
false)[3][3];;
:left[0]=leftSb.getPredict(sb.getMode(),true)[3][0];;
:left[1]=leftSb.getPredict(sb.getMode(),true)[3][1];;
:left[2]=leftSb.getPredict(sb.getMode(),true)[3][2];;
:left[3]=leftSb.getPredict(sb.getMode(),true)[3][3];;
:SubBlockAL=frame.getLeftSubBlock(aboveSb,
sb.getPlane());;
:intal;;
if (!leftSb.isDest()&&!aboveSb.isDest()) then (yes) 
:al=AL.getPredict(sb.getMode(),false)[3][3];;
else if (!aboveSb.isDest()) then (yes) 
:al=AL.getPredict(sb.getMode(),false)[3][3];;
else (no)
:al=AL.getPredict(sb.getMode(),true)[3][3];;
endif 
:SubBlockAR=frame.getAboveRightSubBlock(sb,
sb.plane);;
:intar[]=new int[4];;
:ar[0]=AR.getPredict(sb.getMode(),false)[0][3];;
:ar[1]=AR.getPredict(sb.getMode(),false)[1][3];;
:ar[2]=AR.getPredict(sb.getMode(),false)[2][3];;
:ar[3]=AR.getPredict(sb.getMode(),false)[3][3];;
:int[][]p=new int[4][4];;
:int[]pp;;
switch (switch (sb.getMode()))
endswith
:sb.setPredict(p);;
end
