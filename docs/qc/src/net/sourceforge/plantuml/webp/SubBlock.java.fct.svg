start
note right
constructor SubBlock(MacroBlockmacroBlock,
SubBlockabove,SubBlockleft,SubBlock.PLANEplane)
end note
:this.macroBlock=macroBlock;;
:this.plane=plane;;
:this.above=above;;
:this.left=left;;
:mode=0;;
:tokens=new int[16];;
:tokens[z]=0;;
