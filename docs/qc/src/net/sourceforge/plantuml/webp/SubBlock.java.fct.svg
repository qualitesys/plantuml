stop
else (no)
:intrv=127;;
if ((intra_bmode==Globals.B_TM_PRED||intra_bmode==Globals.B_DC_PRED||intra_bmode==Globals.B_VE_PRED||intra_bmode==Globals.B_HE_PRED||intra_bmode==Globals.B_VR_PRED||intra_bmode==Globals.B_RD_PRED||intra_bmode==Globals.B_HD_PRED)&&left) then (yes) 
