@startuml
!pragma layout smetana
start
note right
constructor MacroBlock(intx,inty,booleankeepDebugInfo)
end note
:this.x=x-1;;
:this.y=y-1;;
:this.keepDebugInfo=keepDebugInfo;;
:ySubBlocks=new SubBlock[4][4];;
:uSubBlocks=new SubBlock[2][2];;
:vSubBlocks=new SubBlock[2][2];;
:SubBlockabove=null ;;
:SubBlockleft=null ;;
:left=null ;;
:above=null ;;
if (j>0) then (yes) 
:left=ySubBlocks[j-1][i];;
endif 
if (i>0) then (yes) 
:above=ySubBlocks[j][i-1];;
endif 
:ySubBlocks[j][i]=new SubBlock(this,above,
left,SubBlock.PLANE.Y1);;
:left=null ;;
:above=null ;;
if (j>0) then (yes) 
:left=uSubBlocks[j-1][i];;
endif 
if (i>0) then (yes) 
:above=uSubBlocks[j][i-1];;
endif 
:uSubBlocks[j][i]=new SubBlock(this,above,
left,SubBlock.PLANE.U);;
:left=null ;;
:above=null ;;
if (j>0) then (yes) 
:left=vSubBlocks[j-1][i];;
endif 
if (i>0) then (yes) 
:above=vSubBlocks[j][i-1];;
endif 
:vSubBlocks[j][i]=new SubBlock(this,above,
left,SubBlock.PLANE.V);;
:y2SubBlock=new SubBlock(this,null ,null ,
SubBlock.PLANE.Y2);;
end
start
note right
void decodeMacroBlock(VP8Frameframe)
end note
:MacroBlockmb=this;;
if (mb.getSkipCoeff()>0) then (yes) 
if (mb.getYMode()!=Globals.B_PRED) then (yes) 
:mb.skipInnerLoopFilter=true;;
endif 
else if (mb.getYMode()!=Globals.B_PRED) then (yes) 
:decodeMacroBlockTokens(frame,true);;
else (no)
:decodeMacroBlockTokens(frame,false);;
endif 
end
start
note right
void decodeMacroBlockTokens(VP8Frameframe,
booleanwithY2)
end note
:skipInnerLoopFilter=false;;
if (withY2) then (yes) 
:skipInnerLoopFilter=skipInnerLoopFilter|decodePlaneTokens(frame,
1,SubBlock.PLANE.Y2,false);;
endif 
:skipInnerLoopFilter=skipInnerLoopFilter|decodePlaneTokens(frame,
4,SubBlock.PLANE.Y1,withY2);;
:skipInnerLoopFilter=skipInnerLoopFilter|decodePlaneTokens(frame,
2,SubBlock.PLANE.U,false);;
:skipInnerLoopFilter=skipInnerLoopFilter|decodePlaneTokens(frame,
2,SubBlock.PLANE.V,false);;
:skipInnerLoopFilter=!skipInnerLoopFilter;;
end
start
note right
booleandecodePlaneTokens(VP8Frameframe,intdimentions,
SubBlock.PLANEplane,booleanwithY2)
end note
:MacroBlockmb=this;;
:booleanr=false;;
:intL=0;;
:intA=0;;
:intlc=0;;
:SubBlocksb=mb.getSubBlock(plane,x,y);;
:SubBlockleft=frame.getLeftSubBlock(sb,plane);;
:SubBlockabove=frame.getAboveSubBlock(sb,
plane);;
if (left.hasNoZeroToken()) then (yes) 
:L=1;;
endif 
:lc+=L;;
if (above.hasNoZeroToken()) then (yes) 
:A=1;;
endif 
:lc+=A;;
:sb.decodeSubBlock(frame.getTokenBoolDecoder(),
frame.getCoefProbs(),lc,SubBlock.planeToType(plane,
withY2),withY2);;
:r=r|sb.hasNoZeroToken();;
:return r;;
stop
end
start
note right
void dequantMacroBlock(VP8Frameframe)
end note
:MacroBlockmb=this;;
if (mb.getYMode()!=Globals.B_PRED) then (yes) 
:SubBlocksb=mb.getY2SubBlock();;
:intacQValue=frame.getSegmentQuants().getSegQuants()[this.getSegmentId()].getY2ac_delta_q();;
:intdcQValue=frame.getSegmentQuants().getSegQuants()[this.getSegmentId()].getY2dc();;
:intinput[]=new int[16];;
:input[0]=sb.getTokens()[0]*dcQValue;;
:input[x]=sb.getTokens()[x]*acQValue;;
:sb.setDiff(IDCT.iwalsh4x4(input));;
:SubBlockysb=mb.getYSubBlock(i,j);;
:ysb.dequantSubBlock(frame,sb.getDiff()[i][j]);;
:mb.predictY(frame);;
:mb.predictUV(frame);;
:SubBlockuvsb=mb.getUSubBlock(j,i);;
:uvsb.dequantSubBlock(frame,null );;
:uvsb=mb.getVSubBlock(i,j);;
:uvsb.dequantSubBlock(frame,null );;
:mb.recon_mb();;
else (no)
:SubBlocksb=mb.getYSubBlock(i,j);;
:sb.dequantSubBlock(frame,null );;
:sb.predict(frame);;
:sb.reconstruct();;
:mb.predictUV(frame);;
:SubBlocksb=mb.getUSubBlock(j,i);;
:sb.dequantSubBlock(frame,null );;
:sb.reconstruct();;
:SubBlocksb=mb.getVSubBlock(j,i);;
:sb.dequantSubBlock(frame,null );;
:sb.reconstruct();;
endif 
end
start
note right
void drawDebug()
end note
:SubBlocksb=ySubBlocks[i][0];;
:sb.drawDebugH();;
:sb=ySubBlocks[0][j];;
:sb.drawDebugV();;
end
start
note right
SubBlockgetBottomSubBlock(intx,SubBlock.PLANEplane)
end note
if (plane==SubBlock.PLANE.Y1) then (yes) 
:return ySubBlocks[x][3];;
stop
else if (plane==SubBlock.PLANE.U) then (yes) 
:return uSubBlocks[x][1];;
stop
else if (plane==SubBlock.PLANE.V) then (yes) 
:return vSubBlocks[x][1];;
stop
else if (plane==SubBlock.PLANE.Y2) then (yes) 
:return y2SubBlock;;
stop
endif 
:return null ;;
stop
end
start
note right
StringgetDebugString()
end note
:Stringr=new String();;
:r=r+" YMode: "+Globals.getModeAsString(yMode);;
:r=r+"\n UVMode: "+Globals.getModeAsString(uvMode);;
:r=r+"\n SegmentID: "+segmentId;;
:r=r+"\n Filter Level: "+filterLevel;;
:r=r+"\n UV Filter Level: "+uVFilterLevel;;
:r=r+"\n Skip Coeff: "+skipCoeff;;
:return r;;
stop
end
start
note right
intgetFilterLevel()
end note
:return this.filterLevel;;
stop
end
start
note right
SubBlockgetLeftSubBlock(inty,SubBlock.PLANEplane)
end note
if (plane==SubBlock.PLANE.Y1) then (yes) 
:return ySubBlocks[0][y];;
stop
else if (plane==SubBlock.PLANE.V) then (yes) 
:return vSubBlocks[0][y];;
stop
endif 
if (plane==SubBlock.PLANE.Y2) then (yes) 
:return y2SubBlock;;
stop
else if (plane==SubBlock.PLANE.U) then (yes) 
:return uSubBlocks[0][y];;
stop
endif 
:return null ;;
stop
end
start
note right
SubBlockgetRightSubBlock(inty,SubBlock.PLANEplane)
end note
if (plane==SubBlock.PLANE.Y1) then (yes) 
:return ySubBlocks[3][y];;
stop
else if (plane==SubBlock.PLANE.U) then (yes) 
:return uSubBlocks[1][y];;
stop
else if (plane==SubBlock.PLANE.V) then (yes) 
:return vSubBlocks[1][y];;
stop
else if (plane==SubBlock.PLANE.Y2) then (yes) 
:return y2SubBlock;;
stop
endif 
:return null ;;
stop
end
start
note right
intgetSkipCoeff()
end note
:return skipCoeff;;
stop
end
start
note right
SubBlockgetSubBlock(SubBlock.PLANEplane,inti,
intj)
end note
switch (switch (plane))
endswith
:return null ;;
stop
end
start
note right
intgetSubblockX(SubBlocksb)
end note
if (sb.getPlane()==SubBlock.PLANE.Y1) then (yes) 
if (ySubBlocks[x][y]==sb) then (yes) 
:return x;;
stop
endif 
else if (sb.getPlane()==SubBlock.PLANE.U) then (yes) 
if (uSubBlocks[x][y]==sb) then (yes) 
:return x;;
stop
endif 
else if (sb.getPlane()==SubBlock.PLANE.V) then (yes) 
if (vSubBlocks[x][y]==sb) then (yes) 
:return x;;
stop
endif 
else if (sb.getPlane()==SubBlock.PLANE.Y2) then (yes) 
:return 0;;
stop
endif 
:return -100;;
stop
end
start
note right
intgetSubblockY(SubBlocksb)
end note
if (sb.getPlane()==SubBlock.PLANE.Y1) then (yes) 
if (ySubBlocks[x][y]==sb) then (yes) 
:return y;;
stop
endif 
else if (sb.getPlane()==SubBlock.PLANE.U) then (yes) 
if (uSubBlocks[x][y]==sb) then (yes) 
:return y;;
stop
endif 
else if (sb.getPlane()==SubBlock.PLANE.V) then (yes) 
if (vSubBlocks[x][y]==sb) then (yes) 
:return y;;
stop
endif 
else if (sb.getPlane()==SubBlock.PLANE.Y2) then (yes) 
:return 0;;
stop
endif 
:return -100;;
stop
end
start
note right
SubBlockgetUSubBlock(inti,intj)
end note
:return uSubBlocks[i][j];;
stop
end
start
note right
intgetUVFilterLevel()
end note
:return this.uVFilterLevel;;
stop
end
start
note right
intgetUvMode()
end note
:return uvMode;;
stop
end
start
note right
SubBlockgetVSubBlock(inti,intj)
end note
:return vSubBlocks[i][j];;
stop
end
start
note right
intgetX()
end note
:return x;;
stop
end
start
note right
intgetY()
end note
:return y;;
stop
end
start
note right
SubBlockgetY2SubBlock()
end note
:return y2SubBlock;;
stop
end
start
note right
intgetYMode()
end note
:return yMode;;
stop
end
start
note right
SubBlockgetYSubBlock(inti,intj)
end note
:return ySubBlocks[i][j];;
stop
end
start
note right
booleanisKeepDebugInfo()
end note
:return keepDebugInfo;;
stop
end
start
note right
booleanisSkip_inner_lf()
end note
:return skipInnerLoopFilter;;
stop
end
start
note right
void predictUV(VP8Frameframe)
end note
:MacroBlockaboveMb=frame.getMacroBlock(x,
y-1);;
:MacroBlockleftMb=frame.getMacroBlock(x-1,y);;
switch (switch (this.uvMode))
endswith
end
start
note right
void predictY(VP8Frameframe)
end note
:MacroBlockaboveMb=frame.getMacroBlock(x,
y-1);;
:MacroBlockleftMb=frame.getMacroBlock(x-1,y);;
switch (switch (this.yMode))
endswith
end
start
note right
void recon_mb()
end note
:SubBlocksb=ySubBlocks[i][j];;
:sb.reconstruct();;
:SubBlocksb=uSubBlocks[i][j];;
:sb.reconstruct();;
:SubBlocksb=vSubBlocks[i][j];;
:sb.reconstruct();;
end
start
note right
void setFilterLevel(intvalue)
end note
:this.filterLevel=value;;
end
start
note right
void setSegmentId(intvalue)
end note
:this.segmentId=value;;
end
start
note right
void setSkipCoeff(intmbSkipCoeff)
end note
:skipCoeff=mbSkipCoeff;;
end
start
note right
void setUVFilterLevel(intvalue)
end note
:this.uVFilterLevel=value;;
end
start
note right
void setUvMode(intmode)
end note
:this.uvMode=mode;;
end
start
note right
void setYMode(intyMode)
end note
:this.yMode=yMode;;
end
start
note right
StringtoString()
end note
:return "x: "+x+"y: "+y;;
stop
end
start
note right
intgetSegmentId()
end note
:return segmentId;;
stop
end
