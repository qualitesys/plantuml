@startuml
!pragma layout smetana
start
note right
constructor GitCurve(ST_Agedgeinfo_tdata,
MirrorxMirror)
end note
:this.xMirror=xMirror;;
if (splines.size!=1) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:points.add(pt);;
if (beziers.sp.x==0&&beziers.sp.y==0) then (yes) 
:sp=null ;;
else (no)
:sp=new XPoint2D(beziers.sp.x,beziers.sp.y);;
endif 
if (beziers.ep.x==0&&beziers.ep.y==0) then (yes) 
:ep=null ;;
else (no)
:ep=new XPoint2D(beziers.ep.x,beziers.ep.y);;
endif 
end
start
note right
XPoint2DgetPoint(ST_splinessplines,inti)
end note
:return new XPoint2D(pt.x,pt.y);;
stop
end
start
note right
void drawCurve(HColorcolor,UGraphicug)
end note
:ug=ug.apply(new UStroke(2,2,1));;
:path.moveTo(xMirror.invGit(points.get(0)));;
:path.cubicTo(pt2,pt3,pt4);;
:ug.draw(path);;
if (ep!=null ) then (yes) 
:new Arrow(last,trueEp).drawArrow(ug.apply(color.bg()));;
endif 
end
@enduml

