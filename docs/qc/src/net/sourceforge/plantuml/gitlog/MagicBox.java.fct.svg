@startuml
!pragma layout smetana
start
note right
constructor MagicBox(ISkinParamskinParam,
GNodenode)
end note
end
start
note right
TextBlockgetSmallBlock()
end note
:return node.getDisplay().create(fc,HorizontalAlignment.CENTER,
skinParam);;
stop
end
start
note right
TextBlockgetCommentBlock()
end note
if (node.getComment()!=null &&node.isTop()) then (yes) 
:return Display.create(node.getComment()).create(tag,
HorizontalAlignment.CENTER,skinParam);;
stop
endif 
:return TextBlockUtils.empty(0,0);;
stop
end
start
note right
XDimension2DgetBigDim(StringBounderstringBounder)
end note
:return XDimension2D.delta(mergeTB,8,2);;
stop
end
start
note right
void drawBorder(UGraphicug,XDimension2DsizeInDot)
end note
end
@enduml

