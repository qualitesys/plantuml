@startuml
!pragma layout smetana
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(Help)");;
stop
end
start
note right
constructor Help(UmlSourcesource)
end note
:super (source,UmlDiagramType.HELP,null );
end
start
note right
ImageBuildercreateImageBuilder(FileFormatOptionfileFormatOption)
end note
:return super .createImageBuilder(fileFormatOption)
.annotations(false);;
stop
end
start
note right
ImageDataexportDiagramInternal(OutputStreamos,intindex,FileFormatOptionfileFormat)
end note
:return createImageBuilder(fileFormat).drawable(sheetBlock)
.write(os);;
stop
end
start
note right
void add(CharSequenceline)
end note
:this.lines.add(line);
end
start
note right
ClockwiseTopRightBottomLeftgetDefaultMargins()
end note
:return ClockwiseTopRightBottomLeft.same(0);;
stop
end
@enduml

