@startuml
!pragma layout smetana
start
note right
constructor AbstractElementFactoryComplex(DataSourcedataSource,
Dictionarydictionary)
end note
end
start
note right
void addFactory(ElementFactoryfactory)
end note
end
start
note right
Terminated<Element>getNextElement()
end note
if (factory.ready()) then (yes) 
:return factory.create();;
stop
endif 
:throw new IllegalStateException(dataSource.peek(0)
.getElement());;
end
start
note right
DataSourcegetDataSource()
end note
:return dataSource;;
stop
end
start
note right
DictionarygetDictionary()
end note
:return dictionary;;
stop
end
