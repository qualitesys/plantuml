@startuml
!pragma layout smetana
start
note right
constructor ElementFactoryTextField(DataSourcedataSource,ISkinSimplespriteContainer)
end note
:this.dataSource=dataSource;
:this.spriteContainer=spriteContainer;
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
endif 
:return new Terminated<Element>(new ElementTextField(text.substring(1,
text.length()-1),font,spriteContainer),next.getTerminator());;
stop
end
start
note right
booleanready()
end note
:return text.startsWith("\"")&&text.endsWith("\"");;
stop
end
@enduml

