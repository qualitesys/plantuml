@startuml
!pragma layout smetana
start
note right
constructor ElementFactoryScroll(DataSourcedataSource,
Dictionarydictionary)
end note
:super (dataSource,dictionary);;
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:final Terminated<String>tmp=getDataSource()
.next();;
:final Stringheader=tmp.getElement();;
:assert header.startsWith("{");;
:final Positionner2positionner=new Positionner2();;
:while (getDataSource().peek(0).getElement().equals("}")==false){final Terminated<Element>next=getNextElement();
:positionner.add(next);};
:final Terminated<String>next=getDataSource()
.next();;
:return new Terminated<Element>(new ElementPyramidScrolled(positionner,
getDictionary(),ScrollStrategy.fromDesc(header)),
next.getTerminator());;
stop
end
start
note right
booleanready()
end note
:final Stringtext=getDataSource().peek(0)
.getElement();;
if (text.equals("{S")||text.equals("{S-")||text.equals("{SI")) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
@enduml

