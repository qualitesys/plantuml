@startuml
!pragma layout smetana
start
note right
constructor ElementFactoryRadioOn(DataSourcedataSource,
ISkinSimplespriteContainer)
end note
:this.dataSource=dataSource;
:this.spriteContainer=spriteContainer;
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
endif 
:return new Terminated<Element>(new ElementRadioCheckbox(extracted(text),
font,true,true,spriteContainer),next.getTerminator());;
stop
end
start
note right
List<String>extracted(final Stringtext)
end note
:return Arrays.asList(StringUtils.trin(text.substring(x+1)));;
stop
end
start
note right
booleanready()
end note
:return text.startsWith("(X)");;
stop
end
@enduml

