@startuml
!pragma layout smetana
start
note right
constructor ElementFactoryCheckboxOff(DataSourcedataSource,
ISkinSimplespriteContainer)
end note
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
endif 
:return new Terminated<Element>(new ElementRadioCheckbox(extracted(text),
font,false,false,spriteContainer),next.getTerminator());;
stop
end
start
note right
List<String>extracted(final Stringtext)
end note
:return Arrays.asList(StringUtils.trin(text.substring(x+
1)));;
stop
end
start
note right
booleanready()
end note
:return text.startsWith("[]")||text.startsWith("[ ]");;
stop
end
@enduml

