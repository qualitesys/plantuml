!pragma layout smetana
start
note right
constructor ElementFactoryMenu(DataSourcedataSource,
Dictionarydictionary)
end note
:super (dataSource,dictionary);;
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:final Stringheader=getDataSource().next()
.getElement();;
:assert header.startsWith("{*");;
:final UFontfont=UFont.byDefault(12);;
:final ElementMenuBarresult=new ElementMenuBar(font,
getDictionary());;
:Stringsubentry=null ;;
:while (getDataSource().peek(0).getElement().equals("}")==false){final Terminated<String>t=getDataSource().next();
:final Strings=t.getElement();if (subentry==null ){result.addEntry(s);}else if (subentry.length()==0){subentry=s;}else {result.addSubEntry(subentry,
s);}if (t.getTerminator()==Terminator.NEWLINE){subentry="";}};
:final Terminated<String>next=getDataSource()
.next();;
:return new Terminated<Element>(result,next.getTerminator());;
stop
end
start
note right
booleanready()
end note
:final Stringtext=getDataSource().peek(0)
.getElement();;
if (text.equals("{*")) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
