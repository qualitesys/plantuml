@startuml
!pragma layout smetana
start
note right
constructor ElementFactoryMenu(DataSourcedataSource,
Dictionarydictionary)
end note
:super (dataSource,dictionary);
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
endif 
while (getDataSource().peek(0).getElement().equals("}")==false)
if (subentry==null ) then (yes) 
:result.addEntry(s);
else (no)
:result.addSubEntry(subentry,s);
endif 
if (t.getTerminator()==Terminator.NEWLINE) then (yes) 
:subentry="";
endif 
endwhile
:return new Terminated<Element>(result,next.getTerminator());;
stop
end
start
note right
booleanready()
end note
if (text.equals("{*")) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
@enduml

