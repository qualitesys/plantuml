@startuml
!pragma layout smetana
start
note right
constructor ElementFactoryBorder(DataSourcedataSource,
Dictionarydictionary)
end note
:super (dataSource,dictionary);;
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:assert header.startsWith("{");;
:while (getDataSource().peek(0).getElement().equals("}")==false){final Stringpos=getDataSource().next().getElement();
:switch (pos.charAt(0)){case 'N':result.setNorth(getNextElement().getElement());
:break ;case 'S':result.setSouth(getNextElement().getElement());
:break ;case 'E':result.setEast(getNextElement().getElement());
:break ;case 'W':result.setWest(getNextElement().getElement());
:break ;case 'C':result.setCenter(getNextElement().getElement());
:break ;default :throw new IllegalStateException();}};
:return new Terminated<Element>(result,next.getTerminator());;
stop
end
start
note right
booleanready()
end note
if (text.equals("{")||text.equals("{+")||text.equals("{#")||text.equals("{!")||text.equals("{-")) then (yes) 
if (text1.matches("[NSEW]=")) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
endif 
:return false;;
stop
end
@enduml

