@startuml
!pragma layout smetana
start
note right
constructor ElementFactoryBorder(DataSourcedataSource,Dictionarydictionary)
end note
:super (dataSource,dictionary);
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
endif 
while (getDataSource().peek(0).getElement().equals("}")==false)
:result.setNorth(getNextElement().getElement());
:result.setSouth(getNextElement().getElement());
:result.setEast(getNextElement().getElement());
:result.setWest(getNextElement().getElement());
:result.setCenter(getNextElement().getElement());
:throw new IllegalStateException();;
endwhile
:return new Terminated<Element>(result,next.getTerminator());;
stop
end
start
note right
booleanready()
end note
if (text.equals("{")||text.equals("{+")||text.equals("{#")||text.equals("{!")||text.equals("{-")) then (yes) 
if (text1.matches("[NSEW]=")) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
endif 
:return false;;
stop
end
@enduml

