@startuml
!pragma layout smetana
start
note right
constructor ElementFactoryBorder(DataSourcedataSource,
Dictionarydictionary)
end note
:super (dataSource,dictionary);;
end
start
note right
Terminated<Element>create()
end note
if (ready()==false) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:final Stringheader=getDataSource().next()
.getElement();;
:assert header.startsWith("{");;
:final ElementBorderresult=new ElementBorder();;
while (getDataSource().peek(0).getElement().equals("}")==false)
:final Stringpos=getDataSource().next().getElement();;
switch (switch (pos.charAt(0)))
endswith
endwhile
:final Terminated<String>next=getDataSource()
.next();;
:return new Terminated<Element>(result,next.getTerminator());;
stop
end
start
note right
booleanready()
end note
:final Stringtext=getDataSource().peek(0)
.getElement();;
if (text.equals("{")||text.equals("{+")||text.equals("{#")||text.equals("{!")||text.equals("{-")) then (yes) 
:final Stringtext1=getDataSource().peek(1)
.getElement();;
if (text1.matches("[NSEW]=")) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
endif 
:return false;;
stop
end
@enduml

