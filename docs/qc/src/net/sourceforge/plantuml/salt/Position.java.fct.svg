@startuml
!pragma layout smetana
start
note right
constructor Position(introw,intcol)
end note
end
start
note right
intgetRow()
end note
:return row;;
stop
end
start
note right
intgetCol()
end note
:return col;;
stop
end
start
note right
inthashCode()
end note
:return row*49+col;;
stop
end
start
note right
booleanequals(Objectobj)
end note
:return row==other.row&&col==other.col;;
stop
end
@enduml

