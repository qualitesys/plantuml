@startuml
!pragma layout smetana
start
note right
constructor Segment(introw,intcol)
end note
end
start
note right
inthashCode()
end note
:return row*47+col;;
stop
end
start
note right
booleanequals(Objectobj)
end note
:return row==this2.row&&col==this2.col;;
stop
end
start
note right
intgetRow()
end note
:return row;;
stop
end
start
note right
intgetCol()
end note
:return col;;
stop
end
@enduml

