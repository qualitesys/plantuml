stop
end
start
note right
HColorgetWhite()
end note
:return HColors.WHITE.withDark(HColors.BLACK);;
stop
end
start
note right
HColorbuildColor(Stringcolor1,Stringcolor2)
end note
:return tmp1.withDark(tmp2);;
stop
end
start
