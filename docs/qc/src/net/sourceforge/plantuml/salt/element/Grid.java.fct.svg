@startuml
!pragma layout smetana
start
note right
constructor Grid(double[]rowsStart,double[]colsStart,
TableStrategystrategy,TextBlocktitle)
end note
if (strategy==TableStrategy.DRAW_OUTSIDE||strategy==TableStrategy.DRAW_OUTSIDE_WITH_TITLE||strategy==TableStrategy.DRAW_ALL) then (yes) 
endif 
end
start
note right
void addOutside()
end note
end
start
note right
void drawU(UGraphicug,doublex,doubley,HColorwhite)
end note
if (dim.getWidth()>0&&dim.getHeight()>0) then (yes) 
endif 
end
start
note right
void addCell(Cellcell)
end note
if (strategy==TableStrategy.DRAW_NONE||strategy==TableStrategy.DRAW_OUTSIDE||strategy==TableStrategy.DRAW_OUTSIDE_WITH_TITLE) then (yes) 
:return ;;
stop
endif 
if (strategy==TableStrategy.DRAW_HORIZONTAL||strategy==TableStrategy.DRAW_ALL) then (yes) 
endif 
if (strategy==TableStrategy.DRAW_VERTICAL||strategy==TableStrategy.DRAW_ALL) then (yes) 
endif 
end
@enduml

