@startuml
!pragma layout smetana
start
note right
void setNorth(Elementnorth)
end note
:this.north=north;;
end
start
note right
void setSouth(Elementsouth)
end note
:this.south=south;;
end
start
note right
void setEast(Elementeast)
end note
:this.east=east;;
end
start
note right
void setWest(Elementwest)
end note
:this.west=west;;
end
start
note right
void setCenter(Elementcenter)
end note
:this.center=center;;
end
start
note right
void drawU(UGraphicug,intzIndex,XDimension2DdimToUse)
end note
:north.drawU(ug,zIndex,dimToUse);;
:south.drawU(ug.apply(UTranslate.dy(pC.getY())),
zIndex,dimToUse);;
:west.drawU(ug.apply(UTranslate.dy(pA.getY())),
zIndex,dimToUse);;
:east.drawU(ug.apply(new UTranslate(pB.getX(),
pB.getY())),zIndex,dimToUse);;
:center.drawU(ug.apply(new UTranslate(pA.getX(),
pA.getY())),zIndex,dimToUse);;
end
start
note right
XDimension2DgetPreferredDimension(StringBounderstringBounder,
doublex,doubley)
end note
:return new XDimension2D(width,height);;
stop
end
@enduml

