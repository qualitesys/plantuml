@startuml
!pragma layout smetana
start
note right
constructor Grid2(List<Double>rowsStart,List<Double>colsStart,
TableStrategystrategy)
end note
end
start
note right
void drawU(UGraphicug)
end note
if (strategy==TableStrategy.DRAW_OUTSIDE||strategy==TableStrategy.DRAW_OUTSIDE_WITH_TITLE) then (yes) 
endif 
if (drawHorizontal()) then (yes) 
endif 
if (drawVertical()) then (yes) 
endif 
end
start
note right
booleandrawHorizontal()
end note
if (strategy==TableStrategy.DRAW_HORIZONTAL||strategy==TableStrategy.DRAW_ALL) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleandrawVertical()
end note
if (strategy==TableStrategy.DRAW_VERTICAL||strategy==TableStrategy.DRAW_ALL) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
@enduml

