@startuml
!pragma layout smetana
start
note right
constructor ElementLine(charseparator)
end note
:this.separator=separator;;
end
start
note right
XDimension2DgetPreferredDimension(StringBounderstringBounder,
doublex,doubley)
end note
:return new XDimension2D(10,6);;
stop
end
start
note right
void drawU(UGraphicug,intzIndex,XDimension2DdimToUse)
end note
if (zIndex!=0) then (yes) 
:return ;;
stop
endif 
:ug=ug.apply(getColorAA());;
if (separator=='=') then (yes) 
:y2=y2-1;;
endif 
:drawLine(ug,0,y2,dimToUse.getWidth(),separator);;
end
start
note right
void drawLine(UGraphicug,doublex,doubley,
doublewidthToUse,charseparator)
end note
if (separator=='=') then (yes) 
:ug.apply(new UStroke()).apply(new UTranslate(x,
y)).draw(ULine.hline(widthToUse));;
:ug.apply(new UStroke()).apply(new UTranslate(x,y+
2)).draw(ULine.hline(widthToUse));;
else (no)
:ug.apply(new UStroke(1.5)).apply(new UTranslate(x,
y)).draw(ULine.hline(widthToUse));;
endif 
end
@enduml

