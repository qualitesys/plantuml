45,450.25,1148.1445,454.25,1138.1445,450.25,1142.1445" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[504f5571c8f96c5f590cc3fa906a514f]
@startuml
!pragma layout smetana
start
note right
constructor ElementMenuPopup(UFontfont,ISkinSimplespriteContainer)
end note
:this.font=font;;
:this.spriteContainer=spriteContainer;;
end
start
note right
void addEntry(Strings)
end note
:entries.add(new ElementMenuEntry(s,font,
spriteContainer));;
end
start
note right
XDimension2DgetPreferredDimension(StringBounderstringBounder,
doublex,doubley)
end note
:w=Math.max(w,dim.getWidth());;
:h+=dim.getHeight();;
:return new XDimension2D(w,h);;
stop
end
start
note right
void drawU(UGraphicug,intzIndex,XDimension2DdimToUse)
end note
if (zIndex!=1) then (yes) 
:return ;;
stop
endif 
:ug=ug.apply(getBlack());;
:ug.apply(getColorDD().bg()).draw(new URectangle(dimToUse.getWidth(),
dimToUse.getHeight()));;
if (entry.getText().equals("-")) then (yes) 
:ug.apply(UTranslate.dy(y1+h/2)).draw(ULine.hline(dimToUse.getWidth()));;
else (no)
:entry.drawU(ug.apply(UTranslate.dy(y1)),
zIndex,dimToUse);;
endif 
:y1+=h;;
end
@enduml

