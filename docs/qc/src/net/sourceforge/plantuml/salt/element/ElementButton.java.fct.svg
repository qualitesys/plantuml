stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="814.3008" y2="834.3008"/><polygon fill="#181818" points="418,824.3008,422,834.3008,426,824.3008,422,828.3008" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a5c8bef89fe59411f0416723d03e6fa0]
@startuml
!pragma layout smetana
start
note right
constructor ElementButton(Stringtext,UFontfont,
ISkinSimplespriteContainer)
end note
:super (text,font,true,spriteContainer);
end
start
note right
XDimension2DgetPreferredDimension(StringBounderstringBounder,
doublex,doubley)
end note
:dim=XDimension2D.delta(dim,2*marginX,2*marginY);
:return XDimension2D.delta(dim,2*stroke);;
stop
end
start
note right
void drawU(UGraphicug,intzIndex,XDimension2DdimToUse)
end note
if (zIndex!=0) then (yes) 
:return ;;
stop
endif 
:ug=ug.apply(new UStroke(stroke));
:ug=ug.apply(getColorEE().bg()).apply(getBlack());
:ug.apply(new UTranslate(stroke,stroke)).draw(new URectangle(dim.getWidth()-2*stroke,dim.getHeight()-2*stroke).rounded(10));
:drawText(ug,(dim.getWidth()-dimPureText.getWidth())/2,stroke+
marginY);
end
@enduml

