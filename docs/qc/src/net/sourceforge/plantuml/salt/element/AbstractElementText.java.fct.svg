else (no)
endif 
end
start
note right
intgetCharNumber(Stringtext)
end note
:return text.length();;
stop
end
start
note right
void drawText(UGraphicug,doublex,doubley)
end note
end
start
note right
XDimension2DgetPureTextDimension(StringBounderstringBounder)
end note
:return block.calculateDimension(stringBounder);;
stop
end
start
note right
XDimension2DgetTextDimensionAt(StringBounderstringBounder,
doublex)
end note
if (charLength==0) then (yes) 
:return result;;
stop
endif 
:return new XDimension2D(Math.max(result.getWidth(),
charLength*dimSpace),result.getHeight());;
stop
end
start
note right
