@startuml
!pragma layout smetana
start
note right
constructor Entry(doublex,doubley)
end note
:this.xpos=x;
:this.ypos=y;
end
start
note right
void drawRectangle(UGraphicug)
end note
:ug.apply(new UTranslate(xpos,ypos)).draw(new URectangle(2,2));
end
start
note right
void add(doublex,doubley)
end note
:entries.add(new Entry(x,y));
end
start
note right
void draw(UGraphicug,doublex,doubley)
end note
:i++;
if (i+1<entries.size()&&entries.get(i+1).xpos>en.xpos) then (yes) 
:en.drawRectangle(ug);
endif 
:j++;
if (en0.xpos<en.xpos) then (yes) 
:parent=en0;
endif 
if (parent!=null ) then (yes) 
:drawChild(ug,parent,en);
endif 
end
start
note right
void drawChild(UGraphicug,Entryparent,Entrychild)
end note
:ug.apply(new UTranslate(parent.xpos+1,parent.ypos+
