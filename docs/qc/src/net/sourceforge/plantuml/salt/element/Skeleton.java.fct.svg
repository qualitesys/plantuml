"211.5,1014.6211,215.5,1024.6211,219.5,1014.6211,215.5,1018.6211" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="215.5" x2="215.5" y1="1072.5586" y2="1092.5586"/><polygon fill="#181818" points="211.5,1082.5586,215.5,1092.5586,219.5,1082.5586,215.5,1086.5586" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="215.5" x2="215.5" y1="1140.4961" y2="1160.4961"/><polygon fill="#181818" points="211.5,1150.4961,215.5,1160.4961,219.5,1150.4961,215.5,1154.4961" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a49d82f0cacc08d9c3405728d4b5e2dc]
@startuml
!pragma layout smetana
start
note right
constructor Entry(doublex,doubley)
end note
:this.xpos=x;;
:this.ypos=y;;
end
start
note right
void drawRectangle(UGraphicug)
end note
:ug.apply(new UTranslate(xpos,ypos)).draw(new URectangle(2,
2));;
end
start
note right
void add(doublex,doubley)
end note
:entries.add(new Entry(x,y));;
end
start
note right
void draw(UGraphicug,doublex,doubley)
end note
if (i+1<entries.size()&&entries.get(i+1).xpos>en.xpos) then (yes) 
:en.drawRectangle(ug);;
endif 
if (en0.xpos<en.xpos) then (yes) 
:parent=en0;;
endif 
if (parent!=null ) then (yes) 
:drawChild(ug,parent,en);;
endif 
end
start
note right
void drawChild(UGraphicug,Entryparent,Entrychild)
end note
:ug.apply(new UTranslate(parent.xpos+1,parent.ypos+
3)).draw(ULine.vline(dy));;
:ug.apply(new UTranslate(parent.xpos+1,child.ypos+
1)).draw(ULine.hline(dx));;
end
@enduml

