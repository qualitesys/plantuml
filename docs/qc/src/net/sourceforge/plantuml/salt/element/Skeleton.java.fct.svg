,1047.4258,268,1057.4258,272,1047.4258,268,1051.4258" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="268" x2="268" y1="1109.9922" y2="1132.5586"/><polygon fill="#181818" points="264,1122.5586,268,1132.5586,272,1122.5586,268,1126.5586" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="268" x2="268" y1="1166.5273" y2="1186.5273"/><polygon fill="#181818" points="264,1176.5273,268,1186.5273,272,1176.5273,268,1180.5273" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="268" x2="268" y1="1220.4961" y2="1240.4961"/><polygon fill="#181818" points="264,1230.4961,268,1240.4961,272,1230.4961,268,1234.4961" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[10c6f2fb003bb88e95b38c4e853cae8e]
@startuml
!pragma layout smetana
start
note right
constructor Entry(doublex,doubley)
end note
:this.xpos=x;
:this.ypos=y;
end
start
note right
void drawRectangle(UGraphicug)
end note
:ug.apply(new UTranslate(xpos,ypos)).draw(new URectangle(2,
2));
end
start
note right
void add(doublex,doubley)
end note
:entries.add(new Entry(x,y));
end
start
note right
void draw(UGraphicug,doublex,doubley)
end note
:i++;
if (i+1<entries.size()&&entries.get(i+1).xpos>en.xpos) then (yes) 
:en.drawRectangle(ug);
endif 
:j++;
if (en0.xpos<en.xpos) then (yes) 
:parent=en0;
endif 
if (parent!=null ) then (yes) 
:drawChild(ug,parent,en);
endif 
end
start
note right
void drawChild(UGraphicug,Entryparent,Entrychild)
end note
:ug.apply(new UTranslate(parent.xpos+1,parent.ypos+3)).draw(ULine.vline(dy));
:ug.apply(new UTranslate(parent.xpos+1,child.ypos+1)).draw(ULine.hline(dx));
end
@enduml

