@startuml
!pragma layout smetana
start
note right
constructor Terminated(Oelement,Terminatorterminator)
end note
end
start
note right
OgetElement()
end note
:return element;;
stop
end
start
note right
TerminatorgetTerminator()
end note
:return terminator;;
stop
end
start
note right
StringtoString()
end note
:return element.toString()+" "+terminator;;
stop
end
@enduml

