@startuml
!pragma layout smetana
start
note right
constructor Cell(introw,intcol)
end note
end
start
note right
void mergeLeft()
end note
end
start
note right
intgetMinRow()
end note
:return minRow;;
stop
end
start
note right
intgetMaxRow()
end note
:return maxRow;;
stop
end
start
note right
intgetMinCol()
end note
:return minCol;;
stop
end
start
note right
intgetMaxCol()
end note
:return maxCol;;
stop
end
start
note right
intgetNbRows()
end note
:return maxRow-minRow+1;;
stop
end
start
note right
intgetNbCols()
end note
:return maxCol-minCol+1;;
stop
end
start
note right
StringtoString()
end note
:return "("+minRow+","+minCol+")-("+maxRow+
","+maxCol+")";;
stop
end
@enduml

