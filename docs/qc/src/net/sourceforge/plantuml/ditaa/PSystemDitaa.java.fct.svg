@startuml
!pragma layout smetana
start
note right
constructor PSystemDitaa(UmlSourcesource,
Stringdata,booleanperformSeparationOfCommonEdges,
booleandropShadows,booleanallCornersAreRound,
booleantransparentBackground,floatscale,Fontfont,
booleanforceFontSize)
end note
end
start
note right
PSystemDitaaadd(Stringline)
end note
:return new PSystemDitaa(getSource(),data+
line+BackSlash.NEWLINE,performSeparationOfCommonEdges,
dropShadows,allCornersAreRound,transparentBackground,
scale,font,forceFontSize);;
stop
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(Ditaa)");;
stop
end
start
note right
ImageDataexportDiagramNow(OutputStreamos,
intnum,FileFormatOptionfileFormat)
end note
if (fileFormat.getFileFormat()==FileFormat.ATXT) then (yes) 
:return ImageDataSimple.ok();;
stop
endif 
:return new ImageDataSimple(width,height);;
stop
:return ImageDataSimple.error();;
stop
end
@enduml

