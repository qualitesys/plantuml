@startuml
!pragma layout smetana
start
note right
constructor TinyJavaLogo(TurtleGraphicsPaneturtleGraphicsPane)
end note
:this.turtleGraphicsPane=turtleGraphicsPane;;
end
start
note right
void message(StringmessageText)
end note
end
start
note right
void error(StringmessageText)
end note
:turtleGraphicsPane.message("Error: "+messageText);;
end
start
note right
void parseCommandBlock(intnestLevel)
end note
:StringcommandName;;
:Stringcode;;
:LogoTokentoken=scanner.getToken();;
while (token.kind!=LogoToken.END_OF_INPUT&&token.kind!=LogoToken.INVALID_TOKEN)
switch (switch (token.kind))
endswith
endwhile
end
start
note right
void doCommandLine(StringcommandLine)
end note
:message(commandLine);;
:scanner.setSourceString(commandLine);;
:parseCommandBlock(0);;
end
@enduml

