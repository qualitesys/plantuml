@startuml
!pragma layout smetana
start
note right
Stringformat(LogRecordrecord)
end note
if (record.getThrown()==null ) then (yes) 
:throwable="";
else (no)
:pw.println();
:record.getThrown().printStackTrace(pw);
:pw.close();
:throwable=sw.toString().trim();
endif 
if (message.trim().length()>0) then (yes) 
:sb.append(message);
:sb.append(System.lineSeparator());
endif 
if (throwable.length()>0) then (yes) 
:sb.append(throwable);
:sb.append(System.lineSeparator());
endif 
:return sb.toString();;
stop
end
@enduml

