.9453,171,490.9453,175,480.9453,171,484.9453" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="171" x2="171" y1="524.9141" y2="544.9141"/><polygon fill="#181818" points="167,534.9141,171,544.9141,175,534.9141,171,538.9141" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[36760b6e7a0e6d935308241852fb4242]
@startuml
!pragma layout smetana
start
note right
void apply(SecurityAuthenticationauthentication,URLConnectionconnection)
end note
:connection.setRequestProperty("Authorization",
authHeaderValue);
end
start
note right
StringgetAuth(SecurityAuthenticationauthentication)
end note
if (StringUtils.isNotEmpty(id)) then (yes) 
:auth.append(id);
if (secret!=null &&secret.length>0) then (yes) 
:auth.append(':').append(secret);
endif 
endif 
:return auth.toString();;
stop
end
@enduml

