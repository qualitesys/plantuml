19" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="694.5" x2="694.5" y1="527.2852" y2="629.6563"/><line style="stroke:#181818;stroke-width:1.0;" x1="694.5" x2="591" y1="629.6563" y2="629.6563"/><polygon fill="#181818" points="601,625.6563,591,629.6563,601,633.6563,597,629.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="579" x2="579" y1="597.6563" y2="617.6563"/><polygon fill="#181818" points="575,607.6563,579,617.6563,583,607.6563,579,611.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="579" x2="579" y1="641.6563" y2="661.6563"/><polygon fill="#181818" points="575,651.6563,579,661.6563,583,651.6563,579,655.6563" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[14a5dd85def55107c84b817543634d95]
@startuml
!pragma layout smetana
start
note right
SecurityAuthenticationcreate(SecurityCredentialscredentials)
end note
if (StringUtils.isNotEmpty(requestScope)) then (yes) 
:content.append("&scope=").append(urlEncode(requestScope));
endif 
if (identifier!=null ) then (yes) 
:basicAuth=basicAuthManager.create(SecurityCredentials.basicAuth(identifier,
secret));
:content.append("&client_id").append(urlEncode(credentials.getIdentifier()))
.append("&client_secret").append(urlEncode(new String(credentials.getSecret())));
else (no)
:basicAuth=basicAuthManager.create(SecurityCredentials.basicAuth(credentials.getIdentifier(),
credentials.getSecret()));
endif 
:return requestAndCreateAuthFromResponse(credentials.getProxy(),
grantType,tokenType,tokenService,content.toString(),
basicAuth);;
stop
if (secret!=null &&secret.length>0) then (yes) 
:Arrays.fill(secret,'*');
endif 
end
@enduml

