y2="629.6563"/><line style="stroke:#181818;stroke-width:1.0;" x1="733.5" x2="630" y1="629.6563" y2="629.6563"/><polygon fill="#181818" points="640,625.6563,630,629.6563,640,633.6563,636,629.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="618" x2="618" y1="597.6563" y2="617.6563"/><polygon fill="#181818" points="614,607.6563,618,617.6563,622,607.6563,618,611.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="618" x2="618" y1="641.6563" y2="661.6563"/><polygon fill="#181818" points="614,651.6563,618,661.6563,622,651.6563,618,655.6563" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8b3a3c7a67ac8efe7d35cfe2d6c8a579]
@startuml
!pragma layout smetana
start
note right
SecurityAuthenticationcreate(SecurityCredentialscredentials)
end note
if (StringUtils.isNotEmpty(requestScope)) then (yes) 
:content.append("&scope=").append(urlEncode(requestScope));
endif 
if (identifier!=null ) then (yes) 
:basicAuth=basicAuthManager.create(SecurityCredentials.basicAuth(identifier,
secret));
:content.append("&client_id").append(urlEncode(credentials.getIdentifier()))
.append("&client_secret").append(urlEncode(new String(credentials.getSecret())));
else (no)
:basicAuth=basicAuthManager.create(SecurityCredentials.basicAuth(credentials.getIdentifier(),credentials.getSecret()));
endif 
:return requestAndCreateAuthFromResponse(credentials.getProxy(),
grantType,tokenType,tokenService,content.toString(),
basicAuth);;
stop
if (secret!=null &&secret.length>0) then (yes) 
:Arrays.fill(secret,'*');
endif 
end
@enduml

