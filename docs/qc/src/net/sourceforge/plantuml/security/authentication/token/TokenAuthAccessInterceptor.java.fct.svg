@startuml
!pragma layout smetana
start
note right
void apply(SecurityAuthenticationauthentication,URLConnectionconnection)
end note
if (!header.getKey().startsWith("headers.")||header.getValue()==null ) then (yes) 
endif 
:connection.setRequestProperty(key,value);
end
@enduml

