@startuml
!pragma layout smetana
start
note right
SecurityProfileinit()
end note
:final Stringenv=SecurityUtils.getenv("PLANTUML_SECURITY_PROFILE");;
if (String.valueOf("SANDBOX").equalsIgnoreCase(env)) then (yes) 
:return SANDBOX;;
stop
else if (String.valueOf("ALLOWLIST").equalsIgnoreCase(env)) then (yes) 
:return ALLOWLIST;;
stop
else if (String.valueOf("INTERNET").equalsIgnoreCase(env)) then (yes) 
:return INTERNET;;
stop
else if (String.valueOf("UNSECURE").equalsIgnoreCase(env)) then (yes) 
:return UNSECURE;;
stop
endif 
:return LEGACY;;
stop
end
start
note right
StringlongDescription()
end note
switch (switch (this))
endswith
:return "<i>This is completely safe: no access on local files or on distant URL.";;
stop
end
start
note right
longgetTimeout()
end note
switch (switch (this))
endswith
:throw new AssertionError();;
stop
end
@enduml

