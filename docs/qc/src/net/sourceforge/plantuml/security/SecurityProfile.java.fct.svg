@startuml
!pragma layout smetana
start
note right
SecurityProfileinit()
end note
if (String.valueOf("SANDBOX").equalsIgnoreCase(env)) then (yes) 
:return SANDBOX;;
stop
endif 
:return LEGACY;;
stop
end
start
note right
StringlongDescription()
end note
:switch (this){case SANDBOX:return "This is completely safe: no access to local files or to distant URL.";
:case ALLOWLIST:return "Some local resource may be accessible.";
:case INTERNET:return "<i>Mode designed for server connected to Internet.";
:case LEGACY:return "<b>Warning: this mode will be removed in future version";
:case UNSECURE:return "<b>Make sure that this server is not accessible from Internet";};
:return "<i>This is completely safe: no access on local files or on distant URL.";;
stop
end
start
note right
longgetTimeout()
end note
:switch (this){case SANDBOX:return 1000L;
:case ALLOWLIST:return 1000L*60*5;case INTERNET:return 1000L*10;
:case LEGACY:return 1000L*60;case UNSECURE:return 1000L*60*5;};
:throw new AssertionError();;
stop
end
@enduml

