@startuml
!pragma layout smetana
start
note right
UmlSourceremoveInitialSkinparam()
end note
if (hasInitialSkinparam(source)==false) then (yes) 
:return this;;
stop
endif 
while (hasInitialSkinparam(copy))
:copy.remove(1);
endwhile
:return new UmlSource(copy,rawSource);;
stop
end
start
note right
booleancontainsIgnoreCase(Stringsearched)
end note
if (StringUtils.goLowerCase(s.getString())
.contains(searched)) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleanhasInitialSkinparam(final List<StringLocated>copy)
end note
:return copy.size()>1&&(copy.get(1).getString()
.startsWith("skinparam ")||copy.get(1).getString()
.startsWith("skinparamlocked "));;
stop
end
start
note right
constructor UmlSource(List<StringLocated>source,
List<StringLocated>rawSource)
end note
:this.source=source;
:this.rawSource=rawSource;
end
start
note right
UmlSourcecreate(List<StringLocated>source,
booleancheckEndingBackslash)
end note
:return createWithRaw(source,checkEndingBackslash,
emptyArrayList());;
stop
end
start
note right
UmlSourcecreateWithRaw(List<StringLocated>source,
booleancheckEndingBackslash,List<StringLocated>rawSource)
end note
:result.loadInternal(source,checkEndingBackslash);
:return result;;
stop
end
start
note right
ArrayList<StringLocated>emptyArrayList()
end note
:return new ArrayList<>();;
stop
end
start
note right
void loadInternal(List<StringLocated>source,
booleancheckEndingBackslash)
end note
if (checkEndingBackslash) then (yes) 
if (StringUtils.endsWithBackslash(s)) then (yes) 
:pending.append(s,0,s.length()-1);
else (no)
:pending.append(s);
:this.source.add(new StringLocated(pending.toString(),
cs.getLocation()));
:pending.setLength(0);
endif 
else (no)
:this.source.addAll(source);
endif 
end
start
note right
DiagramTypegetDiagramType()
end note
:return DiagramType.getTypeFromArobaseStart(source.get(0)
.getString());;
stop
end
start
note right
IteratorCounter2iterator2()
end note
:return new IteratorCounter2Impl(source);;
stop
end
start
note right
StringgetPlainString()
end note
:sb.append(s.getString());
:sb.append('\r');
:sb.append(BackSlash.CHAR_NEWLINE);
:return sb.toString();;
stop
end
start
note right
StringgetRawString()
end note
:sb.append(s.getString());
:sb.append('\r');
:sb.append(BackSlash.CHAR_NEWLINE);
:return sb.toString();;
stop
end
start
note right
longseed()
end note
:return StringUtils.seed(getPlainString());;
stop
end
start
note right
StringgetLine(LineLocationn)
end note
if (s.getLocation().compareTo(n)==0) then (yes) 
:return s.getString();;
stop
endif 
:return null ;;
stop
end
start
note right
intgetTotalLineCount()
end note
:return source.size();;
stop
end
start
note right
booleangetTotalLineCountLessThan5()
end note
:return getTotalLineCount()<5;;
stop
end
start
note right
booleanisEmpty()
end note
if (StartUtils.isArobaseStartDiagram(s.getString())) then (yes) 
endif 
if (StartUtils.isArobaseEndDiagram(s.getString())) then (yes) 
endif 
if (s.getString().matches("\\s*'.*")) then (yes) 
endif 
if (StringUtils.trin(s.getString()).length()!=0) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
DisplaygetTitle()
end note
if (ok) then (yes) 
:return Display.create(m.group(1));;
stop
endif 
:return Display.empty();;
stop
end
start
note right
booleanisStartDef()
end note
:return source.get(0).getString().startsWith("@startdef");;
stop
end
start
note right
StringgetId()
end note
if (m.find()) then (yes) 
:return m.group(1);;
stop
endif 
:return null ;;
stop
end
@enduml

