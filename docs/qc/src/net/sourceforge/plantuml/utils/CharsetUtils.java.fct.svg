@startuml
!pragma layout smetana
start
note right
CharsetcharsetOrDefault(StringcharsetName)
end note
if (charsetName==null ) then (yes) 
:return Charset.defaultCharset();;
stop
else (no)
:return Charset.forName(charsetName);;
stop
endif 
end
@enduml

