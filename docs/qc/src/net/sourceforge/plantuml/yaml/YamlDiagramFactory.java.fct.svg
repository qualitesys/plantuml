constructor YamlDiagramFactory()
end note
:super (DiagramType.YAML);;
end
start
note right
DiagramcreateSystem(UmlSourcesource,Map<String,
String>skinParam)
end note
:try {final List<String>list=new ArrayList<>();
:styleExtractor=new StyleExtractor(source.iterator2());
:final Iterator<String>it=styleExtractor.getIterator();
:it.next();while (true){final Stringline=it.next();
:if (it.hasNext()==false)break ;if (line.startsWith("#highlight ")){highlighted.add(line.substring(String.valueOf("#highlight ").length()).trim());
:continue ;}list.add(line);}yaml=new SimpleYamlParser().parse(list);
:}catch (Exceptione){Logme.error(e);};
if (styleExtractor!=null ) then (yes) 
:styleExtractor.applyStyles(result.getSkinParam());;
if (title!=null ) then (yes) 
:result.setTitle(DisplayPositioned.single(Display.getWithNewlines(title),
