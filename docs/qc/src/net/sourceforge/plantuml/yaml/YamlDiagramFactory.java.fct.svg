@startuml
!pragma layout smetana
start
note right
constructor YamlDiagramFactory()
end note
:super (DiagramType.YAML);
end
start
note right
DiagramcreateSystem(UmlSourcesource,Map<String,String>skinParam)
end note
:styleExtractor=new StyleExtractor(source.iterator2());
:it.next();
while (true)
if (it.hasNext()==false) then (yes) 
endif 
if (line.startsWith("#highlight ")) then (yes) 
:highlighted.add(line.substring(String.valueOf("#highlight ")
.length()).trim());
endif 
:list.add(line);
endwhile
:yaml=new SimpleYamlParser().parse(list);
:Logme.error(e);
if (styleExtractor!=null ) then (yes) 
:styleExtractor.applyStyles(result.getSkinParam());
if (title!=null ) then (yes) 
:result.setTitle(DisplayPositioned.single(Display.getWithNewlines(title),
HorizontalAlignment.CENTER,VerticalAlignment.CENTER));
endif 
endif 
:return result;;
stop
end
@enduml

