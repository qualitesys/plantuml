note right
void changeExtensions(Stringext)
end note
if (ext.equals(getExtensions())) then (yes) 
:return ;;
stop
endif 
while (m.find())
if (sb.length()>0) then (yes) 
:sb.append(", ");
endif 
:sb.append(value);
endwhile
:ext=sb.toString();
if (ext.length()==0) then (yes) 
:ext=getDefaultFileExtensions();
endif 
:extensions.setText(ext);
:prefs.put(KEY_PATTERN,ext);
:changeDir(dirWatcher.getDir());
end
start
note right
StringgetRegexpPattern(Stringext)
end note
while (m.find())
if (filePattern.toString().endsWith("(")==false) then (yes) 
:filePattern.append("|");
endif 
:filePattern.append(value);
endwhile
if (filePattern.toString().endsWith("(")==false) then (yes) 
:filePattern.append(")$");
:return filePattern.toString();;
stop
endif 
:return Option.getPattern();;
stop
