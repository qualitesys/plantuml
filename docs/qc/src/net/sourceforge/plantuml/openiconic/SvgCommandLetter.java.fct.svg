@startuml
!pragma layout smetana
start
note right
constructor SvgCommandLetter(Stringletter)
end note
if (letter.matches("[mlhvzsacMLHVZSAC]")==false) then (yes) 
:throw new IllegalArgumentException(letter);;
stop
endif 
:this.letter=letter.charAt(0);;
end
start
note right
StringtoString()
end note
:return " "+letter;;
stop
end
start
note right
StringtoSvg()
end note
:return ""+letter;;
stop
end
start
note right
intargumentNumber()
end note
switch (switch (StringUtils.goLowerCase(letter)))
endswith
:throw new UnsupportedOperationException(""+
letter);;
stop
end
start
note right
booleanisUpperCase()
end note
:return Character.isUpperCase(letter);;
stop
end
start
note right
booleanis(charc)
end note
:return this.letter==c;;
stop
end
start
note right
chargetLetter()
end note
:return letter;;
stop
end
start
note right
SvgCommandLetterimplicit()
end note
if (letter=='m') then (yes) 
:return new SvgCommandLetter("l");;
stop
endif 
if (letter=='M') then (yes) 
:return new SvgCommandLetter("L");;
stop
endif 
:return this;;
stop
end
@enduml

