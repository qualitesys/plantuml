@startuml
!pragma layout smetana
start
note right
constructor PSystemListOpenIconic(UmlSourcesource)
end note
:super (source);;
end
start
note right
UDrawablegetRootDrawable(FileFormatOptionfileFormatOption)
end note
:lines.add("<b>List Open Iconic");;
:lines.add("<i>Credit to");;
:lines.add("https://useiconic.com/open");;
:lines.add(" ");;
:try (BufferedReaderbr=new BufferedReader(new InputStreamReader(getResourceAllTxt()))){Strings=null ;while ((s=br.readLine())!=null ){lines.add("<&"+
s+"> "+s);}};
:return new TextBlockHorizontal(cols,VerticalAlignment.TOP);;
stop
end
start
note right
InputStreamgetResourceAllTxt()
end note
:return DummyIcon.class .getResourceAsStream("all.txt");;
stop
end
