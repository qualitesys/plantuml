@startuml
!pragma layout smetana
start
note right
constructor SvgCommandNumber(Stringnumber)
end note
if (number.matches("[-.0-9e]+")==false) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
StringtoString()
end note
:return " "+number;;
stop
end
start
note right
constructor SvgCommandNumber(doublenumber)
end note
end
start
note right
SvgCommandNumberadd(SvgCommandNumberother)
end note
:return new SvgCommandNumber(getDouble()+
other.getDouble());;
stop
end
start
note right
StringtoSvg()
end note
:return number;;
stop
end
start
note right
doublegetDouble()
end note
:return Double.parseDouble(number);;
stop
end
@enduml

