@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,Stringline)
end note
if (lineLower.startsWith("listopeniconic")) then (yes) 
:return new PSystemListOpenIconic(source);;
stop
endif 
:return null ;;
stop
end
@enduml

