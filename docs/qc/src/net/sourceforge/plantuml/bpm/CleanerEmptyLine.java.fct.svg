@startuml
!pragma layout smetana
start
note right
booleanclean(Gridgrid)
end note
if (grid.usedColsOf(line).isEmpty()) then (yes) 
:grid.removeLine(line);
:result=true;
endif 
:return result;;
stop
end
@enduml

