@startuml
!pragma layout smetana
start
note right
constructor CommandGoto()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandGoto.class .getName(),
RegexLeaf.start(),new RegexLeaf("goto"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("ID","([%pLN_.@]+)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(BpmDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.addEvent(event);;
stop
end
@enduml

