@startuml
!pragma layout smetana
start
note right
constructor CommandResume()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandResume.class .getName(),
RegexLeaf.start(),new RegexLeaf("resume"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("ID",
"([%pLN_.@]+)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(BpmDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.addEvent(event);;
stop
end
@enduml

