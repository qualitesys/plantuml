@startuml
!pragma layout smetana
start
note right
constructor Coord(Lineline,Colrow)
end note
end
start
note right
ColgetCol()
end note
:return col;;
stop
end
start
note right
StringtoString()
end note
:return "line="+line+" col="+col;;
stop
end
start
note right
LinegetLine()
end note
:return line;;
stop
end
start
note right
inthashCode()
end note
:return line.hashCode()+col.hashCode();;
stop
end
start
note right
booleanequals(Objectobj)
end note
:return this.line==other.line&&this.col==other.col;;
stop
end
@enduml

