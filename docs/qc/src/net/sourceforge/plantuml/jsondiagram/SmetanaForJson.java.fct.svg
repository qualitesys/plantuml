@startuml
!pragma layout smetana
start
note right
constructor InternalNode(TextBlockJsonblock,
ST_Agnode_snode)
end note
:this.block=block;
:this.node=node;
end
start
note right
doublegetMaxX()
end note
:return y+height/2;;
stop
end
start
note right
constructor SmetanaForJson(UGraphicug,ISkinParamskinParam)
end note
:this.stringBounder=ug.getStringBounder();
:this.skinParam=skinParam;
:this.ug=ug;
end
start
note right
SNamegetDiagramType()
end note
if (skinParam.getUmlDiagramType()==UmlDiagramType.JSON) then (yes) 
:return SName.jsonDiagram;;
stop
endif 
:return SName.yamlDiagram;;
stop
end
start
note right
StylegetStyleArrow()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,getDiagramType(),SName.arrow).getMergedStyle(skinParam.getCurrentStyleBuilder());;
stop
end
start
note right
StylegetStyleNode()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,getDiagramType(),SName.node).getMergedStyle(skinParam.getCurrentStyleBuilder());;
stop
end
start
note right
StylegetStyleNodeHeader()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,getDiagramType(),SName.header,
SName.node).getMergedStyle(skinParam.getCurrentStyleBuilder());;
stop
end
start
note right
StylegetStyleNodeHighlight()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,getDiagramType(),SName.node,
SName.highlight).getMergedStyle(skinParam.getCurrentStyleBuilder());;
stop
end
start
note right
StylegetStyleNodeHeaderHighlight()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,getDiagramType(),SName.header,
SName.node,SName.highlight).getMergedStyle(skinParam.getCurrentStyleBuilder());;
stop
end
start
note right
ST_Agnode_smanageOneNode(JsonValuecurrent,
List<String>highlighted)
end note
:nodes.add(new InternalNode(block,node1));
:i++;
if (tmp!=null ) then (yes) 
:edges.add(edge);
endif 
:return node1;;
stop
end
start
note right
List<String>removeOneLevel(Stringkey,List<String>list)
end note
if (tmp.startsWith("\""+key+"\"")==false) then (yes) 
endif 
:tmp=tmp.trim().replaceFirst("\"([^\"]+)\"",
"").trim();
if (tmp.length()>0) then (yes) 
:tmp=tmp.substring(1).trim();
:result.add(tmp);
endif 
:return Collections.unmodifiableList(result);;
stop
end
start
note right
void drawMe(JsonValueroot,List<String>highlighted)
end note
:initGraph(root,highlighted);
:max=Math.max(max,node.getMaxX());
:xMirror=new Mirror(max);
:node.block.drawU(getStyleNode().applyStrokeAndLineColor(ug,
skinParam.getIHtmlColorSet()).apply(getPosition(node.node)));
:curve.drawCurve(color,getStyleArrow().applyStrokeAndLineColor(ug,
skinParam.getIHtmlColorSet()));
:curve.drawSpot(getStyleArrow().applyStrokeAndLineColor(ug,
skinParam.getIHtmlColorSet()).apply(color.bg()));
end
start
note right
void initGraph(JsonValueroot,List<String>highlighted)
end note
if (g!=null ) then (yes) 
:return ;;
stop
endif 
:Z.open();
:g=agopen(new CString("g"),Z.z().Agdirected,
null );
:manageOneNode(root,highlighted);
:gvLayoutJobs(gvc,g);
:Z.close();
:NUM++;
if (exitAfterFirst) then (yes) 
:System.err.println("- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -");
:SmetanaDebug.printMe();
:System.err.println("- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -");
:System.exit(0);
endif 
end
start
note right
UTranslategetPosition(ST_Agnode_snode)
end note
:return new UTranslate(x-width/2,xMirror.inv(y+height/2)).sym();;
stop
end
start
note right
JsonCurvegetCurve(ST_Agedge_se,doubleveryFirstLine)
end note
:return new JsonCurve(data,xMirror,veryFirstLine);;
stop
end
start
note right
ST_Agedge_screateEdge(ST_Agnode_sa0,ST_Agnode_sa1,
intnum)
end note
:edge.NAME=a0.NAME+"-"+a1.NAME;
:agsafeset(edge,new CString("arrowsize"),
new CString(".75"),new CString(""));
:agsafeset(edge,new CString("arrowtail"),
new CString("none"),new CString(""));
:agsafeset(edge,new CString("arrowhead"),
new CString("normal"),new CString(""));
:agsafeset(edge,new CString("tailport"),new CString("P"+num),
new CString(""));
:sb.append("N"+a0.UID+" -> N"+a1.UID+" [tailport=\"P"+num+"\",
 arrowsize=.75]");
if (NUM==0&&printFirst) then (yes) 
:System.err.println(sb);
endif 
:return edge;;
stop
end
start
note right
ST_Agnode_screateNode(XDimension2Ddim,intsize,
booleanisArray,intcolAwidth,intcolBwidth)
end note
:node.NAME="N "+num;
:num++;
:agsafeset(node,new CString("shape"),new CString("record"),
new CString(""));
:agsafeset(node,new CString("height"),new CString(""+width),
new CString(""));
:agsafeset(node,new CString("width"),new CString(""+height),
new CString(""));
if (size>0) then (yes) 
:agsafeset(node,new CString("label"),new CString(dotLabel),
new CString(""));
endif 
:sb.append("N"+node.UID+" [");
:sb.append("shape=record, height="+width+",
 width="+height+", label=\""+dotLabel.replace('x',
'.')+"\"]");
if (NUM==0&&printFirst) then (yes) 
:System.err.println(sb);
endif 
:return node;;
stop
end
start
note right
StringgetDotLabel(intsize,booleanisArray,
intwidthA,intwidthB,intheight)
end note
if (isArray==false) then (yes) 
:sb.append("{_dim_"+height+"_"+widthA+"_|{");
endif 
:i++;
:sb.append("<P"+i+">");
:sb.append("_dim_"+height+"_"+widthB+"_");
if (i<size-1) then (yes) 
:sb.append("|");
endif 
if (isArray==false) then (yes) 
:sb.append("}}");
endif 
:return sb.toString();;
stop
end
@enduml

