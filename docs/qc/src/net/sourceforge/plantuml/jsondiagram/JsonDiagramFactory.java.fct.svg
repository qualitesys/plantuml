@startuml
!pragma layout smetana
start
note right
constructor JsonDiagramFactory()
end note
:super (DiagramType.JSON);
end
start
note right
DiagramcreateSystem(UmlSourcesource,Map<String,
String>skinParam)
end note
:styleExtractor=new StyleExtractor(source.iterator2());
:it.next();
while (true)
if (it.hasNext()==false) then (yes) 
endif 
if (line.startsWith("#")) then (yes) 
if (line.startsWith("#highlight ")) then (yes) 
:highlighted.add(line.substring(String.valueOf("#highlight ")
.length()).trim());
endif 
else (no)
:sb.append(line);
:sb.append(BackSlash.CHAR_NEWLINE);
endif 
endwhile
:json=Json.parse(sb.toString());
:json=null ;
if (styleExtractor!=null ) then (yes) 
:styleExtractor.applyStyles(result.getSkinParam());
endif 
:return result;;
stop
end
@enduml

