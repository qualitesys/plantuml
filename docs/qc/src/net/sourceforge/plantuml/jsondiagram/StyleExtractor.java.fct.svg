@startuml
!pragma layout smetana
start
note right
constructor StyleExtractor(Iterator<StringLocated>data)
end note
:while (data.hasNext()){StringLocatedline=data.next();
:if (startStyle(line)){while (data.hasNext()){style.add(line);
:if (endStyle(line))break ;line=data.next();
:}}else if (line.getString().trim().startsWith("!assume ")){}else if (line.getString()
.trim().startsWith("!pragma ")){}else if (line.getString().trim().startsWith("hide ")){}else if (line.getString().trim().startsWith("title ")){this.title=line.getString().trim().substring(String.valueOf("title ").length()).trim();}else if (line.getString().trim().startsWith("skinparam ")){if (line.getString().trim().contains("{")){while (data.hasNext()){if (line.getString().trim().equals("}"))break ;line=data.next();}}}else {list.add(line.getString());}};
end
start
note right
booleanstartStyle(StringLocatedline)
end note
:return line.getString().trim().equals("<style>");;
stop
end
start
note right
booleanendStyle(StringLocatedline)
end note
:return line.getString().trim().equals("</style>");;
stop
end
start
note right
void applyStyles(ISkinParamskinParam)
end note
if (style.size()>0) then (yes) 
:skinParam.muteStyle(modifiedStyle);;
endif 
end
start
note right
Iterator<String>getIterator()
end note
:return list.iterator();;
stop
end
start
note right
StringgetTitle()
end note
:return title;;
stop
end
@enduml

