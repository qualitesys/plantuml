@startuml
!pragma layout smetana
start
note right
constructor Arrow(XPoint2Dp1,XPoint2Dp2)
end note
:this.p1=p1;;
:this.p2=p2;;
end
start
note right
void drawArrow(UGraphicug)
end note
:ug=ug.apply(new UStroke());;
:path.moveTo(p4);;
:path.lineTo(p11);;
:path.lineTo(p3);;
:path.lineTo(p2);;
:path.lineTo(p4);;
:path.closePath();;
:ug.draw(path);;
end
start
note right
XPoint2DgetPoint(XPoint2Dcenter,doublealpha,
doublelen)
end note
:return new XPoint2D(x,y);;
stop
end
@enduml

