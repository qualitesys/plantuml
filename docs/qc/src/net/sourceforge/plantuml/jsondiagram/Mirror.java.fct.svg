@startuml
!pragma layout smetana
start
note right
constructor Mirror(doublemax)
end note
end
start
note right
doubleinv(doublev)
end note
if (v<0||v>max) then (yes) 
endif 
:return max-v;;
stop
end
start
note right
XPoint2DinvAndXYSwitch(XPoint2Dpt)
end note
:return new XPoint2D(x,y);;
stop
end
start
note right
XPoint2DinvGit(XPoint2Dpt)
end note
:return new XPoint2D(x,y);;
stop
end
@enduml

