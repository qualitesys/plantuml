@startuml
!pragma layout smetana
start
note right
constructor PlainDiagram(UmlSourcesource)
end note
:super (source);
end
start
note right
ImageBuildercreateImageBuilder(FileFormatOptionfileFormatOption)
end note
:return super .createImageBuilder(fileFormatOption)
.margin(getDefaultMargins()).metadata(fileFormatOption.isWithMetadata()? getMetadata():null )
.seed(seed());;
stop
end
start
note right
ImageDataexportDiagramNow(OutputStreamos,
intindex,FileFormatOptionfileFormatOption)
end note
:return createImageBuilder(fileFormatOption)
.drawable(getRootDrawable(fileFormatOption))
.write(os);;
stop
end
@enduml

