@startuml
!pragma layout smetana
start
note right
constructor CommandCreateEntityObject()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandCreateEntityObject.class .getName(),
RegexLeaf.start(),new RegexLeaf("TYPE","object"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("NAME",
"(?:[%g]([^%g]+)[%g][%s]+as[%s]+)?([%pLN_.]+)"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("STEREO",
"(\\<\\<.+\\>\\>)?"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("URL","("+UrlBuilder.getRegexp()+")?"),
RegexLeaf.spaceZeroOrMore(),ColorParser.exp1(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(AbstractClassOrObjectDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (leafExist) then (yes) 
:return CommandExecutionResult.error("Object already exists : "+code);;
stop
endif 
if (stereotype!=null ) then (yes) 
:entity.setStereotype(Stereotype.build(stereotype,
diagram.getSkinParam().getCircledCharacterRadius(),
diagram.getSkinParam().getFont(null ,false,
FontParam.CIRCLED_CHARACTER),diagram.getSkinParam().getIHtmlColorSet()));
endif 
if (urlString!=null ) then (yes) 
:entity.addUrl(url);
endif 
:entity.setSpecificColorTOBEREMOVED(ColorType.BACK,
s==null ? null :diagram.getSkinParam().getIHtmlColorSet().getColor(s));
:return CommandExecutionResult.ok();;
stop
end
@enduml

