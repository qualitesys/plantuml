@startuml
!pragma layout smetana
start
note right
void validateInput(Argon2argon2)
end note
if (argon2.getLanes()<MIN_PARALLELISM) then (yes) 
:message=P_MIN_MSG;
endif 
if (message!=null ) then (yes) 
:throw new Argon2InvalidParameterException(message);;
endif 
end
@enduml

