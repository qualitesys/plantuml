@startuml
!pragma layout smetana
start
note right
void fillBlock(BlockX,BlockY,BlockcurrentBlock,
booleanwithXor)
end note
:R.xor(X,Y);
:Z.copyBlock(R);
:i++;
:Functions.roundFunction(Z,16*i,16*i+1,16*i+2,
16*i+3,16*i+4,16*i+5,16*i+6,16*i+7,16*i+8,
16*i+9,16*i+10,16*i+11,16*i+12,16*i+13,16*i+14,
16*i+15);
:i++;
:Functions.roundFunction(Z,2*i,2*i+1,2*i+16,
2*i+17,2*i+32,2*i+33,2*i+48,2*i+49,2*i+64,
2*i+65,2*i+80,2*i+81,2*i+96,2*i+97,2*i+112,
2*i+113);
if (withXor) then (yes) 
:currentBlock.xor(R,Z,currentBlock);
else (no)
:currentBlock.xor(R,Z);
endif 
end
@enduml

