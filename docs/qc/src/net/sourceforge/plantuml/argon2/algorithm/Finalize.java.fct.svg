@startuml
!pragma layout smetana
start
note right
void finalize(Instanceinstance,Argon2argon2)
end note
:finalBlock.xorWith(instance.memory[lastBlockInLane]);;
:argon2.setOutput(finalResult);;
if (argon2.isClearMemory()) then (yes) 
:instance.clear();;
:argon2.clear();;
endif 
end
@enduml

