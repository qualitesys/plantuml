end note
:fillFirstBlocks(instance,initialHash);;
end
start
note right
void fillFirstBlocks(Instanceinstance,byte[]initialHash)
end note
:System.arraycopy(iBytes,0,initialHashWithZeros,ARGON2_PREHASH_DIGEST_LENGTH+
4,4);;
:System.arraycopy(iBytes,0,initialHashWithOnes,ARGON2_PREHASH_DIGEST_LENGTH+
4,4);;
:instance.memory[i*instance.getLaneLength()+
