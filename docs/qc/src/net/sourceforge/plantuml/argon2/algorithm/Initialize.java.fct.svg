@startuml
!pragma layout smetana
start
note right
void initialize(Instanceinstance,Argon2argon2)
end note
:fillFirstBlocks(instance,initialHash);
end
start
note right
void fillFirstBlocks(Instanceinstance,byte[]initialHash)
end note
:i++;
:System.arraycopy(iBytes,0,initialHashWithZeros,
ARGON2_PREHASH_DIGEST_LENGTH+4,4);
:System.arraycopy(iBytes,0,initialHashWithOnes,
ARGON2_PREHASH_DIGEST_LENGTH+4,4);
:instance.memory[i*instance.getLaneLength()+0].fromBytes(blockhashBytes);
:blockhashBytes=Functions.blake2bLong(initialHashWithOnes,
ARGON2_BLOCK_SIZE);
:instance.memory[i*instance.getLaneLength()+1].fromBytes(blockhashBytes);
end
start
note right
byte[]getInitialHashLong(byte[]initialHash,
byte[]appendix)
end note
:System.arraycopy(initialHash,0,initialHashLong,
0,ARGON2_PREHASH_DIGEST_LENGTH);
:System.arraycopy(appendix,0,initialHashLong,
ARGON2_PREHASH_DIGEST_LENGTH,4);
:return initialHashLong;;
stop
end
@enduml

