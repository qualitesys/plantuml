@startuml
!pragma layout smetana
start
note right
DotPathgetRacordIn(XRectangle2Drect,XLine2Dtangeante)
end note
if (in.getX()>rect.getMinX()&&in.getX()<rect.getMaxX()) then (yes) 
if (in.getY()<rect.getMinY()) then (yes) 
:inter=new XPoint2D(in.getX(),rect.getMinY());
else (no)
:throw new IllegalArgumentException();;
endif 
else (no)
:inter=LineRectIntersection.getCloser(tangeante.getP1(),
p1,p2,p3,p4);
endif 
:return result.addAfter(curv);;
stop
end
@enduml

