@startuml
!pragma layout smetana
start
note right
XRectangle2Dconvert(Positionablepositionable)
end note
:final XPoint2Dposition=positionable.getPosition();;
:final XDimension2Dsize=positionable.getSize();;
:return new XRectangle2D(position.getX(),
position.getY(),size.getWidth(),size.getHeight());;
stop
end
start
note right
booleanintersect(Positionablebig,Positionablesmall)
end note
:final XRectangle2DbigR=convert(big);;
:final XRectangle2DsmallR=convert(small);;
:return bigR.intersects(smallR);;
stop
end
start
note right
PositionableaddMargin(final Positionablepos,
final doublewidthMargin,final doubleheightMargin)
end note
:return new Positionable(){public XPoint2DgetPosition(){final XPoint2Dp=pos.getPosition();return new XPoint2D(p.getX()-widthMargin,
p.getY()-heightMargin);}public XDimension2DgetSize(){return XDimension2D.delta(pos.getSize(),
2*widthMargin,2*heightMargin);}public void moveSvek(doubledeltaX,
doubledeltaY){pos.moveSvek(deltaX,deltaY);}};;
stop
end
start
note right
XPoint2DgetCenter(Positionablep)
end note
:final XPoint2Dpt=p.getPosition();;
:final XDimension2Ddim=p.getSize();;
:return new XPoint2D(pt.getX()+dim.getWidth()/2,pt.getY()+
dim.getHeight()/2);;
stop
end
start
note right
Positionablemove(Positionablep,doubledeltaX,
doubledeltaY)
end note
:final XPoint2Dpt=p.getPosition();;
:final XDimension2Ddim=p.getSize();;
:return new PositionableImpl(pt.getX()+deltaX,pt.getY()+
deltaY,dim);;
stop
end
start
note right
PositionablemoveAwayFrom(Positionablefixe,
PositionabletoMove)
end note
:final XPoint2DcenterFixe=getCenter(fixe);;
:final XPoint2DcenterToMove=getCenter(toMove);;
:final doubledeltaX=centerToMove.getX()-centerFixe.getX();;
:final doubledeltaY=centerToMove.getY()-centerFixe.getY();;
:doublemin=0.0;;
if (doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,min)==false) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
:doublemax=0.1;;
while (doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,max))
:max=max*2;;
endwhile
:assert doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,min);;
:assert doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,max)==false;;
:final doublecandidat=(min+max)/2.0;;
if (doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,candidat)) then (yes) 
:min=candidat;;
else (no)
:max=candidat;;
endif 
:final doublecandidat=(min+max)/2.0;;
:return move(toMove,deltaX*candidat,deltaY*candidat);;
stop
end
start
note right
booleandoesIntersectWithThisCoef(Positionablefixe,
PositionabletoMove,doubledeltaX,doubledeltaY,
doublec)
end note
:final Positionableresult=move(toMove,deltaX*c,
deltaY*c);;
:return intersect(fixe,result);;
stop
end
@enduml

