@startuml
!pragma layout smetana
start
note right
XRectangle2D convert(Positionable positionable)
end note
:final XPoint2D position=positionable.getPosition();;
:final XDimension2D size=positionable.getSize();;
:return new XRectangle2D(position.getX(),
position.getY(),size.getWidth(),size.getHeight());;
stop
end
start
note right
boolean intersect(Positionable big,Positionable small)
end note
:final XRectangle2D bigR=convert(big);;
:final XRectangle2D smallR=convert(small);;
:return bigR.intersects(smallR);;
stop
end
start
note right
Positionable addMargin(final Positionable pos,
final double widthMargin,final double heightMargin)
end note
:return new Positionable(){public XPoint2D getPosition(){final XPoint2D p=pos.getPosition();return new XPoint2D(p.getX()-widthMargin,
p.getY()-heightMargin);}public XDimension2D getSize(){return XDimension2D.delta(pos.getSize(),
2*widthMargin,2*heightMargin);}public void moveSvek(double deltaX,
double deltaY){pos.moveSvek(deltaX,deltaY);}};;
stop
end
start
note right
XPoint2D getCenter(Positionable p)
end note
:final XPoint2D pt=p.getPosition();;
:final XDimension2D dim=p.getSize();;
:return new XPoint2D(pt.getX()+dim.getWidth()/2,pt.getY()+
dim.getHeight()/2);;
stop
end
start
note right
Positionable move(Positionable p,double deltaX,
double deltaY)
end note
:final XPoint2D pt=p.getPosition();;
:final XDimension2D dim=p.getSize();;
:return new PositionableImpl(pt.getX()+deltaX,pt.getY()+
deltaY,dim);;
stop
end
start
note right
Positionable moveAwayFrom(Positionable fixe,
Positionable toMove)
end note
:final XPoint2D centerFixe=getCenter(fixe);;
:final XPoint2D centerToMove=getCenter(toMove);;
:final double deltaX=centerToMove.getX()-centerFixe.getX();;
:final double deltaY=centerToMove.getY()-centerFixe.getY();;
:double min=0.0;;
if (doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,min)==false) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
:double max=0.1;;
while (doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,max))
:max=max*2;;
endwhile
:assert doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,min);;
:assert doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,max)==false;;
:final double candidat=(min+max)/2.0;;
if (doesIntersectWithThisCoef(fixe,toMove,
deltaX,deltaY,candidat)) then (yes) 
:min=candidat;;
else (no)
:max=candidat;;
endif 
:final double candidat=(min+max)/2.0;;
:return move(toMove,deltaX*candidat,deltaY*candidat);;
stop
end
start
note right
boolean doesIntersectWithThisCoef(Positionable fixe,
Positionable toMove,double deltaX,double deltaY,
double c)
end note
:final Positionable result=move(toMove,deltaX*c,
deltaY*c);;
:return intersect(fixe,result);;
stop
end
@enduml

