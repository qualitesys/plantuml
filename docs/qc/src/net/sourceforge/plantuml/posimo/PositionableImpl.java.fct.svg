eaa8c442b77bb8b0bc]
@startuml
!pragma layout smetana
start
note right
constructor PositionableImpl(doublex,doubley,XDimension2Ddim)
end note
:this.pos=new XPoint2D(x,y);
:this.dim=dim;
end
start
note right
constructor PositionableImpl(XPoint2Dpt,XDimension2Ddim)
end note
:this(pt.getX(),pt.getY(),dim);
end
start
note right
XPoint2DgetPosition()
end note
:return pos;;
stop
end
start
note right
XDimension2DgetSize()
end note
:return dim;;
stop
end
start
note right
void moveSvek(doubledeltaX,doubledeltaY)
end note
:this.pos=this.pos.move(deltaX,deltaY);
end
@enduml

