@startuml
!pragma layout smetana
start
note right
constructor LineSegmentIntersection(XLine2Dsegment,
XLine2DlineB)
end note
if (den==0) then (yes) 
:inter=null ;;
else (no)
if (uA>=0&&uA<=1) then (yes) 
:inter=new XPoint2D(x,y);;
else (no)
:inter=null ;;
endif 
endif 
end
start
note right
XPoint2DgetIntersection()
end note
:return inter;;
stop
end
@enduml

