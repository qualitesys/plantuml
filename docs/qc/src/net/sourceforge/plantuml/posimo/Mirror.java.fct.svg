@startuml
!pragma layout smetana
start
note right
constructor Mirror(doublemax)
end note
:this.max=max;
end
start
note right
doublegetMirrored(doublev)
end note
if (v<0||v>max) then (yes) 
:throw new IllegalArgumentException();;
endif 
:return max-v;;
stop
end
@enduml

