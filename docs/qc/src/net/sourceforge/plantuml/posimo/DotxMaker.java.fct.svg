@startuml
!pragma layout smetana
start
note right
constructor DotxMaker(Clusterroot,Collection<Path>paths)
end note
:this.root=root;
:this.paths=paths;
end
start
note right
StringcreateDotString(String... dotStrings)
end note
:sb.append("digraph unix {");
:sb.append(s);
:sb.append("compound=true;");
:printCluster(sb,root);
:sb.append(getPathString(p)+";");
:sb.append("}");
:return sb.toString();;
stop
end
start
note right
void printCluster(StringBuildersb,Clustercl)
end note
if (cl.getContents().size()==0&&cl.getSubClusters()
.size()==0) then (yes) 
:throw new IllegalStateException(cl.toString());;
endif 
:sb.append("subgraph cluster"+sub.getUid()+
" {");
if (sub.getTitleWidth()>0&&sub.getTitleHeight()>0) then (yes) 
:sb.append("label=<<TABLE FIXEDSIZE=\"TRUE\" WIDTH=\""+
sub.getTitleWidth()+"\" HEIGHT=\""+sub.getTitleHeight()+
"\"><TR><TD></TD></TR></TABLE>>");
endif 
:printCluster(sb,sub);
:sb.append("}");
:sb.append("b"+b.getUid()+getNodeAttibute(b)+
";");
end
start
note right
StringgetPathString(Pathp)
end note
:Objects.requireNonNull(p);
:sb.append(" [dir=none, arrowhead=none, headclip=true,
 tailclip=true");
if (len>=3) then (yes) 
:sb.append(",minlen="+(len-1));
endif 
if (p.getLabel()==null ) then (yes) 
:sb.append("]");
else (no)
:sb.append(", label=<<TABLE FIXEDSIZE=\"TRUE\" WIDTH=\""+
size.getWidth()+"\" HEIGHT=\""+size.getHeight()+
"\"><TR><TD></TD></TR></TABLE>>]");
endif 
if (p.getLength()<=1) then (yes) 
if (samePackage) then (yes) 
:sb.append("{rank=same; b"+p.getStart().getUid()+
"; b"+p.getEnd().getUid()+"}");
else (no)
:Log.println("!!!!!!!!!!!!!!!!!TURNING ARROUND DOT BUG!!!!!!!!!!!!!!!!!!");
endif 
endif 
:return sb.toString();;
stop
end
start
note right
StringgetNodeAttibute(Blockb)
end note
:sb.append("label=\"\",");
:sb.append("fixedsize=true,");
:sb.append("width="+b.getSize().getWidth()/72.0+
",");
:sb.append("height="+b.getSize().getHeight()/72.0+
",");
:sb.append("shape=rect");
:sb.append("]");
:return sb.toString();;
stop
end
@enduml

