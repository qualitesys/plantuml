@startuml
!pragma layout smetana
start
note right
constructor CommandLink()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandLink.class .getName(),
RegexLeaf.start(),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("NAME1","([%pLN_]+)"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("- -"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("NAME2","([%pLN_]+)"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf(";?"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(NwDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.link(name1,name2);;
stop
end
@enduml

