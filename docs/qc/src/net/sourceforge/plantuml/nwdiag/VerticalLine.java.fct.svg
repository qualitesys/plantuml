@startuml
!pragma layout smetana
start
note right
constructor VerticalLine(doubley1,doubley2,
Set<Double>skip)
end note
end
start
note right
void drawU(UGraphicug)
end note
if (step<y1) then (yes) 
endif 
if (step==y2) then (yes) 
else (no)
if (y2>step) then (yes) 
endif 
endif 
if (current>=y2) then (yes) 
endif 
if (drawn==false) then (yes) 
endif 
end
@enduml

