@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return all.toString();;
stop
end
start
note right
void add(Selement)
end note
:while (true){if (grid.isSpaceAvailable(element,x)){all.put(element,x);grid.useSpace(element,x);return ;}x+
+;if (x>100)throw new IllegalStateException();};
end
start
note right
Map<S,Integer>getPositions()
end note
:return Collections.unmodifiableMap(all);;
stop
end
start
note right
intgetNWidth()
end note
:max=Math.max(max,ent.getValue()+ent.getKey()
.getNWidth());;
:return max;;
stop
end
@enduml

