@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return all.toString();;
stop
end
start
note right
void add(Selement)
end note
while (true)
if (grid.isSpaceAvailable(element,x)) then (yes) 
:all.put(element,x);
:grid.useSpace(element,x);
:return ;;
stop
endif 
:x++;
if (x>100) then (yes) 
:throw new IllegalStateException();;
endif 
endwhile
end
start
note right
Map<S,Integer>getPositions()
end note
:return Collections.unmodifiableMap(all);;
stop
end
start
note right
intgetNWidth()
end note
:max=Math.max(max,ent.getValue()+ent.getKey()
.getNWidth());
:return max;;
stop
end
@enduml

