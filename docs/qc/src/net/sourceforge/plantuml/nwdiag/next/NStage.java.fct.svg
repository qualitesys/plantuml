@startuml
!pragma layout smetana
start
note right
constructor NStage(intnumber)
end note
end
start
note right
StringtoString()
end note
:return "S"+number;;
stop
end
start
note right
intcompareTo(NStageother)
end note
:return Integer.compare(this.number,other.number);;
stop
end
start
note right
intgetNumber()
end note
:return number;;
stop
end
start
note right
NStagegetMin(NStagestage1,NStagestage2)
end note
if (stage1.number<stage2.number) then (yes) 
:return stage1;;
stop
endif 
:return stage2;;
stop
end
start
note right
NStagegetMax(NStagestage1,NStagestage2)
end note
if (stage1.number>stage2.number) then (yes) 
:return stage1;;
stop
endif 
:return stage2;;
stop
end
@enduml

