@startuml
!pragma layout smetana
start
note right
void add(NBarbar)
end note
if (this.bars.contains(bar)) then (yes) 
:return ;;
stop
endif 
end
start
note right
NStagegetStart()
end note
:return result;;
stop
end
start
note right
NStagegetEnd()
end note
:return result;;
stop
end
start
note right
intgetNWidth()
end note
:return tetris.getNWidth();;
stop
end
start
note right
Map<NBar,Integer>getPositions()
end note
:return tetris.getPositions();;
stop
end
start
note right
booleancontains(NStagestage)
end note
:return stage.compareTo(getStart())>=0&&stage.compareTo(getEnd())<=0;;
stop
end
@enduml

