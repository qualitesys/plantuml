34,229.5,987.7734,233.5,977.7734,229.5,981.7734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="229.5" x2="229.5" y1="1072.3398" y2="1094.9063"/><polygon fill="#181818" points="225.5,1084.9063,229.5,1094.9063,233.5,1084.9063,229.5,1088.9063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="229.5" x2="229.5" y1="1128.875" y2="1148.875"/><polygon fill="#181818" points="225.5,1138.875,229.5,1148.875,233.5,1138.875,229.5,1142.875" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8938d7f5a1281431972af2566457db15]
@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return start+"->"+end;;
stop
end
start
note right
NBoxgetParent()
end note
:return parent;;
stop
end
start
note right
void setParent(NBoxparent)
end note
end
start
note right
NStagegetStart()
end note
:return start;;
stop
end
start
note right
NStagegetEnd()
end note
:return end;;
stop
end
start
note right
void addStage(NStagestage)
end note
if (start==null &&end==null ) then (yes) 
else (no)
endif 
end
start
note right
intgetNWidth()
end note
:return 1;;
stop
end
start
note right
booleancontains(NStagestage)
end note
:return stage.compareTo(start)>=0&&stage.compareTo(end)<=0;;
stop
end
@enduml

