@startuml
!pragma layout smetana
start
note right
constructor HclDiagramFactory()
end note
:super (DiagramType.HCL);;
end
start
note right
DiagramcreateSystem(UmlSourcesource,Map<String,
String>skinParam)
end note
:try {final HclSourcelist=new HclSource();
:styleExtractor=new StyleExtractor(source.iterator2());
:final Iterator<String>it=styleExtractor.getIterator();
:it.next();while (true){final Stringline=it.next();
:if (it.hasNext()==false)break ;list.add(line);
:}HclParserparser=new HclParser(list);data=parser.parseMe();
:}catch (Exceptione){Logme.error(e);};
:return result;;
stop
end
@enduml

