@startuml
!pragma layout smetana
start
note right
constructor HclDiagramFactory()
end note
:super (DiagramType.HCL);
end
start
note right
DiagramcreateSystem(UmlSourcesource,Map<String,String>skinParam)
end note
:styleExtractor=new StyleExtractor(source.iterator2());
:it.next();
while (true)
if (it.hasNext()==false) then (yes) 
endif 
:list.add(line);
endwhile
:data=parser.parseMe();
:Logme.error(e);
:return result;;
stop
end
@enduml

