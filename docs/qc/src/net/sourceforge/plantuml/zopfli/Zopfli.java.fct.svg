 font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="560.4844">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="351" x="5" y="576.7813">Buffercompress(Optionsoptions,byte[]input)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="593.0781">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="231" x="5" y="609.375">:Bufferoutput=new Buffer();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="293" x="5" y="625.6719">switch (switch (options.outputType))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="641.9688">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="658.2656">Syntax Error?</text><!--MD5=[985626d27c050c5c0b4a48d2f34ad934]
@startuml
!pragma layout smetana
start
note right
int[]makeTable()
end note
:int[]result=new int[256];;
:intc=n;;
if ((c&1)==1) then (yes) 
:c=0xEDB88320^(c>>>1);;
else (no)
:c=c>>>1;;
endif 
:result[n]=c;;
:return result;;
stop
end
start
note right
intcalculate(byte[]input)
end note
:intc=~0;;
:c=table[(c^input[i])&0xFF]^(c>>>8);;
:return ~c;;
stop
end
start
note right
Buffercompress(Optionsoptions,byte[]input)
end note
:Bufferoutput=new Buffer();;
switch (switch (options.outputType))
endswith
:return output;;
stop
end
start
note right
intadler32(byte[]data)
end note
:ints1=1;;
:ints2=1>>16;;
:inti=0;;
while (i<data.length)
:inttick=Math.min(data.length,i+1024);;
while (i<tick)
:s1+=data[i++];;
:s2+=s1;;
endwhile
:s1%=65521;;
:s2%=65521;;
endwhile
:return (s2<<16)|s1;;
stop
end
start
note right
void compressZlib(Optionsoptions,byte[]input,
Bufferoutput)
end note
:output.append((byte)0x78);;
:output.append((byte)0x1E);;
:Deflate.compress(cookie,options,input,output);;
:intchecksum=adler32(input);;
:output.append((byte)((checksum>>24)&0xFF));;
:output.append((byte)((checksum>>16)&0xFF));;
:output.append((byte)((checksum>>8)&0xFF));;
:output.append((byte)(checksum&0xFF));;
end
start
note right
void compressGzip(Optionsoptions,byte[]input,
Bufferoutput)
end note
:output.append((byte)31);;
:output.append((byte)139);;
:output.append((byte)8);;
:output.append((byte)0);;
:output.append((byte)0);;
:output.append((byte)0);;
:output.append((byte)0);;
:output.append((byte)0);;
:output.append((byte)2);;
:output.append((byte)3);;
:Deflate.compress(cookie,options,input,output);;
:intcrc=Crc.calculate(input);;
:output.append((byte)(crc&0xFF));;
:output.append((byte)((crc>>8)&0xFF));;
:output.append((byte)((crc>>16)&0xFF));;
:output.append((byte)((crc>>24)&0xFF));;
:intsize=input.length;;
:output.append((byte)(size&0xFF));;
:output.append((byte)((size>>8)&0xFF));;
:output.append((byte)((size>>16)&0xFF));;
:output.append((byte)((size>>24)&0xFF));;
end
start
note right
constructor Zopfli(intmasterBlockSize)
end note
:cookie=new Cookie(masterBlockSize);;
end
@enduml

