note right
void multithread(final Optionoption,final ErrorStatuserror)
end note
:Log.info("Using several threads: "+option.getNbThreads());
:incTotal(1);
:nb++;
:executor.submit(new Runnable(){public void run(){if (error.hasError()&&option.isFailfastOrFailfast2()){return ;
:}try {manageFileInternal(f,option,error);
:}catch (IOExceptione){Logme.error(e);}catch (InterruptedExceptione){Logme.error(e);
:}incDone(error.hasError());}});
:foundNbFiles(nb);
:executor.shutdown();
:executor.awaitTermination(Long.MAX_VALUE,
TimeUnit.SECONDS);
