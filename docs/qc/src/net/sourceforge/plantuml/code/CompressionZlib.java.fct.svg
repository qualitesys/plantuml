@startuml
!pragma layout smetana
start
note right
byte[]compress(byte[]in)
end note
if (USE_ZOPFLI) then (yes) 
:return new CompressionZopfliZlib().compress(in);;
stop
endif 
if (in.length==0) then (yes) 
:return null ;;
stop
endif 
if (len<1000) then (yes) 
:len=1000;
endif 
:compresser.setInput(in);
:compresser.finish();
if (compresser.finished()==false) then (yes) 
:return null ;;
stop
endif 
:return copyArray(output,compressedDataLength);;
stop
end
start
note right
ByteArraydecompress(byte[]input)
end note
:System.arraycopy(input,0,padded,0,input.length);
:return ByteArray.from(Decompressor.decompress(inputStream));;
stop
:throw new NoPlantumlCompressionException(e);;
end
start
note right
byte[]copyArray(final byte[]data,final intlen)
end note
:System.arraycopy(data,0,result,0,len);
:return result;;
stop
end
