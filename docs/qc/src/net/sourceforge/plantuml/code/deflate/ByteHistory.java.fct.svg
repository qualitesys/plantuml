@startuml
!pragma layout smetana
start
note right
constructor ByteHistory(intsize)
end note
if (size<1) then (yes) 
:throw new IllegalArgumentException("Size must be positive");;
endif 
:data=new byte[size];
:index=0;
end
start
note right
void append(intb)
end note
if (index<0||index>=data.length) then (yes) 
:throw new IllegalStateException();;
endif 
:data[index]=(byte)b;
:index=(index+1)%data.length;
end
start
note right
void copy(intdist,intlen,OutputStreamProtectedout)
end note
:Objects.requireNonNull(out);
if (len<0||dist<1||dist>data.length) then (yes) 
:throw new IllegalArgumentException();;
endif 
if (readIndex<0||readIndex>=data.length) then (yes) 
:throw new IllegalStateException();;
endif 
:i++;
:readIndex=(readIndex+1)%data.length;
:out.write(b);
:append(b);
end
