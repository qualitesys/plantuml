@startuml
!pragma layout smetana
start
note right
byte[]compress(byte[]in)
end note
:deflater.setLevel(9);;
:try {gz.write(in);gz.close();baos.close();
:return baos.toByteArray();}catch (IOExceptione){throw new IllegalStateException(e.toString());};
end
start
note right
ByteArraydecompress(byte[]in)
end note
:try {final ByteArrayOutputStreambaos=new ByteArrayOutputStream();
:final ByteArrayInputStreambais=new ByteArrayInputStream(in);
:final InflaterInputStreamgz=new InflaterInputStream(bais);
:intread;while ((read=gz.read())!=-1){baos.write(read);
:}gz.close();bais.close();baos.close();return ByteArray.from(baos.toByteArray());
:}catch (IOExceptione){throw new NoPlantumlCompressionException(e);};
end
