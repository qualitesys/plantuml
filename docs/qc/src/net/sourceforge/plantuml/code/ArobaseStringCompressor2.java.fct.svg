@startuml
!pragma layout smetana
start
note right
Stringcompress(Stringdata)
end note
:return clean2(data);;
stop
end
start
note right
Stringdecompress(Strings)
end note
:return clean2(s);;
stop
end
start
note right
Stringclean2(Strings)
end note
if (s.startsWith("@start")) then (yes) 
:return s;;
stop
endif 
:return "@startuml\n"+s+"\n@enduml";;
stop
end
@enduml

