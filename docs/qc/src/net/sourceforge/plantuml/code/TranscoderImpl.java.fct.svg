@startuml
!pragma layout smetana
start
note right
constructor TranscoderImpl(URLEncoderurlEncoder,StringCompressorstringCompressor,Compressioncompression,Formatformat)
end note
:this.compression=compression;
:this.urlEncoder=urlEncoder;
:this.stringCompressor=stringCompressor;
:this.format=format;
end
start
note right
Transcoderutf8(URLEncoderurlEncoder,StringCompressorstringCompressor,Compressioncompression)
end note
:return new TranscoderImpl(urlEncoder,stringCompressor,
compression,Format.UTF8);;
stop
end
start
note right
Transcoderupf9(URLEncoderurlEncoder,StringCompressorstringCompressor,Compressioncompression)
end note
:return new TranscoderImpl(urlEncoder,stringCompressor,
compression,Format.UPF9);;
stop
end
start
note right
Stringencode(Stringtext)
end note
if (format==Format.UTF8) then (yes) 
:data=stringAnnoted.getBytes(UTF_8);
else (no)
:data=Upf9Encoder.getBytes(stringAnnoted);
endif 
:return urlEncoder.encode(compressedData);;
stop
end
start
note right
Stringdecode(Stringcode)
end note
:return stringCompressor.decompress(string);;
stop
:throw new NoPlantumlCompressionException(e);;
end
@enduml

