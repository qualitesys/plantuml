@startuml
!pragma layout smetana
start
note right
Argon2argon2(byte[]buffer,byte[]salt)
end note
:argon.hashNow();;
:return argon;;
stop
end
start
note right
StringcomputeArgon2String(byte[]buffer,byte[]salt)
end note
:return argon2(buffer,salt).getOutputString();;
stop
end
start
note right
byte[]computeArgon2bytes(byte[]buffer,byte[]salt)
end note
:return argon2(buffer,salt).getOutput();;
stop
end
start
note right
