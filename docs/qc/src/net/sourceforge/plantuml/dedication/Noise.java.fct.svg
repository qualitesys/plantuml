end note
:result^=b1^b2;;
:return result;;
stop
end
start
note right
void shuffle(byte[]buffer,MTRandomrnd)
end note
:buffer[a]=buffer[b];;
:buffer[b]=tmp;;
end
start
note right
void xor(byte[]buffer,byte[]xor)
end note
:buffer[i]^=xor[i%xor.length];;
end
start
note right
