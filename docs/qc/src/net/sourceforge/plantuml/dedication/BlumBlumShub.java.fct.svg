1" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e923ed744a076ed9709e21dea2585b94]
@startuml
!pragma layout smetana
start
note right
constructor BlumBlumShub(BigIntegerpq,byte[]seed)
end note
:this.pq=pq;
:this.state=new BigInteger(1,seed).mod(pq);
end
start
note right
intnextRnd(intnumBits)
end note
:- -i;
:state=state.modPow(two,pq);
:result=(result<<1)|bit;
:return result;;
stop
end
@enduml

