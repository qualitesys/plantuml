!pragma layout smetana
start
note right
constructor RBlocks()
end note
end
start
note right
StringtoString()
end note
:sb.append(all.size());
:sb.append(" - ");
:sb.append(block.toString());
:return sb.toString();;
stop
end
start
note right
RBlocksreadFrom(byte[]fileContent,intsize)
end note
while (start<fileContent.length)
:start+=size;
:result.all.add(block);
endwhile
:return result;;
stop
end
start
note right
RBlockschange(BigIntegerE,BigIntegerN)
end note
:result.all.add(rsa.change(E,N));
:return result;;
stop
end
start
note right
void writeTo(Pathout,intsize)
end note
:writeTo(new FileOutputStream(out.toFile()),
size);
end
start
note right
byte[]toByteArray(intsize)
end note
:i++;
:System.arraycopy(tmp,0,result,i*size,tmp.length);
:return result;;
stop
end
