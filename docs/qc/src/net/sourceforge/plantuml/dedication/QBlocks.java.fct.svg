@startuml
!pragma layout smetana
start
note right
constructor QBlocks()
end note
end
start
note right
QBlocksreadFrom(InputStreamsource,intsize)
end note
while (true)
if (block==null ) then (yes) 
:return result;;
stop
endif 
:result.all.add(block);
endwhile
end
start
note right
QBlockschange(BigIntegerE,BigIntegerN)
end note
:result.all.add(rsa.change(E,N));
:return result;;
stop
end
start
note right
void writeTo(OutputStreamos,intsize)
end note
:rsa.write(os,size);
end
@enduml

