@startuml
!pragma layout smetana
start
note right
constructor PSystemDedication(UmlSourcesource,BufferedImageimg)
end note
:super (source);
:this.img=Objects.requireNonNull(img);
end
start
note right
UDrawablegetRootDrawable(FileFormatOptionfileFormatOption)
end note
:return new UDrawable(){public void drawU(UGraphicug){ug.draw(new UImage(new PixelImage(img,AffineTransformType.TYPE_BILINEAR)));}};;
stop
end
start
note right
BufferedImagegetBufferedImage(InputStreamis)
end note
:decodeFrame.invoke(vp8Decoder,iis);
:iis.close();
:return (BufferedImage)frame.getClass().getMethod("getBufferedImage").invoke(frame);;
stop
:Logme.error(e);
:return null ;;
stop
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(Dedication)");;
stop
end
@enduml

