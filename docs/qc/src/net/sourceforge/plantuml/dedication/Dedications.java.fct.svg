@startuml
!pragma layout smetana
start
note right
DedicationCryptedsecret(inttiny,Stringsig,
BigIntegerpq)
end note
:return new DedicationCrypted(load(sig),tiny,
sig,pq);;
stop
end
start
note right
byte[]load(Stringname)
end note
:return baos.toByteArray();;
stop
end
start
note right
constructor Dedications()
end note
end
start
note right
BufferedImageget(Stringline)
end note
if (image!=null ) then (yes) 
:return image;;
stop
endif 
:return null ;;
stop
end
@enduml

