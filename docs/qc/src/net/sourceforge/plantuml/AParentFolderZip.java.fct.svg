@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "AParentFolderZip::"+zipFile+" "+
parent;;
stop
end
start
note right
constructor AParentFolderZip(SFilezipFile,
Stringentry)
end note
if (idx==-1) then (yes) 
else (no)
endif 
end
start
note right
AFilegetAFile(StringnameOrPath)
end note
:return new AFileZipEntry(zipFile,merge(parent+
nameOrPath));;
stop
end
start
note right
Stringmerge(Stringfull)
end note
while (true)
if (full.length()==len) then (yes) 
:return full;;
stop
endif 
endwhile
end
@enduml

