@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "AParentFolderZip::"+zipFile+" "+parent;;
stop
end
start
note right
constructor AParentFolderZip(SFilezipFile,
Stringentry)
end note
:this.zipFile=zipFile;
if (idx==-1) then (yes) 
:parent="";
else (no)
:parent=entry.substring(0,idx+1);
endif 
end
start
note right
AFilegetAFile(StringnameOrPath)
end note
:return new AFileZipEntry(zipFile,merge(parent+nameOrPath));;
stop
end
start
note right
Stringmerge(Stringfull)
end note
while (true)
:full=full.replaceFirst("[^/]+/\\.\\./","");
if (full.length()==len) then (yes) 
:return full;;
stop
endif 
endwhile
end
@enduml

