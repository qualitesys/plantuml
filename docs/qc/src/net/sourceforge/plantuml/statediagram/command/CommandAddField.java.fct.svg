@startuml
!pragma layout smetana
start
note right
constructor CommandAddField()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandAddField.class .getName(),
RegexLeaf.start(),new RegexOr(new RegexLeaf("CODE3",
"([%pLN_.]+)"),new RegexLeaf("CODE4","[%g]([^%g]+)[%g]")),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf(":"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("FIELD",
"(.*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(StateDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (diagram.V1972()) then (yes) 
if (ident.parent().getLast().equals(codeString)) then (yes) 
:ident=ident.parent();
endif 
endif 
:entity.getBodier().addFieldOrMethod(field);
:return CommandExecutionResult.ok();;
stop
end
@enduml

