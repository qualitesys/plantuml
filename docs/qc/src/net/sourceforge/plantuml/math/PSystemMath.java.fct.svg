!pragma layout smetana
start
note right
constructor PSystemMath(UmlSourcesource)
end note
:super (source);;
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(Math)");;
stop
end
start
note right
ImageDataexportDiagramNow(OutputStreamos,
intnum,FileFormatOptionfileFormat)
end note
:return asciiMath.export(os,fileFormat,scale,
color,backColor);;
stop
end
start
note right
void doCommandLine(Stringline)
end note
if (lineLower.startsWith(colorParam)) then (yes) 
if (col3!=null ) then (yes) 
:color=col3;;
endif 
else (no)
:this.math=line;;
endif 
end
start
note right
ColorgetColor(final Stringcol)
end note
:return col3;;
stop
end
