@startuml
!pragma layout smetana
start
note right
constructor ConverterSvg(Iconicon)
end note
:this.icon=icon;
end
:registerAlphabet.invoke(null ,Class.forName("org.scilab.forge.jlatexmath.cyrillic.CyrillicRegistration").newInstance());
:registerAlphabet.invoke(null ,Class.forName("org.scilab.forge.jlatexmath.greek.GreekRegistration").newInstance());
:Logme.error(e);
start
note right
StringgetSvg(doublescale,booleanfontAsShapes,ColorbackgroundColor)
end note
:dimension=new Dimension(icon.getIconWidth(),
icon.getIconHeight());
:g2.getClass().getMethod("setSVGCanvasSize",
Dimension.class ).invoke(g2,dimension);
if (backgroundColor!=null ) then (yes) 
:g2.setColor(backgroundColor);
:g2.fillRect(0,0,icon.getIconWidth(),icon.getIconHeight());
endif 
:icon.paintIcon(null ,g2,0,0);
:g2.getClass().getMethod("stream",Writer.class ,
boolean.class ).invoke(g2,out,useCSS);
:out.flush();
:out.close();
:return out.toString();;
stop
end
start
note right
XDimension2DgetDimension()
end note
:return XDimension2D.fromDimension(dimension);;
stop
end
