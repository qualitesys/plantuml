@startuml
!pragma layout smetana
start
note right
constructor AsciiMath(Stringform)
end note
:this.tex=new ASCIIMathTeXImg().getTeX(form);
:this.builder=new LatexBuilder(tex);
end
start
note right
XDimension2DgetDimension()
end note
:return builder.getDimension();;
stop
end
start
note right
UImageSvggetSvg(doublescale,ColorforegroundColor,
ColorbackgroundColor)
end note
:return builder.getSvg(scale,foregroundColor,
backgroundColor);;
stop
end
start
note right
MutableImagegetImage(ColorforegroundColor,
ColorbackgroundColor)
end note
:return builder.getImage(foregroundColor,
backgroundColor);;
stop
end
start
note right
StringgetSource()
end note
:return tex;;
stop
end
@enduml

