@startuml
!pragma layout smetana
start
note right
constructor CucaDiagramXmiMaker(CucaDiagramdiagram,
FileFormatfileFormat)
end note
:this.diagram=diagram;;
:this.fileFormat=fileFormat;;
end
start
note right
StringgetModel(UmlDiagramclassDiagram)
end note
:return "model1";;
stop
end
start
note right
void createFiles(OutputStreamfos)
end note
:try {final XmlDiagramTransformerxmi;if (diagram instanceof StateDiagram)xmi=new XmiStateDiagram((StateDiagram)diagram);
:else if (diagram instanceof DescriptionDiagram)xmi=new XmiDescriptionDiagram((DescriptionDiagram)diagram);
:else if (fileFormat==FileFormat.XMI_STANDARD)xmi=new XmiClassDiagramStandard((ClassDiagram)diagram);
:else if (fileFormat==FileFormat.XMI_ARGO)xmi=new XmiClassDiagramArgo((ClassDiagram)diagram);
:else if (fileFormat==FileFormat.XMI_STAR)xmi=new XmiClassDiagramStar((ClassDiagram)diagram);
:else throw new UnsupportedOperationException();
:xmi.transformerXml(fos);}catch (ParserConfigurationExceptione){Log.error(e.toString());
:Logme.error(e);throw new IOException(e.toString());
:}catch (TransformerExceptione){Log.error(e.toString());
:Logme.error(e);throw new IOException(e.toString());};
end
@enduml

