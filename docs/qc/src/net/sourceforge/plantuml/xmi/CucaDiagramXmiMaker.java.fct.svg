@startuml
!pragma layout smetana
start
note right
constructor CucaDiagramXmiMaker(CucaDiagramdiagram,
FileFormatfileFormat)
end note
:this.diagram=diagram;
:this.fileFormat=fileFormat;
end
start
note right
StringgetModel(UmlDiagramclassDiagram)
end note
:return "model1";;
stop
end
start
note right
void createFiles(OutputStreamfos)
end note
if (diagram instanceof StateDiagram) then (yes) 
:xmi=new XmiStateDiagram((StateDiagram)diagram);
else (no)
:throw new UnsupportedOperationException();;
endif 
:xmi.transformerXml(fos);
:Log.error(e.toString());
:Logme.error(e);
:throw new IOException(e.toString());;
:Log.error(e.toString());
:Logme.error(e);
:throw new IOException(e.toString());;
end
@enduml

