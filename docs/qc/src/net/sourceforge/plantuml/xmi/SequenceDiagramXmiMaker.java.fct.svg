@startuml
!pragma layout smetana
start
note right
constructor SequenceDiagramXmiMaker(SequenceDiagramsequenceDiagram,
FileFormatfileFormat)
end note
:this.diagram=sequenceDiagram;
:this.fileFormat=fileFormat;
end
start
note right
ImageDatacreateOne(OutputStreamos,intindex,
booleanisWithMetadata)
end note
:builder=XmlFactories.newDocumentBuilder();
:Logme.error(e);
:return imageData;;
stop
:document.setXmlVersion("1.0");
:document.setXmlStandalone(true);
if (fileFormat==FileFormat.XMI_ARGO) then (yes) 
:xmi=new XmiSequenceDiagramArgo(diagram,document);
else (no)
:xmi=new XmiSequenceDiagramStandard(diagram,
document);
endif 
:xmi.build();
:writeDocument(document,os);
:Logme.error(e);
:return imageData;;
stop
end
start
note right
intgetNbPages()
end note
:return 1;;
stop
end
start
note right
void writeDocument(Documentdocument,OutputStreamos)
end note
:transformer.setOutputProperty(OutputKeys.INDENT,
"yes");
:transformer.setOutputProperty(OutputKeys.ENCODING,
UTF_8.name());
:transformer.transform(source,resultat);
end
@enduml

