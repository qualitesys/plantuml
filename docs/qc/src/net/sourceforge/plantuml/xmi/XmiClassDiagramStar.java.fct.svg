@startuml
!pragma layout smetana
start
note right
constructor XmiClassDiagramStar(ClassDiagramclassDiagram)
end note
:super (classDiagram);
if (cla==null ) then (yes) 
endif 
:ownedElement.appendChild(cla);
:done.add(ent);
:addLink(link);
end
start
note right
void addLink(Linklink)
end note
if (link.isHidden()||link.isInvis()) then (yes) 
:return ;;
stop
endif 
if (link.getType().getDecor1()==LinkDecor.EXTENDS||link.getType()
.getDecor2()==LinkDecor.EXTENDS) then (yes) 
:addExtension(link,assId);
:return ;;
stop
endif 
:association.setAttribute("xmi.id",assId);
:association.setAttribute("namespace",CucaDiagramXmiMaker.getModel(classDiagram));
if (Display.isNull(link.getLabel())==false) then (yes) 
:association.setAttribute("name",forXMI(link.getLabel()));
endif 
:end1.setAttribute("xmi.id","end"+classDiagram.getUniqueSequence());
:end1.setAttribute("association",assId);
:end1.setAttribute("type",link.getEntity1()
.getUid());
if (link.getQuantifier1()!=null ) then (yes) 
:end1.setAttribute("name",forXMI(link.getQuantifier1()));
endif 
if (link.getType().getDecor2()==LinkDecor.COMPOSITION) then (yes) 
:end1.setAttribute("aggregation","composite");
endif 
if (link.getType().getDecor2()==LinkDecor.AGREGATION) then (yes) 
:end1.setAttribute("aggregation","aggregate");
endif 
:end1.appendChild(endparticipant1);
:connection.appendChild(end1);
:end2.setAttribute("xmi.id","end"+classDiagram.getUniqueSequence());
:end2.setAttribute("association",assId);
:end2.setAttribute("type",link.getEntity2()
.getUid());
if (link.getQuantifier2()!=null ) then (yes) 
:end2.setAttribute("name",forXMI(link.getQuantifier2()));
endif 
if (link.getType().getDecor1()==LinkDecor.COMPOSITION) then (yes) 
:end2.setAttribute("aggregation","composite");
endif 
if (link.getType().getDecor1()==LinkDecor.AGREGATION) then (yes) 
:end2.setAttribute("aggregation","aggregate");
endif 
:end2.appendChild(endparticipant2);
:connection.appendChild(end2);
:association.appendChild(connection);
:ownedElement.appendChild(association);
end
start
note right
void addExtension(Linklink,StringassId)
end note
:association.setAttribute("xmi.id",assId);
:association.setAttribute("namespace",CucaDiagramXmiMaker.getModel(classDiagram));
if (link.getLabel()!=null ) then (yes) 
:association.setAttribute("name",forXMI(link.getLabel()));
endif 
if (link.getType().getDecor1()==LinkDecor.EXTENDS) then (yes) 
:association.setAttribute("child",link.getEntity1()
.getUid());
:association.setAttribute("parent",link.getEntity2()
.getUid());
else (no)
:throw new IllegalStateException();;
endif 
:ownedElement.appendChild(association);
end
@enduml

