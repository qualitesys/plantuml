@startuml
!pragma layout smetana
start
note right
void build()
end note
end
start
note right
constructor XmiSequenceDiagram(SequenceDiagramdiagram,Documentdocument)
end note
:super ();
:this.diagram=diagram;
:this.document=document;
end
start
note right
ElementcreateElement(Stringtag,String[][]attributes)
end note
:return setAttributes(document.createElement(tag),
attributes);;
stop
end
start
note right
ElementsetAttribute(Elementelement,Stringname,Stringvalue)
end note
:element.setAttribute(name,value);
:return element;;
stop
end
start
note right
ElementsetAttributes(Elementelement,String[][]attributes)
end note
:element.setAttribute(attr[0],attr[1]);
:return element;;
stop
end
start
note right
StringgetDisplayString(Displaydisplay)
end note
:return String.join("\n",display.asList());;
stop
end
start
note right
StringgetXmiId(Stringtag,Objectobject)
end note
:return Integer.toHexString(tag.hashCode())+
"_"+Integer.toHexString(object.hashCode());;
stop
end
@enduml

