@startuml
!pragma layout smetana
start
note right
constructor GraphmlDescriptionDiagram(DescriptionDiagramdiagram)
end note
:this.diagram=diagram;;
:this.document=builder.newDocument();;
:document.setXmlVersion("1.0");;
:document.setXmlStandalone(true);;
:graphml.setAttribute("xmlns","http://graphml.graphdrawing.org/xmlns");;
:graphml.setAttribute("xmlns:xsi","http://www.w3.org/2001/XMLSchema-instance");;
:graphml.setAttribute("xsi:schemaLocation",
"http://graphml.graphdrawing.org/xmlns/1.0/graphml.xsd");;
:document.appendChild(graphml);;
:graph.setAttribute("edgedefault","undirected");;
:graphml.appendChild(graph);;
if (ent.getParentContainer() instanceof GroupRoot) then (yes) 
:addElement(ent,graph);;
endif 
end
start
note right
void addElement(IEntitytobeAdded,Elementcontainer)
end note
:container.appendChild(element);;
end
start
note right
ElementcreateEntityNode(IEntityentity)
end note
:cla.setAttribute("id",entity.getCode().getName());;
:return cla;;
stop
end
start
note right
void transformerXml(OutputStreamos)
end note
:transformer.setOutputProperty(OutputKeys.INDENT,
"yes");;
:transformer.setOutputProperty(OutputKeys.ENCODING,
UTF_8.name());;
:transformer.transform(source,resultat);;
end
@enduml

