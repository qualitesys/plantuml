@startuml
!pragma layout smetana
start
note right
constructor CommandMove()
end note
:super (false,getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandMove.class .getName(),
RegexLeaf.start(),new RegexLeaf("INDENT",
"([\\s\\t]*)"),new RegexLeaf("move"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("\\("),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("X","(-?\\d+)"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf(","),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("Y","(-?\\d+)"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("\\)"),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(WireDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.wmove(indent,x,y);;
stop
end
@enduml

