@startuml
!pragma layout smetana
start
note right
constructor WLinkHorizontal(ISkinParamskinParam,
UTranslatestart,doubledestination,WLinkTypetype,
WArrowDirectiondirection,HColorcolor,Displaylabel)
end note
:this.start=start;;
:this.destination=destination;;
:this.skinParam=skinParam;;
:this.direction=direction;;
:this.type=type;;
:this.label=label;;
:this.color=color==null ? getBlack():color;;
end
start
note right
HColorgetBlack()
end note
:return HColors.BLACK.withDark(HColors.WHITE);;
stop
end
start
note right
HColorgetWhite()
end note
:return HColors.WHITE.withDark(HColors.BLACK);;
stop
end
start
note right
TextBlockgetTextBlock()
end note
:final FontConfigurationfontConfiguration=FontConfiguration.blackBlueTrue(UFont.sansSerif(10))
.changeColor(color);;
:return label.create(fontConfiguration,HorizontalAlignment.LEFT,
skinParam);;
stop
end
start
note right
void drawMe(UGraphicug)
end note
:ug=ug.apply(color);;
:final TextBlocktextBlock=getTextBlock();;
:final XDimension2DdimText=textBlock.calculateDimension(ug.getStringBounder());;
:UGraphicugText=ug.apply(start);;
:final doublelen=destination-start.getDx();;
if (type==WLinkType.NORMAL) then (yes) 
:ug=ug.apply(color.bg());;
:drawNormalArrow(ug);;
:ugText=ugText.apply(UTranslate.dy(-dimText.getHeight()/2));;
else if (type==WLinkType.BUS) then (yes) 
:ug=ug.apply(getWhite().bg());;
:drawBusArrow(ug);;
:ugText=ugText.apply(UTranslate.dy((20-dimText.getHeight())/2-5));;
endif 
if (dimText.getHeight()>0) then (yes) 
switch (switch (direction))
endswith
if (type==WLinkType.NORMAL) then (yes) 
:ugText.apply(getWhite()).apply(getWhite()
.bg()).draw(new URectangle(dimText));;
endif 
:textBlock.drawU(ugText);;
endif 
end
start
note right
void drawBusArrow(UGraphicug)
end note
:final doubledx=destination-start.getDx()-2;;
:final UPathpath=new UPath();;
if (direction==WArrowDirection.NONE) then (yes) 
:path.moveTo(0,0);;
:path.lineTo(dx,0);;
:path.lineTo(dx,10);;
:path.lineTo(0,10);;
:path.lineTo(0,0);;
:path.closePath();;
:ug.apply(start.compose(UTranslate.dx(1)))
.draw(path);;
endif 
if (direction==WArrowDirection.NORMAL) then (yes) 
:path.moveTo(0,0);;
:path.lineTo(dx-15,0);;
:path.lineTo(dx-15,-5);;
:path.lineTo(dx,5);;
:path.lineTo(dx-15,15);;
:path.lineTo(dx-15,10);;
:path.lineTo(0,10);;
:path.lineTo(0,0);;
:path.closePath();;
:ug.apply(start.compose(UTranslate.dx(1)))
.draw(path);;
endif 
if (direction==WArrowDirection.BOTH) then (yes) 
:path.moveTo(0,5);;
:path.lineTo(15,-5);;
:path.lineTo(15,0);;
:path.lineTo(dx-15,0);;
:path.lineTo(dx-15,-5);;
:path.lineTo(dx,5);;
:path.lineTo(dx-15,15);;
:path.lineTo(dx-15,10);;
:path.lineTo(15,10);;
:path.lineTo(15,15);;
:path.lineTo(0,5);;
:path.closePath();;
:ug.apply(start.compose(UTranslate.dx(1)))
.draw(path);;
endif 
if (direction==WArrowDirection.REVERSE) then (yes) 
:path.moveTo(0,5);;
:path.lineTo(15,-5);;
:path.lineTo(15,0);;
:path.lineTo(dx,0);;
:path.lineTo(dx,10);;
:path.lineTo(15,10);;
:path.lineTo(15,15);;
:path.lineTo(0,5);;
:path.closePath();;
:ug.apply(start.compose(UTranslate.dx(1)))
.draw(path);;
endif 
end
start
note right
void drawNormalArrow(UGraphicug)
end note
:final doubledx=destination-start.getDx()-2;;
if (direction==WArrowDirection.BOTH||direction==WArrowDirection.NORMAL) then (yes) 
:final UPathpath=new UPath();;
:path.moveTo(0,0);;
:path.lineTo(-5,-5);;
:path.lineTo(-5,5);;
:path.lineTo(0,0);;
:path.closePath();;
:ug.apply(start.compose(UTranslate.dx(dx)))
.draw(path);;
endif 
if (direction==WArrowDirection.BOTH||direction==WArrowDirection.REVERSE) then (yes) 
:final UPathpath=new UPath();;
:path.moveTo(0,0);;
:path.lineTo(5,-5);;
:path.lineTo(5,5);;
:path.lineTo(0,0);;
:path.closePath();;
:ug.apply(start.compose(UTranslate.dx(1)))
.draw(path);;
endif 
:ug.apply(start.compose(UTranslate.dx(1)))
.draw(ULine.hline(dx));;
end
@enduml

