t-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="226" x="5" y="560.4844">:this.skinParam=skinParam;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="174" x="5" y="576.7813">:this.display=display;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="200" x="5" y="593.0781">:this.fixedDim=fixedDim;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="609.375">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="625.6719">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="641.9688">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="296" x="5" y="658.2656">List&lt;String&gt;getPins(Positionposition)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="674.5625">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="201" x="5" y="690.8594">switch (switch (position))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="707.1563">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="723.4531">Syntax Error?</text><!--MD5=[04ae1ca3e45d6864a3d0c4975a631546]
@startuml
!pragma layout smetana
start
note right
constructor Pos(doublex,doubley)
end note
:this.x=x;;
:this.y=y;;
end
start
note right
UGraphicmove(UGraphicug)
end note
:return ug.apply(new UTranslate(x,y));;
stop
end
start
note right
constructor Block(ISkinParamskinParam)
end note
:this(skinParam,Display.empty(),null );;
end
start
note right
constructor Block(ISkinParamskinParam,Displaydisplay,
XDimension2DfixedDim)
end note
:this.skinParam=skinParam;;
:this.display=display;;
:this.fixedDim=fixedDim;;
end
start
note right
List<String>getPins(Positionposition)
end note
switch (switch (position))
endswith
:throw new IllegalArgumentException();;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
if (fixedDim==null ) then (yes) 
:return minMax.getDimension();;
stop
endif 
:return fixedDim;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(getBlack());;
if (children.size()==0) then (yes) 
:final TextBlocklabel=display.create(FontConfiguration.create(skinParam,
FontParam.COMPONENT,null ),HorizontalAlignment.CENTER,
skinParam);;
:label.drawU(ug.apply(new UTranslate(10,10)));;
else (no)
:ent.getKey().drawU(ent.getValue().move(ug));;
endif 
:ug.draw(new URectangle(calculateDimension(ug.getStringBounder())));;
:drawPins(Position.BOTTOM,ug);;
:drawPins(Position.TOP,ug);;
:drawPins(Position.LEFT,ug);;
:drawPins(Position.RIGHT,ug);;
end
start
note right
HColorgetBlack()
end note
:return HColors.BLACK.withDark(HColors.WHITE);;
stop
end
start
note right
void drawPins(Positionpos,UGraphicug)
end note
:doublepx=-2;;
:doublepy=10;;
if (pos==Position.RIGHT) then (yes) 
:px=calculateDimension(ug.getStringBounder())
.getWidth()-2;;
endif 
if (pos==Position.TOP) then (yes) 
:px=10;;
:py=-2;;
endif 
if (pos==Position.BOTTOM) then (yes) 
:px=10;;
:py=calculateDimension(ug.getStringBounder())
.getHeight()-2;;
endif 
:ug.apply(new UTranslate(px,py)).draw(new UEllipse(4,
4));;
if (pos==Position.LEFT||pos==Position.RIGHT) then (yes) 
:py+=15;;
else (no)
:px+=15;;
endif 
end
start
note right
BlockcomponentEnd()
end note
:parent.minMax=parent.minMax.addPoint(parent.x+
this.minMax.getMaxX()+10,parent.y+this.minMax.getMaxY()+
10);;
:parent.x+=this.minMax.getMaxX()+10;;
:return parent;;
stop
end
start
note right
BlockaddNewBlock(Stringname,intwidth,intheight)
end note
:final XDimension2Ddim=new XDimension2D(width,
height);;
:final Blockchild=new Block(skinParam,Display.create(name),
dim);;
:children.put(child,new Pos(x,y));;
:y+=dim.getHeight()+10;;
:minMax=minMax.addPoint(x+dim.getWidth()+
10,y);;
:return child;;
stop
end
start
note right
BlockcreateContainer(Stringname)
end note
:final Blockresult=new Block(skinParam);;
:result.parent=this;;
:children.put(result,new Pos(x,y));;
:return result;;
stop
end
start
note right
void vspace(intvspace)
end note
:y+=vspace-10;;
:minMax=minMax.addPoint(x,y);;
end
start
note right
void newColumn()
end note
:this.x=minMax.getMaxX();;
:this.y=10;;
end
start
note right
void addPin(Positionposition,Stringpin)
end note
:getPins(position).add(pin);;
end
@enduml

