@startuml
!pragma layout smetana
start
note right
constructor CommandWLink()
end note
:super (false,getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandWLink.class .getName(),
RegexLeaf.start(),new RegexLeaf("NAME1","([\\w][.\\w]*)"),
new RegexOptional(new RegexConcat(new RegexLeaf("\\("),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("X1",
