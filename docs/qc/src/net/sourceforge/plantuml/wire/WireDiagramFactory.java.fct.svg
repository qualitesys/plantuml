@startuml
!pragma layout smetana
start
note right
constructor WireDiagramFactory()
end note
:super (DiagramType.WIRE);
end
start
note right
List<Command>createCommands()
end note
:CommonCommands.addCommonCommands1(cmds);
:cmds.add(new CommandComponent());
:cmds.add(new CommandSpot());
:cmds.add(new CommandGoto());
:cmds.add(new CommandMove());
:cmds.add(new CommandWLink());
:cmds.add(new CommandNewColumn());
:cmds.add(new CommandPrint());
:return cmds;;
stop
end
start
note right
WireDiagramcreateEmptyDiagram(UmlSourcesource,Map<String,String>skinParam)
end note
:return new WireDiagram(source);;
stop
end
@enduml

