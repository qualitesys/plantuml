@startuml
!pragma layout smetana
start
note right
WLinkTypefrom(Stringarg)
end note
if (arg.contains("-")) then (yes) 
:return WLinkType.NORMAL;;
stop
endif 
if (arg.contains("=")) then (yes) 
:return WLinkType.BUS;;
stop
endif 
:throw new IllegalArgumentException();;
stop
end
start
note right
doublespaceForNext()
end note
switch (switch (this))
endswith
:throw new IllegalArgumentException();;
stop
end
@enduml

