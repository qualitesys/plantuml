on fill="#181818" points="199.5,615.6172,203.5,625.6172,207.5,615.6172,203.5,619.6172" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="59" x="203.5" y="605.6206">case BUS:</text><line style="stroke:#181818;stroke-width:1.0;" x1="141" x2="141" y1="543.4414" y2="566.0078"/><polygon fill="#181818" points="137,556.0078,141,566.0078,145,556.0078,141,560.0078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="141" x2="141" y1="745.5547" y2="765.5547"/><polygon fill="#181818" points="137,755.5547,141,765.5547,145,755.5547,141,759.5547" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[87bf68360a597d4194d82c713f8ce61c]
@startuml
!pragma layout smetana
start
note right
WLinkType from(String arg)
end note
if (arg.contains("-")) then (yes) 
:return WLinkType.NORMAL;;
stop
endif 
if (arg.contains("=")) then (yes) 
:return WLinkType.BUS;;
stop
endif 
:throw new IllegalArgumentException();;
stop
end
start
note right
double spaceForNext()
end note
switch (switch this)
case (case NORMAL:) 
:return 15;;
stop
case (case BUS:) 
:return 25;;
stop
endswitch
:throw new IllegalArgumentException();;
stop
end
@enduml

