@startuml
!pragma layout smetana
start
note right
WLinkTypefrom(Stringarg)
end note
if (arg.contains("-")) then (yes) 
:return WLinkType.NORMAL;;
stop
endif 
if (arg.contains("=")) then (yes) 
:return WLinkType.BUS;;
stop
endif 
:throw new IllegalArgumentException();;
stop
end
start
note right
doublespaceForNext()
end note
:switch (this){case NORMAL:return 15;case BUS:return 25;};
:throw new IllegalArgumentException();;
stop
end
@enduml

