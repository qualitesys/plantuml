@startuml
!pragma layout smetana
start
note right
constructor CommandNewColumn()
end note
:super (false,getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandNewColumn.class .getName(),
RegexLeaf.start(),new RegexLeaf("INDENT",
"([\\s\\t]*)"),new RegexLeaf("-+"),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(WireDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.newColumn(indent);;
stop
end
@enduml

