@startuml
!pragma layout smetana
start
note right
constructor ColorAndSizeChange(Strings)
end note
if (matcherColor.find()) then (yes) 
else (no)
endif 
if (matcherSize.find()) then (yes) 
else (no)
endif 
end
start
note right
HColorgetColor()
end note
:return color;;
stop
end
start
note right
IntegergetSize()
end note
:return size;;
stop
end
start
note right
FontConfigurationapply(FontConfigurationinitial)
end note
if (color!=null ) then (yes) 
endif 
if (size!=null ) then (yes) 
endif 
:return result;;
stop
end
@enduml

