@startuml
!pragma layout smetana
start
note right
constructor ColorAndSizeChange(Strings)
end note
if (matcherColor.find()) then (yes) 
:color=HColorSet.instance().getColorOrWhite(s1);;
else (no)
:color=null ;;
endif 
if (matcherSize.find()) then (yes) 
:size=Integer.valueOf(matcherSize.group(1));;
else (no)
:size=null ;;
endif 
end
start
note right
HColorgetColor()
end note
:return color;;
stop
end
start
note right
IntegergetSize()
end note
:return size;;
stop
end
start
note right
FontConfigurationapply(FontConfigurationinitial)
end note
if (color!=null ) then (yes) 
:result=result.changeColor(color);;
endif 
if (size!=null ) then (yes) 
:result=result.changeSize(size);;
endif 
:return result;;
stop
end
@enduml

