@startuml
!pragma layout smetana
start
note right
constructor BigFrame(final TextBlocktitle,
final doublewidth,final doubleheight,final SymbolContextsymbolContext)
end note
end
start
note right
doublegetYpos(XDimension2DdimTitle)
end note
if (dimTitle.getWidth()==0) then (yes) 
:return 12;;
stop
endif 
:return dimTitle.getHeight()+3;;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (dimTitle.getWidth()==0) then (yes) 
else (no)
endif 
if (widthFull-widthTitle<25) then (yes) 
else (no)
endif 
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(width,height);;
stop
end
@enduml

