9,233.5,561.2109,237.5,551.2109,233.5,555.2109" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="233.5" x2="233.5" y1="609.1484" y2="629.1484"/><polygon fill="#181818" points="229.5,619.1484,233.5,629.1484,237.5,619.1484,233.5,623.1484" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="233.5" x2="233.5" y1="663.1172" y2="683.1172"/><polygon fill="#181818" points="229.5,673.1172,233.5,683.1172,237.5,673.1172,233.5,677.1172" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[33fc7f449ab4a5717fbc2a5e9793bc1e]
@startuml
!pragma layout smetana
start
note right
constructor TextBlockGeneric(TextBlocktextBlock,HColorbackground,HColorborder)
end note
:this.textBlock=textBlock;
:this.border=border;
:this.background=background;
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return dim;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(background.bg());
:ug=ug.apply(border);
:ug.apply(new UStroke(2,2,1)).draw(new URectangle(dim.getWidth(),
dim.getHeight()));
:textBlock.drawU(ug);
end
@enduml

