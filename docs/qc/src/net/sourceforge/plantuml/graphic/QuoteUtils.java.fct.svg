@startuml
!pragma layout smetana
start
note right
constructor QuoteUtils()
end note
end
start
note right
StringgetSomeQuote()
end note
if (tmp.size()==0) then (yes) 
:tmp.addAll(quotes);
:Collections.shuffle(tmp);
endif 
:tmp.remove(size-1);
:return result;;
stop
end
@enduml

