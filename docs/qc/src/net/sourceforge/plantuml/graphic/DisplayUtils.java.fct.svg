@startuml
!pragma layout smetana
start
note right
DisplaybreakLines(Displaytexts,FontConfigurationfontConfiguration,SpriteContainerspriteContainer,doublemaxWidth)
end note
if (texts.size()!=1) then (yes) 
:return texts;;
stop
endif 
:result=result.add(s.subSequence(0,nb));
:result=result.add(s.subSequence(nb+1,s.length()));
:return result;;
stop
end
@enduml

