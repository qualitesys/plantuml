oke-width:1.0;"/><!--MD5=[a3a3eccf2c0e80070128b2271d1d2960]
@startuml
!pragma layout smetana
start
note right
constructor UGraphicInterceptorUDrawable(UGraphicug)
end note
:super (ug);;
end
start
note right
void draw(UShapeshape)
end note
if (shape instanceof UDrawable) then (yes) 
:drawable.drawU(this);;
else (no)
:getUg().draw(shape);;
endif 
end
start
note right
UGraphicapply(UChangechange)
end note
:return new UGraphicInterceptorUDrawable(getUg()
.apply(change));;
stop
end
@enduml

