@startuml
!pragma layout smetana
start
note right
constructor ColorHSB(intrgba)
end note
:super (rgba,true);
:hue=hsb[0];
:saturation=hsb[1];
:brightness=hsb[2];
end
start
note right
constructor ColorHSB(Colorother)
end note
:this(other.getRGB());
end
start
note right
floatgetHue()
end note
:return hue;;
stop
end
start
note right
floatgetSaturation()
end note
:return saturation;;
stop
end
start
note right
floatgetBrightness()
end note
:return brightness;;
stop
end
start
note right
StringtoString()
end note
:return String.format(Locale.US,"%s[a=%02X r=%02X g=%02X b=%02X / h=%f s=%f b=%f]",
getClass().getSimpleName(),getAlpha(),getRed(),
getGreen(),getBlue(),getHue(),getSaturation(),
getBrightness());;
stop
end
@enduml

