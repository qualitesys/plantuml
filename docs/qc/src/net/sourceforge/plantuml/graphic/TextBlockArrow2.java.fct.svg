@startuml
!pragma layout smetana
start
note right
constructor TextBlockArrow2(GuideLineangle,
FontConfigurationfontConfiguration)
end note
:this.angle=Objects.requireNonNull(angle);
:this.size=fontConfiguration.getFont().getSize2D();
:this.color=fontConfiguration.getColor();
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(color);
:ug=ug.apply(color.bg());
:ug=ug.apply(new UTranslate(triSize/2,size/2));
:triangle.addPoint(getPoint(triSize/2,angle.getArrowDirection2()));
:triangle.addPoint(getPoint(triSize/2,angle.getArrowDirection2()+beta));
:triangle.addPoint(getPoint(triSize/2,angle.getArrowDirection2()-beta));
:triangle.addPoint(getPoint(triSize/2,angle.getArrowDirection2()));
:ug.draw(triangle);
end
start
note right
XPoint2DgetPoint(doublelen,doublealpha)
end note
:return new XPoint2D(dx,dy);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(size,size);;
stop
end
@enduml

