@startuml
!pragma layout smetana
start
note right
SNamegetSName()
end note
:return SName.person;;
stop
end
start
note right
void drawHeadAndBody(UGraphicug,doubleshadowing,
XDimension2DdimBody,doubleheadSize)
end note
:body.setDeltaShadow(shadowing);
:head.setDeltaShadow(shadowing);
:ug.apply(UTranslate.dx(posx)).draw(head);
:ug.apply(UTranslate.dy(headSize)).draw(body);
end
start
note right
doubleheadSize(XDimension2DdimBody)
end note
:return Math.sqrt(surface)*.42;;
stop
end
start
note right
MargingetMargin()
end note
:return new Margin(10,10,10,10);;
stop
end
start
note right
TextBlockasSmall(TextBlockname,final TextBlocklabel,
final TextBlockstereotype,final SymbolContextsymbolContext,
final HorizontalAlignmentstereoAlignment)
end note
:return new AbstractTextBlock(){public void drawU(UGraphicug){final XDimension2DdimFull=calculateDimension(ug.getStringBounder());final XDimension2DdimBody=bodyDimension(ug.getStringBounder());ug=UGraphicStencil.create(ug,dimFull);ug=symbolContext.apply(ug);final doubleheadSize=headSize(dimBody);drawHeadAndBody(ug,symbolContext.getDeltaShadow(),dimBody,headSize);final TextBlocktb=TextBlockUtils.mergeTB(stereotype,label,stereoAlignment);final Marginmargin=getMargin();tb.drawU(ug.apply(new UTranslate(margin.getX1(),margin.getY1()+headSize)));}public XDimension2DcalculateDimension(StringBounderstringBounder){final XDimension2Dbody=bodyDimension(stringBounder);return XDimension2D.delta(body,0,headSize(body));}private XDimension2DbodyDimension(StringBounderstringBounder){final XDimension2DdimLabel=label.calculateDimension(stringBounder);final XDimension2DdimStereo=stereotype.calculateDimension(stringBounder);return getMargin().addDimension(XDimension2D.mergeTB(dimStereo,dimLabel));}};;
stop
end
start
