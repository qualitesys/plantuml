yle="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6853c5c3dab43635ec0cdbf4c52ee038]
@startuml
!pragma layout smetana
start
note right
constructor SizeChange(Strings)
end note
if (matcherSize.find()==false) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
:size=Integer.valueOf(matcherSize.group(1));;
end
start
note right
IntegergetSize()
end note
:return size;;
stop
end
start
note right
FontConfigurationapply(FontConfigurationinitial)
end note
:return initial.changeSize(size);;
stop
end
@enduml

