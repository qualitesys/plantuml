@startuml
!pragma layout smetana
start
note right
constructor TextBlockMarged(TextBlocktextBlock,
doubletop,doubleright,doublebottom,doubleleft)
end note
end
start
note right
constructor TextBlockMarged(TextBlocktextBlock,
ClockwiseTopRightBottomLeftmargins)
end note
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.delta(dim,left+right,top+
bottom);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (dim.getWidth()>0) then (yes) 
endif 
end
start
note right
XRectangle2DgetInnerPosition(Stringmember,
StringBounderstringBounder,InnerStrategystrategy)
end note
if (parent==null ) then (yes) 
:return null ;;
stop
endif 
:return translate.apply(parent);;
stop
end
start
note right
PortsgetPorts(StringBounderstringBounder)
end note
:return ((WithPorts)textBlock).getPorts(stringBounder)
.translateY(top);;
stop
end
@enduml

