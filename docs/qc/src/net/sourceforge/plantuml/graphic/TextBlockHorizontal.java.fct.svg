@startuml
!pragma layout smetana
start
note right
constructor TextBlockHorizontal(TextBlockb1,TextBlockb2,VerticalAlignmentalignment)
end note
:this.blocks.add(b1);
:this.blocks.add(b2);
:this.alignment=alignment;
end
start
note right
constructor TextBlockHorizontal(List<TextBlock>all,VerticalAlignmentalignment)
end note
if (all.size()<2) then (yes) 
:throw new IllegalArgumentException();;
endif 
:this.blocks.addAll(all);
:this.alignment=alignment;
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:i++;
:dim=XDimension2D.mergeLR(dim,blocks.get(i)
.calculateDimension(stringBounder));
:return dim;;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (alignment==VerticalAlignment.CENTER) then (yes) 
:block.drawU(ug.apply(new UTranslate(x,dy)));
else (no)
:block.drawU(ug.apply(UTranslate.dx(x)));
endif 
:x+=dimb.getWidth();
end
@enduml

