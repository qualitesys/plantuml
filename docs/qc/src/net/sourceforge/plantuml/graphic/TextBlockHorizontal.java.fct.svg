;"/><line style="stroke:#181818;stroke-width:1.0;" x1="163" x2="163" y1="977.4023" y2="995.4023"/><line style="stroke:#181818;stroke-width:1.0;" x1="163" x2="305.75" y1="995.4023" y2="995.4023"/><polygon fill="#181818" points="295.75,991.4023,305.75,995.4023,295.75,999.4023,299.75,995.4023" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="472.5" x2="472.5" y1="977.4023" y2="995.4023"/><line style="stroke:#181818;stroke-width:1.0;" x1="472.5" x2="329.75" y1="995.4023" y2="995.4023"/><polygon fill="#181818" points="339.75,991.4023,329.75,995.4023,339.75,999.4023,335.75,995.4023" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="317.75" x2="317.75" y1="886.8672" y2="909.4336"/><polygon fill="#181818" points="313.75,899.4336,317.75,909.4336,321.75,899.4336,317.75,903.4336" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="317.75" x2="317.75" y1="1007.4023" y2="1027.4023"/><polygon fill="#181818" points="313.75,1017.4023,317.75,1027.4023,321.75,1017.4023,317.75,1021.4023" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="317.75" x2="317.75" y1="1061.3711" y2="1081.3711"/><polygon fill="#181818" points="313.75,1071.3711,317.75,1081.3711,321.75,1071.3711,317.75,1075.3711" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[399c61e70124f5cb96f694dff5e8af35]
@startuml
!pragma layout smetana
start
note right
constructor TextBlockHorizontal(TextBlockb1,
TextBlockb2,VerticalAlignmentalignment)
end note
:this.blocks.add(b1);;
:this.blocks.add(b2);;
:this.alignment=alignment;;
end
start
note right
constructor TextBlockHorizontal(List<TextBlock>all,
VerticalAlignmentalignment)
end note
if (all.size()<2) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
:this.blocks.addAll(all);;
:this.alignment=alignment;;
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:dim=XDimension2D.mergeLR(dim,blocks.get(i)
.calculateDimension(stringBounder));;
:return dim;;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (alignment==VerticalAlignment.CENTER) then (yes) 
:block.drawU(ug.apply(new UTranslate(x,dy)));;
else (no)
:block.drawU(ug.apply(UTranslate.dx(x)));;
endif 
:x+=dimb.getWidth();;
end
@enduml

