start
note right
void drawCard(UGraphicug,doublewidth,doubleheight,
doubleshadowing,doubletop,doubleroundCorner)
end note
:shape.setDeltaShadow(shadowing);
:ug.draw(shape);
if (top!=0) then (yes) 
:ug.apply(UTranslate.dy(top)).draw(ULine.hline(width));
endif 
end
