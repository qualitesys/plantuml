:return new AbstractTextBlock(){public void drawU(UGraphicug){final XDimension2Ddim=calculateDimension(ug.getStringBounder());ug=UGraphicStencil.create(ug,dim);ug=symbolContext.apply(ug);drawCard(ug,dim.getWidth(),dim.getHeight(),symbolContext.getDeltaShadow(),0,symbolContext.getRoundCorner());final Marginmargin=getMargin();final TextBlocktb=TextBlockUtils.mergeTB(stereotype,label,HorizontalAlignment.CENTER);tb.drawU(ug.apply(new UTranslate(margin.getX1(),margin.getY1())));}public XDimension2DcalculateDimension(StringBounderstringBounder){final XDimension2DdimLabel=label.calculateDimension(stringBounder);final XDimension2DdimStereo=stereotype.calculateDimension(stringBounder);return getMargin().addDimension(XDimension2D.mergeTB(dimStereo,dimLabel));}};;
