3" y1="1154.4648" y2="1174.4648"/><polygon fill="#181818" points="209,1164.4648,213,1174.4648,217,1164.4648,213,1168.4648" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="213" x2="213" y1="1259.0313" y2="1281.5977"/><polygon fill="#181818" points="209,1271.5977,213,1281.5977,217,1271.5977,213,1275.5977" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="213" x2="213" y1="1329.5352" y2="1349.5352"/><polygon fill="#181818" points="209,1339.5352,213,1349.5352,217,1339.5352,213,1343.5352" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[bbc453f3e7b05bfe1696d2139e8db238]
@startuml
!pragma layout smetana
start
note right
constructor CircledCharacter(charc,doubleradius,UFontfont,HColorspotBackColor,HColorspotBorder,HColorfontColor)
end note
:this.c=""+c;
:this.radius=radius;
:this.font=font;
:this.spotBackColor=spotBackColor;
:this.spotBorder=spotBorder;
:this.fontColor=fontColor.getAppropriateColor(spotBackColor);
end
start
note right
void drawU(UGraphicug)
end note
if (spotBorder!=null ) then (yes) 
:ug=ug.apply(spotBorder);
endif 
:ug=ug.apply(spotBackColor.bg());
:ug.draw(new UEllipse(radius*2,radius*2));
:ug=ug.apply(fontColor);
:ug=ug.apply(new UTranslate(radius,radius));
:ug.draw(new UCenteredCharacter(c.charAt(0),
font));
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return 2*radius;;
stop
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return 2*radius;;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(getPreferredWidth(stringBounder),
getPreferredHeight(stringBounder));;
stop
end
@enduml

