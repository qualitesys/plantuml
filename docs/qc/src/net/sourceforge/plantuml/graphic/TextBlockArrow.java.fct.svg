@startuml
!pragma layout smetana
start
note right
constructor TextBlockArrow(Directionarrow,FontConfigurationfontConfiguration)
end note
:this.arrow=Objects.requireNonNull(arrow);
:this.size=fontConfiguration.getFont().getSize2D();
:this.color=fontConfiguration.getColor();
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(color.bg());
:ug=ug.apply(color);
if (triSize%2==1) then (yes) 
:triSize- -;
endif 
:ug.apply(new UTranslate(2,(size-triSize)-2))
.draw(triangle);
end
start
note right
UPolygongetTriangle(inttriSize)
end note
if (arrow==Direction.RIGHT) then (yes) 
:triangle.addPoint(0,0);
:triangle.addPoint(triSize,triSize/2);
:triangle.addPoint(0,triSize);
:triangle.addPoint(0,0);
else (no)
:throw new IllegalStateException();;
endif 
:return triangle;;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(size,size);;
stop
end
@enduml

