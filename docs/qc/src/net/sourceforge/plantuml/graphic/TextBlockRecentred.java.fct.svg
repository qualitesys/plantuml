@startuml
!pragma layout smetana
start
note right
constructor TextBlockRecentred(TextBlocktextBlock)
end note
:this.textBlock=textBlock;
end
start
note right
void drawU(final UGraphicug)
end note
:textBlock.drawU(ug.apply(new UTranslate(-minMax.getMinX(),
-minMax.getMinY())));
end
start
note right
MinMaxgetMinMax(StringBounderstringBounder)
end note
:return textBlock.getMinMax(stringBounder);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return minMax.getDimension();;
stop
end
start
note right
HColorgetBackcolor()
end note
if (textBlock instanceof TextBlockBackcolored) then (yes) 
:return ((TextBlockBackcolored)textBlock)
.getBackcolor();;
stop
endif 
:return null ;;
stop
end
@enduml

