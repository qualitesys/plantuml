@startuml
!pragma layout smetana
start
note right
constructor Text(Stringtext)
end note
:this.text=text.replaceAll("\\\\\\[","[").replaceAll("\\\\\\]",
"]");
if (text.indexOf(BackSlash.CHAR_NEWLINE)!=-1) then (yes) 
:throw new IllegalArgumentException();;
endif 
if (text.length()==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
StringgetText()
end note
:return text;;
stop
end
start
note right
booleanisNewline()
end note
:return text.equals(BackSlash.BS_BS_N);;
stop
end
@enduml

