@startuml
!pragma layout smetana
start
note right
XDimension2DcalculateDimension(UFontfont,Stringtext)
end note
if (RichText.isRich(text)) then (yes) 
:width+=rect.getWidth();
:height=Math.max(height,rect.getHeight());
:return new XDimension2D(width,height);;
stop
endif 
:return calculateDimensionInternal(font,text);;
stop
end
start
note right
doublegetDescent(UFontfont,Stringtext)
end note
:return descent;;
stop
end
@enduml

