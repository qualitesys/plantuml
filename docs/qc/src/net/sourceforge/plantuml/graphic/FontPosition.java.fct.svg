@startuml
!pragma layout smetana
start
note right
intgetSpace()
end note
if (this==EXPOSANT) then (yes) 
:return -6;;
stop
endif 
if (this==INDICE) then (yes) 
:return 3;;
stop
endif 
:return 0;;
stop
end
start
note right
UFontmute(UFontfont)
end note
if (this==NORMAL) then (yes) 
:return font;;
stop
endif 
if (size<2) then (yes) 
:size=2;;
endif 
:return font.withSize((float)size);;
stop
end
start
note right
StringgetHtmlTag()
end note
if (this==EXPOSANT) then (yes) 
:return "sup";;
stop
endif 
if (this==INDICE) then (yes) 
:return "sub";;
stop
endif 
:throw new UnsupportedOperationException();;
stop
end
