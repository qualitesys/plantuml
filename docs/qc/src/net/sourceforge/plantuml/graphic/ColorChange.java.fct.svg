@startuml
!pragma layout smetana
start
note right
constructor ColorChange(Strings)
end note
if (matcherColor.find()==false) then (yes) 
:throw new IllegalArgumentException();;
endif 
:this.color=HColorSet.instance().getColorOrWhite(s1);
end
start
note right
HColorgetColor()
end note
:return color;;
stop
end
start
note right
FontConfigurationapply(FontConfigurationinitial)
end note
:return initial.changeColor(color);;
stop
end
@enduml

