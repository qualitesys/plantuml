@startuml
!pragma layout smetana
start
note right
constructor TextBlockRaw(List<String>strings,
FontConfigurationfontConfiguration)
end note
:this.strings=strings;
:this.fontConfiguration=fontConfiguration;
end
start
note right
List<Line>getLines(StringBounderstringBounder)
end note
if (lines2==null ) then (yes) 
if (stringBounder==null ) then (yes) 
:throw new IllegalStateException();;
endif 
:this.lines2=new ArrayList<>();
:lines2.add(SingleLine.rawText(s,fontConfiguration));
endif 
:return lines2;;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return getTextDimension(stringBounder);;
stop
end
start
note right
XDimension2DgetTextDimension(StringBounderstringBounder)
end note
:height+=size2D.getHeight();
:width=Math.max(width,size2D.getWidth());
:return new XDimension2D(width,height);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:line.drawU(ug.apply(UTranslate.dy(y)));
:y+=line.calculateDimension(ug.getStringBounder())
.getHeight();
end
@enduml

