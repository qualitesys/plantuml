.6289"/><polygon fill="#181818" points="176,1157.6289,180,1167.6289,184,1157.6289,180,1161.6289" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4ca50467ce134a2fc7cfdc4c6bedc5cb]
@startuml
!pragma layout smetana
start
note right
CoordinateChangecreate(XPoint2Dp1,XPoint2Dp2)
end note
:return new CoordinateChange(p1.getX(),p1.getY(),
p2.getX(),p2.getY());;
stop
end
start
note right
constructor CoordinateChange(doublex1,doubley1,
doublex2,doubley2)
end note
:this.x1=x1;
:this.y1=y1;
:this.x2=x2;
:this.y2=y2;
:this.len=XPoint2D.distance(x1,y1,x2,y2);
if (this.len==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
:this.vect_u_x=(x2-x1)/len;
:this.vect_u_y=(y2-y1)/len;
:this.vect_v_x=-this.vect_u_y;
:this.vect_v_y=this.vect_u_x;
end
start
note right
XPoint2DgetTrueCoordinate(doublea,doubleb)
end note
:return new XPoint2D(x1+x,y1+y);;
stop
end
start
note right
doublegetLength()
end note
:return len;;
stop
end
@enduml

