@startuml
!pragma layout smetana
start
note right
CoordinateChangecreate(XPoint2Dp1,XPoint2Dp2)
end note
:return new CoordinateChange(p1.getX(),p1.getY(),
p2.getX(),p2.getY());;
stop
end
start
note right
constructor CoordinateChange(doublex1,doubley1,
doublex2,doubley2)
end note
if (this.len==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
XPoint2DgetTrueCoordinate(doublea,doubleb)
end note
:return new XPoint2D(x1+x,y1+y);;
stop
end
start
note right
doublegetLength()
end note
:return len;;
stop
end
@enduml

