@startuml
!pragma layout smetana
start
note right
constructor PSystemXearth(UmlSourcesource,
intwidth,intheight,Map<String,String>config,
List<Marker>markers)
end note
:super (source);;
:this.width=width;;
:this.height=height;;
:this.config=config;;
:this.markers=markers;;
end
start
note right
ImageDataexportDiagramNow(OutputStreamos,
intnum,FileFormatOptionfileFormat)
end note
:synchronized (PSystemXearth.class ){final ACearthearth=new ACearth(markers);final ConfigurationACearthconf=earth.getConf();conf.setInt("imageWidth",
width);conf.setInt("imageHeight",height);for (Map.Entry<String,
String>ent:config.entrySet()){final Stringkey=ent.getKey();final Stringvalue=ent.getValue();if (key.equalsIgnoreCase("GMT")){final Datedate=extractGmt(value);conf.setInt("fixedTime",
(int)(date.getTime()/1000L));}else if (enums.contains(key)){conf.getMOEnum(key).set(value);}else if (doubles.contains(key)){conf.setDouble(key,
Double.parseDouble(value));}else if (integers.contains(key)){conf.setInt(key,
Integer.parseInt(value));}else if (booleans.contains(key)){conf.setBoolean(key,
value.equalsIgnoreCase("true"));}else {throw new UnsupportedOperationException(key);}}earth.exportPng(os);return new ImageDataSimple(width,
height);};
end
start
note right
DateextractGmt(Strings)
end note
if (s.matches("\\d{4}/\\d{2}/\\d{2} \\d{2}:\\d{2}:\\d{2}")) then (yes) 
:timeFormat=new SimpleDateFormat("yyyy/MM/dd HH:mm:ss",
Locale.US);;
else (no)
:throw new UnsupportedOperationException(s);;
stop
endif 
:timeFormat.setTimeZone(TimeZone.getTimeZone("GMT"));;
:try {return timeFormat.parse(s);}catch (ParseExceptione){throw new UnsupportedOperationException(s);};
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(XEarth)");;
stop
end
@enduml

