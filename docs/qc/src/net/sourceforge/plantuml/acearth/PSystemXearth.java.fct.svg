@startuml
!pragma layout smetana
start
note right
constructor PSystemXearth(UmlSourcesource,
intwidth,intheight,Map<String,String>config,
List<Marker>markers)
end note
end
start
note right
ImageDataexportDiagramNow(OutputStreamos,
intnum,FileFormatOptionfileFormat)
end note
if (key.equalsIgnoreCase("GMT")) then (yes) 
else (no)
:throw new UnsupportedOperationException(key);;
endif 
:return new ImageDataSimple(width,height);;
stop
end
start
note right
DateextractGmt(Strings)
end note
if (s.matches("\\d{4}/\\d{2}/\\d{2} \\d{2}:\\d{2}:\\d{2}")) then (yes) 
else (no)
:throw new UnsupportedOperationException(s);;
endif 
:return timeFormat.parse(s);;
stop
:throw new UnsupportedOperationException(s);;
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(XEarth)");;
stop
end
@enduml

