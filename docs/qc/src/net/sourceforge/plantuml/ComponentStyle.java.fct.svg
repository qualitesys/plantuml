@startuml
!pragma layout smetana
start
note right
USymboltoUSymbol()
end note
:switch (this){case UML1:return USymbols.COMPONENT1;
:case UML2:return USymbols.COMPONENT2;case RECTANGLE:return USymbols.RECTANGLE;};
:throw new AssertionError();;
stop
end
@enduml

