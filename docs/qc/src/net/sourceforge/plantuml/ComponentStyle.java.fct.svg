@startuml
!pragma layout smetana
start
note right
USymbol toUSymbol()
end note
switch (switch this)
case (case UML1:) 
:return USymbols.COMPONENT1;;
stop
case (case UML2:) 
:return USymbols.COMPONENT2;;
stop
case (case RECTANGLE:) 
:return USymbols.RECTANGLE;;
stop
endswitch
:throw new AssertionError();;
stop
end
@enduml

