885.293,235.5,889.293" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="235.5" x2="235.5" y1="929.2617" y2="949.2617"/><polygon fill="#181818" points="231.5,939.2617,235.5,949.2617,239.5,939.2617,235.5,943.2617" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0618e458f49b79c9592111bbbd651016]
@startuml
!pragma layout smetana
start
note right
List<String>getAllThemeNames()
end note
if (f.startsWith(THEME_FILE_PREFIX)&&f.endsWith(THEME_FILE_SUFFIX)) then (yes) 
endif 
:return result;;
stop
end
start
note right
ReadLinegetReaderTheme(Stringfilename)
end note
if (is==null ) then (yes) 
:return null ;;
stop
endif 
:return ReadLineReader.create(new InputStreamReader(is),
description);;
stop
end
start
note right
StringgetFullPath(Stringfrom,Stringfilename)
end note
if (from.endsWith("/")==false) then (yes) 
endif 
:return sb+getFilename(filename);;
stop
end
start
note right
StringgetFilename(Stringfilename)
end note
:return THEME_FILE_PREFIX+filename+THEME_FILE_SUFFIX;;
stop
end
@enduml

