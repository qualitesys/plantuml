@startuml
!pragma layout smetana
start
note right
List<String>getAllThemeNames()
end note
if (f.startsWith(THEME_FILE_PREFIX)&&f.endsWith(THEME_FILE_SUFFIX)) then (yes) 
:result.add(f.substring(THEME_FILE_PREFIX.length(),
f.length()-THEME_FILE_SUFFIX.length()));;
endif 
:Collections.sort(result);;
:return result;;
stop
end
start
note right
ReadLinegetReaderTheme(Stringfilename)
end note
:Log.info("Loading theme "+filename);;
if (is==null ) then (yes) 
:return null ;;
stop
endif 
:return ReadLineReader.create(new InputStreamReader(is),
description);;
stop
end
start
note right
StringgetFullPath(Stringfrom,Stringfilename)
end note
if (from.endsWith("/")==false) then (yes) 
:sb.append("/");;
endif 
:return sb+getFilename(filename);;
stop
end
start
note right
StringgetFilename(Stringfilename)
end note
:return THEME_FILE_PREFIX+filename+THEME_FILE_SUFFIX;;
stop
end
@enduml

