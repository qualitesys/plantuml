@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "t1="+thickness1+" e1="+elongation1+
" t2="+thickness2+" e2="+elongation2;;
stop
end
start
note right
constructor SymetricalTee(doublethickness1,
doubleelongation1,doublethickness2,doubleelongation2)
end note
end
start
note right
doublegetThickness1()
end note
:return thickness1;;
stop
end
start
note right
doublegetElongation1()
end note
:return elongation1;;
stop
end
start
note right
doublegetThickness2()
end note
:return thickness2;;
stop
end
start
note right
doublegetElongation2()
end note
:return elongation2;;
stop
end
start
note right
doublegetFullElongation()
end note
:return elongation1+elongation2;;
stop
end
start
note right
doublegetFullThickness()
end note
:return Math.max(thickness1,thickness2);;
stop
end
@enduml

