@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "t1="+thickness1+" e1="+elongation1+" t2="+thickness2+" e2="+elongation2;;
stop
end
start
note right
constructor SymetricalTee(doublethickness1,
doubleelongation1,doublethickness2,doubleelongation2)
end note
:this.thickness1=thickness1;
:this.elongation1=elongation1;
:this.thickness2=thickness2;
:this.elongation2=elongation2;
end
start
note right
doublegetThickness1()
end note
:return thickness1;;
stop
end
