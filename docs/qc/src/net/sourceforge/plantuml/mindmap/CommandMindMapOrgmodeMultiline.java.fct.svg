@startuml
!pragma layout smetana
start
note right
constructor CommandMindMapOrgmodeMultiline()
end note
:super (getRegexConcat(),MultilinesStrategy.REMOVE_STARTING_QUOTE,
Trim.BOTH);
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandMindMapOrgmodeMultiline.class .getName(),
RegexLeaf.start(),new RegexLeaf("TYPE","([*]+
)"),new RegexOptional(new RegexLeaf("BACKCOLOR","\\[(#\\w+
)\\]")),new RegexLeaf("SHAPE","(_)?"),new RegexLeaf(":"),
new RegexLeaf("DATA","(.*)"),RegexLeaf.end());;
stop
end
start
note right
StringgetPatternEnd()
end note
:return "^(.*);(?:\\s*\\<\\<(.+)\\>\\>)?$";;
stop
end
start
note right
CommandExecutionResultexecuteNow(MindMapDiagramdiagram,
BlocLineslines)
end note
:lines=lines.removeStartingAndEnding(line0.get("DATA",
0),1);
if (stereotype!=null ) then (yes) 
:lines=lines.overrideLastLine(lineLast.get(0));
endif 
if (stringColor!=null ) then (yes) 
:backColor=diagram.getSkinParam().getIHtmlColorSet().getColor(stringColor);
endif 
if (stereotype==null ) then (yes) 
:return diagram.addIdea(backColor,type.length()-1,
lines.toDisplay(),IdeaShape.fromDesc(line0.get("SHAPE",
0)));;
stop
endif 
:return diagram.addIdea(stereotype,backColor,
type.length()-1,lines.toDisplay(),IdeaShape.fromDesc(line0.get("SHAPE",
0)));;
stop
end
@enduml

