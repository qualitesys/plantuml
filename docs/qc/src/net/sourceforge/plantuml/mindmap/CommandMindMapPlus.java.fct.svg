@startuml
!pragma layout smetana
start
note right
constructor CommandMindMapPlus()
end note
:super (false,getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandMindMapPlus.class .getName(),
RegexLeaf.start(),new RegexLeaf("TYPE","([+-]+)"),
new RegexOptional(new RegexLeaf("BACKCOLOR",
"\\[(#\\w+)\\]")),new RegexLeaf("SHAPE","(_)?"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("LABEL",
"([^%s].*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(MindMapDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (stringColor!=null ) then (yes) 
:backColor=diagram.getSkinParam().getIHtmlColorSet().getColor(stringColor);
endif 
:return diagram.addIdea(backColor,type.length()-1,
Display.getWithNewlines(label),IdeaShape.fromDesc(arg.get("SHAPE",
0)),direction);;
stop
end
@enduml

