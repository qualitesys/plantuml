@startuml
!pragma layout smetana
start
note right
constructor ULayoutGroup(PlacementStrategyplacementStrategy)
end note
:this.placementStrategy=placementStrategy;
end
start
note right
void drawU(UGraphicug,doublewidth,doubleheight)
end note
:block.drawU(ug.apply(new UTranslate(pos)));
end
start
note right
void add(TextBlockblock)
end note
:placementStrategy.add(block);
end
start
note right
XRectangle2DgetInnerPosition(Stringmember,doublewidth,doubleheight,StringBounderstringBounder)
end note
if (result==null ) then (yes) 
:result=tryOne(all,member,stringBounder,InnerStrategy.LAZZY);
endif 
:return result;;
stop
end
start
note right
XRectangle2DtryOne(final Set<Entry<TextBlock,XPoint2D>>all,Stringmember,StringBounderstringBounder,InnerStrategymode)
end note
if (result!=null ) then (yes) 
:return translate.apply(result);;
stop
endif 
:return null ;;
stop
end
