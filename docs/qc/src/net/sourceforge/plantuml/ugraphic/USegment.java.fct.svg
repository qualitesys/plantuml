@startuml
!pragma layout smetana
start
note right
constructor USegment(double[]coord,USegmentTypepathType)
end note
end
start
note right
StringtoString()
end note
:return pathType.toString()+" "+Arrays.toString(coord);;
stop
end
start
note right
double[]getCoord()
end note
:return coord;;
stop
end
start
note right
USegmentTypegetSegmentType()
end note
:return pathType;;
stop
end
start
note right
USegmenttranslate(doubledx,doubledy)
end note
if (coord.length!=2) then (yes) 
:throw new UnsupportedOperationException();;
endif 
:return new USegment(new double[]{p1.getX(),
p1.getY()},pathType);;
stop
end
start
note right
USegmentrotate(doubletheta)
end note
if (coord.length!=2) then (yes) 
:throw new UnsupportedOperationException();;
endif 
:return new USegment(new double[]{p1.getX(),
p1.getY()},pathType);;
stop
end
@enduml

