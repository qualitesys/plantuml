@startuml
!pragma layout smetana
start
note right
constructor UEmpty(doublewidth,doubleheight)
end note
if (width==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
constructor UEmpty(XDimension2Ddim)
end note
end
start
note right
doublegetWidth()
end note
:return width;;
stop
end
start
note right
doublegetHeight()
end note
:return height;;
stop
end
@enduml

