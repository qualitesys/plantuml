@startuml
!pragma layout smetana
start
note right
constructor DriverEllipseSvg(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;;
end
start
note right
void draw(UEllipseshape,doublex,doubley,ColorMappermapper,
UParamparam,SvgGraphicssvg)
end note
if (clip!=null ) then (yes) 
if (clip.isInside(x,y)==false) then (yes) 
:return ;;
stop
endif 
if (clip.isInside(x+width,y+height)==false) then (yes) 
:return ;;
stop
endif 
endif 
:DriverRectangleSvg.applyStrokeColor(svg,
mapper,param);;
:DriverRectangleSvg.applyFillColor(svg,mapper,
param);;
:svg.setStrokeWidth(param.getStroke().getThickness(),
param.getStroke().getDasharraySvg());;
if (start==0&&extend==0) then (yes) 
:svg.svgEllipse(cx,cy,width/2,height/2,shape.getDeltaShadow());;
else (no)
:start=start+90;;
if (extend>0) then (yes) 
:svg.svgArcEllipse(width/2,height/2,x1,y1,
x2,y2);;
else (no)
:svg.svgArcEllipse(width/2,height/2,x1,y1,
x2,y2);;
endif 
