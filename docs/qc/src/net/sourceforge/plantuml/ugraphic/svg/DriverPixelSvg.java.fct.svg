@startuml
!pragma layout smetana
start
note right
void draw(UPixelpixel,doublex,doubley,ColorMappermapper,UParamparam,SvgGraphicssvg)
end note
if (color instanceof HColorGradient) then (yes) 
:svg.setStrokeColor(gr.getColor1().toSvg(mapper));
else (no)
:svg.setStrokeColor(color.toSvg(mapper));
endif 
:svg.setStrokeWidth(0.5,"");
:svg.svgRectangle(x,y,0.5,0.5,0,0,0,null ,
null );
end
@enduml

