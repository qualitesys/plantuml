@startuml
!pragma layout smetana
start
note right
constructor DriverTextSvg(StringBounderstringBounder,
ClipContainerclipContainer)
end note
:this.stringBounder=stringBounder;
:this.clipContainer=clipContainer;
end
start
note right
void draw(UTextshape,doublex,doubley,ColorMappermapper,
UParamparam,SvgGraphicssvg)
end note
if (clip!=null &&clip.isInside(x,y)==false) then (yes) 
:return ;;
stop
endif 
if (fontConfiguration.getColor().isTransparent()) then (yes) 
:return ;;
stop
endif 
if (fontConfiguration.containsStyle(FontStyle.BOLD)||font.isBold()) then (yes) 
:fontWeight="bold";
endif 
if (fontConfiguration.containsStyle(FontStyle.ITALIC)||font.isItalic()) then (yes) 
:fontStyle="italic";
endif 
if (fontConfiguration.containsStyle(FontStyle.UNDERLINE)&&fontConfiguration.getUnderlineStroke()
.getThickness()>0) then (yes) 
:textDecoration="underline";
endif 
if (text.matches("^\\s*$")) then (yes) 
:text=text.replace(' ',(char)160);
endif 
if (text.startsWith(" ")) then (yes) 
while (text.startsWith(" "))
:x+=space;
:text=text.substring(1);
endwhile
endif 
:text=StringUtils.trin(text);
if (fontConfiguration.containsStyle(FontStyle.BACKCOLOR)) then (yes) 
if (back instanceof HColorGradient) then (yes) 
:svg.setFillColor("url(#"+id+")");
:svg.setStrokeColor(null );
:svg.svgRectangle(x,y-height+deltaPatch,width,
height,0,0,0,null ,null );
else (no)
:backColor=back.toRGB(mapper);
endif 
endif 
:svg.setFillColor(textColor.toSvg(mapper));
:svg.text(text,x,y,font.getFamily(UFontContext.SVG),
font.getSize(),fontWeight,fontStyle,textDecoration,
width,fontConfiguration.getAttributes(),backColor);
end
@enduml

