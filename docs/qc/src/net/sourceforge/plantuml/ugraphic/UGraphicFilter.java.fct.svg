@startuml
!pragma layout smetana
start
note right
UGraphicapply(UChangetranslate)
end note
:throw new UnsupportedOperationException();;
end
start
note right
constructor UGraphicFilter(UGraphicug,Class<?  extends UShape>... toprint)
end note
:super (ug);
:this.toprint=Arrays.asList(toprint);
end
start
note right
void draw(UShapeshape)
end note
if (toprint.contains(shape.getClass())) then (yes) 
:getUg().draw(shape);
endif 
end
@enduml

