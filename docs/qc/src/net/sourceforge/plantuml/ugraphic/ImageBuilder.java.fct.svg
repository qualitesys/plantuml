endif 
:return null ;;
stop
end
start
note right
ClockwiseTopRightBottomLeftcalculateMargin(TitledDiagramdiagram)
end note
:final Stylestyle=StyleSignatureBasic.of(SName.root,
SName.document).getMergedStyle(diagram.getSkinParam().getCurrentStyleBuilder());;
if (style.hasValue(PName.Margin)) then (yes) 
:return style.getMargin();;
stop
