:return diagram.getDefaultMargins();;
stop
end
start
note right
StringgetPreserveAspectRatio()
end note
if (fileFormatOption.getPreserveAspectRatio()!=null ) then (yes) 
:return fileFormatOption.getPreserveAspectRatio();;
stop
else if (skinParam!=null ) then (yes) 
:return skinParam.getPreserveAspectRatio();;
stop
else (no)
:return DEFAULT_PRESERVE_ASPECT_RATIO;;
stop
