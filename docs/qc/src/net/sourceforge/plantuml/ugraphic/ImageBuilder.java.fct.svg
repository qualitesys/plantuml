@startuml
!pragma layout smetana
start
note right
ImageBuilderimageBuilder(FileFormatOptionfileFormatOption)
end note
:return new ImageBuilder(fileFormatOption);;
stop
end
start
note right
ImageBuilderplainImageBuilder(UDrawabledrawable,
FileFormatOptionfileFormatOption)
end note
:return imageBuilder(fileFormatOption).drawable(drawable);;
stop
end
start
note right
ImageBuilderplainPngBuilder(UDrawabledrawable)
end note
:return imageBuilder(new FileFormatOption(FileFormat.PNG))
.drawable(drawable);;
stop
end
start
note right
constructor ImageBuilder(FileFormatOptionfileFormatOption)
end note
:this.fileFormatOption=fileFormatOption;;
:this.stringBounder=fileFormatOption.getDefaultStringBounder(SvgCharSizeHack.NO_HACK);;
end
start
note right
ImageBuilderannotations(booleanannotations)
end note
:this.annotations=annotations;;
:return this;;
stop
end
start
note right
ImageBuilderbackcolor(HColorbackcolor)
end note
:this.backcolor=backcolor;;
:return this;;
stop
end
start
note right
ImageBuilderblackBackcolor()
end note
:return backcolor(HColors.BLACK);;
stop
end
start
note right
ImageBuilderdimension(XDimension2Ddimension)
end note
:this.dimension=dimension;;
:return this;;
stop
end
start
note right
intgetDpi()
end note
:return skinParam==null ? 96:skinParam.getDpi();;
stop
end
start
note right
ImageBuilderdrawable(UDrawabledrawable)
end note
:this.udrawable=drawable;;
if (backcolor==null &&drawable instanceof TextBlockBackcolored) then (yes) 
:backcolor=((TextBlockBackcolored)drawable)
.getBackcolor();;
endif 
:return this;;
stop
end
start
note right
ImageBuildermargin(ClockwiseTopRightBottomLeftmargin)
end note
:this.margin=margin;;
:return this;;
stop
end
start
note right
ImageBuildermetadata(Stringmetadata)
end note
:this.metadata=metadata;;
:return this;;
stop
end
start
note right
ImageBuilderrandomPixel()
end note
:this.randomPixel=true;;
:return this;;
stop
end
start
note right
ImageBuilderseed(longseed)
end note
:this.seed=seed;;
:return this;;
stop
end
start
note right
ImageBuilderstatus(intstatus)
end note
:this.status=status;;
:return this;;
stop
end
start
note right
StringgetSvgLinkTarget()
end note
if (fileFormatOption.getSvgLinkTarget()!=null ) then (yes) 
:return fileFormatOption.getSvgLinkTarget();;
stop
else if (skinParam!=null ) then (yes) 
:return skinParam.getSvgLinkTarget();;
stop
else (no)
:return null ;;
stop
endif 
end
start
note right
ImageBuilderwarningOrError(StringwarningOrError)
end note
:this.warningOrError=warningOrError;;
:return this;;
stop
end
start
note right
ImageBuilderstyled(TitledDiagramdiagram)
end note
:skinParam=diagram.getSkinParam();;
:stringBounder=fileFormatOption.getDefaultStringBounder(skinParam);;
:animation=diagram.getAnimation();;
:annotations=true;;
:backcolor=diagram.calculateBackColor();;
:margin=calculateMargin(diagram);;
:metadata=fileFormatOption.isWithMetadata()? diagram.getMetadata():null ;;
:seed=diagram.seed();;
:titledDiagram=diagram;;
:warningOrError=diagram.getWarningOrError();;
:return this;;
stop
end
start
note right
ImageDatawrite(OutputStreamos)
end note
if (annotations&&titledDiagram!=null ) then (yes) 
if (!(udrawable instanceof TextBlock)) then (yes) 
:throw new IllegalStateException("udrawable is not a TextBlock");;
stop
endif 
:final AnnotatedBuilderbuilder=new AnnotatedBuilder(titledDiagram,
skinParam,stringBounder);;
:final AnnotatedWorkerannotatedWorker=new AnnotatedWorker(titledDiagram,
skinParam,stringBounder,builder);;
:udrawable=annotatedWorker.addAdd((TextBlock)udrawable);;
endif 
switch (switch (fileFormatOption.getFileFormat()))
endswith
end
start
note right
byte[]writeByteArray()
end note
:try ;
:write(baos);;
:return baos.toByteArray();;
stop
end
start
note right
ImageDatawriteImageInternal(OutputStreamos,
AnimationanimationArg)
end note
:XDimension2Ddim=getFinalDimension();;
:doubledx=0;;
:doubledy=0;;
if (animationArg!=null ) then (yes) 
:final MinMaxminmax=animationArg.getMinMax(dim);;
:animationArg.setDimension(dim);;
:dim=minmax.getDimension();;
:dx=-minmax.getMinX();;
:dy=-minmax.getMinY();;
endif 
:final Scalescale=titledDiagram==null ? null :titledDiagram.getScale();;
:final doublescaleFactor=(scale==null ? 1:scale.getScale(dim.getWidth(),
dim.getHeight()))*getDpi()/96.0;;
if (scaleFactor<=0) then (yes) 
:throw new IllegalStateException("Bad scaleFactor");;
stop
endif 
:UGraphicug=createUGraphic(dim,animationArg,
dx,dy,scaleFactor,titledDiagram==null ? new Pragma():titledDiagram.getPragma());;
:maybeDrawBorder(ug,dim);;
if (randomPixel) then (yes) 
:drawRandomPoint(ug);;
endif 
:ug=handwritten(ug.apply(new UTranslate(margin.getLeft(),
margin.getTop())));;
:udrawable.drawU(ug);;
:ug.flushUg();;
:ug.writeToStream(os,metadata,96);;
:os.flush();;
if (ug instanceof UGraphicG2d) then (yes) 
:final Set<Url>urls=((UGraphicG2d)ug).getAllUrlsEncountered();;
if (urls.size()>0) then (yes) 
:final CMapDatacmap=CMapData.cmapString(urls,
scaleFactor);;
:return new ImageDataComplex(dim,cmap,warningOrError,
status);;
stop
endif 
endif 
:return createImageData(dim);;
stop
end
start
note right
void maybeDrawBorder(UGraphicug,XDimension2Ddim)
end note
if (skinParam==null ) then (yes) 
:return ;;
stop
endif 
:final HColorcolor=new Rose().getHtmlColor(skinParam,
ColorParam.diagramBorder);;
:UStrokestroke=skinParam.getThickness(LineParam.diagramBorder,
null );;
if (stroke==null &&color!=null ) then (yes) 
:stroke=new UStroke();;
endif 
if (stroke==null ) then (yes) 
:return ;;
stop
endif 
:final URectanglerectangle=new URectangle(dim.getWidth()-stroke.getThickness(),
dim.getHeight()-stroke.getThickness()).rounded(skinParam.getRoundCorner(CornerParam.diagramBorder,
null ));;
:ug.apply(color==null ? HColors.BLACK:color)
.apply(stroke).draw(rectangle);;
end
start
note right
void drawRandomPoint(UGraphicug2)
end note
:final Randomrnd=new Random();;
:final intred=rnd.nextInt(40);;
:final intgreen=rnd.nextInt(40);;
:final intblue=rnd.nextInt(40);;
:final Colorc=new Color(red,green,blue);;
:final HColorcolor=HColors.simple(c);;
:ug2.apply(color).apply(color.bg()).draw(new URectangle(1,
1));;
end
start
note right
XDimension2DgetFinalDimension()
end note
if (dimension==null ) then (yes) 
:final LimitFinderlimitFinder=LimitFinder.create(stringBounder,
true);;
:udrawable.drawU(limitFinder);;
:dimension=new XDimension2D(limitFinder.getMaxX()+
1+margin.getLeft()+margin.getRight(),limitFinder.getMaxY()+
1+margin.getTop()+margin.getBottom());;
endif 
:return dimension;;
stop
end
start
note right
UGraphichandwritten(UGraphicug)
end note
if (skinParam!=null &&skinParam.handwritten()) then (yes) 
:return new UGraphicHandwritten(ug);;
stop
endif 
:return ug;;
stop
end
start
note right
ImageDatawriteImageMjpeg(OutputStreamos)
end note
:final XDimension2Ddim=getFinalDimension();;
:final SFilef=new SFile("c:/tmp.avi");;
:final intnbframe=100;;
:final MJPEGGeneratorm=new MJPEGGenerator(f,
getAviImage(null ).getWidth(null ),getAviImage(null ).getHeight(null ),
12.0,nbframe);;
:AffineTransformat=AffineTransform.getTranslateInstance(dim.getWidth()/2,
dim.getHeight()/2);;
:at.rotate(90.0*Math.PI/180.0*i/100);;
:at.translate(-dim.getWidth()/2,-dim.getHeight()/2);;
:throw new UnsupportedOperationException();;
stop
:m.finishAVI();;
:FileUtils.copyToStream(f,os);;
:return createImageData(dim);;
stop
end
start
note right
ImageDatawriteImageAnimatedGif(OutputStreamos)
end note
:final XDimension2Ddim=getFinalDimension();;
:final MinMaxminmax=animation.getMinMax(dim);;
:final AnimatedGifEncodere=new AnimatedGifEncoder();;
:e.setRepeat(0);;
:e.start(os);;
:e.setDelay(60);;
:final ImageIconii=new ImageIcon(getAviImage(at));;
:e.addFrame((BufferedImage)ii.getImage());;
:e.finish();;
:return createImageData(dim);;
stop
end
start
note right
ImagegetAviImage(AffineTransformationaffineTransform)
end note
:final ByteArrayOutputStreambaos=new ByteArrayOutputStream();;
:writeImageInternal(baos,Animation.singleton(affineTransform));;
:baos.close();;
:return SImageIO.read(baos.toByteArray());;
stop
end
start
note right
UGraphiccreateUGraphic(final XDimension2Ddim,
AnimationanimationArg,doubledx,doubledy,doublescaleFactor,
Pragmapragma)
end note
:final ColorMappercolorMapper=fileFormatOption.getColorMapper();;
switch (switch (fileFormatOption.getFileFormat()))
endswith
end
start
note right
UGraphiccreateUGraphicSVG(doublescaleFactor,
XDimension2Ddim,booleaninteractive)
end note
:final StringhoverPathColorRGB=getHoverPathColorRGB();;
:final LengthAdjustlengthAdjust=skinParam==null ? LengthAdjust.defaultValue():skinParam.getlengthAdjust();;
:final StringpreserveAspectRatio=getPreserveAspectRatio();;
:final booleansvgDimensionStyle=skinParam==null ||skinParam.svgDimensionStyle();;
:final StringsvgLinkTarget=getSvgLinkTarget();;
:final UGraphicSvgug=new UGraphicSvg(backcolor,
svgDimensionStyle,dim,fileFormatOption.getColorMapper(),
false,scaleFactor,svgLinkTarget,hoverPathColorRGB,
seed,preserveAspectRatio,stringBounder,lengthAdjust,
interactive);;
:return ug;;
stop
end
start
note right
UGraphiccreateUGraphicPNG(doublescaleFactor,
final XDimension2Ddim,AnimationaffineTransforms,
doubledx,doubledy,Stringwatermark)
end note
:ColorpngBackColor=new Color(0,0,0,0);;
if (this.backcolor instanceof HColorSimple) then (yes) 
:pngBackColor=this.backcolor.toColor(fileFormatOption.getColorMapper());;
endif 
if (OptionFlags.getInstance().isReplaceWhiteBackgroundByTransparent()&&(Color.WHITE.equals(pngBackColor)||Color.BLACK.equals(pngBackColor))) then (yes) 
:pngBackColor=new Color(0,0,0,0);;
endif 
:final EmptyImageBuilderbuilder=new EmptyImageBuilder(watermark,
(int)(dim.getWidth()*scaleFactor),(int)(dim.getHeight()*scaleFactor),
pngBackColor,stringBounder);;
:final Graphics2Dgraphics2D=builder.getGraphics2D();;
:final UGraphicG2dug=new UGraphicG2d(backcolor,
fileFormatOption.getColorMapper(),stringBounder,
graphics2D,scaleFactor,affineTransforms==null ? null :affineTransforms.getFirst(),
dx,dy);;
:ug.setBufferedImage(builder.getBufferedImage());;
:final BufferedImageim=ug.getBufferedImage();;
if (this.backcolor instanceof HColorGradient) then (yes) 
:ug.apply(this.backcolor.bg()).draw(new URectangle(im.getWidth()/scaleFactor,
im.getHeight()/scaleFactor));;
endif 
:return ug;;
stop
end
start
note right
HColorgetDefaultHBackColor()
end note
:return HColors.WHITE;;
stop
end
start
note right
StringgetHoverPathColorRGB()
end note
if (fileFormatOption.getHoverColor()!=null ) then (yes) 
:return fileFormatOption.getHoverColor();;
stop
else if (skinParam!=null ) then (yes) 
:final HColorcolor=skinParam.hoverPathColor();;
if (color!=null ) then (yes) 
