@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "UText["+text+"]";;
stop
end
start
note right
constructor UText(Stringtext,FontConfigurationfont,
intorientation)
end note
:this.text=text;
:this.font=font;
:this.orientation=orientation;
end
start
note right
constructor UText(Stringtext,FontConfigurationfont)
end note
:this(text,font,0);
end
start
note right
UTextwithOrientation(intorientation)
end note
:return new UText(text,font,orientation);;
stop
end
start
note right
StringgetText()
end note
:return text;;
stop
end
start
note right
FontConfigurationgetFontConfiguration()
end note
:return font;;
stop
end
start
note right
doublegetDescent(StringBounderstringBounder)
end note
:return stringBounder.getDescent(font.getFont(),
text);;
stop
end
start
note right
intgetOrientation()
end note
:return orientation;;
stop
end
@enduml

