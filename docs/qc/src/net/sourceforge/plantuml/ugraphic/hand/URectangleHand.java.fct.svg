2="269.5" y1="864.3008" y2="886.8672"/><polygon fill="#181818" points="265.5,876.8672,269.5,886.8672,273.5,876.8672,269.5,880.8672" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="269.5" x2="269.5" y1="920.8359" y2="940.8359"/><polygon fill="#181818" points="265.5,930.8359,269.5,940.8359,273.5,930.8359,269.5,934.8359" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[cf0c1c991e78aebcc9b7d1cf1323e3fc]
@startuml
!pragma layout smetana
start
note right
constructor URectangleHand(URectanglerectangle,
Randomrnd)
end note
if (rx==0&&ry==0) then (yes) 
:jiggle=new HandJiggle(0,0,1.5,rnd);
:jiggle.lineTo(width,0);
:jiggle.lineTo(width,height);
:jiggle.lineTo(0,height);
:jiggle.lineTo(0,0);
else (no)
:jiggle=new HandJiggle(rx,0,1.5,rnd);
:jiggle.lineTo(width-rx,0);
:jiggle.arcTo(-Math.PI/2,0,width-rx,ry,rx,
ry);
:jiggle.lineTo(width,height-ry);
:jiggle.arcTo(0,Math.PI/2,width-rx,height-ry,
rx,ry);
:jiggle.lineTo(rx,height);
:jiggle.arcTo(Math.PI/2,Math.PI,rx,height-ry,
rx,ry);
:jiggle.lineTo(0,ry);
:jiggle.arcTo(Math.PI,3*Math.PI/2,rx,ry,rx,
ry);
endif 
:this.poly=jiggle.toUPolygon();
:this.poly.setDeltaShadow(rectangle.getDeltaShadow());
end
start
note right
ShadowablegetHanddrawn()
end note
:return this.poly;;
stop
end
@enduml

