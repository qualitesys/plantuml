@startuml
!pragma layout smetana
start
note right
constructor UPathHand(UPathsource,Randomrnd)
end note
if (type==USegmentType.SEG_MOVETO) then (yes) 
:result.moveTo(x,y);;
:last=new XPoint2D(x,y);;
else (no)
:this.path=source;;
:return ;;
stop
endif 
:this.path=result;;
:this.path.setDeltaShadow(source.getDeltaShadow());;
end
start
note right
UPathgetHanddrawn()
end note
:return this.path;;
stop
end
@enduml

