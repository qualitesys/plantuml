@startuml
!pragma layout smetana
start
note right
doublerandomMe()
end note
:return rnd.nextDouble();;
stop
end
start
note right
constructor UEllipseHand(UEllipsesource,Randomrnd)
end note
if (source.getStart()!=0||source.getExtend()!=0) then (yes) 
:return ;;
stop
endif 
if (width==height) then (yes) 
while (angle<Math.PI*2)
endwhile
else (no)
while (angle<Math.PI*2)
endwhile
endif 
end
start
note right
XPoint2DgetPoint(doublewidth,doubleheight,
doubleangle)
end note
:return new XPoint2D(x+variation*width,y+
variation*height);;
stop
end
start
note right
ShadowablegetHanddrawn()
end note
:return this.poly;;
stop
end
@enduml

