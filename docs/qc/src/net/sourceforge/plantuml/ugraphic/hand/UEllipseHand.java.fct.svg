@startuml
!pragma layout smetana
start
note right
doublerandomMe()
end note
:return rnd.nextDouble();;
stop
end
start
note right
constructor UEllipseHand(UEllipsesource,Randomrnd)
end note
:this.rnd=rnd;;
if (source.getStart()!=0||source.getExtend()!=0) then (yes) 
:this.poly=source;;
:return ;;
stop
endif 
:poly=new UPolygon();;
if (width==height) then (yes) 
:while (angle<Math.PI*2){angle+=(10+randomMe()*10)*Math.PI/180;final doublevariation=1+
(randomMe()-0.5)/8;final doublex=width/2+
Math.cos(angle)*width*variation/2;final doubley=height/2+
Math.sin(angle)*height*variation/2;((UPolygon)poly).addPoint(x,
y);};
else (no)
:while (angle<Math.PI*2){angle+=Math.PI/20;final XPoint2Dpt=getPoint(width,
height,angle);((UPolygon)poly).addPoint(pt.getX(),
pt.getY());};
endif 
:this.poly.setDeltaShadow(source.getDeltaShadow());;
end
start
note right
XPoint2DgetPoint(doublewidth,doubleheight,
doubleangle)
end note
:return new XPoint2D(x+variation*width,y+
variation*height);;
stop
end
start
note right
ShadowablegetHanddrawn()
end note
:return this.poly;;
stop
end
@enduml

