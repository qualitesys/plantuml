@startuml
!pragma layout smetana
start
note right
constructor DriverPathG2d(doubledpiFactor)
end note
end
start
note right
void draw(UPathshape,final doublex,final doubley,
ColorMappermapper,UParamparam,Graphics2Dg2d)
end note
if (type==USegmentType.SEG_MOVETO) then (yes) 
else (no)
:throw new UnsupportedOperationException();;
endif 
if (shape.isOpenIconic()) then (yes) 
:return ;;
stop
endif 
if (shape.getDeltaShadow()!=0) then (yes) 
if (back==null ||back.isTransparent()) then (yes) 
else (no)
endif 
endif 
if (back instanceof HColorGradient) then (yes) 
if (policy=='|') then (yes) 
else (no)
endif 
endif 
if (param.getColor().isTransparent()==false) then (yes) 
endif 
end
@enduml

