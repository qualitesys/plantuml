@startuml
!pragma layout smetana
start
note right
constructor DriverEllipseG2d(doubledpiFactor,
EnsureVisiblevisible)
end note
end
start
note right
void draw(UEllipseellipse,doublex,doubley,
ColorMappermapper,UParamparam,Graphics2Dg2d)
end note
if (ellipse.getStart()==0&&ellipse.getExtend()==0) then (yes) 
if (ellipse.getDeltaShadow()!=0) then (yes) 
endif 
if (back instanceof HColorGradient) then (yes) 
else (no)
if (back.isTransparent()==false) then (yes) 
endif 
if (color.isTransparent()==false&&color.equals(param.getBackcolor())==false) then (yes) 
endif 
endif 
else (no)
if (color.isTransparent()==false) then (yes) 
endif 
endif 
end
start
note right
doubleround(doublevalue)
end note
:return value;;
stop
end
@enduml

