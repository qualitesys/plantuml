@startuml
!pragma layout smetana
start
note right
void draw(UPixelpixel,doublex,doubley,ColorMappermapper,UParamparam,Graphics2Dg2d)
end note
:g2d.setColor(param.getColor().toColor(mapper));
:g2d.fillRect((int)x,(int)y,1,1);
end
@enduml

