@startuml
!pragma layout smetana
start
note right
constructor ExtendedGeneralPath()
end note
:path=new GeneralPath();;
end
start
note right
constructor ExtendedGeneralPath(intrule)
end note
:path=new GeneralPath(rule);;
end
start
note right
constructor ExtendedGeneralPath(intrule,intinitialCapacity)
end note
:path=new GeneralPath(rule,initialCapacity);;
end
start
note right
constructor ExtendedGeneralPath(Shapes)
end note
:this();;
:append(s,false);;
end
start
note right
void arcTo(doublerx,doublery,doubleangle,
booleanlargeArcFlag,booleansweepFlag,doublex,
doubley)
end note
if (rx==0||ry==0) then (yes) 
:lineTo(x,y);;
:return ;;
stop
endif 
:checkMoveTo();;
:final doublex0=cx;;
:final doubley0=cy;;
if (x0==x&&y0==y) then (yes) 
:return ;;
stop
endif 
:final Arc2Darc=computeArc(x0,y0,rx,ry,angle,
largeArcFlag,sweepFlag,x,y);;
if (arc==null ) then (yes) 
:return ;;
stop
endif 
:final AffineTransformt=AffineTransform.getRotateInstance(Math.toRadians(angle),
arc.getCenterX(),arc.getCenterY());;
:final Shapes=t.createTransformedShape(arc);;
:path.append(s,true);;
:makeRoom(7);;
:types[numSeg++]=ExtendedPathIterator.SEG_ARCTO;;
:values[numVals++]=rx;;
:values[numVals++]=ry;;
:values[numVals++]=angle;;
:values[numVals++]=largeArcFlag? 1:0;;
:values[numVals++]=sweepFlag? 1:0;;
:cx=values[numVals++]=x;;
:cy=values[numVals++]=y;;
end
start
note right
Arc2DcomputeArc(doublex0,doubley0,doublerx,
doublery,doubleangle,booleanlargeArcFlag,
booleansweepFlag,doublex,doubley)
end note
:final doubledx2=(x0-x)/2.0;;
:final doubledy2=(y0-y)/2.0;;
:angle=Math.toRadians(angle%360.0);;
:final doublecosAngle=Math.cos(angle);;
:final doublesinAngle=Math.sin(angle);;
:final doublex1=cosAngle*dx2+sinAngle*dy2;;
:final doubley1=-sinAngle*dx2+cosAngle*dy2;;
:rx=Math.abs(rx);;
:ry=Math.abs(ry);;
:doubleprx=rx*rx;;
:doublepry=ry*ry;;
:final doublepx1=x1*x1;;
:final doublepy1=y1*y1;;
:final doubleradiiCheck=px1/prx+py1/pry;;
if (radiiCheck>1) then (yes) 
:rx=Math.sqrt(radiiCheck)*rx;;
:ry=Math.sqrt(radiiCheck)*ry;;
:prx=rx*rx;;
:pry=ry*ry;;
endif 
:doublesign=(largeArcFlag==sweepFlag)? -1:1;;
:doublesq=((prx*pry)-(prx*py1)-(pry*px1))/((prx*py1)+
(pry*px1));;
:sq=(sq<0)? 0:sq;;
:final doublecoef=sign*Math.sqrt(sq);;
:final doublecx1=coef*((rx*y1)/ry);;
:final doublecy1=coef*-((ry*x1)/rx);;
:final doublesx2=(x0+x)/2.0;;
:final doublesy2=(y0+y)/2.0;;
:final doublecx=sx2+(cosAngle*cx1-sinAngle*cy1);;
:final doublecy=sy2+(sinAngle*cx1+cosAngle*cy1);;
:final doubleux=(x1-cx1)/rx;;
:final doubleuy=(y1-cy1)/ry;;
:final doublevx=(-x1-cx1)/rx;;
:final doublevy=(-y1-cy1)/ry;;
:doublen=Math.sqrt((ux*ux)+(uy*uy));;
:doublep=ux;;
:sign=(uy<0)? -1.0:1.0;;
:doubleangleStart=Math.toDegrees(sign*Math.acos(p/n));;
:n=Math.sqrt((ux*ux+uy*uy)*(vx*vx+vy*vy));;
:p=ux*vx+uy*vy;;
:sign=(ux*vy-uy*vx<0)? -1.0:1.0;;
:doubleangleExtent=Math.toDegrees(sign*Math.acos(p/n));;
if (!sweepFlag&&angleExtent>0) then (yes) 
:angleExtent-=360f;;
else if (sweepFlag&&angleExtent<0) then (yes) 
:angleExtent+=360f;;
endif 
:angleExtent%=360f;;
:angleStart%=360f;;
:final Arc2D.Doublearc=new Arc2D.Double();;
:arc.x=cx-rx;;
:arc.y=cy-ry;;
:arc.width=rx*2.0;;
:arc.height=ry*2.0;;
:arc.start=-angleStart;;
:arc.extent=-angleExtent;;
:return arc;;
stop
end
start
note right
void moveTo(doublex,doubley)
end note
:makeRoom(2);;
:types[numSeg++]=PathIterator.SEG_MOVETO;;
:cx=mx=values[numVals++]=x;;
:cy=my=values[numVals++]=y;;
end
start
note right
void lineTo(doublex,doubley)
end note
:checkMoveTo();;
:path.lineTo(x,y);;
:makeRoom(2);;
:types[numSeg++]=PathIterator.SEG_LINETO;;
:cx=values[numVals++]=x;;
:cy=values[numVals++]=y;;
end
start
note right
void quadTo(doublex1,doubley1,doublex2,doubley2)
end note
:checkMoveTo();;
:path.quadTo(x1,y1,x2,y2);;
:makeRoom(4);;
:types[numSeg++]=PathIterator.SEG_QUADTO;;
:values[numVals++]=x1;;
:values[numVals++]=y1;;
:cx=values[numVals++]=x2;;
:cy=values[numVals++]=y2;;
end
start
note right
void curveTo(doublex1,doubley1,doublex2,doubley2,
doublex3,doubley3)
end note
:checkMoveTo();;
:path.curveTo(x1,y1,x2,y2,x3,y3);;
:makeRoom(6);;
:types[numSeg++]=PathIterator.SEG_CUBICTO;;
:values[numVals++]=x1;;
:values[numVals++]=y1;;
:values[numVals++]=x2;;
:values[numVals++]=y2;;
:cx=values[numVals++]=x3;;
:cy=values[numVals++]=y3;;
end
start
note right
void closePath()
end note
if (numSeg!=0&&types[numSeg-1]==PathIterator.SEG_CLOSE) then (yes) 
:return ;;
stop
endif 
if (numSeg!=0&&types[numSeg-1]!=PathIterator.SEG_MOVETO) then (yes) 
:path.closePath();;
endif 
:makeRoom(0);;
:types[numSeg++]=PathIterator.SEG_CLOSE;;
:cx=mx;;
:cy=my;;
end
start
note right
void checkMoveTo()
end note
if (numSeg==0) then (yes) 
:return ;;
stop
endif 
switch (switch (types[numSeg-1]))
endswith
end
start
note right
void append(Shapes,booleanconnect)
end note
:append(s.getPathIterator(new AffineTransform()),
connect);;
end
start
note right
void append(PathIteratorpi,booleanconnect)
end note
:final double[]vals=new double[6];;
while (!pi.isDone())
:Arrays.fill(vals,0);;
:inttype=pi.currentSegment(vals);;
:pi.next();;
if (connect&&numVals!=0) then (yes) 
if (type==PathIterator.SEG_MOVETO) then (yes) 
:final doublex=vals[0];;
:final doubley=vals[1];;
if (x!=cx||y!=cy) then (yes) 
:type=PathIterator.SEG_LINETO;;
else (no)
if (pi.isDone()) then (yes) 
:break ;;
endif 
:type=pi.currentSegment(vals);;
:pi.next();;
endif 
endif 
:connect=false;;
endif 
switch (switch (type))
endswith
endwhile
end
start
note right
void append(ExtendedPathIteratorepi,booleanconnect)
end note
:final double[]vals=new double[7];;
while (!epi.isDone())
:Arrays.fill(vals,0);;
:inttype=epi.currentSegment(vals);;
:epi.next();;
if (connect&&numVals!=0) then (yes) 
if (type==PathIterator.SEG_MOVETO) then (yes) 
:final doublex=vals[0];;
:final doubley=vals[1];;
if ((x!=cx)||(y!=cy)) then (yes) 
:type=PathIterator.SEG_LINETO;;
else (no)
if (epi.isDone()) then (yes) 
:break ;;
endif 
:type=epi.currentSegment(vals);;
:epi.next();;
endif 
endif 
:connect=false;;
endif 
switch (switch (type))
endswith
endwhile
end
start
note right
intgetWindingRule()
end note
:return path.getWindingRule();;
stop
end
start
note right
void setWindingRule(intrule)
end note
:path.setWindingRule(rule);;
end
start
note right
XPoint2DgetCurrentPoint()
end note
if (numVals==0) then (yes) 
:return null ;;
stop
endif 
:return new XPoint2D(cx,cy);;
stop
end
start
note right
void reset()
end note
:path.reset();;
:numSeg=0;;
:numVals=0;;
:values=null ;;
:types=null ;;
end
start
note right
void transform(AffineTransformat)
end note
if (at.getType()!=AffineTransform.TYPE_IDENTITY) then (yes) 
:throw new IllegalArgumentException("ExtendedGeneralPaths can not be transformed");;
stop
endif 
end
start
note right
ShapecreateTransformedShape(AffineTransformat)
end note
:return path.createTransformedShape(at);;
stop
end
start
note right
RectanglegetBounds()
end note
:return path.getBounds();;
stop
end
start
note right
Rectangle2DgetBounds2D()
end note
:return path.getBounds2D();;
stop
end
start
note right
booleancontains(doublex,doubley)
end note
:return path.contains(x,y);;
stop
end
start
note right
booleancontains(Point2Dp)
end note
:return path.contains(p);;
stop
end
start
note right
booleancontains(doublex,doubley,doublew,doubleh)
end note
:return path.contains(x,y,w,h);;
stop
end
start
note right
booleancontains(Rectangle2Dr)
end note
:return path.contains(r);;
stop
end
start
note right
booleanintersects(doublex,doubley,doublew,
doubleh)
end note
:return path.intersects(x,y,w,h);;
stop
end
start
note right
booleanintersects(Rectangle2Dr)
end note
:return path.intersects(r);;
stop
end
start
note right
PathIteratorgetPathIterator(AffineTransformat)
end note
:return path.getPathIterator(at);;
stop
end
start
note right
PathIteratorgetPathIterator(AffineTransformat,
doubleflatness)
end note
:return path.getPathIterator(at,flatness);;
stop
end
start
note right
ExtendedPathIteratorgetExtendedPathIterator()
end note
:return new EPI();;
stop
end
start
note right
intcurrentSegment()
end note
:return types[segNum];;
stop
end
start
note right
intcurrentSegment(double[]coords)
end note
:final intret=types[segNum];;
switch (switch (ret))
endswith
:return ret;;
stop
end
start
note right
intgetWindingRule()
end note
:return path.getWindingRule();;
stop
end
start
note right
booleanisDone()
end note
:return segNum==numSeg;;
stop
end
start
note right
void next()
end note
:final inttype=types[segNum++];;
switch (switch (type))
endswith
end
start
note right
Objectclone()
end note
:try ;
:final ExtendedGeneralPathresult=(ExtendedGeneralPath)super .clone();;
:result.path=(GeneralPath)path.clone();;
if (values!=null ) then (yes) 
:result.values=new double[values.length];;
:System.arraycopy(values,0,result.values,
0,values.length);;
endif 
:result.numVals=numVals;;
if (types!=null ) then (yes) 
:result.types=new int[types.length];;
:System.arraycopy(types,0,result.types,0,
types.length);;
endif 
:result.numSeg=numSeg;;
:return result;;
stop
:catch (CloneNotSupportedExceptionex);
:Logme.error(ex);;
:return null ;;
stop
end
start
note right
void makeRoom(intnumValues)
end note
if (values==null ) then (yes) 
:values=new double[2*numValues];;
:types=new int[2];;
:numVals=0;;
:numSeg=0;;
:return ;;
stop
endif 
:final intnewSize=numVals+numValues;;
if (newSize>values.length) then (yes) 
:intnlen=values.length*2;;
if (nlen<newSize) then (yes) 
:nlen=newSize;;
endif 
:final double[]nvals=new double[nlen];;
:System.arraycopy(values,0,nvals,0,numVals);;
:values=nvals;;
endif 
if (numSeg==types.length) then (yes) 
:final int[]ntypes=new int[types.length*2];;
:System.arraycopy(types,0,ntypes,0,types.length);;
:types=ntypes;;
endif 
end
