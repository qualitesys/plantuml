oke:#181818;stroke-width:1.0;" x1="216" x2="216" y1="1119.6797" y2="1139.6797"/><polygon fill="#181818" points="212,1129.6797,216,1139.6797,220,1129.6797,216,1133.6797" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f63bd309b549c2c392ed8b8282de9aa9]
@startuml
!pragma layout smetana
start
note right
constructor DriverTextG2d(EnsureVisiblevisible,
StringBounderstringBounder)
end note
:this.visible=visible;
:this.stringBounder=stringBounder;
end
start
note right
void draw(UTextshape,doublex,doubley,ColorMappermapper,
UParamparam,Graphics2Dg2d)
end note
if (fontConfiguration.getColor().isTransparent()) then (yes) 
:return ;;
stop
endif 
:x+=printSingleText(g2d,fc,styledString.getText(),
x,y,mapper);
end
start
note right
doubleprintSingleText(Graphics2Dg2d,final FontConfigurationfontConfiguration,
final Stringtext,doublex,doubley,ColorMappermapper)
end note
if (orientation==90) then (yes) 
:g2d.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,
RenderingHints.VALUE_TEXT_ANTIALIAS_ON);
:g2d.setFont(font.getUnderlayingFont());
:g2d.setColor(fontConfiguration.getColor().toColor(mapper));
:g2d.translate(x,y);
:g2d.rotate(Math.PI/2);
:g2d.drawString(text,0,0);
:g2d.setTransform(orig);
endif 
:return width;;
stop
end
@enduml

