@startuml
!pragma layout smetana
start
note right
constructor Inflater(doublestart,doublesize)
end note
:this.start=start;
:this.size=size;
end
start
note right
void addInflater(doublestart,doublesize)
end note
:all.add(new Inflater(start,size));
end
start
note right
doubleinflate(doublev)
end note
if (v>in.start) then (yes) 
:result+=in.size;
endif 
:return result;;
stop
end
@enduml

