constructor PiecewiseAffineOnXorYBuilder(CompressionModemode,TextBlocktextBlock,PiecewiseAffineTransformpiecewiseAffineTransform)
end note
:this.textBlock=textBlock;
:this.mode=mode;
:this.piecewiseAffineTransform=piecewiseAffineTransform;
end
start
note right
void drawU(final UGraphicug)
end note
:textBlock.drawU(UGraphicCompressOnXorY.create(mode,
ug,piecewiseAffineTransform));
end
start
note right
MinMaxgetMinMax(StringBounderstringBounder)
end note
if (cachedMinMax==null ) then (yes) 
:cachedMinMax=TextBlockUtils.getMinMax(this,
stringBounder,false);
endif 
:return cachedMinMax;;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
if (mode==CompressionMode.ON_X) then (yes) 
:return new XDimension2D(piecewiseAffineTransform.transform(dim.getWidth()),
dim.getHeight());;
stop
else (no)
:return new XDimension2D(dim.getWidth(),piecewiseAffineTransform.transform(dim.getHeight()));;
stop
endif 
end
start
note right
HColorgetBackcolor()
end note
:return null ;;
stop
end
