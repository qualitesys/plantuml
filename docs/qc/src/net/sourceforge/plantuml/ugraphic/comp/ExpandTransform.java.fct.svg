859,259,843.0859" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6ecac7a65836fddb2e4b4f5469640478]
@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return all.toString();;
stop
end
start
note right
void addExpandIncludingLimit(doubleposition,doubleextend)
end note
:this.all.add(new Expand(ExpandType.INCLUDING_LIMIT,
position,extend));
end
start
note right
void addExpandExcludingLimit(doubleposition,doubleextend)
end note
:this.all.add(new Expand(ExpandType.EXCLUDING_LIMIT,
position,extend));
end
start
note right
doubletransform(final doubleinit)
end note
if (ExpandType.INCLUDING_LIMIT==expand.getType()&&init>=expand.getPosition()) then (yes) 
:result+=expand.getExtend();
endif 
if (ExpandType.EXCLUDING_LIMIT==expand.getType()&&init>expand.getPosition()) then (yes) 
:result+=expand.getExtend();
endif 
:return result;;
stop
end
@enduml

