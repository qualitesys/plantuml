 fill="#181818" points="255,815.3828,259,825.3828,263,815.3828,259,819.3828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="259" x2="259" y1="859.3516" y2="879.3516"/><polygon fill="#181818" points="255,869.3516,259,879.3516,263,869.3516,259,873.3516" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e88eb17ea145a29a6e8da7b0680795f2]
@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return all.toString();;
stop
end
start
note right
void addExpandIncludingLimit(doubleposition,
doubleextend)
end note
:this.all.add(new Expand(ExpandType.INCLUDING_LIMIT,
position,extend));;
end
start
note right
void addExpandExcludingLimit(doubleposition,
doubleextend)
end note
:this.all.add(new Expand(ExpandType.EXCLUDING_LIMIT,
position,extend));;
end
start
note right
doubletransform(final doubleinit)
end note
if (ExpandType.INCLUDING_LIMIT==expand.getType()&&init>=expand.getPosition()) then (yes) 
:result+=expand.getExtend();;
endif 
if (ExpandType.EXCLUDING_LIMIT==expand.getType()&&init>expand.getPosition()) then (yes) 
:result+=expand.getExtend();;
endif 
:return result;;
stop
end
@enduml

