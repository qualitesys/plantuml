start
note right
constructor Expand(ExpandTypetype,doubleposition,
doubleextend)
end note
if (extend<=0) then (yes) 
:throw new IllegalArgumentException();;
endif 
:this.type=type;
:this.position=position;
:this.extend=extend;
end
start
note right
StringtoString()
end note
:return "("+position+"==>+"+extend+" "+type+
")";;
stop
end
start
note right
intcompareTo(Expandother)
end note
if (this.position<other.position) then (yes) 
:return -1;;
stop
endif 
if (this.position>other.position) then (yes) 
:return 1;;
stop
endif 
:return 0;;
stop
end
start
note right
doublegetPosition()
end note
:return position;;
stop
end
start
note right
doublegetExtend()
end note
:return extend;;
stop
end
