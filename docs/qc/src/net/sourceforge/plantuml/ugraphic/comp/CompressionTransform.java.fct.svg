@startuml
!pragma layout smetana
start
note right
constructor CompressionTransform(SlotSetslotSet)
end note
end
start
note right
doubletransform(doublev)
end note
:return v-getCompressDelta(v);;
stop
end
start
note right
doublegetCompressDelta(doublev)
end note
if (s.getStart()>v) then (yes) 
endif 
if (v>s.getEnd()) then (yes) 
else (no)
endif 
:return result;;
stop
end
