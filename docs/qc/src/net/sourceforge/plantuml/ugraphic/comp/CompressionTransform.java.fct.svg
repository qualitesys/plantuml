@startuml
!pragma layout smetana
start
note right
constructor CompressionTransform(SlotSetslotSet)
end note
:this.all=slotSet.getSlots();
end
start
note right
doubletransform(doublev)
end note
:return v-getCompressDelta(v);;
stop
end
start
note right
doublegetCompressDelta(doublev)
end note
if (s.getStart()>v) then (yes) 
endif 
if (v>s.getEnd()) then (yes) 
:result+=s.size();
else (no)
:result+=v-s.getStart();
endif 
:return result;;
stop
end
@enduml

