@startuml
!pragma layout smetana
start
note right
constructor HColorGradient(HColorcolor1,HColorcolor2,
charpolicy)
end note
if (color1 instanceof HColorGradient) then (yes) 
endif 
if (color2 instanceof HColorGradient) then (yes) 
endif 
end
start
note right
HColorgetColor1()
end note
:return color1;;
stop
end
start
note right
HColorgetColor2()
end note
:return color2;;
stop
end
start
note right
ColorgetColor(ColorMappermapper,doublecoeff)
end note
if (coeff>1||coeff<0) then (yes) 
:throw new IllegalArgumentException("c="+
coeff);;
endif 
:return new Color(red,green,blue);;
stop
end
start
note right
chargetPolicy()
end note
:return policy;;
stop
end
start
note right
ColortoColor(ColorMappermapper)
end note
:return color1.toColor(mapper);;
stop
end
@enduml

