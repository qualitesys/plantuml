@startuml
!pragma layout smetana
start
note right
constructor HColorMiddle(HColorc1,HColorc2)
end note
:this.color1=c1;
:this.color2=c2;
end
start
note right
HColorgetColor1()
end note
:return color1;;
stop
end
start
note right
HColorgetColor2()
end note
:return color2;;
stop
end
start
note right
ColortoColor(ColorMappermapper)
end note
:return new Color(r,g,b);;
stop
end
@enduml

