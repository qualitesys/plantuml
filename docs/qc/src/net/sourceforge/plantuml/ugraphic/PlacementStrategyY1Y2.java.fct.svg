@startuml
!pragma layout smetana
start
note right
constructor PlacementStrategyY1Y2(StringBounderstringBounder)
end note
:super (stringBounder);;
end
start
note right
Map<TextBlock,XPoint2D>getPositions(doublewidth,
doubleheight)
end note
:result.put(ent.getKey(),new XPoint2D(x,y));;
:y+=ent.getValue().getHeight()+space;;
:return result;;
stop
end
@enduml

