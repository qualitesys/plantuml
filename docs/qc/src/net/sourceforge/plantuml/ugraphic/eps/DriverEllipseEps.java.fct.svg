:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="323.5" x2="323.5" y1="957.625" y2="977.625"/><polygon fill="#181818" points="319.5,967.625,323.5,977.625,327.5,967.625,323.5,971.625" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="323.5" x2="323.5" y1="1089.5625" y2="1109.5625"/><polygon fill="#181818" points="319.5,1099.5625,323.5,1109.5625,327.5,1099.5625,323.5,1103.5625" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a8ccb6404493c61f1d1a9de9f46088a5]
@startuml
!pragma layout smetana
start
note right
constructor DriverEllipseEps(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;
end
start
note right
void draw(UEllipseshape,doublex,doubley,ColorMappermapper,UParamparam,EpsGraphicseps)
end note
if (clip!=null ) then (yes) 
if (clip.isInside(x,y)==false) then (yes) 
:return ;;
stop
endif 
if (clip.isInside(x+width,y+height)==false) then (yes) 
:return ;;
stop
endif 
endif 
if (shape.getDeltaShadow()!=0) then (yes) 
:eps.epsEllipseShadow(x+width/2,y+height/2,
width/2,height/2,shape.getDeltaShadow());
endif 
:eps.setFillColor(param.getBackcolor().toColor(mapper));
:eps.setStrokeColor(param.getColor().toColor(mapper));
:eps.setStrokeWidth(param.getStroke().getThickness(),
param.getStroke().getDashVisible(),param.getStroke().getDashSpace());
if (shape.getStart()==0&&shape.getExtend()==0) then (yes) 
:eps.epsEllipse(x+width/2,y+height/2,width/2,
height/2);
else (no)
:eps.epsEllipse(x+width/2,y+height/2,width/2,
height/2,shape.getStart(),shape.getExtend());
endif 
end
@enduml

