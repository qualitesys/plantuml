1.0;" x1="485.5" x2="335.5" y1="1092.6953" y2="1092.6953"/><polygon fill="#181818" points="345.5,1088.6953,335.5,1092.6953,345.5,1096.6953,341.5,1092.6953" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="323.5" x2="323.5" y1="972.7578" y2="992.7578"/><polygon fill="#181818" points="319.5,982.7578,323.5,992.7578,327.5,982.7578,323.5,986.7578" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="323.5" x2="323.5" y1="1104.6953" y2="1124.6953"/><polygon fill="#181818" points="319.5,1114.6953,323.5,1124.6953,327.5,1114.6953,323.5,1118.6953" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2e4c4bfbef54ea4322f4c650b5428944]
@startuml
!pragma layout smetana
start
note right
constructor DriverEllipseEps(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;
end
start
note right
void draw(UEllipseshape,doublex,doubley,ColorMappermapper,
UParamparam,EpsGraphicseps)
end note
if (clip!=null ) then (yes) 
if (clip.isInside(x,y)==false) then (yes) 
:return ;;
stop
endif 
if (clip.isInside(x+width,y+height)==false) then (yes) 
:return ;;
stop
endif 
endif 
if (shape.getDeltaShadow()!=0) then (yes) 
:eps.epsEllipseShadow(x+width/2,y+height/2,
width/2,height/2,shape.getDeltaShadow());
endif 
:eps.setFillColor(param.getBackcolor().toColor(mapper));
:eps.setStrokeColor(param.getColor().toColor(mapper));
:eps.setStrokeWidth(param.getStroke().getThickness(),
param.getStroke().getDashVisible(),param.getStroke().getDashSpace());
if (shape.getStart()==0&&shape.getExtend()==0) then (yes) 
:eps.epsEllipse(x+width/2,y+height/2,width/2,
height/2);
else (no)
:eps.epsEllipse(x+width/2,y+height/2,width/2,
height/2,shape.getStart(),shape.getExtend());
endif 
end
@enduml

