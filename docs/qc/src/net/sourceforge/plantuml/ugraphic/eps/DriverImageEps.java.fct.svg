@startuml
!pragma layout smetana
start
note right
constructor DriverImageEps(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;
end
start
note right
void draw(UImageshape,doublex,doubley,ColorMappermapper,
UParamparam,EpsGraphicseps)
end note
if (clip!=null ) then (yes) 
if (clip.isInside(x,y)==false) then (yes) 
:return ;;
stop
endif 
if (clip.isInside(x+shape.getWidth(),y+shape.getHeight())==false) then (yes) 
:return ;;
stop
endif 
endif 
:eps.drawImage(shape.muteTransparentColor(param.getBackcolor().toColor(mapper)).getImage(1),x,y);
end
@enduml

