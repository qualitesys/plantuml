@startuml
!pragma layout smetana
start
note right
constructor DriverRectangleEps(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;
end
start
note right
void draw(URectanglerect,doublex,doubley,ColorMappermapper,UParamparam,EpsGraphicseps)
end note
if (clip!=null ) then (yes) 
if (r.height<0) then (yes) 
:return ;;
stop
endif 
:x=r.x;
:y=r.y;
:width=r.width;
:height=r.height;
endif 
if (rect.getDeltaShadow()!=0) then (yes) 
:eps.epsRectangleShadow(x,y,width,height,
rx/2,ry/2,rect.getDeltaShadow());
endif 
if (back instanceof HColorGradient) then (yes) 
:eps.setStrokeColor(param.getColor().toColor(mapper));
:eps.epsRectangle(x,y,width,height,rx/2,ry/2,
(HColorGradient)back,mapper);
else (no)
:eps.setStrokeColor(param.getColor().toColor(mapper));
:eps.setFillColor(param.getBackcolor().toColor(mapper));
:eps.setStrokeWidth(param.getStroke().getThickness(),
param.getStroke().getDashVisible(),param.getStroke().getDashSpace());
:eps.epsRectangle(x,y,width,height,rx/2,ry/2);
endif 
end
@enduml

