,1114.6836,404.5,1118.6836,394.5,1122.6836,398.5,1118.6836" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="638" x2="638" y1="1100.6836" y2="1118.6836"/><line style="stroke:#181818;stroke-width:1.0;" x1="638" x2="428.5" y1="1118.6836" y2="1118.6836"/><polygon fill="#181818" points="438.5,1114.6836,428.5,1118.6836,438.5,1122.6836,434.5,1118.6836" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="416.5" x2="416.5" y1="822.8711" y2="842.8711"/><polygon fill="#181818" points="412.5,832.8711,416.5,842.8711,420.5,832.8711,416.5,836.8711" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="416.5" x2="416.5" y1="1130.6836" y2="1150.6836"/><polygon fill="#181818" points="412.5,1140.6836,416.5,1150.6836,420.5,1140.6836,416.5,1144.6836" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[87e8392a71967ac179a4256a4247e603]
@startuml
!pragma layout smetana
start
note right
constructor DriverRectangleEps(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;;
end
start
note right
void draw(URectanglerect,doublex,doubley,
ColorMappermapper,UParamparam,EpsGraphicseps)
end note
if (clip!=null ) then (yes) 
if (r.height<0) then (yes) 
:return ;;
stop
endif 
:x=r.x;;
:y=r.y;;
:width=r.width;;
:height=r.height;;
endif 
if (rect.getDeltaShadow()!=0) then (yes) 
:eps.epsRectangleShadow(x,y,width,height,
rx/2,ry/2,rect.getDeltaShadow());;
endif 
if (back instanceof HColorGradient) then (yes) 
:eps.setStrokeColor(param.getColor().toColor(mapper));;
:eps.epsRectangle(x,y,width,height,rx/2,ry/2,
(HColorGradient)back,mapper);;
else (no)
:eps.setStrokeColor(param.getColor().toColor(mapper));;
:eps.setFillColor(param.getBackcolor().toColor(mapper));;
:eps.setStrokeWidth(param.getStroke().getThickness(),
param.getStroke().getDashVisible(),param.getStroke().getDashSpace());;
:eps.epsRectangle(x,y,width,height,rx/2,ry/2);;
endif 
end
@enduml

