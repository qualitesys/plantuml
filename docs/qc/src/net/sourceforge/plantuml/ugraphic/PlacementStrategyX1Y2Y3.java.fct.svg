@startuml
!pragma layout smetana
start
note right
constructor PlacementStrategyX1Y2Y3(StringBounderstringBounder)
end note
:super (stringBounder);
end
start
note right
Map<TextBlock,XPoint2D>getPositions(doublewidth,doubleheight)
end note
:result.put(ent.getKey(),new XPoint2D(space,y));
:y=(height-sumHeightButFirst)/2;
while (it.hasNext())
:result.put(textBlock,new XPoint2D(x,y));
:y+=ent2.getValue().getHeight();
endwhile
:return result;;
stop
end
start
note right
Iterator<XDimension2D>butFirst()
end note
:iterator.next();
:return iterator;;
stop
end
@enduml

