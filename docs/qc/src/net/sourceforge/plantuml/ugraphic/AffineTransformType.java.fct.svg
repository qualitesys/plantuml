@startuml
!pragma layout smetana
start
note right
int toLegacyInt()
end note
switch (switch this)
case (case TYPE_BILINEAR:) 
:return AffineTransformOp.TYPE_BILINEAR;;
stop
case (case TYPE_NEAREST_NEIGHBOR:) 
:return AffineTransformOp.TYPE_NEAREST_NEIGHBOR;;
stop
endswitch
:throw new AssertionError();;
stop
end
@enduml

