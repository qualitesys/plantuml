@startuml
!pragma layout smetana
start
note right
constructor USegmentType(intcode)
end note
:this.code=code;;
end
start
note right
intgetNbPoints()
end note
switch (switch (this))
endswith
:throw new UnsupportedOperationException();;
stop
end
start
note right
USegmentTypegetByCode(intcode)
end note
if (p.code==code) then (yes) 
:return p;;
stop
endif 
:throw new IllegalArgumentException();;
stop
end
@enduml

