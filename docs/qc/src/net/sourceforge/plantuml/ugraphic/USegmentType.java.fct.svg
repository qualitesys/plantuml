@startuml
!pragma layout smetana
start
note right
constructor USegmentType(intcode)
end note
:this.code=code;;
end
start
note right
intgetNbPoints()
end note
:switch (this){case SEG_MOVETO:return 1;case SEG_LINETO:return 1;
:case SEG_CUBICTO:return 3;case SEG_CLOSE:return 0;};
:throw new UnsupportedOperationException();;
stop
end
start
note right
USegmentTypegetByCode(intcode)
end note
if (p.code==code) then (yes) 
:return p;;
stop
endif 
:throw new IllegalArgumentException();;
stop
end
@enduml

