@startuml
!pragma layout smetana
start
note right
constructor USegmentType(int code)
end note
:this.code=code;;
end
start
note right
int getNbPoints()
end note
switch (switch this)
case (case SEG_MOVETO:) 
:return 1;;
stop
case (case SEG_LINETO:) 
:return 1;;
stop
case (case SEG_CUBICTO:) 
:return 3;;
stop
case (case SEG_CLOSE:) 
:return 0;;
stop
endswitch
:throw new UnsupportedOperationException();;
stop
end
start
note right
USegmentType getByCode(int code)
end note
if (p.code==code) then (yes) 
:return p;;
stop
endif 
:throw new IllegalArgumentException();;
stop
end
@enduml

