@startuml
!pragma layout smetana
start
note right
constructor PlacementStrategyVisibility(StringBounderstringBounder,
intcol2)
end note
:super (stringBounder);
:this.col2=col2;
end
start
note right
Map<TextBlock,XPoint2D>getPositions(doublewidth,
doubleheight)
end note
:result.put(ent1.getKey(),new XPoint2D(0,
2+y+(maxHeight12-height1)/2));
:result.put(ent2.getKey(),new XPoint2D(col2,
y+(maxHeight12-height2)/2));
:y+=maxHeight12;
:return result;;
stop
end
@enduml

