@startuml
!pragma layout smetana
start
note right
constructor TextBlockInEllipse(TextBlocktext,
StringBounderstringBounder)
end note
:this.text=text;
if (alpha<.2) then (yes) 
:alpha=.2;
endif 
:ellipse=footprint.getEllipse(text,alpha);
end
start
note right
UEllipsegetUEllipse()
end note
:return ellipse.asUEllipse().bigger(6);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug.draw(sh);
:text.drawU(ug.apply(new UTranslate(dx,(dy-2))));
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return getUEllipse().getDimension();;
stop
end
start
note right
void setDeltaShadow(doubledeltaShadow)
end note
:ellipse.setDeltaShadow(deltaShadow);
end
@enduml

