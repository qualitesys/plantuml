@startuml
!pragma layout smetana
start
note right
constructor DriverRectangleHtml5(ClipContainerclipContainer)
end note
:this.clipContainer=clipContainer;
end
start
note right
void draw(URectanglerect,doublex,doubley,ColorMappermapper,UParamparam,Html5Drawerhtml)
end note
if (clip!=null ) then (yes) 
:x=r.x;
:y=r.y;
:width=r.width;
:height=r.height;
endif 
if (back instanceof HColorGradient) then (yes) 
else (no)
:html.setStrokeColor(color);
:html.setFillColor(backcolor);
:html.htmlRectangle(x,y,width,height,rx/2,
ry/2);
endif 
end
@enduml

