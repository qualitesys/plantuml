@startuml
!pragma layout smetana
start
note right
VisioLinecreateInches(intid,doublex1,doubley1,
doublex2,doubley2)
end note
:return new VisioLine(id,toInches(x1),toInches(y1),
toInches(x2),toInches(y2));;
stop
end
start
note right
constructor VisioLine(intid,doublex1,doubley1,
doublex2,doubley2)
end note
if (x1<0||y1<0||x2<0||y2<0) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
VisioShapeyReverse(doublemaxY)
end note
:return new VisioLine(id,x1,maxY-y1,x2,maxY-y2);;
stop
end
start
note right
doubletoInches(doubleval)
end note
:return val/72.0;;
stop
end
start
note right
void print(OutputStreamos)
end note
end
start
note right
void out(OutputStreamos,Strings)
end note
end
@enduml

