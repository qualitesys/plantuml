@startuml
!pragma layout smetana
start
note right
VisioRectanglecreateInches(intid,doublex,
doubley,doublewidth,doubleheight)
end note
:return new VisioRectangle(id,toInches(x),
toInches(y),toInches(width),toInches(height));;
stop
end
start
note right
constructor VisioRectangle(intid,doublex,
doubley,doublewidth,doubleheight)
end note
if (x<0||y<0||width<0||height<0) then (yes) 
endif 
end
start
note right
VisioShapeyReverse(doublemaxY)
end note
:return new VisioRectangle(id,x,y2,width,
height);;
stop
end
start
note right
doubletoInches(doubleval)
end note
:return val/72.0;;
stop
end
start
note right
void print(OutputStreamos)
end note
end
start
note right
void out(OutputStreamos,Strings)
end note
end
@enduml

