@startuml
!pragma layout smetana
start
note right
VisioTextcreateInches(intid,Stringtext,intfontSize,
doublex,doubley,doublewidth,doubleheight)
end note
:return new VisioText(id,text,fontSize,toInches(x),toInches(y+
2.5),toInches(width*coef),toInches(height*coef));;
stop
end
start
note right
doubletoInches(doubleval)
end note
:return val/72.0;;
stop
end
start
note right
constructor VisioText(intid,Stringtext,intfontSize,
doublex,doubley,doublewidth,doubleheight)
end note
end
start
note right
void print(OutputStreamos)
end note
end
start
note right
VisioShapeyReverse(doublemaxY)
end note
:return new VisioText(id,text,fontSize,x,
y2,width,height);;
stop
end
start
note right
void out(OutputStreamos,Strings)
end note
end
@enduml

