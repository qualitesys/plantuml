34e99562cc728bf]
@startuml
!pragma layout smetana
start
note right
constructor ITFLeaf(Stylestyle,ISkinParamskinParam,Displaylabel,IdeaShapeshape)
end note
if (shape==IdeaShape.BOX) then (yes) 
:this.box=FtileBoxOld.createWbs(style,skinParam,
label);
else (no)
:this.box=TextBlockUtils.withMargin(text,
0,3,1,1);
endif 
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return box.calculateDimension(stringBounder);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:box.drawU(ug);
end
start
note right
XPoint2DgetT1(StringBounderstringBounder)
end note
:return new XPoint2D(dim.getWidth()/2,0);;
stop
end
start
note right
XPoint2DgetT2(StringBounderstringBounder)
end note
:return new XPoint2D(dim.getWidth()/2,dim.getHeight());;
stop
end
start
note right
XPoint2DgetF1(StringBounderstringBounder)
end note
:return new XPoint2D(0,dim.getHeight()/2);;
stop
end
start
note right
XPoint2DgetF2(StringBounderstringBounder)
end note
:return new XPoint2D(dim.getWidth(),dim.getHeight()/2);;
stop
end
@enduml

