@startuml
!pragma layout smetana
start
note right
constructor CommandWBSItem()
end note
:super (false,getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandWBSItem.class .getName(),
RegexLeaf.start(),new RegexLeaf("TYPE","([ \t]*[*+
-]+)"),new RegexOptional(new RegexLeaf("BACKCOLOR","\\[(#\\w+
)\\]")),new RegexLeaf("SHAPE","(_)?"),new RegexLeaf("DIRECTION",
"([<>])?"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("LABEL",
"([^%s].*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(WBSDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
if (stringColor!=null ) then (yes) 
:backColor=diagram.getSkinParam().getIHtmlColorSet().getColor(stringColor);
endif 
if (String.valueOf("<").equals(direction)) then (yes) 
:dir=Direction.LEFT;
endif 
:return diagram.addIdea(backColor,diagram.getSmartLevel(type),
label,dir,IdeaShape.fromDesc(arg.get("SHAPE",
0)));;
stop
end
