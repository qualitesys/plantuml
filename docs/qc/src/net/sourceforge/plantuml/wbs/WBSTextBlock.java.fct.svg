@startuml
!pragma layout smetana
start
note right
constructor WBSTextBlock(ISkinParamskinParam,
StyleBuilderstyleBuilder,intlevel)
end note
end
start
note right
void drawLine(UGraphicug,XPoint2Dp1,XPoint2Dp2)
end note
end
start
note right
StylegetStyleUsed()
end note
:return getDefaultStyleDefinitionArrow().getMergedStyle(styleBuilder);;
stop
end
start
note right
void drawLine(UGraphicug,doublex1,doubley1,
doublex2,doubley2)
end note
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionArrow()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.wbsDiagram,SName.arrow).add(SName.depth(level));;
stop
end
start
note right
TextBlockbuildMain(WElementidea)
end note
if (idea.getShape()==IdeaShape.BOX) then (yes) 
:return FtileBoxOld.createWbs(style,idea.withBackColor(skinParam),
label);;
stop
endif 
:return TextBlockUtils.withMargin(text,0,
3,1,1);;
stop
end
@enduml

