@startuml
!pragma layout smetana
start
note right
constructor CommandArchimateMultilines()
end note
:super (getRegexConcat(),MultilinesStrategy.REMOVE_STARTING_QUOTE,
Trim.BOTH);
end
start
note right
StringgetPatternEnd()
end note
:return "^(.*)\\]$";;
stop
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandArchimateMultilines.class .getName(),
RegexLeaf.start(),new RegexLeaf("archimate"),
RegexLeaf.spaceOneOrMore(),color().getRegex(),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("CODE",
"([%pLN_.]+)"),RegexLeaf.spaceZeroOrMore(),
new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),
new RegexLeaf("STEREOTYPE","(?:\\<\\<([-\\w]+)\\>\\>)"))),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("URL",
"("+UrlBuilder.getRegexp()+")?"),RegexLeaf.spaceZeroOrMore(),
ColorParser.exp1(),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("\\["),new RegexLeaf("DESC",
"(.*)"),RegexLeaf.end());;
stop
end
start
note right
ColorParsercolor()
end note
:return ColorParser.simpleColor(ColorType.BACK);;
stop
end
start
note right
CommandExecutionResultexecuteNow(AbstractEntityDiagramdiagram,
BlocLineslines)
end note
:lines=lines.trim();
:lines=lines.subExtract(1,1);
:entity.setDisplay(display);
:entity.setUSymbol(USymbols.RECTANGLE);
if (icon!=null ) then (yes) 
:entity.setStereotype(Stereotype.build("<<$archimate/"+icon+">>",
diagram.getSkinParam().getCircledCharacterRadius(),
diagram.getSkinParam().getFont(null ,false,
FontParam.CIRCLED_CHARACTER),diagram.getSkinParam().getIHtmlColorSet()));
endif 
:entity.setColors(colors);
:return CommandExecutionResult.ok();;
stop
end
@enduml

