@startuml
!pragma layout smetana
start
note right
constructor DescriptionDiagram(UmlSourcesource,
Map<String,String>skinParam)
end note
:super (source,UmlDiagramType.DESCRIPTION,
skinParam);
end
start
note right
IdentcleanIdent(Identident)
end note
if (codeString.startsWith("[")&&codeString.endsWith("]")) then (yes) 
:return ident.eventuallyRemoveStartingAndEndingDoubleQuote("\"([:");;
stop
endif 
if (codeString.startsWith(":")&&codeString.endsWith(":")) then (yes) 
:return ident.eventuallyRemoveStartingAndEndingDoubleQuote("\"([:");;
stop
endif 
if (codeString.startsWith("()")) then (yes) 
:codeString=StringUtils.trin(codeString.substring(2));
:codeString=StringUtils.eventuallyRemoveStartingAndEndingDoubleQuote(codeString);
:return ident.parent().add(Ident.empty().add(codeString,
null ));;
stop
endif 
:return ident;;
stop
end
start
note right
ILeafgetOrCreateLeaf(Identident,Codecode,
LeafTypetype,USymbolsymbol)
end note
:Objects.requireNonNull(ident);
if (type==null ) then (yes) 
if (codeString.startsWith("[")&&codeString.endsWith("]")) then (yes) 
:return getOrCreateLeafDefault(idNewLong,
idNewLong.toCode(this),LeafType.DESCRIPTION,
sym);;
stop
endif 
if (codeString.startsWith(":")&&codeString.endsWith(":")) then (yes) 
:return getOrCreateLeafDefault(idNewLong,
idNewLong.toCode(this),LeafType.DESCRIPTION,
getSkinParam().actorStyle().toUSymbol());;
stop
endif 
if (codeString.startsWith("()")) then (yes) 
:codeString=StringUtils.trin(codeString.substring(2));
:codeString=StringUtils.eventuallyRemoveStartingAndEndingDoubleQuote(codeString);
:return getOrCreateLeafDefault(idNewLong,
code99,LeafType.DESCRIPTION,USymbols.INTERFACE);;
stop
endif 
:code=this.V1972()? idNewLong:buildCode(tmp4);
:return getOrCreateLeafDefault(idNewLong,
code,LeafType.STILL_UNKNOWN,symbol);;
stop
endif 
:return getOrCreateLeafDefault(ident,code,
type,symbol);;
stop
end
start
note right
booleanisUsecase()
end note
if (type==LeafType.USECASE||usymbol==getSkinParam()
.actorStyle().toUSymbol()) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
void makeDiagramReady()
end note
:super .makeDiagramReady();
if (leaf.getLeafType()==LeafType.STILL_UNKNOWN) then (yes) 
:leaf.muteToType(defaultType,defaultSymbol);
endif 
end
start
note right
StringcheckFinalError()
end note
:this.applySingleStrategy();
:return super .checkFinalError();;
stop
end
@enduml

