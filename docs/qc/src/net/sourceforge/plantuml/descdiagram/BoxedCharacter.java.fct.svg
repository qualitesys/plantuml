@startuml
!pragma layout smetana
start
note right
constructor BoxedCharacter(charc,doublesize,
UFontfont,HColorinnerCircle,HColorcircle,
HColorfontColor)
end note
end
start
note right
void drawU(UGraphicug)
end note
if (circle!=null ) then (yes) 
endif 
if (innerCircle==null ) then (yes) 
else (no)
endif 
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return 2*radius;;
stop
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return 2*radius;;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(getPreferredWidth(stringBounder),
getPreferredHeight(stringBounder));;
stop
end
@enduml

