dth:1.0;" x1="648" x2="648" y1="458.0781" y2="478.0781"/><polygon fill="#181818" points="644,468.0781,648,478.0781,652,468.0781,648,472.0781" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[46ccdfbbebfd7f3a1b147208a0d1b20b]
@startuml
!pragma layout smetana
start
note right
constructor AnimationDecoder(Iterable<CharSequence>data)
end note
:Stringline=it.next().toString();;
if (line.matches("^\\s*\\[script\\]\\s*$")) then (yes) 
:final StringBuilderscriptText=new StringBuilder();;
:while (true){line=it.next().toString();if (line.matches("^\\s*\\[/script\\]\\s*$")){final AnimationScriptscript=new AnimationScript();
:final Stringout=script.eval(scriptText.toString());for (final StringTokenizerst=new StringTokenizer(out,
"\n");st.hasMoreTokens();){result.add(st.nextToken());}break ;}else {scriptText.append(line);scriptText.append("\n");}};
else (no)
:result.add(line);;
endif 
end
start
note right
List<String>decode()
end note
:return Collections.unmodifiableList(result);;
stop
end
@enduml

