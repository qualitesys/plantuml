@startuml
!pragma layout smetana
start
note right
booleanisOk()
end note
:try {final ClassclassVizJS=Class.forName("ch.braincell.viz.VizJS");
:return true;}catch (Exceptione){return false;};
end
start
note right
constructor VizJsEngine()
end note
:mExecute=classVizJS.getMethod("execute",
String.class );;
:this.viz=mCreate.invoke(null );;
end
start
note right
Stringexecute(Stringdot)
end note
:return (String)mExecute.invoke(viz,dot);;
stop
end
@enduml

