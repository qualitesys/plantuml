@startuml
!pragma layout smetana
start
note right
List<Token>tokenize(Stringsource)
end note
:List<Token>tokens=new ArrayList<>();;
:Stringtoken="";;
:TokenizeStatestate=TokenizeState.DEFAULT;;
:StringcharTokens="\n=+-*/<>()";;
:TokenType[]tokenTypes={TokenType.LINE,TokenType.EQUALS,
TokenType.OPERATOR,TokenType.OPERATOR,TokenType.OPERATOR,
TokenType.OPERATOR,TokenType.OPERATOR,TokenType.OPERATOR,
TokenType.LEFT_PAREN,TokenType.RIGHT_PAREN};;
:charc=source.charAt(i);;
switch (switch (state))
endswith
:return tokens;;
stop
end
start
note right
constructor Token(Stringtext,TokenTypetype)
end note
:this.text=text;;
:this.type=type;;
end
start
note right
constructor Parser(List<Token>tokens)
end note
:this.tokens=tokens;;
:position=0;;
end
start
note right
List<Statement>parse(Map<String,Integer>labels)
end note
:List<Statement>statements=new ArrayList<>();;
while (true)
while (match(TokenType.LINE))
:;;
endwhile
if (match(TokenType.LABEL)) then (yes) 
:labels.put(last(1).text,statements.size());;
else if (match(TokenType.WORD,TokenType.EQUALS)) then (yes) 
:Stringname=last(2).text;;
:Expressionvalue=expression();;
:statements.add(new AssignStatement(name,
value));;
else if (match("print")) then (yes) 
:statements.add(new PrintStatement(expression()));;
else if (match("input")) then (yes) 
:statements.add(new InputStatement(consume(TokenType.WORD)
.text));;
else if (match("goto")) then (yes) 
:statements.add(new GotoStatement(consume(TokenType.WORD)
.text));;
else if (match("if")) then (yes) 
:Expressioncondition=expression();;
:consume("then");;
:Stringlabel=consume(TokenType.WORD).text;;
:statements.add(new IfThenStatement(condition,
label));;
else (no)
:break ;;
endif 
endwhile
:return statements;;
stop
end
start
note right
Expressionexpression()
end note
:return operator();;
stop
end
start
note right
Expressionoperator()
end note
:Expressionexpression=atomic();;
while (match(TokenType.OPERATOR)||match(TokenType.EQUALS))
:charoperator=last(1).text.charAt(0);;
:Expressionright=atomic();;
:expression=new OperatorExpression(expression,
operator,right);;
endwhile
:return expression;;
stop
end
start
note right
Expressionatomic()
end note
if (match(TokenType.WORD)) then (yes) 
:return new VariableExpression(last(1).text);;
stop
else if (match(TokenType.NUMBER)) then (yes) 
:return new NumberValue(Double.parseDouble(last(1)
.text));;
stop
else if (match(TokenType.STRING)) then (yes) 
:return new StringValue(last(1).text);;
stop
else if (match(TokenType.LEFT_PAREN)) then (yes) 
:Expressionexpression=expression();;
:consume(TokenType.RIGHT_PAREN);;
:return expression;;
stop
endif 
:throw new Error("Couldn't parse :(");;
stop
end
start
note right
booleanmatch(TokenTypetype1,TokenTypetype2)
end note
if (get(0).type!=type1) then (yes) 
:return false;;
stop
endif 
if (get(1).type!=type2) then (yes) 
:return false;;
stop
endif 
:position+=2;;
:return true;;
stop
end
start
note right
booleanmatch(TokenTypetype)
end note
if (get(0).type!=type) then (yes) 
:return false;;
stop
endif 
:position++;;
:return true;;
stop
end
start
note right
booleanmatch(Stringname)
end note
if (get(0).type!=TokenType.WORD) then (yes) 
:return false;;
stop
endif 
if (!get(0).text.equals(name)) then (yes) 
:return false;;
stop
endif 
:position++;;
:return true;;
stop
end
start
note right
Tokenconsume(TokenTypetype)
end note
if (get(0).type!=type) then (yes) 
:throw new Error("Expected "+type+".");;
stop
endif 
:return tokens.get(position++);;
stop
end
start
note right
Tokenconsume(Stringname)
end note
if (!match(name)) then (yes) 
:throw new Error("Expected "+name+".");;
stop
endif 
:return last(1);;
stop
end
start
note right
Tokenlast(intoffset)
end note
:return tokens.get(position-offset);;
stop
end
start
note right
Tokenget(intoffset)
end note
if (position+offset>=tokens.size()) then (yes) 
:return new Token("",TokenType.EOF);;
stop
endif 
:return tokens.get(position+offset);;
stop
end
start
note right
constructor PrintStatement(Expressionexpression)
end note
:this.expression=expression;;
end
start
note right
void execute()
end note
:System.out.println(expression.evaluate()
.toString());;
end
start
note right
constructor InputStatement(Stringname)
end note
:this.name=name;;
end
start
note right
void execute()
end note
:try ;
:Stringinput=lineIn.readLine();;
:try ;
:doublevalue=Double.parseDouble(input);;
:variables.put(name,new NumberValue(value));;
:catch (NumberFormatExceptione);
:variables.put(name,new StringValue(input));;
:catch (IOExceptione1);
end
start
note right
constructor AssignStatement(Stringname,Expressionvalue)
end note
:this.name=name;;
:this.value=value;;
end
start
note right
void execute()
end note
:variables.put(name,value.evaluate());;
end
start
note right
constructor GotoStatement(Stringlabel)
end note
:this.label=label;;
end
start
note right
void execute()
end note
if (labels.containsKey(label)) then (yes) 
:currentStatement=labels.get(label).intValue();;
endif 
end
start
note right
constructor IfThenStatement(Expressioncondition,
Stringlabel)
end note
:this.condition=condition;;
:this.label=label;;
end
start
note right
void execute()
end note
if (labels.containsKey(label)) then (yes) 
:doublevalue=condition.evaluate().toNumber();;
if (value!=0) then (yes) 
:currentStatement=labels.get(label).intValue();;
endif 
endif 
end
start
note right
constructor VariableExpression(Stringname)
end note
:this.name=name;;
end
start
note right
Valueevaluate()
end note
if (variables.containsKey(name)) then (yes) 
:return variables.get(name);;
stop
endif 
:return new NumberValue(0);;
stop
end
start
note right
constructor OperatorExpression(Expressionleft,
charoperator,Expressionright)
end note
:this.left=left;;
:this.operator=operator;;
:this.right=right;;
end
start
note right
Valueevaluate()
end note
:ValueleftVal=left.evaluate();;
:ValuerightVal=right.evaluate();;
switch (switch (operator))
endswith
:throw new Error("Unknown operator.");;
stop
end
start
note right
constructor NumberValue(doublevalue)
end note
:this.value=value;;
end
start
note right
StringtoString()
end note
:return Double.toString(value);;
stop
end
start
note right
doubletoNumber()
end note
:return value;;
stop
end
start
note right
Valueevaluate()
end note
:return this;;
stop
end
start
note right
constructor StringValue(Stringvalue)
end note
:this.value=value;;
end
start
note right
StringtoString()
end note
:return value;;
stop
end
start
note right
doubletoNumber()
end note
:return Double.parseDouble(value);;
stop
end
start
note right
Valueevaluate()
end note
:return this;;
stop
end
start
note right
constructor Jasic()
end note
:variables=new HashMap<String,Value>();;
:labels=new HashMap<String,Integer>();;
:InputStreamReaderconverter=new InputStreamReader(System.in);;
:lineIn=new BufferedReader(converter);;
end
start
note right
void interpret(Stringsource)
end note
:List<Token>tokens=tokenize(source);;
:Parserparser=new Parser(tokens);;
:List<Statement>statements=parser.parse(labels);;
:currentStatement=0;;
while (currentStatement<statements.size())
:intthisStatement=currentStatement;;
:currentStatement++;;
:statements.get(thisStatement).execute();;
endwhile
end
@enduml

