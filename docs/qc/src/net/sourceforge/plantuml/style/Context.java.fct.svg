@startuml
!pragma layout smetana
start
note right
Contextpush(StringnewString)
end note
:return result;;
stop
end
start
note right
Contextpop()
end note
if (size()==0) then (yes) 
:throw new IllegalStateException();;
endif 
:return result;;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
intsize()
end note
:return data.size();;
stop
end
start
note right
Collection<StyleSignatureBasic>toSignatures()
end note
if (s.endsWith("*")) then (yes) 
endif 
if (star) then (yes) 
endif 
:return Collections.unmodifiableCollection(results);;
stop
end
@enduml

