@startuml
!pragma layout smetana
start
note right
constructor CommandStyleImport()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandStyleImport.class .getName(),
RegexLeaf.start(),new RegexLeaf("\\<style"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("\\w+
"),RegexLeaf.spaceZeroOrMore(),new RegexLeaf("="),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("[%q%g]?"),
new RegexLeaf("PATH","([^%q%g]*)"),new RegexLeaf("[%q%g]?"),
new RegexLeaf("\\>"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TitledDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (f.exists()) then (yes) 
:lines=BlocLines.load(f,location);
else (no)
if (internalIs!=null ) then (yes) 
:lines=BlocLines.load(internalIs,location);
endif 
endif 
if (lines==null ) then (yes) 
:return CommandExecutionResult.error("Cannot read: "+
