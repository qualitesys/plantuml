@startuml
!pragma layout smetana
start
note right
constructor ComponentTextNote(ComponentTypetype,DisplaystringsToDisplay,FileFormatfileFormat)
end note
:this.type=type;
:this.stringsToDisplay=stringsToDisplay;
:this.fileFormat=fileFormat;
end
start
note right
void drawU(UGraphicug,Areaarea,Context2Dcontext)
end note
:charArea.fillRect(' ',2,1,width-3,height-2);
if (type==ComponentType.NOTE) then (yes) 
if (fileFormat==FileFormat.UTXT) then (yes) 
:charArea.drawNoteSimpleUnicode(2,0,width-2,
height);
else (no)
:charArea.drawNoteSimple(2,0,width-2,height);
endif 
endif 
if (fileFormat==FileFormat.UTXT) then (yes) 
:charArea.drawStringsLRUnicode(stringsToDisplay.asList(),
3,1);
else (no)
:charArea.drawStringsLRSimple(stringsToDisplay.asList(),
3,1);
endif 
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return StringUtils.getHeight(stringsToDisplay)+2;;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return StringUtils.getWcWidth(stringsToDisplay)+7;;
stop
end
@enduml

