AsciiShapeshape)
end note
end
start
note right
void drawU(UGraphicug,Areaarea,Context2Dcontext)
end note
if (type==ComponentType.ACTOR_HEAD) then (yes) 
if (fileFormat==FileFormat.UTXT) then (yes) 
else (no)
endif 
else (no)
endif 
end
start
note right
intgetHeight()
end note
if (fileFormat==FileFormat.UTXT) then (yes) 
:return AsciiShape.STICKMAN_UNICODE.getHeight();;
stop
endif 
:return AsciiShape.STICKMAN.getHeight();;
stop
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return StringUtils.getHeight(stringsToDisplay)+
getHeight();;
stop
end
start
