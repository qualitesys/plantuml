@startuml
!pragma layout smetana
start
note right
constructor ComponentTextNewpage(FileFormatfileFormat)
end note
:this.fileFormat=fileFormat;;
end
start
note right
void drawU(UGraphicug,Areaarea,Context2Dcontext)
end note
if (fileFormat==FileFormat.UTXT) then (yes) 
:charArea.drawHLine('\u2550',0,0,width,'\u2502',
'\u256a');;
else (no)
:charArea.drawHLine('=',0,0,width);;
endif 
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return 2;;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return 2;;
stop
end
@enduml

