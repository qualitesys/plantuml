@startuml
!pragma layout smetana
start
note right
constructor ComponentTextShape(ComponentTypetype,DisplaystringsToDisplay,AsciiShapeshape)
end note
:this.type=type;
:this.stringsToDisplay=stringsToDisplay;
:this.shape=shape;
end
start
note right
void drawU(UGraphicug,Areaarea,Context2Dcontext)
end note
:charArea.fillRect(' ',0,0,width,height);
if (type.name().endsWith("_HEAD")) then (yes) 
:charArea.drawStringsLRSimple(stringsToDisplay.asList(),
1,getHeight());
:charArea.drawShape(shape,xman,0);
else (no)
:charArea.drawStringsLRSimple(stringsToDisplay.asList(),
1,0);
:charArea.drawShape(shape,xman,1);
endif 
end
start
note right
intgetHeight()
end note
:return shape.getHeight();;
stop
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return StringUtils.getHeight(stringsToDisplay)+
getHeight();;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return StringUtils.getWcWidth(stringsToDisplay)+2;;
stop
end
@enduml

