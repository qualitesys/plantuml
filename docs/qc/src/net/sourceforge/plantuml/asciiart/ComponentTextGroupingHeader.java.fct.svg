@startuml
!pragma layout smetana
start
note right
constructor ComponentTextGroupingHeader(ComponentTypetype,
DisplaystringsToDisplay,FileFormatfileFormat)
end note
end
start
note right
void drawU(UGraphicug,Areaarea,Context2Dcontext)
end note
if (fileFormat==FileFormat.UTXT) then (yes) 
else (no)
endif 
if (stringsToDisplay.size()>1&&stringsToDisplay.get(1)!=null ) then (yes) 
endif 
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return StringUtils.getHeight(stringsToDisplay)+1;;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return StringUtils.getWcWidth(stringsToDisplay)+2;;
stop
end
@enduml

