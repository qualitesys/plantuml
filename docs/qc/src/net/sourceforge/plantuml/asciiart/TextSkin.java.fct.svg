@startuml
!pragma layout smetana
start
note right
constructor TextSkin(FileFormatfileFormat)
end note
:this.fileFormat=fileFormat;
end
start
note right
ArrowComponentcreateComponentArrow(Style[]styles,
ArrowConfigurationconfig,ISkinParamparam,
DisplaystringsToDisplay)
end note
if (config.getArrowDirection()==ArrowDirection.LEFT_TO_RIGHT_NORMAL||config.getArrowDirection()==ArrowDirection.RIGHT_TO_LEFT_REVERSE||config.getArrowDirection()==ArrowDirection.BOTH_DIRECTION) then (yes) 
:return new ComponentTextArrow(ComponentType.ARROW,
config,stringsToDisplay,fileFormat,param.maxAsciiMessageLength());;
stop
endif 
if (config.isSelfArrow()) then (yes) 
:return new ComponentTextSelfArrow(ComponentType.ARROW,
config,stringsToDisplay,fileFormat);;
stop
endif 
:throw new UnsupportedOperationException();;
end
start
note right
ComponentcreateComponentNote(Style[]styles,
ComponentTypetype,ISkinParamparam,DisplaystringsToDisplay,
Colorscolors,NotePositionnotePosition)
end note
if (type==ComponentType.NOTE||type==ComponentType.NOTE_BOX) then (yes) 
:return new ComponentTextNote(type,stringsToDisplay,
fileFormat);;
stop
endif 
:throw new UnsupportedOperationException(type.toString());;
end
start
note right
ComponentcreateComponentNote(Style[]styles,
ComponentTypetype,ISkinParamparam,DisplaystringsToDisplay,
Colorscolors)
end note
:return createComponentNote(styles,type,param,
stringsToDisplay,colors,null );;
stop
end
start
note right
ComponentcreateComponent(Style[]style,ComponentTypetype,
ArrowConfigurationconfig,ISkinParamparam,
DisplaystringsToDisplay)
end note
if (type==ComponentType.ACTOR_HEAD||type==ComponentType.ACTOR_TAIL) then (yes) 
:return new ComponentTextActor(type,stringsToDisplay,
fileFormat,fileFormat==FileFormat.UTXT? AsciiShape.STICKMAN_UNICODE:AsciiShape.STICKMAN);;
stop
endif 
if (type==ComponentType.BOUNDARY_HEAD||type==ComponentType.BOUNDARY_TAIL) then (yes) 
:return new ComponentTextShape(type,stringsToDisplay,
AsciiShape.BOUNDARY);;
stop
endif 
if (type==ComponentType.DATABASE_HEAD||type==ComponentType.DATABASE_TAIL) then (yes) 
:return new ComponentTextShape(type,stringsToDisplay,
AsciiShape.DATABASE);;
stop
endif 
if (type.name().endsWith("_HEAD")||type.name()
.endsWith("_TAIL")) then (yes) 
:return new ComponentTextParticipant(type,
stringsToDisplay,fileFormat);;
stop
endif 
if (type.isArrow()&&(config.getArrowDirection()==ArrowDirection.LEFT_TO_RIGHT_NORMAL||config.getArrowDirection()==ArrowDirection.RIGHT_TO_LEFT_REVERSE||config.getArrowDirection()==ArrowDirection.BOTH_DIRECTION)) then (yes) 
:return new ComponentTextArrow(type,config,
stringsToDisplay,fileFormat,param.maxAsciiMessageLength());;
stop
endif 
if (type.isArrow()&&config.isSelfArrow()) then (yes) 
:return new ComponentTextSelfArrow(type,config,
stringsToDisplay,fileFormat);;
stop
endif 
if (type==ComponentType.PARTICIPANT_LINE) then (yes) 
:return new ComponentTextLine(type,fileFormat);;
stop
endif 
if (type==ComponentType.CONTINUE_LINE) then (yes) 
:return new ComponentTextLine(type,fileFormat);;
stop
endif 
if (type==ComponentType.DELAY_LINE) then (yes) 
:return new ComponentTextLine(type,fileFormat);;
stop
endif 
if (type==ComponentType.ALIVE_BOX_CLOSE_CLOSE) then (yes) 
:return new ComponentTextActiveLine(fileFormat);;
stop
endif 
if (type==ComponentType.ALIVE_BOX_CLOSE_OPEN) then (yes) 
:return new ComponentTextActiveLine(fileFormat);;
stop
endif 
if (type==ComponentType.ALIVE_BOX_OPEN_CLOSE) then (yes) 
:return new ComponentTextActiveLine(fileFormat);;
stop
endif 
if (type==ComponentType.ALIVE_BOX_OPEN_OPEN) then (yes) 
:return new ComponentTextActiveLine(fileFormat);;
stop
endif 
if (type==ComponentType.DIVIDER) then (yes) 
:return new ComponentTextDivider(type,stringsToDisplay,
fileFormat);;
stop
endif 
if (type==ComponentType.GROUPING_HEADER) then (yes) 
:return new ComponentTextGroupingHeader(type,
stringsToDisplay,fileFormat);;
stop
endif 
if (type==ComponentType.GROUPING_SPACE) then (yes) 
:return new ComponentRoseGroupingSpace(1);;
stop
endif 
if (type==ComponentType.GROUPING_ELSE_LEGACY||type==ComponentType.GROUPING_ELSE_TEOZ) then (yes) 
:return new ComponentTextGroupingElse(type,
stringsToDisplay,fileFormat);;
stop
endif 
if (type==ComponentType.DELAY_TEXT) then (yes) 
:return new ComponentTextDelay(type,stringsToDisplay,
fileFormat);;
stop
endif 
if (type==ComponentType.DESTROY) then (yes) 
:return new ComponentTextDestroy();;
stop
endif 
if (type==ComponentType.REFERENCE) then (yes) 
:return new ComponentTextReference(stringsToDisplay,
fileFormat);;
stop
endif 
:throw new UnsupportedOperationException(type.toString());;
end
start
note right
ComponentcreateComponentNewPage(ISkinParamparam)
end note
:return new ComponentTextNewpage(fileFormat);;
stop
end
@enduml

