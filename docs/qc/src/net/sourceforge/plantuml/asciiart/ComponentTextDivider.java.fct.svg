@startuml
!pragma layout smetana
start
note right
constructor ComponentTextDivider(ComponentTypetype,
DisplaystringsToDisplay,FileFormatfileFormat)
end note
:this.type=type;;
:this.stringsToDisplay=stringsToDisplay;;
:this.fileFormat=fileFormat;;
end
start
note right
void drawU(UGraphicug,Areaarea,Context2Dcontext)
end note
if (fileFormat==FileFormat.UTXT) then (yes) 
:charArea.drawHLine('\u2550',2,0,width,'\u2502',
'\u256a');;
:charArea.drawStringLR(desc,textPos,2);;
:charArea.drawHLine('\u2550',1,textPos-1,textPos+
desc.length()+1,'\u2502','\u2567');;
:charArea.drawHLine('\u2550',3,textPos-1,textPos+
desc.length()+1,'\u2502','\u2564');;
:charArea.drawStringTB("\u2554\u2563\u255a",
textPos-1,1);;
:charArea.drawStringTB("\u2557\u2560\u255d",textPos+
desc.length(),1);;
else (no)
:charArea.drawHLine('=',2,0,width);;
:charArea.drawStringLR(desc,textPos,2);;
:charArea.drawHLine('=',1,textPos-1,textPos+
desc.length()+1);;
:charArea.drawHLine('=',3,textPos-1,textPos+
desc.length()+1);;
endif 
end
start
note right
doublegetPreferredHeight(StringBounderstringBounder)
end note
:return StringUtils.getHeight(stringsToDisplay)+4;;
stop
end
start
note right
doublegetPreferredWidth(StringBounderstringBounder)
end note
:return StringUtils.getWcWidth(stringsToDisplay)+2;;
stop
end
@enduml

