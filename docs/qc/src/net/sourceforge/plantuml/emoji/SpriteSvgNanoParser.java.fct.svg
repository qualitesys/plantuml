:return new AbstractTextBlock(){public void drawU(UGraphicug){final ColorMappercolorMapper=ug.getColorMapper();if (colorMapper==ColorMapper.MONOCHROME){ug.draw(img.monochrome().scale(scale));}else if (color==null )ug.draw(img.scale(scale));else ug.draw(img.muteColor(color.toColor(colorMapper)).scale(scale));}public XDimension2DcalculateDimension(StringBounderstringBounder){return new XDimension2D(img.getWidth()*scale,img.getHeight()*scale);}};;
