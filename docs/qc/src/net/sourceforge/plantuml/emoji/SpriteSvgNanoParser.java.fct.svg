@startuml
!pragma layout smetana
start
note right
constructor SpriteSvgNanoParser(BufferedImageimg)
end note
:this.img=new UImage(new PixelImage(Objects.requireNonNull(img),
AffineTransformType.TYPE_BILINEAR));
end
start
note right
TextBlockasTextBlock(final HColorcolor,final doublescale)
end note
:return new AbstractTextBlock(){public void drawU(UGraphicug){final ColorMappercolorMapper=ug.getColorMapper();
:if (colorMapper==ColorMapper.MONOCHROME){ug.draw(img.monochrome().scale(scale));
:}else if (color==null )ug.draw(img.scale(scale));
:else ug.draw(img.muteColor(color.toColor(colorMapper)).scale(scale));
:}public XDimension2DcalculateDimension(StringBounderstringBounder){return new XDimension2D(img.getWidth()*scale,
img.getHeight()*scale);}};;
stop
end
start
note right
SpritefromInternal(Stringname)
end note
if (name.endsWith(".png")) then (yes) 
:throw new IllegalArgumentException();;
endif 
if (is==null ) then (yes) 
:return null ;;
stop
endif 
:return new SpriteSvgNanoParser(SImageIO.read(is));;
stop
:Logme.error(e);
:return null ;;
stop
end
start
note right
InputStreamgetInternalSprite(final Stringinner)
end note
:return is;;
stop
end
