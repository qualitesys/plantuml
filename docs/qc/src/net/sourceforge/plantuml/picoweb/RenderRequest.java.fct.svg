@startuml
!pragma layout smetana
start
note right
constructor RenderRequest(String[]options,
Stringsource)
end note
:this.options=options;
:this.source=source;
end
start
note right
String[]getOptions()
end note
:return options;;
stop
end
start
note right
StringgetSource()
end note
:return source;;
stop
end
start
note right
RenderRequestfromJson(Stringjson)
end note
if (parsed.contains("options")) then (yes) 
:options=new String[jsonArray.size()];
:i++;
:options[i]=jsonArray.get(i).asString();
else (no)
:options=new String[0];
endif 
:return new RenderRequest(options,parsed.get("source").asString());;
stop
end
@enduml

