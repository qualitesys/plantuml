@startuml
!pragma layout smetana
start
note right
constructor RenderRequest(String[]options,
Stringsource)
end note
end
start
note right
String[]getOptions()
end note
:return options;;
stop
end
start
note right
StringgetSource()
end note
:return source;;
stop
end
start
note right
RenderRequestfromJson(Stringjson)
end note
if (parsed.contains("options")) then (yes) 
else (no)
endif 
:return new RenderRequest(options,parsed.get("source")
.asString());;
stop
end
@enduml

