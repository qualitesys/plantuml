@startuml
!pragma layout smetana
start
note right
constructor PicoWebServer(Socketc)
end note
:this.connect=c;
end
start
note right
void main(String[]args)
end note
:startServer(8080,null ,false);
end
start
note right
void startServer(final intport,final StringbindAddress,
final booleanargEnableStop)
end note
:PicoWebServer.enableStop=argEnableStop;
:System.err.println("webPort="+serverConnect.getLocalPort());
:serverLoop(serverConnect);
end
start
note right
void serverLoop(final ServerSocketserverConnect)
end note
while (true)
:thread.start();
endwhile
end
start
note right
void run()
end note
:in=new BufferedInputStream(connect.getInputStream());
:out=new BufferedOutputStream(connect.getOutputStream());
if (request.getMethod().equals("GET")) then (yes) 
if (request.getPath().startsWith("/png/")&&handleGET(request,
out,FileFormat.PNG)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/plantuml/png/")&&handleGET(request,
out,FileFormat.PNG)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/svg/")&&handleGET(request,
out,FileFormat.SVG)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/plantuml/svg/")&&handleGET(request,
out,FileFormat.SVG)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/txt/")&&handleGET(request,
out,FileFormat.ATXT)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/plantuml/txt/")&&handleGET(request,
out,FileFormat.ATXT)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/utxt/")&&handleGET(request,
out,FileFormat.UTXT)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/plantuml/utxt/")&&handleGET(request,
out,FileFormat.UTXT)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/serverinfo")&&handleInfo(out)) then (yes) 
:return ;;
stop
endif 
if (request.getPath().startsWith("/plantuml/serverinfo")&&handleInfo(out)) then (yes) 
:return ;;
stop
endif 
if (enableStop&&(request.getPath().startsWith("/stopserver")||request.getPath()
.startsWith("/plantuml/stopserver"))&&handleStop(out)) then (yes) 
:return ;;
stop
endif 
endif 
