start
note right
void handleRenderRequest(ReceivedHTTPRequestrequest,
BufferedOutputStreamout)
end note
if (request.getBody().length==0) then (yes) 
:throw new BadRequest400("No request body");;
endif 
:renderRequest=RenderRequest.fromJson(new String(request.getBody(),
UTF_8));
:throw new BadRequest400("Error parsing request json: "+
e.getMessage(),e);;
:handleRenderRequest(renderRequest,out);
end
start
note right
void handleRenderRequest(RenderRequestrenderRequest,
BufferedOutputStreamout)
end note
if (ssr.getBlocks().size()==0) then (yes) 
:system=PSystemErrorUtils.buildV2(null ,new ErrorUml(SYNTAX_ERROR,
"No @startuml/@enduml found",0,new LineLocationImpl("",
null )),null ,Collections.<StringLocated>emptyList());
:imageData=ssr.noStartumlFound(os,option.getFileFormatOption());
else (no)
:system=ssr.getBlocks().get(0).getDiagram();
:imageData=system.exportDiagram(os,0,option.getFileFormatOption());
endif 
:sendDiagram(out,system,option.getFileFormatOption(),
"200",imageData,os.toByteArray());
end
start
note right
void sendDiagram(final BufferedOutputStreamout,
final Diagramsystem,final FileFormatOptionfileFormatOption,
final StringreturnCode,final ImageDataimageData,
final byte[]fileData)
end note
:write(out,"HTTP/1.1 "+returnCode);
:write(out,"Cache-Control: no-cache");
:write(out,"Server: PlantUML PicoWebServer "+
Version.versionString());
:write(out,"Date: "+new Date());
:write(out,"Access-Control-Allow-Origin: *");
:write(out,"Content-type: "+fileFormatOption.getFileFormat()
.getMimeType());
:write(out,"Content-length: "+fileData.length);
:write(out,"X-PlantUML-Diagram-Width: "+imageData.getWidth());
:write(out,"X-PlantUML-Diagram-Height: "+
imageData.getHeight());
:write(out,"X-PlantUML-Diagram-Description: "+
system.getDescription().getDescription());
if (system instanceof PSystemError) then (yes) 
:write(out,"X-PlantUML-Diagram-Error: "+err.getError());
:write(out,"X-PlantUML-Diagram-Error-Line: "+
(1+err.getLineLocation().getPosition()));
endif 
if (system.getTitleDisplay()!=null &&system.getTitleDisplay()
.size()==1) then (yes) 
if (encode.length()<256) then (yes) 
:write(out,"X-PlantUML-Diagram-Title: "+encode);
endif 
endif 
:write(out,"X-Patreon: Support us on https://plantuml.com/patreon");
:write(out,"X-Donate: https://plantuml.com/paypal");
:write(out,"X-Quote: "+StringUtils.rot(QuoteUtils.getSomeQuote()));
:write(out,"");
:out.flush();
:out.write(fileData);
:out.flush();
end
start
note right
void sendError(Throwablee,BufferedOutputStreamout)
end note
if (e instanceof BadRequest400&&e.getCause()==null ) then (yes) 
:printWriter.write(e.getMessage());
else (no)
:e.printStackTrace(printWriter);
endif 
:printWriter.close();
:write(out,"HTTP/1.1 "+(e instanceof BadRequest400? String.valueOf("400 Bad Request"):String.valueOf("500 Internal Server Error")));
:write(out,"Content-type: text/plain");
:write(out,"Content-length: "+baos.size());
:write(out,"");
:out.write(baos.toByteArray());
:out.flush();
end
start
note right
StringhttpReturnCode(intstatus)
end note
if (status==0||status==200) then (yes) 
:return "200 OK";;
stop
endif 
:return ""+status+" ERROR";;
stop
end
start
note right
void write(OutputStreamos,Strings)
end note
:s=s+"\r\n";
:os.write(s.getBytes(UTF_8));
end
