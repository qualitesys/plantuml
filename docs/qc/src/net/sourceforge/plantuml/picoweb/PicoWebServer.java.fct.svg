start
note right
booleanhandleGET(ReceivedHTTPRequestrequest,
BufferedOutputStreamout,final FileFormatformat)
end note
if (blocks.size()>0) then (yes) 
:os.close();
:sendDiagram(out,system,fileFormatOption,
