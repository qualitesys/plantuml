note right
StringgetText()
end note
:return text;;
stop
end
start
note right
FontStylegetStyle()
end note
:return style;;
stop
end
start
note right
List<StyledString>build(Strings)
end note
:while (s.length()>0){final inti1=s.indexOf(StringUtils.BOLD_START);if (i1==-1){result.add(new StyledString(s,
FontStyle.PLAIN));s="";break ;}final inti2=s.indexOf(StringUtils.BOLD_END);if (i1>0)result.add(new StyledString(s.substring(0,
i1),FontStyle.PLAIN));if (i2==-1){result.add(new StyledString(s.substring(i1+
1),FontStyle.BOLD));s="";}else {result.add(new StyledString(s.substring(i1+
1,i2),FontStyle.BOLD));s=s.substring(i2+1);}};
:return Collections.unmodifiableList(result);;
stop
end
