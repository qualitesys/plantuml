@startuml
!pragma layout smetana
start
note right
constructor TimingFormat(SimpleDateFormatsdf)
end note
end
start
note right
TimingFormatcreate(SimpleDateFormatsdf)
end note
:return new TimingFormat(sdf);;
stop
end
start
note right
StringformatTime(BigDecimaltime)
end note
if (this==HOUR||this==DATE||sdf!=null ) then (yes) 
:return formatTime(time.longValueExact());;
stop
endif 
:return time.toPlainString();;
stop
end
start
note right
StringformatTime(longtime)
end note
if (sdf!=null ) then (yes) 
:return sdf.format(time*1000L);;
stop
endif 
if (this==HOUR) then (yes) 
:return String.format("%d:%02d:%02d",h,m,s);;
stop
endif 
if (this==DATE) then (yes) 
:return String.format("%02d/%02d",mm,dd);;
stop
endif 
:return ""+time;;
stop
end
start
note right
TimeTickcreateDate(intyyyy,intmm,intdd,TimingFormatformat)
end note
:return new TimeTick(new BigDecimal(timeInMillis),
format);;
stop
end
@enduml

