@startuml
!pragma layout smetana
start
note right
constructor TimeTick(BigDecimaltime,TimingFormatformat)
end note
end
start
note right
BigDecimalgetTime()
end note
:return time;;
stop
end
start
note right
intcompareTo(TimeTickother)
end note
:return this.time.compareTo(other.time);;
stop
end
start
note right
TimingFormatgetFormat()
end note
:return format;;
stop
end
start
note right
StringtoString()
end note
:return format.formatTime(time);;
stop
end
@enduml

