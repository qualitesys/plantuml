108.3906,261.5,1098.3906,257.5,1102.3906" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[abf55e8d5171a6e5f640a7b398b98c54]
@startuml
!pragma layout smetana
start
note right
constructor PlayerFrame(TextBlocktitle,ISkinParamskinParam)
end note
:this.title=title;
:this.skinParam=skinParam;
end
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.timingDiagram);;
stop
end
start
note right
HColorgetLineColor()
end note
:return style.value(PName.LineColor).asColor(skinParam.getIHtmlColorSet());;
stop
end
start
note right
UStrokegetUStroke()
end note
:return style.getStroke();;
stop
end
start
note right
void drawFrameTitle(UGraphicug)
end note
:title.drawU(ug);
:ug=ug.apply(getLineColor()).apply(getUStroke());
:drawLine(ug,-TimingDiagram.marginX1,height,widthTmp,height,widthTmp+
10,0);
end
start
note right
void drawLine(UGraphicug,double... coord)
end note
:i+=2;
:ug.apply(new UTranslate(x1,y1)).draw(new ULine(x2-x1,
y2-y1));
end
@enduml

