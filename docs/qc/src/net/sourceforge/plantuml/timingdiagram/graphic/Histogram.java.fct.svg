start
note right
XDimension2DcalculateDimensionPart1(StringBounderstringBounder)
end note
:width=Math.max(width,dim.getWidth());
if (initialState!=null ) then (yes) 
:width+=getInitialWidth();
endif 
if (compact) then (yes) 
:width+=title.calculateDimension(stringBounder)
.getWidth()+15;
endif 
:return new XDimension2D(width,getFullHeight(stringBounder));;
stop
