note right
doublegetStatesWidth(StringBounderstringBounder)
end note
:result=Math.max(result,dim.getWidth());
:return result;;
stop
end
start
note right
void drawPart2(UGraphicug)
end note
if (changes.size()==0) then (yes) 
:return ;;
stop
endif 
:ug=getContext().apply(ug);
:ug=ug.apply(UTranslate.dy(getHeightForConstraints(ug.getStringBounder())));
:drawHlines(ug);
:drawVlines(ug);
:drawLabels(ug);
:drawConstraints(ug.apply(UTranslate.dy(-TimeConstraint.getTopMargin())));
end
start
note right
void drawHlines(UGraphicug)
end note
if (initialState!=null ) then (yes) 
:drawHLine(ug,getInitialPoint(),getInitialWidth()+
pt.getX());
endif 
:i++;
if (changes.get(i).isCompletelyHidden()) then (yes) 
endif 
if (points.length==2) then (yes) 
:drawHBlock(ug.apply(changes.get(i).getBackColor(skinParam,
style).bg()),points[0],points[1],len);
endif 
if (i<changes.size()-1) then (yes) 
:drawHLine(ug,pt,len);
endif 
if (changes.get(changes.size()-1).isCompletelyHidden()==false) then (yes) 
:drawHLine(ug,pt,len);
endif 
end
