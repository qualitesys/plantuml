start
note right
void drawPart1(UGraphicug,doublefullAvailableWidth)
end note
:ug=ug.apply(UTranslate.dy(getHeightForConstraints(stringBounder)));
if (compact) then (yes) 
:title.drawU(ug.apply(UTranslate.dy(dy)));
endif 
if (initialState!=null ) then (yes) 
:width+=getInitialWidth();
endif 
if (fullAvailableWidth>width+5) then (yes) 
:ug=ug.apply(UTranslate.dx(fullAvailableWidth-width-5));
else (no)
:ug=ug.apply(UTranslate.dx(fullAvailableWidth-width));
endif 
:label.drawU(ug.apply(UTranslate.dy(yOfState(state)-dim.getHeight()/2+
1)));
end
