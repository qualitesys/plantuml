@startuml
!pragma layout smetana
start
note right
constructor Histogram(TimingRulerruler,ISkinParamskinParam,
Collection<String>someStates,booleancompact,
TextBlocktitle,intsuggestedHeight,Stylestyle,
Stylestyle0)
end note
:this.style=style;
:this.style0=style0;
:this.suggestedHeight=suggestedHeight;
:this.ruler=ruler;
:this.skinParam=skinParam;
:this.allStates=new ArrayList<>(someStates);
:this.compact=compact;
:this.title=title;
:Collections.reverse(allStates);
end
start
note right
IntricatedPointgetTimeProjection(StringBounderstringBounder,
TimeTicktick)
end note
if (states.size()==0) then (yes) 
:return null ;;
stop
endif 
if (states.size()==1) then (yes) 
:return new IntricatedPoint(new XPoint2D(x,
y),new XPoint2D(x,y));;
stop
endif 
:return new IntricatedPoint(new XPoint2D(x,
y1),new XPoint2D(x,y2));;
stop
end
start
note right
List<String>getStatesAt(TimeTicktick)
end note
if (changes.size()==0) then (yes) 
:return Collections.emptyList();;
stop
endif 
:i++;
if (tickWithCurrentChangeTimeComparisonResult==0) then (yes) 
if (i==0&&initialState==null ) then (yes) 
:return Arrays.asList(changes.get(i).getState());;
stop
endif 
if (i==0&&initialState!=null ) then (yes) 
:return Arrays.asList(initialState,changes.get(i)
.getState());;
stop
endif 
:return Arrays.asList(changes.get(i-1).getState(),
changes.get(i).getState());;
stop
endif 
if (tickWithCurrentChangeTimeComparisonResult>0) then (yes) 
if (i==0) then (yes) 
:changeIndex=0;
else (no)
:changeIndex=i-1;
endif 
:return Collections.singletonList(changes.get(changeIndex)
.getState());;
stop
endif 
:return Collections.singletonList(changes.get(changes.size()-1)
.getState());;
stop
end
start
note right
void addChange(ChangeStatechange)
end note
:changes.add(change);
if (change.isCompletelyHidden()) then (yes) 
:return ;;
stop
endif 
if (allStates.contains(state)==false) then (yes) 
:allStates.add(state);
endif 
end
start
note right
XPoint2D[]getPoints(intn)
end note
if (states.size()==2) then (yes) 
:return new XPoint2D[]{new XPoint2D(x,yOfState(states.get(0))),
new XPoint2D(x,yOfState(states.get(1)))};;
stop
endif 
:return new XPoint2D[]{new XPoint2D(x,yOfState(states.get(0)))};;
