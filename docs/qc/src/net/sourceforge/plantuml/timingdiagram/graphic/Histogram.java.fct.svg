:i++;
if (changes.get(i-1).isCompletelyHidden()||changes.get(i)
.isCompletelyHidden()) then (yes) 
endif 
:ug.apply(new UTranslate(getPointx(i),minY))
.draw(ULine.vline(maxY-minY));
end
start
note right
void drawLabels(UGraphicug)
end note
:i++;
if (comment==null ) then (yes) 
endif 
:label.drawU(ug.apply(new UTranslate(ptLabel).compose(new UTranslate(2,
-dim.getHeight()))));
