@startuml
!pragma layout smetana
start
note right
constructor PlayerBinary(Stringcode,ISkinParamskinParam,
TimingRulerruler,booleancompact,Stereotypestereotype)
end note
:super (code,skinParam,ruler,compact,stereotype);
:this.suggestedHeight=30;
end
start
note right
doublegetHeightForConstraints(StringBounderstringBounder)
end note
:return TimeConstraint.getHeightForConstraints(stringBounder,
constraints);;
stop
end
start
note right
doublegetFullHeight(StringBounderstringBounder)
end note
:return getHeightForConstraints(stringBounder)+
suggestedHeight;;
stop
end
start
note right
StyleSignaturegetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.timingDiagram,SName.binary)
.withTOBECHANGED(stereotype);;
stop
end
start
note right
IntricatedPointgetTimeProjection(StringBounderstringBounder,
TimeTicktick)
end note
:return new IntricatedPoint(new XPoint2D(x,
getYpos(stringBounder,HIGH_STRING)),new XPoint2D(x,
getYpos(stringBounder,HIGH_STRING)));;
stop
end
start
note right
void addNote(TimeTicknow,Displaynote,Positionposition)
end note
:throw new UnsupportedOperationException();;
end
start
note right
void defineState(StringstateCode,Stringlabel)
end note
:throw new UnsupportedOperationException();;
end
start
note right
void setState(TimeTicknow,Stringcomment,Colorscolor,
String... states)
end note
if (now==null ) then (yes) 
:this.initialState=cs;
else (no)
:this.values.put(now,cs);
endif 
end
start
note right
String[]convert(String[]states)
end note
if (states.length==1) then (yes) 
:return new String[]{convert(states[0])};;
stop
endif 
:return new String[]{convert(states[0]),convert(states[1])};;
stop
end
start
note right
Stringconvert(Stringvalue)
end note
if (String.valueOf("1").equals(value)||String.valueOf("high")
.equalsIgnoreCase(value)) then (yes) 
:return HIGH_STRING;;
stop
endif 
:return LOW_STRING;;
stop
end
start
note right
void createConstraint(TimeTicktick1,TimeTicktick2,
Stringmessage,ArrowConfigurationconfig)
end note
:this.constraints.add(new TimeConstraint(tick1,
tick2,message,skinParam,config));
end
start
note right
doublegetYpos(StringBounderstringBounder,
Stringstate)
end note
if (state.equalsIgnoreCase(LOW_STRING)) then (yes) 
:return getYlow(stringBounder);;
stop
endif 
:return getYhigh(stringBounder);;
stop
end
start
note right
doublegetYlow(StringBounderstringBounder)
end note
:return getFullHeight(stringBounder)-ymargin;;
stop
end
start
note right
doublegetYhigh(StringBounderstringBounder)
end note
:return ymargin+getHeightForConstraints(stringBounder);;
stop
end
start
note right
TextBlockgetPart1(doublefullAvailableWidth,
doublespecialVSpace)
end note
:return new AbstractTextBlock(){public void drawU(UGraphicug){final StringBounderstringBounder=ug.getStringBounder();
:final TextBlocktitle=getTitle();final XDimension2Ddim=title.calculateDimension(stringBounder);
:final doubley=(getFullHeight(stringBounder)-dim.getHeight())/2;
:title.drawU(ug.apply(UTranslate.dy(y)));
:}public XDimension2DcalculateDimension(StringBounderstringBounder){final XDimension2Ddim=getTitle()
.calculateDimension(stringBounder);return XDimension2D.delta(dim,
5,0);}};;
stop
end
start
note right
UDrawablegetPart2()
end note
:return new UDrawable(){public void drawU(UGraphicug){ug=getContext().apply(ug);
:doublelastx=0;List<String>lastValues=initialState==null ? Collections.singletonList(LOW_STRING):initialState.getStates();final StringBounderstringBounder=ug.getStringBounder();final doubleyhigh=getYhigh(stringBounder);final doubleylow=getYlow(stringBounder);final ULinevline=ULine.vline(ylow-yhigh);for (Map.Entry<TimeTick,ChangeState>ent:values.entrySet()){final ChangeStatevalue=ent.getValue();final doublex=ruler.getPosInPixel(ent.getKey());if (lastValues.size()==1)ug.apply(new UTranslate(lastx,getYpos(stringBounder,lastValues.get(0)))).draw(ULine.hline(x-lastx));else for (doubletmpx=lastx;tmpx<x;tmpx+=5)ug.apply(new UTranslate(tmpx,yhigh)).draw(vline);if (lastValues.equals(value.getStates())==false)ug.apply(new UTranslate(x,yhigh)).draw(vline);if (value.getComment()!=null ){final TextBlocklabel=getTextBlock(value.getComment());label.drawU(ug.apply(new UTranslate(x+2,yhigh)));}lastx=x;lastValues=value.getStates();}ug.apply(new UTranslate(lastx,getYpos(stringBounder,lastValues.get(0)))).draw(ULine.hline(ruler.getWidth()-lastx));drawConstraints(ug.apply(UTranslate.dy(getHeightForConstraints(ug.getStringBounder()))));}};;
stop
end
start
note right
FontConfigurationgetCommentFontConfiguration()
end note
:return FontConfiguration.create(skinParam,
getStyleSignature().getMergedStyle(skinParam.getCurrentStyleBuilder()));;
stop
end
start
note right
TextBlockgetTextBlock(Stringvalue)
end note
:return display.create(getCommentFontConfiguration(),
HorizontalAlignment.LEFT,skinParam);;
stop
end
start
note right
void drawConstraints(final UGraphicug)
end note
:constraint.drawU(ug,ruler);
end
@enduml

