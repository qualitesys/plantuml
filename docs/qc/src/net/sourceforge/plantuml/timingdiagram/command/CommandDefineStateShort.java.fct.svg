@startuml
!pragma layout smetana
start
note right
constructor CommandDefineStateShort()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandDefineStateShort.class .getName(),
RegexLeaf.start(),new RegexLeaf("PLAYER",
"([%pLN_.@]+)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("has"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("STATE","([%pLN_.@]+)"),new RegexLeaf("STATES",
"((,([%pLN_.@]+))*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TimingDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (player==null ) then (yes) 
:return CommandExecutionResult.error("Unknown "+playerCode);;
stop
endif 
:player.defineState(stateCode,stateCode);
if (states!=null ) then (yes) 
:player.defineState(token,token);
endif 
:return CommandExecutionResult.ok();;
stop
end
@enduml

