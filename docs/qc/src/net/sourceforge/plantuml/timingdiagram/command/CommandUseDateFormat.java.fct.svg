@startuml
!pragma layout smetana
start
note right
constructor CommandUseDateFormat()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandUseDateFormat.class .getName(),
RegexLeaf.start(),new RegexLeaf("use"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("date"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("format"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("FORMAT","[%g]([^%g]+)[%g]"),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TimingDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.useDateFormat(format);;
stop
end
@enduml

