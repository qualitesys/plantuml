@startuml
!pragma layout smetana
start
note right
constructor CommandDefineStateLong()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandDefineStateLong.class .getName(),
RegexLeaf.start(),new RegexLeaf("PLAYER",
"([%pLN_.@]+)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("has"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("LABEL","[%g]([^%g]+)[%g]"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("as"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("STATE",
"([%pLN_.@]+)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TimingDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (player==null ) then (yes) 
:return CommandExecutionResult.error("Unknown "+playerCode);;
stop
endif 
:player.defineState(stateCode,label);
:return CommandExecutionResult.ok();;
stop
end
@enduml

