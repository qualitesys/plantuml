@startuml
!pragma layout smetana
start
note right
constructor CommandNoteLong()
end note
:super (getRegexConcat(),MultilinesStrategy.REMOVE_STARTING_QUOTE,
Trim.BOTH);;
end
start
note right
StringgetPatternEnd()
end note
:return "^end[%s]?note$";;
stop
end
start
note right
CommandExecutionResultexecuteNow(final TimingDiagramdiagram,
BlocLineslines)
end note
:lines=lines.subExtract(1,1);;
:lines=lines.removeEmptyColumns();;
if (player==null ) then (yes) 
:return CommandExecutionResult.error("Unkown \""+
code+"\"");;
stop
endif 
:player.addNote(now,note,Position.fromString(line0.get("POSITION",
0)));;
:return CommandExecutionResult.ok();;
stop
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandNoteLong.class .getName(),
RegexLeaf.start(),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("note"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("POSITION","(top|bottom)"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("of"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("CODE",
CommandTimeMessage.PLAYER_CODE),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
@enduml

