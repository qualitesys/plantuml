@startuml
!pragma layout smetana
start
note right
constructor CommandAtPlayer()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandAtPlayer.class .getName(),
RegexLeaf.start(),new RegexLeaf("@"),new RegexLeaf("PLAYER",
CommandTimeMessage.PLAYER_CODE),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TimingDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
if (player==null ) then (yes) 
:return CommandExecutionResult.error("No such participant "+
code);;
stop
endif 
:diagram.setLastPlayer(player);
:return CommandExecutionResult.ok();;
stop
end
@enduml

