@startuml
!pragma layout smetana
start
note right
constructor CommandTimeMessage()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandTimeMessage.class .getName(),
RegexLeaf.start(),new RegexLeaf("PART1",PLAYER_CODE),
TimeTickBuilder.optionalExpressionAtWithArobase("TIME1"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("ARROW_BODY",
"(-+)"),new RegexLeaf("ARROW_STYLE","(?:\\[("+CommandLinkElement.LINE_STYLE+")\\])?"),new RegexLeaf("ARROW_HEAD","\\>"),RegexLeaf.spaceZeroOrMore(),new RegexLeaf("PART2",PLAYER_CODE),TimeTickBuilder.optionalExpressionAtWithArobase("TIME2"),RegexLeaf.spaceZeroOrMore(),new RegexOptional(new RegexConcat(new RegexLeaf(":"),RegexLeaf.spaceZeroOrMore(),new RegexLeaf("MESSAGE","(.*)"))),RegexLeaf.spaceZeroOrMore(),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TimingDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (player1==null ) then (yes) 
:return CommandExecutionResult.error("No such element: "+arg.get("PART1",
0));;
stop
