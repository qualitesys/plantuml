@startuml
!pragma layout smetana
start
note right
constructor CommandBinary()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandBinary.class .getName(),
RegexLeaf.start(),new RegexOptional(new RegexConcat(new RegexLeaf("COMPACT",
"(compact)"),RegexLeaf.spaceOneOrMore())),
new RegexLeaf("binary"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("FULL","[%g]([^%g]+)[%g]"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("STEREOTYPE",
"(\\<\\<.*\\>\\>)?"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("as"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("CODE","([%pLN_.@]+
)"),RegexLeaf.spaceZeroOrMore(),new RegexLeaf("STEREOTYPE2",
"(\\<\\<.*\\>\\>)?"),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TimingDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (arg.get("STEREOTYPE",0)!=null ) then (yes) 
:stereotype=Stereotype.build(arg.get("STEREOTYPE",0));
endif 
:return diagram.createBinary(code,full,compact!=null ,
stereotype);;
stop
end
@enduml

