@startuml
!pragma layout smetana
start
note right
constructor CommandTicks()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandTicks.class .getName(),
RegexLeaf.start(),new RegexLeaf("PLAYER","([%pLN_.@]+
)"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("ticks"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("num"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("on"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("multiple"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("NUM","([0-9]+
)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TimingDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (player==null ) then (yes) 
:return CommandExecutionResult.error("No such participant "+
code);;
stop
