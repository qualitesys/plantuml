@startuml
!pragma layout smetana
start
note right
constructor CommandPixelHeight()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandPixelHeight.class .getName(),
RegexLeaf.start(),new RegexLeaf("PLAYER",
"([%pLN_.@]+)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("is"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("NUM","([0-9]+)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("pixels?"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("height"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TimingDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (player==null ) then (yes) 
:return CommandExecutionResult.error("No such participant "+code);;
stop
endif 
:player.setHeight(Integer.parseInt(arg.get("NUM",
0)));
:return CommandExecutionResult.ok();;
stop
end
@enduml

