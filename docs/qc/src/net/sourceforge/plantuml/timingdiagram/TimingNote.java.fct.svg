@startuml
!pragma layout smetana
start
note right
constructor TimingNote(TimeTickwhen,Playerplayer,
Displaynote,Positionposition,ISkinParamskinParam,
Stylestyle)
end note
end
start
note right
void drawU(UGraphicug)
end note
if (position==Position.BOTTOM) then (yes) 
endif 
end
start
note right
OpalecreateOpale()
end note
:return opale;;
stop
end
start
note right
doublegetHeight(StringBounderstringBounder)
end note
:return createOpale().calculateDimension(stringBounder).getHeight()+
getMarginY();;
stop
end
start
note right
doublegetMarginY()
end note
:return 10;;
stop
end
start
note right
TimeTickgetWhen()
end note
:return when;;
stop
end
start
note right
PositiongetPosition()
end note
:return position;;
stop
end
@enduml

