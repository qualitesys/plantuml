@startuml
!pragma layout smetana
start
note right
void convert(FilesvgFile,FilepdfFile)
end note
if (svgFile.exists()==false) then (yes) 
:throw new IllegalArgumentException();;
endif 
:pdfFile.delete();
if (pdfFile.exists()) then (yes) 
:throw new IllegalStateException();;
endif 
:System.setProperty("log4j.debug","false");
:setDestinationType.invoke(converter,pdf);
:setSources.invoke(converter,new Object[]{path});
:setDst.invoke(converter,new Object[]{pdfFile});
:execute.invoke(converter);
:Logme.error(e);
:throw new UnsupportedOperationException();;
if (pdfFile.exists()==false) then (yes) 
:throw new IllegalStateException();;
endif 
end
@enduml

