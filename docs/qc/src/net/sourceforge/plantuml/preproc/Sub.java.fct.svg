@startuml
!pragma layout smetana
start
note right
constructor Sub(Stringname)
end note
:this.name=name;;
end
start
note right
StringtoString()
end note
:return super .toString()+" "+name;;
stop
end
start
note right
void add(StringLocateds)
end note
:this.lines.add(s);;
end
start
note right
List<StringLocated>lines()
end note
:return Collections.unmodifiableList(lines);;
stop
end
start
note right
SubfromFile(ReadLinereader,Stringblocname,
TContextcontext,TMemorymemory)
end note
:Subresult=null ;;
:StringLocateds=null ;;
:booleanskip=false;;
:while ((s=reader.readLine())!=null ){final TLineTypetype=s.getTrimmed().getType();if (type==TLineType.STARTSUB){final EaterStartsubeater=new EaterStartsub(s.getTrimmed());eater.analyze(context,
memory);if (eater.getSubname().equals(blocname)){skip=false;if (result==null ){result=new Sub(blocname);}}continue ;}if (type==TLineType.ENDSUB&&result!=null ){skip=true;}if (result!=null &&skip==false){result.add(s);}};
:return result;;
stop
end
@enduml

