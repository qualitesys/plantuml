@startuml
!pragma layout smetana
start
note right
constructor DefineVariable(Stringname)
end note
if (idx==-1) then (yes) 
else (no)
endif 
end
start
note right
StringgetName()
end note
:return name;;
stop
end
start
note right
StringgetDefaultValue()
end note
:return defaultValue;;
stop
end
start
note right
DefineVariableremoveDefault()
end note
if (defaultValue==null ) then (yes) 
:throw new IllegalStateException();;
endif 
:return new DefineVariable(name);;
stop
end
@enduml

