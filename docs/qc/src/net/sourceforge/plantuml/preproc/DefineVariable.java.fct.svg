05,232.75,901.2305" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[64167bd7c06800c4f280e27e7b43338c]
@startuml
!pragma layout smetana
start
note right
constructor DefineVariable(Stringname)
end note
:name=name.trim();;
if (idx==-1) then (yes) 
:this.name=name;;
:this.defaultValue=null ;;
else (no)
:this.name=name.substring(0,idx).trim();;
:this.defaultValue=right.substring(1,right.length()-1);;
endif 
end
start
note right
StringgetName()
end note
:return name;;
stop
end
start
note right
StringgetDefaultValue()
end note
:return defaultValue;;
stop
end
start
note right
DefineVariableremoveDefault()
end note
if (defaultValue==null ) then (yes) 
:throw new IllegalStateException();;
stop
endif 
:return new DefineVariable(name);;
stop
end
@enduml

