@startuml
!pragma layout smetana
start
note right
constructor DefineSignature(Stringkey,StringdefinitionQuoted)
end note
:this.key=key;;
:this.isMethod=key.contains("(");;
:this.fonctionName=st.nextToken().trim();;
:while (st.hasMoreTokens()){final Stringvar1=st.nextToken().trim();
:master.add(new DefineVariable(var1));};
:variables.add(master.removeSomeDefaultValues(i));;
end
start
note right
StringtoString()
end note
:return key+"/"+fonctionName;;
stop
end
start
note right
booleanisMethod()
end note
:return isMethod;;
stop
end
start
note right
StringgetKey()
end note
:return key;;
stop
end
start
note right
List<Variables>getVariationVariables()
end note
:return Collections.unmodifiableList(variables);;
stop
end
start
note right
StringgetFonctionName()
end note
:return fonctionName;;
stop
end
@enduml

