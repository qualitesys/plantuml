@startuml
!pragma layout smetana
start
note right
constructor DefineSignature(Stringkey,StringdefinitionQuoted)
end note
while (st.hasMoreTokens())
endwhile
end
start
note right
StringtoString()
end note
:return key+"/"+fonctionName;;
stop
end
start
note right
booleanisMethod()
end note
:return isMethod;;
stop
end
start
note right
StringgetKey()
end note
:return key;;
stop
end
start
note right
List<Variables>getVariationVariables()
end note
:return Collections.unmodifiableList(variables);;
stop
end
start
note right
StringgetFonctionName()
end note
:return fonctionName;;
stop
end
@enduml

