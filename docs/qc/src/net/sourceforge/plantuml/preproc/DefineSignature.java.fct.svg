@startuml
!pragma layout smetana
start
note right
constructor DefineSignature(Stringkey,StringdefinitionQuoted)
end note
:this.key=key;;
:this.isMethod=key.contains("(");;
:final StringTokenizerst=new StringTokenizer(key,
"(),");;
:this.fonctionName=st.nextToken().trim();;
:final Variablesmaster=new Variables(fonctionName,
definitionQuoted);;
:while (st.hasMoreTokens()){final Stringvar1=st.nextToken().trim();
:master.add(new DefineVariable(var1));};
:final intcount=master.countDefaultValue();;
:variables.add(master.removeSomeDefaultValues(i));;
end
start
note right
StringtoString()
end note
:return key+"/"+fonctionName;;
stop
end
start
note right
booleanisMethod()
end note
:return isMethod;;
stop
end
start
note right
StringgetKey()
end note
:return key;;
stop
end
start
note right
List<Variables>getVariationVariables()
end note
:return Collections.unmodifiableList(variables);;
stop
end
start
note right
StringgetFonctionName()
end note
:return fonctionName;;
stop
end
@enduml

