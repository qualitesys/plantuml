@startuml
!pragma layout smetana
start
note right
constructor UncommentReadLine(ReadLinesource)
end note
:this.raw=source;
end
start
note right
StringLocatedreadLine()
end note
if (result==null ) then (yes) 
:return null ;;
stop
endif 
if (tmp!=null ) then (yes) 
:headerToRemove=tmp;
endif 
if (paused) then (yes) 
if (m2.find()) then (yes) 
:headerToRemove=m2.group(1);
endif 
endif 
if (headerToRemove!=null &&headerToRemove.startsWith(result.getString())) then (yes) 
:return new StringLocated("",result.getLocation());;
stop
endif 
if (headerToRemove!=null &&result.getString()
.startsWith(headerToRemove)) then (yes) 
:return result.substring(headerToRemove.length(),
result.getString().length());;
stop
endif 
:return result;;
stop
end
start
note right
void close()
end note
:this.raw.close();
end
start
note right
void setPaused(booleanpaused)
end note
:this.paused=paused;
end
@enduml

