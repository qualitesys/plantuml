@startuml
!pragma layout smetana
start
note right
constructor ActivityBox(Tiletile,Stringid,
Stringlabel)
end note
:this.tile=tile;;
:this.id=id;;
:this.label=label;;
:tb=Display.create(label).create(fc,HorizontalAlignment.LEFT,
new SpriteContainerEmpty());;
end
start
note right
TilegetTile()
end note
:return tile;;
stop
end
start
note right
StringgetId()
end note
:return id;;
stop
end
start
note right
StringgetLabel()
end note
:return label;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(HColors.MY_RED);;
:ug=ug.apply(HColors.MY_YELLOW.bg());;
:ug.apply(new UStroke(1.5)).draw(rect);;
:tb.drawU(ug.apply(new UTranslate(MARGIN,
MARGIN)));;
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.delta(dim,2*MARGIN,2*MARGIN);;
stop
end
@enduml

