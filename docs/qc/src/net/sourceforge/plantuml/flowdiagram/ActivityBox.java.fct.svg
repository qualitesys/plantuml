note right
constructor ActivityBox(Tiletile,Stringid,
Stringlabel)
end note
end
start
note right
TilegetTile()
end note
:return tile;;
stop
end
start
note right
StringgetId()
end note
:return id;;
stop
end
start
note right
StringgetLabel()
end note
:return label;;
stop
end
start
note right
void drawU(UGraphicug)
end note
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.delta(dim,2*MARGIN,2*MARGIN);;
stop
end
@enduml

