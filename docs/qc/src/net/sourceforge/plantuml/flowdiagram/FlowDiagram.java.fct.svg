@startuml
!pragma layout smetana
start
note right
XRectangle2DgetInnerPosition(Stringmember,
StringBounderstringBounder,InnerStrategystrategy)
end note
:throw new UnsupportedOperationException();;
stop
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("Flow Diagram");;
stop
end
start
note right
constructor FlowDiagram(UmlSourcesource)
end note
:super (source,UmlDiagramType.FLOW,null );;
end
start
note right
void lineSimple(TileGeometryorientation,StringidDest,
Stringlabel)
end note
:final TilenewTile;;
if (field==null ) then (yes) 
:field=new TilesField();;
:tilesBoxes.clear();;
:newTile=field.getRoot();;
else (no)
:newTile=field.createTile(lastTile,orientation);;
endif 
:final ActivityBoxbox=new ActivityBox(newTile,
idDest,label);;
:tilesBoxes.put(newTile,box);;
:lastTile=newTile;;
:return ;;
stop
end
start
note right
void linkSimple(TileGeometryorientation,StringidDest)
end note
:final Tiletile=getTileById(idDest);;
:field.addPath(lastTile,tile,orientation);;
end
start
note right
TilegetTileById(Stringid)
end note
if (ent.getValue().getId().equals(id)) then (yes) 
:return ent.getKey();;
stop
endif 
:throw new IllegalArgumentException(id);;
stop
end
start
note right
ImageBuildercreateImageBuilder(FileFormatOptionfileFormatOption)
end note
:return imageBuilder(fileFormatOption).dimension(calculateDimension(fileFormatOption.getDefaultStringBounder(getSkinParam())))
.margin(getDefaultMargins()).metadata(fileFormatOption.isWithMetadata()? getMetadata():null ).seed(seed());;
stop
end
start
note right
ImageDataexportDiagramInternal(OutputStreamos,
intindex,FileFormatOptionfileFormatOption)
end note
:return createImageBuilder(fileFormatOption)
.drawable(this).write(os);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:doublex=0;;
:doubley=0;;
:final MinMaxGolemminMax=getMinMax();;
:x-=minMax.getMinX()*SINGLE_SIZE_X;;
:y-=minMax.getMinY()*SINGLE_SIZE_Y;;
:final StringBounderstringBounder=ug.getStringBounder();;
:final Tiletile=ent.getKey();;
:final Positionpos=field.getPosition(tile);;
:final intxmin=pos.getXmin();;
:final intymin=pos.getYmin();;
:final ActivityBoxbox=ent.getValue();;
:final XDimension2DdimBox=box.calculateDimension(stringBounder);;
:final doubledeltaX=SINGLE_SIZE_X*2-dimBox.getWidth();;
:final doubledeltaY=SINGLE_SIZE_Y*2-dimBox.getHeight();;
:box.drawU(ug.apply(new UTranslate((x+xmin*SINGLE_SIZE_X+
deltaX/2),(y+ymin*SINGLE_SIZE_Y+deltaY/2))));;
:ug=ug.apply(HColors.MY_RED);;
:ug=ug.apply(HColors.MY_RED.bg());;
:final UShapearrow=new UEllipse(7,7);;
:final TileAreastart=p.getStart();;
:final TileAreadest=p.getDest();;
:final XPoint2DpStart=movePoint(getCenter(start),
start.getTile(),start.getGeometry(),stringBounder);;
:final XPoint2DpDest=movePoint(getCenter(dest),
dest.getTile(),dest.getGeometry(),stringBounder);;
:final ULineline=new ULine(pDest.getX()-pStart.getX(),
pDest.getY()-pStart.getY());;
:ug.apply(new UTranslate(x+pStart.getX(),y+
pStart.getY())).draw(line);;
:ug.apply(new UTranslate(x+pDest.getX()-3,y+
pDest.getY()-3)).draw(arrow);;
end
start
note right
XPoint2DgetCenter(TileAreaarea)
end note
:final Tiletile=area.getTile();;
:final Positionposition=field.getPosition(tile);;
:final doublex=position.getCenterX();;
:final doubley=position.getCenterY();;
:return new XPoint2D(x*SINGLE_SIZE_X,y*SINGLE_SIZE_Y);;
stop
end
start
note right
XPoint2DmovePoint(XPoint2Dpt,Tiletile,TileGeometrytileGeometry,
StringBounderstringBounder)
end note
:final XDimension2Ddim=tilesBoxes.get(tile)
.calculateDimension(stringBounder);;
:final doublewidth=dim.getWidth();;
:final doubleheight=dim.getHeight();;
:doublex=pt.getX();;
:doubley=pt.getY();;
switch (switch (tileGeometry))
endswith
:return new XPoint2D(x,y);;
stop
end
start
note right
MinMaxGolemgetMinMax()
end note
:final MinMaxGolemminMax=new MinMaxGolem();;
:minMax.manage(field.getPosition(tile));;
:return minMax;;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:final MinMaxGolemminMax=getMinMax();;
:return new XDimension2D(minMax.getWidth()*SINGLE_SIZE_X,
minMax.getHeight()*SINGLE_SIZE_Y);;
stop
end
start
note right
MinMaxgetMinMax(StringBounderstringBounder)
end note
:throw new UnsupportedOperationException();;
stop
end
start
note right
ClockwiseTopRightBottomLeftgetDefaultMargins()
end note
:return ClockwiseTopRightBottomLeft.same(0);;
stop
end
@enduml

