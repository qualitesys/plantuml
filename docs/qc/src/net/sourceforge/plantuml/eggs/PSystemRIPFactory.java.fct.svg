@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,
Stringline)
end note
if (line.equalsIgnoreCase("jean canouet")) then (yes) 
:try ;
:return new PSystemRIP(source);;
stop
:catch (IOExceptione);
:Log.error("Error "+e);;
:Logme.error(e);;
endif 
:return null ;;
stop
end
@enduml

