@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,
Stringline)
end note
if (line.equalsIgnoreCase("jean canouet")) then (yes) 
:return new PSystemRIP(source);;
stop
:Log.error("Error "+e);
:Logme.error(e);
endif 
:return null ;;
stop
end
@enduml

