@startuml
!pragma layout smetana
start
note right
constructor SentenceDecoder(Stringsentence1,
byte[]crypted)
end note
:this.secret=new String(sen2,UTF_8);;
end
start
note right
booleanisOk()
end note
if ((int)c>256) then (yes) 
:return false;;
stop
endif 
if (Character.isDefined(c)==false) then (yes) 
:return false;;
stop
