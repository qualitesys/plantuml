@startuml
!pragma layout smetana
start
note right
AbstractPSystemexecuteLine(UmlSourcesource,
Stringline)
end note
if (m.find()==false) then (yes) 
:return null ;;
stop
endif 
:return new PSystemPath(source,m.group(1));;
stop
end
@enduml

