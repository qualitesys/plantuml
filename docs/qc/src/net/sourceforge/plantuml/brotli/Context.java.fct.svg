end note
:++i;
:lookup[i]=i&0x3F;
:lookup[512+i]=i>>2;
:lookup[1792+i]=2+(i>>6);
:++i;
:lookup[1024+i]=4*(map.charAt(i)-32);
:++i;
:lookup[1152+i]=i&1;
:lookup[1216+i]=2+(i&1);
:++k;
:++i;
:lookup[offset++]=value;
:++i;
:lookup[1792+i]=1;
:lookup[2032+i]=6;
:lookup[1792]=0;
:lookup[2047]=7;
:++i;
:lookup[1536+i]=lookup[1792+i]<<3;
end
:unpackLookupTable(LOOKUP,UTF_MAP,UTF_RLE);
@enduml

