@startuml
!pragma layout smetana
start
note right
void fillBytesWithZeroes(byte[]dest,intstart,
intend)
end note
:while (cursor<end){intstep=Math.min(cursor+
1024,end)-cursor;System.arraycopy(BYTE_ZEROES,0,dest,cursor,step);cursor+
=step;};
end
start
note right
void fillIntsWithZeroes(int[]dest,intstart,
intend)
end note
:while (cursor<end){intstep=Math.min(cursor+
1024,end)-cursor;System.arraycopy(INT_ZEROES,0,dest,cursor,step);cursor+
=step;};
end
start
note right
void copyBytesWithin(byte[]bytes,inttarget,
intstart,intend)
end note
:System.arraycopy(bytes,start,bytes,target,
end-start);;
end
start
note right
intreadInput(InputStreamsrc,byte[]dst,intoffset,
intlength)
end note
:try {return src.read(dst,offset,length);}catch (IOExceptione){throw new BrotliRuntimeException("Failed to read input",
e);};
end
start
note right
void closeInput(InputStreamsrc)
end note
:src.close();;
end
@enduml

