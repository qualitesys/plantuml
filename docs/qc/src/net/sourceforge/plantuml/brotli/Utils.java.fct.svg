@startuml
!pragma layout smetana
start
note right
void fillBytesWithZeroes(byte[]dest,intstart,
intend)
end note
:intcursor=start;;
while (cursor<end)
:intstep=Math.min(cursor+1024,end)-cursor;;
:System.arraycopy(BYTE_ZEROES,0,dest,cursor,
step);;
:cursor+=step;;
endwhile
end
start
note right
void fillIntsWithZeroes(int[]dest,intstart,
intend)
end note
:intcursor=start;;
while (cursor<end)
:intstep=Math.min(cursor+1024,end)-cursor;;
:System.arraycopy(INT_ZEROES,0,dest,cursor,
step);;
:cursor+=step;;
endwhile
