@startuml
!pragma layout smetana
start
note right
constructor PointAndAngle(XPoint2Dpt,doubleangle)
end note
:this.pt=pt;
:this.angle=angle;
end
start
note right
XPoint2DgetPt()
end note
:return pt;;
stop
end
start
note right
doublegetAngle()
end note
:return angle;;
stop
end
start
note right
doublegetX()
end note
:return pt.getX();;
stop
end
start
note right
doublegetY()
end note
:return pt.getY();;
stop
end
@enduml

