tyle="stroke:#181818;stroke-width:1.0;" x1="269.5" x2="269.5" y1="713.5313" y2="736.0977"/><polygon fill="#181818" points="265.5,726.0977,269.5,736.0977,273.5,726.0977,269.5,730.0977" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="269.5" x2="269.5" y1="862.4688" y2="882.4688"/><polygon fill="#181818" points="265.5,872.4688,269.5,882.4688,273.5,872.4688,269.5,876.4688" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="269.5" x2="269.5" y1="944.375" y2="964.375"/><polygon fill="#181818" points="265.5,954.375,269.5,964.375,273.5,954.375,269.5,958.375" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f3cc346c61b505510fa1de39c53ab41c]
@startuml
!pragma layout smetana
start
note right
constructor ClusterDecoration(PackageStylestyle,USymbolsymbol,TextBlocktitle,TextBlockstereo,ClusterPositionclusterPosition,UStrokestroke)
end note
:this.symbol=guess(symbol,style);
:this.stereo=stereo;
:this.title=title;
:this.clusterPosition=clusterPosition;
:this.defaultStroke=stroke;
end
start
note right
USymbolguess(USymbolsymbol,PackageStylestyle)
end note
if (symbol!=null ) then (yes) 
:return symbol;;
stop
endif 
:return style.toUSymbol();;
stop
end
start
note right
void drawU(UGraphicug,HColorbackColor,HColorborderColor,doubleshadowing,doubleroundCorner,HorizontalAlignmenttitleAlignment,HorizontalAlignmentstereoAlignment,doublediagonalCorner)
end note
if (symbol==null ) then (yes) 
:throw new UnsupportedOperationException();;
endif 
:symbol.asBig(title,titleAlignment,stereo,
clusterPosition.getWidth(),clusterPosition.getHeight(),
symbolContext,stereoAlignment).drawU(ug.apply(clusterPosition.getPosition()));
end
@enduml

