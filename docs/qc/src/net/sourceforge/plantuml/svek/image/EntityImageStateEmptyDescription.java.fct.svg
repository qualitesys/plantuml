@startuml
!pragma layout smetana
start
note right
constructor EntityImageStateEmptyDescription(IEntityentity,ISkinParamskinParam)
end note
:super (entity,skinParam);
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.atLeast(result,MIN_WIDTH,
MIN_HEIGHT);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (url!=null ) then (yes) 
:ug.startUrl(url);
endif 
:ug=applyColor(ug);
:ug=ug.apply(stroke);
:ug.draw(getShape(dimTotal));
:title.drawU(ug.apply(new UTranslate(xDesc,
yDesc)));
if (url!=null ) then (yes) 
:ug.closeUrl();
endif 
end
@enduml

