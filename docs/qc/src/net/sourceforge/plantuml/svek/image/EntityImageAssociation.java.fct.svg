@startuml
!pragma layout smetana
start
note right
constructor EntityImageAssociation(ILeafentity,ISkinParamskinParam,SNamesname)
end note
:super (entity,skinParam);
:this.sname=sname;
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(SIZE*2,SIZE*2);;
stop
end
start
note right
StylegetStyle()
end note
:return getStyleSignature().getMergedStyle(getSkinParam()
.getCurrentStyleBuilder());;
stop
end
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,sname,SName.diamond);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:diams.addPoint(SIZE,0);
:diams.addPoint(SIZE*2,SIZE);
:diams.addPoint(SIZE,SIZE*2);
:diams.addPoint(0,SIZE);
:diams.addPoint(SIZE,0);
:diams.setDeltaShadow(shadow);
:ug.apply(borderColor).apply(backgroundColor.bg())
.apply(stroke).draw(diams);
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.DIAMOND;;
stop
end
@enduml

