@startuml
!pragma layout smetana
start
note right
constructor EntityImageClass(ILeafentity,
ISkinParamskinParam,PortionShowerportionShower)
end note
:super (entity,entity.getColors().mute(skinParam));
:this.leafType=entity.getLeafType();
:this.lineConfig=entity;
:this.roundCorner=getStyle().value(PName.RoundCorner)
.asDouble();
:this.body=entity.getBodier().getBody(getSkinParam(),
showMethods,showFields,entity.getStereotype(),
getStyle(),null );
:this.header=new EntityImageClassHeader(entity,
getSkinParam(),portionShower);
:this.url=entity.getUrl99();
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
if (width<minClassWidth) then (yes) 
:width=minClassWidth;
endif 
if (width<paramSameClassWidth) then (yes) 
:width=paramSameClassWidth;
endif 
:return new XDimension2D(Math.max(width,getKalWidth()*1.3),
height);;
stop
end
start
note right
doublegetKalWidth()
end note
:widthUp+=kal.getDimension().getWidth();
:widthDown+=kal.getDimension().getWidth();
:return Math.max(widthUp,widthDown);;
stop
end
start
note right
XRectangle2DgetInnerPosition(Stringmember,
StringBounderstringBounder,InnerStrategystrategy)
end note
if (result==null ) then (yes) 
:return result;;
stop
endif 
:return translate.apply(result);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug.draw(new UComment("class "+getEntity()
.getCodeGetName()));
if (url!=null ) then (yes) 
:ug.startUrl(url);
endif 
:typeIDent.put(UGroupType.CLASS,"elem "+getEntity().getCode()+
" selected");
:typeIDent.put(UGroupType.ID,"elem_"+getEntity()
.getCode());
:ug.startGroup(typeIDent);
:drawInternal(ug);
:ug.closeGroup();
if (url!=null ) then (yes) 
:ug.closeUrl();
endif 
end
start
note right
StylegetStyle()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.classDiagram,SName.class_)
.withTOBECHANGED(getEntity().getStereotype())
.with(getEntity().getStereostyles()).getMergedStyle(getSkinParam()
.getCurrentStyleBuilder());;
stop
end
start
note right
StylegetStyleHeader()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.classDiagram,SName.class_,
SName.header).withTOBECHANGED(getEntity()
.getStereotype()).with(getEntity().getStereostyles())
.getMergedStyle(getSkinParam().getCurrentStyleBuilder());;
stop
end
start
note right
void drawInternal(UGraphicug)
end note
:shadow=getStyle().value(PName.Shadowing)
.asDouble();
if (borderColor==null ) then (yes) 
:borderColor=getStyle().value(PName.LineColor)
.asColor(getSkinParam().getIHtmlColorSet());
endif 
if (headerBackcolor==null ) then (yes) 
:headerBackcolor=backcolor==null ? getStyleHeader()
.value(PName.BackGroundColor).asColor(getSkinParam()
.getIHtmlColorSet()):backcolor;
endif 
if (backcolor==null ) then (yes) 
:backcolor=getStyle().value(PName.BackGroundColor)
.asColor(getSkinParam().getIHtmlColorSet());
endif 
:rect.setDeltaShadow(shadow);
:ug=ug.apply(borderColor);
:ug=ug.apply(backcolor.bg());
if (roundCorner==0&&headerBackcolor!=null &&backcolor.equals(headerBackcolor)==false) then (yes) 
:ug.apply(stroke).draw(rect);
:rect2.setDeltaShadow(0);
:ugHeader=ugHeader.apply(headerBackcolor.bg());
:ugHeader.apply(stroke).draw(rect2);
else (no)
:ug.apply(stroke).draw(rect);
endif 
:header.drawU(ugHeader,dimTotal.getWidth(),
dimHeader.getHeight());
if (body!=null ) then (yes) 
:body.drawU(ug2.apply(translate));
endif 
end
start
note right
PortsgetPorts(StringBounderstringBounder)
end note
if (body instanceof WithPorts) then (yes) 
:return ((WithPorts)body).getPorts(stringBounder)
.translateY(dimHeader.getHeight());;
stop
endif 
:return new Ports();;
stop
end
start
note right
ShapeTypegetShapeType()
end note
if (((ILeaf)getEntity()).getPortShortNames()
.size()>0) then (yes) 
:return ShapeType.RECTANGLE_HTML_FOR_PORTS;;
stop
endif 
:return ShapeType.RECTANGLE;;
stop
end
start
note right
MarginsgetShield(StringBounderstringBounder)
end note
:return ((ILeaf)getEntity()).getMargins();;
stop
end
start
note right
doublegetStartingX(StringBounderstringBounder,
doubley)
end note
:return 0;;
stop
end
start
note right
doublegetEndingX(StringBounderstringBounder,
doubley)
end note
:return calculateDimension(stringBounder)
.getWidth();;
stop
end
@enduml

