@startuml
!pragma layout smetana
start
note right
constructor Circle()
end note
end
start
note right
constructor Circle(XPoint2Dcenter)
end note
end
start
note right
constructor Circle(XPoint2Dp1,XPoint2Dp2)
end note
end
start
note right
CirclegetCircle(XPoint2Dp1,XPoint2Dp2,XPoint2Dp3)
end note
if (p3.getY()!=p2.getY()) then (yes) 
:return new Circle(p1,p2,p3);;
stop
endif 
:return new Circle(p2,p1,p3);;
stop
end
start
note right
constructor Circle(XPoint2Dp1,XPoint2Dp2,
XPoint2Dp3)
end note
end
start
note right
XPoint2DgetCenter()
end note
:return center;;
stop
end
start
note right
doublegetRadius()
end note
:return radius;;
stop
end
start
note right
booleanisOutside(XPoint2Dpoint)
end note
if (d>radius) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
@enduml

