@startuml
!pragma layout smetana
start
note right
constructor EntityImageClassHeader(ILeafentity,
ISkinParamskinParam,PortionShowerportionShower)
end note
:super (entity,skinParam);;
:final booleanitalic=entity.getLeafType()==LeafType.ABSTRACT_CLASS||entity.getLeafType()==LeafType.INTERFACE;;
:final Stereotypestereotype=entity.getStereotype();;
:final booleandisplayGenericWithOldFashion=skinParam.displayGenericWithOldFashion();;
:final Stringgeneric=displayGenericWithOldFashion? null :entity.getGeneric();;
:final Stylestyle=StyleSignatureBasic.of(SName.root,
SName.element,SName.classDiagram,SName.class_,
SName.header).withTOBECHANGED(stereotype).with(entity.getStereostyles()).getMergedStyle(skinParam.getCurrentStyleBuilder());;
:FontConfigurationfontConfigurationName=FontConfiguration.create(skinParam,
style,entity.getColors());;
if (italic) then (yes) 
:fontConfigurationName=fontConfigurationName.italic();;
endif 
:Displaydisplay=entity.getDisplay();;
if (displayGenericWithOldFashion&&entity.getGeneric()!=null ) then (yes) 
:display=display.addGeneric(entity.getGeneric());;
endif 
:TextBlockname=display.createWithNiceCreoleMode(fontConfigurationName,
HorizontalAlignment.CENTER,skinParam);;
:final VisibilityModifiermodifier=entity.getVisibilityModifier();;
if (modifier==null ) then (yes) 
:name=TextBlockUtils.withMargin(name,3,3,
0,0);;
else (no)
:final Roserose=new Rose();;
:final HColorback=rose.getHtmlColor(skinParam,
modifier.getBackground());;
:final HColorfore=rose.getHtmlColor(skinParam,
modifier.getForeground());;
:final TextBlockuBlock=modifier.getUBlock(skinParam.classAttributeIconSize(),
fore,back,false);;
:name=TextBlockUtils.mergeLR(uBlock,name,
VerticalAlignment.CENTER);;
:name=TextBlockUtils.withMargin(name,3,3,
0,0);;
endif 
:final TextBlockstereo;;
if (stereotype==null ||stereotype.getLabel(Guillemet.DOUBLE_COMPARATOR)==null ||portionShower.showPortion(EntityPortion.STEREOTYPE,
entity)==false) then (yes) 
:stereo=null ;;
else (no)
:stereo=TextBlockUtils.withMargin(Display.create(stereotype.getLabels(skinParam.guillemet())).create(FontConfiguration.create(getSkinParam(),
FontParam.CLASS_STEREOTYPE,stereotype),HorizontalAlignment.CENTER,
skinParam),1,0);;
endif 
:TextBlockgenericBlock;;
if (generic==null ) then (yes) 
:genericBlock=null ;;
else (no)
:genericBlock=Display.getWithNewlines(generic).create(FontConfiguration.create(getSkinParam(),
FontParam.CLASS_STEREOTYPE,stereotype),HorizontalAlignment.CENTER,
skinParam);;
:genericBlock=TextBlockUtils.withMargin(genericBlock,
1,1);;
:final HColorclassBackground=skinParam.getBackgroundColor();;
:final HColorclassBorder=style.value(PName.LineColor)
.asColor(skinParam.getIHtmlColorSet());;
:genericBlock=new TextBlockGeneric(genericBlock,
classBackground,classBorder);;
:genericBlock=TextBlockUtils.withMargin(genericBlock,
1,1);;
endif 
:final TextBlockcircledCharacter;;
if (portionShower.showPortion(EntityPortion.CIRCLED_CHARACTER,
(ILeaf)getEntity())) then (yes) 
:circledCharacter=TextBlockUtils.withMargin(getCircledCharacter(entity,
skinParam),4,0,5,5);;
else (no)
:circledCharacter=null ;;
endif 
:this.headerLayout=new HeaderLayout(circledCharacter,
stereo,name,genericBlock);;
end
start
note right
TextBlockgetCircledCharacter(ILeafentity,
ISkinParamskinParam)
end note
:final Stereotypestereotype=entity.getStereotype();;
if (stereotype!=null &&stereotype.getSprite(skinParam)!=null ) then (yes) 
:return stereotype.getSprite(skinParam);;
stop
endif 
:final UFontfont=SkinParamUtils.getFont(getSkinParam(),
FontParam.CIRCLED_CHARACTER,null );;
:final LeafTypeleafType=entity.getLeafType();;
:final Stylestyle=spotStyleSignature(leafType)
.getMergedStyle(skinParam.getCurrentStyleBuilder());;
:final HColorspotBorder=style.value(PName.LineColor)
.asColor(skinParam.getIHtmlColorSet());;
:final HColorspotBackColor=style.value(PName.BackGroundColor)
.asColor(skinParam.getIHtmlColorSet());;
:final HColorfontColor=style.value(PName.FontColor)
.asColor(skinParam.getIHtmlColorSet());;
if (stereotype!=null &&stereotype.getCharacter()!=0) then (yes) 
:return new CircledCharacter(stereotype.getCharacter(),
getSkinParam().getCircledCharacterRadius(),
font,stereotype.getHtmlColor(),spotBorder,
fontColor);;
stop
endif 
:charcircledChar=0;;
if (stereotype!=null ) then (yes) 
:circledChar=getSkinParam().getCircledCharacter(stereotype);;
endif 
if (circledChar==0) then (yes) 
:circledChar=getCircledChar(leafType);;
endif 
:return new CircledCharacter(circledChar,
getSkinParam().getCircledCharacterRadius(),
font,spotBackColor,spotBorder,fontColor);;
stop
end
start
note right
StyleSignatureBasicspotStyleSignature(LeafTypeleafType)
end note
switch (switch (leafType))
endswith
:throw new IllegalStateException();;
stop
end
start
note right
chargetCircledChar(LeafTypeleafType)
end note
switch (switch (leafType))
endswith
:assert false;;
:return '?';;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return headerLayout.getDimension(stringBounder);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:throw new UnsupportedOperationException();;
stop
end
start
note right
void drawU(UGraphicug,doublewidth,doubleheight)
end note
:headerLayout.drawU(ug,width,height);;
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.RECTANGLE;;
stop
end
