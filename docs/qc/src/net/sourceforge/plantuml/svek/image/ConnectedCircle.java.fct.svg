@startuml
!pragma layout smetana
start
note right
constructor ConnectedCircle(doubleradius)
end note
:this.radius=radius;
end
start
note right
void drawU(UGraphicug)
end note
:ug.draw(part);
:ug=ug.apply(HColors.GREEN).apply(HColors.GREEN.bg());
end
start
note right
void addSecondaryConnection(XPoint2Dpt)
end note
:points.add(pt);
:angle=angle*180.0/Math.PI;
:System.err.println("pt1="+pt+" "+angle);
:angles.add(angle);
end
@enduml

