@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "ContainingEllipse "+getWidth()+" "+
getHeight();;
stop
end
start
note right
constructor ContainingEllipse(doublecoefY)
end note
end
start
note right
void append(XPoint2Dpt)
end note
end
start
note right
void append(doublex,doubley)
end note
end
start
note right
doublegetWidth()
end note
:return 2*sec.getCircle().getRadius();;
stop
end
start
note right
doublegetHeight()
end note
:return 2*sec.getCircle().getRadius()*ytransformer.getAlpha();;
stop
end
start
note right
XPoint2DgetCenter()
end note
:return ytransformer.getPoint2D(sec.getCircle()
.getCenter());;
stop
end
start
note right
UEllipseasUEllipse()
end note
:return ellipse;;
stop
end
start
note right
void setDeltaShadow(doubledeltaShadow)
end note
end
@enduml

