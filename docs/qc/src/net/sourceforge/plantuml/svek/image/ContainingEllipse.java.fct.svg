-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="213.5" x2="213.5" y1="1389.8516" y2="1409.8516"/><polygon fill="#181818" points="209.5,1399.8516,213.5,1409.8516,217.5,1399.8516,213.5,1403.8516" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[54ae2116d0b5ccc1f4d095fc4754b5b0]
@startuml
!pragma layout smetana
start
note right
StringtoString()
end note
:return "ContainingEllipse "+getWidth()+" "+getHeight();;
stop
end
start
note right
constructor ContainingEllipse(doublecoefY)
end note
:ytransformer=new YTransformer(coefY);
end
start
note right
void append(XPoint2Dpt)
end note
:pt=ytransformer.getReversePoint2D(pt);
:sec.append(pt);
end
start
note right
void append(doublex,doubley)
end note
:append(new XPoint2D(x,y));
end
start
note right
doublegetWidth()
end note
:return 2*sec.getCircle().getRadius();;
stop
end
start
note right
doublegetHeight()
end note
:return 2*sec.getCircle().getRadius()*ytransformer.getAlpha();;
stop
end
start
note right
XPoint2DgetCenter()
end note
:return ytransformer.getPoint2D(sec.getCircle().getCenter());;
stop
end
start
note right
UEllipseasUEllipse()
end note
:ellipse.setDeltaShadow(deltaShadow);
:return ellipse;;
stop
end
start
note right
void setDeltaShadow(doubledeltaShadow)
end note
:this.deltaShadow=deltaShadow;
end
@enduml

