@startuml
!pragma layout smetana
start
note right
void append(XPoint2Dpt)
end note
if (all.contains(pt)==false) then (yes) 
:all.add(pt);
endif 
:this.lastSolution=null ;
end
start
note right
CirclegetCircle()
end note
if (lastSolution==null ) then (yes) 
:lastSolution=findSec(all.size(),all,0,new ArrayList<>(all));
endif 
:return lastSolution;;
stop
end
start
note right
CirclefindSec(intn,List<XPoint2D>p,intm,List<XPoint2D>b)
end note
if (m==1) then (yes) 
:sec=new Circle(b.get(0));
endif 
:i++;
if (sec.isOutside(p.get(i))) then (yes) 
:b.set(m,p.get(i));
:sec=findSec(i,p,m+1,b);
endif 
:return sec;;
stop
end
@enduml

