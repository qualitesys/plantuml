@startuml
!pragma layout smetana
start
note right
void append(XPoint2Dpt)
end note
if (all.contains(pt)==false) then (yes) 
endif 
end
start
note right
CirclegetCircle()
end note
if (lastSolution==null ) then (yes) 
endif 
:return lastSolution;;
stop
end
start
note right
CirclefindSec(intn,List<XPoint2D>p,intm,List<XPoint2D>b)
end note
if (m==1) then (yes) 
endif 
if (sec.isOutside(p.get(i))) then (yes) 
endif 
:return sec;;
stop
end
@enduml

