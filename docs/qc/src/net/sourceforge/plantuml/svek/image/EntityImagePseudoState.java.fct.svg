@startuml
!pragma layout smetana
start
note right
constructor EntityImagePseudoState(ILeafentity,ISkinParamskinParam,SNamesname)
end note
:this(entity,skinParam,"H",sname);
end
start
note right
StylegetStyle()
end note
:return getStyleSignature().getMergedStyle(getSkinParam().getCurrentStyleBuilder());;
stop
end
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,sname,SName.diamond);;
stop
end
start
note right
constructor EntityImagePseudoState(ILeafentity,ISkinParamskinParam,StringhistoryText,SNamesname)
end note
:super (entity,skinParam);
:this.sname=sname;
:this.desc=Display.create(historyText).create(fontConfiguration,
HorizontalAlignment.CENTER,skinParam);
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(SIZE,SIZE);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:circle.setDeltaShadow(shadow);
:ug=ug.apply(stroke);
:ug=ug.apply(backgroundColor.bg()).apply(borderColor);
:ug.draw(circle);
:desc.drawU(ug.apply(new UTranslate(x,y)));
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.CIRCLE;;
stop
end
