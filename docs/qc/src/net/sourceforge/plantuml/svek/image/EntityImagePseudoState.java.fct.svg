19,219.5,1048.4219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="219.5" x2="219.5" y1="1088.3906" y2="1108.3906"/><polygon fill="#181818" points="215.5,1098.3906,219.5,1108.3906,223.5,1098.3906,219.5,1102.3906" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="219.5" x2="219.5" y1="1142.3594" y2="1162.3594"/><polygon fill="#181818" points="215.5,1152.3594,219.5,1162.3594,223.5,1152.3594,219.5,1156.3594" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="219.5" x2="219.5" y1="1196.3281" y2="1216.3281"/><polygon fill="#181818" points="215.5,1206.3281,219.5,1216.3281,223.5,1206.3281,219.5,1210.3281" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="219.5" x2="219.5" y1="1268.8945" y2="1291.4609"/><polygon fill="#181818" points="215.5,1281.4609,219.5,1291.4609,223.5,1281.4609,219.5,1285.4609" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="219.5" x2="219.5" y1="1325.4297" y2="1345.4297"/><polygon fill="#181818" points="215.5,1335.4297,219.5,1345.4297,223.5,1335.4297,219.5,1339.4297" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a2b16cd7cd66c7e76a82829888c689e5]
@startuml
!pragma layout smetana
start
note right
constructor EntityImagePseudoState(ILeafentity,ISkinParamskinParam,SNamesname)
end note
:this(entity,skinParam,"H",sname);
end
start
note right
StylegetStyle()
end note
:return getStyleSignature().getMergedStyle(getSkinParam()
.getCurrentStyleBuilder());;
stop
end
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,sname,SName.diamond);;
stop
end
start
note right
constructor EntityImagePseudoState(ILeafentity,ISkinParamskinParam,StringhistoryText,SNamesname)
end note
:super (entity,skinParam);
:this.sname=sname;
:this.desc=Display.create(historyText).create(fontConfiguration,
HorizontalAlignment.CENTER,skinParam);
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(SIZE,SIZE);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:circle.setDeltaShadow(shadow);
:ug=ug.apply(stroke);
:ug=ug.apply(backgroundColor.bg()).apply(borderColor);
:ug.draw(circle);
:desc.drawU(ug.apply(new UTranslate(x,y)));
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.CIRCLE;;
stop
end
