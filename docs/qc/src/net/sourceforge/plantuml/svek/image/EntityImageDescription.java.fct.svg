@startuml
!pragma layout smetana
start
note right
constructor EntityImageDescription(ILeafentity,
ISkinParamskinParam2,PortionShowerportionShower,
Collection<Link>links,SNamestyleName,Bibliotekonbibliotekon)
end note
:super (entity,entity.getColors().mute(skinParam2));
:this.useRankSame=getSkinParam().useRankSame();
:this.bibliotekon=bibliotekon;
:this.fixCircleLabelOverlapping=getSkinParam()
.fixCircleLabelOverlapping();
:this.links=links;
if (symbol==USymbols.FOLDER) then (yes) 
:this.shapeType=ShapeType.FOLDER;
else (no)
:this.shapeType=ShapeType.RECTANGLE;
endif 
:this.hideText=symbol==USymbols.INTERFACE;
:this.url=entity.getUrl99();
if (backcolor==null ) then (yes) 
:backcolor=styleTitle.value(PName.BackGroundColor)
.asColor(getSkinParam().getIHtmlColorSet());
endif 
:ctx=new SymbolContext(backcolor,forecolor).withStroke(stroke).withShadow(deltaShadow).withCorner(roundCorner,
diagonalCorner);
if ((entity.getDisplay().equals(codeDisplay)&&symbol.getSName()==SName.package_)||entity.getDisplay()
.isWhite()) then (yes) 
:desc=TextBlockUtils.empty(style.value(PName.MinimumWidth)
.asDouble(),0);
else (no)
:desc=BodyFactory.create3(entity.getDisplay(),
getSkinParam(),defaultAlign,fcTitle,getSkinParam().wrapWidth(),
styleTitle);
endif 
:stereo=TextBlockUtils.empty(0,0);
if (stereotype!=null &&stereotype.getSprite(getSkinParam())!=null ) then (yes) 
:stereo=stereotype.getSprite(getSkinParam());
endif 
:name=BodyFactory.create2(getSkinParam().getDefaultTextAlignment(HorizontalAlignment.CENTER),
codeDisplay,getSkinParam(),stereotype,entity,
styleTitle);
if (hideText) then (yes) 
:asSmall=symbol.asSmall(TextBlockUtils.empty(0,
0),TextBlockUtils.empty(0,0),TextBlockUtils.empty(0,
0),ctx,getSkinParam().getStereotypeAlignment());
else (no)
:asSmall=symbol.asSmall(name,desc,stereo,
ctx,getSkinParam().getStereotypeAlignment());
endif 
end
start
note right
USymbolgetUSymbol(ILeafentity)
end note
:return Objects.requireNonNull(result);;
stop
end
start
note right
XDimension2DgetNameDimension(StringBounderstringBounder)
end note
if (hideText) then (yes) 
:return new XDimension2D(0,0);;
stop
endif 
:return name.calculateDimension(stringBounder);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return asSmall.calculateDimension(stringBounder);;
stop
end
start
note right
MarginsgetShield(StringBounderstringBounder)
end note
if (hideText==false) then (yes) 
:return Margins.NONE;;
stop
endif 
if (isThereADoubleLink((ILeaf)getEntity(),
links)) then (yes) 
:return Margins.NONE;;
stop
endif 
if (fixCircleLabelOverlapping==false&&hasSomeHorizontalLinkVisible((ILeaf)getEntity(),
links)) then (yes) 
:return Margins.NONE;;
stop
endif 
if (hasSomeHorizontalLinkDoubleDecorated((ILeaf)getEntity(),
links)) then (yes) 
:return Margins.NONE;;
stop
endif 
if (suppX<1) then (yes) 
:suppX=1;
endif 
:return new Margins(suppX/2,suppX/2,y,y);;
stop
end
start
note right
booleanhasSomeHorizontalLinkVisible(ILeafleaf,
Collection<Link>links)
end note
if (link.getLength()==1&&link.contains(leaf)&&link.isInvis()==false) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleanisThereADoubleLink(ILeafleaf,Collection<Link>links)
end note
if (link.contains(leaf)) then (yes) 
if (changed==false) then (yes) 
:return true;;
stop
endif 
endif 
:return false;;
stop
end
start
note right
booleanhasSomeHorizontalLinkDoubleDecorated(ILeafleaf,
Collection<Link>links)
end note
if (link.getLength()==1&&link.contains(leaf)&&link.getType()
.isDoubleDecorated()) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug.draw(new UComment("entity "+getEntity()
.getCodeGetName()));
:typeIDent.put(UGroupType.CLASS,"elem "+getEntity().getCode()+
" selected");
:typeIDent.put(UGroupType.ID,"elem_"+getEntity()
.getCode());
:ug.startGroup(typeIDent);
if (url!=null ) then (yes) 
:ug.startUrl(url);
endif 
if (shapeType==ShapeType.HEXAGON) then (yes) 
:drawHexagon(ctx.apply(ug));
endif 
:asSmall.drawU(ug);
if (hideText) then (yes) 
:ugDesc=UGraphicStencil.create(ugDesc,dimDesc);
:desc.drawU(ugDesc);
:stereo.drawU(ug.apply(new UTranslate(posx2,
-space-dimStereo.getHeight())));
endif 
if (url!=null ) then (yes) 
:ug.closeUrl();
endif 
:ug.closeGroup();
end
start
note right
void drawHexagon(UGraphicug)
end note
if (bibliotekon==null ) then (yes) 
:throw new IllegalStateException();;
endif 
if (hexagon!=null ) then (yes) 
:hexagon.setDeltaShadow(ctx.getDeltaShadow());
:ug.draw(hexagon);
endif 
end
start
note right
ShapeTypegetShapeType()
end note
:return shapeType;;
stop
end
start
note right
doublegetOverscanX(StringBounderstringBounder)
end note
if (hideText) then (yes) 
:return MathUtils.max(-posx1,-posx2,0);;
stop
endif 
:return 0;;
stop
end
@enduml

