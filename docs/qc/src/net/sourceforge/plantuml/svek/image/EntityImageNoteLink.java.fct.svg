@startuml
!pragma layout smetana
start
note right
constructor EntityImageNoteLink(Displaynote,Colorscolors,ISkinParamskinParam,StyleBuilderstyleBuilder)
end note
:comp=skin.createComponentNote(new Style[]{ComponentType.NOTE.getStyleSignature().getMergedStyle(styleBuilder)},ComponentType.NOTE,skinParam,note,colors);
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(width,height);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:comp.drawU(ug,new Area(calculateDimension(ug.getStringBounder())),
new SimpleContext2D(false));
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.RECTANGLE;;
stop
end
start
note right
HColorgetBackcolor()
end note
:return null ;;
stop
end
start
note right
MarginsgetShield(StringBounderstringBounder)
end note
:return Margins.NONE;;
stop
end
start
note right
booleanisHidden()
end note
:return false;;
stop
end
start
note right
doublegetOverscanX(StringBounderstringBounder)
end note
:return 0;;
stop
end
@enduml

