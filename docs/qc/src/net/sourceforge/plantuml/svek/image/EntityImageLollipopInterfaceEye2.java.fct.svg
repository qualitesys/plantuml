@startuml
!pragma layout smetana
start
note right
constructor EntityImageLollipopInterfaceEye2(ILeafentity,
ISkinParamskinParam,PortionShowerportionShower)
end note
if (stereotype!=null &&stereotype.getLabel(Guillemet.DOUBLE_COMPARATOR)!=null &&portionShower.showPortion(EntityPortion.STEREOTYPE,entity)) then (yes) 
else (no)
endif 
end
start
note right
StylegetStyle(FontParamfontParam)
end note
:return fontParam.getStyleDefinition(SName.componentDiagram)
.getMergedStyle(getSkinParam().getCurrentStyleBuilder());;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(SIZE,SIZE);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (url!=null ) then (yes) 
endif 
if (getSkinParam().shadowing(getEntity().getStereotype())) then (yes) 
endif 
if (url!=null ) then (yes) 
endif 
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.CIRCLE;;
stop
end
@enduml

