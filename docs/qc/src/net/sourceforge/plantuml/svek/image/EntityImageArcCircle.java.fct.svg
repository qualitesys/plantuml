@startuml
!pragma layout smetana
start
note right
constructor EntityImageArcCircle(ILeafentity,
ISkinParamskinParam)
end note
:super (entity,skinParam);;
:this.name=entity.getDisplay().create(FontConfiguration.create(getSkinParam(),
FontParam.COMPONENT,stereotype),HorizontalAlignment.CENTER,
skinParam);;
if (stereotype==null ||stereotype.getLabel(Guillemet.DOUBLE_COMPARATOR)==null ) then (yes) 
:this.stereo=null ;;
else (no)
:this.stereo=Display.getWithNewlines(stereotype.getLabel(getSkinParam().guillemet())).create(FontConfiguration.create(getSkinParam(),
FontParam.COMPONENT_STEREOTYPE,stereotype),
HorizontalAlignment.CENTER,skinParam);;
endif 
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.mergeTB(dimStereo,dimName);;
stop
end
start
note right
XDimension2DgetStereoDimension(StringBounderstringBounder)
end note
if (stereo==null ) then (yes) 
:return new XDimension2D(0,0);;
stop
endif 
:return stereo.calculateDimension(stringBounder);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:name.drawU(ug.apply(new UTranslate(nameX,
nameY)));;
if (stereo!=null ) then (yes) 
:stereo.drawU(ug.apply(UTranslate.dx(stereoX)));;
endif 
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.RECTANGLE;;
stop
end
