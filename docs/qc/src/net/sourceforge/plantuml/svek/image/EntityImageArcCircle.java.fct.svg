@startuml
!pragma layout smetana
start
note right
constructor EntityImageArcCircle(ILeafentity,
ISkinParamskinParam)
end note
if (stereotype==null ||stereotype.getLabel(Guillemet.DOUBLE_COMPARATOR)==null ) then (yes) 
else (no)
endif 
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.mergeTB(dimStereo,dimName);;
stop
end
start
note right
XDimension2DgetStereoDimension(StringBounderstringBounder)
end note
if (stereo==null ) then (yes) 
:return new XDimension2D(0,0);;
stop
endif 
:return stereo.calculateDimension(stringBounder);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (stereo!=null ) then (yes) 
endif 
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.RECTANGLE;;
stop
end
@enduml

