@startuml
!pragma layout smetana
start
note right
constructor EntityImageObject(ILeafentity,
ISkinParamskinParam,PortionShowerportionShower)
end note
:super (entity,skinParam);
:this.lineConfig=entity;
:this.roundCorner=skinParam.getRoundCorner(CornerParam.DEFAULT,
null );
:this.name=TextBlockUtils.withMargin(tmp,
2,2);
if (stereotype==null ||stereotype.getLabel(Guillemet.DOUBLE_COMPARATOR)==null ||portionShower.showPortion(EntityPortion.STEREOTYPE,entity)==false) then (yes) 
:this.stereo=null ;
else (no)
:this.stereo=Display.create(stereotype.getLabels(skinParam.guillemet())).create(FontConfiguration.create(getSkinParam(),
FontParam.OBJECT_STEREOTYPE,stereotype),HorizontalAlignment.CENTER,
skinParam);
endif 
if (entity.getBodier().getFieldsToDisplay()
.size()==0) then (yes) 
:this.fields=new TextBlockLineBefore(getStyle().value(PName.LineThickness).asDouble(),
new TextBlockEmpty(10,16));
else (no)
:this.fields=entity.getBodier().getBody(skinParam,
false,showFields,entity.getStereotype(),getStyle(),
null );
endif 
:this.url=entity.getUrl99();
end
start
note right
StylegetStyle()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.objectDiagram,SName.object)
.withTOBECHANGED(getEntity().getStereotype())
.getMergedStyle(getSkinParam().getCurrentStyleBuilder());;
stop
end
start
note right
StylegetStyleHeader()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.objectDiagram,SName.object,
SName.header).withTOBECHANGED(getEntity()
.getStereotype()).getMergedStyle(getSkinParam()
.getCurrentStyleBuilder());;
stop
end
start
note right
DisplaygetUnderlinedName(ILeafentity)
end note
if (getSkinParam().strictUmlStyle()) then (yes) 
:return entity.getDisplay().underlinedName();;
stop
endif 
:return entity.getDisplay();;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
if (width<minClassWidth) then (yes) 
:width=minClassWidth;
endif 
:return new XDimension2D(width,height);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (headerBackcolor==null ) then (yes) 
:headerBackcolor=backcolor==null ? getStyleHeader()
.value(PName.BackGroundColor).asColor(getSkinParam()
.getIHtmlColorSet()):backcolor;
endif 
if (backcolor==null ) then (yes) 
:backcolor=style.value(PName.BackGroundColor)
.asColor(getSkinParam().getIHtmlColorSet());
endif 
:rect.setDeltaShadow(style.value(PName.Shadowing)
.asDouble());
:ug=ug.apply(borderColor).apply(backcolor.bg());
if (url!=null ) then (yes) 
:ug.startUrl(url);
endif 
:typeIDent.put(UGroupType.CLASS,"elem "+getEntity().getCode()+
" selected");
:typeIDent.put(UGroupType.ID,"elem_"+getEntity()
.getCode());
:ug.startGroup(typeIDent);
:ug.apply(stroke).draw(rect);
if (roundCorner==0&&headerBackcolor!=null &&backcolor.equals(headerBackcolor)==false) then (yes) 
:ugHeader.apply(stroke).draw(rect2);
endif 
:header.drawU(ug,dimTotal.getWidth(),dimTitle.getHeight());
:fields.drawU(ug2.apply(UTranslate.dy(dimTitle.getHeight())));
if (url!=null ) then (yes) 
:ug.closeUrl();
endif 
:ug.closeGroup();
end
start
note right
ULayoutGroupgetLayout(final StringBounderstringBounder)
end note
if (stereo!=null ) then (yes) 
:header.add(stereo);
endif 
:header.add(name);
:return header;;
stop
end
start
note right
doublegetMethodOrFieldHeight(final XDimension2Ddim)
end note
if (fieldsHeight==0) then (yes) 
:return marginEmptyFieldsOrMethod;;
stop
endif 
:return fieldsHeight;;
stop
end
start
note right
XDimension2DgetTitleDimension(StringBounderstringBounder)
end note
:return getNameAndSteretypeDimension(stringBounder);;
stop
end
start
note right
XDimension2DgetNameAndSteretypeDimension(StringBounderstringBounder)
end note
:return nameAndStereo;;
stop
end
start
note right
ShapeTypegetShapeType()
end note
if (((ILeaf)getEntity()).getPortShortNames()
.size()>0) then (yes) 
:return ShapeType.RECTANGLE_HTML_FOR_PORTS;;
stop
endif 
:return ShapeType.RECTANGLE;;
stop
end
start
note right
doublegetStartingX(StringBounderstringBounder,
doubley)
end note
:return 0;;
stop
end
start
note right
doublegetEndingX(StringBounderstringBounder,
doubley)
end note
:return calculateDimension(stringBounder)
.getWidth();;
stop
end
start
note right
PortsgetPorts(StringBounderstringBounder)
end note
if (fields instanceof WithPorts) then (yes) 
:return ((WithPorts)fields).getPorts(stringBounder)
.translateY(dimHeader.getHeight());;
stop
endif 
:return new Ports();;
stop
end
start
note right
XRectangle2DgetInnerPosition(Stringmember,
StringBounderstringBounder,InnerStrategystrategy)
end note
:return translate.apply(fields.getInnerPosition(member,
stringBounder,strategy));;
stop
end
@enduml

