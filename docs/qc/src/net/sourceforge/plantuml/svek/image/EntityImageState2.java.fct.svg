@startuml
!pragma layout smetana
start
note right
constructor EntityImageState2(ILeafentity,
ISkinParamskinParam,SNamesname)
end note
:super (entity,skinParam);;
:this.sname=sname;;
:this.url=entity.getUrl99();;
:asSmall=symbol.asSmall(null ,desc,stereo,
ctx,skinParam.getStereotypeAlignment());;
end
start
note right
StylegetStyle()
end note
:return getStyleSignature().getMergedStyle(getSkinParam()
.getCurrentStyleBuilder());;
stop
end
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,sname,SName.state);;
stop
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.RECTANGLE;;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return asSmall.calculateDimension(stringBounder);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (url!=null ) then (yes) 
:ug.startUrl(url);;
endif 
:asSmall.drawU(ug);;
if (url!=null ) then (yes) 
:ug.closeUrl();;
endif 
end
@enduml

