@startuml
!pragma layout smetana
start
note right
constructor RotatedEllipse(UEllipseellipse,
doublebeta)
end note
end
start
note right
doublegetA()
end note
:return ellipse.getWidth()/2;;
stop
end
start
note right
doublegetB()
end note
:return ellipse.getHeight()/2;;
stop
end
start
note right
doublegetBeta()
end note
:return beta;;
stop
end
start
note right
XPoint2DgetPoint(doubletheta)
end note
:return new XPoint2D(xp,yp);;
stop
end
start
note right
doublegetOtherTheta(doubletheta1)
end note
:return -Math.acos(other);;
stop
end
start
note right
doubleother(double[]all,doublesome)
end note
if (diff0>diff1) then (yes) 
:return all[0];;
stop
endif 
:return all[1];;
stop
end
@enduml

