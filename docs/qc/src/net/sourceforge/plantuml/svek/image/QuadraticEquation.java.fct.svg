@startuml
!pragma layout smetana
start
note right
constructor QuadraticEquation(doublea,doubleb,
doublec)
end note
:this.a=a;;
:this.b=b;;
:this.c=c;;
end
start
note right
double[]solve()
end note
:return new double[]{x0,x1};;
stop
end
start
note right
doublegetV(doublex)
end note
:return a*x*x+b*x+c;;
stop
end
@enduml

