@startuml
!pragma layout smetana
start
note right
constructor EntityImageStateBorder(ILeafleaf,
ISkinParamskinParam,ClusterstateParent,final Bibliotekonbibliotekon,
SNamesname)
end note
end
start
note right
StyleSignatureBasicgetSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,sname);;
stop
end
start
note right
booleanupPosition()
end note
if (parent==null ) then (yes) 
:return false;;
stop
endif 
:return node.getMinY()<clusterCenter.getY();;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (upPosition()) then (yes) 
else (no)
endif 
if (backcolor==null ) then (yes) 
endif 
end
start
note right
UStrokegetUStroke()
end note
:return new UStroke(1.5);;
stop
end
start
note right
doublegetMaxWidthFromLabelForEntryExit(StringBounderstringBounder)
end note
:return dimDesc.getWidth();;
stop
