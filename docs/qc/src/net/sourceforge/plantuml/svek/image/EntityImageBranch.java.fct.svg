@startuml
!pragma layout smetana
start
note right
constructor EntityImageBranch(ILeafentity,ISkinParamskinParam)
end note
:super (entity,skinParam);
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinition()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.activity,
SName.diamond);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(SIZE*2,SIZE*2);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:diams.addPoint(SIZE,0);
:diams.addPoint(SIZE*2,SIZE);
:diams.addPoint(SIZE,SIZE*2);
:diams.addPoint(0,SIZE);
:diams.addPoint(SIZE,0);
:diams.setDeltaShadow(shadowing);
:typeIDent.put(UGroupType.CLASS,"elem "+getEntity().getCode()+
" selected");
:typeIDent.put(UGroupType.ID,"elem_"+getEntity().getCode());
:ug.startGroup(typeIDent);
:ug.apply(border).apply(back.bg()).apply(stroke).draw(diams);
:ug.closeGroup();
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.DIAMOND;;
stop
end
@enduml

