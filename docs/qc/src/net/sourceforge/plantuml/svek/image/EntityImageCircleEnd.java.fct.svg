@startuml
!pragma layout smetana
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionCircle()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.circle,
SName.end);;
stop
end
start
note right
constructor EntityImageCircleEnd(ILeafentity,ISkinParamskinParam)
end note
:super (entity,skinParam);
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(SIZE,SIZE);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (color==null ) then (yes) 
:color=style.value(PName.LineColor).asColor(getSkinParam().getIHtmlColorSet());
endif 
:circle.setDeltaShadow(shadowing);
:ug.apply(HColors.none().bg()).apply(color).draw(circle);
:ug.apply(color.bg()).apply(HColors.none()).apply(new UTranslate(delta+
0.5,delta+0.5)).draw(circleSmall);
end
start
note right
ShapeTypegetShapeType()
end note
:return ShapeType.CIRCLE;;
stop
end
@enduml

