@startuml
!pragma layout smetana
start
note right
constructor RoundedSouth(doublewidth,doubleheight,
HColorbackColor,doublerounded)
end note
if (width==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
if (height==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
void drawU(UGraphicug)
end note
if (backColor.isTransparent()) then (yes) 
:return ;;
stop
endif 
if (rounded==0) then (yes) 
else (no)
endif 
end
@enduml

