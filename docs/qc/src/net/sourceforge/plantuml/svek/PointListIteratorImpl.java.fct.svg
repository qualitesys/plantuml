@startuml
!pragma layout smetana
start
note right
PointListIteratorcreate(SvgResultsvg,intlineColor)
end note
if (idx==-1) then (yes) 
:result.pos=-1;
endif 
:return result;;
stop
end
start
note right
PointListIteratorcloneMe()
end note
:result.pos=this.pos;
:return result;;
stop
end
start
note right
constructor PointListIteratorImpl(SvgResultsvg)
end note
:this.svg=svg;
end
start
note right
booleanhasNext()
end note
:return true;;
stop
end
start
note right
List<XPoint2D>next()
end note
if (pos==-1) then (yes) 
:return Collections.emptyList();;
stop
endif 
:pos=svg.indexOf(SvgResult.POINTS_EQUALS,pos)+
SvgResult.POINTS_EQUALS.length()+1;
:return result;;
stop
:Log.error("Error "+e);
:return Collections.emptyList();;
stop
end
start
