idth:1.0;" x1="204" x2="204" y1="1320.4219" y2="1340.4219"/><polygon fill="#181818" points="200,1330.4219,204,1340.4219,208,1330.4219,204,1334.4219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="204" x2="204" y1="1204.082" y2="1224.082"/><polygon fill="#181818" points="200,1214.082,204,1224.082,208,1214.082,204,1218.082" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="204" x2="204" y1="1364.4219" y2="1384.4219"/><polygon fill="#181818" points="200,1374.4219,204,1384.4219,208,1374.4219,204,1378.4219" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[919c8c6e966979d07fbdc62d6f1572c3]
@startuml
!pragma layout smetana
start
note right
constructor HeaderLayout(TextBlockcircledCharacter,
TextBlockstereo,TextBlockname,TextBlockgeneric)
end note
:this.circledCharacter=protectAgaintNull(circledCharacter);;
:this.stereo=protectAgaintNull(stereo);;
:this.name=protectAgaintNull(name);;
:this.generic=protectAgaintNull(generic);;
end
start
note right
TextBlockprotectAgaintNull(TextBlockblock)
end note
if (block==null ) then (yes) 
:return new TextBlockEmpty();;
stop
endif 
:return block;;
stop
end
start
note right
XDimension2DgetDimension(StringBounderstringBounder)
end note
:return new XDimension2D(width,height);;
stop
end
start
note right
void drawU(UGraphicug,doublewidth,doubleheight)
end note
:assert suppWith>=0;;
:assert h1>=0;;
:assert h2>=0;;
:circledCharacter.drawU(ug.apply(new UTranslate(xCircle,
yCircle)));;
:stereo.drawU(ug.apply(new UTranslate(xStereo,
yStereo)));;
:name.drawU(ug.apply(new UTranslate(xName,
yName)));;
if (genericDim.getWidth()>0) then (yes) 
:generic.drawU(ug.apply(new UTranslate(xGeneric,
yGeneric)));;
endif 
end
@enduml

