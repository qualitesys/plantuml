@startuml
!pragma layout smetana
start
note right
constructor ClusterDotStringKermor(Clustercluster,
ISkinParamskinParam)
end note
:this.cluster=cluster;
:this.skinParam=skinParam;
end
start
note right
void printInternal(StringBuildersb,Collection<SvekLine>lines,
StringBounderstringBounder,DotModedotMode,
GraphvizVersiongraphvizVersion,UmlDiagramTypetype)
end note
if (entityPositionsExceptNormal.size()>0) then (yes) 
if (line.isLinkFromOrTo(cluster.getGroup())) then (yes) 
:line.setProjectionCluster(cluster);
endif 
endif 
if (useAlphaAndBeta) then (yes) 
:sb.append("subgraph "+cluster.getClusterId()+
"alpha {");
:SvekUtils.println(sb);
:sb.append("color=\"#FFFF00\";");
:SvekUtils.println(sb);
if (noteTop==null ) then (yes) 
:sb.append("label=\"\";");
:SvekUtils.println(sb);
else (no)
:SvekLine.appendTable(sblabel,(int)dim.getWidth(),
(int)dim.getHeight(),cluster.getColorNoteTop());
:sblabel.append(">");
:sb.append("label="+sblabel+";");
:SvekUtils.println(sb);
endif 
endif 
:SvekUtils.println(sb);
:sb.append("subgraph "+cluster.getClusterId()+
"beta {");
:SvekUtils.println(sb);
:sb.append("labelloc=\"b\";");
:SvekUtils.println(sb);
:sb.append("color=\"#FFFF00\";");
:SvekUtils.println(sb);
if (noteBottom==null ) then (yes) 
:sb.append("label=\"\";");
:SvekUtils.println(sb);
else (no)
:SvekLine.appendTable(sblabel,(int)dim.getWidth(),
(int)dim.getHeight(),cluster.getColorNoteBottom());
:sblabel.append(">");
:sb.append("label="+sblabel+";");
:SvekUtils.println(sb);
endif 
:SvekUtils.println(sb);
:printRanks(Cluster.RANK_SOURCE,cluster.getNodes(EntityPosition.getInputs()),
sb,stringBounder);
:SvekUtils.println(sb);
:sb.append("subgraph "+cluster.getClusterId()+
"gamma {");
:SvekUtils.println(sb);
:sb.append("labelloc=\"t\";");
:SvekUtils.println(sb);
:sb.append("style=solid;");
:SvekUtils.println(sb);
:sb.append("color=\""+StringUtils.sharp000000(cluster.getColor())+
"\";");
if (cluster.isLabel()) then (yes) 
:SvekLine.appendTable(sblabel,cluster.getTitleAndAttributeWidth(),
cluster.getTitleAndAttributeHeight()-5,cluster.getTitleColor());
:sblabel.append(">");
:label=sblabel.toString();
:sb.append("labeljust=\""+align.getGraphVizValue()+
"\";");
else (no)
:label="\"\"";
endif 
:sb.append("label="+label+";");
:SvekUtils.println(sb);
:cluster.printCluster3_forKermor(sb,lines,
stringBounder,dotMode,graphvizVersion,type);
:SvekUtils.println(sb);
:printRanks(Cluster.RANK_SINK,cluster.getNodes(EntityPosition.getOutputs()),
sb,stringBounder);
:SvekUtils.println(sb);
:sb.append("}");
:sb.append("}");
if (useAlphaAndBeta) then (yes) 
:sb.append("}");
endif 
:SvekUtils.println(sb);
end
start
note right
booleanuseAlphaAndBeta()
end note
if (cluster.getGroup().getNotes(Position.TOP)
.size()>0) then (yes) 
:return true;;
stop
endif 
if (cluster.getGroup().getNotes(Position.BOTTOM)
.size()>0) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
StringgetSourceInPoint(UmlDiagramTypetype)
end note
if (skinParam.useSwimlanes(type)) then (yes) 
:return "sourceIn"+cluster.getColor();;
stop
endif 
:return null ;;
stop
end
start
note right
StringgetSinkInPoint(UmlDiagramTypetype)
end note
if (skinParam.useSwimlanes(type)) then (yes) 
:return "sinkIn"+cluster.getColor();;
stop
endif 
:return null ;;
stop
end
start
note right
Stringempty()
end note
:return Cluster.getSpecialPointId(cluster.getGroup());;
stop
end
start
note right
booleanhasPort()
end note
if (pos.isPort()) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
Set<EntityPosition>entityPositionsExceptNormal()
end note
if (sh.getEntityPosition()!=EntityPosition.NORMAL) then (yes) 
:result.add(sh.getEntityPosition());
endif 
:return Collections.unmodifiableSet(result);;
stop
end
start
note right
void subgraphClusterNoLabel(StringBuildersb,
Stringid)
end note
:subgraphClusterWithLabel(sb,id,"\"\"");
end
start
note right
void subgraphClusterWithLabel(StringBuildersb,
Stringid,Stringlabel)
end note
:sb.append("subgraph "+cluster.getClusterId()+
id+" {");
:sb.append("label="+label+";");
end
start
note right
void printRanks(Stringrank,List<?  extends SvekNode>entries,
StringBuildersb,StringBounderstringBounder)
end note
if (entries.size()>0) then (yes) 
:sb.append("{rank="+rank+";");
:sb.append(sh1.getUid()+";");
:sb.append("}");
:SvekUtils.println(sb);
:sh2.appendShape(sb,stringBounder);
:SvekUtils.println(sb);
endif 
end
start
note right
booleanprotection0(UmlDiagramTypetype)
end note
if (skinParam.useSwimlanes(type)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
booleanprotection1(UmlDiagramTypetype)
end note
if (cluster.getGroup().getUSymbol()==USymbols.NODE) then (yes) 
:return true;;
stop
endif 
if (skinParam.useSwimlanes(type)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
booleanisThereALinkFromOrToGroup(Collection<SvekLine>lines)
end note
if (line.isLinkFromOrTo(cluster.getGroup())) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
@enduml

