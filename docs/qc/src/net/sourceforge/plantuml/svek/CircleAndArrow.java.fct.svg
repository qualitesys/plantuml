,217.5,885.0352" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="217.5" x2="217.5" y1="943.6016" y2="966.168"/><polygon fill="#181818" points="213.5,956.168,217.5,966.168,221.5,956.168,217.5,960.168" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="217.5" x2="217.5" y1="1000.1367" y2="1020.1367"/><polygon fill="#181818" points="213.5,1010.1367,217.5,1020.1367,221.5,1010.1367,217.5,1014.1367" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="217.5" x2="217.5" y1="1054.1055" y2="1074.1055"/><polygon fill="#181818" points="213.5,1064.1055,217.5,1074.1055,221.5,1064.1055,217.5,1068.1055" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="217.5" x2="217.5" y1="1108.0742" y2="1128.0742"/><polygon fill="#181818" points="213.5,1118.0742,217.5,1128.0742,221.5,1118.0742,217.5,1122.0742" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="217.5" x2="217.5" y1="1212.6406" y2="1235.207"/><polygon fill="#181818" points="213.5,1225.207,217.5,1235.207,221.5,1225.207,217.5,1229.207" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="217.5" x2="217.5" y1="1283.1445" y2="1303.1445"/><polygon fill="#181818" points="213.5,1293.1445,217.5,1303.1445,221.5,1293.1445,217.5,1297.1445" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9706a28e16cfe3a92270d052c02b73c4]
@startuml
!pragma layout smetana
start
note right
constructor CircleAndArrow(XPoint2Dp1,XPoint2Dp2)
end note
:this.center=new XPoint2D((p1.getX()+p2.getX())/2,(p1.getY()+
p2.getY())/2);
:at=AffineTransform.getTranslateInstance(-center.getX(),
-center.getY());
:at2=AffineTransform.getTranslateInstance(center.getX(),
center.getY());
:radius=(int)(p1.distance(p2)/2);
if (radius%2==0) then (yes) 
:radius- -;
endif 
:this.p1=putOnCircle(p1);
:this.p2=putOnCircle(p2);
:this.p3=this.p1.transform(at);
:this.p3=new XPoint2D(p3.getY(),-p3.getX());
:this.p3=this.p3.transform(at2);
:this.p4=this.p2.transform(at);
:this.p4=new XPoint2D(p4.getY(),-p4.getX());
:this.p4=this.p4.transform(at2);
end
start
note right
XPoint2DputOnCircle(XPoint2Dp)
end note
:p=p.transform(at);
:p=new XPoint2D(p.getX()/coef,p.getY()/coef);
:return p.transform(at2);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(new UTranslate(center.getX()-radius,
center.getY()-radius)).draw(circle);
end
@enduml

