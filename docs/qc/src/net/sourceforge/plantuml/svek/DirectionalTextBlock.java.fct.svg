@startuml
!pragma layout smetana
start
note right
constructor DirectionalTextBlock(GuideLineguideline,
TextBlockright,TextBlockleft,TextBlockup,
TextBlockdown)
end note
:this.right=right;;
:this.left=left;;
:this.up=up;;
:this.down=down;;
:this.guideline=guideline;;
end
start
note right
void drawU(UGraphicug)
end note
:switch (dir){case RIGHT:right.drawU(ug);
:break ;case LEFT:left.drawU(ug);break ;case UP:up.drawU(ug);
:break ;case DOWN:down.drawU(ug);break ;default :throw new UnsupportedOperationException();};
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return right.calculateDimension(stringBounder);;
stop
end
@enduml

