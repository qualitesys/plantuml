@startuml
!pragma layout smetana
start
note right
constructor DirectionalTextBlock(GuideLineguideline,
TextBlockright,TextBlockleft,TextBlockup,
TextBlockdown)
end note
:this.right=right;;
:this.left=left;;
:this.up=up;;
:this.down=down;;
:this.guideline=guideline;;
end
start
note right
void drawU(UGraphicug)
end note
:Directiondir=guideline.getArrowDirection();;
switch (switch (dir))
endswith
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return right.calculateDimension(stringBounder);;
stop
end
@enduml

