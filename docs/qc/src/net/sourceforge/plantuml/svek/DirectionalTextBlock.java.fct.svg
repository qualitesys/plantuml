181818;stroke-width:1.0;" x1="438.75" x2="438.75" y1="794.9922" y2="814.9922"/><polygon fill="#181818" points="434.75,804.9922,438.75,814.9922,442.75,804.9922,438.75,808.9922" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[eacaa7d803864f013ccd21d67e374bf7]
@startuml
!pragma layout smetana
start
note right
constructor DirectionalTextBlock(GuideLineguideline,
TextBlockright,TextBlockleft,TextBlockup,
TextBlockdown)
end note
:this.right=right;;
:this.left=left;;
:this.up=up;;
:this.down=down;;
:this.guideline=guideline;;
end
start
note right
void drawU(UGraphicug)
end note
:Directiondir=guideline.getArrowDirection();;
switch (switch dir)
case (case RIGHT:) 
:right.drawU(ug);;
:break ;;
case (case LEFT:) 
:left.drawU(ug);;
:break ;;
case (case UP:) 
:up.drawU(ug);;
:break ;;
case (case DOWN:) 
:down.drawU(ug);;
:break ;;
case (default :) 
:throw new UnsupportedOperationException();;
stop
endswitch
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return right.calculateDimension(stringBounder);;
stop
end
@enduml

