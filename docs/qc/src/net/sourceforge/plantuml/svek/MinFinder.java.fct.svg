@startuml
!pragma layout smetana
start
note right
void manage(doublex,doubley)
end note
if (x<minX) then (yes) 
endif 
if (y<minY) then (yes) 
endif 
end
start
note right
void manage(XPoint2Dp)
end note
end
start
note right
void manage(MinFinderother)
end note
end
start
note right
StringtoString()
end note
:return "minX="+minX+" minY="+minY;;
stop
end
start
note right
doublegetMinX()
end note
:return minX;;
stop
end
start
note right
doublegetMinY()
end note
:return minY;;
stop
end
@enduml

