@startuml
!pragma layout smetana
start
note right
StringencodePortNameToId(StringportName)
end note
:return "p"+SignatureUtils.getMD5Hex(portName);;
stop
end
start
note right
StringtoString()
end note
:return ids.toString();;
stop
end
start
note right
PortstranslateY(doubledeltaY)
end note
:result.ids.put(ent.getKey(),ent.getValue()
.translateY(deltaY));
:return result;;
stop
end
start
note right
void add(StringportName,intscore,doubleposition,
doubleheight)
end note
if (already==null ||already.getScore()<score) then (yes) 
:ids.put(id,new PortGeometry(id,position,
height,score));
endif 
end
start
note right
void addThis(Portsother)
end note
if (already==null ||already.getScore()<ent.getValue()
.getScore()) then (yes) 
:ids.put(key,ent.getValue());
endif 
end
start
note right
Collection<PortGeometry>getAllPortGeometry()
end note
:Collections.sort(result);
:return Collections.unmodifiableCollection(result);;
stop
end
@enduml

