@startuml
!pragma layout smetana
start
note right
StringencodePortNameToId(StringportName)
end note
:return "p"+SignatureUtils.getMD5Hex(portName);;
stop
end
start
note right
StringtoString()
end note
:return ids.toString();;
stop
end
start
note right
PortstranslateY(doubledeltaY)
end note
:return result;;
stop
end
start
note right
void add(StringportName,intscore,doubleposition,
doubleheight)
end note
if (already==null ||already.getScore()<score) then (yes) 
endif 
end
start
note right
void addThis(Portsother)
end note
if (already==null ||already.getScore()<ent.getValue().getScore()) then (yes) 
endif 
end
start
note right
Collection<PortGeometry>getAllPortGeometry()
end note
:return Collections.unmodifiableCollection(result);;
stop
end
@enduml

