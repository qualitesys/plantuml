@startuml
!pragma layout smetana
start
note right
constructor CircleInterface2(HColorbackgroundColor,HColorforegroundColor,doubledeltaShadow)
end note
:this.backgroundColor=backgroundColor;
:this.foregroundColor=foregroundColor;
:this.deltaShadow=deltaShadow;
end
start
note right
void drawU(UGraphicug)
end note
:x+=margin;
:y+=margin;
:ug=ug.apply(backgroundColor.bg()).apply(foregroundColor);
:circle.setDeltaShadow(deltaShadow);
:ug.apply(new UTranslate(x,y)).draw(circle);
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(radius*2+2*margin,radius*2+
2*margin);;
stop
end
@enduml

