77.5" y1="908.2266" y2="938.3594"/><polygon fill="#181818" points="273.5,928.3594,277.5,938.3594,281.5,928.3594,277.5,932.3594" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="277.5" x2="277.5" y1="986.2969" y2="1006.2969"/><polygon fill="#181818" points="273.5,996.2969,277.5,1006.2969,281.5,996.2969,277.5,1000.2969" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f76c13f1e07ae49c5f3bc2ddaad6863b]
@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityCircleLine(XPoint2Dp1,
doubleangle)
end note
:this.contact=new XPoint2D(p1.getX(),p1.getY());
:this.angle=manageround(angle+Math.PI/2);
end
start
note right
void drawU(UGraphicug)
end note
:lineTop=lineTop.transform(rotate);
:lineBottom=lineBottom.transform(rotate);
:base=base.transform(rotate);
:circleBase=circleBase.transform(rotate);
:drawLine(ug,contact.getX(),contact.getY(),
base,middle);
:ug.apply(new UTranslate(contact.getX()+circleBase.getX()-radius,contact.getY()+
circleBase.getY()-radius)).apply(stroke).draw(new UEllipse(2*radius,
2*radius));
:drawLine(ug.apply(stroke),contact.getX(),
contact.getY(),lineTop,lineBottom);
end
start
note right
void drawLine(UGraphicug,doublex,doubley,
XPoint2Dp1,XPoint2Dp2)
end note
:ug.apply(new UTranslate(x+p1.getX(),y+p1.getY())).draw(new ULine(dx,
dy));
end
@enduml

