oints="167,836.1875,171,846.1875,175,836.1875,171,840.1875" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="171" x2="171" y1="880.1563" y2="900.1563"/><polygon fill="#181818" points="167,890.1563,171,900.1563,175,890.1563,171,894.1563" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b28053640c50920f9a7fa53cff7a1503]
@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityExtends(XPoint2Dp1,doubleangle,
HColorbackgroundColor)
end note
:this.fill=backgroundColor;
:this.contact=new XPoint2D(p1.getX(),p1.getY());
:angle=manageround(angle);
:polygon.addPoint(0,0);
:polygon.addPoint(-xWing,-yAperture);
:polygon.addPoint(-xWing,yAperture);
:polygon.addPoint(0,0);
:polygon.rotate(angle+Math.PI/2);
:polygon=polygon.translate(p1.getX(),p1.getY());
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(fill.bg());
:ug.draw(polygon);
end
@enduml

