258,171,977.4258,175,967.4258,171,971.4258" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="171" x2="171" y1="1011.3945" y2="1031.3945"/><polygon fill="#181818" points="167,1021.3945,171,1031.3945,175,1021.3945,171,1025.3945" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c44b927cd7ded4019da0742c01b64eed]
@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityTriangle(XPoint2Dp1,doubleangle,booleanfill,HColorbackgroundColor,intxWing,intyAperture)
end note
:this.backgroundColor=backgroundColor;
:this.fill=fill;
:this.contact=new XPoint2D(p1.getX(),p1.getY());
:angle=manageround(angle);
:polygon.addPoint(0,0);
:polygon.addPoint(-xWing,-yAperture);
:polygon.addPoint(-xWing,yAperture);
:polygon.addPoint(0,0);
:polygon.rotate(angle+Math.PI/2);
:polygon=polygon.translate(p1.getX(),p1.getY());
end
start
note right
void drawU(UGraphicug)
end note
if (backgroundColor!=null ) then (yes) 
:ug=ug.apply(backgroundColor.bg());
endif 
:ug.draw(polygon);
end
@enduml

