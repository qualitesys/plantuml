@startuml
!pragma layout smetana
start
note right
constructor ExtremityParenthesis2(XPoint2Dcontact,doubleortho,XPoint2Dp1)
end note
:this.contact=new XPoint2D(contact.getX(),
contact.getY());
:this.ortho=ortho;
:this.center=new XPoint2D(contact.getX()+
dx/distance1*len,contact.getY()+dy/distance1*len);
end
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(new UTranslate(center.getX()-size,
center.getY()-size)).draw(circle);
end
@enduml

