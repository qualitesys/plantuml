@startuml
!pragma layout smetana
start
note right
constructor ExtremityParenthesis(XPoint2Dp1,doubleortho)
end note
:this.dest=new XPoint2D(p1.getX(),p1.getY());
:this.ortho=ortho;
end
start
note right
XPoint2DsomePoint()
end note
:return dest;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(new UStroke(1.5)).apply(new UTranslate(dest.getX()-radius2,
dest.getY()-radius2)).draw(arc1);
end
@enduml

