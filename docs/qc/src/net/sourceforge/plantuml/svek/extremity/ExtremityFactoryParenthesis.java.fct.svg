@startuml
!pragma layout smetana
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,doubleangle,Sideside)
end note
:return new ExtremityParenthesis(p0,angle-Math.PI/2);;
stop
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,XPoint2Dp1,XPoint2Dp2,Sideside)
end note
if (OptionFlags.USE_INTERFACE_EYE2) then (yes) 
:return new ExtremityParenthesis2(center,
ortho,p1);;
stop
endif 
:return new ExtremityParenthesis(p1,ortho);;
stop
end
@enduml

