@startuml
!pragma layout smetana
start
note right
constructor ExtremityFactoryExtendsLike(HColorbackgroundColor,booleandefinedBy)
end note
:this.backgroundColor=backgroundColor;
:this.definedBy=definedBy;
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,doubleangle,Sideside)
end note
if (definedBy) then (yes) 
:return new ExtremityExtendsLike.DefinedBy(p0,
angle,backgroundColor);;
stop
else (no)
:return new ExtremityExtendsLike.Redefines(p0,
angle,backgroundColor);;
stop
endif 
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,XPoint2Dp1,XPoint2Dp2,Sideside)
end note
if (definedBy) then (yes) 
:return new ExtremityExtendsLike.DefinedBy(p1,
ortho,backgroundColor);;
stop
else (no)
:return new ExtremityExtendsLike.Redefines(p1,
ortho,backgroundColor);;
stop
endif 
end
@enduml

