@startuml
!pragma layout smetana
start
note right
constructor ExtremityPlus(doublex,doubley,
doubleangle,HColorbackgroundColor)
end note
:this.angle=angle;
:this.circle=new UEllipse(2*radius,2*radius);
:this.px=x;
:this.py=y;
:this.backgroundColor=backgroundColor;
end
start
note right
XPoint2DsomePoint()
end note
:return new XPoint2D(px,py);;
stop
end
start
note right
UDrawablecreate(XPoint2Dp1,doubleangle,HColorbackgroundColor)
end note
:return new ExtremityPlus(x,y,angle,backgroundColor);;
stop
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(backgroundColor.bg()).apply(new UTranslate(px+0,
py+0)).draw(circle);
:drawLine(ug,0,0,getPointOnCircle(angle-Math.PI/2),
getPointOnCircle(angle+Math.PI/2));
:drawLine(ug,0,0,getPointOnCircle(angle),
getPointOnCircle(angle+Math.PI));
end
start
note right
XPoint2DgetPointOnCircle(doubleangle)
end note
:return new XPoint2D(x,y);;
stop
end
start
note right
void drawLine(UGraphicug,doublex,doubley,
XPoint2Dp1,XPoint2Dp2)
end note
:ug.apply(new UTranslate(x+p1.getX(),y+p1.getY())).draw(new ULine(dx,
dy));
end
@enduml

