@startuml
!pragma layout smetana
start
note right
constructor ExtremityFactoryCircleConnect(HColorbackgroundColor)
end note
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,doubleangle,
Sideside)
end note
:return new ExtremityCircleConnect(p0,angle,
backgroundColor);;
stop
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,XPoint2Dp1,
XPoint2Dp2,Sideside)
end note
:return new ExtremityCircleConnect(p1,ortho,
backgroundColor);;
stop
end
@enduml

