@startuml
!pragma layout smetana
start
note right
constructor ExtremityFactorySquare(HColorbackgroundColor)
end note
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,doubleangle,
Sideside)
end note
:return new ExtremitySquare(p0,backgroundColor);;
stop
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,XPoint2Dp1,
XPoint2Dp2,Sideside)
end note
:return new ExtremitySquare(p1,backgroundColor);;
stop
end
@enduml

