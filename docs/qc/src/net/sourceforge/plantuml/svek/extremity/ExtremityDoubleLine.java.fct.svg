@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityDoubleLine(XPoint2Dp1,doubleangle)
end note
:this.contact=new XPoint2D(p1.getX(),p1.getY());
:this.angle=manageround(angle+Math.PI/2);
end
start
note right
void drawU(UGraphicug)
end note
:middle=middle.transform(rotate);
:base=base.transform(rotate);
:firstLineTop=firstLineTop.transform(rotate);
:firstLineBottom=firstLineBottom.transform(rotate);
:secondLineTop=secondLineTop.transform(rotate);
:secondLineBottom=secondLineBottom.transform(rotate);
:drawLine(ug,contact.getX(),contact.getY(),
firstLineTop,firstLineBottom);
:drawLine(ug,contact.getX(),contact.getY(),
secondLineTop,secondLineBottom);
:drawLine(ug,contact.getX(),contact.getY(),
base,middle);
end
start
note right
void drawLine(UGraphicug,doublex,doubley,XPoint2Dp1,XPoint2Dp2)
end note
:ug.apply(new UTranslate(x+p1.getX(),y+p1.getY())).draw(new ULine(dx,
dy));
end
@enduml

