@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityCrowfoot(XPoint2Dp1,
doubleangle,Sideside)
end note
:this.contact=new XPoint2D(p1.getX(),p1.getY());
:this.angle=manageround(angle+Math.PI/2);
:this.side=side;
end
start
note right
void drawU(UGraphicug)
end note
:left=left.transform(rotate);
:base=base.transform(rotate);
:right=right.transform(rotate);
if (side==Side.WEST||side==Side.EAST) then (yes) 
:left=new XPoint2D(middle.getX(),left.getY());
:right=new XPoint2D(middle.getX(),right.getY());
endif 
if (side==Side.SOUTH||side==Side.NORTH) then (yes) 
:left=new XPoint2D(left.getX(),middle.getY());
:right=new XPoint2D(right.getX(),middle.getY());
endif 
:drawLine(ug,contact.getX(),contact.getY(),
base,left);
:drawLine(ug,contact.getX(),contact.getY(),
base,right);
:drawLine(ug,contact.getX(),contact.getY(),
base,middle);
end
start
note right
void drawLine(UGraphicug,doublex,doubley,
XPoint2Dp1,XPoint2Dp2)
end note
:ug.apply(new UTranslate(x+p1.getX(),y+p1.getY())).draw(new ULine(dx,
dy));
end
