@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return dest;;
stop
end
start
note right
constructor ExtremityStateLine1(doubleangle,
XPoint2Dcenter)
end note
:this.angle=manageround(angle);
:polygon.addPoint(0,0);
:this.dest=new XPoint2D(center.getX(),center.getY());
:polygon.addPoint(-xWing,-yAperture);
:polygon.addPoint(-xContact,0);
:polygon.addPoint(-xWing,yAperture);
:polygon.addPoint(0,0);
:polygon.rotate(this.angle);
:polygon=polygon.translate(center.getX(),
center.getY());
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(ug.getParam().getColor().bg()).apply(new UTranslate(-radius*Math.cos(angle),-radius*Math.sin(angle))).draw(polygon);
:ug=ug.apply(HColors.WHITE.bg());
:ug.apply(new UStroke(1.5)).apply(new UTranslate(dest.getX()-radius,
dest.getY()-radius)).draw(new UEllipse(radius*2,
radius*2));
:drawLine(ug,getPointOnCircle(dest.getX(),
dest.getY(),Math.PI/4),getPointOnCircle(dest.getX(),dest.getY(),Math.PI+
Math.PI/4));
:drawLine(ug,getPointOnCircle(dest.getX(),
dest.getY(),-Math.PI/4),getPointOnCircle(dest.getX(),
dest.getY(),Math.PI-Math.PI/4));
end
start
note right
XPoint2DgetPointOnCircle(doublecenterX,doublecenterY,
doubleangle)
end note
:return new XPoint2D(x,y);;
stop
end
start
note right
void drawLine(UGraphicug,XPoint2Dp1,XPoint2Dp2)
end note
:ug.apply(new UTranslate(p1.getX(),p1.getY())).draw(new ULine(dx,
dy));
end
@enduml

