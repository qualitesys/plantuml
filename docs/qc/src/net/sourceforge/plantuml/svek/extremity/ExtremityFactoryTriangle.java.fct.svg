@startuml
!pragma layout smetana
start
note right
constructor ExtremityFactoryTriangle(HColorbackgroundColor,intxWing,intyAperture)
end note
:this.backgroundColor=backgroundColor;
:this.xWing=xWing;
:this.yAperture=yAperture;
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,doubleangle,Sideside)
end note
:return new ExtremityTriangle(p0,angle-Math.PI/2,
false,backgroundColor,xWing,yAperture);;
stop
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,XPoint2Dp1,XPoint2Dp2,Sideside)
end note
:return new ExtremityTriangle(p1,ortho,true,
backgroundColor,xWing,yAperture);;
stop
end
@enduml

