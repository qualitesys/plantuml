@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityDiamond(XPoint2Dp1,doubleangle,
booleanfill)
end note
end
start
note right
UTranslategetDeltaForKal()
end note
:return deltaForKal;;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (fill) then (yes) 
else (no)
endif 
end
start
note right
XPoint2DisTooSmallSoGiveThePointCloserToThisOne(XPoint2Dpt)
end note
if (result==null ||p.distance(pt)<result.distance(pt)) then (yes) 
endif 
:return result;;
stop
end
@enduml

