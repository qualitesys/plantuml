@startuml
!pragma layout smetana
start
note right
constructor MiddleCircleCircled(doubleangle,MiddleCircleCircledModemode,HColorbackColor,HColordiagramBackColor)
end note
:this.angle=angle;
:this.mode=mode;
:this.backColor=backColor;
:this.diagramBackColor=diagramBackColor;
end
start
note right
XPoint2DsomePoint()
end note
:return null ;;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (mode==MiddleCircleCircledMode.BOTH) then (yes) 
:ug.apply(diagramBackColor).apply(diagramBackColor.bg())
.apply(new UTranslate(-radius2,-radius2))
.draw(bigcircle);
endif 
:ug=ug.apply(backColor.bg());
:ug=ug.apply(new UStroke(1.5));
if (mode==MiddleCircleCircledMode.MODE1||mode==MiddleCircleCircledMode.BOTH) then (yes) 
:ug.apply(HColors.none().bg()).apply(new UTranslate(-radius2+
d,-radius2+d)).draw(arc1);
endif 
if (mode==MiddleCircleCircledMode.MODE2||mode==MiddleCircleCircledMode.BOTH) then (yes) 
:ug.apply(HColors.none().bg()).apply(new UTranslate(-radius2+
d,-radius2+d)).draw(arc2);
endif 
:ug.apply(new UTranslate(-radius1,-radius1))
.draw(circle);
end
@enduml

