2="215.5" y1="904.3633" y2="926.9297"/><polygon fill="#181818" points="211.5,916.9297,215.5,926.9297,219.5,916.9297,215.5,920.9297" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="215.5" x2="215.5" y1="960.8984" y2="980.8984"/><polygon fill="#181818" points="211.5,970.8984,215.5,980.8984,219.5,970.8984,215.5,974.8984" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="215.5" x2="215.5" y1="1056.7734" y2="1076.7734"/><polygon fill="#181818" points="211.5,1066.7734,215.5,1076.7734,219.5,1066.7734,215.5,1070.7734" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4e6e25e92ec6552aec5b8e536d65658c]
@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityArrowAndCircle(XPoint2Dp1,doubleangle,XPoint2Dcenter,HColorbackgroundColor)
end note
:angle=manageround(angle);
:polygon.addPoint(0,0);
:this.backgroundColor=backgroundColor;
:this.dest=new XPoint2D(p1.getX(),p1.getY());
:polygon.addPoint(-xWing,-yAperture);
:polygon.addPoint(-xContact,0);
:polygon.addPoint(-xWing,yAperture);
:polygon.addPoint(0,0);
:polygon.rotate(angle+Math.PI/2);
:polygon=polygon.translate(p1.getX()+radius*Math.sin(angle),
p1.getY()-radius*Math.cos(angle));
:contact=new XPoint2D(p1.getX()-xContact*Math.cos(angle+
Math.PI/2),p1.getY()-xContact*Math.sin(angle+
Math.PI/2));
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(HColors.changeBack(ug)).draw(polygon);
:ug.apply(new UStroke(1.5)).apply(backgroundColor.bg())
.apply(new UTranslate(dest.getX()-radius,
dest.getY()-radius)).draw(new UEllipse(radius*2,
radius*2));
end
@enduml

