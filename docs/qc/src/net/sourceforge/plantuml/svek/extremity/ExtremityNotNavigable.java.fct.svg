@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityNotNavigable(XPoint2Dp1,doubleangle)
end note
:this.contact=new XPoint2D(p1.getX(),p1.getY());
:angle=manageround(angle);
:path.moveTo(-size,0);
:path.lineTo(size,2*size);
:path.moveTo(size,0);
:path.lineTo(-size,2*size);
:path=path.translate(0,move);
:path=path.rotate(angle+Math.PI);
:path=path.translate(p1.getX(),p1.getY());
end
start
note right
void drawU(UGraphicug)
end note
:ug.draw(path);
end
@enduml

