1003.793,216,999.793" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="198" x2="198" y1="967.793" y2="987.793"/><polygon fill="#181818" points="194,977.793,198,987.793,202,977.793,198,981.793" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="198" x2="198" y1="768.5156" y2="788.5156"/><polygon fill="#181818" points="194,778.5156,198,788.5156,202,778.5156,198,782.5156" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="198" x2="198" y1="1011.793" y2="1031.793"/><polygon fill="#181818" points="194,1021.793,198,1031.793,202,1021.793,198,1025.793" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7bfda5b8273e33caa886eca6f18d02e0]
@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityHalfArrow(XPoint2Dp1,
doubleangle,XPoint2Dcenter)
end note
:angle=manageround(angle);
:other=other.transform(rotate);
:this.contact=p1;
:this.line=new ULine(center.getX()-contact.getX(),
center.getY()-contact.getY());
:this.otherLine=new ULine(other.getX(),other.getY());
end
start
note right
constructor ExtremityHalfArrow(XPoint2Dp0,
doubleangle)
end note
:throw new UnsupportedOperationException();;
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(HColors.changeBack(ug));
if (line!=null &&line.getLength()>2) then (yes) 
:ug.apply(new UTranslate(contact.getX(),contact.getY()))
.draw(line);
:ug.apply(new UTranslate(contact.getX(),contact.getY()))
.draw(otherLine);
endif 
end
@enduml

