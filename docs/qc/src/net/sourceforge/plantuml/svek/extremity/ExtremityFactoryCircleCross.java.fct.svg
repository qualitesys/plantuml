@startuml
!pragma layout smetana
start
note right
constructor ExtremityFactoryCircleCross(HColorbackgroundColor)
end note
:this.backgroundColor=backgroundColor;
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,XPoint2Dp1,XPoint2Dp2,Sideside)
end note
:return new ExtremityCircleCross(p1,backgroundColor);;
stop
end
@enduml

