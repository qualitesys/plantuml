@startuml
!pragma layout smetana
start
note right
XPoint2DsomePoint()
end note
:return contact;;
stop
end
start
note right
constructor ExtremityCircleCrowfoot(XPoint2Dp1,doubleangle)
end note
:this.contact=new XPoint2D(p1.getX(),p1.getY());
:this.angle=manageround(angle+Math.PI/2);
end
start
note right
void drawU(UGraphicug)
end note
:left=left.transform(rotate);
:base=base.transform(rotate);
:right=right.transform(rotate);
:circleBase=circleBase.transform(rotate);
:drawLine(ug,contact.getX(),contact.getY(),
base,left);
:drawLine(ug,contact.getX(),contact.getY(),
base,right);
:drawLine(ug,contact.getX(),contact.getY(),
base,middle);
:ug.apply(new UTranslate(contact.getX()+circleBase.getX()-radius,contact.getY()+
circleBase.getY()-radius)).draw(new UEllipse(2*radius,
2*radius));
end
start
note right
void drawLine(UGraphicug,doublex,doubley,XPoint2Dp1,XPoint2Dp2)
end note
:ug.apply(new UTranslate(x+p1.getX(),y+p1.getY())).draw(new ULine(dx,
dy));
end
@enduml

