@startuml
!pragma layout smetana
start
note right
constructor ExtremityFactoryCircle(booleanfill,HColorbackgroundColor)
end note
:this.fill=fill;
:this.backgroundColor=backgroundColor;
end
start
note right
UDrawablecreateUDrawable(XPoint2Dcenter,doubleangle,Sideside)
end note
:angle-=Math.PI/2;
:return ExtremityCircle.create(center,fill,
angle,backgroundColor);;
stop
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,XPoint2Dp1,XPoint2Dp2,Sideside)
end note
:return ExtremityCircle.create(p1,fill,ortho,
backgroundColor);;
stop
end
@enduml

