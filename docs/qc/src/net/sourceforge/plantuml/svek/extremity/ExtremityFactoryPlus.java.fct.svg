407.2734" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[26c8a7a694b860a2d25ee45731326f8b]
@startuml
!pragma layout smetana
start
note right
constructor ExtremityFactoryPlus(HColorbackgroundColor)
end note
:this.backgroundColor=backgroundColor;
end
start
note right
UDrawablecreateUDrawable(XPoint2Dcenter,doubleangle,Sideside)
end note
:return ExtremityPlus.create(center,angle-Math.PI/2,
backgroundColor);;
stop
end
start
note right
UDrawablecreateUDrawable(XPoint2Dp0,XPoint2Dp1,XPoint2Dp2,Sideside)
end note
:return ExtremityPlus.create(p1,ortho,backgroundColor);;
stop
end
@enduml

