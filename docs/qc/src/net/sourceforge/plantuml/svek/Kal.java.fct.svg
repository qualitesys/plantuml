 lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="560.4844">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[41ad5de33b2fc48b76ea1b93e968d8b4]
@startuml
!pragma layout smetana
start
note right
constructor Kal(SvekLinesvekLine,Stringtext,
FontConfigurationfont,ISkinParamskinParam,
EntityImplentity,Linklink,StringBounderstringBounder)
end note
:this.svekLine=svekLine;;
:this.entity=entity;;
:this.link=link;;
:this.textBlock=Display.getWithNewlines(text).create7(font,
HorizontalAlignment.LEFT,skinParam,CreoleMode.SIMPLE_LINE);;
:this.dim=XDimension2D.delta(this.textBlock.calculateDimension(stringBounder),
4,2);;
if (link.getLength()==1&&link.getEntity1()==entity) then (yes) 
:this.position=Direction.RIGHT;;
:entity.ensureMargins(new Margins(0,dim.getWidth(),
0,0));;
else if (link.getLength()==1&&link.getEntity2()==entity) then (yes) 
:this.position=Direction.LEFT;;
:entity.ensureMargins(new Margins(dim.getWidth(),
0,0,0));;
else if (link.getEntity1()==entity) then (yes) 
:this.position=Direction.DOWN;;
:entity.ensureMargins(new Margins(0,0,dim.getHeight(),
0));;
else if (link.getEntity2()==entity) then (yes) 
:this.position=Direction.UP;;
:entity.ensureMargins(new Margins(0,0,0,dim.getHeight()));;
else (no)
:throw new IllegalStateException();;
stop
endif 
:entity.addKal(this);;
end
start
note right
XDimension2DgetDimension()
end note
:return dim;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:final URectanglerect=new URectangle(dim);;
:ug=ug.apply(getTranslate());;
:ug.apply(HColors.WHITE.bg()).apply(HColors.BLACK)
.apply(new UStroke(0.5)).draw(rect);;
:textBlock.drawU(ug.apply(new UTranslate(2,
1)));;
end
start
note right
UTranslategetTranslate()
end note
:return getTextDelta().compose(translate);;
stop
end
start
note right
doublegetX1()
end note
:return getTranslate().getDx()-5;;
stop
end
start
note right
doublegetX2()
end note
:return getX1()+dim.getWidth()+10;;
stop
end
start
note right
UTranslategetTextDelta()
end note
switch (switch (position))
endswith
end
start
note right
DirectiongetPosition()
end note
:return position;;
stop
end
start
note right
void setTranslate(UTranslatetranslate,UDrawabledecoration)
end note
:this.translate=translate;;
if (decoration instanceof Extremity) then (yes) 
:final Extremityextremity=(Extremity)decoration;;
:final UTranslatedeltaForKal=extremity.getDeltaForKal();;
endif 
end
start
note right
doubleoverlapx(Kalother)
end note
if (this.position!=other.position) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
if (other.getX1()>=this.getX1()&&other.getX1()<=this.getX2()) then (yes) 
:return this.getX2()-other.getX1();;
stop
endif 
if (other.getX2()>=this.getX1()&&other.getX2()<=this.getX2()) then (yes) 
:return this.getX1()-other.getX2();;
stop
endif 
if (this.getX1()>=other.getX1()&&this.getX1()<=other.getX2()) then (yes) 
:return other.getX2()-this.getX1();;
stop
endif 
if (this.getX2()>=other.getX1()&&this.getX2()<=other.getX2()) then (yes) 
:return other.getX1()-this.getX2();;
stop
endif 
:return 0;;
stop
end
start
note right
void moveX(doubledx)
end note
if (dx==0) then (yes) 
:return ;;
stop
endif 
:this.translate=this.translate.compose(UTranslate.dx(dx));;
if (link.getEntity1()==entity) then (yes) 
:svekLine.moveStartPoint(dx,0);;
endif 
end
@enduml

