@startuml
!pragma layout smetana
start
note right
constructor AbstractEntityImage(IEntityentity,
ISkinParamskinParam)
end note
:this.entity=Objects.requireNonNull(entity);
:this.skinParam=Objects.requireNonNull(skinParam);
end
start
note right
booleanisHidden()
end note
:return entity.isHidden();;
stop
end
start
note right
IEntitygetEntity()
end note
:return entity;;
stop
end
start
note right
ISkinParamgetSkinParam()
end note
:return skinParam;;
stop
end
start
note right
HColorgetBackcolor()
end note
:return skinParam.getBackgroundColor();;
stop
end
start
note right
StereotypegetStereo()
end note
:return entity.getStereotype();;
stop
end
start
note right
MarginsgetShield(StringBounderstringBounder)
end note
:return Margins.NONE;;
stop
end
start
note right
doublegetOverscanX(StringBounderstringBounder)
end note
:return 0;;
stop
end
@enduml

