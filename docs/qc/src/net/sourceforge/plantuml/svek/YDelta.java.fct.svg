@startuml
!pragma layout smetana
start
note right
constructor YDelta(doubledelta)
end note
:this(1,delta);
end
start
note right
constructor YDelta(doublefactor,doubledelta)
end note
:this.delta=delta;
:this.factor=factor;
end
start
note right
XPoint2Dapply(XPoint2Dpt)
end note
:return new XPoint2D(pt.getX(),pt.getY()*factor+delta);;
stop
end
@enduml

