@startuml
!pragma layout smetana
start
note right
XPoint2DnextPosition()
end note
if (seg=='A') then (yes) 
if (x>halfN) then (yes) 
endif 
else (no)
:throw new UnsupportedOperationException();;
endif 
:return result;;
stop
end
@enduml

