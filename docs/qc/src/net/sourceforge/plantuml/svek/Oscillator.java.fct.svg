@startuml
!pragma layout smetana
start
note right
XPoint2DnextPosition()
end note
:assert n%2==1;;
:i++;;
if (seg=='A') then (yes) 
:x++;;
if (x>halfN) then (yes) 
:seg='B';;
:x=halfN;;
:y=-halfN+1;;
endif 
else (no)
:throw new UnsupportedOperationException();;
stop
endif 
:return result;;
stop
end
@enduml

