@startuml
!pragma layout smetana
start
note right
constructor RoundedContainer(XDimension2Ddim,
doubletitleHeight,doubleattributeHeight,HColorborderColor,
HColorbackColor,HColorimgBackcolor,UStrokestroke,
doublerounded,doubleshadowing)
end note
if (dim.getWidth()==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
void drawU(UGraphicug)
end note
if (shadowing>0) then (yes) 
endif 
if (headerHeight>0) then (yes) 
endif 
if (attributeHeight>0) then (yes) 
endif 
end
@enduml

