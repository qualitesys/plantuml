;" x1="174" x2="174" y1="734.9922" y2="757.5586"/><polygon fill="#181818" points="170,747.5586,174,757.5586,178,747.5586,174,751.5586" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="174" x2="174" y1="791.5273" y2="811.5273"/><polygon fill="#181818" points="170,801.5273,174,811.5273,178,801.5273,174,805.5273" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b8819408e8bed8276449c191c649f6c7]
@startuml
!pragma layout smetana
start
note right
booleanaddNote(Displaynote,NotePositionposition,
NoteTypetype,Colorscolors,SwimlaneswimlaneNote)
end note
:return true;;
stop
end
start
note right
FtileeventuallyAddNote(FtileFactoryfactory,
Ftileftile,Swimlaneswimlane,VerticalAlignmentverticalAlignment)
end note
if (notes.size()==0) then (yes) 
:return ftile;;
stop
endif 
:return factory.addNote(ftile,swimlane,notes,
verticalAlignment);;
stop
end
start
note right
Collection<PositionedNote>getPositionedNotes()
end note
:return Collections.unmodifiableCollection(notes);;
stop
end
start
note right
booleanhasNotes()
end note
:return notes.size()>0;;
stop
end
@enduml

