@startuml
!pragma layout smetana
start
note right
booleanaddNote(Displaynote,NotePositionposition,NoteTypetype,Colorscolors,SwimlaneswimlaneNote)
end note
:this.notes.add(new PositionedNote(note,position,
type,swimlaneNote,colors));
:return true;;
stop
end
start
note right
FtileeventuallyAddNote(FtileFactoryfactory,Ftileftile,Swimlaneswimlane,VerticalAlignmentverticalAlignment)
end note
if (notes.size()==0) then (yes) 
:return ftile;;
stop
endif 
:return factory.addNote(ftile,swimlane,notes,
verticalAlignment);;
stop
end
start
note right
Collection<PositionedNote>getPositionedNotes()
end note
:return Collections.unmodifiableCollection(notes);;
stop
end
start
note right
booleanhasNotes()
end note
:return notes.size()>0;;
stop
end
@enduml

