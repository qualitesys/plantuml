@startuml
!pragma layout smetana
start
note right
GtileHexagonInsidehexagonInside(Swimlaneswimlane,StringBounderstringBounder,ISkinParamskinParam,StyleSignatureBasicstyleSignature,HColorcolor,Displaylabel)
end note
:return new GtileHexagonInside(stringBounder,
tbTest,skinParam,backColor,borderColor,swimlane);;
stop
end
start
note right
AbstractGtileRootdiamondEmpty(Swimlaneswimlane,StringBounderstringBounder,ISkinParamskinParam,StyleSignatureBasicstyleSignature,HColorcolor)
end note
:return new GtileHexagonInside(stringBounder,
TextBlockUtils.EMPTY_TEXT_BLOCK,skinParam,
backColor,borderColor,swimlane);;
stop
end
start
note right
GtilewithSouthMargin(Gtileorig,doublesouth)
end note
:return new GtileWithMargin((AbstractGtileRoot)orig,
0,south,0);;
stop
end
start
note right
GtilewithNorthMargin(Gtileorig,doublenorth)
end note
:return new GtileWithMargin((AbstractGtileRoot)orig,
north,0,0);;
stop
end
start
note right
GtilewithIncomingArrow(Gtileorig,doublemargin)
end note
if (orig instanceof GtileEmpty) then (yes) 
:return orig;;
stop
endif 
:return new GtileWithIncomingArrow((AbstractGtileRoot)orig,
margin);;
stop
end
start
note right
GtilewithOutgoingArrow(Gtileorig,doublemargin)
end note
if (orig instanceof GtileEmpty) then (yes) 
:return orig;;
stop
endif 
:return new GtileWithOutgoingArrow((AbstractGtileRoot)orig,
margin);;
stop
end
@enduml

