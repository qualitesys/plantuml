@startuml
!pragma layout smetana
start
note right
constructor GtileAssembly(Gtiletile1,Gtiletile2,LinkRenderinglinkRendering)
end note
:super (tile1,tile2);
:this.textBlock=getTextBlock(linkRendering.getDisplay());
end
start
note right
UTranslatesupplementaryMove()
end note
:return new UTranslate(0,height);;
stop
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionArrow()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.arrow);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.atLeast(raw,pos1+textBlockWidth,0);;
stop
end
start
note right
TextBlockgetTextBlock(Displaydisplay)
end note
if (Display.isNull(display)) then (yes) 
:return TextBlockUtils.EMPTY_TEXT_BLOCK;;
stop
endif 
:return display.create7(fontConfiguration,
HorizontalAlignment.LEFT,skinParam(),CreoleMode.SIMPLE_LINE);;
stop
end
start
note right
Collection<GConnection>getInnerConnections()
end note
:return Collections.singletonList(arrow);;
stop
end
@enduml

