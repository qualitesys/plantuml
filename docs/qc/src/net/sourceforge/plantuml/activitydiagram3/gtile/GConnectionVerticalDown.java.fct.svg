f04f2397985]
@startuml
!pragma layout smetana
start
note right
constructor GConnectionVerticalDown(UTranslatepos1,GPointgpoint1,UTranslatepos2,GPointgpoint2,TextBlocktextBlock)
end note
:super (gpoint1,gpoint2);
:this.textBlock=textBlock;
:this.pos1=pos1;
:this.pos2=pos2;
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,UTranslatetranslate2)
end note
:snake.addPoint(mp1a);
:snake.addPoint(mp1a.getX(),middle);
:snake.addPoint(mp2b.getX(),middle);
:snake.addPoint(mp2b);
:ug.draw(snake);
end
start
note right
void drawU(UGraphicug)
end note
:snake.addPoint(p1);
:snake.addPoint(p2);
:ug.draw(snake);
end
@enduml

