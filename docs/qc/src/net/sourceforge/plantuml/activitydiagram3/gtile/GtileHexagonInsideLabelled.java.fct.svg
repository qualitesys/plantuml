@startuml
!pragma layout smetana
start
note right
constructor GtileHexagonInsideLabelled(GtileHexagonInsidediamond,
TextBlocksouthLabel,TextBlockeastLabel,TextBlockwestLabel)
end note
end
start
note right
GtileHexagonInsideLabelledwithSouthLabel(TextBlockeastLabel)
end note
:return new GtileHexagonInsideLabelled((GtileHexagonInside)orig,
southLabel,eastLabel,westLabel);;
stop
end
start
note right
GtileHexagonInsideLabelledwithEastLabel(TextBlockeastLabel)
end note
:return new GtileHexagonInsideLabelled((GtileHexagonInside)orig,
southLabel,eastLabel,westLabel);;
stop
end
start
note right
GtileHexagonInsideLabelledwithWestLabel(TextBlockwestLabel)
end note
:return new GtileHexagonInsideLabelled((GtileHexagonInside)orig,
southLabel,eastLabel,westLabel);;
stop
end
start
note right
doublegetNorthMargin(GtileHexagonInsidediamond,
TextBlockeastLabel,TextBlockwestLabel)
end note
:return MathUtils.max(0,dimWest.getHeight()-west.getDy(),
dimEast.getHeight()-east.getDy());;
stop
end
start
note right
doublegetSouthMargin(GtileHexagonInsidediamond,
TextBlocksouthLabel)
end note
:return dimSouth.getHeight();;
stop
end
start
note right
void drawUInternal(UGraphicug)
end note
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return MathUtils.max(tmp,southCorner,eastCorner);;
stop
end
@enduml

