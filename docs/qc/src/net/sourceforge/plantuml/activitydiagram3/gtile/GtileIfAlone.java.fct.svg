@startuml
!pragma layout smetana
start
note right
constructor GtileIfAlone(Swimlaneswimlane,
Gtilegtile,Branchbranch0)
end note
end
start
note right
GtilegetShape1(Swimlaneswimlane,Branchbranch0,
StringBounderstringBounder,ISkinParamskinParam)
end note
:return Gtiles.withSouthMargin(tmp.withSouthLabel(tmp0),
20);;
stop
end
start
note right
GtilegetShape2(Swimlaneswimlane,HColorcolor,
StringBounderstringBounder,ISkinParamskinParam)
end note
:return Gtiles.withNorthMargin(tmp,20);;
stop
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionActivity()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.activity);;
stop
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionDiamond()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.activity,
SName.diamond);;
stop
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionArrow()
end note
