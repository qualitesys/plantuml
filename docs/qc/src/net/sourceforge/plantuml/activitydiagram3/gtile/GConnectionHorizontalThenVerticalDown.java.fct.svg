@startuml
!pragma layout smetana
start
note right
constructor GConnectionHorizontalThenVerticalDown(UTranslatepos1,
GPointgpoint1,UTranslatepos2,GPointgpoint2,
TextBlocktextBlock)
end note
:super (gpoint1,gpoint2);
:this.textBlock=textBlock;
:this.pos1=pos1;
:this.pos2=pos2;
if (pos1.getTranslated(gpoint1.getPoint2D())
.getX()==pos2.getTranslated(gpoint2.getPoint2D())
.getX()) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,
UTranslatetranslate2)
end note
:p1=translate1.getTranslated(p1);
:p2=translate2.getTranslated(p2);
if (originalDirection!=newDirection) then (yes) 
:small.addPoint(p1);
:small.addPoint(p1.getX()+delta,p1.getY());
:small.addPoint(p1.getX()+delta,p1.getY()+
dimDiamond1.getHeight()*.75);
:ug.draw(small);
:p1=small.getLast();
endif 
:snake.addPoint(p1);
:snake.addPoint(p2.getX(),p1.getY());
:snake.addPoint(p2);
:ug.draw(snake);
end
start
note right
void drawU(UGraphicug)
end note
:snake.addPoint(p1);
:snake.addPoint(new XPoint2D(p2.getX(),p1.getY()));
:snake.addPoint(p2);
:ug.draw(snake);
end
@enduml

