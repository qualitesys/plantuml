@startuml
!pragma layout smetana
start
note right
constructor GAbstractConnection(GPointgpoint1,GPointgpoint2)
end note
:this.gpoint1=gpoint1;
:this.gpoint2=gpoint2;
end
start
note right
StringtoString()
end note
:return "["+gpoint1+"]->["+gpoint2+"]";;
stop
end
start
note right
List<GPoint>getHooks()
end note
:return Arrays.asList(gpoint1,gpoint2);;
stop
end
start
note right
void drawTranslatable(UGraphicug)
end note
if (swimlane1==swimlane2) then (yes) 
:return ;;
stop
endif 
:drawTranslate(ug,translate1,translate2);
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,UTranslatetranslate2)
end note
:throw new UnsupportedOperationException();;
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionArrow()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.arrow);;
stop
end
start
note right
ISkinParamskinParam()
end note
:throw new UnsupportedOperationException("wip");;
end
start
note right
RainbowgetInLinkRenderingColor()
end note
:return color;;
stop
end
@enduml

