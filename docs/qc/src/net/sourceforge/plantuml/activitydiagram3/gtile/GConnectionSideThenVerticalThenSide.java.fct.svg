;stroke-width:1.0;" x1="183.5" x2="183.5" y1="802.4844" y2="822.4844"/><polygon fill="#181818" points="179.5,812.4844,183.5,822.4844,187.5,812.4844,183.5,816.4844" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="183.5" x2="183.5" y1="856.4531" y2="876.4531"/><polygon fill="#181818" points="179.5,866.4531,183.5,876.4531,187.5,866.4531,183.5,870.4531" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7503766a11fb7ece302791aec56f0ef2]
@startuml
!pragma layout smetana
start
note right
constructor GConnectionSideThenVerticalThenSide(UTranslatepos1,
GPointgpoint1,UTranslatepos2,GPointgpoint2,
doublexpos,TextBlocktextBlock)
end note
:super (gpoint1,gpoint2);;
:this.textBlock=textBlock;;
:this.pos1=pos1;;
:this.pos2=pos2;;
:this.xpos=xpos;;
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,
UTranslatetranslate2)
end note
:throw new UnsupportedOperationException("wip3");;
stop
end
start
note right
void drawU(UGraphicug)
end note
:snake.addPoint(p1);;
:snake.addPoint(new XPoint2D(maxX,p1.getY()));;
:snake.addPoint(new XPoint2D(maxX,p2.getY()));;
:snake.addPoint(p2);;
:ug.draw(snake);;
end
@enduml

