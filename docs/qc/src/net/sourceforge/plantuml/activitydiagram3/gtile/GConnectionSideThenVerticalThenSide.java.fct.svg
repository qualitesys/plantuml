@startuml
!pragma layout smetana
start
note right
constructor GConnectionSideThenVerticalThenSide(UTranslatepos1,GPointgpoint1,UTranslatepos2,GPointgpoint2,doublexpos,TextBlocktextBlock)
end note
:super (gpoint1,gpoint2);
:this.textBlock=textBlock;
:this.pos1=pos1;
:this.pos2=pos2;
:this.xpos=xpos;
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,UTranslatetranslate2)
end note
:throw new UnsupportedOperationException("wip3");;
end
start
note right
void drawU(UGraphicug)
end note
:snake.addPoint(p1);
:snake.addPoint(new XPoint2D(maxX,p1.getY()));
:snake.addPoint(new XPoint2D(maxX,p2.getY()));
:snake.addPoint(p2);
:ug.draw(snake);
end
@enduml

