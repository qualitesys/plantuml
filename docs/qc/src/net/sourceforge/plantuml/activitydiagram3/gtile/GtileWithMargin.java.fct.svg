@startuml
!pragma layout smetana
start
note right
constructor GtileWithMargin(AbstractGtileRootorig,
doublenorth,doublesouth,doubleeast)
end note
:super (orig.stringBounder,orig.skinParam());
:this.orig=orig;
:this.north=north;
:this.south=south;
:this.east=east;
end
start
note right
Set<Swimlane>getSwimlanes()
end note
:return orig.getSwimlanes();;
stop
end
start
note right
SwimlanegetSwimlane(Stringpoint)
end note
:return orig.getSwimlane(point);;
stop
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.delta(result,east,north+south);;
stop
end
start
note right
UTranslategetTranslate()
end note
:return new UTranslate(east,north);;
stop
end
start
note right
void drawUInternal(UGraphicug)
end note
:orig.drawU(ug.apply(getTranslate()));
end
start
note right
UTranslategetCoordImpl(Stringname)
end note
:return orig.getCoordImpl(name).compose(getTranslate());;
stop
end
start
note right
Collection<GConnection>getInnerConnections()
end note
:return Collections.emptyList();;
stop
end
@enduml

