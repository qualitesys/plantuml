@startuml
!pragma layout smetana
start
note right
constructor GtileSplit(List<Gtile>gtiles,SwimlanesingleSwimlane,HColorlineColor)
end note
:super (gtiles,singleSwimlane,20);
:this.lineColor=lineColor;
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionActivity()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.activity);;
stop
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionDiamond()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.activity,
SName.diamond);;
stop
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionArrow()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.arrow);;
stop
end
start
note right
void drawUInternal(UGraphicug)
end note
:super .drawUInternal(ug);
:ug=ug.apply(lineColor).apply(new UStroke(1.5));
:ug.apply(UTranslate.dx(x0)).draw(hline);
:ug.apply(new UTranslate(x0,y)).draw(hline);
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return XDimension2D.delta(super .calculateDimension(stringBounder),
0,0);;
stop
end
@enduml

