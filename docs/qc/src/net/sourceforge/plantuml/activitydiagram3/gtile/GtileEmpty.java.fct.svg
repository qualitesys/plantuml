@startuml
!pragma layout smetana
start
note right
constructor GtileEmpty(StringBounderstringBounder,
ISkinParamskinParam,doublewidth,doubleheight)
end note
:this(stringBounder,skinParam,width,height,
null );
end
start
note right
constructor GtileEmpty(StringBounderstringBounder,
ISkinParamskinParam)
end note
:this(stringBounder,skinParam,0,0,null );
end
start
note right
constructor GtileEmpty(StringBounderstringBounder,
ISkinParamskinParam,Swimlaneswimlane)
end note
:this(stringBounder,skinParam,0,0,swimlane);
end
start
note right
constructor GtileEmpty(StringBounderstringBounder,
ISkinParamskinParam,doublewidth,doubleheight,
Swimlaneswimlane)
end note
:super (stringBounder,skinParam,swimlane);
:this.width=width;
:this.height=height;
end
start
note right
StringtoString()
end note
:return "GtileEmpty";;
stop
end
start
note right
void drawUInternal(UGraphicug)
end note
if (width>0&&height>0) then (yes) 
:ug.draw(new UEmpty(width,height));
endif 
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return new XDimension2D(width,height);;
stop
end
