@startuml
!pragma layout smetana
start
note right
constructor GConnectionVerticalDownThenBack(UTranslatepos1,GPointgpoint1,UTranslatepos2,GPointgpoint2,TextBlocktextBlock,doublexpos)
end note
:super (gpoint1,gpoint2);
:this.textBlock=textBlock;
:this.pos1=pos1;
:this.pos2=pos2;
:this.xpos=xpos;
end
start
note right
void drawU(UGraphicug)
end note
:snake.addPoint(p1);
:snake.addPoint(p1bis);
:snake.addPoint(new XPoint2D(border,p1bis.getY()));
:snake.addPoint(new XPoint2D(border,p2.getY()));
:snake.addPoint(p2);
:ug.draw(snake);
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,UTranslatetranslate2)
end note
:p1=translate1.getTranslated(p1);
:p2=translate2.getTranslated(p2);
:snake.addPoint(p1);
:snake.addPoint(p1bis);
:snake.addPoint(new XPoint2D(p2.getX()+20,
p1bis.getY()));
:snake.addPoint(new XPoint2D(p2.getX()+20,
p2.getY()));
:snake.addPoint(p2);
:ug.draw(snake);
end
@enduml

