@startuml
!pragma layout smetana
start
note right
StyleSignatureBasicgetDefaultStyleDefinition()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.activity,
SName.diamond);;
stop
end
start
note right
GtileHexagonInsideLabelledwithEastLabel(TextBlockeastLabel)
end note
:return new GtileHexagonInsideLabelled(this,
TextBlockUtils.EMPTY_TEXT_BLOCK,eastLabel,
TextBlockUtils.EMPTY_TEXT_BLOCK);;
stop
end
start
note right
GtileHexagonInsideLabelledwithWestLabel(TextBlockwestLabel)
end note
:return new GtileHexagonInsideLabelled(this,
TextBlockUtils.EMPTY_TEXT_BLOCK,TextBlockUtils.EMPTY_TEXT_BLOCK,
westLabel);;
stop
end
start
note right
AbstractGtileRootwithSouthLabel(TextBlocksouthLabel)
end note
:return new GtileHexagonInsideLabelled(this,
southLabel,TextBlockUtils.EMPTY_TEXT_BLOCK,
TextBlockUtils.EMPTY_TEXT_BLOCK);;
stop
end
start
note right
constructor GtileHexagonInside(StringBounderstringBounder,
TextBlocklabel,ISkinParamskinParam,HColorbackColor,
HColorborderColor,Swimlaneswimlane)
end note
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
if (dimLabel.getWidth()==0||dimLabel.getHeight()==0) then (yes) 
else (no)
endif 
:return dim;;
stop
end
start
note right
void drawUInternal(UGraphicug)
end note
end
@enduml

