@startuml
!pragma layout smetana
start
note right
constructor GtileWhile(Gtiletile1,Gtiletile2,Gtiletile3)
end note
:super (tile1,tile2,tile3);
end
start
note right
StyleSignatureBasicgetDefaultStyleDefinitionDiamond()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.activity,
SName.diamond);;
stop
end
start
note right
GtilegetShape1(Gtiletoto,Swimlaneswimlane,Displaytest,Displayyes)
end note
:return Gtiles.withSouthMargin(tmp0,20);;
stop
end
start
note right
GtilecreateWhile(Swimlaneswimlane,Gtiletmp,Displaytest,Displayyes,InstructionspecialOut,Gtileback)
end note
:return new GtileWhile(shape1,tmp,tile3);;
stop
end
start
note right
Collection<GConnection>getInnerConnections()
end note
:return Arrays.asList(arrow1,arrow2,arrow3);;
stop
end
@enduml

