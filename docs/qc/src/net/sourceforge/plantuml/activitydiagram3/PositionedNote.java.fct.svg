@startuml
!pragma layout smetana
start
note right
constructor PositionedNote(Displaydisplay,
NotePositionposition,NoteTypetype,SwimlaneswimlaneNote,
Colorscolors)
end note
:this.display=display;
:this.notePosition=position;
:this.type=type;
:this.colors=colors;
:this.swimlaneNote=swimlaneNote;
end
start
note right
constructor PositionedNote(Displaynote,NotePositionposition,
NoteTypetype,SwimlaneswimlaneNote)
end note
:this(note,position,type,swimlaneNote,null );
end
start
note right
StringtoString()
end note
:return "type="+type+" notePosition="+notePosition+" "+display;;
stop
end
start
note right
DisplaygetDisplay()
end note
:return display;;
stop
end
start
note right
NotePositiongetNotePosition()
end note
:return notePosition;;
stop
end
start
note right
NoteTypegetType()
end note
:return type;;
stop
end
start
note right
ColorsgetColors()
end note
:return colors;;
stop
end
start
note right
SwimlanegetSwimlaneNote()
end note
:return swimlaneNote;;
stop
end
@enduml

