end note
:return new FtileBreak(factory.skinParam(),
getSwimlaneIn());;
stop
end
start
note right
GtilecreateGtile(ISkinParamskinParam,StringBounderstringBounder)
end note
:return new GtileBreak(stringBounder,skinParam,
getSwimlaneIn());;
stop
end
start
note right
