@startuml
!pragma layout smetana
start
note right
constructor InstructionBreak(Swimlaneswimlane,LinkRenderinginlinkRendering)
end note
:super (swimlane);
:this.inlinkRendering=Objects.requireNonNull(inlinkRendering);
end
start
note right
FtilecreateFtile(FtileFactoryfactory)
end note
:return new FtileBreak(factory.skinParam(),
getSwimlaneIn());;
stop
end
start
note right
GtilecreateGtile(ISkinParamskinParam,StringBounderstringBounder)
end note
:return new GtileBreak(stringBounder,skinParam,
getSwimlaneIn());;
stop
end
start
note right
CommandExecutionResultadd(Instructionother)
end note
:throw new UnsupportedOperationException();;
end
start
note right
booleankill()
end note
:return false;;
stop
end
start
note right
LinkRenderinggetInLinkRendering()
end note
:return inlinkRendering;;
stop
end
start
note right
booleancontainsBreak()
end note
:return true;;
stop
end
@enduml

