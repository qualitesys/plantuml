@startuml
!pragma layout smetana
start
note right
constructor InstructionGoto(Swimlaneswimlane,Stringname)
end note
:super (swimlane);
:this.name=name;
end
start
note right
FtilecreateFtile(FtileFactoryfactory)
end note
:return new FtileGoto(factory.skinParam(),
getSwimlaneIn(),name);;
stop
end
start
note right
GtilecreateGtile(ISkinParamskinParam,StringBounderstringBounder)
end note
:return new GtileEmpty(stringBounder,skinParam);;
stop
end
start
note right
CommandExecutionResultadd(Instructionother)
end note
:throw new UnsupportedOperationException();;
end
start
note right
booleankill()
end note
:return false;;
stop
end
start
note right
LinkRenderinggetInLinkRendering()
end note
:return LinkRendering.none();;
stop
end
start
note right
booleancontainsBreak()
end note
:return false;;
stop
end
@enduml

