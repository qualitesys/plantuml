@startuml
!pragma layout smetana
start
note right
constructor CommandRepeatWhile3Multilines()
end note
end
start
note right
RegexConcatgetPatternEnd2()
end note
:return new RegexConcat(new RegexLeaf("TEST1",
"(.*)"),new RegexLeaf("\\)"),new RegexLeaf(";?"),
RegexLeaf.end());;
stop
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandRepeatWhile3Multilines.class .getName(),
RegexLeaf.start(),new RegexLeaf("repeat"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("while"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("\\("),
new RegexLeaf("TEST1","(.*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteNow(ActivityDiagram3diagram,
