@startuml
!pragma layout smetana
start
note right
constructor CommandLabel()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandLabel.class .getName(),
RegexLeaf.start(),new RegexLeaf("label"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("NAME",
"([%pLN_.]+)"),new RegexLeaf(";?"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ActivityDiagram3diagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.addLabel(name);;
stop
end
@enduml

