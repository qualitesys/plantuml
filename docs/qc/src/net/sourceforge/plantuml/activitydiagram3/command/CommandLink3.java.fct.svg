@startuml
!pragma layout smetana
start
note right
constructor CommandLink3()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandLink3.class .getName(),
RegexLeaf.start(),new RegexLeaf("link"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("COLOR","(#\\w+
)"),new RegexLeaf(";?"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ActivityDiagram3diagram,
LineLocationlocation,RegexResultarg)
end note
if (color!=null ) then (yes) 
:diagram.setColorNextArrow(Rainbow.fromColor(color,
null ));
endif 
:return CommandExecutionResult.ok();;
stop
end
@enduml

