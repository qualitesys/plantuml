@startuml
!pragma layout smetana
start
note right
constructor CommandRepeat3()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandRepeat3.class .getName(),
RegexLeaf.start(),new RegexLeaf("STEREO",
"(\\<{2}.*\\>{2})?"),ColorParser.exp4(),new RegexLeaf("repeat"),
RegexLeaf.spaceZeroOrMore(),new RegexOptional(new RegexLeaf("LABEL",
":(.*?)")),new RegexOptional(new RegexLeaf("STYLE",
CommandActivity3.endingGroup())),RegexLeaf.end());;
stop
end
start
note right
ColorParsercolor()
end note
:return ColorParser.simpleColor(ColorType.BACK);;
stop
end
start
note right
CommandExecutionResultexecuteArg(ActivityDiagram3diagram,LineLocationlocation,RegexResultarg)
end note
if (styleString==null ) then (yes) 
:boxStyle=BoxStyle.PLAIN;
else (no)
:boxStyle=BoxStyle.fromChar(styleString.charAt(0));
endif 
if (stereo!=null ) then (yes) 
:colors=colors.applyStereotype(stereotype,
diagram.getSkinParam(),ColorParam.activityBackground);
endif 
:diagram.startRepeat(color,label,boxStyle,
colors);
:return CommandExecutionResult.ok();;
stop
end
@enduml

