@startuml
!pragma layout smetana
start
note right
constructor CommandWhile3()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandWhile3.class .getName(),
RegexLeaf.start(),ColorParser.exp4(),new RegexLeaf("while"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("\\("),
new RegexLeaf("TEST","(.*?)"),new RegexLeaf("\\)"),
new RegexOptional(new RegexConcat(RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("(is|equals?)"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("YES","\\((.+?)\\)"))),new RegexLeaf(";?"),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ActivityDiagram3diagram,LineLocationlocation,RegexResultarg)
end note
:diagram.doWhile(Display.getWithNewlines(arg.get("TEST",
0)),Display.getWithNewlines(arg.get("YES",
0)),color);
:return CommandExecutionResult.ok();;
stop
end
