@startuml
!pragma layout smetana
start
note right
constructor CommandSwimlane2()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandSwimlane2.class .getName(),
RegexLeaf.start(),new RegexLeaf("swimlane"),
RegexLeaf.spaceOneOrMore(),ColorParser.exp7(),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("SWIMLANE",
"([^|]+)"),new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),
new RegexLeaf("as"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("LABEL","([^|]+)"))),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ActivityDiagram3diagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.swimlane(name,color,label);;
stop
end
@enduml

