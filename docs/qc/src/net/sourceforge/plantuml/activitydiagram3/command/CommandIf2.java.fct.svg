@startuml
!pragma layout smetana
start
note right
constructor CommandIf2()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandIf2.class .getName(),
RegexLeaf.start(),new RegexLeaf("URL","("+UrlBuilder.getRegexp()+")?"),
