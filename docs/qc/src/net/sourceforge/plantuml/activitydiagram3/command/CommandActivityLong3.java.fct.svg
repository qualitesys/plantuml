@startuml
!pragma layout smetana
start
note right
constructor CommandActivityLong3()
end note
:super (getRegexConcat(),MultilinesStrategy.REMOVE_STARTING_QUOTE,
Trim.LEFT_ONLY);
end
start
note right
StringgetPatternEnd()
end note
:return "^(.*)"+CommandActivity3.endingGroup()+
"$";;
stop
end
start
note right
ColorParsercolor()
end note
:return ColorParser.simpleColor(ColorType.BACK);;
stop
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandActivityLong3.class .getName(),
RegexLeaf.start(),color().getRegex(),new RegexLeaf(":"),
new RegexLeaf("DATA","(.*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteNow(ActivityDiagram3diagram,BlocLineslines)
end note
:lines=lines.removeEmptyColumns();
:lines=lines.removeStartingAndEnding(line0.get("DATA",
0),1);
:return diagram.addActivity(lines.toDisplay(),
style,null ,colors,null );;
stop
end
@enduml

