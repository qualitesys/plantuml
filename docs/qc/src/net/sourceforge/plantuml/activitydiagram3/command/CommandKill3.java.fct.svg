@startuml
!pragma layout smetana
start
note right
constructor CommandKill3()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandKill3.class .getName(),
RegexLeaf.start(),new RegexLeaf("kill|detach"),
new RegexLeaf(";?"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ActivityDiagram3diagram,LineLocationlocation,RegexResultarg)
end note
:return diagram.kill();;
stop
end
@enduml

