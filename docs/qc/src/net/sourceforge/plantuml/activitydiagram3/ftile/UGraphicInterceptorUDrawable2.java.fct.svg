@startuml
!pragma layout smetana
start
note right
constructor UGraphicInterceptorUDrawable2(UGraphicug,Map<String,UTranslate>positions)
end note
:super (ug);
:this.positions=positions;
end
start
note right
void draw(UShapeshape)
end note
if (shape instanceof Gtile) then (yes) 
:gtile.drawU(this);
else (no)
:getUg().draw(shape);
endif 
end
start
note right
UTranslategetPosition()
end note
:return ((UGraphicForSnake)getUg()).getTranslation();;
stop
end
start
note right
void drawGoto(FtileGotoftile)
end note
:ugGoto=ugGoto.apply(new UTranslate(pt));
if (dest==null ) then (yes) 
:return ;;
stop
endif 
:ugGoto.draw(new UEllipse(3,3));
:ugGoto.apply(new UTranslate(dx,dy)).draw(new UEllipse(3,3));
:ugGoto.draw(ULine.hline(dx));
:ugGoto.apply(UTranslate.dx(dx)).draw(ULine.vline(dy));
end
start
note right
UGraphicapply(UChangechange)
end note
:return new UGraphicInterceptorUDrawable2(getUg().apply(change),
positions);;
stop
end
@enduml

