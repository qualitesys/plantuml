@startuml
!pragma layout smetana
start
note right
constructor FtileFactoryDelegatorWhile(FtileFactoryfactory)
end note
:super (factory);
end
start
note right
FtilecreateWhile(LinkRenderingoutColor,Swimlaneswimlane,FtilewhileBlock,Displaytest,Displayyes,HColorcolor,InstructionspecialOut,Ftilebackward,LinkRenderingincoming1,LinkRenderingincoming2)
end note
:incoming1=ensureColor(incoming1,arrowColor);
:incoming2=ensureColor(incoming2,arrowColor);
:outColor=ensureColor(outColor,arrowColor);
if (weldingPoints.size()>0) then (yes) 
:result=FtileUtils.addConnection(result,new Connection(){public void drawU(UGraphicug){final UTranslatetr1=genealogy.getTranslate(ftileBreak,ug.getStringBounder());final Snakesnake=Snake.create(skinParam(),arrowColor,Arrows.asToLeft());snake.addPoint(tr1.getDx(),tr1.getDy());snake.addPoint(Hexagon.hexagonHalfSize,tr1.getDy());ug.draw(snake);}public FtilegetFtile1(){return ftileBreak;}public FtilegetFtile2(){return null ;}});
endif 
:return result;;
stop
end
start
note right
LinkRenderingensureColor(LinkRenderinglink,Rainbowcolor)
end note
if (link.getRainbow().size()==0) then (yes) 
:return link.withRainbow(color);;
stop
endif 
:return link;;
stop
end
@enduml

