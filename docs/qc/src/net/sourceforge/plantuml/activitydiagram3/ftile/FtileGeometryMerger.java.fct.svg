@startuml
!pragma layout smetana
start
note right
constructor FtileGeometryMerger(FtileGeometrygeo1,FtileGeometrygeo2)
end note
if (geo2.hasPointOut()) then (yes) 
:result=new FtileGeometry(width,height,left,geo1.getInY(),geo2.getOutY()+
geo1.getHeight());
else (no)
:result=new FtileGeometry(width,height,left,
geo1.getInY());
endif 
end
start
note right
FtileGeometrygetResult()
end note
:return result;;
stop
end
@enduml

