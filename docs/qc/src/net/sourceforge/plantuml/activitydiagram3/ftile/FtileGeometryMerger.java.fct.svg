39.75" x2="339.75" y1="40.1328" y2="70.2656"/><polygon fill="#181818" points="335.75,60.2656,339.75,70.2656,343.75,60.2656,339.75,64.2656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="339.75" x2="339.75" y1="182.2031" y2="202.2031"/><polygon fill="#181818" points="335.75,192.2031,339.75,202.2031,343.75,192.2031,339.75,196.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="339.75" x2="339.75" y1="254.7695" y2="277.3359"/><polygon fill="#181818" points="335.75,267.3359,339.75,277.3359,343.75,267.3359,339.75,271.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="339.75" x2="339.75" y1="311.3047" y2="331.3047"/><polygon fill="#181818" points="335.75,321.3047,339.75,331.3047,343.75,321.3047,339.75,325.3047" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e60061b2b95b4b48147cb94d621616a9]
@startuml
!pragma layout smetana
start
note right
constructor FtileGeometryMerger(FtileGeometrygeo1,
FtileGeometrygeo2)
end note
if (geo2.hasPointOut()) then (yes) 
:result=new FtileGeometry(width,height,left,
geo1.getInY(),geo2.getOutY()+geo1.getHeight());
else (no)
:result=new FtileGeometry(width,height,left,
geo1.getInY());
endif 
end
start
note right
FtileGeometrygetResult()
end note
:return result;;
stop
end
@enduml

