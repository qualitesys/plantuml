@startuml
!pragma layout smetana
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.activity,
SName.diamond);;
stop
end
start
note right
StylegetStyle()
end note
:return getStyleSignature().getMergedStyle(skinParam()
.getCurrentStyleBuilder());;
stop
end
start
note right
Collection<Ftile>getMyChildren()
end note
:return Collections.emptyList();;
stop
end
start
note right
constructor FtileDiamondWIP(TextBlocklabel,
ISkinParamskinParam,HColorbackColor,HColorborderColor,
Swimlaneswimlane,TextBlocknorth,TextBlocksouth,
TextBlockeast,TextBlockwest)
end note
end
start
note right
Set<Swimlane>getSwimlanes()
end note
if (swimlane==null ) then (yes) 
:return Collections.emptySet();;
stop
endif 
:return Collections.singleton(swimlane);;
stop
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return swimlane;;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return swimlane;;
stop
end
@enduml

