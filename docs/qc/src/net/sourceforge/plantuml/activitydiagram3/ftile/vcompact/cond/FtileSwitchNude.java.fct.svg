@startuml
!pragma layout smetana
start
note right
constructor FtileSwitchNude(List<Ftile>tiles,
Swimlanein)
end note
:super (tiles.get(0).skinParam());
:this.tiles=tiles;
:this.in=in;
end
start
note right
Collection<Ftile>getMyChildren()
end note
:return Collections.unmodifiableCollection(tiles);;
stop
end
start
note right
Set<Swimlane>getSwimlanes()
end note
if (getSwimlaneIn()!=null ) then (yes) 
:result.add(getSwimlaneIn());
endif 
:result.addAll(tile.getSwimlanes());
:return Collections.unmodifiableSet(result);;
stop
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return in;;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return getSwimlaneIn();;
stop
end
start
note right
UTranslategetTranslateFor(Ftilechild,StringBounderstringBounder)
end note
if (tiles.contains(child)) then (yes) 
:return getTranslateNude(child,stringBounder);;
stop
endif 
:throw new UnsupportedOperationException();;
end
start
note right
UTranslategetTranslateNude(Ftiletile,StringBounderstringBounder)
end note
if (candidate==tile) then (yes) 
:return UTranslate.dx(x1);;
stop
endif 
:x1+=dim1.getWidth()+xSeparation;
:throw new IllegalArgumentException();;
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(getTranslateNude(tile,stringBounder))
.draw(tile);
end
start
note right
FtileGeometrycalculateDimensionFtile(StringBounderstringBounder)
end note
if (tile.calculateDimension(stringBounder)
.hasPointOut()) then (yes) 
:return dimTotal;;
stop
endif 
:return dimTotal.withoutPointOut();;
stop
end
start
note right
FtileGeometrycalculateDimensionInternalSlow(StringBounderstringBounder)
end note
:result=XDimension2D.mergeLR(result,couple.calculateDimension(stringBounder));
:result=XDimension2D.delta(result,xSeparation*(tiles.size()-1),
100);
:return new FtileGeometry(result,result.getWidth()/2,0);;
stop
end
@enduml

