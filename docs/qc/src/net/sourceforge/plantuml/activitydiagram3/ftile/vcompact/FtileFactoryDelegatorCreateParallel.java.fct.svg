@startuml
!pragma layout smetana
start
note right
constructor FtileFactoryDelegatorCreateParallel(FtileFactoryfactory)
end note
:super (factory);
end
start
note right
FtilecreateParallel(List<Ftile>all,ForkStylestyle,
Stringlabel,Swimlanein,Swimlaneout)
end note
if (style==ForkStyle.SPLIT) then (yes) 
:builder=new ParallelBuilderSplit(skinParam(),
getStringBounder(),all);
else (no)
:throw new IllegalStateException();;
endif 
:return builder.build(inner);;
stop
end
@enduml

