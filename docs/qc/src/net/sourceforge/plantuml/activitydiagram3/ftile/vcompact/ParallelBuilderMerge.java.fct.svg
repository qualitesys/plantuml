@startuml
!pragma layout smetana
start
note right
constructor ParallelBuilderMerge(ISkinParamskinParam,
StringBounderstringBounder,List<Ftile>all)
end note
:super (skinParam,stringBounder,all);
end
start
note right
FtiledoStep1(Ftileinner)
end note
:conns.add(new ConnectionIn(black,tmp,x,rainbow));
:x+=dim.getWidth();
:result=FtileUtils.addConnection(result,conns);
:((FtileBlackBlock)black).setBlackBlockDimension(result.calculateDimension(getStringBounder()).getWidth(),
barHeight);
:return new FtileAssemblySimple(black,result);;
stop
end
start
note right
FtiledoStep2(Ftileinner,Ftileresult)
end note
:result=new FtileAssemblySimple(result,out);
if (tmp.calculateDimension(getStringBounder())
.hasPointOut()) then (yes) 
:conns.add(new ConnectionHorizontalThenVertical(tmp,
out,rainbow,translate0,diamondTranslate));
endif 
:x+=dim.getWidth();
:return FtileUtils.addConnection(result,conns);;
stop
end
start
note right
constructor ConnectionHorizontalThenVertical(Ftiletile,
Ftilediamond,RainbowarrowColor,UTranslatetranslate0,
UTranslatediamondTranslate)
end note
:super (tile,diamond);
:this.arrowColor=arrowColor;
:this.diamondTranslate=diamondTranslate;
:this.translate0=translate0;
end
start
note right
void drawU(UGraphicug)
end note
if (arrival.getDx()<0) then (yes) 
:endDecoration=Arrows.asToRight();
else (no)
:endDecoration=Arrows.asToDown();
endif 
:snake.addPoint(x1,y1);
:snake.addPoint(x1,y2);
:snake.addPoint(x2,y2);
:ug.draw(snake);
end
start
note right
XPoint2DgetP1(StringBounderstringBounder)
end note
:return translate0.getTranslated(getFtile1()
.calculateDimension(stringBounder).getPointOut());;
stop
end
start
note right
XPoint2DgetP2(StringBounderstringBounder,
doublestartX)
end note
:return arrival.getTranslated(getDiamondOut(stringBounder));;
stop
end
start
note right
XPoint2DgetDiamondOut(StringBounderstringBounder)
end note
:return diamondTranslate.getTranslated(getFtile2()
.calculateDimension(stringBounder).getPointOut());;
stop
end
start
note right
UTranslatearrivalOnDiamond(StringBounderstringBounder,
doublestartX)
end note
if (startX<a) then (yes) 
:arrival=new UTranslate(-dim.getWidth()/2,
-dim.getHeight()/2);
else (no)
:arrival=new UTranslate(0,-dim.getHeight());
endif 
:return arrival;;
stop
end
start
note right
constructor ConnectionIn(Ftileftile1,Ftileftile2,
doublex,RainbowarrowColor)
end note
:super (ftile1,ftile2);
:label=ftile2.getInLinkRendering().getDisplay();
:this.x=x;
:this.arrowColor=arrowColor;
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(UTranslate.dx(x));
if (Display.isNull(label)==false) then (yes) 
:snake=snake.withLabel(getTextBlock(label),
arrowHorizontalAlignment());
endif 
:snake.addPoint(geo.getLeft(),0);
:snake.addPoint(geo.getLeft(),geo.getInY());
:ug.draw(snake);
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,
UTranslatetranslate2)
end note
:ug=ug.apply(UTranslate.dx(x));
if (Display.isNull(label)==false) then (yes) 
:snake=snake.withLabel(getTextBlock(label),
arrowHorizontalAlignment());
endif 
:snake.addPoint(mp1a);
:snake.addPoint(mp1a.getX(),middle);
:snake.addPoint(mp2b.getX(),middle);
:snake.addPoint(mp2b);
:ug.draw(snake);
end
@enduml

