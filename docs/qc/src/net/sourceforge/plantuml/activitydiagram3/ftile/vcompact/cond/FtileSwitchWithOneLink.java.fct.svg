@startuml
!pragma layout smetana
start
note right
constructor FtileSwitchWithOneLink(List<Ftile>tiles,
List<Branch>branches,Swimlanein,Ftilediamond1,
Ftilediamond2,StringBounderstringBounder,
RainbowarrowColor)
end note
:super (tiles,branches,in,diamond1,diamond2,
stringBounder);
:this.arrowColor=arrowColor;
end
start
note right
constructor ConnectionVerticalTop(Ftiletile,
Branchbranch)
end note
:super (diamond1,tile);
:this.branch=branch;
end
start
note right
void drawU(UGraphicug)
end note
:snake.addPoint(x2,y1);
:snake.addPoint(x2,y2);
:ug.draw(snake);
end
start
note right
XPoint2DgetP1(StringBounderstringBounder)
end note
:return getTranslateDiamond1(stringBounder)
.getTranslated(dimDiamond1.getPointC());;
stop
end
start
note right
XPoint2DgetP2(final StringBounderstringBounder)
end note
:return getTranslateOf(getFtile2(),stringBounder)
.getTranslated(getFtile2().calculateDimension(stringBounder)
.getPointIn());;
stop
end
start
note right
constructor ConnectionVerticalBottom(Ftiletile)
end note
:super (tile,diamond2);
end
start
note right
void drawU(UGraphicug)
end note
:snake.addPoint(x2,y1);
:snake.addPoint(x2,y2);
:ug.draw(snake);
end
start
note right
XPoint2DgetP1(StringBounderstringBounder)
end note
:return getTranslateOf(getFtile1(),stringBounder)
.getTranslated(getFtile1().calculateDimension(stringBounder)
.getPointOut());;
stop
end
start
note right
XPoint2DgetP2(StringBounderstringBounder)
end note
:return getTranslateDiamond2(stringBounder)
.getTranslated(dimDiamond2.getPointA());;
stop
end
start
note right
FtileaddLinks(StringBounderstringBounder)
end note
:conns.add(new ConnectionVerticalTop(single,
branches.get(0)));
if (single.calculateDimension(stringBounder)
.hasPointOut()) then (yes) 
:conns.add(new ConnectionVerticalBottom(single));
endif 
:return FtileUtils.addConnection(this,conns);;
stop
end
@enduml

