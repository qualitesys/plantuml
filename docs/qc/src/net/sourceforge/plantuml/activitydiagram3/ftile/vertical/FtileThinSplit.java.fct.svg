@startuml
!pragma layout smetana
start
note right
constructor FtileThinSplit(ISkinParamskinParam,
HColorcolorBar,Swimlaneswimlane)
end note
end
start
note right
Collection<Ftile>getMyChildren()
end note
:return Collections.emptyList();;
stop
end
start
note right
void setGeom(doublefirst,doublelast,doublewidth)
end note
end
start
note right
FtileGeometrycalculateDimensionFtile(StringBounderstringBounder)
end note
:return new FtileGeometry(width,height,width/2,
0,height);;
stop
end
start
note right
void drawU(UGraphicug)
end note
if (colorBar==null ) then (yes) 
else (no)
endif 
end
start
