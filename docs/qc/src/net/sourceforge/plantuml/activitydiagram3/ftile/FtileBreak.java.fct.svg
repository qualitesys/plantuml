@startuml
!pragma layout smetana
start
note right
constructor FtileBreak(ISkinParamskinParam,
Swimlaneswimlane)
end note
end
start
note right
Collection<Ftile>getMyChildren()
end note
:return Collections.emptyList();;
stop
end
start
note right
StringtoString()
end note
:return "FtileBreak";;
stop
end
start
note right
FtileGeometrycalculateDimensionFtile(StringBounderstringBounder)
end note
:return calculateDimensionEmpty().withoutPointOut();;
stop
end
start
note right
List<WeldingPoint>getWeldingPoints()
end note
:return Collections.singletonList((WeldingPoint)this);;
stop
end
@enduml

