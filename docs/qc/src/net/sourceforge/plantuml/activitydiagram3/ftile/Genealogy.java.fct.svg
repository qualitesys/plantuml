2,369.5,934.332" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="369.5" x2="369.5" y1="974.3008" y2="994.3008"/><polygon fill="#181818" points="365.5,984.3008,369.5,994.3008,373.5,984.3008,369.5,988.3008" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="369.5" x2="369.5" y1="1028.2695" y2="1048.2695"/><polygon fill="#181818" points="365.5,1038.2695,369.5,1048.2695,373.5,1038.2695,369.5,1042.2695" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="369.5" x2="369.5" y1="1096.207" y2="1116.207"/><polygon fill="#181818" points="365.5,1106.207,369.5,1116.207,373.5,1106.207,369.5,1110.207" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="369.5" x2="369.5" y1="1150.1758" y2="1170.1758"/><polygon fill="#181818" points="365.5,1160.1758,369.5,1170.1758,373.5,1160.1758,369.5,1164.1758" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b204a7f92e14c6fb70e79f96d327e289]
@startuml
!pragma layout smetana
start
note right
constructor Genealogy(Ftileroot)
end note
:this.root=root;;
:process(root);;
end
start
note right
void process(Ftilecurrent)
end note
:final Collection<Ftile>children=current.getMyChildren();;
:setMyFather(child,current);;
:process(child);;
end
start
note right
FtilegetMyFather(Ftileme)
end note
:return myFatherIs.get(me);;
stop
end
start
note right
void setMyFather(Ftilechild,Ftilefather)
end note
if (myFatherIs.containsKey(child)) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
:myFatherIs.put(child,father);;
end
start
note right
UTranslategetTranslate(Ftilechild,StringBounderstringBounder)
end note
:Ftilecurrent=child;;
:UTranslateresult=new UTranslate();;
:while (current!=root){final Ftilefather=getMyFather(current);final UTranslatetr=father.getTranslateFor(current,
stringBounder);result=tr.compose(result);current=father;};
:return result;;
stop
end
@enduml

