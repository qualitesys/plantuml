@startuml
!pragma layout smetana
start
note right
UGraphic apply(UChange change)
end note
:return new ZadBuilder(this,change);;
stop
end
start
note right
constructor ZadBuilder(StringBounder stringBounder)
end note
:super (stringBounder,new UTranslate());;
:this.context=new Context();;
end
start
note right
constructor ZadBuilder(ZadBuilder other,UChange change)
end note
:super (other.getStringBounder(),change instanceof UTranslate ? other.getTranslate()
.compose((UTranslate )change):other.getTranslate());;
if (!instanceOfAny(change,UBackground.class ,
HColor.class ,UStroke.class ,UTranslate.class )) then (yes) 
:throw new UnsupportedOperationException(change.getClass()
.toString());;
stop
endif 
:this.context=other.context;;
end
start
note right
void draw(UShape shape)
end note
if (shape instanceof URectangle ) then (yes) 
:drawRectangle((URectangle )shape);;
endif 
end
start
note right
void drawRectangle(URectangle shape)
end note
:final MinMax area=shape.getMinMax().translate(getTranslate());;
:context.zad.add(area);;
end
start
note right
Zad getZad()
end note
:return context.zad;;
stop
end
@enduml

