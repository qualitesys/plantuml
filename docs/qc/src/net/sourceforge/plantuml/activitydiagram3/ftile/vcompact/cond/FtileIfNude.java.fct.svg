@startuml
!pragma layout smetana
start
note right
constructor FtileIfNude(Ftiletile1,Ftiletile2,
Swimlanein)
end note
:super (tile1.skinParam());
:this.tile1=tile1;
:this.tile2=tile2;
:this.in=in;
end
start
note right
Collection<Ftile>getMyChildren()
end note
:return Arrays.asList(tile1,tile2);;
stop
end
start
note right
booleanhasTwoBranches(StringBounderstringBounder)
end note
:return tile1.calculateDimension(stringBounder)
.hasPointOut()&&tile2.calculateDimension(stringBounder)
.hasPointOut();;
stop
end
start
note right
Set<Swimlane>getSwimlanes()
end note
if (getSwimlaneIn()!=null ) then (yes) 
:result.add(getSwimlaneIn());
endif 
:result.addAll(tile1.getSwimlanes());
:result.addAll(tile2.getSwimlanes());
:return Collections.unmodifiableSet(result);;
stop
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return in;;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return getSwimlaneIn();;
stop
end
start
note right
UTranslategetTranslate1(StringBounderstringBounder)
end note
:return new UTranslate(x1,y1);;
stop
end
start
note right
UTranslategetTranslate2(StringBounderstringBounder)
end note
:return new UTranslate(x2,y2);;
stop
end
start
note right
UTranslategetTranslateFor(Ftilechild,StringBounderstringBounder)
end note
if (child==tile1) then (yes) 
:return getTranslate1(stringBounder);;
stop
endif 
if (child==tile2) then (yes) 
:return getTranslate2(stringBounder);;
stop
endif 
:throw new UnsupportedOperationException();;
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(getTranslate1(stringBounder)).draw(tile1);
:ug.apply(getTranslate2(stringBounder)).draw(tile2);
end
start
note right
FtileGeometrycalculateDimensionFtile(StringBounderstringBounder)
end note
if (tile1.calculateDimension(stringBounder)
.hasPointOut()||tile2.calculateDimension(stringBounder)
.hasPointOut()) then (yes) 
:return dimTotal;;
stop
endif 
:return dimTotal.withoutPointOut();;
stop
end
start
note right
FtileGeometrycalculateDimensionInternalSlow(StringBounderstringBounder)
end note
:return new FtileGeometry(width,dim12.getHeight(),dim1.getLeft()+
innerMargin/2,0);;
stop
end
start
note right
doublewidthInner(StringBounderstringBounder)
end note
:return (dim1.getWidth()-dim1.getLeft())+
dim2.getLeft();;
stop
end
@enduml

