:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="440" x2="440" y1="295.6016" y2="685.6563"/><line style="stroke:#181818;stroke-width:1.0;" x1="440" x2="209.5" y1="685.6563" y2="685.6563"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.5" x2="209.5" y1="685.6563" y2="705.6563"/><polygon fill="#181818" points="205.5,695.6563,209.5,705.6563,213.5,695.6563,209.5,699.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.5" x2="209.5" y1="245.9023" y2="283.6016"/><polygon fill="#181818" points="205.5,273.6016,209.5,283.6016,213.5,273.6016,209.5,277.6016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.5" x2="209.5" y1="795.5" y2="815.5"/><polygon fill="#181818" points="205.5,805.5,209.5,815.5,213.5,805.5,209.5,809.5" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ea7e084aadb05002cc1848cfc391df28]
@startuml
!pragma layout smetana
start
note right
constructor FtileFactoryDelegatorIf(FtileFactoryfactory,
Pragmapragma)
end note
:super (factory);
:this.pragma=pragma;
end
start
note right
FtilecreateIf(Swimlaneswimlane,List<Branch>thens,
BranchelseBranch,LinkRenderingafterEndwhile,
LinkRenderingtopInlinkRendering,Urlurl)
end note
if (thens.size()>1) then (yes) 
if (pragma.useVerticalIf()) then (yes) 
:return FtileIfLongVertical.create(swimlane,
borderColor,backColor,arrowColor,getFactory(),
conditionStyle,thens,elseBranch,fcArrow,topInlinkRendering,
afterEndwhile);;
stop
endif 
:return FtileIfLongHorizontal.create(swimlane,
borderColor,backColor,arrowColor,getFactory(),
conditionStyle,thens,elseBranch,fcArrow,topInlinkRendering,
afterEndwhile,fcTest);;
stop
endif 
:return ConditionalBuilder.create(swimlane,
borderColor,backColor,arrowColor,getFactory(),
conditionStyle,conditionEndStyle,thens.get(0),
elseBranch,skinParam(),getStringBounder(),
fcArrow,fcTest,url);;
stop
end
@enduml

