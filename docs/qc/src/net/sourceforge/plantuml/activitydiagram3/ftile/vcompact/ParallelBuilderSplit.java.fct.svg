@startuml
!pragma layout smetana
start
note right
constructor ParallelBuilderSplit(ISkinParamskinParam,
StringBounderstringBounder,List<Ftile>all)
end note
:super (skinParam,stringBounder,all);
end
start
note right
StyleSignatureBasicgetStyleSignature()
end note
:return StyleSignatureBasic.of(SName.root,
SName.element,SName.activityDiagram,SName.arrow);;
stop
end
start
note right
FtiledoStep1(Ftileinner)
end note
if (first==0) then (yes) 
:first=x+dim.getLeft();
endif 
:last=x+dim.getLeft();
:conns.add(new ConnectionIn(thin,tmp,x,rainbow));
:x+=dim.getWidth();
:result=FtileUtils.addConnection(result,conns);
if (last<geom.getLeft()) then (yes) 
:last=geom.getLeft();
endif 
if (first>geom.getLeft()) then (yes) 
:first=geom.getLeft();
endif 
:((FtileThinSplit)thin).setGeom(first,last,
result.calculateDimension(getStringBounder())
.getWidth());
:return new FtileAssemblySimple(thin,result);;
stop
end
start
note right
HColorgetThin1Color(final RainbowthinColor)
end note
if (rainbow.isInvisible()==false) then (yes) 
:return thinColor.getColor();;
stop
endif 
:return null ;;
stop
end
start
note right
booleanhasOut()
end note
if (tmp.calculateDimension(getStringBounder())
.hasPointOut()) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
FtiledoStep2(Ftileinner,Ftileresult)
end note
if (hasOut()==false) then (yes) 
:return new FtileKilled(result);;
stop
endif 
:result=new FtileAssemblySimple(result,out);
if (dim.hasPointOut()) then (yes) 
if (first==0) then (yes) 
:first=x+dim.getLeft();
endif 
:last=x+dim.getLeft();
endif 
if (tmp.calculateDimension(getStringBounder())
.hasPointOut()) then (yes) 
:conns.add(new ConnectionOut(translate0,tmp,
out,x,rainbow,getHeightOfMiddle(inner)));
endif 
:x+=dim.getWidth();
if (last<geom.getLeft()) then (yes) 
:last=geom.getLeft();
endif 
if (first>geom.getLeft()) then (yes) 
:first=geom.getLeft();
endif 
:((FtileThinSplit)out).setGeom(first,last,
geom.getWidth());
:result=FtileUtils.addConnection(result,conns);
:return result;;
stop
end
start
note right
constructor ConnectionIn(Ftileftile1,Ftileftile2,
doublex,RainbowarrowColor)
end note
:super (ftile1,ftile2);
:label=ftile2.getInLinkRendering().getDisplay();
:this.x=x;
:this.arrowColor=arrowColor;
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(UTranslate.dx(x));
if (Display.isNull(label)==false) then (yes) 
:snake=snake.withLabel(getTextBlock(label),
arrowHorizontalAlignment());
endif 
:snake.addPoint(geo.getLeft(),0);
:snake.addPoint(geo.getLeft(),geo.getInY());
:ug.draw(snake);
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,
UTranslatetranslate2)
end note
:ug=ug.apply(UTranslate.dx(x));
if (Display.isNull(label)==false) then (yes) 
:snake=snake.withLabel(getTextBlock(label),
arrowHorizontalAlignment());
endif 
:snake.addPoint(mp1a);
:snake.addPoint(mp1a.getX(),middle);
:snake.addPoint(mp2b.getX(),middle);
:snake.addPoint(mp2b);
:ug.draw(snake);
end
start
note right
constructor ConnectionOut(UTranslatetranslate0,
Ftileftile1,Ftileftile2,doublex,RainbowarrowColor,
doubleheight)
end note
:super (ftile1,ftile2);
:this.translate0=translate0;
:this.label=ftile1.getOutLinkRendering().getDisplay();
:this.x=x;
:this.arrowColor=arrowColor;
:this.height=height;
end
start
note right
void drawU(UGraphicug)
end note
:ug=ug.apply(UTranslate.dx(x));
if (geo.hasPointOut()==false) then (yes) 
:return ;;
stop
endif 
if (Display.isNull(label)==false) then (yes) 
:snake=snake.withLabel(getTextBlock(label),
arrowHorizontalAlignment());
endif 
:snake.addPoint(p1);
:snake.addPoint(p2);
:ug.draw(snake);
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,
UTranslatetranslate2)
end note
:ug=ug.apply(UTranslate.dx(x));
if (geo.hasPointOut()==false) then (yes) 
:return ;;
stop
endif 
if (Display.isNull(label)==false) then (yes) 
:snake=snake.withLabel(getTextBlock(label),
arrowHorizontalAlignment());
endif 
:snake.addPoint(mp1a);
:snake.addPoint(mp1a.getX(),middle);
:snake.addPoint(mp2b.getX(),middle);
:snake.addPoint(mp2b);
:ug.draw(snake);
end
@enduml

