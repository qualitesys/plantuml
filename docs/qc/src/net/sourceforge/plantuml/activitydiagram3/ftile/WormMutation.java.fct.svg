@startuml
!pragma layout smetana
start
note right
constructor WormMutation()
end note
end
start
note right
WormMutationcreate(Wormworm,doubledelta)
end note
:final Stringsignature=worm.getDirectionsCode();;
:final Stringdefinition=getDefinition(signature);;
if (definition==null ) then (yes) 
:return createFromLongSignature(signature,
delta);;
stop
endif 
:return new WormMutation(definition,delta);;
stop
end
start
note right
WormMutationcreateFromLongSignature(final Stringsignature,
final doubledelta)
end note
:final WormMutationresult=new WormMutation();;
:WormMutationtmp=new WormMutation(getDefinition(signature.substring(i,i+
2)),delta);;
if (i==0) then (yes) 
:result.translations.add(tmp.translations.get(0));;
else (no)
:UTranslatelast=result.getLast();;
if (last.isAlmostSame(tmp.translations.get(0))==false) then (yes) 
:tmp=tmp.reverse();;
endif 
endif 
:result.translations.add(tmp.translations.get(1));;
if (i==signature.length()-2) then (yes) 
:result.translations.add(tmp.translations.get(2));;
endif 
:return result;;
stop
end
start
note right
WormMutationreverse()
end note
:final WormMutationresult=new WormMutation();;
:result.translations.add(tr.reverse());;
:return result;;
stop
end
start
note right
UTranslategetLast()
end note
:return translations.get(translations.size()-1);;
stop
end
start
note right
UTranslategetFirst()
end note
:return translations.get(0);;
stop
end
start
note right
intsize()
end note
:return translations.size();;
stop
end
start
note right
StringgetDefinition(final Stringsignature)
end note
if (signature.equals("D")||signature.equals("U")) then (yes) 
:return "33";;
stop
else if (signature.equals("L")||signature.equals("R")) then (yes) 
:return "55";;
stop
else if (signature.equals("RD")) then (yes) 
:return "123";;
stop
else if (signature.equals("RU")) then (yes) 
:return "543";;
stop
else if (signature.equals("LD")) then (yes) 
:return "187";;
stop
else if (signature.equals("DL")) then (yes) 
:return "345";;
stop
else if (signature.equals("DR")) then (yes) 
:return "765";;
stop
else if (signature.equals("UL")) then (yes) 
:return "321";;
stop
else if (signature.equals("UR")) then (yes) 
:return "781";;
stop
endif 
:return null ;;
stop
end
start
note right
constructor WormMutation(Stringdefinition,
doubledelta)
end note
:this.translations.add(translation(Integer.parseInt(definition.substring(i,i+
1)),delta));;
end
start
note right
UTranslatetranslation(inttype,doubledelta)
end note
switch (switch (type))
endswith
:throw new IllegalArgumentException();;
stop
end
start
note right
void append(doublev)
end note
if (v>max) then (yes) 
:max=v;;
endif 
if (v<min) then (yes) 
:min=v;;
endif 
end
start
note right
doublegetExtreme()
end note
if (Math.abs(max)>Math.abs(min)) then (yes) 
:return max;;
stop
endif 
:return min;;
stop
end
start
note right
UTranslategetTextTranslate(intsize)
end note
:final MinMaxresult=new MinMax();;
:result.append(tr.getDx());;
:return UTranslate.dx(result.getExtreme()*(size-1));;
stop
end
start
note right
booleanisDxNegative()
end note
:return translations.get(0).getDx()<0;;
stop
end
start
note right
Wormmute(Wormoriginal)
end note
:final Wormresult=new Worm(original.getStyle());;
:result.addPoint(translations.get(i).getTranslated(original.get(i)));;
:return result;;
stop
end
@enduml

