@startuml
!pragma layout smetana
start
note right
constructor FtileDecoratePointOut(final Ftileftile,
final doubledx,doubledy)
end note
:super (ftile);
:this.dx=dx;
if (dx!=0) then (yes) 
:throw new IllegalArgumentException();;
endif 
:this.dy=dy;
end
start
note right
FtileGeometrycalculateDimension(StringBounderstringBounder)
end note
:return new FtileGeometry(geo.getWidth(),
geo.getHeight(),geo.getLeft(),geo.getInY(),
geo.getOutY()+dy);;
stop
end
@enduml

