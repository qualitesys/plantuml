@startuml
!pragma layout smetana
start
note right
UPolygonasPolygon(doubleshadowing)
end note
:return diams;;
stop
end
start
note right
UPolygonasPolygon(doubleshadowing,doublewidth,
doubleheight)
end note
:return diams;;
stop
end
start
note right
StencilasStencil(final TextBlocktb)
end note
:return new Stencil(){private final doublegetDeltaX(doubleheight,
doubley){final doublep=y/height*2;if (p<=1){return hexagonHalfSize*p;}return hexagonHalfSize*(2-p);}public doublegetStartingX(StringBounderstringBounder,doubley){final XDimension2Ddim=tb.calculateDimension(stringBounder);return -getDeltaX(dim.getHeight(),y);}public doublegetEndingX(StringBounderstringBounder,doubley){final XDimension2Ddim=tb.calculateDimension(stringBounder);return dim.getWidth()+getDeltaX(dim.getHeight(),y);}};;
stop
end
start
note right
UPolygonasPolygonSquare(doubleshadowing,doublewidth,
doubleheight)
end note
:return diams;;
stop
end
@enduml

