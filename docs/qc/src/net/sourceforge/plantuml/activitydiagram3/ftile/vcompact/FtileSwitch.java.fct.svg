@startuml
!pragma layout smetana
start
note right
constructor FtileSwitch(List<Double>inlabelSizes,
List<Ftile>tiles,RainbowarrowColor)
end note
:super (tiles.get(0).skinParam());
:this.tiles=new ArrayList<>(tiles);
:this.arrowColor=arrowColor;
end
start
note right
Set<Swimlane>getSwimlanes()
end note
if (getSwimlaneIn()!=null ) then (yes) 
:result.add(getSwimlaneIn());
endif 
:return Collections.unmodifiableSet(result);;
stop
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return tiles.get(0).getSwimlaneIn();;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return getSwimlaneIn();;
stop
end
start
note right
Ftilecreate(Swimlaneswimlane,HColorborderColor,
HColorbackColor,RainbowarrowColor,FtileFactoryftileFactory,
ConditionStyleconditionStyle,List<Branch>thens,
FontConfigurationfcArrow,LinkRenderingtopInlinkRendering,
LinkRenderingafterEndwhile,FontConfigurationfcTest)
end note
:Objects.requireNonNull(afterEndwhile);
:tiles.add(new FtileMinWidthCentered(branch.getFtile(),
30));
if (Display.isNull(branch.getInlabel())) then (yes) 
:inlabelSizes.add(0.0);
else (no)
:tbInlabel=branch.getInlabel().create(fcArrow,
HorizontalAlignment.LEFT,ftileFactory.skinParam());
:inlabelSizes.add(tbInlabel.calculateDimension(ftileFactory.getStringBounder())
.getWidth());
:diamond=diamond.withWest(tbInlabel);
endif 
:diamond=diamond.withNorth(tb1);
:return new FtileSwitch(inlabelSizes,tiles,
arrowColor);;
stop
end
start
note right
Collection<Ftile>getMyChildren()
end note
:return Collections.unmodifiableList(result);;
stop
end
start
note right
UTranslategetTranslateFor(Ftilechild,StringBounderstringBounder)
end note
if (tiles.contains(child)) then (yes) 
:return getTranslate1(child,stringBounder);;
stop
endif 
:throw new UnsupportedOperationException();;
end
start
note right
UTranslategetTranslate1(Ftiletile,StringBounderstringBounder)
end note
if (candidate==tile) then (yes) 
:return new UTranslate(x1,25);;
stop
endif 
:x1+=dim1.getWidth()+xSeparation;
:throw new IllegalArgumentException();;
end
start
note right
void drawU(UGraphicug)
end note
:ug.apply(getTranslate1(tile,stringBounder))
.draw(tile);
end
start
note right
FtileGeometrycalculateDimensionInternal(StringBounderstringBounder)
end note
:result=XDimension2D.mergeLR(result,couple.calculateDimension(stringBounder));
:result=XDimension2D.delta(result,xSeparation*(tiles.size()-1),
100);
:return new FtileGeometry(result,result.getWidth()/2,0);;
stop
end
start
note right
FtileGeometrycalculateDimensionFtile(StringBounderstringBounder)
end note
if (tmp.calculateDimension(stringBounder)
.hasPointOut()) then (yes) 
:return new FtileGeometry(dimTotal,dimTotal.getWidth()/2,
0,dimTotal.getHeight());;
stop
endif 
:return new FtileGeometry(dimTotal,dimTotal.getWidth()/2,0);;
stop
end
@enduml

