@startuml
!pragma layout smetana
start
note right
constructor FtileWithUrl(Ftileftile,Urlurl)
end note
:super (ftile);
:this.url=Objects.requireNonNull(url);
end
start
note right
void drawU(UGraphicug)
end note
:ug.startUrl(url);
:getFtileDelegated().drawU(ug);
:ug.closeUrl();
end
@enduml

