@startuml
!pragma layout smetana
start
note right
constructor FtileMargedRight(Ftiletile,doublemaxX)
end note
end
start
note right
LinkRenderinggetInLinkRendering()
end note
:return tile.getInLinkRendering();;
stop
end
start
note right
LinkRenderinggetOutLinkRendering()
end note
:return tile.getOutLinkRendering();;
stop
end
start
note right
Set<Swimlane>getSwimlanes()
end note
:return tile.getSwimlanes();;
stop
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return tile.getSwimlaneIn();;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return tile.getSwimlaneOut();;
stop
end
start
note right
FtileGeometrycalculateDimensionFtile(StringBounderstringBounder)
end note
if (orig.getWidth()>maxX) then (yes) 
:throw new IllegalStateException();;
endif 
:return new FtileGeometry(maxX,orig.getHeight(),
orig.getLeft(),orig.getInY(),orig.getOutY());;
stop
end
start
note right
void drawU(UGraphicug)
end note
end
