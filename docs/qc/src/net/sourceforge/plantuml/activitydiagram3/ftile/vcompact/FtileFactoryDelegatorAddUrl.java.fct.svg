@startuml
!pragma layout smetana
start
note right
constructor FtileFactoryDelegatorAddUrl(FtileFactoryfactory)
end note
end
start
note right
FtileaddUrl(Ftileftile,Urlurl)
end note
if (ftile instanceof FtileBox) then (yes) 
:return new FtileWithUrl(ftile,url);;
stop
endif 
:return ftile;;
stop
end
@enduml

