start
note right
void drawU(UGraphicug)
end note
if (getFtile1().calculateDimension(stringBounder)
.hasPointOut()==false) then (yes) 
:return ;;
stop
endif 
:snake.addPoint(getP1(stringBounder));
:snake.addPoint(getP2(stringBounder));
:ug.draw(snake);
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,
UTranslatetranslate2)
end note
if (getFtile1().calculateDimension(stringBounder)
.hasPointOut()==false) then (yes) 
:return ;;
stop
endif 
:snake.addPoint(mp1a);
:snake.addPoint(mp1a.getX(),middle);
:snake.addPoint(mp2b.getX(),middle);
:ug.draw(snake);
:small.addPoint(mp2b.getX(),middle);
:small.addPoint(mp2b);
:ug.draw(small);
end
