note right
void drawTranslate(UGraphicug,UTranslatetranslate1,
UTranslatetranslate2)
end note
:p1=translate1.getTranslated(p1);
:p2=translate2.getTranslated(p2);
if (x2<x1_a) then (yes) 
:snake=Snake.create(skinParam(),arrowColor,
Arrows.asToLeft()).emphasizeDirection(Direction.UP);
:snake.addPoint(x1_a,y1);
if (x1_a<x1_b) then (yes) 
:snake.addPoint(x1_b,y1);
:snake.addPoint(x1_b,y2);
else (no)
:snake.addPoint(x1_a+10,y1);
:snake.addPoint(x1_a+10,y2);
endif 
else (no)
:x2=p2.getX();
:snake=Snake.create(skinParam(),arrowColor,
Arrows.asToRight()).emphasizeDirection(Direction.UP);
:snake.addPoint(x1_a,y1);
:snake.addPoint(middle,y1);
:snake.addPoint(middle,y2);
endif 
:snake.addPoint(x2,y2);
:ug.draw(snake);
end
