note right
void drawU(UGraphicug)
end note
:snake.addPoint(p1);
if (p1.getX()!=p2.getX()) then (yes) 
:snake.addPoint(new XPoint2D(p1.getX(),my));
:snake.addPoint(new XPoint2D(p2.getX(),my));
endif 
:snake.addPoint(p2);
:ug.draw(snake);
end
