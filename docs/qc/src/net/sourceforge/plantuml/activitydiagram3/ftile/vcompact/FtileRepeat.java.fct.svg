start
note right
constructor FtileRepeat(Ftilerepeat,Ftilediamond1,
Ftilediamond2,TextBlocktbTest,Ftilebackward)
end note
:super (repeat.skinParam());
:this.repeat=repeat;
:this.diamond1=diamond1;
:this.diamond2=diamond2;
:this.tbTest=tbTest;
:this.backward=backward;
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return repeat.getSwimlaneIn();;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return diamond2.getSwimlaneOut();;
stop
end
start
note right
Set<Swimlane>getSwimlanes()
end note
:result.addAll(diamond1.getSwimlanes());
:result.addAll(diamond2.getSwimlanes());
if (backward!=null ) then (yes) 
:result.addAll(backward.getSwimlanes());
endif 
:return Collections.unmodifiableSet(result);;
stop
end
start
note right
Ftilecreate(Swimlaneswimlane,SwimlaneswimlaneOut,
Ftileentry,Ftilerepeat,Displaytest,Displayyes,
Displayout,HColorborderColor,HColordiamondColor,
RainbowarrowColor,RainbowendRepeatLinkColor,
ConditionStyleconditionStyle,ISkinSimplespriteContainer,
FontConfigurationfcDiamond,FontConfigurationfcArrow,
Ftilebackward,booleannoOut,LinkRenderingincoming1,
LinkRenderingincoming2)
end note
if (entry==null ) then (yes) 
:diamond1=new FtileDiamond(repeat.skinParam(),
diamondColor,borderColor,repeat.getSwimlaneIn());
else (no)
:diamond1=entry;
endif 
if (conditionStyle==ConditionStyle.INSIDE_HEXAGON) then (yes) 
if (noOut&&Display.isNull(test)) then (yes) 
:diamond2=new FtileEmpty(repeat.skinParam());
else (no)
:diamond2=new FtileDiamondInside(tbTest,repeat.skinParam(),
diamondColor,borderColor,swimlaneOut).withEast(yesTb)
.withSouth(outTb);
endif 
:result=new FtileRepeat(repeat,diamond1,diamond2,
TextBlockUtils.empty(0,0),backward);
else (no)
:throw new IllegalStateException();;
endif 
:conns.add(result.new ConnectionIn(repeat.getInLinkRendering().getRainbow(arrowColor),
tbin1));
if (incoming1==null ||incoming1.getDisplay()==null ) then (yes) 
:incomingText=null ;
else (no)
:incomingText=incoming1.getDisplay().create7(fcArrow,
HorizontalAlignment.LEFT,spriteContainer,
CreoleMode.SIMPLE_LINE);
endif 
if (backward!=null ) then (yes) 
:conns.add(result.new ConnectionBackBackward1(rainbow1,
incomingText));
:conns.add(result.new ConnectionBackBackward2(rainbow2,
backArrowLabel));
else (no)
:conns.add(result.new ConnectionBackComplex1(incoming1.getRainbow(arrowColor)));
endif 
:conns.add(result.new ConnectionOut(tmpColor,
tbout1));
:return FtileUtils.addConnection(result,conns);;
stop
end
