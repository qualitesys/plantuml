@startuml
!pragma layout smetana
start
note right
Collection<Ftile>getMyChildren()
end note
:return Collections.emptyList();;
stop
end
start
note right
constructor FtileCircleEnd(ISkinParamskinParam,
HColorbackColor,HColorborderColor,Swimlaneswimlane,
Stylestyle)
end note
end
start
note right
Set<Swimlane>getSwimlanes()
end note
if (swimlane==null ) then (yes) 
:return Collections.emptySet();;
stop
endif 
:return Collections.singleton(swimlane);;
stop
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return swimlane;;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return swimlane;;
stop
end
start
note right
void drawU(UGraphicug)
end note
end
start
note right
FtileGeometrycalculateDimensionFtile(StringBounderstringBounder)
end note
:return new FtileGeometry(SIZE,SIZE,SIZE/2,0);;
stop
end
@enduml

