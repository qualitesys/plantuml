@startuml
!pragma layout smetana
start
note right
constructor FloatingNote(Displaynote,ISkinParamskinParam,
SNamesname,booleanwithLink)
end note
end
start
note right
FloatingNotecreate(Displaynote,ISkinParamskinParam,
SNamesname)
end note
:return new FloatingNote(note,skinParam,sname,
false);;
stop
end
start
note right
FloatingNotecreateOpale(Displaynote,ISkinParamskinParam,
SNamesname)
end note
:return new FloatingNote(note,skinParam,sname,
true);;
stop
end
start
note right
void setOpale(Directionstrategy,XPoint2Dpp1,
XPoint2Dpp2)
end note
end
start
note right
void drawU(UGraphicug)
end note
end
start
note right
XDimension2DcalculateDimension(StringBounderstringBounder)
end note
:return opale.calculateDimension(stringBounder);;
stop
end
start
note right
doublegetStartingX(StringBounderstringBounder,
doubley)
end note
:return -opale.getMarginX1();;
stop
end
start
note right
doublegetEndingX(StringBounderstringBounder,
doubley)
end note
:return opale.calculateDimension(stringBounder)
.getWidth()-opale.getMarginX1();;
stop
end
@enduml

