@startuml
!pragma layout smetana
start
note right
constructor FtileKilled(FtiletileToKill)
end note
end
start
note right
Collection<Ftile>getMyChildren()
end note
:return tile.getMyChildren();;
stop
end
start
note right
Set<Swimlane>getSwimlanes()
end note
:return tile.getSwimlanes();;
stop
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return tile.getSwimlaneIn();;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return tile.getSwimlaneOut();;
stop
end
start
note right
FtileGeometrycalculateDimensionFtile(StringBounderstringBounder)
end note
:return new FtileGeometry(tile.calculateDimension(stringBounder),
geo.getLeft(),geo.getInY());;
stop
end
start
note right
void drawU(UGraphicug)
end note
end
