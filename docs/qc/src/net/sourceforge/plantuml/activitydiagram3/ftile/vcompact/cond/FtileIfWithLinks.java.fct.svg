UTranslatetranslate(StringBounderstringBounder)
end note
if (getFtile2()==tile1) then (yes) 
:return getTranslate1(stringBounder);;
stop
endif 
if (getFtile2()==tile2) then (yes) 
:return getTranslate2(stringBounder);;
stop
endif 
:throw new IllegalStateException();;
end
start
note right
void drawTranslate(UGraphicug,UTranslatetranslate1,
UTranslatetranslate2)
end note
:p1=translate1.getTranslated(p1);
:p2=translate2.getTranslated(p2);
if (originalDirection!=newDirection) then (yes) 
:small.addPoint(p1);
:small.addPoint(p1.getX()+delta,p1.getY());
:small.addPoint(p1.getX()+delta,p1.getY()+
dimDiamond1.getHeight()*.75);
:ug.draw(small);
:p1=small.getLast();
endif 
:snake.addPoint(p1);
:snake.addPoint(p2.getX(),p1.getY());
:snake.addPoint(p2);
:ug.draw(snake);
end
start
note right
constructor ConnectionVerticalThenHorizontal(Ftiletile,
