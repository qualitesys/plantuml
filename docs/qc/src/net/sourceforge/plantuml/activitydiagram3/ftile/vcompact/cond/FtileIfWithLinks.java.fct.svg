note right
void drawU(UGraphicug)
end note
:allTiles.add(tile1);
:allTiles.add(tile2);
if (ug instanceof UGraphicInterceptorOneSwimlane) then (yes) 
:minmax=getMinmax(stringBounder,totalDim.getWidth(),
allTiles,interceptor.getSwimlane(),allSwimlanes);
else (no)
:minmax=getMinmaxSimple(stringBounder,totalDim.getWidth(),
allTiles);
endif 
if (Double.isNaN(minX)||Double.isNaN(maxX)) then (yes) 
:return ;;
stop
endif 
:s.addPoint(minX,totalDim.getHeight());
:s.addPoint(maxX,totalDim.getHeight());
:ug.draw(s);
end
start
note right
double[]getMinmax(StringBounderstringBounder,
doublewidth,List<Ftile>allTiles,SwimlaneintoSw,
List<Swimlane>allSwimlanes)
end note
if (current==-1) then (yes) 
:throw new IllegalStateException();;
endif 
if (current<first||current>last) then (yes) 
:return new double[]{Double.NaN,Double.NaN};;
stop
endif 
if (tmp.calculateDimension(stringBounder)
.hasPointOut()==false) then (yes) 
endif 
if (ftileDoesOutcomeInThatSwimlane(tmp,intoSw)==false) then (yes) 
endif 
:minX=Math.min(minX,out);
:maxX=Math.max(maxX,out);
:return new double[]{minX,maxX};;
stop
end
start
note right
double[]getMinmaxSimple(StringBounderstringBounder,
doublewidth,List<Ftile>allTiles)
end note
if (tmp.calculateDimension(stringBounder)
.hasPointOut()==false) then (yes) 
endif 
:minX=Math.min(minX,out);
:maxX=Math.max(maxX,out);
:return new double[]{minX,maxX};;
stop
end
start
note right
intgetFirstSwimlane(StringBounderstringBounder,
List<Ftile>allTiles,List<Swimlane>allSwimlanes)
end note
:i++;
if (atLeastOne(stringBounder,allSwimlanes.get(i),
allTiles)) then (yes) 
:return i;;
stop
endif 
:throw new IllegalStateException();;
end
start
note right
intgetLastSwimlane(StringBounderstringBounder,
List<Ftile>allTiles,List<Swimlane>allSwimlanes)
end note
:i- -;
if (atLeastOne(stringBounder,allSwimlanes.get(i),
allTiles)) then (yes) 
:return i;;
stop
endif 
:throw new IllegalStateException();;
end
start
note right
booleanatLeastOne(StringBounderstringBounder,
SwimlaneintoSw,List<Ftile>allTiles)
end note
if (tmp.calculateDimension(stringBounder).hasPointOut()&&ftileDoesOutcomeInThatSwimlane(tmp,
intoSw)) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleanftileDoesOutcomeInThatSwimlane(Ftileftile,
Swimlaneswimlane)
end note
:return ftile.getSwimlaneOut()==swimlane&&ftile.getSwimlanes()
.contains(swimlane);;
stop
end
start
note right
FtileaddLinks(Branchbranch1,Branchbranch2,
StringBounderstringBounder)
end note
:conns.add(new ConnectionHorizontalThenVertical(tile1,
branch1));
:conns.add(new ConnectionHorizontalThenVertical(tile2,
branch2));
if (conditionEndStyle==ConditionEndStyle.DIAMOND) then (yes) 
if (hasPointOut1&&hasPointOut2) then (yes) 
:conns.add(new ConnectionVerticalThenHorizontal(tile1,
branch1.getOut(),branch1.isEmpty()));
:conns.add(new ConnectionVerticalThenHorizontal(tile2,
branch2.getOut(),branch2.isEmpty()));
endif 
endif 
:return FtileUtils.addConnection(this,conns);;
stop
