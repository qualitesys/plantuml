start
note right
constructor FtileIfWithLinks(Ftilediamond1,
Ftiletile1,Ftiletile2,Ftilediamond2,Swimlanein,
RainbowarrowColor,ConditionEndStyleconditionEndStyle,
StringBounderstringBounder)
end note
:super (diamond1,tile1,tile2,diamond2,in,
stringBounder);
:this.arrowColor=arrowColor;
:this.conditionEndStyle=conditionEndStyle;
if (arrowColor.size()==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
constructor ConnectionHorizontalThenVertical(Ftiletile,
Branchbranch)
end note
:super (diamond1,tile);
:color=branch.getInColor(arrowColor);
if (color.size()==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
:usingArrow=branch.isEmpty()? null :Arrows.asToDown();
end
