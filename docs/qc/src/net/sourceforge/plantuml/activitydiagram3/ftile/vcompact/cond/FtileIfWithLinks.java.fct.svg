note right
void drawU(UGraphicug)
end note
:snake.addPoint(x1,y1);
:snake.addPoint(x2,y1);
:snake.addPoint(x2,y2);
:ug.draw(snake);
end
start
note right
XPoint2DgetP1(StringBounderstringBounder)
end note
if (getFtile2()==tile1) then (yes) 
:pt=dimDiamond1.getPointD();
else (no)
:throw new IllegalStateException();;
endif 
:return getTranslateDiamond1(stringBounder)
.getTranslated(pt);;
stop
end
start
note right
XPoint2DgetP2(final StringBounderstringBounder)
end note
:return translate(stringBounder).getTranslated(getFtile2()
.calculateDimension(stringBounder).getPointIn());;
stop
end
start
