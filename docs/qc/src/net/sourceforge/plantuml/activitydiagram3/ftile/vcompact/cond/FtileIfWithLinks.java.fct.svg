if (geo.hasPointOut()==false) then (yes) 
:return ;;
stop
endif 
if (originalDirection==newDirection) then (yes) 
:snake.addPoint(mp1a);
:snake.addPoint(mp1a.getX(),middle);
:snake.addPoint(mp2bc.getX(),middle);
:snake.addPoint(mp2bc);
:ug.draw(snake);
:small.addPoint(mp2bc);
:small.addPoint(mp2bc.getX(),mp2b.getY());
:small.addPoint(mp2b);
:ug.draw(small);
else (no)
:snake.addPoint(mp1a);
:snake.addPoint(mp1a.getX(),mp2bb.getY());
:snake.addPoint(mp2bb);
:ug.draw(snake);
:small.addPoint(mp2bb);
:small.addPoint(mp2bb.getX(),mp2b.getY());
:small.addPoint(mp2b);
:ug.draw(small);
endif 
end
