void drawU(UGraphicug)
end note
if (geo.hasPointOut()==false) then (yes) 
:return ;;
stop
endif 
if (branchEmpty) then (yes) 
:snake=snake.emphasizeDirection(Direction.DOWN);
endif 
:snake.addPoint(x1,y1);
:snake.addPoint(x1,y2);
:snake.addPoint(x2,y2);
:ug.draw(snake);
end
