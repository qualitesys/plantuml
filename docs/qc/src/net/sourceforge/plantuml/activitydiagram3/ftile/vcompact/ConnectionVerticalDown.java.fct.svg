@startuml
!pragma layout smetana
start
note right
constructor ConnectionVerticalDown(Ftileftile1,
Ftileftile2,XPoint2Dp1,XPoint2Dp2,Rainbowcolor,
TextBlocktextBlock)
end note
:super (ftile1,ftile2);
if (color.size()==0) then (yes) 
:throw new IllegalArgumentException();;
endif 
:this.p1=p1;
:this.p2=p2;
:this.color=color;
:this.textBlock=textBlock;
end
start
note right
void drawU(UGraphicug)
end note
:ug.draw(getSimpleSnake());
end
start
note right
doublegetMaxX(StringBounderstringBounder)
end note
:return getSimpleSnake().getMaxX(stringBounder);;
stop
end
start
note right
SnakegetSimpleSnake()
end note
:snake.addPoint(p1);
:snake.addPoint(p2);
:return snake;;
stop
end
start
