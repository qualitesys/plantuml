@startuml
!pragma layout smetana
start
note right
constructor AbstractConnection(Ftileftile1,
Ftileftile2)
end note
end
start
note right
StringtoString()
end note
:return "["+ftile1+"]->["+ftile2+"]";;
stop
end
start
note right
FtilegetFtile1()
end note
:return ftile1;;
stop
end
start
note right
FtilegetFtile2()
end note
:return ftile2;;
stop
end
start
note right
HorizontalAlignmentarrowHorizontalAlignment()
end note
if (ftile1!=null ) then (yes) 
:return ftile1.arrowHorizontalAlignment();;
stop
endif 
if (ftile2!=null ) then (yes) 
:return ftile2.arrowHorizontalAlignment();;
stop
endif 
:return HorizontalAlignment.LEFT;;
stop
end
@enduml

