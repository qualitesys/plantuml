" x1="292" x2="146.5" y1="1051.2813" y2="1051.2813"/><line style="stroke:#181818;stroke-width:1.0;" x1="146.5" x2="146.5" y1="1051.2813" y2="1071.2813"/><polygon fill="#181818" points="142.5,1061.2813,146.5,1071.2813,150.5,1061.2813,146.5,1065.2813" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="146.5" x2="146.5" y1="1105.25" y2="1125.25"/><polygon fill="#181818" points="142.5,1115.25,146.5,1125.25,150.5,1115.25,146.5,1119.25" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[175828410aad94f5a4b9d97010da3584]
@startuml
!pragma layout smetana
start
note right
constructor AbstractConnection(Ftileftile1,Ftileftile2)
end note
:this.ftile1=ftile1;
:this.ftile2=ftile2;
end
start
note right
StringtoString()
end note
:return "["+ftile1+"]->["+ftile2+"]";;
stop
end
start
note right
FtilegetFtile1()
end note
:return ftile1;;
stop
end
start
note right
FtilegetFtile2()
end note
:return ftile2;;
stop
end
start
note right
HorizontalAlignmentarrowHorizontalAlignment()
end note
if (ftile1!=null ) then (yes) 
:return ftile1.arrowHorizontalAlignment();;
stop
endif 
if (ftile2!=null ) then (yes) 
:return ftile2.arrowHorizontalAlignment();;
stop
endif 
:return HorizontalAlignment.LEFT;;
stop
end
@enduml

