@startuml
!pragma layout smetana
start
note right
constructor FtileFactoryDelegatorAssembly(FtileFactoryfactory)
end note
:super (factory);
end
start
note right
Ftileassembly(final Ftiletile1,final Ftiletile2)
end note
if (textBlock!=null ) then (yes) 
:height+=textBlock.calculateDimension(stringBounder)
.getHeight();
endif 
if (geo.hasPointOut()==false) then (yes) 
:return result;;
stop
endif 
:result=FtileUtils.addConnection(result,connection);
if (textBlock!=null ) then (yes) 
if (width<maxX) then (yes) 
:result=new FtileMargedRight(result,maxX);
endif 
endif 
:return result;;
stop
end
@enduml

