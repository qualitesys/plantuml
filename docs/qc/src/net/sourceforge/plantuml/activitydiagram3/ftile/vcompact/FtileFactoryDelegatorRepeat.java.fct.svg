if (weldingPoints.size()>0) then (yes) 
:result=assembly(FtileUtils.addHorizontalMargin(result,
10,0),diamondBreak);
:result=FtileUtils.addConnection(result,new Connection(){public void drawU(UGraphicug){final UTranslatetr1=genealogy.getTranslate(ftileBreak,ug.getStringBounder());final UTranslatetr2=genealogy.getTranslate(diamondBreak,ug.getStringBounder());final XDimension2DdimDiamond=diamondBreak.calculateDimension(ug.getStringBounder());final Snakesnake=Snake.create(skinParam(),arrowColor,Arrows.asToRight());snake.addPoint(tr1.getDx(),tr1.getDy());snake.addPoint(0,tr1.getDy());snake.addPoint(0,tr2.getDy()+dimDiamond.getHeight()/2);snake.addPoint(tr2.getDx(),tr2.getDy()+dimDiamond.getHeight()/2);ug.draw(snake);}public FtilegetFtile1(){return ftileBreak;}public FtilegetFtile2(){return diamondBreak;}});
endif 
:return result;;
stop
end
start
