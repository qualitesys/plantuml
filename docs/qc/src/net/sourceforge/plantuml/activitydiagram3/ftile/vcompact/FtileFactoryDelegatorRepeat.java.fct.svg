@startuml
!pragma layout smetana
start
note right
constructor FtileFactoryDelegatorRepeat(FtileFactoryfactory)
end note
:super (factory);
end
start
note right
Ftilerepeat(BoxStyleboxStyleIn,Swimlaneswimlane,
