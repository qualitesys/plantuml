5,935.8164,241.5,925.8164,237.5,929.8164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="237.5" x2="237.5" y1="1020.3828" y2="1042.9492"/><polygon fill="#181818" points="233.5,1032.9492,237.5,1042.9492,241.5,1032.9492,237.5,1036.9492" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="237.5" x2="237.5" y1="1076.918" y2="1096.918"/><polygon fill="#181818" points="233.5,1086.918,237.5,1096.918,241.5,1086.918,237.5,1090.918" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ff5381cf3f5bfd43f274f1b0a0eba852]
@startuml
!pragma layout smetana
start
note right
constructor UGraphicInterceptorOneSwimlane(UGraphicug,Swimlaneswimlane,List<Swimlane>orderedList)
end note
:super (ug);
:this.swimlane=swimlane;
:this.orderedList=orderedList;
end
start
note right
void draw(UShapeshape)
end note
if (shape instanceof Ftile) then (yes) 
if (contained) then (yes) 
:tile.drawU(this);
endif 
else (no)
:getUg().draw(shape);
endif 
end
start
note right
void drawGoto()
end note
:ugGoto.draw(new ULine(100,100));
end
start
note right
UGraphicapply(UChangechange)
end note
:return new UGraphicInterceptorOneSwimlane(getUg().apply(change),
swimlane,orderedList);;
stop
end
start
note right
SwimlanegetSwimlane()
end note
:return swimlane;;
stop
end
start
note right
List<Swimlane>getOrderedListOfAllSwimlanes()
end note
:return Collections.unmodifiableList(orderedList);;
stop
end
@enduml

