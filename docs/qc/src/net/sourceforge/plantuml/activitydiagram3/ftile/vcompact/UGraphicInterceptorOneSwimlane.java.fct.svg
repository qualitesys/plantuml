@startuml
!pragma layout smetana
start
note right
constructor UGraphicInterceptorOneSwimlane(UGraphicug,
Swimlaneswimlane,List<Swimlane>orderedList)
end note
:super (ug);
:this.swimlane=swimlane;
:this.orderedList=orderedList;
end
start
note right
void draw(UShapeshape)
end note
if (shape instanceof Ftile) then (yes) 
if (contained) then (yes) 
:tile.drawU(this);
endif 
else (no)
:getUg().draw(shape);
endif 
end
start
note right
void drawGoto()
end note
:ugGoto.draw(new ULine(100,100));
end
start
note right
UGraphicapply(UChangechange)
end note
:return new UGraphicInterceptorOneSwimlane(getUg().apply(change),
swimlane,orderedList);;
stop
end
start
note right
SwimlanegetSwimlane()
end note
:return swimlane;;
stop
end
start
note right
List<Swimlane>getOrderedListOfAllSwimlanes()
end note
:return Collections.unmodifiableList(orderedList);;
stop
end
@enduml

