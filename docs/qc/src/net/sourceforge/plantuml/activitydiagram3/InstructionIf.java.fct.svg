@startuml
!pragma layout smetana
start
note right
booleancontainsBreak()
end note
if (branch.containsBreak()) then (yes) 
:return true;;
stop
endif 
if (elseBranch!=null ) then (yes) 
:return elseBranch.containsBreak();;
stop
endif 
:return false;;
stop
end
start
note right
constructor InstructionIf(Swimlaneswimlane,
Instructionparent,DisplaylabelTest,LinkRenderingwhenThen,
LinkRenderinginlinkRendering,HColorcolor,
ISkinParamskinParam,Urlurl)
end note
:this.url=url;
:this.parent=parent;
:this.skinParam=skinParam;
:this.topInlinkRendering=Objects.requireNonNull(inlinkRendering);
:this.swimlane=swimlane;
:this.thens.add(new Branch(skinParam.getCurrentStyleBuilder(),
swimlane,whenThen,labelTest,color,LinkRendering.none()));
:this.current=this.thens.get(0);
end
start
note right
CommandExecutionResultadd(Instructionins)
end note
:return current.add(ins);;
stop
end
start
note right
GtilecreateGtile(ISkinParamskinParam,StringBounderstringBounder)
end note
:branch.updateGtile(skinParam,stringBounder);
:gtiles.add(branch.getGtile());
:branches.add(branch);
if (elseBranch!=null &&elseBranch.isEmpty()==false) then (yes) 
:elseBranch.updateGtile(skinParam,stringBounder);
:gtiles.add(elseBranch.getGtile());
:branches.add(elseBranch);
endif 
if (branches.size()==1) then (yes) 
:return new GtileIfAlone(swimlane,gtiles.get(0),
branches.get(0));;
stop
endif 
:return GtileIfHexagon.build(swimlane,gtiles,
branches);;
stop
end
start
note right
FtilecreateFtile(FtileFactoryfactory)
end note
:branch.updateFtile(factory);
if (elseBranch==null ) then (yes) 
:this.elseBranch=new Branch(skinParam.getCurrentStyleBuilder(),
swimlane,LinkRendering.none(),Display.NULL,
null ,LinkRendering.none());
endif 
:elseBranch.updateFtile(factory);
if (getPositionedNotes().size()>0) then (yes) 
:result=FtileWithNoteOpale.create(result,
getPositionedNotes(),skinParam,false,VerticalAlignment.CENTER);
endif 
:weldingPoints.addAll(branch.getWeldingPoints());
:weldingPoints.addAll(elseBranch.getWeldingPoints());
if (weldingPoints.size()>0) then (yes) 
:result=new FtileDecorateWelding(result,weldingPoints);
endif 
:return result;;
stop
end
start
note right
InstructiongetParent()
end note
:return parent;;
stop
end
start
note right
booleanswithToElse2(LinkRenderingwhenElse,
LinkRenderingnextLinkRenderer)
end note
if (elseBranch!=null ) then (yes) 
:return false;;
stop
endif 
:this.current.setInlinkRendering(nextLinkRenderer);
:this.elseBranch=new Branch(skinParam.getCurrentStyleBuilder(),
swimlane,whenElse,Display.NULL,null ,LinkRendering.none());
:this.current=elseBranch;
:return true;;
stop
end
start
note right
booleanelseIf(LinkRenderinginlabel,Displaytest,
LinkRenderingwhenThen,LinkRenderingnextLinkRenderer,
HColorcolor)
end note
if (elseBranch!=null ) then (yes) 
:return false;;
stop
endif 
:this.current.setSpecial(nextLinkRenderer);
:this.current=new Branch(skinParam.getCurrentStyleBuilder(),
swimlane,whenThen,test,color,inlabel);
:this.thens.add(current);
:return true;;
stop
end
start
note right
void endif(LinkRenderingnextLinkRenderer)
end note
:endifCalled=true;
if (elseBranch==null ) then (yes) 
:this.elseBranch=new Branch(skinParam.getCurrentStyleBuilder(),
swimlane,LinkRendering.none(),Display.NULL,
null ,LinkRendering.none());
endif 
:this.elseBranch.setSpecial(nextLinkRenderer);
:this.current.setInlinkRendering(nextLinkRenderer);
end
start
note right
booleankill()
end note
if (endifCalled) then (yes) 
if (branch.getLast()!=null &&branch.getLast()
.kill()==false) then (yes) 
:return false;;
stop
endif 
if (elseBranch!=null &&elseBranch.getLast()!=null &&elseBranch.getLast()
.kill()==false) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
endif 
:return current.kill();;
stop
end
start
note right
LinkRenderinggetInLinkRendering()
end note
:return topInlinkRendering;;
stop
end
start
note right
booleanaddNote(Displaynote,NotePositionposition,
NoteTypetype,Colorscolors,SwimlaneswimlaneNote)
end note
if (endifCalled||current.isEmpty()) then (yes) 
:return super .addNote(note,position,type,
colors,swimlaneNote);;
stop
else (no)
:return current.addNote(note,position,type,
colors,swimlaneNote);;
stop
endif 
end
start
note right
Set<Swimlane>getSwimlanes()
end note
if (swimlane!=null ) then (yes) 
:result.add(swimlane);
endif 
:result.addAll(branch.getSwimlanes());
if (elseBranch!=null ) then (yes) 
:result.addAll(elseBranch.getSwimlanes());
endif 
:return Collections.unmodifiableSet(result);;
stop
end
start
note right
SwimlanegetSwimlaneIn()
end note
:return swimlane;;
stop
end
start
note right
SwimlanegetSwimlaneOut()
end note
:return swimlane;;
stop
end
start
note right
InstructiongetLast()
end note
if (elseBranch==null ) then (yes) 
:return thens.get(thens.size()-1).getLast();;
stop
endif 
:return elseBranch.getLast();;
stop
end
start
note right
void outColor(LinkRenderingoutColor)
end note
:this.outColor=outColor;
end
@enduml

