@startuml
!pragma layout smetana
start
note right
booleancontainsBreak()
end note
:return false;;
stop
end
start
note right
constructor InstructionSpot(Stringspot,HColorcolor,
LinkRenderinginlinkRendering,Swimlaneswimlane)
end note
end
start
note right
FtilecreateFtile(FtileFactoryfactory)
end note
if (killed) then (yes) 
:return new FtileKilled(result);;
stop
endif 
:return result;;
stop
end
start
note right
GtilecreateGtile(ISkinParamskinParam,StringBounderstringBounder)
end note
:return new GtileCircleSpot(stringBounder,
skinParam,color,getSwimlaneIn(),spot,font);;
stop
end
start
note right
CommandExecutionResultadd(Instructionother)
end note
:throw new UnsupportedOperationException();;
end
start
note right
booleankill()
end note
:return true;;
stop
end
start
note right
LinkRenderinggetInLinkRendering()
end note
:return inlinkRendering;;
stop
end
@enduml

