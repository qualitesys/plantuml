@startuml
!pragma layout smetana
start
note right
ElkLabelcreateLabel(ElkEdgeedge)
end note
:return new ElkLabel(Reflect.callStatic2("org.eclipse.elk.graph.util.ElkGraphUtil","createLabel",edge.obj));;
stop
end
start
note right
ElkLabelcreateLabel(ElkNodenode)
end note
:return new ElkLabel(Reflect.callStatic2("org.eclipse.elk.graph.util.ElkGraphUtil","createLabel",node.obj));;
stop
end
start
note right
ElkNodecreateNode(ElkNoderoot)
end note
:return new ElkNode(Reflect.callStatic2("org.eclipse.elk.graph.util.ElkGraphUtil","createNode",root.obj));;
stop
end
start
note right
ElkEdgecreateSimpleEdge(ElkNodenode1,ElkNodenode2)
end note
:return new ElkEdge(Reflect.callStatic2("org.eclipse.elk.graph.util.ElkGraphUtil","createSimpleEdge",node1.obj,node2.obj));;
stop
end
start
note right
ElkNodecreateGraph()
end note
:return new ElkNode(Reflect.callStatic("org.eclipse.elk.graph.util.ElkGraphUtil","createGraph"));;
stop
end
@enduml

