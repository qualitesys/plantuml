@startuml
!pragma layout smetana
start
note right
constructor ElkNode(Objectobj)
end note
:super (obj);;
end
start
note right
ElkNodegetParent()
end note
if (tmp==null ) then (yes) 
:return null ;;
stop
endif 
:return new ElkNode(tmp);;
stop
end
start
note right
doublegetX()
end note
:return (Double)Reflect.call(obj,"getX");;
stop
end
start
note right
doublegetY()
end note
:return (Double)Reflect.call(obj,"getY");;
stop
end
start
note right
Collection<ElkLabel>getLabels()
end note
:result.add(new ElkLabel(element));;
:return result;;
stop
end
start
note right
doublegetWidth()
end note
:return (Double)Reflect.call(obj,"getWidth");;
stop
end
start
note right
doublegetHeight()
end note
:return (Double)Reflect.call(obj,"getHeight");;
stop
end
start
note right
void setDimensions(doublewidth,doubleheight)
end note
:Reflect.call2(obj,"setDimensions",width,
height);;
end
@enduml

