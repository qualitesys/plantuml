@startuml
!pragma layout smetana
start
note right
constructor ElkWithProperty(Objectobj)
end note
:this.obj=Objects.requireNonNull(obj);
end
start
note right
inthashCode()
end note
:return this.obj.hashCode();;
stop
end
start
note right
booleanequals(Objectother)
end note
:return this.obj.equals(((ElkWithProperty)other)
.obj);;
stop
end
start
note right
void setProperty(Objectkey,Objectvalue)
end note
if (value instanceof EnumSet) then (yes) 
if (result==null ) then (yes) 
:result=EnumSet.noneOf((Class)elk.getClass());
endif 
:result.add(elk);
:Reflect.call2(obj,"setProperty",key,result);
else (no)
:Reflect.call2(obj,"setProperty",key,value);
endif 
end
@enduml

