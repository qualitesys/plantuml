@startuml
!pragma layout smetana
start
note right
constructor ElkEdgeSection(Objectobj)
end note
:this.obj=Objects.requireNonNull(obj);;
end
start
note right
inthashCode()
end note
:return this.obj.hashCode();;
stop
end
start
note right
booleanequals(Objectother)
end note
:return this.obj.equals(((ElkEdgeSection)other)
.obj);;
stop
end
start
note right
doublegetStartX()
end note
:return (Double)Reflect.call(obj,"getStartX");;
stop
end
start
note right
doublegetStartY()
end note
:return (Double)Reflect.call(obj,"getStartY");;
stop
end
start
note right
doublegetEndX()
end note
:return (Double)Reflect.call(obj,"getEndX");;
stop
end
start
note right
doublegetEndY()
end note
:return (Double)Reflect.call(obj,"getEndY");;
stop
end
start
note right
Collection<ElkBendPoint>getBendPoints()
end note
:result.add(new ElkBendPoint(element));;
:return result;;
stop
end
@enduml

