@startuml
!pragma layout smetana
start
note right
constructor ExecutionContextWhile(TokenStackwhileExpression,CodePositioncodePosition)
end note
:this.whileExpression=whileExpression;
:this.codePosition=codePosition;
end
start
note right
StringtoString()
end note
:return whileExpression.toString()+" "+codePosition;;
stop
end
start
note right
ExecutionContextWhilefromValue(TokenStackwhileExpression,CodePositioncodePosition)
end note
:return new ExecutionContextWhile(whileExpression,
codePosition);;
stop
end
start
note right
TValueconditionValue(LineLocationlocation,TContextcontext,TMemorymemory)
end note
:return whileExpression.getResult(location,
context,memory);;
stop
end
start
note right
void skipMe()
end note
:skipMe=true;
end
start
note right
booleanisSkipMe()
end note
:return skipMe;;
stop
end
start
note right
CodePositiongetStartWhile()
end note
:return codePosition;;
stop
end
@enduml

