@startuml
!pragma layout smetana
start
note right
constructor EaterExceptionLocated(Stringmessage,StringLocatedlocation)
end note
:this.message=message;
:this.location=location;
end
start
note right
EaterExceptionLocatedlocated(Stringmessage,StringLocatedlocation)
end note
:return new EaterExceptionLocated(message,
Objects.requireNonNull(location));;
stop
end
start
note right
StringgetMessage()
end note
:return message;;
stop
end
start
note right
StringLocatedgetLocation()
end note
:return location;;
stop
end
@enduml

