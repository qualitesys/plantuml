@startuml
!pragma layout smetana
start
note right
TValuegetVariable(Stringvarname)
end note
:return this.globalVariables.get(varname);;
stop
end
start
note right
void dumpDebug(Stringmessage)
end note
end
start
note right
void dumpMemoryInternal()
end note
end
start
note right
void putVariable(Stringvarname,TValuevalue,
TVariableScopescope)
end note
if (scope==TVariableScope.LOCAL) then (yes) 
:throw EaterException.unlocated("Cannot use local variable here");;
endif 
end
start
note right
void removeVariable(Stringvarname)
end note
end
start
note right
booleanisEmpty()
end note
:return globalVariables.isEmpty();;
stop
end
start
note right
Set<String>variablesNames()
end note
:return Collections.unmodifiableSet(globalVariables.keySet());;
stop
end
start
note right
TrievariablesNames3()
end note
:return variables;;
stop
end
start
note right
TMemoryforkFromGlobal(Map<String,TValue>input)
end note
:return new TMemoryLocal(this,input);;
stop
end
@enduml

