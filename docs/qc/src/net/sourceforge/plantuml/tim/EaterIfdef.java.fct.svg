@startuml
!pragma layout smetana
start
note right
constructor EaterIfdef(StringLocateds)
end note
:super (s);
end
start
note right
void analyze(TContextcontext,TMemorymemory)
end note
:skipSpaces();
:checkAndEatChar("!ifdef");
:skipSpaces();
:expression=eatAllToEnd();
end
start
note right
booleanisTrue(final TContextcontext,final TMemorymemory)
end note
start
note right
booleanisTrue(Stringvarname)
end note
:return currentValue!=null ||context.doesFunctionExist(varname);;
stop
end
:return eval.eval();;
stop
end
@enduml

