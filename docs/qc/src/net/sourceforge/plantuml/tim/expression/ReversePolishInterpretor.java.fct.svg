@startuml
!pragma layout smetana
start
note right
constructor ReversePolishInterpretor(TokenStackqueue,
Knowledgeknowledge,TMemorymemory,TContextcontext)
end note
:this(null ,queue,knowledge,memory,context);;
end
start
note right
constructor ReversePolishInterpretor(LineLocationlocation,
TokenStackqueue,Knowledgeknowledge,TMemorymemory,
TContextcontext)
end note
if (trace) then (yes) 
:System.err.println("ReversePolishInterpretor::queue="+
queue);;
endif 
if (trace) then (yes) 
:System.err.println("rpn "+token);;
endif 
if (token.getTokenType()==TokenType.NUMBER) then (yes) 
:stack.addFirst(TValue.fromNumber(token));;
else (no)
:throw EaterException.unlocated("rpn41");;
stop
endif 
:result=stack.removeFirst();;
end
start
note right
TValuegetResult()
end note
:return result;;
stop
end
@enduml

