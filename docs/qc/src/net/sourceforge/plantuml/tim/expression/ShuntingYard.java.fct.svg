@startuml
!pragma layout smetana
start
note right
void traceMe()
end note
if (TRACE==false) then (yes) 
:return ;;
stop
endif 
:System.err.println("- - - - - - - - - - - - - - - - - - -");
:System.err.println("operatorStack="+operatorStack);
:System.err.println("ouputQueue="+ouputQueue);
:System.err.println("");
end
start
note right
constructor ShuntingYard(TokenIteratorit,
Knowledgeknowledge)
end note
while (it.hasMoreTokens())
:traceMe();
if (TRACE) then (yes) 
:System.err.println("token="+token);
endif 
if (token.getTokenType()==TokenType.NUMBER||token.getTokenType()==TokenType.QUOTED_STRING) then (yes) 
:ouputQueue.add(token);
else (no)
:throw new UnsupportedOperationException(token.toString());;
endif 
endwhile
while (operatorStack.isEmpty()==false)
:ouputQueue.add(token);
endwhile
end
start
note right
booleanisVariableName(Stringname)
end note
:return name.matches("[a-zA-Z0-9.$_]+");;
stop
end
start
note right
booleanthereIsAFunctionAtTheTopOfTheOperatorStack()
end note
:return top!=null &&top.getTokenType()==TokenType.FUNCTION_NAME;;
stop
end
start
note right
booleanthereIsAnOperatorAtTheTopOfTheOperatorStackWithGreaterPrecedence(Tokentoken)
end note
if (top!=null &&top.getTokenType()==TokenType.OPERATOR&&top.getTokenOperator()
.getPrecedence()>token.getTokenOperator()
.getPrecedence()) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleantheOperatorAtTheTopOfTheOperatorStackHasEqualPrecedenceAndIsLeftAssociative(Tokentoken)
end note
if (top!=null &&top.getTokenType()==TokenType.OPERATOR&&top.getTokenOperator()
.isLeftAssociativity()&&top.getTokenOperator()
.getPrecedence()==token.getTokenOperator()
.getPrecedence()) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleantheOperatorAtTheTopOfTheOperatorStackIsNotALeftParenthesis(Tokentoken)
end note
if (top!=null &&top.getTokenType()==TokenType.OPEN_PAREN_MATH) then (yes) 
:return true;;
stop
endif 
:return true;;
stop
end
start
note right
TokenStackgetQueue()
end note
:return this.ouputQueue;;
stop
end
@enduml

