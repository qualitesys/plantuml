@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%darken",2);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==2;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,TMemorymemory,LineLocationlocation,List<TValue>values,Map<String,TValue>named)
end note
:color=color.darken(ratio);
:return TValue.fromString(color.asString());;
stop
:throw EaterException.located("No such color");;
end
@enduml

