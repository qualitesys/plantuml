@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%substr",
3);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==2||nbArg==3;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
if (pos>=full.length()) then (yes) 
:return TValue.fromString("");;
stop
endif 
if (values.size()==3) then (yes) 
if (len<result.length()) then (yes) 
:result=result.substring(0,len);
endif 
