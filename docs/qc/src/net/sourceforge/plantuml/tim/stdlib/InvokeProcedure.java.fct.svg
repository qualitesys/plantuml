@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%invoke_procedure",
1);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg>0;;
stop
end
start
note right
TFunctionTypegetFunctionType()
end note
:return TFunctionType.PROCEDURE;;
stop
end
start
note right
void executeProcedure(TContextcontext,TMemorymemory,
LineLocationlocation,Strings)
end note
:throw new UnsupportedOperationException();;
end
start
note right
void executeProcedureInternal(TContextcontext,
TMemorymemory,List<TValue>args,Map<String,
TValue>named)
end note
if (func==null ) then (yes) 
:throw EaterException.located("Cannot find void function "+fname);;
endif 
:func.executeProcedureInternal(context,memory,
sublist,named);
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
:throw new UnsupportedOperationException();;
end
start
note right
booleanisUnquoted()
end note
:return false;;
stop
end
@enduml

