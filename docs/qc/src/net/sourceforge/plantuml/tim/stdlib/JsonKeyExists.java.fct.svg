@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%json_key_exists",1);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==2;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
if (arg0.isJson()==false) then (yes) 
:return TValue.fromBoolean(false);;
stop
endif 
if (json.isObject()==false) then (yes) 
:return TValue.fromBoolean(false);;
stop
endif 
if (arg1.isString()==false) then (yes) 
:return TValue.fromBoolean(false);;
stop
endif 
if (object.contains(keyname)) then (yes) 
:return TValue.fromBoolean(true);;
stop
endif 
:return TValue.fromBoolean(false);;
stop
end
@enduml

