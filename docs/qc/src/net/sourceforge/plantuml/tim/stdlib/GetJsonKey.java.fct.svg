@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%get_json_keys",1);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==1;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
if (data.isJson()==false) then (yes) 
:throw EaterException.unlocated("Not JSON data");;
stop
endif 
if (json.isObject()) then (yes) 
:result.add(key);;
:return TValue.fromJson(result);;
stop
endif 
if (json.isArray()) then (yes) 
:result.add(key);;
:return TValue.fromJson(result);;
stop
endif 
:throw EaterException.unlocated("Bad JSON type");;
stop
end
@enduml

