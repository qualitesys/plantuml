@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%call_user_func",1);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg>0;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,TMemorymemory,LineLocationlocation,List<TValue>values,Map<String,TValue>named)
end note
if (func==null ) then (yes) 
:throw EaterException.unlocated("Cannot find void function "+
fname);;
endif 
:return func.executeReturnFunction(context,
memory,location,args,named);;
stop
end
@enduml

