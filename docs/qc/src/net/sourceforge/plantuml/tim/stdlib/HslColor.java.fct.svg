18;stroke-width:1.0;" x1="199.5" x2="199.5" y1="354.7695" y2="377.3359"/><polygon fill="#181818" points="195.5,367.3359,199.5,377.3359,203.5,367.3359,199.5,371.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="199.5" x2="199.5" y1="586.1914" y2="606.1914"/><polygon fill="#181818" points="195.5,596.1914,199.5,606.1914,203.5,596.1914,199.5,600.1914" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f93d3ab674b323b771cbbfb0ff385c34]
@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%hsl_color",3);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==3||nbArg==4;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,TMemorymemory,LineLocationlocation,List<TValue>values,Map<String,TValue>named)
end note
if (values.size()==3) then (yes) 
:return TValue.fromString(HColors.simple(rgb).asString());;
stop
endif 
:return TValue.fromString(HColors.simple(rgb).asString());;
stop
end
@enduml

