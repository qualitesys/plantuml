@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%hsl_color",3);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==3||nbArg==4;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,TMemorymemory,LineLocationlocation,List<TValue>values,Map<String,TValue>named)
end note
if (values.size()==3) then (yes) 
:return TValue.fromString(HColors.simple(rgb)
.asString());;
stop
endif 
:return TValue.fromString(HColors.simple(rgb)
.asString());;
stop
end
@enduml

