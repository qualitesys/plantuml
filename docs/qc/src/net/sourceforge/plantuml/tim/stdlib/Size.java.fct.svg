@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%size",1);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==1;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
if (value.isNumber()) then (yes) 
:return TValue.fromInt(0);;
stop
endif 
if (value.isString()) then (yes) 
:return TValue.fromInt(value.toString().length());;
stop
endif 
if (json instanceof JsonArray) then (yes) 
:return TValue.fromInt(array.size());;
stop
endif 
if (json instanceof JsonObject) then (yes) 
:return TValue.fromInt(object.size());;
stop
endif 
:return TValue.fromInt(0);;
stop
end
@enduml

