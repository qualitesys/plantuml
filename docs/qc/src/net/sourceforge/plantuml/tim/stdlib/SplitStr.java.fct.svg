<line style="stroke:#181818;stroke-width:1.0;" x1="163" x2="163" y1="531.2734" y2="551.2734"/><polygon fill="#181818" points="159,541.2734,163,551.2734,167,541.2734,163,545.2734" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[eb5d0682158fc45c088bfd99d05bffb6]
@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%splitstr",3);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==2;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,TMemorymemory,LineLocationlocation,List<TValue>values,Map<String,TValue>named)
end note
while (tokenizer.hasMoreElements())
:result.add(tokenizer.nextToken());
endwhile
:return TValue.fromJson(result);;
stop
end
@enduml

