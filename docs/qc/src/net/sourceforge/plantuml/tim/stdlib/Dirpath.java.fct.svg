5" x2="180.5" y1="715.293" y2="735.293"/><polygon fill="#181818" points="176.5,725.293,180.5,735.293,184.5,725.293,180.5,729.293" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b105554482bea11ccdd959cb09dfb06d]
@startuml
!pragma layout smetana
start
note right
constructor Dirpath(Definesdefines)
end note
:this.value=defines.getEnvironmentValue("dirpath");
end
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%dirpath",0);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==0;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,TMemorymemory,LineLocationlocation,List<TValue>values,Map<String,TValue>named)
end note
if (value==null ) then (yes) 
:return TValue.fromString("");;
stop
endif 
:return TValue.fromString(value);;
stop
end
@enduml

