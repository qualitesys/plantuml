@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%feature",1);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==1;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,TMemorymemory,LineLocationlocation,List<TValue>values,Map<String,TValue>named)
end note
if (String.valueOf("style").equalsIgnoreCase(arg)) then (yes) 
:return TValue.fromInt(1);;
stop
endif 
if (String.valueOf("theme").equalsIgnoreCase(arg)) then (yes) 
:return TValue.fromInt(1);;
stop
endif 
:return TValue.fromInt(0);;
stop
end
@enduml

