,663.375,325,667.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="325" x2="325" y1="594.4883" y2="737.375"/><line style="stroke:#181818;stroke-width:1.0;" x1="325" x2="166.5" y1="737.375" y2="737.375"/><line style="stroke:#181818;stroke-width:1.0;" x1="166.5" x2="166.5" y1="737.375" y2="757.375"/><polygon fill="#181818" points="162.5,747.375,166.5,757.375,170.5,747.375,166.5,751.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="166.5" x2="166.5" y1="791.3438" y2="811.3438"/><polygon fill="#181818" points="162.5,801.3438,166.5,811.3438,170.5,801.3438,166.5,805.3438" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[08bbd870d941c255d96875d15c3c0e99]
@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%feature",1);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==1;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
if (String.valueOf("style").equalsIgnoreCase(arg)) then (yes) 
:return TValue.fromInt(1);;
stop
endif 
if (String.valueOf("theme").equalsIgnoreCase(arg)) then (yes) 
:return TValue.fromInt(1);;
stop
endif 
:return TValue.fromInt(0);;
stop
end
@enduml

