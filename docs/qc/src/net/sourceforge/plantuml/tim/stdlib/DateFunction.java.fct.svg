33,248.25,856.3633" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="248.25" x2="248.25" y1="910.3008" y2="930.3008"/><polygon fill="#181818" points="244.25,920.3008,248.25,930.3008,252.25,920.3008,248.25,924.3008" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="248.25" x2="248.25" y1="996.2695" y2="1016.2695"/><polygon fill="#181818" points="244.25,1006.2695,248.25,1016.2695,252.25,1006.2695,248.25,1010.2695" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="248.25" x2="248.25" y1="1050.2383" y2="1070.2383"/><polygon fill="#181818" points="244.25,1060.2383,248.25,1070.2383,252.25,1060.2383,248.25,1064.2383" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2e9fd650ee116922fc37b93a63fd33a0]
@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%date",2);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==0||nbArg==1||nbArg==2;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
if (values.size()==0) then (yes) 
:return TValue.fromString(new Date().toString());;
stop
endif 
:final Stringformat=values.get(0).toString();;
:final longnow;;
if (values.size()==2) then (yes) 
:now=1000L*values.get(1).toInt();;
else (no)
:now=System.currentTimeMillis();;
endif 
:try ;
:return TValue.fromString(new SimpleDateFormat(format)
.format(now));;
stop
:catch (Exceptione);
:throw EaterException.unlocated("Bad date pattern");;
stop
end
@enduml

