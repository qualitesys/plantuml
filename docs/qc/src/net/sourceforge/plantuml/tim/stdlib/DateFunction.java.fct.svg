44.25" x2="244.25" y1="748.3945" y2="768.3945"/><polygon fill="#181818" points="240.25,758.3945,244.25,768.3945,248.25,758.3945,244.25,762.3945" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="244.25" x2="244.25" y1="834.3633" y2="854.3633"/><polygon fill="#181818" points="240.25,844.3633,244.25,854.3633,248.25,844.3633,244.25,848.3633" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5910ff9edf2fea8f7c3d91b97d8f0995]
@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%date",2);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==0||nbArg==1||nbArg==2;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
if (values.size()==0) then (yes) 
:return TValue.fromString(new Date().toString());;
stop
endif 
if (values.size()==2) then (yes) 
:now=1000L*values.get(1).toInt();
else (no)
:now=System.currentTimeMillis();
endif 
:return TValue.fromString(new SimpleDateFormat(format)
.format(now));;
stop
:throw EaterException.unlocated("Bad date pattern");;
end
@enduml

