idth:1.0;" x1="244.25" x2="244.25" y1="804.0977" y2="824.0977"/><polygon fill="#181818" points="240.25,814.0977,244.25,824.0977,248.25,814.0977,244.25,818.0977" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[effb2a9b8426b51740de22d6f8cbe996]
@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%date",2);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==0||nbArg==1||nbArg==2;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,TMemorymemory,LineLocationlocation,List<TValue>values,Map<String,TValue>named)
end note
if (values.size()==0) then (yes) 
:return TValue.fromString(new Date().toString());;
stop
endif 
if (values.size()==2) then (yes) 
:now=1000L*values.get(1).toInt();
else (no)
:now=System.currentTimeMillis();
endif 
:return TValue.fromString(new SimpleDateFormat(format)
.format(now));;
stop
:throw EaterException.unlocated("Bad date pattern");;
end
@enduml

