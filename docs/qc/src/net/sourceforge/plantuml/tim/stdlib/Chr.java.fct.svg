="515.5391"/><polygon fill="#181818" points="151.5,505.5391,155.5,515.5391,159.5,505.5391,155.5,509.5391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="155.5" x2="155.5" y1="549.5078" y2="569.5078"/><polygon fill="#181818" points="151.5,559.5078,155.5,569.5078,159.5,559.5078,155.5,563.5078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="155.5" x2="155.5" y1="635.4766" y2="655.4766"/><polygon fill="#181818" points="151.5,645.4766,155.5,655.4766,159.5,645.4766,155.5,649.4766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="155.5" x2="155.5" y1="689.4453" y2="709.4453"/><polygon fill="#181818" points="151.5,699.4453,155.5,709.4453,159.5,699.4453,155.5,703.4453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e688bb936c72ce711ab978e15bba01f1]
@startuml
!pragma layout smetana
start
note right
TFunctionSignaturegetSignature()
end note
:return new TFunctionSignature("%chr",1);;
stop
end
start
note right
booleancanCover(intnbArg,Set<String>namedArgument)
end note
:return nbArg==1;;
stop
end
start
note right
TValueexecuteReturnFunction(TContextcontext,
TMemorymemory,LineLocationlocation,List<TValue>values,
Map<String,TValue>named)
end note
:try ;
:final charvalue=(char)values.get(0).toInt();;
:return TValue.fromString(""+value);;
stop
:catch (Throwablet);
:return TValue.fromString("\0");;
stop
end
@enduml

