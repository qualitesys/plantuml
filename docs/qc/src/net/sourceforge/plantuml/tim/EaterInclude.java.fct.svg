@startuml
!pragma layout smetana
start
note right
constructor EaterInclude(StringLocateds)
end note
:super (s);
end
start
note right
void analyze(TContextcontext,TMemorymemory)
end note
:skipSpaces();
:checkAndEatChar("!include");
if (peekChar=='u') then (yes) 
:checkAndEatChar("url");
endif 
:skipSpaces();
:this.location=context.applyFunctionsAndVariables(memory,
getLineLocation(),this.eatAllToEnd());
end
start
note right
StringgetLocation()
end note
:return location;;
stop
end
start
note right
PreprocessorIncludeStrategygetPreprocessorIncludeStrategy()
end note
:return strategy;;
stop
end
@enduml

