@startuml
!pragma layout smetana
start
note right
constructor EaterDeclareProcedure(StringLocateds)
end note
end
start
note right
void analyze(TContextcontext,TMemorymemory)
end note
while (peekUnquoted()||peekFinal())
if (peekUnquoted()) then (yes) 
endif 
endwhile
end
start
note right
booleanpeekUnquoted()
end note
:return peekChar()=='u';;
stop
end
start
note right
booleanpeekFinal()
end note
:return peekChar()=='f'&&peekCharN2()=='i';;
stop
end
start
note right
