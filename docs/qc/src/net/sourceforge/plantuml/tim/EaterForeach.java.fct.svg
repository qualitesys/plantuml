@startuml
!pragma layout smetana
start
note right
constructor EaterForeach(StringLocateds)
end note
:super (s);
end
start
note right
void analyze(TContextcontext,TMemorymemory)
end note
:skipSpaces();
:checkAndEatChar("!foreach");
:skipSpaces();
:this.varname=eatAndGetVarname();
:skipSpaces();
:checkAndEatChar("in");
:skipSpaces();
:this.jsonArray=(JsonArray)value.toJson();
end
start
note right
booleanisSkip()
end note
if (this.jsonArray==null ) then (yes) 
:return true;;
stop
endif 
:return this.jsonArray.size()==0;;
stop
end
start
note right
StringgetVarname()
end note
:return varname;;
stop
end
start
note right
JsonArraygetJsonArray()
end note
:return jsonArray;;
stop
end
@enduml

