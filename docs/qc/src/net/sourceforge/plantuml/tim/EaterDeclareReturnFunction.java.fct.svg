@startuml
!pragma layout smetana
start
note right
constructor EaterDeclareReturnFunction(StringLocateds)
end note
:super (s.getTrimmed());;
:this.location=s.getLocation();;
end
start
note right
void analyze(TContextcontext,TMemorymemory)
end note
:skipSpaces();;
:checkAndEatChar("!");;
:booleanunquoted=false;;
:while (peekUnquoted()||peekFinal()){if (peekUnquoted()){checkAndEatChar("unquoted");
:skipSpaces();unquoted=true;}else if (peekFinal()){checkAndEatChar("final");
:skipSpaces();finalFlag=true;}};
:checkAndEatChar("function");;
:skipSpaces();;
:function =eatDeclareReturnFunctionWithOptionalReturn(context,
memory,unquoted,location);;
end
start
note right
booleanpeekUnquoted()
end note
:return peekChar()=='u';;
stop
end
start
note right
booleanpeekFinal()
end note
:return peekChar()=='f'&&peekCharN2()=='i';;
stop
end
start
note right
TFunctionImplgetFunction()
end note
:return function ;;
stop
end
start
note right
booleangetFinalFlag()
end note
:return finalFlag;;
stop
end
