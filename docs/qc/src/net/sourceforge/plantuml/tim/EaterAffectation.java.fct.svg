@startuml
!pragma layout smetana
start
note right
constructor EaterAffectation(StringLocatedsl)
end note
:super (sl.getTrimmed());
end
start
note right
void analyze(TContextcontext,TMemorymemory)
end note
:skipSpaces();
:checkAndEatChar("!");
:skipSpaces();
:skipSpaces();
if (peekChar()=='?') then (yes) 
:checkAndEatChar('?');
:conditional=true;
endif 
if (peekChar()!='=') then (yes) 
:scope=TVariableScope.valueOf(varname.toUpperCase());
:varname=eatAndGetVarname();
:skipSpaces();
endif 
:checkAndEatChar('=');
if (conditional) then (yes) 
if (already!=null ) then (yes) 
:return ;;
stop
endif 
endif 
:skipSpaces();
:memory.putVariable(varname,value,scope);
end
@enduml

