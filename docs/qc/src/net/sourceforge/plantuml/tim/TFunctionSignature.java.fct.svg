@startuml
!pragma layout smetana
start
note right
constructor TFunctionSignature(StringfunctionName,
intnbArg)
end note
end
start
note right
constructor TFunctionSignature(StringfunctionName,
intnbArg,Set<String>namedArguments)
end note
end
start
note right
booleansameFunctionNameAs(TFunctionSignatureother)
end note
:return getFunctionName().equals(other.getFunctionName());;
stop
end
start
note right
StringtoString()
end note
:return functionName+"/"+nbArg+" "+namedArguments;;
stop
end
start
note right
inthashCode()
end note
:return result;;
stop
end
start
note right
booleanequals(Objectobj)
end note
:return functionName.equals(other.functionName)&&nbArg==other.nbArg;;
stop
end
start
note right
StringgetFunctionName()
end note
:return functionName;;
stop
end
start
note right
intgetNbArg()
end note
:return nbArg;;
stop
end
start
note right
Set<String>getNamedArguments()
end note
:return namedArguments;;
stop
end
@enduml

