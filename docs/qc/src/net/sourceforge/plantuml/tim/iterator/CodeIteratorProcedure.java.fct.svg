@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorProcedure(CodeIteratorsource,
TContextcontext,TMemorymemory,FunctionsSetfunctionsSet,
List<StringLocated>logs)
end note
:super (source);;
:this.context=context;;
:this.functionsSet=functionsSet;;
:this.logs=logs;;
:this.memory=memory;;
end
start
note right
StringLocatedpeek()
end note
:while (true){final StringLocatedresult=source.peek();
:if (result==null ){return null ;}if (functionsSet.pendingFunction()!=null &&(functionsSet.pendingFunction()
.getFunctionType()==TFunctionType.PROCEDURE||functionsSet.pendingFunction().getFunctionType()==TFunctionType.LEGACY_DEFINELONG)){logs.add(result);if (result.getType()==TLineType.END_FUNCTION){functionsSet.executeEndfunction();}else {functionsSet.pendingFunction().addBody(result);}next();continue ;}if (result.getType()==TLineType.DECLARE_PROCEDURE){logs.add(result);functionsSet.executeDeclareProcedure(context,memory,result);next();continue ;}return result;};
end
@enduml

