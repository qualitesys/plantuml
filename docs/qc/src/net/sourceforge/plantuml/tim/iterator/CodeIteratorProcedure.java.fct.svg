@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorProcedure(CodeIteratorsource,TContextcontext,TMemorymemory,FunctionsSetfunctionsSet,List<StringLocated>logs)
end note
:super (source);
:this.context=context;
:this.functionsSet=functionsSet;
:this.logs=logs;
:this.memory=memory;
end
start
note right
StringLocatedpeek()
end note
while (true)
if (result==null ) then (yes) 
:return null ;;
stop
endif 
if (functionsSet.pendingFunction()!=null &&(functionsSet.pendingFunction().getFunctionType()==TFunctionType.PROCEDURE||functionsSet.pendingFunction().getFunctionType()==TFunctionType.LEGACY_DEFINELONG)) then (yes) 
:logs.add(result);
if (result.getType()==TLineType.END_FUNCTION) then (yes) 
:functionsSet.executeEndfunction();
else (no)
:functionsSet.pendingFunction().addBody(result);
endif 
:next();
endif 
if (result.getType()==TLineType.DECLARE_PROCEDURE) then (yes) 
:logs.add(result);
:functionsSet.executeDeclareProcedure(context,
memory,result);
:next();
endif 
:return result;;
stop
endwhile
end
@enduml

