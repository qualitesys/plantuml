@startuml
!pragma layout smetana
start
note right
constructor Position(intpos)
end note
end
start
note right
constructor CodeIteratorImpl(List<StringLocated>list)
end note
end
start
note right
StringLocatedpeek()
end note
if (current==list.size()) then (yes) 
:return null ;;
stop
endif 
if (current>list.size()) then (yes) 
:throw new IllegalStateException();;
endif 
:return list.get(current);;
stop
end
start
note right
void next()
end note
if (current>=list.size()) then (yes) 
:throw new IllegalStateException();;
endif 
end
start
note right
CodePositiongetCodePosition()
end note
:return new Position(current);;
stop
end
start
note right
void jumpToCodePosition(CodePositionnewPosition)
end note
if (this.countJump>999) then (yes) 
:throw EaterException.unlocated("Infinite loop?");;
endif 
end
@enduml

