@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorLongComment(CodeIteratorsource,
List<StringLocated>logs)
end note
:super (source);;
:this.logs=logs;;
end
start
note right
StringLocatedpeek()
end note
:while (true){if (source.peek()==null ){return null ;
:}if (source.peek().getType()!=TLineType.COMMENT_LONG_START){return source.peek();
:}StringLocateds=null ;while ((s=source.peek())!=null &&s.getTrimmed().getString().endsWith("'/")==false){logs.add(s);
:source.next();}assert source.peek()==null ||s.getTrimmed().getString().endsWith("'/");
:if (source.peek()!=null ){assert s.getTrimmed().getString().endsWith("'/");
:logs.add(source.peek());source.next();}};
end
@enduml

