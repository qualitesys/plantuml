@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorLongComment(CodeIteratorsource,List<StringLocated>logs)
end note
:super (source);
:this.logs=logs;
end
start
note right
StringLocatedpeek()
end note
while (true)
if (source.peek()==null ) then (yes) 
:return null ;;
stop
endif 
if (source.peek().getType()!=TLineType.COMMENT_LONG_START) then (yes) 
:return source.peek();;
stop
endif 
while ((s=source.peek())!=null &&s.getTrimmed().getString().endsWith("'/")==false)
:logs.add(s);
:source.next();
endwhile
if (source.peek()!=null ) then (yes) 
:logs.add(source.peek());
:source.next();
endif 
endwhile
end
@enduml

