@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorShortComment(CodeIteratorsource,
List<StringLocated>logs)
end note
:super (source);
:this.logs=logs;
end
start
note right
StringLocatedpeek()
end note
while (true)
if (result==null ) then (yes) 
:return null ;;
stop
endif 
if (result.getType()==TLineType.COMMENT_SIMPLE) then (yes) 
:logs.add(result);
:next();
endif 
:return result;;
stop
endwhile
end
@enduml

