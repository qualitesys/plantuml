><!--MD5=[31c983d62126289dc27b154d0ee62033]
@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorShortComment(CodeIteratorsource,
List<StringLocated>logs)
end note
:super (source);;
:this.logs=logs;;
end
start
note right
StringLocatedpeek()
end note
:while (true){final StringLocatedresult=source.peek();
:if (result==null ){return null ;}if (result.getType()==TLineType.COMMENT_SIMPLE){logs.add(result);
:next();continue ;}assert result!=null &&result.getType()!=TLineType.COMMENT_SIMPLE;
:return result;};
end
@enduml

