@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorAffectation(CodeIteratorsource,
TContextcontext,TMemorymemory,List<StringLocated>log)
end note
:super (source);;
:this.context=context;;
:this.memory=memory;;
:this.logs=log;;
end
start
note right
StringLocatedpeek()
end note
:while (true){final StringLocatedresult=source.peek();
:if (result==null ){return null ;}if (result.getType()==TLineType.AFFECTATION){logs.add(result);
:doAffectation(result);next();continue ;}return result;};
end
start
note right
void doAffectation(StringLocatedresult)
end note
:intlastLocation=-1;;
:try ;
:this.executeAffectation(context,memory,result);;
:return ;;
stop
:catch (ParseExceptione);
if (e.getColumn()<=lastLocation) then (yes) 
:throw EaterException.located("Error in JSON format");;
stop
endif 
:lastLocation=e.getColumn();;
:next();;
:final StringLocatedforward=source.peek();;
:result=result.append(forward.getString());;
end
start
note right
void executeAffectation(TContextcontext,TMemorymemory,
StringLocateds)
end note
:new EaterAffectation(s).analyze(context,
memory);;
end
@enduml

