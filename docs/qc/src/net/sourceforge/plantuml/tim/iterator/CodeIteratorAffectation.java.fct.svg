@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorAffectation(CodeIteratorsource,
TContextcontext,TMemorymemory,List<StringLocated>log)
end note
end
start
note right
StringLocatedpeek()
end note
while (true)
if (result==null ) then (yes) 
:return null ;;
stop
endif 
if (result.getType()==TLineType.AFFECTATION) then (yes) 
endif 
:return result;;
stop
endwhile
end
start
note right
void doAffectation(StringLocatedresult)
end note
:return ;;
stop
if (e.getColumn()<=lastLocation) then (yes) 
:throw EaterException.located("Error in JSON format");;
endif 
end
start
note right
void executeAffectation(TContextcontext,TMemorymemory,
StringLocateds)
end note
end
