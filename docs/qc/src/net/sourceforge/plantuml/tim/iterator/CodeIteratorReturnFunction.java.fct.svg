<text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="92" x="5" y="371.9063">while (true)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="216" x="5" y="388.2031">if (result==null ) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="5" y="404.5">:return null ;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="420.7969">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="437.0938">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="596" x="5" y="453.3906">if (functionsSet.pendingFunction()!=null &amp;&amp;functionsSet.pendingFunction()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="535" x="5" y="469.6875">.getFunctionType()==TFunctionType.RETURN_FUNCTION) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="485.9844">Syntax Error?</text><!--MD5=[87da780f0d62e3de0a3a8e5de045b187]
@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorReturnFunction(CodeIteratorsource,
TContextcontext,TMemorymemory,FunctionsSetfunctionsSet,
List<StringLocated>logs)
end note
:super (source);
:this.context=context;
:this.functionsSet=functionsSet;
:this.logs=logs;
:this.memory=memory;
end
start
note right
StringLocatedpeek()
end note
while (true)
if (result==null ) then (yes) 
:return null ;;
stop
endif 
if (functionsSet.pendingFunction()!=null &&functionsSet.pendingFunction()
.getFunctionType()==TFunctionType.RETURN_FUNCTION) then (yes) 
:logs.add(result);
if (result.getType()==TLineType.END_FUNCTION) then (yes) 
if (functionsSet.pendingFunction().doesContainReturn()==false) then (yes) 
:throw EaterExceptionLocated.located("This function does not have any !return directive. Declare it as a procedure instead ?",result);;
endif 
:functionsSet.executeEndfunction();
else (no)
:functionsSet.pendingFunction().addBody(result);
endif 
:next();
endif 
if (result.getType()==TLineType.DECLARE_RETURN_FUNCTION) then (yes) 
:logs.add(result);
:functionsSet.executeDeclareReturnFunction(context,
memory,result);
:next();
endif 
:return result;;
stop
endwhile
end
@enduml

