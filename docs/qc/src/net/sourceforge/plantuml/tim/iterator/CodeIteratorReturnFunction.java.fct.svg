/><!--MD5=[c6c6910739d92ed952005918dea6056d]
@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorReturnFunction(CodeIteratorsource,
TContextcontext,TMemorymemory,FunctionsSetfunctionsSet,
List<StringLocated>logs)
end note
:super (source);;
:this.context=context;;
:this.functionsSet=functionsSet;;
:this.logs=logs;;
:this.memory=memory;;
end
start
note right
StringLocatedpeek()
end note
:while (true){final StringLocatedresult=source.peek();
:if (result==null ){return null ;}if (functionsSet.pendingFunction()!=null &&functionsSet.pendingFunction().getFunctionType()==TFunctionType.RETURN_FUNCTION){logs.add(result);
:if (result.getType()==TLineType.END_FUNCTION){if (functionsSet.pendingFunction()
.doesContainReturn()==false){throw EaterExceptionLocated.located("This function does not have any !return directive. Declare it as a procedure instead ?",
result);}functionsSet.executeEndfunction();}else {functionsSet.pendingFunction().addBody(result);}next();continue ;}if (result.getType()==TLineType.DECLARE_RETURN_FUNCTION){logs.add(result);functionsSet.executeDeclareReturnFunction(context,memory,result);next();continue ;}return result;};
end
@enduml

