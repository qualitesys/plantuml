@startuml
!pragma layout smetana
start
note right
constructor CodeIteratorLegacyDefine(CodeIteratorsource,
TContextcontext,TMemorymemory,FunctionsSetfunctionsSet,
List<StringLocated>logs)
end note
:super (source);;
:this.context=context;;
:this.functionsSet=functionsSet;;
:this.logs=logs;;
:this.memory=memory;;
end
start
note right
StringLocatedpeek()
end note
:while (true){final StringLocatedresult=source.peek();if (result==null ){return null ;}if (result.getType()==TLineType.LEGACY_DEFINE){logs.add(result);functionsSet.executeLegacyDefine(context,
memory,result);next();continue ;}else if (result.getType()==TLineType.LEGACY_DEFINELONG){logs.add(result);functionsSet.executeLegacyDefineLong(context,
memory,result);next();continue ;}return result;};
end
@enduml

