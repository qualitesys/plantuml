start
note right
constructor CodeIteratorLegacyDefine(CodeIteratorsource,TContextcontext,TMemorymemory,FunctionsSetfunctionsSet,List<StringLocated>logs)
end note
:super (source);
:this.context=context;
:this.functionsSet=functionsSet;
:this.logs=logs;
:this.memory=memory;
end
start
note right
StringLocatedpeek()
end note
while (true)
if (result==null ) then (yes) 
:return null ;;
stop
endif 
if (result.getType()==TLineType.LEGACY_DEFINE) then (yes) 
