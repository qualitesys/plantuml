!pragma layout smetana
start
note right
constructor CodeIteratorForeach(CodeIteratorsource,
TContextcontext,TMemorymemory,List<StringLocated>logs)
end note
:super (source);;
:this.context=context;;
:this.memory=memory;;
:this.logs=logs;;
end
start
note right
StringLocatedpeek()
end note
:while (true){final StringLocatedresult=source.peek();
:if (result==null ){return null ;}final ExecutionContextForeachforeach=memory.peekForeach();if (foreach!=null &&foreach.isSkipMe()){if (result.getType()==TLineType.FOREACH){level+
+;}else if (result.getType()==TLineType.ENDFOREACH){level- -;if (level==-1){memory.pollForeach();level=0;}}next();continue ;}if (result.getType()==TLineType.FOREACH){logs.add(result);executeForeach(memory,result.getTrimmed());next();continue ;}else if (result.getType()==TLineType.ENDFOREACH){logs.add(result);if (foreach==null ){throw EaterException.located("No foreach related to this endforeach");}foreach.inc();if (foreach.isSkipMe()){memory.pollForeach();}else {setLoopVariable(memory,foreach,result);source.jumpToCodePosition(foreach.getStartForeach());}next();continue ;}return result;};
end
start
note right
void executeForeach(TMemorymemory,StringLocateds)
end note
:condition.analyze(context,memory);;
if (condition.isSkip()) then (yes) 
:foreach.skipMeNow();;
else (no)
:setLoopVariable(memory,foreach,s);;
endif 
:memory.addForeach(foreach);;
end
start
note right
void setLoopVariable(TMemorymemory,ExecutionContextForeachforeach,
StringLocatedposition)
end note
:memory.putVariable(foreach.getVarname(),
TValue.fromJson(first),TVariableScope.GLOBAL);;
end
