@startuml
!pragma layout smetana
start
note right
constructor TimLoader(ImportedFilesimportedFiles,Definesdefines,Charsetcharset,DefinitionsContainerdefinitionsContainer)
end note
:this.context=new TContext(importedFiles,
defines,charset,definitionsContainer);
:defines.copyTo(global);
:Logme.error(e);
end
start
note right
Set<FileWithSuffix>load(List<StringLocated>list)
end note
:context.executeLines(global,list,null ,false);
:context.getResultList().add(e.getLocation()
.withErrorPreprocessor(e.getMessage()));
:changeLastLine(context.getDebug(),e.getMessage());
:this.preprocessorError=true;
:this.resultList=context.getResultList();
:return context.getFilesUsedCurrent();;
stop
end
start
note right
void changeLastLine(List<StringLocated>list,Stringmessage)
end note
:list.set(num,last.withErrorPreprocessor(message));
end
start
note right
List<StringLocated>getResultList()
end note
:return resultList;;
stop
end
start
note right
List<StringLocated>getDebug()
end note
:return context.getDebug();;
stop
end
start
note right
booleanisPreprocessorError()
end note
:return preprocessorError;;
stop
end
@enduml

