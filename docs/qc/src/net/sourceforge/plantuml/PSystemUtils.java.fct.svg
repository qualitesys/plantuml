stop
end
start
note right
booleancanFileBeWritten(final SFilef)
end note
:Log.info("Creating file: "+f.getAbsolutePath());
if (f.exists()&&f.canWrite()==false) then (yes) 
if (OptionFlags.getInstance().isOverwrite()) then (yes) 
:Log.info("Overwrite "+f);
:f.setWritable(true);
:f.delete();
:return true;;
stop
endif 
:Log.error("Cannot write to file "+f.getAbsolutePath());
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
List<FileImageData>exportDiagramsSequence(SequenceDiagramsystem,
SuggestedFilesuggestedFile,FileFormatOptionfileFormat)
end note
:i++;
if (PSystemUtils.canFileBeWritten(suggestedFile.getFile(i))==false) then (yes) 
:return result;;
stop
endif 
:cmap=system.exportDiagram(fos,i,fileFormat);
:fos.close();
if (cmap!=null &&cmap.containsCMapData()) then (yes) 
