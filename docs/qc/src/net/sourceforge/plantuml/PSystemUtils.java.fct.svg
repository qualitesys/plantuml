end
start
note right
List<FileImageData>exportDiagramsDefault(Diagramsystem,
SuggestedFilesuggestedFile,FileFormatOptionfileFormatOption)
end note
if (outputFile.isDirectory()) then (yes) 
:throw new IllegalArgumentException("File is a directory "+
suggestedFile);;
endif 
if (!canFileBeWritten(outputFile)) then (yes) 
:return emptyList();;
stop
endif 
:imageData=system.exportDiagram(os,0,fileFormatOption);
if (imageData==null ) then (yes) 
:return emptyList();;
stop
endif 
if (imageData.containsCMapData()&&system instanceof UmlDiagram) then (yes) 
:((UmlDiagram)system).exportCmap(suggestedFile,
0,imageData);
endif 
if (system instanceof TitledDiagram&&fileFormatOption.getFileFormat()==FileFormat.PNG) then (yes) 
:return splitPng((TitledDiagram)system,suggestedFile,
imageData,fileFormatOption);;
stop
endif 
:return singletonList(new FileImageData(outputFile,
imageData));;
stop
