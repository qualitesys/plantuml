booleancheckMetadata)
end note
if (checkMetadata&&fileFormatOption.getFileFormat()
.doesSupportMetadata()&&existingFile.exists()&&system.getNbImages()==1) then (yes) 
if (sameMetadata) then (yes) 
:Log.info("Skipping "+existingFile.getPrintablePath()+
" because metadata has not changed.");
:return Arrays.asList(new FileImageData(existingFile,
null ));;
stop
endif 
endif 
if (system instanceof NewpagedDiagram) then (yes) 
:return exportDiagramsNewpaged((NewpagedDiagram)system,
suggestedFile,fileFormatOption);;
stop
endif 
if (system instanceof SequenceDiagram) then (yes) 
:return exportDiagramsSequence((SequenceDiagram)system,
suggestedFile,fileFormatOption);;
stop
endif 
if (system instanceof CucaDiagram&&fileFormatOption.getFileFormat()==FileFormat.HTML) then (yes) 
:return createFilesHtml((CucaDiagram)system,
suggestedFile);;
stop
endif 
:return exportDiagramsDefault(system,suggestedFile,
fileFormatOption);;
stop
end
start
note right
List<FileImageData>exportDiagramsNewpaged(NewpagedDiagramsystem,
SuggestedFilesuggestedFile,FileFormatOptionfileFormat)
end note
:i++;
if (canFileBeWritten(f)==false) then (yes) 
:return result;;
stop
endif 
