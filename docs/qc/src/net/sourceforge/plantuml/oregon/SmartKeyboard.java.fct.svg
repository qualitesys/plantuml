@startuml
!pragma layout smetana
start
note right
constructor SmartKeyboard(Keyboardkeyboard)
end note
:this.keyboard=keyboard;
end
start
note right
Stringinput(Screenscreen)
end note
:history.add(s);
:screen.print("<i>? "+s);
:return s;;
stop
end
start
note right
intinputInt(Screenscreen)
end note
if (s.matches("\\d+")==false) then (yes) 
:screen.print("Please enter a valid number instead of "+s);
:throw new NoInputException();;
endif 
:return Integer.parseInt(s);;
stop
end
start
note right
booleanhasMore()
end note
:return keyboard.hasMore();;
stop
end
start
note right
List<String>getHistory()
end note
:return Collections.unmodifiableList(history);;
stop
end
@enduml

