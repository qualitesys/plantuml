@startuml
!pragma layout smetana
start
note right
constructor SmartKeyboard(Keyboardkeyboard)
end note
end
start
note right
Stringinput(Screenscreen)
end note
:return s;;
stop
end
start
note right
intinputInt(Screenscreen)
end note
if (s.matches("\\d+")==false) then (yes) 
:throw new NoInputException();;
endif 
:return Integer.parseInt(s);;
stop
end
start
note right
booleanhasMore()
end note
:return keyboard.hasMore();;
stop
end
start
note right
List<String>getHistory()
end note
:return Collections.unmodifiableList(history);;
stop
end
@enduml

