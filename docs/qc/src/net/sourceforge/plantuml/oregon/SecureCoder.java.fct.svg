@startuml
!pragma layout smetana
if (dec[n]!=-1) then (yes) 
:throw new IllegalStateException();;
endif 
start
note right
intencode(inti)
end note
:return m[i];;
stop
end
start
note right
intdecode(intv)
end note
:return dec[v];;
stop
end
@enduml

