@startuml
!pragma layout smetana
:i++;
:dec[i]=-1;
:i++;
:dec[enc]=i;
if (dec[n]!=-1) then (yes) 
:throw new IllegalStateException();;
endif 
:dec[n]=i+1000;
start
note right
intencode(inti)
end note
:return m[i];;
stop
end
start
note right
intdecode(intv)
end note
:return dec[v];;
stop
end
@enduml

