@startuml
!pragma layout smetana
start
note right
constructor KeyboardList(String... inputs)
end note
end
start
note right
constructor KeyboardList(Collection<String>inputs)
end note
end
start
note right
Stringinput()
end note
if (data.hasNext()) then (yes) 
:return data.next();;
stop
endif 
:throw new NoInputException();;
end
