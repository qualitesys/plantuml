@startuml
!pragma layout smetana
start
note right
constructor CommandCreatePackageBlock()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandCreatePackageBlock.class .getName(),
RegexLeaf.start(),new RegexLeaf("block"),
RegexLeaf.spaceOneOrMore(),new RegexOptional(new RegexConcat(new RegexLeaf("DISPLAY","[%g]([^%g]+)[%g]"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("as"),RegexLeaf.spaceOneOrMore())),new RegexLeaf("CODE","([%pLN_.]+)"),new RegexLeaf("(?:[%s]*\\{|[%s]+begin)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(CompositeDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
if (display==null ) then (yes) 
:display=code.getName();
endif 
:diagram.gotoGroup(idNewLong,code,Display.getWithNewlines(display),
GroupType.PACKAGE,currentPackage,NamespaceStrategy.SINGLE);
:return CommandExecutionResult.ok();;
stop
end
@enduml

