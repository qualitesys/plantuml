@startuml
!pragma layout smetana
start
note right
constructor CommandCreateBlock()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandCreateBlock.class .getName(),
RegexLeaf.start(),new RegexLeaf("block"),
RegexLeaf.spaceOneOrMore(),new RegexOptional(new RegexConcat(new RegexLeaf("DISPLAY","[%g]([^%g]+
)[%g]"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("as"),RegexLeaf.spaceOneOrMore())),new RegexLeaf("CODE","([%pLN_.]+
)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(CompositeDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (display==null ) then (yes) 
:display=code.getName();
endif 
:ent.setDisplay(Display.getWithNewlines(display));
:return CommandExecutionResult.ok();;
stop
end
@enduml

