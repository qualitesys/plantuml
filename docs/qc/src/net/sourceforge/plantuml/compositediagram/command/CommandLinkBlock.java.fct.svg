@startuml
!pragma layout smetana
start
note right
constructor CommandLinkBlock()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandLinkBlock.class .getName(),
RegexLeaf.start(),new RegexLeaf("ENT1","([%pLN_.]+)"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("DECO1",
"(\\[\\]|\\*\\))?"),new RegexLeaf("QUEUE",
"([=-]+|\\.+)"),new RegexLeaf("DECO2","(\\[\\]|\\(\\*)?"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("ENT2",
"([%pLN_.]+)"),RegexLeaf.spaceZeroOrMore(),
new RegexOptional(new RegexConcat(new RegexLeaf(":"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("DISPLAY",
"(\\S*+)"))),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(CompositeDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:diagram.addLink(link);
:return CommandExecutionResult.ok();;
stop
end
start
note right
LinkDecorgetLinkDecor(Strings)
end note
if (String.valueOf("[]").equals(s)) then (yes) 
:return LinkDecor.SQUARE_toberemoved;;
stop
endif 
:return LinkDecor.NONE;;
stop
end
@enduml

