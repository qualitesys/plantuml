@startuml
!pragma layout smetana
start
note right
constructor SudokuDLX(Longseed)
end note
if (seed==null ) then (yes) 
:this.seed=Math.abs(new Random().nextLong());;
else (no)
:this.seed=Math.abs(seed.longValue());;
endif 
:rate=engine.rate(s.replace("\n","").trim());;
:tab=s.split("\\s");;
end
start
note right
longgetRatting()
end note
:return rate;;
stop
end
start
note right
longgetSeed()
end note
:return seed;;
stop
end
start
note right
intgetGiven(intx,inty)
end note
if (c=='.') then (yes) 
:return 0;;
stop
endif 
:return c-'0';;
stop
end
start
note right
void print()
end note
:Log.println(s);;
:Log.println("Rate="+rate);;
:Log.println("Seed="+StringUtils.goUpperCase(Long.toString(seed,
36)));;
end
start
note right
void main(String[]args)
end note
:sudoku.print();;
end
