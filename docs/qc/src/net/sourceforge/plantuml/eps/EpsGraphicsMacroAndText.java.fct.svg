@startuml
!pragma layout smetana
start
note right
void drawText(Stringtext,FontConfigurationfontConfiguration,
doublex,doubley)
end note
:append(format(x)+" "+format(y)+" moveto",
true);;
:appendColor(getColor());;
:append("/"+getPSName(fontConfiguration)+
" findfont "+size+" scalefont setfont",true);;
:append("100 -100 scale",true);;
:append("("+getTextAsEps(text)+") show",false);;
:append(".01 -.01 scale",true);;
end
start
note right
StringgetPSName(FontConfigurationfontConfiguration)
end note
:return sb.toString();;
stop
end
start
note right
StringgetTextAsEps(Stringtext)
end note
if (c=='\\') then (yes) 
:sb.append("\\\\");;
else (no)
:try {final byteb[]=s.getBytes("ISO-8859-1");if (b.length==1){final intcode=b[0]&0xFF;sb.append("\\"+
Integer.toOctalString(code));}else {sb.append('?');}}catch (UnsupportedEncodingExceptione){sb.append('?');};
endif 
:return sb.toString();;
stop
end
