@startuml
!pragma layout smetana
start
note right
constructor PostScriptCommandLineTo(doublex,doubley)
end note
:this.x=x;
:this.y=y;
end
start
note right
StringtoPostString()
end note
:return EpsGraphics.format(x)+" "+EpsGraphics.format(y)+
