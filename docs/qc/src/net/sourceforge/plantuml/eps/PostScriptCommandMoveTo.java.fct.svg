@startuml
!pragma layout smetana
start
note right
constructor PostScriptCommandMoveTo(doublex,
doubley)
end note
:this.x=x;
:this.y=y;
end
start
note right
StringtoPostString()
end note
:return EpsGraphics.format(x)+" "+EpsGraphics.format(y)+" moveto";;
stop
end
@enduml

