@startuml
!pragma layout smetana
start
note right
constructor PostScriptCommandRaw(Stringcmd,booleancheckConsistence)
end note
if (checkConsistence&&cmd.indexOf('\n')!=-1) then (yes) 
:throw new IllegalArgumentException(cmd);;
endif 
:this.cmd=cmd;
end
start
note right
StringtoPostString()
end note
:return cmd;;
stop
end
@enduml

