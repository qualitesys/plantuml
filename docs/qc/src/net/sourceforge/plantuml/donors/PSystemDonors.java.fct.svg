end note
:super (source);
end
start
note right
UDrawablegetRootDrawable(FileFormatOptionfileFormatOption)
end note
:return new UDrawable(){public void drawU(UGraphicug){final TextBlockBackcoloredheader=GraphicStrings.createBlackOnWhite(Arrays.asList("<b>Special thanks to our sponsors and donors !"));header.drawU(ug);final StringBounderstringBounder=ug.getStringBounder();ug=ug.apply(UTranslate.dy(header.calculateDimension(stringBounder).getHeight()));doublex=0;doublelastX=0;doubley=0;for (TextBlocktb:cols){final XDimension2Ddim=tb.calculateDimension(stringBounder);tb.drawU(ug.apply(UTranslate.dx(x)));lastX=x;x+=dim.getWidth()+10;y=Math.max(y,dim.getHeight());}final UImagelogo=new UImage(new PixelImage(PSystemVersion.getPlantumlImage(),AffineTransformType.TYPE_BILINEAR));ug.apply(new UTranslate(lastX,y-logo.getHeight())).draw(logo);}};;
stop
end
start
note right
