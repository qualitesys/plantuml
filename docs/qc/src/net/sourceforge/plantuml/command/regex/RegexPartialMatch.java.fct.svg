@startuml
!pragma layout smetana
start
note right
constructor RegexPartialMatch(Stringname)
end note
end
start
note right
void add(Stringgroup)
end note
:data.add(group);
end
start
note right
intsize()
end note
:return data.size();;
stop
end
start
note right
Stringget(inti)
end note
:return data.get(i);;
stop
end
start
note right
Iterator<String>iterator()
end note
:return Collections.unmodifiableCollection(data).iterator();;
stop
end
start
note right
StringtoString()
end note
:return "{"+data+"}";;
stop
end
@enduml

