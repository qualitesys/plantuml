@startuml
!pragma layout smetana
start
note right
constructor MaxSizeHashMap(intmaxSize)
end note
end
start
note right
booleanremoveEldestEntry(Map.Entry<K,V>eldest)
end note
:return size()>maxSize;;
stop
end
start
note right
Pattern2cmpile(final Stringp)
end note
if (p==null ||p.length()==0) then (yes) 
:return EMPTY;;
stop
endif 
if (result!=null ) then (yes) 
:return result;;
stop
endif 
:return result;;
stop
end
start
note right
Stringtransform(Stringp)
end note
:return p;;
stop
end
start
note right
booleanmtches(CharSequenceinput,Stringregex)
end note
:return cmpile(regex).matcher(input).matches();;
stop
end
start
note right
CharSequenceremoveAll(CharSequencesrc,Stringregex)
end note
:return src.toString().replaceAll(transform(regex),
"");;
stop
end
@enduml

