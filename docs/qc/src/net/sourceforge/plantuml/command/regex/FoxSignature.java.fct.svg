@startuml
!pragma layout smetana
if (ch>='A'&&ch<='Z') then (yes) 
endif 
start
note right
void printMe()
end note
if (masks[i]>0) then (yes) 
endif 
end
start
note right
longgetMask(charch)
end note
if (ch<masks.length) then (yes) 
:return masks[ch];;
stop
endif 
:return 0L;;
stop
end
start
note right
longgetFoxSignature(Strings)
end note
:return result;;
stop
end
start
note right
StringbackToString(longcheck)
end note
if (masks[i]!=0L&&(check&masks[i])!=0L) then (yes) 
endif 
:return sb.toString();;
stop
end
@enduml

