@startuml
!pragma layout smetana
:masks[ch]=m;;
if (ch>='A'&&ch<='Z') then (yes) 
:ch=(char)(ch+('a'-'A'));;
:masks[ch]=m;;
endif 
:m=m<<1;;
start
note right
void printMe()
end note
if (masks[i]>0) then (yes) 
:System.err.println("ch="+ch+" "+masks[i]);;
endif 
end
start
note right
longgetMask(charch)
end note
if (ch<masks.length) then (yes) 
:return masks[ch];;
stop
endif 
:return 0L;;
stop
end
start
note right
longgetFoxSignature(Strings)
end note
:result=result|getMask(s.charAt(i));;
:return result;;
stop
end
start
note right
StringbackToString(longcheck)
end note
if (masks[i]!=0L&&(check&masks[i])!=0L) then (yes) 
:sb.append(ch);;
endif 
:return sb.toString();;
stop
end
@enduml

