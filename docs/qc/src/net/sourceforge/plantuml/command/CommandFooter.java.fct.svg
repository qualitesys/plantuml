@startuml
!pragma layout smetana
start
note right
constructor CommandFooter()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandFooter.class .getName(),
RegexLeaf.start(),new RegexOptional(new RegexLeaf("POSITION",
"(left|right|center)")),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("footer"),new RegexOr(new RegexConcat(RegexLeaf.spaceZeroOrMore(),
new RegexLeaf(":"),RegexLeaf.spaceZeroOrMore()),
RegexLeaf.spaceOneOrMore()),new RegexOr(new RegexLeaf("LABEL1",
"[%g](.*)[%g]"),new RegexLeaf("LABEL2","(.*[%pLN_.].*)")),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TitledDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (align==null ) then (yes) 
:ha=FontParam.FOOTER.getStyleDefinition(null ).getMergedStyle(diagram.getCurrentStyleBuilder()).getHorizontalAlignment();
endif 
:diagram.getFooter().putDisplay(s,ha);
:return CommandExecutionResult.ok();;
stop
end
@enduml

