@startuml
!pragma layout smetana
start
note right
constructor CommandSpriteSvgMultiline()
end note
:super (getRegexConcat(),MultilinesStrategy.KEEP_STARTING_QUOTE,
Trim.BOTH);
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandSpriteSvgMultiline.class .getName(),
RegexLeaf.start(),new RegexLeaf("sprite"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("\\$?"),new RegexLeaf("NAME","([-%pLN_]+
)"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("SVGSTART",
"(\\<svg\\b.*)"),RegexLeaf.end());;
stop
end
start
note right
StringgetPatternEnd()
end note
:return "(.*\\</svg\\>)$";;
stop
end
start
note right
CommandExecutionResultexecuteNow(TitledDiagramsystem,
BlocLineslines)
end note
:lines=lines.subExtract(1,0);
:svg.append(sl.getString());
:system.addSprite(line0.get("NAME",0),nanoParser);
:return CommandExecutionResult.ok();;
stop
end
