@startuml
!pragma layout smetana
start
note right
constructor CommandScaleMaxWidthAndHeight()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandScaleMaxWidthAndHeight.class .getName(),
RegexLeaf.start(),new RegexLeaf("scale"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("max"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("WIDTH","([0-9.]+
)"),RegexLeaf.spaceZeroOrMore(),new RegexLeaf("[*x]"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("HEIGHT","([0-9.]+
)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(AbstractPSystemdiagram,
LineLocationlocation,RegexResultarg)
end note
:diagram.setScale(new ScaleMaxWidthAndHeight(width,
height));
:return CommandExecutionResult.ok();;
stop
end
@enduml

