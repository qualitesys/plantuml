@startuml
!pragma layout smetana
start
note right
constructor PSystemSingleLineFactory()
end note
:super (DiagramType.UML);
end
start
note right
DiagramcreateSystem(UmlSourcesource,Map<String,
String>skinParam)
end note
if (source.getTotalLineCount()!=3) then (yes) 
:return null ;;
stop
endif 
if (source.isEmpty()) then (yes) 
:return buildEmptyError(source,location,it.getTrace());;
stop
endif 
if (StartUtils.isArobaseStartDiagram(startLine.getString())==false) then (yes) 
:throw new UnsupportedOperationException();;
endif 
if (it.hasNext()==false) then (yes) 
:return buildEmptyError(source,startLine.getLocation(),
it.getTrace());;
stop
endif 
if (StartUtils.isArobaseEndDiagram(s.getString())) then (yes) 
:return buildEmptyError(source,s.getLocation(),
it.getTrace());;
stop
endif 
if (sys==null ) then (yes) 
:return PSystemErrorUtils.buildV2(source,
err,null ,it.getTrace());;
stop
endif 
:return sys;;
stop
end
@enduml

