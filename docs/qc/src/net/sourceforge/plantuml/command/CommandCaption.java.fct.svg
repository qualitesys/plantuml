@startuml
!pragma layout smetana
start
note right
constructor CommandCaption()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandCaption.class .getName(),
RegexLeaf.start(),new RegexLeaf("caption"),
new RegexLeaf("(?:[%s]*:[%s]*|[%s]+)"),new RegexOr(new RegexLeaf("DISPLAY1",
"[%g](.*)[%g]"),new RegexLeaf("DISPLAY2",
"(.*[%pLN_.].*)")),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TitledDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:diagram.setCaption(DisplayPositioned.single(s,
HorizontalAlignment.CENTER,VerticalAlignment.BOTTOM));
:return CommandExecutionResult.ok();;
stop
end
@enduml

