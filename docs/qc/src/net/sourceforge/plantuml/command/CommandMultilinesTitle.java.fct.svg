@startuml
!pragma layout smetana
start
note right
constructor CommandMultilinesTitle()
end note
end
start
note right
StringgetPatternEnd()
end note
:return "^end[%s]?title$";;
stop
end
start
note right
CommandExecutionResultexecute(final TitledDiagramdiagram,
BlocLineslines)
end note
if (strings.size()>0) then (yes) 
:return CommandExecutionResult.ok();;
stop
endif 
:return CommandExecutionResult.error("No title defined");;
stop
end
@enduml

