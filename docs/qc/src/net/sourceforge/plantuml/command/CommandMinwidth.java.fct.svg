@startuml
!pragma layout smetana
start
note right
constructor CommandMinwidth()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandMinwidth.class .getName(),
RegexLeaf.start(),new RegexLeaf("minwidth"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("VALUE","(\\d+
)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(UmlDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:diagram.setMinwidth(minwidth);
:return CommandExecutionResult.ok();;
stop
end
@enduml

