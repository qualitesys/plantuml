@startuml
!pragma layout smetana
start
note right
constructor CommandNamespace2()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandNamespace2.class .getName(),
RegexLeaf.start(),new RegexLeaf("namespace"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("[%g]"),
new RegexLeaf("DISPLAY","([^%g]+)"),new RegexLeaf("[%g]"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("as"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("NAME",
"([%pLN_][-%pLN_.:\\\\]*)"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("STEREOTYPE","(\\<\\<.*\\>\\>)?"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("URL","("+
UrlBuilder.getRegexp()+")?"),RegexLeaf.spaceZeroOrMore(),
ColorParser.exp1(),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("\\{"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(ClassDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:diagram.gotoGroup(ident,code,display,GroupType.PACKAGE,
currentPackage,NamespaceStrategy.MULTIPLE);
if (stereotype!=null ) then (yes) 
:p.setStereotype(Stereotype.build(stereotype));
endif 
if (urlString!=null ) then (yes) 
:p.addUrl(url);
endif 
if (color!=null ) then (yes) 
:p.setSpecificColorTOBEREMOVED(ColorType.BACK,
diagram.getSkinParam().getIHtmlColorSet().getColor(color));
endif 
:return CommandExecutionResult.ok();;
stop
end
@enduml

