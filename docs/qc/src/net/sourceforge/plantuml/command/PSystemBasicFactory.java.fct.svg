end note
end
start
note right
booleanisEmptyLine(StringLocatedresult)
end note
:return result.getTrimmed().getString().length()==0;;
stop
end
start
note right
DiagramcreateSystem(UmlSourcesource,Map<String,
String>skinParam)
end note
while (it.hasNext())
if (first&&s!=null &&isEmptyLine(s)) then (yes) 
endif 
if (StartUtils.isArobaseEndDiagram(s.getString())) then (yes) 
if (source.getTotalLineCount()==2&&source.isStartDef()==false) then (yes) 
:return buildEmptyError(source,s.getLocation(),
it.getTrace());;
stop
endif 
:return system;;
stop
endif 
if (system==null ) then (yes) 
:return PSystemErrorUtils.buildV2(source,
err,null ,it.getTrace());;
stop
endif 
endwhile
:return system;;
stop
end
