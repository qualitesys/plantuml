@startuml
!pragma layout smetana
start
note right
constructor CommandScale()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandScale.class .getName(),
RegexLeaf.start(),new RegexLeaf("scale"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("SCALE",
"([0-9.]+)"),new RegexOptional(new RegexConcat(RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("/"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("DIV","([0-9.]+)"))),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(AbstractPSystemdiagram,
LineLocationlocation,RegexResultarg)
end note
if (scale==0) then (yes) 
:return CommandExecutionResult.error("Scale cannot be zero");;
stop
endif 
if (arg.get("DIV",0)!=null ) then (yes) 
if (div==0) then (yes) 
:return CommandExecutionResult.error("Scale cannot be zero");;
stop
endif 
:scale/=div;
endif 
:diagram.setScale(new ScaleSimple(scale));
:return CommandExecutionResult.ok();;
stop
end
