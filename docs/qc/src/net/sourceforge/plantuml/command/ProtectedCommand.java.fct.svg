@startuml
!pragma layout smetana
start
note right
constructor ProtectedCommand(Command<S>cmd)
end note
:this.cmd=Objects.requireNonNull(cmd);
end
start
note right
CommandExecutionResultexecute(Ssystem,BlocLineslines)
end note
:return result;;
stop
:Log.error("Error "+t);
:Logme.error(t);
:Log.error(msg);
:msg+=" "+t.toString();
:return CommandExecutionResult.error(msg,
t);;
stop
end
start
note right
CommandControlisValid(BlocLineslines)
end note
:return cmd.isValid(lines);;
stop
end
start
note right
String[]getDescription()
end note
:return cmd.getDescription();;
stop
end
@enduml

