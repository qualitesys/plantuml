!pragma layout smetana
start
note right
constructor CommandMultilinesHeader()
end note
:super ("^(?:(left|right|center)?[%s]*)header$");
end
start
note right
StringgetPatternEnd()
end note
:return "^end[%s]?header$";;
stop
end
start
note right
CommandExecutionResultexecute(final TitledDiagramdiagram,
BlocLineslines)
end note
:lines=lines.trim();
if (m.find()==false) then (yes) 
:throw new IllegalStateException();;
endif 
:lines=lines.subExtract(1,1);
if (strings.size()>0) then (yes) 
if (align==null ) then (yes) 
:ha=FontParam.HEADER.getStyleDefinition(null ).getMergedStyle(((UmlDiagram)diagram).getSkinParam().getCurrentStyleBuilder()).getHorizontalAlignment();
endif 
:diagram.getHeader().putDisplay(strings,ha);
:return CommandExecutionResult.ok();;
stop
endif 
:return CommandExecutionResult.error("Empty header");;
