ke-width:1.0;"/><!--MD5=[72ef634a35a5b51d503df8cc6014e659]
@startuml
!pragma layout smetana
start
note right
constructor CommandSkinParam()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandSkinParam.class .getName(),
RegexLeaf.start(),new RegexLeaf("TYPE","(skinparam|skinparamlocked)"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("NAME",
"([\\w.]*(?:\\<\\<.*\\>\\>)?[\\w.]*)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("VALUE","([^{}]*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TitledDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:diagram.setParam(arg.get("NAME",0),arg.get("VALUE",0));
:return CommandExecutionResult.ok();;
stop
:return CommandExecutionResult.error("General failure: no style available.");;
stop
end
@enduml

