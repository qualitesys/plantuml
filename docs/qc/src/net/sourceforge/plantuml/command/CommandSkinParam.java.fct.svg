:1.0;" x1="563" x2="563" y1="161.668" y2="184.2344"/><polygon fill="#181818" points="559,174.2344,563,184.2344,567,174.2344,563,178.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="563" x2="563" y1="274.0781" y2="294.0781"/><polygon fill="#181818" points="559,284.0781,563,294.0781,567,284.0781,563,288.0781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="563" x2="563" y1="386.2109" y2="416.3438"/><polygon fill="#181818" points="559,406.3438,563,416.3438,567,406.3438,563,410.3438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="563" x2="563" y1="464.2813" y2="484.2813"/><polygon fill="#181818" points="559,474.2813,563,484.2813,567,474.2813,563,478.2813" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5298a0977c65e28bf1054ca3ccedcb33]
@startuml
!pragma layout smetana
start
note right
constructor CommandSkinParam()
end note
:super (getRegexConcat());;
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandSkinParam.class .getName(),
RegexLeaf.start(),new RegexLeaf("TYPE","(skinparam|skinparamlocked)"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("NAME",
"([\\w.]*(?:\\<\\<.*\\>\\>)?[\\w.]*)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("VALUE","([^{}]*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TitledDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:try {diagram.setParam(arg.get("NAME",0),
arg.get("VALUE",0));return CommandExecutionResult.ok();}catch (NoStyleAvailableExceptione){return CommandExecutionResult.error("General failure: no style available.");};
end
@enduml

