@startuml
!pragma layout smetana
start
note right
constructor CommandAffineTransform()
end note
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandAffineTransform.class .getName(),
RegexLeaf.start(),new RegexLeaf("!transformation"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("ANIMATION",
"([^{}]*)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(UmlDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return CommandExecutionResult.ok();;
stop
end
@enduml

