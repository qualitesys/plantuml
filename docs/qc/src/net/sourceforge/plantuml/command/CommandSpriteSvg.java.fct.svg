@startuml
!pragma layout smetana
start
note right
constructor CommandSpriteSvg()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandSpriteSvg.class .getName(),
RegexLeaf.start(),new RegexLeaf("sprite"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("\\$?"),
new RegexLeaf("NAME","([-%pLN_]+)"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("SVG","(\\<svg\\b.*\\</svg\\>)"),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TitledDiagramsystem,
LineLocationlocation,RegexResultarg)
end note
:system.addSprite(arg.get("NAME",0),nanoParser);
:return CommandExecutionResult.ok();;
stop
end
@enduml

