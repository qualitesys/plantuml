@startuml
!pragma layout smetana
start
note right
constructor CommandMultilines2(IRegexpatternStart,
MultilinesStrategystrategy,TrimtrimEnd)
end note
if (patternStart.getPattern().startsWith("^")==false||patternStart.getPattern()
.endsWith("$")==false) then (yes) 
:throw new IllegalArgumentException("Bad pattern "+
patternStart.getPattern());;
endif 
:this.strategy=strategy;
:this.starting=patternStart;
:this.trimEnd=trimEnd;
end
start
note right
booleansyntaxWithFinalBracket()
end note
:return false;;
stop
end
start
note right
String[]getDescription()
end note
:return new String[]{"START: "+starting.getPattern(),"END: "+
getPatternEnd()};;
stop
end
start
note right
CommandControlisValid(BlocLineslines)
end note
:lines=lines.cleanList(strategy);
if (isCommandForbidden()) then (yes) 
:return CommandControl.NOT_OK;;
stop
endif 
if (syntaxWithFinalBracket()) then (yes) 
if (lines.size()==1&&lines.getFirst().getTrimmed()
.getString().endsWith("{")==false) then (yes) 
if (isValid(BlocLines.singleString(vline))==CommandControl.OK_PARTIAL) then (yes) 
:return CommandControl.OK_PARTIAL;;
stop
endif 
:return CommandControl.NOT_OK;;
stop
endif 
:lines=lines.eventuallyMoveBracket();
endif 
if (first==null ) then (yes) 
:return CommandControl.NOT_OK;;
stop
endif 
if (result1==false) then (yes) 
:return CommandControl.NOT_OK;;
stop
endif 
if (lines.size()==1) then (yes) 
:return CommandControl.OK_PARTIAL;;
stop
endif 
if (m1.matches()==false) then (yes) 
:return CommandControl.OK_PARTIAL;;
stop
endif 
:return finalVerification(lines);;
stop
end
start
note right
CommandExecutionResultexecute(Ssystem,BlocLineslines)
end note
:lines=lines.cleanList(strategy);
if (syntaxWithFinalBracket()) then (yes) 
:lines=lines.eventuallyMoveBracket();
endif 
:return executeNow(system,lines);;
stop
:return CommandExecutionResult.badColor();;
stop
end
start
note right
booleanisCommandForbidden()
end note
:return false;;
stop
end
start
note right
CommandControlfinalVerification(BlocLineslines)
end note
:return CommandControl.OK;;
stop
end
start
note right
IRegexgetStartingPattern()
end note
:return starting;;
stop
end
@enduml

