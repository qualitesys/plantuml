@startuml
!pragma layout smetana
start
note right
constructor CommandMultilinesLegend()
end note
:super (getRegexConcat(),MultilinesStrategy.REMOVE_STARTING_QUOTE,
Trim.BOTH);
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandMultilinesLegend.class .getName(),
RegexLeaf.start(),new RegexLeaf("legend"),
new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),
new RegexLeaf("VALIGN","(top|bottom)"))),
new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),
new RegexLeaf("ALIGN","(left|right|center)"))),
RegexLeaf.end());;
stop
end
start
note right
StringgetPatternEnd()
end note
:return "^end[%s]?legend$";;
stop
end
start
note right
CommandExecutionResultexecuteNow(TitledDiagramdiagram,BlocLineslines)
end note
:lines=lines.trimSmart(1);
:lines=lines.subExtract(1,1);
:lines=lines.removeEmptyColumns();
if (strings.size()>0) then (yes) 
if (alignment==null ) then (yes) 
:alignment=HorizontalAlignment.CENTER;
endif 
:diagram.setLegend(DisplayPositioned.single(strings.replaceBackslashT(),
alignment,valignment));
:return CommandExecutionResult.ok();;
stop
endif 
:return CommandExecutionResult.error("No legend defined");;
stop
end
@enduml

