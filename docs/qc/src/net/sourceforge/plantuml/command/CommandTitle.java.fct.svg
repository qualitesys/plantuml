@startuml
!pragma layout smetana
start
note right
constructor CommandTitle()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandTitle.class .getName(),
RegexLeaf.start(),new RegexLeaf("title"),
new RegexLeaf("(?:[%s]*:[%s]*|[%s]+)"),new RegexOr(new RegexLeaf("TITLE1",
"[%g](.*)[%g]"),new RegexLeaf("TITLE2","(.*[%pLN_.].*)")),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(TitledDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:diagram.setTitle(DisplayPositioned.single(s,
HorizontalAlignment.CENTER,VerticalAlignment.TOP));
:return CommandExecutionResult.ok();;
stop
end
@enduml

