@startuml
!pragma layout smetana
start
note right
constructor CommandMultilinesCaption()
end note
end
start
note right
StringgetPatternEnd()
end note
:return "^end[%s]?caption$";;
stop
end
start
note right
CommandExecutionResultexecute(final TitledDiagramdiagram,
