@startuml
!pragma layout smetana
start
note right
constructor PositiveForce(RealfixedPoint,
RealMoveablemovingPoint,doubleminimunDistance)
end note
if (fixedPoint==movingPoint) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
StringtoString()
end note
:return "PositiveForce fixed="+fixedPoint+
" moving="+movingPoint+" min="+minimunDistance;;
stop
end
start
note right
booleanapply()
end note
if (trace) then (yes) 
endif 
:throw e;;
if (diff>=0) then (yes) 
if (trace) then (yes) 
endif 
:return false;;
stop
endif 
if (trace) then (yes) 
endif 
:return true;;
stop
end
@enduml

