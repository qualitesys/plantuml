idth:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="194" x2="194" y1="690.25" y2="710.25"/><polygon fill="#181818" points="190,700.25,194,710.25,198,700.25,194,704.25" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="194" x2="194" y1="762.8164" y2="785.3828"/><polygon fill="#181818" points="190,775.3828,194,785.3828,198,775.3828,194,779.3828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="194" x2="194" y1="819.3516" y2="839.3516"/><polygon fill="#181818" points="190,829.3516,194,839.3516,198,829.3516,194,833.3516" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[92af82fc168a52c02c13d9b3a746d0d9]
@startuml
!pragma layout smetana
start
note right
constructor RealDelta(Realdelegated,doublediff)
end note
:super (((AbstractReal)delegated).getLine(),
"[Delegated {"+delegated.getName()+"} d="+diff+"]");
:this.delegated=delegated;
:this.diff=diff;
end
start
note right
doublegetCurrentValueInternal()
end note
:return delegated.getCurrentValue()+diff;;
stop
end
start
note right
RealaddAtLeast(doubledelta)
end note
:return new RealDelta(delegated.addAtLeast(delta),
diff);;
stop
end
start
note right
void ensureBiggerThan(Realother)
end note
:delegated.ensureBiggerThan(new RealDelta(other,
-diff));
end
start
note right
void move(doubledelta)
end note
:((RealMoveable)delegated).move(delta);
end
@enduml

