@startuml
!pragma layout smetana
start
note right
constructor RealImpl(Stringname,RealLineline,doublecurrentValue)
end note
:super (line,name);
:this.currentValue=currentValue;
end
start
note right
void move(doubledelta)
end note
:this.currentValue+=delta;
end
start
note right
doublegetCurrentValueInternal()
end note
:return currentValue;;
stop
end
start
note right
RealaddAtLeast(doubledelta)
end note
:getLine().addForce(new PositiveForce(this,
result,delta));
:return result;;
stop
end
start
note right
void ensureBiggerThan(Realother)
end note
:getLine().addForce(new PositiveForce(other,
this,0));
end
start
note right
void compileNow()
end note
:getLine().compile();
end
@enduml

