@startuml
!pragma layout smetana
start
note right
constructor RealMoveable(RealLineline,Stringname)
end note
:super (line);
:this.name=name;
:this.creationPoint=new Throwable();
:this.creationPoint.fillInStackTrace();
end
start
note right
void move(doubledelta)
end note
end
start
note right
void printCreationStackTrace()
end note
:Logme.error(creationPoint);
end
start
note right
RealaddFixed(doubledelta)
end note
:return new RealDelta(this,delta);;
stop
end
start
note right
StringtoString()
end note
:return "#"+cpt+"_"+name;;
stop
end
start
note right
StringgetName()
end note
:return name;;
stop
end
@enduml

