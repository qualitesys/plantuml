@startuml
!pragma layout smetana
start
note right
constructor RealMiddle(RealMoveablep1,RealMoveablep2,doubledelta)
end note
:super (p1.getLine());
:this.p1=p1;
:this.p2=p2;
:this.delta=delta;
end
start
note right
RealMiddlecreate(RealMoveablep1,RealMoveablep2)
end note
:return new RealMiddle(p1,p2,0);;
stop
end
start
note right
doublegetCurrentValueInternal()
end note
:return (p1.getCurrentValue()+p2.getCurrentValue())/2+
delta;;
stop
end
start
note right
RealaddFixed(doublediff)
end note
:return new RealMiddle(p1,p2,delta+diff);;
stop
end
start
note right
RealaddAtLeast(doubledelta)
end note
:throw new UnsupportedOperationException();;
end
start
note right
void ensureBiggerThan(Realother)
end note
:throw new UnsupportedOperationException();;
end
start
note right
StringgetName()
end note
:return "[Middle "+p1.getName()+" and "+p2.getName()+
"]";;
stop
end
start
note right
void printCreationStackTrace()
end note
:throw new UnsupportedOperationException();;
end
@enduml

