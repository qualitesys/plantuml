@startuml
!pragma layout smetana
start
note right
constructor Pipe(Optionoption,PrintStreamps,
InputStreamis,Stringcharset)
end note
:this.option=option;;
:try ;
:this.br=new BufferedReader(new InputStreamReader(is,
(charset!=null )? charset:Charset.defaultCharset().name()));;
:catch (UnsupportedEncodingExceptione);
:throw new RuntimeException("Invalid charset provided",e);;
stop
:this.ps=ps;;
:this.stdrpt=option.getStdrpt();;
end
start
note right
void managePipe(ErrorStatuserror)
end note
:final booleannoStdErr=option.isPipeNoStdErr();;
:final Definesdefines=option.getDefaultDefines();;
:final SFilenewCurrentDir=option.getFileDir()==null ? null :new SFile(option.getFileDir());;
:final SourceStringReadersourceStringReader=new SourceStringReader(defines,
source,UTF_8,option.getConfig(),newCurrentDir);;
if (option.isComputeurl()) then (yes) 
:computeUrlForDiagram(sourceStringReader);;
else if (option.isSyntax()) then (yes) 
:syntaxCheckDiagram(sourceStringReader,error);;
else if (option.isPipeMap()) then (yes) 
:createPipeMapForDiagram(sourceStringReader,
error);;
else (no)
:generateDiagram(sourceStringReader,error,
noStdErr);;
endif 
:ps.flush();;
end
start
note right
void generateDiagram(SourceStringReadersourceStringReader,
ErrorStatuserror,booleannoStdErr)
end note
:final OutputStreamos=noStdErr? new ByteArrayOutputStream():ps;;
:final DiagramDescriptionresult=sourceStringReader.outputImage(os,
option.getImageIndex(),option.getFileFormatOption());;
:printInfo(noStdErr? ps:System.err,sourceStringReader);;
if (result!=null &&String.valueOf("(error)").equalsIgnoreCase(result.getDescription())) then (yes) 
:error.goWithError();;
else (no)
:error.goOk();;
if (noStdErr) then (yes) 
:final ByteArrayOutputStreambaos=(ByteArrayOutputStream)os;;
:baos.close();;
:ps.write(baos.toByteArray());;
endif 
endif 
if (option.getPipeDelimitor()!=null ) then (yes) 
:ps.println(option.getPipeDelimitor());;
endif 
end
start
note right
void createPipeMapForDiagram(SourceStringReadersourceStringReader,
ErrorStatuserror)
end note
:final Stringresult=sourceStringReader.getCMapData(option.getImageIndex(),
option.getFileFormatOption());;
:error.goOk();;
if (result==null ) then (yes) 
:ps.println();;
else (no)
:ps.println(result);;
endif 
end
start
note right
void computeUrlForDiagram(SourceStringReadersourceStringReader)
end note
:ps.println(s.getEncodedUrl());;
end
start
note right
void syntaxCheckDiagram(SourceStringReadersourceStringReader,
ErrorStatuserror)
end note
:final Diagramsystem=sourceStringReader.getBlocks()
.get(0).getDiagram();;
if (system instanceof UmlDiagram) then (yes) 
:error.goOk();;
:ps.println(((UmlDiagram)system).getUmlDiagramType()
.name());;
:ps.println(system.getDescription());;
else if (system instanceof PSystemError) then (yes) 
:error.goWithError();;
:stdrpt.printInfo(ps,system);;
else (no)
:error.goOk();;
:ps.println("OTHER");;
:ps.println(system.getDescription());;
endif 
end
start
note right
void printInfo(final PrintStreamoutput,final SourceStringReadersourceStringReader)
end note
:final List<BlockUml>blocks=sourceStringReader.getBlocks();;
if (blocks.size()==0) then (yes) 
:stdrpt.printInfo(output,null );;
else (no)
:stdrpt.printInfo(output,blocks.get(0).getDiagram());;
endif 
end
start
note right
StringreadFirstDiagram()
end note
:return readSingleDiagram(true);;
stop
end
start
note right
StringreadSubsequentDiagram()
end note
:return readSingleDiagram(false);;
stop
end
start
note right
StringreadSingleDiagram(booleanunmarkedAllowed)
end note
:Statestate=State.NO_CONTENT;;
:StringexpectedEnd=null ;;
:final StringBuildersb=new StringBuilder();;
:Stringline;;
while (state!=State.COMPLETE&&(line=br.readLine())!=null )
if (line.startsWith("@@@format ")) then (yes) 
:manageFormat(line);;
else (no)
if (state==State.NO_CONTENT&&line.trim().length()>0) then (yes) 
:state=State.START_MARK_NOT_FOUND;;
endif 
if (state==State.START_MARK_NOT_FOUND&&line.startsWith("@start")) then (yes) 
:sb.setLength(0);;
:state=State.START_MARK_FOUND;;
:expectedEnd="@end"+line.substring(6).split("^[A-Za-z]")[0];;
else if (state==State.START_MARK_FOUND&&line.startsWith(expectedEnd)) then (yes) 
:state=State.COMPLETE;;
endif 
if (state!=State.NO_CONTENT) then (yes) 
:sb.append(line).append("\n");;
endif 
endif 
endwhile
switch (switch (state))
endswith
end
start
note right
void manageFormat(Strings)
end note
if (s.contains("png")) then (yes) 
:option.setFileFormatOption(new FileFormatOption(FileFormat.PNG));;
else if (s.contains("svg")) then (yes) 
:option.setFileFormatOption(new FileFormatOption(FileFormat.SVG));;
endif 
end
@enduml

