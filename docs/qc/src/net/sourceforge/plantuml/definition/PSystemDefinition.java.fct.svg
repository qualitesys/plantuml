@startuml
!pragma layout smetana
start
note right
constructor PSystemDefinition(UmlSourcesource,
StringstartLine)
end note
:super (source);
:this.startLine=startLine;
end
start
note right
DiagramDescriptiongetDescription()
end note
:return new DiagramDescription("(Definition)");;
stop
end
start
note right
UDrawablegetRootDrawable(FileFormatOptionfileFormatOption)
end note
:return this;;
stop
end
start
note right
void drawU(UGraphicug)
end note
:Display.getWithNewlines(startLine).create(fc,
HorizontalAlignment.LEFT,new SpriteContainerEmpty())
.drawU(ug);
end
start
note right
void doCommandLine(Stringline)
end note
:this.lines.add(line);
end
@enduml

