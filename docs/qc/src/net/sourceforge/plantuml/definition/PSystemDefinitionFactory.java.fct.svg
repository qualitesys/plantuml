@startuml
!pragma layout smetana
start
note right
constructor PSystemDefinitionFactory()
end note
:super (DiagramType.DEFINITION);
end
start
note right
PSystemDefinitioninitDiagram(UmlSourcesource,StringstartLine)
end note
if (getDiagramType()==DiagramType.DEFINITION) then (yes) 
