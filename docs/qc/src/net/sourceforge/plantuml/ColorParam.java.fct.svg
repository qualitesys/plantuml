end
start
note right
constructor ColorParam(HColordefaultValue,
booleanisBackground,ColorTypecolorType)
end note
if (colorType==ColorType.BACK&&isBackground==false) then (yes) 
:throw new IllegalStateException();;
endif 
end
start
note right
booleanisBackground()
end note
:return isBackground;;
stop
end
start
note right
HColorgetDefaultValue()
end note
:return defaultValue;;
stop
end
start
