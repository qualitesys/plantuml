@startuml
!pragma layout smetana
start
note right
constructor ResourceDraw(GanttDiagramgantt,
Resourceres,TimeScaletimeScale,doubley,Daymin,
Daymax)
end note
end
start
note right
void drawU(UGraphicug)
end note
if (isBreaking) then (yes) 
if (totalLoad>0) then (yes) 
if (startingPosition==-1) then (yes) 
endif 
endif 
else (no)
if (startingPosition==-1) then (yes) 
endif 
endif 
end
start
note right
FontConfigurationgetFontConfiguration(intsize)
end note
:return getFontConfiguration(size,HColors.BLACK);;
stop
end
start
note right
FontConfigurationgetFontConfiguration(intsize,
HColorcolor)
end note
:return FontConfiguration.create(font,color,
color,null );;
stop
end
start
note right
doublegetHeight()
end note
:return 16*2;;
stop
end
start
note right
doublegetY()
end note
:return y;;
stop
end
@enduml

