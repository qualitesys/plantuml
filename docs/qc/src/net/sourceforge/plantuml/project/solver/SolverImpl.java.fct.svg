@startuml
!pragma layout smetana
start
note right
constructor SolverImpl(LoadPlanableloadPlanable)
end note
:this.loadPlanable=loadPlanable;;
end
start
note right
DaycomputeEnd()
end note
:Daycurrent=(Day)values.get(TaskAttribute.START);;
:intfullLoad=((Load)values.get(TaskAttribute.LOAD))
.getFullLoad();;
:intcpt=0;;
:while (fullLoad>0){fullLoad-=loadPlanable.getLoadAt(current);current=current.increment();cpt+
+;if (cpt>100000)throw new IllegalStateException();};
:return current.decrement();;
stop
end
start
note right
DaycomputeStart()
end note
:Daycurrent=(Day)values.get(TaskAttribute.END);;
:intfullLoad=((Load)values.get(TaskAttribute.LOAD))
.getFullLoad();;
:intcpt=0;;
:while (fullLoad>0){fullLoad-=loadPlanable.getLoadAt(current);current=current.decrement();if (current.getMillis()<=0)return current;cpt+
+;if (cpt>100000)throw new IllegalStateException();};
:return current.increment();;
stop
end
@enduml

