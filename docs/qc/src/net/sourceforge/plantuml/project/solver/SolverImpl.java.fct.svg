@startuml
!pragma layout smetana
start
note right
constructor SolverImpl(LoadPlanableloadPlanable)
end note
end
start
note right
DaycomputeEnd()
end note
while (fullLoad>0)
if (cpt>100000) then (yes) 
:throw new IllegalStateException();;
endif 
endwhile
:return current.decrement();;
stop
end
start
note right
DaycomputeStart()
end note
while (fullLoad>0)
if (current.getMillis()<=0) then (yes) 
:return current;;
stop
endif 
if (cpt>100000) then (yes) 
:throw new IllegalStateException();;
endif 
endwhile
:return current.increment();;
stop
end
@enduml

