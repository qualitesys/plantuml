@startuml
!pragma layout smetana
start
note right
void setData(TaskAttributeattribute,Valuevalue)
end note
if (previous!=null &&attribute==TaskAttribute.START) then (yes) 
if (previousInstant.compareTo((Day)value)>0) then (yes) 
:value=previous;
endif 
endif 
:values.put(attribute,value);
if (values.size()>2) then (yes) 
:removeFirstElement();
endif 
end
start
note right
void removeFirstElement()
end note
:it.next();
:it.remove();
end
start
note right
ValuegetData(TaskAttributeattribute)
end note
if (result==null ) then (yes) 
if (attribute==TaskAttribute.END) then (yes) 
:return computeEnd();;
stop
endif 
if (attribute==TaskAttribute.START) then (yes) 
:return computeStart();;
stop
endif 
:return Load.inWinks(1);;
stop
endif 
:return result;;
stop
end
