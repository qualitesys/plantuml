@startuml
!pragma layout smetana
start
note right
constructor Solver3(HistogramworkLoad)
end note
:this.workLoad=workLoad;;
end
start
note right
TaskLoadsolveForward(longtotalLoad,longstart)
end note
:final HistogramSimpleresultLoad=new HistogramSimple();;
:final TaskLoadImplresult=new TaskLoadImpl(resultLoad);;
:start=workLoad.getNext(start-1);;
:result.setStart(start);;
:longcurrentTime=start;;
:while (totalLoad>0){final longtmpWorkLoad=workLoad.getValueAt(currentTime);
:final longnextChange=workLoad.getNext(currentTime);
:final longduration=nextChange-currentTime;if (duration<=0)throw new IllegalArgumentException();final longpartialLoad=duration*tmpWorkLoad;resultLoad.put(currentTime,
tmpWorkLoad);if (partialLoad>=totalLoad){final longend=currentTime+
totalLoad/tmpWorkLoad;result.setEnd(end);resultLoad.put(end,
0);return result;}totalLoad-=partialLoad;currentTime=nextChange;};
:throw new UnsupportedOperationException();;
stop
end
start
note right
TaskLoadsolveBackward(longtotalLoad,longend)
end note
:throw new UnsupportedOperationException();;
stop
end
start
note right
InstantcomputeEnd()
end note
:Instantstart=(Instant)values.get(TaskAttribute.START);;
:intfullLoad=((Load)values.get(TaskAttribute.LOAD))
.getFullLoad();;
:final TaskLoadtaskLoad=solveBackward(fullLoad,
start.getMillis());;
:return Instant.create(taskLoad.getEnd());;
stop
end
start
note right
InstantcomputeStart()
end note
:throw new UnsupportedOperationException();;
stop
end
