@startuml
!pragma layout smetana
start
note right
constructor Solver3(HistogramworkLoad)
end note
end
start
note right
TaskLoadsolveForward(longtotalLoad,longstart)
end note
while (totalLoad>0)
if (duration<=0) then (yes) 
:throw new IllegalArgumentException();;
endif 
if (partialLoad>=totalLoad) then (yes) 
:return result;;
stop
endif 
endwhile
:throw new UnsupportedOperationException();;
end
start
note right
TaskLoadsolveBackward(longtotalLoad,longend)
end note
:throw new UnsupportedOperationException();;
end
start
note right
InstantcomputeEnd()
end note
:return Instant.create(taskLoad.getEnd());;
stop
end
start
note right
InstantcomputeStart()
end note
:throw new UnsupportedOperationException();;
end
@enduml

