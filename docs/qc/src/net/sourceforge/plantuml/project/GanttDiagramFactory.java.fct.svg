@startuml
!pragma layout smetana
start
note right
List<Subject>subjects()
end note
:return Arrays.<Subject>asList(new SubjectTask(),
new SubjectProject(),new SubjectDayOfWeek(),
new SubjectDayAsDate(),new SubjectDaysAsDates(),
new SubjectResource(),new SubjectToday(),
new SubjectSeparator());;
stop
end
start
note right
constructor GanttDiagramFactory(DiagramTypetype)
end note
end
start
note right
List<Command>createCommands()
end note
:return cmds;;
stop
end
start
note right
void clearCache()
end note
end
start
note right
Collection<Command>getLanguageCommands()
end note
if (cache.size()==0) then (yes) 
if (sentenceA.getVerbPattern().equals(sentenceB.getVerbPattern())==false) then (yes) 
endif 
if (sentenceA.getVerbPattern().equals(sentenceB.getVerbPattern())==false&&sentenceA.getVerbPattern().equals(sentenceC.getVerbPattern())==false&&sentenceC.getVerbPattern().equals(sentenceB.getVerbPattern())==false) then (yes) 
endif 
endif 
:return cache;;
stop
end
start
note right
GanttDiagramcreateEmptyDiagram(UmlSourcesource,
Map<String,String>skinParam)
end note
:return new GanttDiagram(source);;
stop
end
