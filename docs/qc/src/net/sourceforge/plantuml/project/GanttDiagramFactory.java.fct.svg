@startuml
!pragma layout smetana
start
note right
List<Subject>subjects()
end note
:return Arrays.<Subject>asList(new SubjectTask(),
new SubjectProject(),new SubjectDayOfWeek(),
new SubjectDayAsDate(),new SubjectDaysAsDates(),
new SubjectResource(),new SubjectToday(),
new SubjectSeparator());;
stop
end
start
note right
constructor GanttDiagramFactory(DiagramTypetype)
end note
:super (type);
end
start
note right
List<Command>createCommands()
end note
:CommonCommands.addTitleCommands(cmds);
:CommonCommands.addCommonCommands2(cmds);
:cmds.add(new CommandStyleMultilinesCSS());
:cmds.add(new CommandStyleImport());
:cmds.add(new CommandNope());
:cmds.addAll(getLanguageCommands());
:cmds.add(new CommandGanttArrow());
:cmds.add(new CommandGanttArrow2());
:cmds.add(new CommandColorTask());
:cmds.add(new CommandSeparator());
:cmds.add(new CommandWeekNumberStrategy());
:cmds.add(new CommandGroupStart());
:cmds.add(new CommandGroupEnd());
:cmds.add(new CommandLanguage());
:cmds.add(new CommandPrintScale());
:cmds.add(new CommandPrintBetween());
:cmds.add(new CommandNoteBottom());
:cmds.add(new CommandFootbox());
:cmds.add(new CommandLabelOnColumn());
:cmds.add(new CommandHideResourceName());
:cmds.add(new CommandHideResourceFootbox());
:return cmds;;
stop
end
start
note right
void clearCache()
end note
:cache.clear();
end
start
note right
Collection<Command>getLanguageCommands()
end note
if (cache.size()==0) then (yes) 
:cache.add(NaturalCommand.create(sentenceA));
if (sentenceA.getVerbPattern().equals(sentenceB.getVerbPattern())==false) then (yes) 
:cache.add(NaturalCommand.create(new SentenceAnd(sentenceA,
sentenceB)));
endif 
if (sentenceA.getVerbPattern().equals(sentenceB.getVerbPattern())==false&&sentenceA.getVerbPattern()
.equals(sentenceC.getVerbPattern())==false&&sentenceC.getVerbPattern()
.equals(sentenceB.getVerbPattern())==false) then (yes) 
:cache.add(NaturalCommand.create(new SentenceAndAnd(sentenceA,
sentenceB,sentenceC)));
endif 
endif 
:return cache;;
stop
end
start
note right
GanttDiagramcreateEmptyDiagram(UmlSourcesource,
Map<String,String>skinParam)
end note
:return new GanttDiagram(source);;
stop
end
@enduml

