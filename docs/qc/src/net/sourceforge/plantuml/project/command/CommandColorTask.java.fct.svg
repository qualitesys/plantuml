@startuml
!pragma layout smetana
start
note right
constructor CommandColorTask()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandColorTask.class .getName(),
RegexLeaf.start(),new RegexLeaf("CODE","\\[([%pLN_.]+)\\]"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("COLORS",
"#(\\w+)(?:/(#?\\w+))?"),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(GanttDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (task==null ) then (yes) 
:return CommandExecutionResult.error("No such task "+code);;
stop
endif 
:task.setColors(new CenterBorderColor(col1,
col2));
:return CommandExecutionResult.ok();;
stop
end
@enduml

