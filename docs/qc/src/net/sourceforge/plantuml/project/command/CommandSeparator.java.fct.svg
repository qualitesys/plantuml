@startuml
!pragma layout smetana
start
note right
constructor CommandSeparator()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandSeparator.class .getName(),
RegexLeaf.start(),new RegexLeaf("- -"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("COMMENT","((.+?)[%s]*- -)?"),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(GanttDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:diagram.addSeparator(comment);
:return CommandExecutionResult.ok();;
stop
end
@enduml

