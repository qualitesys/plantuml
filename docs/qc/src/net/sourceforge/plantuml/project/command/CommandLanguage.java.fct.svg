@startuml
!pragma layout smetana
start
note right
constructor CommandLanguage()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandLanguage.class .getName(),
RegexLeaf.start(),new RegexLeaf("language"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("LANG","(\\w+
)"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(GanttDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:return diagram.changeLanguage(arg.get("LANG",
0));;
stop
end
@enduml

