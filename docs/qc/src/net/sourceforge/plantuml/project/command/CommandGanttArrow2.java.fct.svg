@startuml
!pragma layout smetana
start
note right
constructor CommandGanttArrow2()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandGanttArrow2.class .getName(),
RegexLeaf.start(),new RegexLeaf("\\["),new RegexLeaf("TASK1",
"([^\\[\\]]+?)"),new RegexLeaf("\\]"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("(-+)"),new RegexLeaf("ARROW_STYLE",
"(?:\\[("+CommandLinkElement.LINE_STYLE+")\\])?"),
new RegexLeaf("(-*)"),new RegexLeaf("\\>"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("\\["),
new RegexLeaf("TASK2","([^\\[\\]]+?)"),new RegexLeaf("\\]"),
RegexLeaf.spaceZeroOrMore(),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(GanttDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:link.applyStyle(arg.get("ARROW_STYLE",0));
:return CommandExecutionResult.ok();;
stop
end
@enduml

