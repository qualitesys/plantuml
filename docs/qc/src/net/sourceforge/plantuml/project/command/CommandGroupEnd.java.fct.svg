@startuml
!pragma layout smetana
start
note right
constructor CommandGroupEnd()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandGroupEnd.class .getName(),
RegexLeaf.start(),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("end"),RegexLeaf.spaceZeroOrMore(),
new RegexLeaf("group"),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(GanttDiagramdiagram,LineLocationlocation,RegexResultarg)
end note
:return diagram.endGroup();;
stop
end
@enduml

