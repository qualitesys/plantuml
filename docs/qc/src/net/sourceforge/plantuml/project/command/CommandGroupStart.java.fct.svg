@startuml
!pragma layout smetana
start
note right
constructor CommandGroupStart()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandGroupStart.class .getName(),
RegexLeaf.start(),new RegexLeaf("group"),
RegexLeaf.spaceOneOrMore(),new RegexLeaf("\\["),new RegexLeaf("NAME","([^\\[\\]]+
)"),new RegexLeaf("\\]"),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(GanttDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
:return diagram.addGroup(name);;
stop
end
@enduml

