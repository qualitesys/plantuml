@startuml
!pragma layout smetana
start
note right
constructor CommandGanttArrow()
end note
:super (getRegexConcat());
end
start
note right
IRegexgetRegexConcat()
end note
:return RegexConcat.build(CommandGanttArrow.class .getName(),
RegexLeaf.start(),new RegexLeaf("CODE1","([%pLN_.]+)"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("(-+)"),
new RegexLeaf("ARROW_STYLE","(?:\\[("+CommandLinkElement.LINE_STYLE+")\\])?"),
new RegexLeaf("(-*)"),new RegexLeaf("\\>"),
RegexLeaf.spaceZeroOrMore(),new RegexLeaf("CODE2",
"([%pLN_.]+)"),RegexLeaf.spaceZeroOrMore(),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecuteArg(GanttDiagramdiagram,
LineLocationlocation,RegexResultarg)
end note
if (task1==null ) then (yes) 
:return CommandExecutionResult.error("No such task "+code1);;
stop
endif 
if (task2==null ) then (yes) 
:return CommandExecutionResult.error("No such task "+code2);;
stop
endif 
:link.applyStyle(arg.get("ARROW_STYLE",0));
:return CommandExecutionResult.ok();;
stop
end
@enduml

