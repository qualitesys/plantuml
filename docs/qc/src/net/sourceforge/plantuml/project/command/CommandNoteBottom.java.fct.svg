@startuml
!pragma layout smetana
start
note right
constructor CommandNoteBottom()
end note
end
start
note right
StringgetPatternEnd()
end note
:return "^end[%s]*note$";;
stop
end
start
note right
CommandExecutionResultexecute(GanttDiagramdiagram,
BlocLineslines)
end note
if (strings.size()>0) then (yes) 
:return diagram.addNote(strings);;
stop
endif 
:return CommandExecutionResult.error("No note defined");;
stop
end
@enduml

