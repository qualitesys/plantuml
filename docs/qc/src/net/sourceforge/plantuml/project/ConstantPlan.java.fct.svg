@startuml
!pragma layout smetana
start
note right
constructor ConstantPlan(intloadPerInstant)
end note
:this.loadPerInstant=loadPerInstant;
end
start
note right
LoadPlanablenormal()
end note
:return new ConstantPlan(100);;
stop
end
start
note right
LoadPlanablepartial(intload)
end note
:return new ConstantPlan(load);;
stop
end
start
note right
intgetLoadAt(Dayinstant)
end note
:return loadPerInstant;;
stop
end
@enduml

