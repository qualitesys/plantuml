@startuml
!pragma layout smetana
start
note right
UPolygonasToUp()
end note
:return polygon;;
stop
end
start
note right
UPolygonasToDown()
end note
:return polygon;;
stop
end
start
note right
UPolygonasToRight()
end note
:return polygon.translate(-4,0);;
stop
end
start
note right
UPolygonasToLeft()
end note
:return polygon.translate(4,0);;
stop
end
start
note right
UPolygonasTo(Directiondirection)
end note
if (direction==Direction.UP) then (yes) 
:return asToUp();;
stop
endif 
if (direction==Direction.DOWN) then (yes) 
:return asToDown();;
stop
endif 
if (direction==Direction.LEFT) then (yes) 
:return asToLeft();;
stop
endif 
if (direction==Direction.RIGHT) then (yes) 
:return asToRight();;
stop
endif 
:throw new IllegalArgumentException();;
end
@enduml

