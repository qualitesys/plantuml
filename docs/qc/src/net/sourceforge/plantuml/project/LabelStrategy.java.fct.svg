><polygon fill="#181818" points="164,765.4766,168,775.4766,172,765.4766,168,769.4766" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ee57e3475c2100f70fba46829316ce93]
@startuml
!pragma layout smetana
start
note right
constructor LabelStrategy(LabelPositionposition,HorizontalAlignmentalignment)
end note
:this.position=position;
:this.alignment=alignment;
end
start
note right
booleantitleInFirstColumn()
end note
:return position==LabelPosition.FIRST_COLUMN;;
stop
end
start
note right
booleantitleInLastColumn()
end note
:return position==LabelPosition.LAST_COLUMN;;
stop
end
start
note right
booleantitleInside()
end note
:return position==LabelPosition.LEGACY;;
stop
end
start
note right
booleanrightAligned()
end note
:return alignment==HorizontalAlignment.RIGHT;;
stop
end
@enduml

