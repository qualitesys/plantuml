@startuml
!pragma layout smetana
start
note right
constructor TaskInstant(Moment task,TaskAttribute attribute)
end note
:this(task,attribute,0,GanttConstraintMode.IGNORE_CALENDAR,
null );;
end
start
note right
constructor TaskInstant(Moment task,TaskAttribute attribute,
int delta,GanttConstraintMode mode,LoadPlanable calendar)
end note
:this.task=task;;
:this.attribute=attribute;;
:this.delta=delta;;
:this.mode=mode;;
:this.calendar=calendar;;
if (attribute!=TaskAttribute.START&&attribute!=TaskAttribute.END) then (yes) 
:throw new IllegalArgumentException();;
stop
endif 
end
start
note right
TaskInstant withDelta(int newDelta,GanttConstraintMode mode,
LoadPlanable calendar)
end note
:return new TaskInstant(task,attribute,newDelta,
mode,calendar);;
stop
end
start
note right
Day manageDelta(Day value)
end note
if (delta>0) then (yes) 
if (mode==GanttConstraintMode.DO_NOT_COUNT_CLOSE_DAY) then (yes) 
:int tmp=0;;
while (calendar.getLoadAt(value)==0&&tmp+
+<1000)
:value=value.increment();;
endwhile
endif 
:value=value.increment();;
endif 
if (delta<0) then (yes) 
:value=value.decrement();;
endif 
:return value;;
stop
end
start
note right
Day getInstantPrecise()
end note
if (attribute==TaskAttribute.START) then (yes) 
:return manageDelta(task.getStart());;
stop
endif 
if (attribute==TaskAttribute.END) then (yes) 
:return manageDelta(task.getEnd().increment());;
stop
endif 
:throw new IllegalStateException();;
stop
end
start
note right
Day getInstantTheorical()
end note
if (attribute==TaskAttribute.START) then (yes) 
:return manageDelta(task.getStart());;
stop
endif 
if (attribute==TaskAttribute.END) then (yes) 
:return manageDelta(task.getEnd());;
stop
endif 
:throw new IllegalStateException();;
stop
end
start
note right
String toString()
end note
:return attribute.toString()+" of "+task;;
stop
end
start
note right
Moment getMoment()
end note
:return task;;
stop
end
start
note right
boolean isTask()
end note
:return task instanceof AbstractTask ;;
stop
end
start
note right
TaskAttribute getAttribute()
end note
:return attribute;;
stop
end
start
note right
boolean sameRowAs(TaskInstant dest)
end note
if (this.isTask()&&dest.isTask()) then (yes) 
:final AbstractTask t1=(AbstractTask )this.getMoment();;
:final AbstractTask t2=(AbstractTask )dest.getMoment();;
if (t1==t2.getRow()||t2==t1.getRow()) then (yes) 
:return true;;
stop
endif 
endif 
:return false;;
stop
end
@enduml

