@startuml
!pragma layout smetana
start
note right
constructor TaskInstant(Momenttask,TaskAttributeattribute)
end note
:this(task,attribute,0,GanttConstraintMode.IGNORE_CALENDAR,
null );
end
start
note right
constructor TaskInstant(Momenttask,TaskAttributeattribute,
intdelta,GanttConstraintModemode,LoadPlanablecalendar)
end note
:this.task=task;
:this.attribute=attribute;
:this.delta=delta;
:this.mode=mode;
:this.calendar=calendar;
if (attribute!=TaskAttribute.START&&attribute!=TaskAttribute.END) then (yes) 
:throw new IllegalArgumentException();;
endif 
end
start
note right
TaskInstantwithDelta(intnewDelta,GanttConstraintModemode,
LoadPlanablecalendar)
end note
:return new TaskInstant(task,attribute,newDelta,
mode,calendar);;
stop
end
start
note right
DaymanageDelta(Dayvalue)
end note
if (delta>0) then (yes) 
:i++;
if (mode==GanttConstraintMode.DO_NOT_COUNT_CLOSE_DAY) then (yes) 
while (calendar.getLoadAt(value)==0&&tmp+
+<1000)
:value=value.increment();
endwhile
endif 
:value=value.increment();
endif 
if (delta<0) then (yes) 
:i++;
:value=value.decrement();
endif 
:return value;;
stop
end
start
note right
DaygetInstantPrecise()
end note
if (attribute==TaskAttribute.START) then (yes) 
:return manageDelta(task.getStart());;
stop
endif 
if (attribute==TaskAttribute.END) then (yes) 
:return manageDelta(task.getEnd().increment());;
stop
endif 
:throw new IllegalStateException();;
end
start
note right
DaygetInstantTheorical()
end note
if (attribute==TaskAttribute.START) then (yes) 
:return manageDelta(task.getStart());;
stop
endif 
if (attribute==TaskAttribute.END) then (yes) 
:return manageDelta(task.getEnd());;
stop
endif 
:throw new IllegalStateException();;
end
start
note right
StringtoString()
end note
:return attribute.toString()+" of "+task;;
stop
end
start
note right
MomentgetMoment()
end note
:return task;;
stop
end
start
note right
booleanisTask()
end note
:return task instanceof AbstractTask;;
stop
end
start
note right
TaskAttributegetAttribute()
end note
:return attribute;;
stop
end
start
note right
booleansameRowAs(TaskInstantdest)
end note
if (this.isTask()&&dest.isTask()) then (yes) 
if (t1==t2.getRow()||t2==t1.getRow()) then (yes) 
:return true;;
stop
endif 
endif 
:return false;;
stop
end
@enduml

