start
note right
constructor Failable(Odata,Stringerror)
end note
if (data==null &&error==null ) then (yes) 
:throw new IllegalArgumentException();;
endif 
if (data!=null &&error!=null ) then (yes) 
:throw new IllegalArgumentException();;
endif 
:this.data=data;
:this.error=error;
end
start
note right
Oget()
end note
if (data==null ) then (yes) 
:throw new IllegalStateException();;
endif 
:return data;;
stop
end
start
note right
booleanisFail()
end note
:return data==null ;;
stop
end
start
note right
