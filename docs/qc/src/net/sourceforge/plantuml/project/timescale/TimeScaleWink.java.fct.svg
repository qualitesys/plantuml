 y1="930.3633" y2="950.3633"/><polygon fill="#181818" points="188,940.3633,192,950.3633,196,940.3633,192,944.3633" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4bd67e9303148ed0c63cbc544c3612e8]
@startuml
!pragma layout smetana
start
note right
constructor TimeScaleWink(doublescale,PrintScaleprintScale)
end note
:this.scale=16.0*scale;;
:this.printScale=printScale;;
end
start
note right
doublegetStartingPosition(Dayinstant)
end note
:return wink*scale/Day.MILLISECONDS_PER_DAY;;
stop
end
start
note right
doublegetEndingPosition(Dayinstant)
end note
:return getStartingPosition(instant)+getWidth(instant);;
stop
end
start
note right
doublegetWidth(Dayinstant)
end note
:return scale;;
stop
end
start
note right
booleanisBreaking(Dayinstant)
end note
if (printScale==PrintScale.WEEKLY) then (yes) 
:return num%7==6;;
stop
endif 
:return true;;
stop
end
@enduml

