@startuml
!pragma layout smetana
start
note right
longgetNext(longmoment)
end note
if (e>moment) then (yes) 
:return e;;
stop
endif 
:return TimeLine.MAX_TIME;;
stop
end
start
note right
longgetPrevious(longmoment)
end note
if (e>=moment) then (yes) 
:return last;;
stop
endif 
:return last;;
stop
end
start
note right
void add(longevent)
end note
end
@enduml

