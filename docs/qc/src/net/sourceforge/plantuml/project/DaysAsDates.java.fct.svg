@startuml
!pragma layout smetana
start
note right
constructor DaysAsDates(Daydate1,Daydate2)
end note
:this.date1=date1;;
:this.date2=date2;;
end
start
note right
constructor DaysAsDates(GanttDiagramgantt,
Daydate1,intcount)
end note
:this.date1=date1;;
:Daytmp=date1;;
:while (count>0){if (gantt.isOpen(tmp)){count- -;
:}tmp=tmp.increment();};
:this.date2=tmp;;
end
start
note right
constructor MyIterator(Daycurrent)
end note
:this.current=current;;
end
start
note right
booleanhasNext()
end note
:return current.compareTo(date2)<=0;;
stop
end
start
note right
Daynext()
end note
:final Dayresult=current;;
:current=current.increment();;
:return result;;
stop
end
start
note right
void remove()
end note
:throw new UnsupportedOperationException();;
stop
end
start
note right
Iterator<Day>iterator()
end note
:return new MyIterator(date1);;
stop
