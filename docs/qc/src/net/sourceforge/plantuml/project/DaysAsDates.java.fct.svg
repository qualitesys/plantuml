@startuml
!pragma layout smetana
start
note right
constructor DaysAsDates(Daydate1,Daydate2)
end note
end
start
note right
constructor DaysAsDates(GanttDiagramgantt,
Daydate1,intcount)
end note
while (count>0)
if (gantt.isOpen(tmp)) then (yes) 
endif 
endwhile
end
start
note right
constructor MyIterator(Daycurrent)
end note
end
start
note right
booleanhasNext()
end note
:return current.compareTo(date2)<=0;;
stop
end
start
note right
Daynext()
end note
:return result;;
stop
end
start
note right
void remove()
end note
:throw new UnsupportedOperationException();;
end
start
note right
Iterator<Day>iterator()
end note
:return new MyIterator(date1);;
stop
end
@enduml

