@startuml
!pragma layout smetana
start
note right
constructor CenterBorderColor(HColorcenter,
HColorborder)
end note
end
start
note right
constructor CenterBorderColor(HColorcenter,
HColorborder,Stringstyle)
end note
end
start
note right
UGraphicapply(UGraphicug)
end note
if (isOk()==false) then (yes) 
:throw new IllegalStateException();;
endif 
if (border==null ) then (yes) 
else (no)
endif 
:return ug;;
stop
end
start
note right
booleanisOk()
end note
:return center!=null ;;
stop
end
start
note right
HColorgetCenter()
end note
:return center;;
stop
end
start
note right
StringgetStyle()
end note
:return style;;
stop
end
start
