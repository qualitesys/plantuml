@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexLeaf("COMPLEMENT"+suffix,"from[%s]+
(#?\\w+)(?:/(#?\\w+))?[%s]+to[%s]+(#?\\w+
)(?:/(#?\\w+))?");;
stop
end
start
note right
Failable<CenterBorderColor[]>getMe(GanttDiagramdiagram,
RegexResultarg,Stringsuffix)
end note
:return Failable.ok(result);;
stop
end
@enduml

