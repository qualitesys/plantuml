@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexLeaf("COMPLEMENT"+suffix,"\\[([^\\[\\]]+
)\\]");;
stop
end
start
note right
Failable<String>getMe(GanttDiagramsystem,RegexResultarg,Stringsuffix)
end note
:return Failable.ok(name);;
stop
end
@enduml

