@startuml
!pragma layout smetana
start
note right
constructor SentenceAnd(SentenceSimplesentence1,
SentenceSimplesentence2)
end note
end
start
note right
IRegextoRegex()
end note
:return new RegexConcat(RegexLeaf.start(),
sentence1.subjectii.toRegex(),RegexLeaf.spaceOneOrMore(),
sentence1.getVerbRegex(),RegexLeaf.spaceOneOrMore(),
sentence1.complementii.toRegex("1"),RegexLeaf.spaceOneOrMore(),
new RegexLeaf("and"),RegexLeaf.spaceOneOrMore(),
sentence2.getVerbRegex(),RegexLeaf.spaceOneOrMore(),
sentence2.complementii.toRegex("2"),RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
RegexResultarg)
end note
if (subject.isFail()) then (yes) 
:return CommandExecutionResult.error(subject.getError());;
stop
endif 
if (complement1.isFail()) then (yes) 
:return CommandExecutionResult.error(complement1.getError());;
stop
endif 
if (result1.isOk()==false) then (yes) 
:return result1;;
stop
endif 
if (complement2.isFail()) then (yes) 
:return CommandExecutionResult.error(complement2.getError());;
stop
endif 
:return sentence2.execute(project,subject.get(),
complement2.get());;
stop
end
@enduml

