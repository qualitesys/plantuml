@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexLeaf("COMPLEMENT"+suffix,"with[%s]+
"+optionalStyle+"(#?\\w+)[%s]+"+optionalStyle+
"link");;
stop
end
start
note right
Failable<CenterBorderColor>getMe(GanttDiagramdiagram,RegexResultarg,Stringsuffix)
end note
:return Failable.ok(new CenterBorderColor(col1,
col1,style));;
stop
end
@enduml

