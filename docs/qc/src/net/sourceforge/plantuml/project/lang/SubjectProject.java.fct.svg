@startuml
!pragma layout smetana
start
note right
IRegextoRegex()
end note
:return new RegexLeaf("SUBJECT","project");;
stop
end
start
note right
Failable<GanttDiagram>getMe(GanttDiagramproject,
RegexResultarg)
end note
:return Failable.ok(project);;
stop
end
start
note right
Collection<?  extends SentenceSimple>getSentences()
end note
:return Arrays.asList(new Starts());;
stop
end
start
note right
constructor Starts()
end note
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:return CommandExecutionResult.ok();;
stop
end
@enduml

