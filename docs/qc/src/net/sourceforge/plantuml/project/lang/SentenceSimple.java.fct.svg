@startuml
!pragma layout smetana
start
note right
constructor SentenceSimple(Subjectsubject,
IRegexverb,Somethingcomplement)
end note
:this.subjectii=subject;
:this.verb=verb;
:this.complementii=complement;
end
start
note right
IRegextoRegex()
end note
if (complementii instanceof ComplementEmpty) then (yes) 
:return new RegexConcat(RegexLeaf.start(),
subjectii.toRegex(),RegexLeaf.spaceOneOrMore(),
verb,RegexLeaf.end());;
stop
endif 
:return new RegexConcat(RegexLeaf.start(),
subjectii.toRegex(),RegexLeaf.spaceOneOrMore(),
verb,RegexLeaf.spaceOneOrMore(),complementii.toRegex("0"),
RegexLeaf.end());;
stop
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
RegexResultarg)
end note
if (subject.isFail()) then (yes) 
:return CommandExecutionResult.error(subject.getError());;
stop
endif 
if (complement.isFail()) then (yes) 
:return CommandExecutionResult.error(complement.getError());;
stop
endif 
:return execute(project,subject.get(),complement.get());;
stop
end
start
note right
StringgetVerbPattern()
end note
:return verb.getPattern();;
stop
end
start
note right
IRegexgetVerbRegex()
end note
:return verb;;
stop
end
@enduml

