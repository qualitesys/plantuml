@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexLeaf("CLOSED"+suffix,"(closed?(?: for \\[([^\\[\\]]+
?)\\])?)");;
stop
end
start
note right
Failable<String>getMe(GanttDiagramproject,
RegexResultarg,Stringsuffix)
end note
if (x>0) then (yes) 
:return Failable.ok(s);;
stop
endif 
:return Failable.ok("");;
stop
end
@enduml

