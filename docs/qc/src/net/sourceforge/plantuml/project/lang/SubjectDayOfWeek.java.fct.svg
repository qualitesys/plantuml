@startuml
!pragma layout smetana
start
note right
IRegextoRegex()
end note
:return new RegexLeaf("SUBJECT","("+DayOfWeek.getRegexString()+
")");;
stop
end
start
note right
Failable<?  extends Object>getMe(GanttDiagramproject,
RegexResultarg)
end note
:return Failable.ok(DayOfWeek.fromString(s));;
stop
end
start
note right
Collection<?  extends SentenceSimple>getSentences()
end note
:return Arrays.asList(new AreClose(),new AreOpen(),
new InColor());;
stop
end
start
note right
constructor AreOpen()
end note
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:return CommandExecutionResult.ok();;
stop
end
start
note right
constructor AreClose()
end note
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:return CommandExecutionResult.ok();;
stop
end
start
note right
constructor InColor()
end note
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:return CommandExecutionResult.ok();;
stop
end
@enduml

