@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexLeaf("COMPLEMENT"+suffix,"(?:at|with|after|"+
"(\\d+)[%s]+(working[%s]+)?(day|week)s?"+
"(?:[%s]+and[%s]+(\\d+)[%s]+(working[%s]+
)?(day|week)s?)?"+"[%s]+(before|after))[%s]+
\\[([^\\[\\]]+?)\\].?s[%s]+(start|end)");;
stop
end
start
note right
Failable<TaskInstant>getMe(GanttDiagramsystem,RegexResultarg,Stringsuffix)
end note
if (task==null ) then (yes) 
:return Failable.error("No such task "+code);;
stop
endif 
if (nb1!=null ) then (yes) 
if (nb2!=null ) then (yes) 
:days2=Integer.parseInt(nb2)*factor2;
endif 
if (String.valueOf("before").equalsIgnoreCase(arg.get("COMPLEMENT"+suffix,POS_BEFORE_OR_AFTER))) then (yes) 
:delta=-delta;
endif 
:result=result.withDelta(delta,mode,system.getDefaultPlan());
endif 
:return Failable.ok(result);;
stop
end
@enduml

