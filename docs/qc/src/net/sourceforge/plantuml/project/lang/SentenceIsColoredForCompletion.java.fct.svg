@startuml
!pragma layout smetana
start
note right
constructor SentenceIsColoredForCompletion()
end note
:super (new SubjectTask(),Verbs.isColoredForCompletion(),
new ComplementInColorsFromTo());
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:task.setColors(colors);
:return CommandExecutionResult.ok();;
stop
end
@enduml

