@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexLeaf("COMPLEMENT"+suffix,
"from[%s]+\\[([^\\[\\]]+)\\][%s]+to[%s]+\\[([^\\[\\]]+)\\]");;
stop
end
start
note right
Failable<TwoNames>getMe(GanttDiagramsystem,
RegexResultarg,Stringsuffix)
end note
:return Failable.ok(new TwoNames(name1,name2));;
stop
end
@enduml

