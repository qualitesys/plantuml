@startuml
!pragma layout smetana
start
note right
IRegextoRegex()
end note
:return new RegexLeaf("SUBJECT","separator");;
stop
end
start
note right
Failable<GanttDiagram>getMe(GanttDiagramproject,
RegexResultarg)
end note
:return Failable.ok(project);;
stop
end
start
note right
Collection<?  extends SentenceSimple>getSentences()
end note
:return Arrays.asList(new JustBefore(),new JustAfter(),
new Just());;
stop
end
start
note right
constructor JustBefore()
end note
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:return CommandExecutionResult.ok();;
stop
end
start
note right
constructor JustAfter()
end note
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:return CommandExecutionResult.ok();;
stop
end
start
note right
constructor Just()
end note
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:return CommandExecutionResult.ok();;
stop
end
@enduml

