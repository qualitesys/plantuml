@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexConcat(new RegexLeaf("COMPLEMENT"+
suffix,"("+UrlBuilder.getRegexp()+")"));;
stop
end
start
note right
Failable<Url>getMe(GanttDiagramdiagram,RegexResultarg,Stringsuffix)
end note
:return Failable.ok(url);;
stop
end
@enduml

