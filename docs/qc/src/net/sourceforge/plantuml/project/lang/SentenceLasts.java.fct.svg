@startuml
!pragma layout smetana
start
note right
constructor SentenceLasts()
end note
:super (new SubjectTask(),Verbs.lasts(),new ComplementSeveralDays());
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,
Objectsubject,Objectcomplement)
end note
:task.setLoad(duration);
:return CommandExecutionResult.ok();;
stop
end
@enduml

