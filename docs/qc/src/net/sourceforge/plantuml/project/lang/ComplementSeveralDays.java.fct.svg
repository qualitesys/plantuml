@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexConcat(new RegexLeaf("COMPLEMENT"+suffix,
"(\\d+)[%s]+(day|week)s?"+"(?:[%s]+and[%s]+(\\d+)[%s]+(day|week)s?)?"));;
stop
end
start
note right
Failable<Load>getMe(GanttDiagramsystem,RegexResultarg,
Stringsuffix)
end note
if (nb2!=null ) then (yes) 
:days2=Integer.parseInt(nb2)*factor2;
endif 
:return Failable.ok(Load.inWinks(days1+days2));;
stop
end
@enduml

