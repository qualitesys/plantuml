.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="201" x2="201" y1="229.1719" y2="259.3047"/><polygon fill="#181818" points="197,249.3047,201,259.3047,205,249.3047,201,253.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="201" x2="201" y1="385.6758" y2="405.6758"/><polygon fill="#181818" points="197,395.6758,201,405.6758,205,395.6758,201,399.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="201" x2="201" y1="439.6445" y2="459.6445"/><polygon fill="#181818" points="197,449.6445,201,459.6445,205,449.6445,201,453.6445" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7cfbea9772c1dd037eb46f006c07c005]
@startuml
!pragma layout smetana
start
note right
IRegextoRegex(Stringsuffix)
end note
:return new RegexConcat(new RegexLeaf("COMPLEMENT"+
suffix,"(\\d+)[%s]+(day|week)s?"+"(?:[%s]+
and[%s]+(\\d+)[%s]+(day|week)s?)?"));;
stop
end
start
note right
Failable<Load>getMe(GanttDiagramsystem,RegexResultarg,
Stringsuffix)
end note
if (nb2!=null ) then (yes) 
:days2=Integer.parseInt(nb2)*factor2;
endif 
:return Failable.ok(Load.inWinks(days1+days2));;
stop
end
@enduml

