@startuml
!pragma layout smetana
start
note right
constructor SentenceHappens()
end note
:super (new SubjectTask(),Verbs.happens(),
new ComplementBeforeOrAfterOrAtTaskStartOrEnd());
end
start
note right
CommandExecutionResultexecute(GanttDiagramproject,Objectsubject,Objectcomplement)
end note
:task.setLoad(Load.inWinks(1));
:task.setStart(when.getInstantTheorical());
:task.setDiamond(true);
:return CommandExecutionResult.ok();;
stop
end
@enduml

