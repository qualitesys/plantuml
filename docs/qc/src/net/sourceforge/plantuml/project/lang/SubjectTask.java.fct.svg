end note
:return new RegexConcat(new RegexLeaf("THEN","(then[%s]+
)?"),new RegexLeaf("SUBJECT","\\[([^\\[\\]]+
?)\\](?:[%s]+as[%s]+\\[([^\\[\\]]+?)\\])?"),new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),new RegexLeaf("on"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("RESOURCE","((?:\\{[^{}]+
