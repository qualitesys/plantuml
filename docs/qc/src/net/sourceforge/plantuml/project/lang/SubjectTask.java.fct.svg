@startuml
!pragma layout smetana
start
note right
Failable<Task>getMe(GanttDiagramproject,RegexResultarg)
end note
if (result==null ) then (yes) 
:throw new IllegalStateException();;
endif 
if (resource!=null ) then (yes) 
if (part.length()>0) then (yes) 
if (ok==false) then (yes) 
:return Failable.error("Bad argument for resource");;
stop
endif 
endif 
endif 
:return Failable.ok(result);;
stop
end
start
note right
Collection<?  extends SentenceSimple>getSentences()
end note
:return Arrays.asList(new SentenceLasts(),
new SentenceTaskStarts(),new SentenceTaskStartsWithColor(),
new SentenceTaskStartsAbsolute(),new SentenceHappens(),
new SentenceHappensDate(),new SentenceEnds(),
new SentenceTaskEndsAbsolute(),new SentenceIsColored(),
new SentenceIsColoredForCompletion(),new SentenceIsDeleted(),
new SentenceIsForTask(),new SentenceLinksTo(),
new SentenceOccurs(),new SentenceDisplayOnSameRowAs(),
new SentencePausesDate(),new SentencePausesDates(),
new SentencePausesDayOfWeek());;
stop
end
start
note right
IRegextoRegex()
end note
:return new RegexConcat(new RegexLeaf("THEN","(then[%s]+
)?"),new RegexLeaf("SUBJECT","\\[([^\\[\\]]+
?)\\](?:[%s]+as[%s]+\\[([^\\[\\]]+?)\\])?"),
new RegexOptional(new RegexConcat(RegexLeaf.spaceOneOrMore(),
new RegexLeaf("on"),RegexLeaf.spaceOneOrMore(),new RegexLeaf("RESOURCE","((?:\\{[^{}]+
\\}[%s]*)+)"))));;
stop
end
@enduml

