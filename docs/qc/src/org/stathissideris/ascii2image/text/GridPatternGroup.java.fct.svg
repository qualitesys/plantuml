@startuml
!pragma layout smetana
start
note right
booleanareAllMatchedBy(TextGridgrid)
end note
while (it.hasNext())
if (!pattern.isMatchedBy(grid)) then (yes) 
:return false;;
stop
endif 
endwhile
:return true;;
stop
end
start
note right
booleanisAnyMatchedBy(TextGridgrid)
end note
while (it.hasNext())
if (pattern.isMatchedBy(grid)) then (yes) 
:return true;;
stop
endif 
endwhile
:return false;;
stop
end
start
note right
void add(GridPattern... patterns)
end note
end
@enduml

