@startuml
!pragma layout smetana
start
note right
constructor ShapePoint()
end note
:super ();
end
start
note right
constructor ShapePoint(floatx,floaty)
end note
:super (x,y);
:this.type=TYPE_NORMAL;
end
start
note right
constructor ShapePoint(floatx,floaty,inttype)
end note
:super (x,y);
:this.type=type;
end
start
note right
constructor ShapePoint(ShapePointother)
end note
:this(other.x,other.y,other.type);
end
start
note right
intgetType()
end note
:return type;;
stop
end
start
note right
void setType(inti)
end note
:type=i;
end
start
note right
booleanisInLineWith(ShapePointpoint)
end note
if (this.x==point.x) then (yes) 
:return true;;
stop
endif 
if (this.y==point.y) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleanisWithinEdge(ShapeEdgeedge)
end note
if (edge.isHorizontal()) then (yes) 
if (x>=edge.getStartPoint().x&&x<=edge.getEndPoint()
.x) then (yes) 
:return true;;
stop
endif 
if (x>=edge.getEndPoint().x&&x<=edge.getStartPoint()
.x) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
endif 
:throw new RuntimeException("Cannot calculate is ShapePoint is within sloped edge");;
end
start
note right
booleanisNorthOf(ShapePointpoint)
end note
:return (this.y<point.y);;
stop
end
start
note right
booleanisSouthOf(ShapePointpoint)
end note
:return (this.y>point.y);;
stop
end
start
note right
booleanisWestOf(ShapePointpoint)
end note
:return (this.x<point.x);;
stop
end
start
note right
booleanisEastOf(ShapePointpoint)
end note
:return (this.x>point.x);;
stop
end
start
note right
StringtoString()
end note
:return "("+x+", "+y+")";;
stop
end
start
note right
void assign(ShapePointpoint)
end note
:this.x=point.x;
:this.y=point.y;
end
start
note right
void moveTo(ShapePointpoint)
end note
if (locked) then (yes) 
:return ;;
stop
endif 
:this.x=point.x;
:this.y=point.y;
end
start
note right
booleanisLocked()
end note
:return locked;;
stop
end
start
note right
void setLocked(booleanb)
end note
:locked=b;
end
@enduml

