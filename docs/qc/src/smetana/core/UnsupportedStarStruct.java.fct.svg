@startuml
!pragma layout smetana
start
note right
constructor UnsupportedStarStruct()
end note
:this.UID=CPT.incrementAndGet();
end
start
note right
__ptr__unsupported()
end note
:throw new UnsupportedOperationException(getClass().toString());;
end
start
note right
booleanisSameThan(__ptr__other)
end note
:throw new UnsupportedOperationException(getClass().toString());;
end
start
note right
__ptr__castTo(Classdest)
end note
:System.err.println("I am "+toString()+" "+
UID);
:throw new UnsupportedOperationException(dest+
" "+getClass().toString());;
end
start
note right
ObjectgetTheField(OFFSETvirtualBytes)
end note
:throw new UnsupportedOperationException(getClass().toString());;
end
start
note right
__struct__copy()
end note
:throw new UnsupportedOperationException(getClass().toString());;
end
start
note right
void ___(__struct__other)
end note
:throw new UnsupportedOperationException(getClass().toString());;
end
@enduml

